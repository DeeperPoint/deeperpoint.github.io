      strategic_logic: "Angel investors who use the platform to find investment opportunities have a persistent problem: deal flow triage, due diligence coordination, and co-investor syndication for deals they want to pursue but cannot fully fund individually. The platform already has the investor profile, the investment thesis, and the verified startup pipeline. A deal flow intelligence subscription and co-investment syndication facilitation converts the matching platform into an ongoing financial services relationship worth 50-100x the per-match fee."
      recurring: true

