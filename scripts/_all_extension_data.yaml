additions:

  # ── CANADA-MEXICO TRADE ────────────────────────────────────────────

  - slug: cm-pulse-crops
    opp:
      title: "Pulse Crop Input Supply and Cross-Border Transportation Extension"
      type: logistics-extension
      revenue_model: "Certified seed and crop protection product distribution margin (10-18%); northbound and southbound transportation coordination fee per load; IP storage booking fee; platform captures a supply chain margin on every verified bilateral crop transaction it matches"
      strategic_logic: "A bilateral pulse crop matching platform accumulates pre-harvest purchase commitments that reveal exactly which producers are growing which varieties, in what volumes, and where. This demand intelligence is the operational basis for a consolidated input supply and logistics business. Platform-verified producers are the qualified buyer channel for certified seed and crop inputs; the matched buyer relationship is the forward contract that anchors cross-border transportation logistics."
      recurring: true

  - slug: cm-specialty-lumber
    opp:
      title: "Lumber Grading, Certification and Cross-Border Logistics Consolidation"
      type: logistics-extension
      revenue_model: "Grading and certification service fee per shipment; container consolidation fee aggregating small seller volumes into full container loads; customs brokerage service subscription for platform participants; platform earns a logistics margin on every cross-border lumber transaction it matches"
      strategic_logic: "The specialty lumber matching platform knows each seller's species, grade, volume, and delivery timeline. Small Canadian specialty lumber sellers who individually cannot fill a container can be aggregated by the platform into consolidated loads, reducing per-unit freight cost and making previously uneconomic transactions viable. The logistics coordination extension monetizes the shipment data the matching transaction already generates."
      recurring: true

  - slug: cm-greenhouse-tech
    opp:
      title: "Greenhouse Equipment Leasing and Ongoing Maintenance Subscription"
      type: equipment-finance
      revenue_model: "Equipment lease payment income (monthly); end-of-term purchase option fee; annual maintenance subscription per installed unit; spare parts supply margin; platform earns recurring revenue from equipment relationships initiated by the technology transfer match"
      strategic_logic: "Mexican agricultural producers who adopt Canadian greenhouse technology through the matching platform need financing for equipment that costs $50K-$500K, far above what rural Mexican bank credit lines typically cover. The verified technology transfer agreement is the credit basis; the equipment is the collateral; the crop revenue is the repayment source. An equipment leasing fund co-investing with the platform operator accesses a rapidly growing Mexican controlled-environment agriculture market through a deal flow channel that requires verified supplier relationships."
      recurring: true

  - slug: cm-nearshore-software
    opp:
      title: "Software Team Certification and Continuous Training Program Extension"
      type: commerce-extension
      revenue_model: "Technical certification program subscription per matched team (AWS, Azure, Salesforce, Scrum; $200-500/developer/month); code quality and security audit service fee; ongoing team performance data subscription to Canadian client companies; platform earns training margin from every development team it places"
      strategic_logic: "Canadian companies that match with Mexican nearshore development teams have an ongoing certification and skills currency problem: the technology stack evolves, certifications expire, and the Canadian client needs assurance that the team's skills remain current. The platform already has the team profile, the client relationship, and the engagement history. Extending into a managed certification and training program converts a one-time placement into a recurring education revenue stream while creating stickiness that prevents the client-team relationship from bypassing the platform."
      recurring: true

  - slug: cm-medical-equipment
    opp:
      title: "Refurbished Medical Equipment Parts Supply and Maintenance Contracts"
      type: commerce-extension
      revenue_model: "Replacement parts distribution margin (20-35% on refurbishment components); annual maintenance contract per placed unit; remote diagnostic subscription per device; platform earns a multi-year aftermarket revenue stream from every medical equipment transaction it matches"
      strategic_logic: "Medical equipment matched through the platform continues to need maintenance, calibration, and parts for 5-15 years after the initial transaction. The platform has the device profile, the buyer organization, and the seller's technical documentation. Extending into a managed aftermarket service with parts supply and maintenance contracts converts a one-time equipment transaction into a 10-year revenue relationship from the same customer. The aftermarket revenue per matched device substantially exceeds the initial matching fee."
      recurring: true

  - slug: cm-mining-services
    opp:
      title: "Mining Consumables and Safety Equipment Procurement Extension"
      type: logistics-extension
      revenue_model: "Group purchasing margin on aggregated mining consumable orders (explosives, drill bits, PPE, reagents; 8-15%); cross-border logistics coordination fee per shipment; safety equipment certification and inspection service subscription; platform earns a supply chain margin on the operating spend of every mining service firm it matches to a project"
      strategic_logic: "Mining service companies matched to Mexican projects continue to need consumables, replacement parts, and safety equipment throughout the project lifecycle. The platform has the supplier profile, the project location, the service contract details, and the regulatory environment. Aggregating consumable orders across multiple matched service providers unlocks volume pricing that no individual firm can achieve independently."
      recurring: true

  - slug: cm-sustainable-packaging
    opp:
      title: "Circular Packaging Return Logistics and Recycled Material Brokerage"
      type: logistics-extension
      revenue_model: "Return logistics coordination fee per shipment; recycled material brokerage margin (10-15%); extended producer responsibility compliance tracking subscription; platform earns a circular economy logistics margin on every sustainable packaging relationship it establishes"
      strategic_logic: "Sustainable packaging relationships require a return logistics channel where recovered packaging material flows back from Mexico to Canadian recyclers. The platform already has the supplier, the buyer, the return volumes, and the recycling capability profile. Extending into managed return logistics converts a one-way matching business into a circular supply chain operator, with recurring revenue from both the outbound supply and the inbound return on every matched relationship."
      recurring: true

  - slug: cm-skilled-trades
    opp:
      title: "Cross-Border Tradesperson Accommodation and Logistics Bundle"
      type: commerce-extension
      revenue_model: "Accommodation booking margin for temporary worker housing near project sites (8-12%); tool and equipment rental fee per placed worker; ongoing certification maintenance program subscription; platform earns a worker logistics margin from every cross-border placement it facilitates"
      strategic_logic: "Skilled tradespeople placed on Canadian work assignments need accommodation near the project site, tool and equipment logistics, and ongoing certification maintenance. The platform has unique positioning to provide all three because it knows the placement location, the trade specialty, and the contract duration. Bundling accommodation booking and equipment logistics with the placement service creates a higher-value transaction and a stickier platform relationship than a standalone placement fee."
      recurring: true

  - slug: cm-tech-transfer
    opp:
      title: "Technology Licensing Administration and Royalty Management Extension"
      type: commerce-extension
      revenue_model: "Licensing administration subscription (royalty tracking, compliance monitoring, payment processing; 1-2% of royalty stream); IP enforcement advisory retainer; technology update and upgrade facilitation fee; platform earns an ongoing margin on every technology licensing relationship it initiates"
      strategic_logic: "Technology transfer agreements between Canadian and Mexican companies generate royalty streams that must be tracked, reported, and enforced over multi-year periods. The platform already has the licensing terms, the technology profile, and both party relationships. Extending into a licensing administration service converts a one-time match into a recurring administrative revenue stream that lasts the life of the licensing agreement."
      recurring: true

  - slug: cm-probono-legal
    opp:
      title: "Cross-Border Legal Document Standardization and Translation Service"
      type: commerce-extension
      revenue_model: "Standard bilateral contract template license (per use); certified legal translation service fee; compliance monitoring subscription for ongoing bilateral agreements; platform earns a document services margin from every pro bono legal connection it converts to a commercial advisory relationship"
      strategic_logic: "Legal advisory connections made through the platform generate a downstream need for standardized bilateral contract documentation and certified legal translation, services that recur with every new transaction the advised client undertakes. The platform has the legal advisor's competence profile and the client's transaction history. A legal document services extension converts sporadic advisory referrals into a recurring document services revenue stream anchored on bilateral legal relationships the matching platform established."
      recurring: true

  # ── CANADIAN GOVERNMENT EXPERT NETWORKS ───────────────────────────

  - slug: cgov-northern-infrastructure
    opp:
      title: "Remote Infrastructure Supply Procurement and Logistics Extension"
      type: logistics-extension
      revenue_model: "Group purchasing margin on aggregated project material orders (8-15%); charter and ground logistics coordination fee per project; equipment mobilization and demobilization management fee; platform earns a supply chain margin on every remote infrastructure project it matches specialist expertise to"
      strategic_logic: "Infrastructure projects in Canada's North require a continuous flow of specialized materials, equipment, and supplies transported to remote sites. The platform that matched the specialist team to the project has the project profile, the site location, the supply requirements, and the logistics constraints. Extending into consolidated supply procurement by aggregating material orders from multiple projects onto shared transport runs creates a logistics margin that substantially exceeds the expert matching fee."
      recurring: true

  - slug: cgov-public-health-surge
    opp:
      title: "Emergency Medical Supply Stockpile Management Subscription"
      type: commerce-extension
      revenue_model: "Annual stockpile management subscription per health authority (PPE, pharmaceutical, diagnostic supply monitoring and automated reorder; $50K-200K/year); surge demand early warning data subscription; supply chain resilience audit service; platform converts episodic surge capacity matching into an ongoing supply preparedness revenue stream"
      strategic_logic: "Public health authorities that use the platform during surge events have an ongoing stockpile readiness problem between surges - maintaining appropriate inventory levels, managing expiry rotation, and monitoring supplier capacity. The platform has the supply chain network, the demand profile of each health authority, and the supplier performance data from surge events. A stockpile management subscription converts a surge-activated platform into a year-round public health supply chain service."
      recurring: true

  - slug: cgov-heritage-conservation
    opp:
      title: "Heritage Materials Sourcing and Specialty Trade Tool Supply"
      type: commerce-extension
      revenue_model: "Heritage-appropriate materials distribution margin (lime mortar, traditional brick, heritage glass, salvaged timber; 15-25%); specialty tool rental per heritage project; material provenance certification service; platform earns a materials commerce margin from every heritage conservation project it connects specialist tradespeople to"
      strategic_logic: "Heritage conservation specialists matched through the platform face a persistent problem: sourcing heritage-appropriate materials that are difficult to find through conventional building supply channels. The platform has the specialist's competence profile, the project's heritage requirements, and the client relationship. A heritage materials sourcing service aggregating demand across matched specialists creates a commerce extension that is only possible because the matching network exists."
      recurring: true

  - slug: cgov-indigenous-consultation
    opp:
      title: "Indigenous Procurement Facilitation and Community Benefit Management"
      type: commerce-extension
      revenue_model: "Indigenous subcontract facilitation fee (1-2% of directed indigenous procurement value); community benefit fund administration fee; Indigenous procurement compliance reporting subscription to Crown project sponsors; platform earns a facilitation margin on indigenous economic participation requirements in every project it connects consultation specialists to"
      strategic_logic: "Crown projects that require Indigenous consultation also typically include Indigenous procurement commitments that are difficult to operationalize without a verified directory of qualified Indigenous suppliers. The platform already has trusted relationships with affected communities. Extending into Indigenous procurement facilitation converts the consultation relationship into an economic participation infrastructure that both communities and Crown project sponsors need."
      recurring: true

  - slug: cgov-environmental-assessment
    opp:
      title: "Ongoing Environmental Monitoring Data Service"
      type: commerce-extension
      revenue_model: "Annual monitoring data subscription per project (continuous environmental condition reporting; $20K-80K/year); regulatory threshold alert service; cumulative effects data aggregation subscription for regional environmental monitoring programs; platform earns ongoing data revenue from sites where it originally matched assessment specialists"
      strategic_logic: "Environmental assessments generate baseline monitoring commitments that must be maintained for years after approval. The platform already has the assessment specialist profile, the project site data, and the regulatory framework. Extending into a managed ongoing monitoring service converts a one-time assessment matching fee into a 5-20 year data services relationship with the same project proponent."
      recurring: true

  - slug: cgov-regulatory-science
    opp:
      title: "Regulatory Science Data Subscription and Compliance Intelligence"
      type: commerce-extension
      revenue_model: "Annual regulatory intelligence subscription per firm (current regulatory science standards, recent precedent cases, upcoming review schedules; $15K-60K/year); expert advisory retainer facilitation; regulatory submission quality review service; platform earns a data and advisory margin from every regulatory science relationship it initiates"
      strategic_logic: "Firms that use the platform to find regulatory science expert advisors have an ongoing regulatory intelligence problem as Health Canada and EFSA standards shift. The platform has the expert competence profile, the regulatory domain, and the client's product pipeline context. A regulatory intelligence subscription service creates a recurring data revenue stream from the same client who initiated the expert matching relationship."
      recurring: true

  - slug: cgov-critical-infrastructure-cyber
    opp:
      title: "Continuous Cybersecurity Monitoring and Incident Response Subscription"
      type: commerce-extension
      revenue_model: "Annual monitoring subscription per critical infrastructure operator (network anomaly detection, threat intelligence feed, regulatory compliance reporting; $100K-500K/year); incident response retainer with guaranteed SLA; annual tabletop exercise facilitation fee; platform earns ongoing security services revenue from every operator-specialist relationship it matches"
      strategic_logic: "Critical infrastructure operators who engage cybersecurity specialists through the platform for assessment projects have an ongoing monitoring and response gap. The platform already matched the right operator to the right specialist and established trust. Extending into a managed security services subscription powered by the same specialist network converts a project-based engagement into an annual recurring revenue relationship at 10-50x the original matching fee value."
      recurring: true

  - slug: cgov-forensic-accounting
    opp:
      title: "Ongoing Anti-Fraud Monitoring and Internal Audit Subscription"
      type: commerce-extension
      revenue_model: "Annual fraud monitoring subscription per government entity (anomaly detection in procurement and expense data; $30K-150K/year); whistleblower intake management service; ongoing internal audit support retainer; platform earns a monitoring services margin from every forensic accounting engagement it initiates"
      strategic_logic: "Government entities that engage forensic accounting specialists for investigation projects have an ongoing prevention need - embedding the detection capability into a continuous monitoring system. The platform has the specialist's forensic profile and the client entity's procurement context. Converting a reactive investigation engagement into a proactive ongoing monitoring subscription creates recurring revenue from the same government client."
      recurring: true

  - slug: cgov-immigration-tribunal
    opp:
      title: "Immigration Legal Document Preparation and Translation Services"
      type: commerce-extension
      revenue_model: "Standard immigration document preparation fee per case; certified translation service fee (IRB-compliant); document filing and tracking subscription; platform earns a document services margin from every tribunal representation connection it facilitates"
      strategic_logic: "Immigration tribunal representation cases generate a sustained document production need: evidence packages, certified translations, procedural correspondence, and filing submissions. The platform already matched the legal representative to the client and has the case profile. A managed document preparation and translation service captures ongoing revenue from every case the matching platform initiated, at a margin that complements the representation fee without competing with the specialist."
      recurring: true

  - slug: cgov-municipal-climate-adaptation
    opp:
      title: "Climate Adaptation Materials Procurement and Grant Tracking Extension"
      type: commerce-extension
      revenue_model: "Materials procurement facilitation margin for climate adaptation projects (permeable paving, green infrastructure, stormwater systems; 8-12%); climate grant tracking and application coordination subscription ($10K-40K/year per municipality); carbon accounting data service; platform earns procurement and grant management margins from every climate adaptation project it connects specialists to"
      strategic_logic: "Municipal climate adaptation projects matched through the platform have two immediate follow-on needs: sourcing the specialized materials the assessment recommended, and tracking the federal and provincial grant programs that fund implementation. The platform has the project scope, the municipality's profile, and the specialist's recommendations. A materials procurement facilitation service and a grant tracking subscription convert the one-time specialist matching into an ongoing implementation support revenue stream."
      recurring: true

  # ── CANADIAN SPORT ─────────────────────────────────────────────────

  - slug: csport-equipment-resale
    opp:
      title: "Sport Equipment Consumables Supply and Group Purchasing Extension"
      type: commerce-extension
      revenue_model: "Group purchasing margin on sport consumables (tape, strings, blades, protective pads; 12-20% vs. individual retail); equipment maintenance supply subscription per club; new equipment group purchase coordination fee; platform earns a recurring supply margin from the same club and athlete network it serves for equipment resale"
      strategic_logic: "Sport clubs and athletes who use the equipment resale platform to buy and sell major equipment have an ongoing need for consumable supplies that wear out and must be replaced regularly. The platform already has the sport type, the participant age group, the club equipment profile, and the seasonal demand pattern. Aggregating consumable orders across the resale network unlocks group purchasing pricing while the platform earns a distribution margin from the same customer base at zero incremental acquisition cost."
      recurring: true

  - slug: csport-tourism-hosting
    opp:
      title: "Sport Tourism Full-Package Booking and Experience Management"
      type: commerce-extension
      revenue_model: "Accommodation booking commission (8-12%); transportation coordination fee per group; equipment rental at destination; local experience package margin; platform earns a full travel commerce margin from every sport tourism hosting match it facilitates"
      strategic_logic: "Visiting sport teams and tournament participants who find host facilities through the platform need accommodation, ground transportation, equipment logistics, and local experience packages. The platform already has the team size, the sport type, the event dates, and the destination. A full-trip booking extension converts a one-time facility matching fee into a $15,000-50,000 travel package commission from the same visiting organization, making the sport tourism platform dramatically more attractive to investors."
      recurring: false

  - slug: csport-event-sponsorship
    opp:
      title: "Sport Event Production Services Marketplace Extension"
      type: commerce-extension
      revenue_model: "Event production services coordination margin (AV, staging, timing systems, volunteer coordination software, results publishing; 10-15%); event insurance facilitation fee; post-event analytics subscription for sponsoring brands; platform earns a production services margin from every sponsorship match it facilitates"
      strategic_logic: "Sport events that secure sponsors through the platform immediately need a suite of production services that are currently sourced through the same fragmented channels as the sponsorship itself. The platform already has the event profile, the sport type, the expected attendance, and the sponsoring brand relationship. A managed event production services marketplace converts a sponsorship matching fee into a full production services commission from the same event organizer."
      recurring: false

  - slug: csport-broadcasting-rights
    opp:
      title: "Sport Content Distribution and Digital Streaming Platform Extension"
      type: commerce-extension
      revenue_model: "Digital streaming subscription revenue share (platform takes 20-30% of broadcaster subscription revenue); content archive subscription per federation; highlights licensing fee per buyer; advertising inventory management fee for platform-hosted content; platform earns content distribution revenue from every broadcasting right it matches"
      strategic_logic: "A sport broadcasting rights matching platform accumulates a library of verified content rights relationships across dozens of sport federations. Once the platform has matched rights sellers to buyers for one cycle, it has the content profiles, the federation relationships, and the audience data to extend into a managed streaming distribution service. Moving from 2-3% matching fee on rights transactions to 20-30% of streaming subscription revenue on the same content is the natural extension of the rights matching infrastructure."
      recurring: true

  - slug: csport-science-consulting
    opp:
      title: "Athlete Performance Monitoring Technology Supply and Data Subscription"
      type: commerce-extension
      revenue_model: "Wearable and sensor technology distribution margin (GPS vests, force plates, lactate analyzers; 15-25%); performance data platform subscription per team ($500-2,000/month); benchmark data subscription comparing performance across the platform's athlete network; platform earns technology and data revenue from every performance science consulting relationship it matches"
      strategic_logic: "Sport science consultants matched through the platform recommend monitoring technologies whose ongoing supply and data management creates a recurring commerce extension. The platform has the sport type, the performance metric needs, the consultant recommendation, and the team budget profile. Becoming the procurement channel for recommended monitoring technology and the ongoing data aggregation platform converts a consulting referral fee into a multi-year technology and data services relationship."
      recurring: true

  - slug: csport-psychology-services
    opp:
      title: "Athlete Mental Performance Resource Subscription"
      type: commerce-extension
      revenue_model: "Mental performance resource library subscription per athlete or team (guided meditation, visualization programs, stress monitoring tools; $30-80/month); group workshop facilitation fee; crisis support line subscription per sport organization; platform earns recurring mental health resource revenue from every psychology consulting match it initiates"
      strategic_logic: "Athletes matched with sport psychology consultants have ongoing mental performance maintenance needs between formal sessions. The platform has the athlete profile, the sport type, the performance challenge context, and the consultant relationship. A digital mental performance resource library creates recurring subscription revenue from athletes who cannot afford a full ongoing consultant relationship but need more than one-off sessions."
      recurring: true

  - slug: csport-coach-placement
    opp:
      title: "Coach Certification and Continuing Professional Development Extension"
      type: commerce-extension
      revenue_model: "Certification program enrollment fee (NCCP, sport-specific technical certifications; $200-1,500 per certification); annual continuing professional development subscription; coaching analytics tool subscription; platform earns education commerce revenue from every coach it places"
      strategic_logic: "Coaches placed through the platform need ongoing certification maintenance and professional development to remain competitive for future placements. The platform has the coach's competence profile, sport specialty, and career trajectory data to make highly personalized development recommendations. Extending into certification program facilitation converts a one-time placement fee into a recurring education relationship that lasts the coach's career."
      recurring: true

  - slug: csport-disability-adaptive
    opp:
      title: "Adaptive Sport Equipment Supply and Distribution Extension"
      type: commerce-extension
      revenue_model: "Adaptive sport equipment distribution margin (hand cycles, sport wheelchairs, bocce, goalball equipment; 15-25%); equipment modification service referral fee; group purchase coordination for adaptive sport programs; platform earns an equipment commerce margin from every adaptive sport participant match it facilitates"
      strategic_logic: "Athletes and programs matched through the adaptive sport platform have an ongoing adaptive equipment procurement need that is currently served by a fragmented market of specialized suppliers with no community intelligence layer. The platform has the disability type, the sport, the performance level, and the program's equipment needs. Extending into a curated adaptive sport equipment supply service creates a commerce extension that is only possible because the community matching infrastructure exists."
      recurring: true

  - slug: csport-indigenous-sponsorship
    opp:
      title: "Indigenous Sport Cultural Merchandise and Community Economic Extension"
      type: commerce-extension
      revenue_model: "Indigenous cultural product sales margin (sport merchandise, cultural goods, traditional arts produced by community; 15-20%); community economic benefit tracking subscription for corporate sponsors; reconciliation brand advisory retainer; platform earns a community commerce margin from every Indigenous sport sponsorship relationship it initiates"
      strategic_logic: "Corporate sponsors of Indigenous sport events have brand needs that extend beyond the event itself - authentic Indigenous cultural merchandise, community economic participation reporting, and ongoing reconciliation brand advisory services. The platform already has the community relationship, the cultural authenticity verification, and the corporate sponsor's brand objectives. Extending into Indigenous cultural merchandise distribution converts the sponsorship matching relationship into a community economic participation infrastructure."
      recurring: true

  - slug: csport-facility-sharing
    opp:
      title: "Facility Operations Supply Procurement and Maintenance Extension"
      type: logistics-extension
      revenue_model: "Group purchasing margin on facility consumable supply orders (cleaning supplies, court surface materials, safety equipment; 10-18%); scheduling optimization software subscription; facility maintenance vendor matching extension; platform earns a supply and services margin from every shared facility it optimizes"
      strategic_logic: "Shared sport facilities that are optimally scheduled through the platform have continuous supply needs purchased through fragmented retail channels by individual facility managers with no collective purchasing power. The scheduling platform already knows which facilities are running which activities on which schedules, generating a granular demand profile for supply consumption. Aggregating supply procurement across the facility network unlocks volume pricing while the platform earns a distribution margin from the same facility operators it serves for scheduling."
      recurring: true

  - slug: csport-youth-recruitment
    opp:
      title: "Athlete Development Pathway Subscription and Bursary Facilitation"
      type: financial-product
      revenue_model: "Annual athlete development subscription (training program tracking, coach matching, competition calendar, bursary application management; $150-400/year per athlete family); sport bursary facilitation fee for matching athletes to NSO, PSO, and private foundation programs; talent identification data subscription for sport organizations; platform earns recurring development and facilitation revenue from every youth athlete it identifies"
      strategic_logic: "Youth athletes identified through the recruitment platform have multi-year development journeys requiring ongoing program tracking, coach matching, competition coordination, and bursary access - all currently managed through fragmented informal channels. The platform has the athlete profile, the sport potential assessment, and the development community relationships. A development pathway subscription converts a one-time identification match into a 5-10 year recurring relationship with the athlete family."
      recurring: true

  # ── CANADIAN STARTUP ECOSYSTEM ─────────────────────────────────────

  - slug: cstartup-angel-discovery
    opp:
      title: "Angel Deal Flow Intelligence Subscription and Co-Investment Syndication"
