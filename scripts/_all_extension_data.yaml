      strategic_logic: "Startups matched with small-batch manufacturers have a continuous materials sourcing problem - specialty components at small quantities with long lead times. The platform already has the startup's product specification, the manufacturer's capability profile, and the bill of materials. Extending into a managed materials sourcing service aggregating small orders from multiple startup clients to meet minimum order quantities converts a manufacturing match into an ongoing supply chain relationship."
