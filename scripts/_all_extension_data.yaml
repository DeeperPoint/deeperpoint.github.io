      strategic_logic: "Founders matched with mentors have ongoing learning needs beyond the scheduled sessions. The platform has the founder's stage, sector, and learning objective profile. A content library subscription and facilitated peer learning groups convert the mentorship relationship into an always-on learning subscription that generates recurring revenue between one-on-one sessions."
      recurring: true

