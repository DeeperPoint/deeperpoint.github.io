      strategic_logic: "Cofounder pairs matched through the platform immediately face legal documentation needs that most first-time founders handle badly or not at all. The platform has both founders' profiles, the equity negotiation context, and the company concept. A managed startup documentation service with standardized cofounder agreements and a cap table management tool converts a one-time matching event into an ongoing company formation services relationship. Founders who use the platform's legal tools stay in its ecosystem through fundraising and beyond."
