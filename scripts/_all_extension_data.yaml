      strategic_logic: "Indigenous entrepreneurs matched with business mentors and capital through the platform face a procurement access problem - federal and provincial Indigenous procurement set-asides require IBD certification and active market participation. The platform has the entrepreneur's business profile, sector, and capability. Extending into IBD certification facilitation and active procurement opportunity matching converts a mentorship platform into a sustainable government procurement revenue channel for Indigenous entrepreneurs."
      recurring: true

  - slug: cstartup-pilot-customer
    opp:
      title: "Pilot Program Management and Customer Success Services Extension"
      type: commerce-extension
      revenue_model: "Pilot program management subscription per matched pair (implementation tracking, milestone reporting, outcome documentation; $500-2,000/month during pilot); post-pilot case study production service; pilot outcome data subscription to investors and procurement officers evaluating similar startups; platform earns a program management margin from every pilot customer match it facilitates"
