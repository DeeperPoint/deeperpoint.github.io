additions:

  - slug: chc-caregiver-respite-matching
    opp:
      title: "Caregiver Support Product Supply and Relief Scheduling Platform Extension"
      type: commerce-extension
      revenue_model: "Caregiver support product distribution margin (ergonomic aids, home monitoring equipment, adaptive home accessories; 15-22%); ongoing relief scheduling subscription per caregiver-patient pair ($30-80/month); caregiver wellbeing program subscription; platform earns product commerce and scheduling software revenue from every caregiver-respite match it facilitates"
      strategic_logic: "Caregivers matched with respite services through the platform have ongoing supply needs - ergonomic aids, monitoring equipment, and adaptive home accessories that reduce caregiver injury and improve care quality. The platform has the care situation profile, the patient's condition, and the caregiver's physical and emotional stress context. Extending into a caregiver support product supply service and a recurring relief scheduling subscription converts a one-time respite match into a multi-year caregiver support relationship."
      recurring: true

  - slug: chc-home-dialysis-peer-support
    opp:
      title: "Home Dialysis Consumables Subscription and Equipment Support Extension"
      type: commerce-extension
      revenue_model: "Monthly dialysis consumables subscription per patient (tubing sets, dialysate, sterile supplies, test strips; $300-600/month for peritoneal dialysis); home dialysis equipment maintenance coordination fee; provincial OHIP+ supplies coordination service; platform earns recurring consumables commerce revenue from every home dialysis patient it connects to peer support"
      strategic_logic: "Home dialysis patients connected through the platform require a continuous and reliable supply of consumables - dialysate, tubing sets, and sterile supplies - on a predictable monthly schedule. The platform has the dialysis modality, the patient's supply requirements, and the provincial coverage profile. A consumables subscription service aggregating orders from matched home dialysis patients creates recurring commerce revenue from the same patients the peer support matching platform acquired, while improving supply chain reliability for a clinically critical patient population."
      recurring: true

  - slug: chc-lymphedema-garment-access
    opp:
      title: "Lymphedema Garment Subscription and Compression Supplies Commerce Extension"
      type: commerce-extension
      revenue_model: "Compression garment and bandaging supply subscription per patient (flat-knit and circular-knit garments, bandaging materials, skin care products; $150-400/month); provincial ADP coverage coordination service; custom garment fitting and reorder coordination fee; platform earns recurring garment and supply commerce revenue from every lymphedema patient it connects to peer support and garment access"
      strategic_logic: "Lymphedema patients connected through the platform require ongoing compression garments - custom and off-the-shelf flat-knit and circular-knit garments, bandaging supplies, and skin care products - that must be replaced every 3-6 months. The platform has the lymphedema staging, the garment specifications, and the provincial coverage profile. A garment subscription service aggregating orders across matched patients for group pricing and coordinating provincial ADP reimbursement converts a one-time peer matching event into a multi-year supply relationship."
      recurring: true

  - slug: chc-ostomy-peer-navigator
    opp:
      title: "Ostomy Supplies Subscription and Group Purchasing Commerce Extension"
      type: commerce-extension
      revenue_model: "Monthly ostomy supplies subscription per patient (pouching systems, skin barriers, accessories, irrigation supplies; $150-300/month); provincial Assistive Devices Program reimbursement coordination service; group purchasing margin on aggregated ostomy supply orders (10-18%); platform earns recurring consumables commerce revenue from every ostomy patient it connects to peer navigation"
      strategic_logic: "Ostomy patients connected through the platform require monthly consumable supplies - pouching systems, skin barriers, and accessories - on a predictable and ongoing basis. The platform has the ostomy type, the specific product requirements, and the provincial coverage profile for each patient. A monthly supply subscription service aggregating orders across the matched patient community unlocks group pricing while the platform earns a distribution margin from the same patients the peer navigator matching acquired, at zero incremental acquisition cost."
      recurring: true

  - slug: chc-rare-disease-patient-navigator
    opp:
      title: "Rare Disease Therapy Access Coordination and Compassionate Use Navigation"
      type: commerce-extension
      revenue_model: "Therapy access coordination subscription per patient (compassionate use application management, special access program navigation, provincial coverage appeal; $200-500/month); rare disease clinical trial matching fee; genetic testing coordination service; platform earns ongoing coordination services revenue from every rare disease patient it connects to a navigator"
      strategic_logic: "Rare disease patients connected with navigators through the platform face a multi-year journey: securing compassionate use access, navigating special access programs, appealing provincial formulary decisions, and qualifying for clinical trials. The platform has the disease profile, the navigator's expertise, and the therapy access landscape. Extending into a managed therapy access coordination subscription converts a one-time navigator matching event into an ongoing coordination relationship that lasts until the patient achieves stable therapy access - typically 18-36 months of active coordination work."
      recurring: true
