market_example:
  summary: "A novel pathogen outbreak in a low-income country triggers WHO emergency requests for field epidemiologists with specific outbreak investigation experience — cholera, Ebola, mpox — in the implicated geographic region. The human network that connects trained investigators to active outbreak response takes weeks to activate at the moment hours matter."
  problem: "Outbreak field investigation requires epidemiologists who have physically worked in the implicated region, speak or have worked through the local languages, understand the healthcare system structure, and have prior experience with the specific pathogen or pathogen family. The GOARN (Global Outbreak Alert and Response Network) roster, FETP (Field Epidemiology Training Program) alumni networks, and national CDC emergency response rosters collectively contain the right people — distributed across academic institutions, public health agencies, and NGOs in dozens of countries, maintaining their availability status informally or not at all. When an outbreak request goes out, the coordinator makes phone calls through their personal contact list. The investigator who has exactly the right skill set — Lassa fever experience in West Africa, French-language capacity, community engagement protocol experience with pastoralist populations — is findable but not discoverable: their name does not surface in a mobilization call until someone who knows them personally thinks to suggest them. The response is delayed by the time it takes to traverse the human network rather than a structured availability system."
  dominant_forces:
    - "Participant scarcity — field epidemiologists with pathogen-specific and region-specific experience are a small population even within the global public health workforce; the intersection of Ebola experience and Central African health system familiarity may describe fewer than 100 active practitioners globally"
    - "Availability opacity — outbreak response participation requires institutional release from primary employer; an investigator's availability is known only to themselves and their institution, and changes week by week"
    - "Temporal urgency — outbreak investigation delay correlates directly with case counts; a week of delayed field deployment corresponds to measurable epidemic amplification in a high R0 outbreak"
    - "Trust and credential verification — outbreak response organizations deploying to active outbreaks must verify field experience, vaccination status, and institutional affiliation before deployment; informal network referrals bypass this verification"
    - "Offering complexity — the right investigator match requires alignment on pathogen experience, regional familiarity, language capacity, institutional availability for deployment duration, and specific outbreak investigation competency (case-control study design, contact tracing management, surveillance system setup)"
  deeperpoint_fit: "Semantic matching encodes investigator profiles (pathogen experience by category and specific disease, regional field experience by country and health system tier, language capacity, current institutional affiliation and deployment availability, prior GOARN/FETP/CDC assignment history, specific competency areas, vaccination status) against response coordinator demand signals (pathogen, region, duration, skills required, clearance status, language requirement). Real-time availability status update enables rapid mobilization when the outbreak request goes live."
  economic_upside: "The economic cost of a major epidemic — lost productivity, healthcare system burden, trade disruption — scales exponentially with the delay in effective field response. The 2014–2016 West Africa Ebola epidemic generated estimated GDP losses of $2.2B and $1.6B for Guinea and Sierra Leone respectively, with economic modelling suggesting rapid effective field response in the first six weeks could have reduced final case counts by 60–80%. The global GOARN deployment budget exceeds $50M annually; WHO Health Emergencies Programme operates at $300M+ per year. A platform that accelerates field investigator deployment by one to two weeks in a high-consequence outbreak generates health and economic value orders of magnitude larger than its operating cost."

