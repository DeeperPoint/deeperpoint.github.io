market_example:
  summary: "Provincial sport leagues, national championships in non-major sports, and emerging Canadian sport properties cannot efficiently find digital platforms and regional broadcasters that would license their rights, while platforms seeking niche Canadian sport content have no systematic discovery mechanism."
  problem: "Provincial sport leagues, national championships in non-major sports, and emerging Canadian sport properties — CPL soccer outside major markets, USports championships, Canadian Rugby League, masters competitions, and Indigenous games — produce broadcast-ready content but cannot efficiently find the digital platforms, regional broadcasters, or OTT services that would license their rights. Meanwhile, regional streaming platforms, sports-focused YouTube channels, and niche sport apps need Canadian content with loyal niche audiences but have no mechanism to discover available rights at price points appropriate to their scale. Most rights transactions happen through personal networks in the broadcast industry or not at all."
  dominant_forces:
    - "Opacity — no centralized Canadian sport rights marketplace exists; available rights are discovered primarily through personal networks within the broadcast industry"
    - "Offering complexity — each rights package is unique in sport, competition level, territory, exclusivity, platform category, production format, term, and ancillary rights"
    - "Risk — acquiring sport rights involves upfront or guaranteed fees; smaller platforms cannot absorb risk of paying for content that does not deliver audience"
    - "Temporal distance — rights windows are offered on short notice before a season begins; platform acquisition cycles and budget approvals do not align with rights availability"
    - "Information asymmetry — rights holders know their viewership data; platforms know their subscriber analytics; neither wants to disclose this before some form of mutual commitment"
  deeperpoint_fit: "Semantic matching handles the multidimensional rights-to-platform fit: sport, audience demographic, territory, exclusivity needs, production format, and pricing tier — matched against platform audience profile, content strategy, budget, and existing rights portfolio. The trusted intermediary protocol lets rights holders share audience data confidentially while platforms share acquisition budget without premature disclosure. The Deal Brief captures rights package terms including exclusivity clauses, platform category, analytics reporting obligations, renewal options, and production delivery specifications. KnowledgeSlot curates CRTC Canadian content regulations, standard rights agreement templates, and viewership measurement methodologies applicable to digital sport content."
  economic_upside: "The Canadian Broadcasting Act and CRTC mandate investment in Canadian sport content, yet infrastructure for matching non-major sport properties with appropriate broadcast partners is underdeveloped. Better matching enables a richer ecosystem of Canadian sport content, increases media revenue for organizations currently invisible to rights buyers, and gives regional digital platforms access to content that builds their distinctive positioning."

