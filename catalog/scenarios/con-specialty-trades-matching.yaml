market_example:
  summary: "A general contractor in Sudbury wins a municipal infrastructure contract requiring TIG-certified stainless steel pipe welding for a water treatment upgrade. The four certified welders in the region are all committed. The one available TIG-steel pipe welder within 300 km runs a small crew in Sault Ste. Marie — unknown to anyone in Sudbury because they've never worked outside the Algoma region."
  problem: "General contractors managing complex construction projects — municipal infrastructure, industrial facilities, institutional buildings — routinely need specialty subcontractors with precise qualification combinations: specific trade certification (CWB, TSSA, BCIN), equipment class, and insurance rating for a specific scope of work. Regional specialty trades markets are acutely thin: there may be only three to five qualified subcontractors for a specific skill-certificate combination within practical mobilization distance of a given project. These subcontractors don't advertise through channels that GCs use; GC bid managers rely on personal relationships and word-of-mouth referral networks that rarely extend beyond their immediate geography. The result: GCs reject specialty scopes they could subcontract profitably, specialty subs have idle capacity that doesn't reach the projects that need them, and project schedules slip when specialty work can't be resourced on time."
  dominant_forces:
    - "Opacity — specialty subcontractor capability and availability is invisible beyond the personal referral networks of GC estimators"
    - "Certification fragmentation — CWB procedure qualifications, TSSA pressure vessel registration, BCIN design authority, ESA contractor licences vary by trade, province, and scope, creating a matching problem keyword search cannot solve"
    - "Geographic thinness — specialty sub populations in Northern and rural Canada are small enough that a single committed crew can make a certification category unavailable for months"
    - "Temporal mismatch — GC project timelines require specialty sub confirmation during tendering, weeks or months before mobilization"
    - "Trust deficit — GCs have performance and liability exposure engaging specialty subs they have not previously qualified or worked with"
  deeperpoint_fit: "KnowledgeSlot holds the certification taxonomy for Canadian construction trades — CWB procedure qualifications by process and material, TSSA registration categories, BCIN scope of practice, ESA contractor licences, ROC (Recognized Ontario College) designations — enabling semantic matching between the GC's project specification and the sub's documented certification scope. The Trusted Intermediary Protocol manages the GC's confidential project scope (pre-tender information) while enabling capability verification against the sub's registration. The Generative Match Story delivers a qualification brief — confirming to the GC that the matched sub holds the specific certifications their scope requires, not just the general trade category."
  economic_upside: "Canada issues $180–$200B in construction contracts annually. A significant fraction of specialty scope work is either self-performed at higher cost, rejected at bid, or delayed due to sub discovery failure. A matching platform enabling GCs to resource specialty scopes 30% faster and 15% less expensively (through wider qualified sub discovery) would capture significant value on every successful match. At a 1.5% facilitation fee on specialty subcontract awards, a platform serving 2% of Canada's specialty construction market would generate $54–$60M in annual platform revenue."

