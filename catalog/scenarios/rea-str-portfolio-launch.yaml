story:
  title: "The First Three Months"
  status: published
  blog_slug: ""
  characters:
    - "Jen — real estate investor, three STR condos in Canmore, Alberta; launched without specialist assembly, underperforming projections"
    - "Tyler — STR revenue management specialist and platform consultant, Canmore; operates dynamic pricing and listing optimization for 14 Canmore STR properties"
  summary: "A Canmore investor launches three mountain STR properties with standard real estate photography and a fixed-price calendar—and generates 58% of projected revenue in the first three months before discovering the specialist market she didn't know existed."
  body: |
    ## Act A — The Canmore Projections

    Canmore's short-term rental market operates at some of the highest ADRs outside of major Canadian urban centres—$280–$450 per night for a well-presented mountain condo is achievable at peak occupancy periods. Jen bought her three one-bedroom condos with a revenue projection based on comparable listings she had found on Airbnb during her research.

    Her launch went like this: she hired a general residential stager to furnish the units. She used the same real estate photographer who had photographed one of the properties when she bought it. She set her nightly rates at a fixed discount to what she observed comparable listings charging. She hired a local cleaning company that did both residential and STR work.

    In the first three months, she generated an average of $2,100/month per unit against a projection of $3,600/month.

    Her occupancy was 61%. Her average daily rate was $168.

    She posted in a Canmore STR Facebook group asking what she was doing wrong.

    ---

    ## Act B — The Story

    The responses pointed to three specific problems.

    The photography: her real estate photographer had shot the units with furniture pushed against the walls and artificial lighting. Airbnb's algorithm favors listings whose thumbnail image shows natural light and a lifestyle composition. Her photos looked like real estate listings, not vacation rental experiences.

    The pricing: her fixed rate calendar did not account for Canmore's ski season surge (December–March), summer hiking peak (July–August), or shoulder season discounts needed to maintain occupancy in April and October. Her fixed rate had her overpriced in October and underpriced in December.

    The cleaning: her cleaning company had twice missed the 3-hour window between checkout and check-in that same-day turnovers required. Two guests had arrived to units not yet cleaned. Both left negative reviews that were visible on her listings.

    **Tyler** works full-time on STR optimization in the Canmore market. He knows the seasonality calendar, the micromarket variations within Canmore by ski hill proximity and view tier, and the photography conventions that drive platform visibility. He manages pricing for 14 properties through PriceLabs with market-specific base price and seasonal adjustment settings he has calibrated over three years. He has a list of three STR-specialist cleaning services in Canmore who have demonstrated same-day turnover reliability.

    He was findable on the MarketForge STR portfolio assembly platform, which Jen found through the Facebook group discussion.

    She engaged him within a week. He also connected her with a Canmore-based STR photographer and an STR-specialized cleaning service through his platform profile's partner network.

    In month four after the service relaunch: $3,480/month per unit average. Occupancy 84%. ADR $212.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Tyler's expertise was Canmore-specific and STR-specific in ways that made him qualitatively different from a general property manager, a general photographer, and a general cleaning service. The performance gap he closed was not marginal—$1,380/month per unit across three properties is $49,680/year in additional gross revenue.

    The STR specialist market exists but is organized entirely within STR host community networks—accessible to investors who happen to find the right Facebook group, attend the right investor meetup, or ask the right question to the right person. It is invisible to investors who approach STR investment from a general real estate context.

    [Thin market infrastructure](../../thin-markets.html) makes the STR specialist stack discoverable at the moment of project launch—not after three months of underperformance motivate an investor to post in a Facebook group asking what they did wrong.

    *Characters are fictional. Canmore Alberta's STR market, Airbnb platform algorithm dynamics, and PriceLabs dynamic pricing are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
