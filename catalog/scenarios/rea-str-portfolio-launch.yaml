market_example:
  summary: "Residential investors launching or repositioning short-term rental portfolios cannot efficiently assemble the interior design, professional photography, STR revenue management, and cleaning service coordination needed to launch at the occupancy and rate performance that makes STR investment economics work."
  problem: "Short-term rental performance is acutely sensitive to listing quality and operational consistency. An investor who acquires three condos for STR operation faces a launch sequence that determines whether the properties perform at the projected revenue level: interior design and furnishing choices that photograph well and generate strong listing visual appeal, professional photography and listing copy that competes in the search rankings, a revenue management system that dynamically adjusts nightly pricing to maximize occupancy across seasons, and a cleaning and turnover service reliable enough to maintain Superhost standards across multiple properties on overlapping reservation schedules. No single service provider covers the full STR launch stack. Interior designers who understand STR photography optimization are not the same as staging designers. Revenue management specialists who use dynamic pricing tools are a distinct market from property managers. Professional STR photographers who understand platform algorithm optimization are distinct from real estate photographers. Cleaning services with STR-specific turnover protocols (check-in verification, linen quality control, emergency turnover on same-day bookings) are distinct from standard cleaning services. Investors who assemble this team poorly—or who use generic service providers in each role—consistently underperform investors who have the right specialists assembled from launch."
  dominant_forces:
    - "Specification specificity — STR interior design optimization (selecting furniture that maintains visual appeal after high-turnover use, choosing materials that clean quickly between guests) is distinct from residential design and requires STR-specific experience"
    - "Platform algorithm knowledge — STR listing photography has platform-specific best practices (thumbnail composition, natural-light timing, room sequencing) that general real estate photographers do not routinely apply"
    - "Revenue management specialization — dynamic STR pricing tools (Beyond, PriceLabs, Wheelhouse) require configuration experience specific to the submarket and property type to produce optimal occupancy-rate trade-offs"
    - "Operational reliability — STR cleaning services must operate on same-day turnovers with guest communication integration; a standard cleaning company with residential scheduling cannot handle this operational requirement"
    - "Opacity — STR specialist service providers in each category operate within STR host community networks that general real estate investors have not previously accessed"
  deeperpoint_fit: "Semantic matching encodes provider profiles (STR service category, property type experience, platform-specific knowledge, geographic service area, portfolio size range, response time SLA for operational services) against investor opportunity signals (number of properties, property type, location market, target launch timeline, price tier positioning, current service gaps). The STR launch coordination framework sequences the interior design, photography, revenue management configuration, and operational service onboarding in the correct dependency order."
  economic_upside: "An STR property generating $4,500/month in gross revenue instead of $3,200/month—the performance gap between well-assembled and poorly-assembled launch operations in competitive Canadian markets—produces $15,600 more per year in gross revenue. Across a three-property portfolio, that performance gap is worth $46,800/year. Professional STR launch services cost $8,000–$18,000 for a three-property portfolio. The economic return on the right specialist team, compounding over a five-year hold, is substantial relative to the search friction that prevents investors from finding them."

