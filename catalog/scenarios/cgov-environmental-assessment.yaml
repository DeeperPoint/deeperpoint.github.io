market_example:
  summary: "Federal project review panels under the Impact Assessment Act cannot efficiently assemble the narrow specialist panels required to evaluate novel industrial proposals — particularly for project types with no direct regulatory precedent."
  problem: "Federal impact assessment panels require specialists whose expertise is precisely calibrated to the specific ecological, technical, and Indigenous rights dimensions of each project under review. Rosters of available, conflict-checked reviewers in areas like boreal peatland hydrology, marine acoustic ecology, or Northern First Nations traditional land use methodologies are not centrally maintained in any searchable form. The Impact Assessment Agency of Canada assembles panels through personal networks, provincial referrals, and academic directories — a process that favours well-connected institutions in southern Ontario and British Columbia and systematically underrepresents practitioners in affected regions with direct fieldwork experience. For novel project categories — a lithium brine extraction operation, a deep sea cable corridor, a hydrogen pipeline through permafrost — no prior panel composition serves as a template."
  dominant_forces:
    - "Participant scarcity — the pool of credentialed, conflict-checked specialists in narrow environmental assessment subfields is genuinely small nationally"
    - "Opacity — no searchable directory links specialist expertise profiles to the specific project categories, biomes, and Indigenous territory dimensions where that expertise applies"
    - "Offering complexity — each panel seat requires matching on disciplinary expertise, geographic fieldwork history, conflict-of-interest status relative to the specific proponent, and availability within the statutory timeline"
    - "Regulatory time pressure — the Impact Assessment Act specifies statutory review timelines; delays in panel assembly compress substantive review time"
    - "Geographic and institutional concentration — academic referral networks systematically favour major research universities, leaving fieldwork practitioners and northern-based experts invisible to panel coordinators"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (disciplinary expertise, biome-specific fieldwork history, Indigenous territory and rights expertise, conflict-of-interest declarations relative to major proponents) against panel seat requirements (project category, geographic footprint, statutory expertise mandates, available review timeline). KnowledgeSlot curates the Impact Assessment Act specialist mandate requirements, conflict-of-interest rules under the Lobbyists Registration Act, and biome-specific ecological baseline methodologies. The conflict-check layer automates screening against the proponent registry before surfacing candidates to coordinators."
  economic_upside: "Every month of delay in federal impact assessment review costs proponents hundreds of thousands of dollars in carrying costs and delays royalty revenue to affected provinces. Better specialist matching reduces panel assembly time, increases the depth of relevant expertise on review panels, and reduces the litigation risk that arises when impacted parties can demonstrate that the panel lacked the specific expertise the statute requires."

