    revenue_model: "Annual license to agricultural ministries, CGIAR centers, and extension programs ($5,000–$18,000/year); pathologist profile maintenance (funded by institutional subscribers, free for volunteers)"
    strategic_logic: "CGIAR centers, bilateral agricultural development programs, and agricultural ministries all have active interests in rapid pathogen identification and response. An institutional subscription model positions the platform as part of the early warning and response infrastructure these organizations are already funding."
