market_example:
  summary: "Agricultural extension services and farmer cooperatives in sub-Saharan Africa facing novel or emerging crop disease outbreaks cannot efficiently reach plant pathologists in developed countries with subspecialty expertise in the specific pathogen, crop, and regional variant involved."
  problem: "Sub-Saharan Africa's smallholder agricultural systems are managed by farmers with deep practical knowledge of their soils, microclimates, and traditional varieties. When a novel disease pressure appears — a new race of wheat stem rust, a previously absent virus vector, a fungal pathogen that has jumped from a neighbouring crop system — the local extension agronomist can identify that something is wrong, document symptoms systematically, and collect samples with professional competence. What they often lack is subspecialty plant pathology knowledge for the specific pathogen: its host range, its management options, its likely movement pathway, and the resistance profiles of the varieties currently in the ground. This knowledge exists — in academic research groups at agricultural universities in the Netherlands, UK, Australia, Canada, and the US — among plant pathologists who have spent careers on specific pathogens and specific crop systems. These researchers often want to engage. They cannot efficiently find the extension officer with the active outbreak and the documented symptom record whose request they are best positioned to answer."
  dominant_forces:
    - "Participant scarcity — subspecialty plant pathology knowledge for specific pathogen-crop-region combinations is concentrated in small research groups at agricultural universities globally"
    - "Urgency — crop disease outbreaks develop at the speed of the planting season; a response that arrives after harvest is irrelevant"
    - "Opacity — extension services and cooperatives with active outbreaks cannot signal their specific technical need in a form that reaches the right plant pathologist"
    - "Offering complexity — meaningful remote consultation requires alignment on the specific pathogen or pathogen class suspected, the crop and variety, the regional climate context, and the management options available to the farmer population"
    - "Sample and documentation quality — the value of remote consultation depends on the quality of the symptom documentation and sample handling; an engagement framework that guides documentation quality improves consultation outcomes"
  deeperpoint_fit: "Semantic matching encodes pathologist profiles (specific pathogen expertise by taxonomic group and crop system, regional geographic experience, resistance variety knowledge, management option expertise for resource-constrained contexts) against outbreak request profiles (crop, observed symptoms, suspected pathogen class, sample availability, farmer population and management options available). The documentation protocol guides the requesting extension officer through symptom capture in a form that maximizes remote consultation value. KnowledgeSlot curates CGIAR pathogen surveillance data, CIMMYT rust resistance variety registries, and the management option matrices specific to smallholder contexts."
  economic_upside: "A single wheat stem rust outbreak insufficiently managed can destroy 40–70% of the crop across an affected region, with cascading food security and income consequences for thousands of smallholder households. Early identification of the specific pathogen race and the variety resistance profile that applies determines whether the affected farmer population can act in time with available management options. Better subspecialty consultation access compresses response time from weeks to days — the interval that determines whether a partial or complete harvest is possible."

sponsor_opportunities:
