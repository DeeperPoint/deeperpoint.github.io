market_example:
  summary: "Every Ring of Fire operation requires a designated medical authority — a physician or nurse practitioner — to authorize medevac evacuations, review fitness-for-duty determinations, and oversee mandatory medical surveillance programs for underground workers. No individual development-phase operation generates enough physician engagement to sustain an on-site or dedicated medical officer. A Greenstone-based physician or NP providing telehealth oversight to a portfolio of Ring of Fire operations, with scheduled site visits and on-call availability for medevac decisions, is a model that works in remote mineral regions globally and has no equivalent yet in the Ring of Fire."
  problem: "Remote underground mining operations face a medical authority gap that goes beyond first aid. Ontario's regulatory framework and practical operational safety require a designated medical authority at each mine for three non-interchangeable functions. First, medevac authorization: when a worker sustains a serious injury or medical emergency at a fly-in site, the decision to evacuate by air — including the selection of receiving facility and coordination with Ornge — legally and operationally requires a physician or NP engaged with the operation. A general telehealth line staffed by a clinic physician in Southern Ontario who has no knowledge of the site, the worker, or the medical surveillance history is not an adequate substitute. Second, fitness-for-duty determinations: certain job tasks in underground mining (operating heavy equipment, working with explosives, working at heights) require medical fitness assessments. A medical officer who understands the specific physical demands of the operation can make these determinations efficiently; a general practitioner reviewing a form submitted through a third-party medical service cannot. Third, occupational medical surveillance program oversight: workers exposed to diesel particulate matter, silica dust, noise, and vibration underground require a structured medical surveillance program — periodic health assessments, audiometric testing, lung function testing, biological monitoring — reviewed and signed off by a physician. Designing and overseeing this program requires medical expertise in occupational health specific to underground mining. Each of these three functions requires physician engagement at a Ring of Fire development operation perhaps one to two days per month of direct involvement, plus telehealth availability on the remaining days. This is genuinely fractional demand — not enough to sustain a dedicated on-site physician, but not trivially outsourced to a Southern Ontario general practice with no site knowledge. A physician or NP based in Greenstone, formally retained as medical officer by four to six Ring of Fire operations, visiting each operation monthly on a scheduled rotation and available by telehealth between visits, is a proven model in other remote mineral regions — the diamond mines of the Northwest Territories operate on exactly this structure. The Ring of Fire currently has no such arrangement because no individual operation has been willing to subsidize a Greenstone-resident physician for competitors to also use."
  dominant_forces:
    - "Medevac authorization latency — a deteriorating worker at a fly-in site cannot wait hours for a Southern Ontario physician unfamiliar with the operation to be located through a general telehealth service; a retained medical officer responds immediately with operational context"
    - "Medical surveillance regulatory obligation — Occupational Health and Safety Act and sector regulations require periodic medical surveillance for underground workers exposed to designated substances; overseeing this program across an entire workforce requires a physician with consistent engagement, not episodic involvement"
    - "First Nations community health integration — Webequie and Marten Falls First Nations community members working at Ring of Fire operations have specific health considerations that a medical officer familiar with community healthcare contexts can address in ways a rotating general practitioner cannot"
    - "Fitness-for-duty liability — fitness determinations for high-hazard underground tasks require documented physician review; operations without a properly retained medical officer carry unacceptable liability when these assessments are made without medical authority"
    - "Career viability conditions — physicians and NPs with occupational health expertise and remote medicine experience will not accept a short-term on-site contract at a fly-in camp; a Greenstone-based portfolio practice with telehealth infrastructure and a schedule of monthly site visits is a viable professional arrangement"
  deeperpoint_fit: "A Greenstone-based medical officer network enrolls physicians and NPs with occupational health and remote medicine expertise and matches them to Ring of Fire operations based on retainer schedules, site visit calendars, and specific occupational health program requirements. The platform maintains each operation's medical surveillance program schedule, tracks worker health monitoring obligations, and coordinates scheduled site visits across the physician's multi-operation calendar. Emergency escalation pathways surface medevac situations to the designated medical officer in real time regardless of geography. Operations access a shared telemedicine interface through which the medical officer can review a worker's electronic health record, speak directly with first-aid personnel on site, and authorize or decline evacuation with documented clinical reasoning."
  economic_upside: "A Greenstone medical officer network providing retained services to eight Ring of Fire operations supports two to three physicians or NPs in full-time occupational medicine practice — professionals whose household incomes ($180,000–$280,000) materially support Greenstone's tax base, school enrollment, and local economy. The network also connects to Greenstone's existing healthcare infrastructure: a physician based in Greenstone for mine medical officer work will contribute to local clinic capacity, reducing pressure on the Greenstone and District Memorial Hospital's physician shortage. The dual use of mine medical officer retention to simultaneously address community physician shortage is a distinctive value proposition for a NOHFC or provincial rural physician recruitment grant application."

