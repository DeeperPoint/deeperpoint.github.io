market_example:
  summary: "Matches civilian police oversight agencies with qualified independent
    investigators — retired officers, civilian forensics specialists, and
    use-of-force experts — for mandatory serious-incident investigations,
    where investigator shortages cause delays that erode public trust."
  problem: "Every Canadian province has a civilian oversight body mandated to
    independently investigate serious incidents involving police — deaths in
    custody, officer-involved shootings, serious injuries during arrest. These
    agencies include Ontario's Special Investigations Unit (SIU), Alberta's
    ASIRT, and BC's Independent Investigations Office (IIO). They must deploy
    investigators within hours of an incident, but the qualified pool is
    extraordinarily thin: investigators must have specific forensic training,
    be demonstrably independent of the involved police service, and in some
    jurisdictions must never have served as police officers at all. The result
    is agencies that are chronically understaffed, geographically constrained,
    and forced to decline or delay investigations — outcomes that directly
    damage public confidence in police accountability."
  dominant_forces:
    - "Independence requirements — investigators must have no prior employment
      or personal connection to the police service under investigation,
      dramatically narrowing the eligible pool for each incident"
    - "Temporal urgency — oversight agencies must deploy within hours of a
      serious incident; scene integrity, witness availability, and public
      confidence all degrade with delay"
    - "Geographic dispersion — incidents occur across vast provinces, but
      qualified investigators are concentrated in capital cities; rural and
      northern incidents are especially difficult to staff"
  deeperpoint_fit: "CoSolvent maintains a real-time registry of qualified
    independent investigators with verified credentials, conflict-of-interest
    declarations, and geographic availability. When an incident is reported,
    the platform automatically filters out investigators with connections to
    the involved service and ranks remaining candidates by proximity,
    specialization (use-of-force, forensics, in-custody death protocols), and
    availability. CommonContext curates jurisdiction-specific investigation
    standards, evidentiary chain-of-custody requirements, and mandatory
    reporting templates."
  economic_upside: "Canada's oversight agencies collectively investigate
    300–500 serious incidents annually. The political and social cost of
    delayed or understaffed investigations is enormous — but the direct fiscal
    cost of maintaining standing investigative capacity is also high. A
    platform that enables surge staffing from a shared, verified pool reduces
    per-agency overhead while improving deployment speed. Enterprise SaaS
    licensing at $75,000–$200,000 per provincial agency."

