story:
  title: "Forty-Eight Hours"
  status: draft
  blog_slug: ""
  characters:
    - "Director Okafor - head of provincial civilian oversight agency, Edmonton"
    - "Investigator Leblanc - retired RCMP forensic specialist, Moncton"
  summary: "A civilian oversight director in Alberta deploys a qualified
    investigator from New Brunswick within 18 hours of a fatal police encounter,
    after the platform eliminates six local candidates for conflict-of-interest."
  body: |
    ## Act A - The Market Structure

    Civilian police oversight is a thin market by design. The entire purpose
    of independence requirements is to prevent the investigated from
    investigating themselves. But independence is a constraint that shrinks
    the supply pool for every incident — because the pool is defined not just
    by qualification but by who the investigator is *not* connected to. In a
    country where police services overlap, share training academies, and
    transfer officers between forces, the web of connections is dense. The
    result: a qualified forensic investigator in Calgary may be disqualified
    from investigating an Edmonton incident because her former partner
    transferred to EPS three years ago.

    The public does not see the matching problem. The public sees delay —
    and delay looks like cover-up.

    ---

    ## Act B - The Story

    **Director Okafor** receives a call at 2 AM. A fatal encounter during a
    wellness check in rural Alberta. ASIRT must deploy an investigative team
    by morning. She has eight investigators on her active roster. The platform
    runs conflict screening against the involved service: three investigators
    previously served with officers now at that service; two have pending
    cases involving the same detachment; one is on leave. Two remain — but
    neither has forensic scene reconstruction expertise, which this incident
    requires.

    Okafor expands the search nationally. The platform identifies
    **Investigator Leblanc** in Moncton — a retired RCMP forensic specialist
    who left the force eight years ago, has no connections to any Alberta
    service, holds current civilian oversight certification from a New
    Brunswick training program, and is available immediately. The platform
    verifies his credentials, confirms no conflicts, and books travel.
    Leblanc is on scene by 8 PM the following day.

    The investigation proceeds on schedule. The public report is issued within
    the statutory timeline. No procedural challenges are raised.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Police oversight agencies cannot stockpile investigators the way police
    services stockpile officers. The independence constraint means that every
    incident reshuffles who is eligible. Without a national, real-time
    registry that can perform instant conflict screening and cross-provincial
    deployment, each agency is an island — understaffed, geographically
    constrained, and unable to meet the public's legitimate expectation of
    swift, independent accountability.

    [Thin market infrastructure](../../thin-markets.html) does not solve the
    political challenges of police oversight. It solves the logistics — and
    logistics is where most oversight failures actually originate.

    *Characters are fictional. The investigator shortage at Canadian civilian
    oversight agencies is real and has been documented by multiple provincial
    auditors. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
