market_example:
  summary: "Canadian pulse producers cannot reach Mexican food processors directly; Mexican buyers route through US brokers at significant premium and with no production specification control."
  problem: "Canada is among the world's largest producers of lentils, chickpeas, and dry peas. Mexico's health food sector and legume-based food industry represents a large, proximate consumer of high-protein pulses. But direct relationships between Canadian producers and Mexican food manufacturers are nearly non-existent. Mexican buyers source through US commodity brokers, paying distribution margins and losing the ability to specify quality attributes. Canadian producers have no mechanism to identify or reach Mexican food processors."
  dominant_forces:
    - "Opacity — Canadian pulse producers are invisible to Mexican food manufacturers; no shared discovery channel exists"
    - "Regulatory fragmentation — CUSMA tariff treatment is favourable but COFEPRIS import registration and CGC certificate-of-origin documentation are unfamiliar to both sides"
    - "Geographic distance — Saskatchewan to Guadalajara requires customs brokerage at Laredo or Nogales and logistics that small producers have never arranged"
    - "Trust deficit — first-time international trade without an established broker carries performance risk neither party is willing to absorb alone"
    - "Offering complexity — pulse quality attributes (protein content, bleachability, admixture, calibre) differ significantly between Canadian export grades and Mexican processor requirements"
  deeperpoint_fit: "Semantic matching encodes pulse lots by variety, quality attributes, origin region, and certification status against Mexican processor specifications. CommonContext curates CGC grading standards, COFEPRIS import permit requirements, CUSMA certificate-of-origin procedures, and Laredo/Nogales customs broker networks. Deal assembly aggregates smaller Saskatchewan producers to present combined volumes that justify a Mexican processor's onboarding cost."
  economic_upside: "Mexico imports over USD $1.5 billion in pulses annually, primarily routed through the US. Even partial direct sourcing from Canadian producers would reduce distribution margins, give Mexican processors production-specification control, and create new bilateral trade relationships in both countries."

