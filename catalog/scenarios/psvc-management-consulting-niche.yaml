market_example:
  summary: "SMEs undergoing operational transformation — ERP implementation, export market entry, family business succession, supply chain restructuring — cannot distinguish between generalist management consultants and the rare sector-deep advisors who have executed the specific transformation type before, leading to expensive failures and restarts."
  problem: "Management consulting is among the most opaque professional markets in Canada. The title is unregulated, the work product is intangible, and the quality signal available to buyers is almost entirely reputational — word of mouth from other business owners who used the consultant, filtered through the natural limitations of a local business network. An SME owner seeking help with a family business succession, a food manufacturer seeking export market entry support, or a third-generation retailer facing an ERP implementation has no way to verify whether the consultant they are evaluating has executed the specific transformation type before or is extrapolating from adjacent work. The mismatch runs in both directions: highly capable niche advisors with deep sector and transaction-type experience cannot make their specific expertise legible to the SME buyers who need it, and so remain invisible behind generalist competitors with stronger marketing presence."
  dominant_forces:
    - "Credential opacity — management consulting carries no regulated designation; the buyer has no external signal to distinguish genuine transformation experience from theoretical knowledge"
    - "Transformation specificity — family succession, export entry, ERP implementation, and supply chain restructuring are fundamentally different work types requiring different practitioner backgrounds"
    - "Sector depth requirement — a food manufacturing export strategy is not the same engagement as a construction company export strategy; sector knowledge matters as much as the transformation methodology"
    - "Trust threshold — the consulting engagement requires sharing sensitive business intelligence; the standard referral-dependent trust model excludes capable advisors outside the buyer's immediate network"
    - "Geographic constraint — SMEs outside major metros have access only to the consultants who will travel, further narrowing the eligible pool"
  deeperpoint_fit: "Semantic matching encodes advisor profiles (transformation type specialization, sector experience by industry and company revenue range, geographic coverage, completed engagement references, association membership and certification) against SME demand signals (transformation type, sector, company size, geographic location, budget range, timeline). The Generative Match Story helps SME owners articulate the transformation challenge they face in terms that allow precise matching rather than the generic 'I need a business consultant.'"
  economic_upside: "The Canadian management consulting market exceeds $12 billion annually. SMEs account for a disproportionately small share because they cannot access the quality signal that would allow them to buy confidently. A platform that reduces SME consulting match failure from 40% to under 10% — by ensuring transformation-type and sector alignment before engagement — generates substantial margin alongside its match fee revenue. Family business succession consulting alone represents a $500M+ annual market in Canada as the boomer-generation ownership transfer wave peaks."

