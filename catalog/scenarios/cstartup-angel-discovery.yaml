market_example:
  summary: "Early-stage companies in communities outside the major VC hubs are effectively invisible to angels willing to invest outside Toronto and Vancouver, while strong angels in mid-size cities with appetite for local deal flow cannot discover quality founders in adjacent smaller communities."
  problem: "Early-stage companies in communities outside Toronto, Vancouver, and Montréal — agricultural technology startups in Lethbridge, Indigenous technology companies in Whitehorse, marine technology ventures in Lunenburg — are effectively invisible to angel investors who would invest outside major urban clusters but rely on networks centred there for deal flow. Strong angel investors in mid-size cities (Saskatoon, Moncton, Thunder Bay) with genuine appetite for local deal flow cannot discover quality founders in adjacent smaller communities who are not plugged into economic development networks. The result: remote founders either relocate to access capital, fail to raise, or accept unfavourable terms from the only investors who find them."
  dominant_forces:
    - "Opacity — no structured discovery mechanism exists for founders outside major hubs to surface companies to compatible investors; deal flow is entirely network-dependent"
    - "Risk — investors apply higher risk discounts to remote founders because they cannot evaluate quality without trusted deal flow intermediaries or in-person access"
    - "Geographic distance — due diligence typically requires in-person engagement; travel costs and logistics disadvantage remote founders"
    - "Information asymmetry — investors don't know which remote founders are building credible businesses; founders don't know which investors have genuine appetite for their geography and domain"
    - "Temporal distance — investor appetite is cyclical; founders raising capital don't know when specific investors have open allocation"
  deeperpoint_fit: "Semantic matching encodes founder company profile (stage, sector, technology domain, traction metrics, capital need, geographic location) against investor profile (check size, geography appetite, sector thesis, stage preference, due diligence model). The trusted intermediary protocol manages confidential disclosure of financial metrics and investor allocation without public disclosure. KnowledgeSlot curates BDC regional investment programs, provincial angel network directories, SR&ED eligibility, IRAP programming, and CCPC share structure requirements relevant to angel investment. Anticipatory matching surfaces compelling remote founders to investors before their allocation closes."
  economic_upside: "Angel capital that flows to remote and underserved communities creates local anchor companies that employ technical talent, generate SR&ED credits, and build the credibility infrastructure that makes subsequent waves of local entrepreneurship viable. The absence of early angel capital in remote communities is a primary cause of the startup ecosystem concentration problem."

