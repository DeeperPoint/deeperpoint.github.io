story:
  title: "The Term Sheet That Required a Flight"
  status: draft
  summary: "An agricultural water monitoring startup in Portage la Prairie, Manitoba has $180K in revenue, a signed LOI from a major irrigation district, and three outstanding prospects. Its founder has been told by four Toronto angels that they don't do in-person diligence outside Ontario. A Saskatoon-based angel with a specific agtech thesis and $300K in available allocation has been looking for exactly this company for a year."
  characters:
    - "Kumar — founder, agricultural water monitoring startup, Portage la Prairie, Manitoba"
    - "Helen — angel investor, agtech focus, Saskatoon, Saskatchewan"
  body: |
    ## Act A — The Deal Flow Geography Problem

    Canada's angel and early-stage venture investment is, in practical terms, a story about three cities. Toronto, Vancouver, and Montréal host the networks, the pitch events, the co-working spaces, and the informal lunches where investment conversations begin. Angels outside that triangle exist and are active — Saskatoon, Moncton, Kelowna, Thunder Bay, Halifax each have their investors — but their deal flow comes through the same Toronto-filtered networks.

    A founder who has never attended a Toronto pitch event, never been through a Waterloo accelerator, and never cold-emailed an investor they met at a Bay Street cocktail reception is, for practical purposes, invisible to the majority of Canadian angel capital.

    The following is a fictional account of what happens when that invisibility is addressed.

    ---

    ## Act B — The Story

    **Kumar** left an agricultural engineering role at a provincial irrigation authority to build a soil moisture and groundwater monitoring platform for prairie grain farmers. His hardware-software system places wireless sensor nodes across a field and delivers irrigation timing recommendations through a mobile app. His first twelve customers are in the Portage la Prairie area. He has $180K in recurring subscription revenue, a signed LOI from the Manitoba Irrigation Districts Association, and three additional prospect conversations underway.

    He needs $400K to scale hardware production, hire a second firmware engineer, and expand to Saskatchewan for the next growing season.

    Four Toronto angels he pitched over video declined. Two cited geography explicitly — they don't invest where they can't do in-person diligence easily. One said he'd reconsider if Kumar moved the company to Toronto. Kumar's business model depends on being near his farm customers. He is not moving.

    He registers on the DeeperPoint investor discovery platform. His company profile specifies: agtech, hardware-software, prairie agriculture, $180K ARR, pre-Series A, $400K raise, Manitoba geography, in-person diligence available in Portage la Prairie or Winnipeg.

    ---

    **Helen** is a Saskatoon-based entrepreneur turned angel investor. She sold an agronomy software company seven years ago and has since deployed capital in eight early-stage agtech and cleantech companies. Her thesis is specific: technology that improves input efficiency for prairie grain farmers. Her current available allocation is $300K. She has reviewed twelve inbound deals in the past six months. None matched her thesis precisely.

    Her investor profile on the platform specifies: agtech sector, prairie agriculture focus, hardware or software, $150K–$350K check size, seed to pre-Series A stage, Western Canada geography, in-person diligence preferred in SK or MB.

    The platform matches Kumar's company profile against Helen's investor profile. Sector: agtech prairie agriculture confirmed. Stage and raise size: within parameters. Geography: Manitoba, adjacent to SK focus area. Revenue traction: $180K ARR confirmed. In-person diligence: Portage la Prairie, accessible.

    ---

    Helen receives the match notification with Kumar's anonymized company summary. She requests the full pitch deck through the platform's confidential data module.

    She reviews it the same afternoon. She has seen twelve decks in six months. This is the first one that maps directly onto her thesis.

    She requests an in-person meeting in Winnipeg. Kumar drives down the following Friday. Helen drives from Saskatoon. They meet at a hotel conference room near the Winnipeg airport.

    Helen commits $275K subject to reference checks, which the platform's facilitation service coordinates over the following two weeks.

    Kumar's Series Seed closes with Helen as lead investor.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Helen was looking for Kumar's company. Kumar was raising capital that Helen would have written. Both were committed to prairie agriculture. The geography was compatible.

    What separated them for eighteen months of Kumar's fundraising process was the absence of a deal flow mechanism that connects a first-time entrepreneur in Portage la Prairie to an angel in Saskatoon who has never met a mutual contact in common.

    [Thin market infrastructure](../../thin-markets.html) does not replace investor judgment or due diligence. It makes the deal visible before the raise window closes and the founder is forced to choose between his community and his company.

    *Characters are fictional. The startup ecosystem dynamics — prairie agtech investment gaps, remote due diligence barriers, provincial angel network structures — reflect real conditions in Canadian early-stage capital markets. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
