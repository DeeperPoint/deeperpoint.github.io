market_example:
  summary: "Approximately 100,000 Canadians develop lymphedema — chronic limb swelling caused by lymphatic system damage — most commonly following cancer treatment involving lymph node removal or radiation. The condition is permanent, progressive if unmanaged, and managed primarily with custom-fitted compression garments that must be replaced every four to six months and professionally re-fitted at each replacement. Certified lymphedema therapists qualified to fit garments are concentrated in major urban centres. Provincial coverage programs exist but vary enormously in eligibility criteria and reimbursement amounts. The thin market: matching patients to the nearest qualified fitter who accepts their provincial coverage, carries their required garment class, and has telehealth capability for rural patients."
  problem: "A breast cancer survivor in Kenora who develops arm lymphedema after axillary lymph node dissection faces a matching problem that repeats every six months for the rest of her life. She needs a certified lymphedema therapist (CLT) or certified lymphedema and wound care specialist qualified to conduct a volumetric assessment, select the appropriate compression class, and fit a custom garment to her limb profile. The nearest qualified fitter may be in Thunder Bay or Winnipeg. The fitting appointment must precede the garment order; the garment takes two to four weeks to arrive; if the fit is wrong the garment must be re-ordered. Ontario's Assistive Devices Program covers 75% of one garment per limb per year for eligible conditions — but the patient must navigate the eligibility criteria, find an ADP-approved vendor, and arrange the funding before the garment is ordered. In Quebec, New Brunswick, and British Columbia coverage exists under different programs with different eligibility rules. A newly diagnosed lymphedema patient confronts this system without a guide. Most oncology teams provide a referral to a physiotherapy department; what actually happens next is left to the patient. Rural and northern patients often receive a single in-person fitting and then self-manage garment replacement from memory and online sizing guides."
  dominant_forces:
    - "Geographic concentration of certified fitters — CLT-qualified therapists are concentrated in urban cancer centres and private rehabilitation practices in major cities; rural patients face long travel for a mandatory in-person service"
    - "Coverage system fragmentation — each province has distinct programs, eligibility criteria, reimbursement levels, and approved vendor lists; patients navigating across provincial boundaries (e.g., a New Brunswick patient moving to Ontario) face complete system reset"
    - "Six-month replacement cycle — unlike a one-time device, garment replacement creates a recurring matching problem for the patient's lifetime; the market never clears"
    - "Limb profile change over time — weight change, cancer recurrence, or surgical revision changes the compression requirement; a patient who has been self-ordering the same garment may be wearing the wrong class without knowing it"
    - "No referral infrastructure — oncology teams provide condition diagnosis and initial referral; ongoing garment management falls outside their scope and no formal handoff exists"
  deeperpoint_fit: "MarketForge lists certified lymphedema therapists and approved vendors with their geographic coverage, telehealth availability, provincial coverage acceptance, and garment class expertise. A patient's profile captures her limb, condition stage, provincial coverage entitlement, and prior garment history — none of which is clinical data requiring health system integration; it is self-reported information. The platform matches her to the nearest eligible fitter, confirms their current telehealth availability for rural patients, and generates the coverage paperwork checklist for her provincial program. A coverage navigator service — experienced patient advocates familiar with ADP, HIBC, and other provincial programs — can participate as professional platform members."
  economic_upside: "The Canadian compression garment market is approximately $80 million per year. Lymphedema that is poorly managed progresses to advanced stages requiring more intensive and costly treatment — hospitalizations for cellulitis, complex decongestive physiotherapy, and eventual skin breakdown. A matching platform that improves first-fit success rates and reduces coverage navigation time delivers measurable downstream savings to provincial health systems. The platform is fundable through the Canadian Lymphedema Framework (a national patient organization), cancer charity foundations, and provincial assistive device program administrative grants."

