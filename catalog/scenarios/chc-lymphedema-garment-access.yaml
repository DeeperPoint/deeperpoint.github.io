story:
  title: "The Fitter Who Was Three Provinces Away"
  status: draft
  blog_slug: ""
  characters:
    - "Renata — 58-year-old former teacher in Kenora, Ontario; two years post bilateral mastectomy; developed bilateral arm lymphedema after axillary dissection; last proper fitting was in Thunder Bay eighteen months ago"
    - "Sandra — certified lymphedema therapist in Fort Frances; recently listed on the platform with telehealth fitting capability for Ontario ADP garments"
    - "Paul — coverage navigator; retired insurance adjudicator; specializes in Ontario ADP lymphedema garment applications; lists on the platform as a professional member"
  summary: "Renata has been ordering her compression garments by memory from her last fitting eighteen months ago. Her garments no longer fit correctly, her left arm volume has increased, and her Thunder Bay therapist retired. The platform finds a CLT in Fort Frances with telehealth capability and a coverage navigator who files her ADP renewal in two hours."
  body: |
    ## Act One: The Retired Therapist

    Sandra Kowalchuk had retired in the spring. She had been Renata's certified lymphedema therapist for three years, and
    her Thunder Bay clinic had sent a form letter in March saying the practice was winding down. The letter included a
    referral line: "Please contact your physician for an updated referral to a lymphedema specialist."

    Renata's family physician in Kenora had written the referral. The waiting list at the Thunder Bay Regional Health Sciences
    Centre's rehabilitation department was fourteen months.

    In the meantime, Renata had ordered the same garment she had worn for the past three seasons — Class II, medium, the
    SKU she had memorized. The garment still looked right when she put it on. But her left sleeve had started rolling at
    the wrist, and by mid-afternoon her hand was more swollen than it had been a year ago.

    She called the Ontario Assistive Devices Program line to ask about renewing her coverage. The ADP coordinator told
    her the renewal required a new clinical prescription plus a fitting from an approved vendor. She had no current fitter
    and her prescription had expired.

    ---

    ## Act Two: The Platform Match

    The platform search filtered to Ontario, CLT-certified, telehealth available, bilateral arm, ADP-approved vendor.
    It returned two results. One was in Ottawa. One was Sandra Holowach in Fort Frances — sixty kilometres from Kenora.
    Sandra had listed the month before, her first month on the platform. She had telehealth infrastructure for remote
    volumetric assessment using the standardized measuring protocol and offered ADP vendor services for Ontario patients.

    The coverage navigator listing on the next screen was Paul Arsenault in Hamilton. He had filed over two hundred ADP
    lymphedema applications. His flat fee was $120.

    Renata's video assessment with Sandra took forty-five minutes. Sandra identified that Renata's left arm had progressed
    to Class III and that the wrist rolling was a length problem, not a class problem — two corrections that self-ordering
    from memory could never have caught.

    Paul filed the ADP renewal documentation the same afternoon. Renata's garments arrived eleven days later.

    ---

    ## Act Three: What the Fitting Found

    The new left sleeve did not roll. Renata wore it through an entire school day working as a substitute and her hand
    did not swell. Sandra scheduled a six-month check-in in her platform calendar.

    The fourteen-month Thunder Bay waiting list remained. Renata did not join it.

    *Characters are fictional. Lymphedema prevalence in cancer survivors, the Ontario Assistive Devices Program, and
    the geographic distribution of certified lymphedema therapists in Northwestern Ontario are real.
    [DeeperPoint](../../marketforge.html) is building the matching infrastructure this market requires.*
