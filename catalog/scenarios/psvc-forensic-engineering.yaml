market_example:
  summary: "Insurance adjusters, property insurers, and litigation counsel handling structural failures, mechanical breakdowns, and product liability claims need forensic engineers whose specialization precisely matches the failed system — not a generalist engineer who can opine competently on everything and authoritatively on nothing."
  problem: "Forensic engineering encompasses a vast range of technical domains — structural failure, mechanical system breakdown, electrical fire causation, product liability, geotechnical slope failure, fatigue fracture in industrial equipment. Within each domain, there are practitioners whose career has produced genuine subspecialty depth in a particular material, loading condition, or failure mechanism. An insurer processing a claim for collapse of a wood-frame condominium balcony, a litigation client with a catastrophic gearbox failure claim, and a municipality facing a geotechnical slope failure all need forensic engineers — but they need fundamentally different subspecialists. The mechanism for finding the right forensic engineer is almost entirely professional network referral within the engineering community, filtered through insurance company preferred vendor lists that reward availability and price, not subspecialty depth. The consequence is expert reports that misidentify failure mechanisms, causation opinions that are challenged and withdrawn, and reconstructed investigations that start over from the physical evidence."
  dominant_forces:
    - "Participant scarcity — forensic engineers with defined subspecialty depth in specific failure mechanisms or material systems are a small population relative to the number of claims requiring their expertise"
    - "Dual credential opacity — forensic engineering quality requires both technical subspecialty depth and expert witness qualification history; standard engineering directories index neither"
    - "Preferred vendor list distortion — insurance company preferred vendor lists select for volume processing capacity and geographic coverage, not subspecialty depth; the most versatile vendors displace the most specialized"
    - "Physical evidence time pressure — forensic investigations must begin before the damaged site is demolished, repaired, or cleaned; a delayed or wrong-match investigation loses the physical evidence"
    - "Causation sensitivity — insurance claim outcomes and litigation case values both turn on causal attribution; a forensic report that cannot withstand expert challenge on causation undermines the entire case management strategy"
  deeperpoint_fit: "Semantic matching encodes forensic engineer profiles (technical discipline, failure mechanism subspecialty, material and system class, prior investigation type record, expert witness qualification by court and case type, P.Eng. or other provincial designation, insurance panel membership) against claim demand signals (asset type, failure mechanism suspected, material class, investigation purpose — insurance vs. litigation vs. regulatory, jurisdiction, physical evidence timeline)."
  economic_upside: "Canadian property and casualty insurance claims involving structural and mechanical failure exceed $4 billion annually. A forensic engineering report that supports a successful subrogation recovery generates 30–150% of its fee value in recovered claim costs for the insurer. A report that fails expert challenge in litigation — requiring a replacement investigation — costs $40,000–$150,000 in wasted investigation expense plus the litigation timeline extension. The Canadian forensic engineering professional services market is estimated at $300M–$500M annually, largely allocated through preferred vendor lists that optimize for coverage area, not subspecialty."

