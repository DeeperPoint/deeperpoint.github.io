market_example:
  summary: A platform matching Canadian developers of extreme-climate energy and cleantech
    solutions with remote communities, mines, and municipalities in Northern Europe,
    Alaska, and Greenland.
  problem: Exporting Canadian Cold-Weather Energy Solutions to Nordic and Northern
    Markets
  dominant_forces:
  - Growing demand for off-grid and harsh-environment renewable energy solutions.
  - Canadian firms have unique expertise out of necessity but lack international sales
    channels.
  - Procurement is often driven by regional governments with complex bidding rules.
  deeperpoint_fit: Market requires highly specific, project-based matching rather
    than catalog sales. Trust in harsh-weather reliability is paramount. Both sides
    benefit from structured, phased project discovery.
  economic_upside: High-margin project exports that validate tech for broader markets.
    Significant reduction in customer acquisition costs for specialized manufacturers.
