title: "Construction Material Salvage: Matching Demolition Sites with Builders Seeking Reclaimed Lumber, Brick, Fixtures, and Architectural Salvage"
card_title: "Demolition Salvage to Builder Reuse Matching"
sector: environmental-circular-economy
