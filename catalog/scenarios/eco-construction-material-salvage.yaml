forge_tier: 1
status: published
tags: [environment, circular-economy, construction, demolition, salvage, reuse, canada, temporal-mismatch, opacity, trust-deficit]

market_example:
  summary: "Demolition contractors dismantling buildings with reusable materials — old-growth lumber, heritage brick, hardwood flooring, architectural fixtures, steel beams — default to landfill because they cannot find buyers fast enough, while builders, renovators, and artisans seeking exactly these reclaimed materials pay premium prices at salvage yards or go without."
  problem: "Construction and demolition waste accounts for approximately 30% of Canadian landfill volume — roughly 9 million tonnes annually. A significant fraction of this waste is materials with high reuse value: century-old Douglas fir beams, heritage clay brick, hardwood flooring, cast iron radiators, architectural mouldings, industrial steel, and vintage hardware. A demolition contractor in Kitchener tearing down a 1920s factory has 200 old-growth Douglas fir beams, 40,000 heritage bricks, and a set of original factory windows. A timber-frame builder in Muskoka would pay $15/board-foot for those beams — five times the price of new lumber. A heritage renovation contractor in Stratford needs exactly that brick. An architectural salvage enthusiast in Toronto wants those windows. But the demolition contractor has two weeks to clear the site. He calls two salvage yards; one is full, one will take the brick but not the wood. He doesn't know the Muskoka builder exists. The beams go to landfill. The builder buys new lumber. The heritage brick is crushed for aggregate. The windows are destroyed. Everyone loses."
  dominant_forces:
    - "Temporal mismatch — demolition timelines (days to weeks) are far shorter than the time required to find buyers for specialty reclaimed materials; the material is destroyed before the buyer is found"
    - "Material characterization gap — reclaimed materials vary enormously in quality, species, grade, and condition; no standardized grading system exists for demolition salvage"
    - "Logistics complexity — salvaged materials require careful removal, transport, storage, and sometimes decontamination (lead paint, asbestos abatement) that generic waste haulers cannot provide"
    - "Liability uncertainty — demolition contractors face liability questions about material quality guarantees that discourage resale"
  deeperpoint_fit: "Semantic matching encodes demolition site profiles (material inventory with species identification, dimensions, quantity, condition, photographs, removal timeline, site location, hazardous material status) against builder/renovator demand signals (material type, species, grade, quantity, acceptable condition, project timeline, location, budget). Pre-demolition material inventories posted before the wrecking ball arrives give buyers lead time to arrange purchase and transport."
  economic_upside: "Canadian C&D waste represents approximately $2B in potential reuse material value that is currently landfilled. A platform that diverts 5% of this material to reuse generates $100M in reclaimed material transactions annually, with additional environmental value in avoided landfill, reduced virgin material extraction, and embodied carbon preservation."

