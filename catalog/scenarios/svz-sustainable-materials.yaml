market_example:
  summary: "Sustainable materials startups — seaweed-based insulation, electrochemical composites, mycelium packaging — hold certified, spec-compliant innovations but are systematically invisible to the specifiers, procurement officers, and building code reviewers who could adopt them, trapped by opacity, regulatory fragmentation, and the trust deficit of an unproven product."
  problem: "A sustainable materials startup sits in a classically thin market: they have a novel, certified, spec-compliant material, and somewhere out there are builders, manufacturers, and procurement officers who would choose it over conventional alternatives if they could find it and evaluate it efficiently. The path from certified lab invention to first commercial installation is long and full of matching failures — specifiers who don't know the product exists, procurement rules that only allow approved products, inspectors who don't know how to evaluate it."
  dominant_forces:
    - "Opacity — innovative materials are invisible to most specifiers and procurement officers who rely on established material databases and manufacturer rep networks"
    - "Trust deficit — builders and manufacturers are risk-averse and professionally liable; unproven materials require evidence of performance, certification, and installation support before adoption"
    - "Regulatory fragmentation — building codes, material certifications, and procurement approved-product lists vary by municipality, building type, and climate zone"
    - "Offering complexity — each material application is context-specific: substrate type, climate zone, fire rating, acoustic requirements, installation skill required"
  deeperpoint_fit: "KnowledgeSlot curates building code approval processes, certification standards (ISO, ASTM, UL, CCMC), and procurement approved-product list processes. Semantic matching aligns the material's certified performance characteristics with building project specifications — matching not just material category but specific performance requirements (R-value, fire rating, acoustic coefficient, VOC compliance). Facilitator role slots accommodate building envelope consultants, code compliance reviewers, and sustainability certification bodies (LEED, BREEAM, WELL). User aggregation allows multiple sustainable materials startups to present a collective catalog to procurement officers."
  economic_upside: "The global sustainable building materials market is growing at over 10% annually, projected to reach $700 billion by 2030. Canadian construction procurement is increasingly mandated to include sustainable options through programs like the National Green Building Standard, CMHC sustainability requirements, and provincial green building codes. Early-commercialized sustainable materials startups positioned in the procurement pipeline before regulatory mandates crystallize will capture disproportionate market share."

