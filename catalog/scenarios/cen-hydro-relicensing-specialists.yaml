  body: |
    ## Act A - The Market Structure

    Hydroelectric relicensing is a marathon that begins years before the licence expires.
    Assembling the environmental record, the Indigenous consultation documentation, and
    the fisheries compensation plan that a regulator requires for licence renewal takes
    five to eight years of structured prefiling work. Starting that process with a
    consultant who lacks specific relicensing proceeding experience is not a recoverable
    mistake: the gaps in a regulatory record cannot be remedied mid-proceeding without a
    reset that costs years.

    Canada is entering a relicensing wave. Licences issued in the 1980s under a simpler
    regulatory framework are now up for renewal under the Indigenous consultation obligations
    introduced by UNDRIP alignment, the expanded environmental assessment requirements of
    the Impact Assessment Act, and the CER's Integrated Review Process. The consultants
    who have navigated these new requirements number in the dozens nationally. The demand
    for their services from facilities entering the relicensing queue simultaneously is
    already competitive.

    ---

    ## Act B - The Story

    **Margaret** manages regulatory affairs for a Quebec IPP that operates three run-of-river
    facilities on rivers in the Côte-Nord region. One facility's CER licence expires in
    eight years—requiring prefiling work to begin now. The relevant Indigenous stakeholders
    are Innu communities whose territorial claims and environmental monitoring concerns
    have evolved significantly since the original licence was issued. She has sent RFPs to
    four Montreal environmental firms. Two have hydro experience but no Innu engagement
    history. One has Innu experience but has never been a party to a CER relicensing
    proceeding. The fourth is fully committed to a major Hydro-Québec proceeding.

    **Antoine** spent eleven years at the federal NEB (now CER) before founding a specialty
    hydro regulatory practice in 2018. He has successfully taken two Quebec run-of-river
    facilities through CER Integrated Review Process relicensing—one with Innu community
    participation as an Intervenor. He has the proceeding history, the regulatory record
    management methodology, and an established relationship with the Innu environmental
    liaisons from the previous proceeding. He doesn't respond to cold RFPs because his
    practice is always full through established client relationships. He is not in Margaret's
    network.

    Margaret queries the platform: CER jurisdiction, run-of-river facility type, Côte-Nord
    Innu territory context, IRP proceeding experience required. Antoine's profile surfaces
    with CER proceeding history, Innu engagement track record, and current availability.
    Margaret contacts Antoine directly with the facility specifications. He reviews the
    proceeding requirements and agrees to lead the regulatory team. The prefiling program
    begins on schedule. The orderly eight-year relicensing proceeding prevents the production
    disruption that a licence gap would cause.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Hydroelectric relicensing is one of the highest-stakes regulatory processes in Canadian
    energy, and the expertise required to navigate it is concentrated in a small number of
    consultants whose availability is entirely relationship-gated. DeeperPoint builds the
    specialist registry that ensures regulatory expertise reaches every facility operator
    who needs it—not just those with the right utility network contacts.

    *Characters are fictional. The Canadian hydro relicensing wave and the specialized
    consultant pool it requires are real. [DeeperPoint](../../marketforge.html) is building
    the infrastructure this story describes.*
