market_example:
  summary: A specialist matching platform connecting Canadian hydroelectric facility operators
    facing federal CER relicensing hearings or provincial water licence renewals with
    environmental, regulatory, and Indigenous engagement specialists who have specific
    relicensing process experience—a thin consultant pool whose expertise is irreplaceable
    in a regulatory process where the wrong advisor can cost years of delays.
  problem: "Canada's hydroelectric infrastructure—over 500 facilities, the backbone of
    Ontario, Quebec, Manitoba, and BC's electricity systems—operates under water licences
    and generation licences that require periodic renewal, ranging from 20 to 40 years.
    The relicensing process under the Canadian Energy Regulator (for federally regulated
    facilities) and provincial equivalents involves multi-year regulatory proceedings with
    Indigenous consultation obligations, environmental flow studies, fisheries habitat
    assessments, and competing water use negotiations. The process is extraordinarily
    specialized: a consultant who has successfully navigated a Complex Assessment under
    the CER's Integrated Review Process for the renewal of a run-of-river facility on
    the Peace River has a fundamentally different expertise profile from one who has
    managed a storage reservoir relicensing under the BC Environmental Assessment Act.
    The number of Canadian consultancies with genuine relicensing proceeding experience
    is extremely small—perhaps eight to twelve firms nationally with a track record of
    completed relicensing hearings. When a provincial utility or independent power producer
    initiates a relicensing process, they must retain this expertise quickly enough to
    build the record over the multi-year prefiling period. The informal network of utility
    regulatory affair departments circulates advisor names through peer contacts—a discovery
    mechanism that systematically disadvantages smaller independent power producers without
    established utility regulatory networks."
  dominant_forces:
    - "Canada's aging hydroelectric fleet faces a relicensing wave: dozens of facilities
