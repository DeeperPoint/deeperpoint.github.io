market_example:
  summary: A structured matching platform connecting provincial orphan well management
    organizations and financial assurance administrators with specialty well abandonment
    and land reclamation contractors—reducing the 15–25 year reclamation backlogs
    accumulating under the Alberta Energy Regulator and BC Oil and Gas Commission by
    matching program work packages to available contractor capacity in real time.
  problem: "Canada has an orphan well liability crisis. Alberta alone carries over 70,000
    documented orphan and inactive wells; BC, Saskatchewan, and Manitoba have tens of thousands
    more. These are wells whose operators have gone bankrupt or surrendered licences without
    completing plugging, casing removal, and land reclamation—leaving the provincial regulator,
    the Orphan Well Association, and landowners holding environmental liabilities that will cost
    an estimated $30–70 billion to remediate over the coming decades. Federal and provincial
    governments have committed billions in Orphan Well Cleanup programs and Emissions Reduction
    Fund grants to accelerate remediation—but the money is being absorbed slowly because the
    contracting infrastructure is not efficiently connecting the program administrators who
    have work packages with the specialty contractors who can execute them. Well abandonment
    and surface reclamation require specific equipment (pulling units for casing recovery, cement
    pump trucks for plug placement, environmental drilling for soil sampling, revegetation
    contractors for land restoration) and regulatory approvals specific to the AER's Directive
    020 and 079 requirements. These contractors are specialized and regional; an abandonment
    contractor working in the Peace Country is not mobilizing to Medicine Hat without
    significant incentive. The program administrators—Orphan Well Association, provincial
    financial security administrators—are managing portfolios of thousands of wells and do
    not have structured mechanisms to optimally batch work packages by geography and
    contractor capability."
  dominant_forces:
    - "Federal and provincial remediation program funding is available and committed—the
      bottleneck is not money, it is the matching efficiency between work packages and qualified
      contractors organized by geography, equipment capability, and regulatory certification."
    - "AER Directive compliance requirements for well abandonment (Directive 020, 079) are
      specific to well type and vintage—not all abandonment contractors have the equipment
      or compliance history for every well class."
    - "Geographic batching of abandonment work packages dramatically reduces unit costs
      by minimizing contractor mobilization distances—but manual batching by program administrators
      managing 10,000-well portfolios is operationally impossible without automated optimization."
  deeperpoint_fit: "KnowledgeSlot encodes the AER and provincial well abandonment directive
    requirements by well type, depth, and era—the compliance specifications differ for pre-1995
    wells, sour gas wells, and multi-zone completions. CoSolvent optimizes geographic work
    package batching: clustering orphan wells by location and equipment requirements to minimize
    contractor mobilization costs, then matching each optimized cluster to available contractors
    whose equipment, AER compliance history, and current scheduling windows fit. The logistics
    module tracks work order completion status against regulatory filing deadlines."
  economic_upside: "Canada's orphan well remediation program represents $30–70B in long-term
    contracting. The annual federal Emissions Reduction Fund committed $1.7B in 2020–2022 alone.
    A 15% improvement in contractor matching efficiency on a $500M annual program represents
    $75M in additional clean wells completed annually. Government program administrators are
    the natural platform sponsor—the efficiency gain is directly measurable."
