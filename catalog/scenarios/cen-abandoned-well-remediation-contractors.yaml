    individually tendered jobs."
  body: |
    ## Act A - The Market Structure

    Orphan well remediation is a public environmental obligation masquerading as a logistics
    problem. The money to do the work exists—federal and provincial programs have committed
    billions. The contractors to do the work exist—hundreds of abandonment and reclamation
    companies operate across western Canada. What does not exist is the operational infrastructure
    to match the two efficiently at scale.

    The core inefficiency is geographic. An abandonment contractor mobilizing a pulling unit,
    a cement pump truck, and a crew from Grande Prairie to a single well 80 kilometres away
    and back again is spending 30% of the job budget on mobilization. If that same contractor
    could batch 15 wells within a 40-kilometre radius into a single two-week work program,
    the mobilization cost is divided by 15. The Orphan Well Association knows this. The
    problem is that manually optimizing the geographic batching of 10,000 wells against
    the regional availability calendars of 200 contractors is a combinatorial problem that
    spreadsheets cannot solve.

    ---

    ## Act B - The Story

    **Sara** has just received 340 additional wells in the Peace Country following the bankruptcy
    of a mid-tier Peace River operator. She needs to integrate them into her active remediation
    queue without blowing her contractor contracting budget. Manual batch assembly for 340 wells
    using her current process—spreadsheet geography, contractor phone calls, open bid processes
    for each cluster—will take eight months of admin time before a single abandonment is completed.

    **Dale** runs a fleet of six abandonment units operating primarily in the Grande Prairie
    and Dawson Creek areas. His Q3 calendar has six weeks of available capacity between
    a major operator pre-sale abandonment program ending in July and a BC OGC program starting
    in September. He typically fills these gaps through the OWA tender process, but the
    geographic matches from generic OWA tenders are usually poor—he ends up driving past
    a cluster of wells he could have done efficiently to get to the tendered job 200 kilometres
    away.

    Sara uploads the 340 wells to the platform with their AER well classification and
    geographic coordinates. The platform's clustering algorithm groups them into 23 optimized
    work packages by contractor mobilization efficiency, matching each cluster's well types
    and AER directive requirements against registered contractor capabilities. Dale's fleet
    surfaces as the highest-efficiency match for a cluster of 18 Peace Country wells—all
    within 35 kilometres of his Grande Prairie yard, all within his equipment's well depth
    rating. The work package assignment is made in three days rather than eight months.
    Dale's Q3 gap is filled with profitable work 40 minutes from his yard. Per-well
    abandonment cost: 28% below the open tender average.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The orphan well crisis is solvable with the money and contractors that already exist.
    What is missing is the geographic optimization and contractor matching infrastructure
    that turns a disorganized backlog into an efficiently executed program. DeeperPoint
    builds the matching engine that makes remediation programs deliver their full environmental
    and economic potential.

    *Characters are fictional. Alberta's orphan well backlog and the OWA remediation program
    are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story
    describes.*
