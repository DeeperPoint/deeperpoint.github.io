      benchmarking data to assess whether their risk governance is adequate relative to
      sector peers and regulatory expectations. The platform's aggregated ERM framework
      data across matched organizations in similar regulatory environments is the primary
      available source for mid-market ERM benchmarking intelligence — a data product that
      only exists because the matching platform assembled the underlying governance relationships."
    recurring: true

story:
  title: "The Question the Board Couldn't Answer"
  status: draft
  blog_slug: ""
  characters:
    - "Helen - CEO, Ontario credit union, assets under management $600M, Barrie"
    - "Kwame - fractional CRO, FSRA credit union regulatory specialist, Toronto"
  summary: "A mid-size Ontario credit union whose board risk committee cannot answer FSRA's
    ERM effectiveness questions at its triennial examination hires a fractional CRO through
    a specialist matching platform, completes a compliant ERM framework in four months, and
    clears the examination with a satisfactory rating — at one-quarter the cost of a full-time CRO."
  body: |
    ## Act A - The Market Structure

    Ontario credit unions operate under FSRA oversight with formal enterprise risk management
    expectations that have strengthened significantly since FSRA's 2021 Credit Union Guidance.
    The guidance requires a documented ERM framework, a board risk committee with clearly
    defined oversight responsibilities, a risk appetite statement approved by the board,
    and an annual ERM report demonstrating that the framework is operating effectively. For
    a credit union with $1B+ in assets, a dedicated CRO position is expected and common.
    For a $600M credit union in a mid-size Ontario city, the staffing economics are challenging:
    a CRO with FSRA credit union regulatory experience commands $220,000–280,000 in total
    compensation for full-time work, a material overhead for an institution whose operating
    efficiency is under continuous board scrutiny.

    The fractional model is the right answer. A CRO with credit union regulatory experience
    working on a fractional basis provides exactly what the $600M credit union needs —
    board risk committee governance quarterly, ERM framework maintenance annually, examination
    preparation biannually — at a cost structure aligned with the institution's actual need.
    The fractional CRO market exists; the practitioners are senior professionals who retired
    from full-time credit union risk roles or transitioned deliberately to portfolio work.
    They are not findable through the standard executive recruitment process.

    ---

    ## Act B - The Story

    **Helen** has been CEO of a Barrie-based credit union for eight years. Her CFO chairs
    the board risk committee and produces a risk report at each board meeting. The format
    satisfies the board's general understanding. When FSRA's triennial examination team
    arrived and asked the board risk committee chair to walk them through the risk appetite
    statement, explain how the heat map was constructed, and describe the risk escalation
    protocol for risks that breached their tolerance thresholds, the answers were not
    organized at the level the examiners required. FSRA's examination report noted an
    ERM framework deficiency and required a remediation plan within ninety days.

    **Kwame** spent fourteen years as CRO and Deputy CRO at Ontario credit unions before
    transitioning to a portfolio of four fractional CRO engagements. His entire career
    has been in FSRA-regulated credit union risk management. He can build an FSRA-compliant
    ERM framework in his sleep. He is currently working with three credit unions in other
    Ontario cities at 20–25 hours per month each. He has capacity for a fourth engagement.
    Helen's executive recruiter cannot find him — he is not on LinkedIn as actively seeking
    roles, has no public-facing advisory profile, and receives his engagements through
    retired CRO peer referrals.

    Helen's institutional risk profile — credit union, $600M assets, FSRA regulatory
    environment, ERM framework deficiency, board governance gap — surfaces Kwame's
    fractional CRO profile on the specialist platform. Kwame's expertise descriptor:
    FSRA credit union ERM frameworks, risk appetite statement design, board risk committee
    governance, triennial examination preparation. Helen engages him at 25 hours per month.
    In four months, Kwame has built a compliant risk register, facilitated a board-approved
    risk appetite statement, redesigned the board risk committee reporting format, and
    prepared a complete examination response package. FSRA's follow-up review issues a
    satisfactory rating. Total engagement cost for twelve months: $92,000.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Helen's credit union needed approximately 300 hours of CRO-level work in the twelve
    months following the FSRA examination notice. Kwame had exactly that capacity available
    and exactly the regulatory expertise required. The market failed because Helen's
    recruitment process reached the general executive market, not the specialized domain
    of fractional CROs with FSRA credit union experience — a population of perhaps forty
    professionals nationally whose availability and expertise are not aggregated anywhere
    a buyer can query.

    Every Ontario credit union approaching a triennial examination, every PE-backed mid-market
    company whose institutional board is enforcing ERM standards, every mid-size cannabis
    producer building a Health Canada licensing risk management framework — each has a
    fractional CRO need that the specialist market can satisfy, and no mechanism to find
    the right specialist.

    *Characters are fictional. FSRA credit union ERM requirements and the economics of
    fractional CRO arrangements are factual. [DeeperPoint](../../marketforge.html) is
    building the infrastructure this story describes.*
