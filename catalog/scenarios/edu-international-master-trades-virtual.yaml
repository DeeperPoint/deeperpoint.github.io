    recurring: true

  - title: "Equipment Manufacturer Training Bundles"
    type: commerce-extension
    revenue_model: "Co-marketing fee from European machine tool manufacturers ($5,000–$20,000/year). Machine tool buyers (Mazak, DMG Mori, Hermle, Heidenhain control users) are matched with master mentors from manufacturing sectors that use the same equipment — turning the platform into a machine commissioning and training channel."
    strategic_logic: "A Canadian manufacturer who buys a Swiss five-axis machining centre from a European supplier needs application knowledge from experienced operators — not just the factory training on machine operation. The platform is the broker between deep application knowledge in European shops and Canadian machine buyers."
    recurring: true

  - title: "Trades Language KnowledgeSlot Commerce"
    type: commerce-extension
    revenue_model: "Subscription access to bilingual precision trades terminology databases ($200–$600/year per user). English/German, English/Czech, English/Italian terminology for GD&T, cutting parameters, surface finish specifications, quality management systems."
    strategic_logic: "The first barrier in any cross-border mentorship session is terminology. A bilingual trades terminology KnowledgeSlot that a Canadian apprentice can open during a session with a German master reduces misunderstanding and builds vocabulary simultaneously — a platform-generated network effect that increases the value of every session."
    recurring: true

story:
  title: "The Tolerance He Didn't Know to Hold"
  status: draft
  blog_slug: ""
  characters:
    - "Radek Novotný - Czech master machinist (Mistr řemesla), retired from Škoda Machine Tool, Plzeň"
    - "Josh MacIntyre - third-year CNC machining apprentice, aerospace component shop, Winnipeg"
    - "Sandra Gould - apprenticeship coordinator, Magellan Aerospace Winnipeg"
  summary: "Josh keeps losing parts to surface finish rejection on aerospace titanium components. His journeyman mentor is excellent on setups but has never worked aerospace titanium. Radek spent 22 years machining titanium components for the Czech aerospace industry. Three virtual sessions change Josh's cutting parameter intuition in a way that three years of shop floor learning had not."
  body: |
    ## Act A - The Market Structure

    Canada's aerospace manufacturing sector is concentrated in Quebec, Ontario, Manitoba, and
    British Columbia. The sector requires machined components held to tolerances measured in
    microns on materials — titanium alloys, inconel, hardened tool steels — that behave
    very differently from the aluminum and mild steel that dominate the general machining
    curriculum. Aerospace apprentices learn the curriculum at college and then encounter
    material-specific cutting behaviour on the shop floor, guided by journeymen whose own
    background is mostly general machining.

    The European aerospace machining tradition — particularly Czech, German, and French precision
    component manufacturing — has refined titanium and nickel alloy machining culture over decades
    of Airbus, Rolls-Royce, and Safran supply chain discipline. The cutting parameter databases,
    the surface finish verification protocols, the tool life monitoring disciplines in those shops
    are not secret. They simply have never had a transfer mechanism to Canadian shops.

    ---

    ## Act B - The Story

    **Josh MacIntyre** is three years into his machining apprenticeship. He is good at setups,
    reads drawings accurately, and has a feel for the machine that his supervisor recognizes.
    His weak point: titanium surface finish. He is producing parts that pass dimensional
    inspection but fail aerospace surface roughness requirements on the final pass. The rejection
    rate on his titanium components is 11% — twice the shop's target.

    **Radek Novotný** is 62 years old and retired from Škoda Machine Tool's precision aerospace
    component division in Plzeň. He spent 22 years producing titanium and Inconel 718 components
    for the Czech aerospace supply chain — landing gear components, engine brackets, fastener
    seats. He supervised the quality audit for every aerospace-grade component his section produced.
    He retired early and has been consulting informally for small Czech machine shops.

    He registered on the platform through the Czech-Canadian Trades Exchange program, a bilateral
    initiative that the platform's ESDC partnership supports. His profile: master machinist,
    Mistr řemesla certification, titanium and nickel alloy specialty, aerospace supply chain
    quality discipline, Czech and functional German, available for virtual mentorship.

    **Sandra Gould** saw the platform through Magellan's apprenticeship coordination committee.
    She registered Josh's specific gap: surface finish on titanium aerospace components, Grade 5
    and Grade 23, Ra 0.8 μm requirement, rejection rate too high.

    The match is precise. Radek's specialty is titanium finishing discipline. Josh's gap is
    titanium finishing discipline.

    The first session runs ninety minutes. Radek opens with a question in English (slow, careful):
    "Tell me exactly what your last cut looks like. What speed. What feed. What tool. What coolant
    pressure." Josh answers. Radek identifies the problem immediately: Josh is using flood coolant
    at standard pressure for titanium — wrong. Titanium needs high-pressure through-spindle coolant
    for finishing passes to prevent the built-up edge that degrades surface finish.

    Josh's shop has high-pressure coolant capability on the machine. No one had told him to use it.

    In the second session, Radek walks him through tool nose radius selection for Ra targets —
    a calculation Josh had never been taught. In the third session, they review Josh's cutting
    parameter log together: Radek identifies the specific r.p.m. range where Josh is generating
    chatter without seeing it.

    Josh's rejection rate on titanium drops to 3.2% within six weeks. His journeyman supervisor
    calls it "the best improvement from one apprentice I've ever seen in a quarter."

    Sandra books Radek for a half-day virtual session with the full apprentice cohort.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Radek's titanium machining knowledge is freely available inside his head. It was always
    available — he simply had no mechanism to share it with Canadian apprentices who needed
    it, and they had no mechanism to find him.

    The knowledge gap between European aerospace machining culture and Canadian aerospace
    machining culture is real, documented by manufacturers like Magellan and Bombardier,
    and costs the sector in quality rejections and process iteration time every week.
    The solution — structured, documented knowledge transfer from European masters to
    Canadian apprentices — is obvious. The infrastructure to deliver it has not been built.

    Virtual mentorship, structured around specific skill targets, in a bilingual environment
    that accommodates the language gap, with competence milestone documentation that feeds
    into Josh's apprenticeship record — this is not a workaround. It is a better model
    than the one-off site visit that costs $30,000 and evaporates in three months.

    Canada imports Czech precision culture every time it buys a Škoda or DMG Mori machine.
    Now it can import the knowledge that made the machine worth buying.

    *Characters are fictional. Czech aerospace machining tradition, Magellan Aerospace's
    Winnipeg operations, Czech-Canada CETA workforce provisions, and titanium surface finish
    challenges in aerospace machining are real. [DeeperPoint](../../marketforge.html) is
    building the infrastructure this story describes.*
