market_example:
  summary: "A newly arrived Afghani refugee family in Winnipeg has a settlement worker for the practical matters. What they don't have is another Afghani family who arrived under similar circumstances and can share what the first two years actually feel like — not the official guide version, but the real one. The market matches refugees to peer companions on origin country, persecution context, arrival pathway, and family composition. [Note: Due to the marginal commercial value of transactions in this market, MarketForge deployment in this scenario is entirely dependent on philanthropic, public-sector, or non-profit sponsorship.]"
  problem: "Canada resettles 40,000–50,000 refugees per year through government-assisted and privately sponsored pathways. Settlement services — language classes, housing assistance, employment support — are available through a network of funded settlement agencies. What is structurally unavailable is peer connection: a match to another refugee who fled a similar persecution context, navigated a similar arrival pathway, speaks the same language, and has been in Canada long enough to have real knowledge of what works and what doesn't — but is not a professional counsellor, a settlement worker, or a community organization volunteer. The distinction matters because the questions that determine quality of life in the first two years of Canadian settlement are not answered by settlement workers or official guides: How did you explain to your children what happened to their grandmother and whether she is safe? How did you find a doctor who understood what you came from without making it a diagnosis? How did you handle the moment when your teenage daughter wanted to wear what her Canadian classmates wear and you weren't sure what you believed about it any more? What do you do with the anger? These questions require a peer — someone who has lived through the same experience, not someone trained to support people who have. The matching problem is that the refugee population in any given Canadian city is dispersed across dozens of origin countries, arrival pathways, and persecution contexts; a matching infrastructure that finds the right peer rather than the nearest peer is not available through settlement agencies, which organize by language group and community organization membership, not by experience match."
  dominant_forces:
    - "Experience specificity — a Syrian refugee who fled ISIS-controlled territory has a different peer support need than a Syrian refugee whose persecution was state political; a Somali refugee whose family was separated during transit has different peer needs than one who arrived as a family unit; matching on country of origin alone misses the critical experience dimensions"
    - "Confidentiality sensitivity — refugees may be unwilling to share details of their persecution experience with a settlement agency professional but willing to share with a peer who has made the same disclosure reciprocally; the matching platform must handle this asymmetry carefully"
    - "Geographic dispersal — refugee peer mentors and newly arrived refugees are distributed across hundreds of Canadian cities and towns; remote matching and video peer connection expand the available pool beyond walking distance"
    - "Trauma-informed matching requirements — peer companions must be matched not only on experience but on readiness to serve in a peer capacity; not every refugee who has been in Canada for three years is emotionally prepared or appropriate to support a newly arrived family"
    - "Connection without dependency — the peer relationship is most valuable when it is informal and reciprocal, not structured as a service; over-institutionalized matching creates a counsellor substitute rather than a peer friend"
  deeperpoint_fit: "MarketForge matches newly arrived refugees to volunteer peer companions using a multi-dimensional profile: origin country, persecution context (war, political, religious, ethnic — at whatever level of specificity the participant is willing to share), arrival pathway (GARs, PSR, BVOR), family composition, language, and current settlement challenges. Peer companions self-select and are matched to no more than two families at a time. The platform facilitates initial connection and provides a structured first-conversation guide to avoid early awkwardness or inadvertent triggers; after that, the relationship is theirs. Settlement agencies can refer clients to the platform as a complement to their services."
  economic_upside: "Refugee peer support programs have documented impact on settlement outcomes (employment rates, mental health, social integration) and reduce downstream costs to the health and social services systems. A platform that scales peer matching across Canada's refugee population — 40,000+ annual arrivals plus 200,000+ refugees currently in early settlement — creates measurable social impact at very low per-connection cost. Immigration, Refugees and Citizenship Canada (IRCC) and provincial settlement funding bodies are the natural funders; a per-connection grant structure or annual platform license generates sustainable revenue. United Way, settlement agencies, and private refugee sponsors are additional funding channels."

