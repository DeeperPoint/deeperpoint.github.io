story:
  title: "The Question She Couldn't Ask Her Settlement Worker"
  status: published
  blog_slug: ""
  characters:
    - "Fatima — Afghani refugee, 38, in Winnipeg; arrived 14 months ago with her husband and three children through the government-assisted pathway; speaks Dari; has a settlement worker she trusts for practical matters; has a question she cannot ask a professional"
    - "Layla — Afghani-Canadian in Hamilton; arrived six years ago with her husband and two children; was matched through the platform nine months ago to support newly arrived families"
    - "The question — about Fatima's sixteen-year-old daughter, who has stopped speaking Dari at home; about what this means and what to do about it, if anything"
  summary: "Fatima's settlement worker has handled everything she asked about. Fatima hasn't asked the question that matters most to her — about her daughter, about language, about what she is allowed to want — because she doesn't know how to frame it to someone who hasn't lived it. Layla has lived it."
  body: |
    ## Act One: The Professional Limit

    Fatima's settlement worker, Denise, was excellent. She had helped the family navigate Manitoba's education system enrollment, their health cards, their work permit applications, the maze of federal and provincial programs. She had a list of answers and she gave them without making the family feel dependent on the list.

    Fatima trusted Denise. She had not told Denise the thing she was actually thinking about.

    Her sixteen-year-old daughter Maryam had stopped speaking Dari at home. Not dramatically — not as a statement — but incrementally, the way a stream changes course over a season. English answered questions. English came back from school. English texted friends Fatima had never met. English laughed at things Fatima didn't understand.

    Fatima had questions she didn't know how to formulate. Was this normal? Was she supposed to insist on Dari? Was she supposed to want Maryam to insist? What did it mean that she sometimes felt proud of how quickly Maryam was becoming Canadian and sometimes felt as though she was watching something irreplaceable dissolve?

    She could not ask Denise these questions. Denise would listen carefully and provide resources — child and family services, multicultural counselling, a Dari-speaking social worker. All of which would formalize a problem Fatima was not sure was a problem.

    She needed someone who had already lived through it and come out the other side.

    ---

    ## Act Two: Layla's Answer

    Layla had been matched to two families in the past year. The platform had been careful about the match — it had asked her, during onboarding, about her experience and her emotional readiness, and had suggested she start with one family before taking a second. Her first match had been a practical one: a family from Kabul who needed to understand how the Manitoba winter worked and how to navigate grocery shopping in a city where halal butchers were concentrated in one neighborhood. She had been to that neighbourhood. She had given them the list.

    Her second match — Fatima's family — had surfaced a different kind of question. Fatima's first message, through the platform's introductory prompt, had been careful and formal. But by the third conversation, she had asked about Maryam.

    Layla's answer was not a resource. It was a story. Her oldest son had done the same thing at the same age. He now spoke Dari only with her, and English with everyone else, and had told her last year that maintaining Dari was one of the best decisions she had made as a parent — because it was the only language in which he could talk to his grandmother. She had cried when he said that.

    She had not insisted on Dari. She had kept it present. That was the difference, she told Fatima. Not enforcement. Presence.

    Fatima didn't cry during the call. She cried a little after it, which she told Layla the following week was a different kind of crying than she had been doing for fourteen months.

    ---

    ## Act Three: The Question She Asked Next

    The following month, Fatima referred another family from her settlement agency — a newly arrived couple from Herat who spoke only Dari and needed someone to explain what the first winter would feel like. Not the temperature. The feeling.

    Fatima told them. Not because she had been trained to. Because Layla had told her, and it had helped.

    *Characters are fictional. Canadian government-assisted refugee resettlement processes, Manitoba settlement infrastructure, and the documented impact of peer support on refugee settlement outcomes are real. [DeeperPoint](../../marketforge.html) is building the matching infrastructure this market requires.*
