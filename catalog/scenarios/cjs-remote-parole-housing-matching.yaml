market_example:
  summary: "Matches inmates nearing parole eligibility with highly specific, verified halfway houses or transitional housing slots across the province, preventing parole denial due to 'no fixed address'."
  problem: "Thousands of inmates in Canadian prisons are eligible for parole but are denied release entirely because they lack a verified, safe housing plan. Parole officers are overwhelmed and rely on manual phone calls to halfway houses that are usually full. Consequently, the state spends $120,000 a year keeping a rehabilitated individual in maximum security simply because a $1,000/month transitional bed couldn't be located."
  dominant_forces:
    - "Strict Parole Board mandates requiring verified, specific release plans."
    - "A massive national housing crisis severely limiting transitional beds."
    - "The devastating financial and human cost of over-incarceration."
  deeperpoint_fit: "CoSolvent aggregates the real-time bed inventory of every halfway house and transitional shelter across the province. It matches the inmate's specific release conditions (e.g., proximity to addictions counseling, geographic restrictions) to the optimal vacancy. CommonContext securely manages the risk-assessment data."
  economic_upside: "A 10% reduction in delayed parole due to housing issues saves Correctional Services Canada (CSC) tens of millions of dollars annually. Platform monetized via enterprise SaaS."

