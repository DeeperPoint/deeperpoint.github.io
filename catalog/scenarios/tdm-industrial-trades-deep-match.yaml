      document corpus ingestion, semantic indexing, ongoing candidate matching alerts, and
      match explanation generation); candidate profile hosting (free to candidate, funded
      by employer subscription model)."
    strategic_logic: "Employers with persistent specialized hiring needs — precision machining,
      maintenance and reliability, toolroom management — pay subscription for continuous
      access to matched candidates as profiles enter the system, rather than paying per-post
      fees on job boards that generate high-volume irrelevant applications. The persistent
      profile model aligns platform economics with placement success rather than post volume."
