id: tdm-industrial-trades-deep-match
title: "Rich-Profile Semantic Matching for Specialized Industrial Trades and Skilled Technicians"
card_title: "Specialized Trades Deep-Profile Matching"
sector: talent-deep-match
sub_sector: Industrial Trades and Technical Workforce
forge_tier: 2
status: published
tags: [talent-matching, trades, skilled-workers, industrial, machinist, millwright, toolmaker, CNC, maintenance, semantic-matching, rich-profile]

market_example:
  summary: "Industrial employers searching for machinists, millwrights, toolmakers, and
    precision technicians cannot evaluate candidates through a job description and resume
    alone — the work that matters is in the machine logs, maintenance records, and process
    notes a skilled tradesperson produces. A rich-document matching platform lets employers
    upload technical context and candidates upload work evidence, then semantically matches
    across the full corpus."
  problem: "A precision machining shop looking for a CNC programmer with five-axis mill
    experience on Mazak Smooth technology is not looking for someone who lists 'Mazak' on
    their resume. They are looking for someone who has solved the same class of problem
    their shop solves — who has set up the same complex fixture geometries, who has dealt
    with the same titanium and Inconel cutting parameter challenges, who has written G-code
    that deals with the same tolerance requirements. That knowledge is not expressed in
    a job description and cannot be evaluated from a resume. It is expressed in the setup
    sheets the machinist wrote, the process improvement notes they documented, the quality
    logs they maintained, the work instructions they developed for a training successor.
    Standard job boards match on keyword proximity: 'CNC' and 'Mazak' appearing in the
    same resume. This produces a candidate pool of everyone who has listed those keywords —
    which includes the person who used a Mazak once on a training course and the person
    who has programmed Mazak five-axis machines in production for eight years. The employer
    cannot distinguish them from a resume. They can distinguish them from a setup sheet.
    The rich-profile matching model changes the matching input on both sides: the employer
    uploads the job description plus the process documentation, machine logs, and work
    instructions that the outgoing or ideal incumbent would have produced; the candidate
    uploads their resume plus their own setup sheets, process notes, quality logs, training
    materials they developed, and awards or recognition they received. The semantic matching
    engine operates across the full document corpus on both sides — finding the candidate
    whose work product evidence most closely matches the evidence of what the job actually
    requires. The profile stays live and searchable until the position is filled or withdrawn,
    enabling matches that emerge over time as new candidates enter the market."
  dominant_forces:
    - "Skilled trades qualification is work-evident rather than credential-evident: the
      work product a skilled tradesperson produces — setup sheets, process notes, quality
      logs, maintenance records — contains far more evaluable signal about their specific
      competence than the credential listing on their resume, but standard job boards have
      no mechanism to ingest, index, or semantically match on work product evidence."
    - "The trades labour shortage in Canada creates a thin market where employers compete
      for the same small pool of highly qualified candidates — but the matching process
      is so inefficient that the right candidate for a specific shop is invisible behind
      the noise of partially qualified candidates who pass keyword filters, creating false
      scarcity where the supply-demand gap is partly a matching infrastructure gap."
    - "Career transitions and non-linear credentials — a skilled machinist who learned
      on the job at a single employer for fifteen years without formal certification, or
      a recent trades graduate with exceptional talent whose credential does not distinguish
      them from classmates — are particularly poorly served by keyword matching, which
      rewards credential signalling over demonstrated competence."
  deeperpoint_fit: "The rich-profile talent matching model extends CoSolvent's semantic
    matching architecture to the employment market. KnowledgeSlot encodes the technical
    vocabulary of specific trade domains — machining, millwright, toolmaking, instrumentation,
    welding — enabling semantic interpretation of both the employer's technical context
    documents (process documentation, machine manuals, quality standards, work instructions)
    and the candidate's work evidence documents (setup sheets, process notes, award citations,
    project writeups). The Generative Match Story explains to the employer why a specific
    candidate's documented work experience matches their technical context — not just that
    'Mazak' appears in both documents, but that the specific fixture setup approaches and
    tolerance management strategies the candidate documented match the problems the employer's
    process documents reveal."
  economic_upside: "The Canadian skilled trades talent shortage is estimated at 250,000
    unfilled positions annually, with industrial machining, millwright, and precision
    technician roles among the hardest to fill. The average cost of an unfilled industrial
    trades position is estimated at $35,000–80,000 per year in lost production, overtime,
    and recruitment costs. A platform filling 5,000 trades placements annually at average
    platform fees of $2,000–5,000 per successful placement generates $10–25M in annual
    placement facilitation revenue, with additional subscription revenue from employer
    profile maintenance and candidate document hosting."

