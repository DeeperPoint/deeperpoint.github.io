market_example:
  summary: "A Halifax marine electronics firm has won a contract to supply sonar processing hardware to the Royal Australian Navy. The export requires a Canadian export permit under the Export and Import Permits Act and an ITAR Technology Control Plan because some components trace to US-origin technology. There are fewer than forty lawyers in Canada with actual Export Control List and ITAR dual-use transaction experience. The firm's IP lawyer has never filed an export permit."
  problem: "Canada's Export and Import Permits Act (EIPA) and its relationship with US International Traffic in Arms Regulations (ITAR) create a compliance environment for military technology exports that is genuinely complex and served by an extremely thin pool of qualified practitioners. A Canadian defence SME that has developed a technology with export potential to allied militaries — Five Eyes partners, NATO allies, Global Affairs Canada-approved destinations — faces an export control compliance journey that requires expertise in Canadian Export Control List classification, US ITAR ''see-through'' rule application to Canadian-manufactured products with US-origin components, Controlled Goods Program registration, Australian DSGL or UK EAR equivalent requirements at the receiving end, and the specific Technology Control Plan documentation that the Canadian Commercial Corporation (CCC) requires for government-to-government export arrangements. This expertise is concentrated in a handful of Ottawa-based legal practices and one or two specialized compliance consultancies. Firms outside Ottawa — and most Canadian defence SMEs are outside Ottawa — have no efficient mechanism to find the right practitioner for their specific transaction, no way to distinguish a generalist export lawyer from one who has actually filed a Category 1 or Category 2 Group 2 ECL application, and no structured mechanism to scope what their transaction actually requires before committing to a legal retainer."
  dominant_forces:
    - "Practitioner scarcity — fewer than 40 Canadian lawyers have genuine EIPA/ITAR dual-use export transaction experience; most are in Ottawa; generalist trade lawyers who accept the file without this background create compliance liability, not compliance protection"
    - "Transaction complexity variation — a direct commercial export under a Category 5 ECL permit is structurally different from a CCC government-to-government contract with US technology content; SMEs cannot assess which type of expertise their transaction requires without already having specialized knowledge"
    - "US ITAR see-through risk — Canadian-manufactured products with US-origin components are subject to US ITAR re-export requirements even when exported under a Canadian permit; most Canadian SMEs do not know this until after a proposed transaction is rejected or flagged by their US component supplier"
    - "Timing pressure — export permit processing timelines at Global Affairs Canada range from 6 weeks to 18 months depending on destination, technology class, and end-user certificate requirements; SMEs that begin compliance work after contract signature routinely miss delivery obligations"
    - "Controlled Goods Program status — CGP registration (required for access to controlled goods and for most defence export transactions) takes 6–12 months; SMEs without CGP status cannot legally tender on or execute certain defence contracts regardless of capability"
  deeperpoint_fit: "MarketForge lists defence export control practitioners by specific competence: ECL category experience (Groups 1–7), ITAR dual-use transaction experience, CCC export arrangement experience, CGP registration consulting, destination-country equivalent regulation (Australian DSGL, UK EAR, EU dual-use). SMEs post their transaction profile — technology description, destination country, end user type, US-content percentage — and the platform matches to practitioners with documented experience in that specific transaction category. Knowledge Slot provides current ECL category guidance, Global Affairs processing timelines by destination country, and ITAR see-through rule decision trees."
  economic_upside: "Canada's defence exports exceed $3 billion annually, with significant growth anticipated under NATO 2% spending commitments by allies and the Five Eyes technology sharing agreements. A platform that captures 2% of SME defence export transactions as advisory matching clients, at an average transaction advisory value of $15,000 in specialist counsel time, generates $6M in annual matched advisory spend with a 5% platform fee producing $300,000 in revenue at modest penetration. The Canadian Association of Defence and Security Industries (CADSI) and the Canadian Commercial Corporation are natural sponsors with member service value."

