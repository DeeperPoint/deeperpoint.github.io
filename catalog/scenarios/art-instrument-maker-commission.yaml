title: "Instrument Makers: Matching Specialist Luthiers and Instrument Makers to Commissioned Buyers"
card_title: "Specialty Instrument Maker Commission Matching"
sector: arts-cultural-markets
sub_sector: Musical Instrument Making & Craft
forge_tier: 2
