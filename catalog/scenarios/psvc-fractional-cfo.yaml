market_example:
  summary: "Growing SMEs between $2M and $30M revenue need senior financial leadership for specific strategic events — a capital raise, an acquisition, an SR&ED program, a banking covenant renegotiation — but cannot cost-justify a full-time CFO. The fractional CFO market is fragmented, unverified, and opaque to the SME buyers who need it most."
  problem: "The CFO function at a growing SME is not a continuous full-time job — it is a series of intensive project engagements: building a bank package for a growth credit facility, structuring a Series A data room, managing an SR&ED claim, conducting acquisition due diligence, or renegotiating terms after a covenant breach. Experienced CFOs who provide these services on a fractional basis exist in every major Canadian city. The problem is that 'fractional CFO' is an entirely self-designated title with no credentialing body, no standard service definition, and no mechanism for an SME owner to distinguish a former Big Four partner with fifteen M&A transactions from a bookkeeper who added 'CFO services' to their website. The SME owner hires through word of mouth — and the word of mouth network has the same depth limitation as every other thin market: the person who needs a fractional CFO with SR&ED manufacturing experience in a US cross-border context will get three names, not one of whom has that specific background."
  dominant_forces:
    - "Credential opacity — 'fractional CFO' is an unregulated title; the SME owner cannot distinguish depth of experience, sector focus, or transaction type specialization from a website or LinkedIn profile alone"
    - "Offering complexity — the right fractional CFO match requires alignment on company stage, sector, specific transaction type, US cross-border familiarity, and availability for the relevant project window"
    - "Participant scarcity — experienced CFOs with specific transaction type depth (SR&ED, M&A, cross-border banking, Series A structuring) are a small subset of the total 'fractional CFO' market"
    - "Temporal specificity — the need is acute during a specific event window (banking renewal, fundraise, acquisition) and absent between events; the SME cannot maintain a standing relationship with the right person between projects"
    - "Trust deficit — the CFO relationship requires access to the most sensitive financial information in the company; hiring on the word of a generalist accountant is the default because it reduces exposure risk"
  deeperpoint_fit: "Semantic matching encodes practitioner profiles (prior CFO role depth by company stage and revenue range, transaction type specialization by category — SR&ED, M&A, Series A/B structuring, covenant renegotiation, cross-border banking — sector experience, CPA designation and firm pedigree, availability for project engagement) against SME demand signals (company stage, revenue range, transaction type, sector, project timeline, US cross-border dimension). The Generative Match Story helps the SME owner articulate what they need in terms the platform can match, not in terms they must already know."
  economic_upside: "The Canadian fractional CFO market is estimated at $600M–$900M annually, predominantly served through unstructured word-of-mouth referrals. A platform-mediated match that delivers an SR&ED-specialized CFO to a $5M mid-market manufacturer in time for the claim filing window generates $50,000–$150,000 in recoverable SR&ED credits that would otherwise be left on the table. Capital raise engagements generate $300,000–$2M+ in new capital access. The transaction value per matched engagement justifies a platform commission or subscription fee tier well above the SaaS standard."

