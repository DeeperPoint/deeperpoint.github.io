market_example:
  summary: "Mid-value specialized municipal surplus assets — accessible transit vehicles, water quality testing units, sign-making machines — attract few buyers because potential purchasers cannot discover them across 444+ fragmented Ontario municipal portals, losing 40–70% of residual value to scrap."
  problem: "Municipalities regularly decommission assets — vehicles, heavy equipment, office furniture, specialized laboratory equipment, park maintenance machinery — that have significant residual value but are practically difficult to sell. GovPlanet handles high-value construction equipment, but mid-value specialized assets attract few bidders because potential buyers do not know the asset exists or cannot assess suitability without detailed technical specifications. The 444 Ontario municipalities plus thousands more across Canada maintain no unified surplus discovery mechanism."
  dominant_forces:
    - "Opacity — surplus asset listings are fragmented across thousands of municipal websites; no unified discovery mechanism exists"
    - "Offering complexity — each asset's value depends on condition, remaining useful life, maintenance history, fleet compatibility, and post-transfer regulatory compliance"
    - "Search friction — potential buyers (other municipalities, nonprofits, small contractors, international aid organizations) cannot filter across the fragmented landscape"
    - "Fulfillment constraints — specialized infrastructure requires specialized transport and installation"
    - "Trust deficit — buyers cannot inspect assets remotely; sellers cannot attest to condition without liability exposure"
  deeperpoint_fit: "Semantic matching encodes assets by functional capability rather than category code alone — allowing a municipality searching for a small-scale asphalt repair unit to find a decommissioned patching vehicle even if the terminology differs. The three-layer information architecture lets the selling municipality share full technical documentation with serious buyers while maintaining a public summary for discovery. KnowledgeSlot curates municipal surplus disposal regulations, cross-municipal transfer mechanisms (mutual aid agreements, inter-municipal cooperation frameworks), and export regulations for international aid transfers. User aggregation allows regional municipal alliances (AMO, FCM groupings) to pool surplus listings."
  economic_upside: "Municipalities lose significant value through inefficient surplus disposal — assets sold for scrap that would have generated 40–70% of residual value to an appropriate buyer. Better matching generates direct revenue, reduces disposal costs, enables smaller municipalities to acquire equipment they could not afford new, and reduces waste."

sponsor_opportunities:
  - title: "Canadian Municipal Surplus Asset Registry (SaaS)"
    type: saas
    revenue_model: "Annual subscription per municipality ($599–$1,499/year based on asset portfolio volume); association bulk licence (AMO member pricing)"
    strategic_logic: "No national aggregated municipal surplus registry exists in Canada. A platform that builds it becomes the default destination for every municipal asset manager — a natural monopoly achieved through network effects."
    recurring: true

  - title: "Asset Condition Documentation and Valuation Service"
    type: managed-service
    revenue_model: "Per-asset condition report $150–$400; fleet valuation package for 10+ assets $1,000–$2,500"
    strategic_logic: "Buyers will not bid on undocumented surplus assets. A documentary service that produces standardized condition reports reduces bid friction and increases realized prices — the municipality pays for the report and recovers multiples in sale price."
    recurring: false

  - title: "Specialized Equipment Freight and Logistics Coordination"
    type: managed-service
    revenue_model: "Per-shipment coordination fee $300–$800; percentage of freight contract (8–12%)"
    strategic_logic: "Specialized municipal equipment (vehicle lifts, industrial machinery, accessible transit vehicles) requires logistics expertise that neither the selling municipality nor most buyers have. A platform-managed logistics coordination service is the natural complement."
    recurring: false

  - title: "International Aid Transfer Program Management"
    type: managed-service
    revenue_model: "Per-transfer program management fee $1,500–$4,000; international compliance documentation package $600–$1,200"
    strategic_logic: "Municipalities increasingly want to donate decommissioned equipment to international development programs but cannot navigate export permits, customs, and recipient-country regulations independently. A managed program removes the barrier and generates recurring municipal goodwill."
    recurring: false

  - title: "Municipal Asset Logistics, Refurbishment and Remarketing Extension"
    type: logistics-extension
    revenue_model: "Asset transport and logistics coordination fee per item; refurbishment service coordination margin connecting surplus assets to repair vendors (15-20% of value-added); remarketing to secondary markets including smaller municipalities, nonprofits, and developing-country organizations (platform takes 5-10% of sale proceeds); platform earns logistics and commerce margins from every surplus asset transaction it matches"
    strategic_logic: "The municipal surplus asset matching platform accumulates inventory data, logistics routing knowledge, and buyer relationships across the entire municipal surplus market. The natural extension is to move from matching to operating: coordinating transport, managing refurbishment to increase asset value before sale, and actively marketing surplus to secondary buyers not currently in the primary buyer pool. Asset refurbishment converts a matching fee into a commerce margin on the same asset."
    recurring: true

story:
  title: "The Bus That Almost Became Scrap"
  status: published
  summary: "A mid-sized BC municipality is decommissioning two accessible transit buses with functional wheelchair lifts and 80,000 km remaining useful life. A rural Ontario First Nations community is trying to buy its first accessible community van with a budget of $45,000. The gap between them is a discovery problem, not a price problem."
  characters:
    - "Trevor — fleet manager, mid-sized BC municipality"
    - "Chief Councillor Elaine — rural First Nations community, northern Ontario"
  body: |
    ## Act A — The Value That Disappears at Auction

    Municipal vehicle auctions are efficient for commodity assets. A 2019 Ford F-150 with 90,000 km sells for 70–75% of its remaining book value at a well-attended auction. The market is liquid. Buyers are informed. Prices are fair.

    Accessible transit vehicles are different. A purpose-built accessible transit bus — with a hydraulic wheelchair lift, kneeling suspension, and interior tie-downs — is a specialized piece of equipment that a small pool of buyers can use and a large pool of auction bidders cannot evaluate. When one of these vehicles goes to a general municipal auction, it typically sells for 20–30% of residual value to a buyer who may convert it to something else entirely.

    Meanwhile, rural and remote communities — First Nations band councils, disability organizations, small municipalities — are trying to acquire accessible transit vehicles with budgets that make new purchases impossible and used-market navigation difficult. They are not looking at BC municipal auction listings. The BC municipality is not looking at rural Ontario community needs.

    The following is a fictional account of how MarketForge connects a BC fleet manager with a northern Ontario community council before the auction removes the option.

    ---

    ## Act B — The Story

    **Trevor** manages the vehicle fleet for a BC municipality of 40,000 residents. He is decommissioning two accessible transit buses — a 2017 and a 2019 model, both with functional hydraulic lifts, in good mechanical condition, with approximately 80,000 km of useful life remaining under municipal maintenance standards. The municipality's procurement bylaw requires competitive disposal. The last accessible bus went to auction and sold for $18,000. Trevor believes these are worth $45,000–$55,000 each to the right buyer.

    He registers both vehicles on the MarketForge municipal surplus platform after an APTA (American Public Transportation Association) Canada session. Each profile includes: model year, make and model, lift type and testing date, interior configuration, maintenance history, fuel type, regulatory compliance status, and a photo package.

    ---

    **Chief Councillor Elaine** chairs the community council for a First Nations community of 280 band members in northern Ontario. The community has one accessible vehicle — a 2009 minivan with a manual ramp — that is used for elder and disability member transportation to medical appointments. The vehicle is failing. The community has budgeted $45,000 for a replacement from a Lands and Economic Development fund allocation.

    The community registered on the platform after a First Nations infrastructure advisor mentioned it. Their need profile specifies: accessible transit vehicle, hydraulic lift preferred, 15+ passenger capacity, diesel or propane, budget $40,000–$55,000, willing to arrange freight from any Canadian province.

    The platform matches Trevor's 2019 bus against the community's need profile. Lift type: hydraulic, tested within 6 months — matches preference. Capacity: 20 passengers — meets requirement. Budget range: listed at $48,000 — within range. Freight: the platform's logistics facilitator network includes a company that serves BC–Ontario haul routes for municipal equipment.

    Both receive a match notification.

    ---

    The **Generative Match Story** describes the transaction pathway: the inter-municipal / government-to-government transfer mechanism available under the federal Surplus Crown Asset framework (which includes First Nations band council purchases), the documentation required for CMHC Lands and Economic Development fund disbursement, and the freight logistics for a BC–Ontario equipment move. It notes that the CFO Lands and Economic Development fund administrator will require a condition report certified by an independent mechanic before approving the purchase.

    Trevor reads the scenario. The Lands and Economic Development fund administrator requirement — he hadn't known the buyer needs an independent inspection — is a step he can facilitate locally. He contacts the platform's logistics coordinator.

    Chief Councillor Elaine reads the scenario. The Crown Asset transfer mechanism is unfamiliar to her band administrator, but the reference to the specific DISC program clause is enough to forward to their legal advisor for confirmation.

    The condition report is completed. The purchase is approved. The bus departs BC for northern Ontario seven weeks after the match notification.

    Trevor's municipality recovered $48,000 — more than double what the last bus brought at auction. The community has a functional accessible vehicle for the first time in fifteen years.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Trevor's bus and Elaine's community need were always a good match. The price was in range, the specifications aligned, and both parties were motivated. The only barrier was geography and the absence of any discovery mechanism that could close a 4,000 km information gap.

    Municipal surplus disposal systems are designed around the auction model — efficient for liquid markets, destructive of value in thin ones. Specialized assets in thin buyer markets sell for scrap prices at auction not because they have scrap value but because the auction mechanism cannot find the buyer who needs them.

    What [thin market infrastructure](../../thin-markets.html) does is replace the auction's broadcast mechanism with a directed search — finding the specific buyer who needs the specific asset and providing both parties the transactional context they need to complete the deal without a general auction intermediary.

    *Characters are fictional. The asset disposal frameworks, Lands and Economic Development programs, and inter-municipal transfer mechanisms described are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
