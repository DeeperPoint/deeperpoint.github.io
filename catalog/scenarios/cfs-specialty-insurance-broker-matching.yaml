story:
  title: The Coverage Gap
  status: draft
  blog_slug: ""
  characters:
    - "Priya - CFO, AI-powered medical diagnostics company, Waterloo"
    - "Alastair - Specialty Lines Broker, Lloyd's coverholder for technology and professional risks, Toronto"
  summary: "A Waterloo AI medical diagnostics company seeking professional liability coverage
    for AI-assisted clinical decision support—a risk category most brokers cannot place—
    finds the only Lloyd's coverholder with AI medical professional liability underwriting
    authority in Canada through a specialty insurance matching platform."
  body: |
    ## Act A - The Market Structure

    Insurance markets are efficient at pricing risks they understand. The moment a risk
    steps outside the underwriting experience of standard market insurers—a new business
    model, a new technology, a jurisdiction-specific liability exposure—the market
    becomes thin. The risk is still insurable in principle; a Lloyd's syndicate or
    specialty MGA will underwrite it. The question is whether the buyer can find the
    right broker who has the right market access to place it.

    The standard commercial broker—even a large one—covers their specialty appointment
    portfolio well. Outside that portfolio, they are placing risks by asking around,
    making London calls at odd hours, and hoping that their Lloyd's correspondent has
    appetite this quarter. The buyer has no visibility into any of this. They believe
    their broker is working the market; they don't know that their broker doesn't have
    the direct appointment that the risk requires.

    ---

    ## Act B - The Story

    **Priya** needs professional liability insurance for her company's AI diagnostic platform—
    software that assists radiologists in reading MRI and CT scans and that classifies
    findings in clinical notes. The platform is CE-marked and Health Canada Class II cleared.
    Her liability exposure is professional medical services liability: if the AI misclassifies
    a lesion and the radiologist acts on the AI annotation, the resulting harm is a medical
    professional liability claim with an AI component. Three standard commercial brokers
    have submitted her risk to their carriers. All three declined: none of their standard
    malpractice carriers underwrite AI-assisted clinical decision support liability as a
    primary risk. One broker offered a technology E&O policy that explicitly excluded
    clinical decision support applications.

    **Alastair** holds Lloyd's coverholder authority in a specific niche: technology and
    AI professional liability for healthcare applications. He has placed seven AI medical
    liability programs through Lloyd's syndicates with appetite for this risk class. His
    practice serves 40 companies in the healthcare AI sector across Canada and the UK.
    He has never received an inquiry from Priya's company or her brokers—none of them
    knew he existed.

    Priya queries the specialty insurance platform: risk class (AI professional liability,
    medical/clinical), jurisdiction (Canada), primary risk type (clinical decision support
    misclassification), coverage requirement ($10M occurrence). Alastair's coverholder
    profile surfaces with specific Lloyd's authority for healthcare AI professional liability.
    Priya contacts him that afternoon. He has an underwriting scheme that covers her
    risk profile. A bindable quote is generated within two weeks. Coverage is bound.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Specialty insurance markets are dysfunctional not because capacity is absent but
    because buyers cannot find the broker with the right Lloyd's authority for their
    specific risk. The information that would complete the market—which broker holds
    what authority for which risk class—is not public, not searchable, and not visible
    to commercial buyers navigating standard broker relationships. DeeperPoint makes
    specialty market access information discoverable.

    *Characters are fictional. The specialty insurance access gap—particularly in emerging
    risk categories like AI liability—is well-documented in the commercial insurance market.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
