market_example:
  summary: A structured matching platform connecting Canadian businesses and organizations
    with specialty insurance requirements—directors and officers liability, cyber risk,
    parametric agriculture, professional indemnity for emerging professions, and niche
    property risks—with the small pool of specialty brokers and Lloyd's coverholders
    with market access and underwriting authority in their specific risk category.
  problem: "Canadian commercial insurance is efficiently served by the standard market for
    standard risks. A manufacturing company seeking general liability, commercial property,
    and commercial auto insurance has dozens of capable brokers and dozens of competitive
    insurers to choose from. The market fails systematically at specialty lines—niche risks
    where the insurer pool is small, the underwriting judgment required is highly specific,
    and access to coverage depends on knowing which broker has Lloyd's coverholder authority,
    MGA relationships, or specialty insurer appointments in the exact risk category. A
    technology company seeking media liability and tech E&O coverage, a cannabis producer
    seeking product liability, a professional services consortium seeking a group professional
    indemnity policy, a First Nations band seeking parametric crop insurance for wild
    harvest—each of these requires a broker with specific market appointments. The standard
    insurance broker—even a large commercial brokerage—may have the general commercial appointment
    but lack the Lloyd's box access, the MGA relationship, or the specialty market familiarity
    required for a niche risk. The insurance buyer—often without insurance market expertise—
    has no mechanism to identify which broker has binding authority in their specific risk
    category. The result: specialty risk buyers either remain uninsured (accepting risk they
    don't know how to price), obtain inadequate coverage through a standard broker who places
    the risk with a non-specialist insurer, or spend months learning through failed broker
    introductions that the right broker was never in their network."
  dominant_forces:
    - "Specialty lines coverage requires brokers with specific market appointments—Lloyd's
      coverholder authority, MGA binding authority, specialty insurer direct relationships—
      that are not visible to commercial insurance buyers through standard broker selection
      processes."
    - "Emerging risk categories (cyber liability, AI professional liability, cannabis product
      liability, parametric index insurance) create new specialty lines demand faster than
      the standard broker community can develop market access, creating acute thin market
      conditions in rapidly growing insurance categories."
    - "Insurance buyers across Canada—from technology startups to Indigenous economic
      development corporations—routinely carry inadequate coverage not from budget decisions
      but from an inability to locate the broker with the correct market access."
  deeperpoint_fit: "KnowledgeSlot encodes the specialty insurance market access structure:
    Lloyd's coverholder categories, MGA binding authority by risk class, specialty insurer
    direct appointment categories, and premium estimation benchmarks for common specialty lines.
    CoSolvent matches insurance buyer risk profiles—industry, risk type, coverage requirement,
    prior loss history, jurisdiction—against broker profiles organized by coverholder authority,
    specialty appointments, risk class experience, and current underwriting appetite."
  economic_upside: "The Canadian specialty commercial insurance market exceeds $8B in annual
    premium. The thin market segment—risks where standard broker market access is inadequate—is
    estimated at $500M–1.5B in annual premium where matching failures result in inadequate
    coverage or no coverage. A platform capturing 3% placement efficiency improvement generates
    $15–45M in redirected premium annually, with revenue via broker subscription and per-placement fees."
