tags: [thin-markets, education, indigenous, mexico, ethiopia, language, culture, commoncontext, cosolvent]

market_example:
  summary: "Mexico has 68 recognized indigenous languages; Ethiopia has 90+ active languages and language groups. In both countries, schools and community organizations that want to teach in or about minority languages cannot find verified teachers, curriculum materials, or cultural practitioners — and the speakers who could fill those roles are invisible to the institutions that need them."
  problem: "Indigenous and minority language education faces a structural supply-demand mismatch in both Mexico and Ethiopia. Schools, universities, cultural centers, NGOs, and diaspora community organizations want to teach Nahuatl, Zapotec, Mixtec, Amharic, Oromo, Tigrinya, Somali, and dozens of other languages — but cannot find verified fluent speakers who can teach, assess competence, or produce curriculum materials. Meanwhile, fluent speakers in rural communities have no mechanism to signal their availability and have never been approached as an educational resource. The market for indigenous and minority language instruction is genuine but permanently thin because no discovery mechanism exists on either side."
  dominant_forces:
    - "Discovery failure — Educational institutions cannot find verified native speakers with teaching capacity; speakers cannot find institutions that would pay for their knowledge"
    - "Credential opacity — Fluency in an indigenous language is not credentialed by any standard system; institutions cannot evaluate speakers without elaborate personal referral chains"
    - "Geographic dispersion — Fluent speakers are concentrated in specific rural communities; demand clusters in cities and universities far from those communities"
    - "Trust deficit — Institutions hiring language practitioners for curriculum development cannot verify the quality or authenticity of the content produced without expert review"
    - "Material scarcity — Curriculum materials in indigenous languages are rare, inconsistent in quality, and not aggregated in any accessible repository"
  deeperpoint_fit: "CoSolvent builds speaker/practitioner profiles with verified fluency indicators (native speaker status, years of active use, written versus oral fluency, regional dialect), teaching experience, and content development capability. Institution profiles capture language sought, instruction level (beginner/conversational/academic), medium (in-person/video/content development), and intended use. CommonContext carries existing open-access curriculum materials organized by language, region, and level — building a growing reference library that practitioners can contribute to and institutions can draw from. Aesthetic matching for oral performance samples is applicable: voice recordings can be embedded and compared for dialect consistency and fluency quality."
  economic_upside: "Mexico's National Institute of Indigenous Languages (INALI) and Ethiopia's regional language institutes have combined annual budgets exceeding $80M for language promotion. University language departments, NGOs, and diaspora cultural organizations represent an additional $20–40M in annual spending on language education and cultural programming that currently flows inefficiently through personal referral networks. Platform revenue: practitioner matching fee ($150–$400 per placement), content licensing and CommonContext contribution fees, government data contracts for language vitality monitoring."

