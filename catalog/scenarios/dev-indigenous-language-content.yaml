    recurring: true

  - title: "Diaspora Cultural Programming Matching"
    type: saas
    revenue_model: "Per-match fee for diaspora cultural organization–practitioner connections ($200–$500 per placement). Applicable to Zapotec, Mixtec, Nahuatl, Tigrinya, and Oromo diaspora communities in the United States, Canada, and Europe."
    strategic_logic: "Diaspora communities in North American cities pay significant amounts to maintain cultural and language programming for second-generation children. They cannot find verified practitioners from specific regional traditions. The platform's geographic reach across origin communities makes it uniquely capable of matching practitioner to diaspora need."
    recurring: false

story:
  title: "The Last Teacher of the Valley"
  status: draft
  blog_slug: ""
  characters:
    - "Doña Rosa Jiménez - Zapotec elder and fluent speaker, Teotitlán del Valle, Oaxaca"
    - "Dr. Andrés Zárate - linguistics professor, UNAM Mexico City"
    - "Carmen López - Oaxacan-American parent, Los Angeles"
  summary: "A UNAM linguist trying to document Zapotec dialectal variation cannot find verified speakers of a specific valley variant. The platform matches him with Doña Rosa — 80 years old, the only fully fluent speaker of the Teotitlán variant still willing to work with researchers. And a Los Angeles diaspora parent searching for Zapotec instruction for her daughter finds the same platform, the same match, and a way to pay for the work."
  body: |
    ## Act A - The Market Structure

    Zapotec is not one language. It is a family of closely related languages and dialects,
    dozens of them, spoken across the valleys of Oaxaca. By UNESCO's documentation, the majority
    of Zapotec variants are endangered. Fluent speakers are aging. The children of Zapotec
    communities in Los Angeles, Chicago, and New York — the largest diaspora populations
    of any indigenous Mexican group in the United States — often speak no Zapotec at all.

    Linguists who study Zapotec cannot work from textbooks. They need living speakers. The
    speakers are in the valleys, largely without internet access, and have no way to signal
    their availability to researchers in Mexico City, let alone to diaspora cultural organizations
    in California.

    A university in Mexico City, a community organization in Los Angeles, and an 80-year-old
    elder in Teotitlán del Valle want the same thing. They have never been in the same room
    because no mechanism exists to put them there.

    ---

    ## Act B - The Story

    **Dr. Andrés Zárate** has been documenting Valley Zapotec for eleven years. He needs a
    fluent speaker of the Teotitlán variant specifically — a dialect with a distinctive tonal
    pattern he cannot capture from the San Marcos variant he has primarily documented. His
    contact at the Oaxaca state cultural institute gave him three names. One had died. One had
    moved to the United States. One did not want to work with researchers anymore.

    He registered his need on the platform: Valley Zapotec, Teotitlán variant, full oral
    fluency, willing to work on recorded documentation sessions, video is acceptable, paid
    engagement.

    **Doña Rosa Jiménez** was registered by her granddaughter, a university student in Oaxaca
    City who had seen the platform through the state INALI office. Doña Rosa is 80 years old.
    She grew up speaking Zapotec before Spanish. She is fully fluent in the Teotitlán variant —
    the tonal system, the ceremonial vocabulary, the agricultural terminology that is disappearing
    from younger generations. She has never been asked to be paid for her knowledge.

    The platform's matching logic identifies a structural correspondence: Andrés requires
    Teotitlán variant oral fluency; Rosa provides documented native speaker status in exactly
    that variant. The match confidence is high.

    The Generative Match Story presents the connection as a structured research partnership:
    six recorded sessions over two months, $150 USD per session, video format. CommonContext
    provides a documentation session framework adapted from ELDP (Endangered Language Documentation
    Programme) protocols.

    **Carmen López** in Los Angeles found the platform three weeks later. She is the parent
    of two children who have no Zapotec. She wanted Zapotec language instruction — not Duolingo,
    but a real speaker, a real tradition. She saw, through the platform's demand matching, that
    a documented Teotitlán practitioner was active. She contacted the platform.

    The platform created a three-party coordination: Andrés's research sessions, Rosa's
    instruction sessions with Carmen's children over video (two evenings per week, $60 per
    session), and a content development strand — Rosa narrating Teotitlán stories and songs
    for a CommonContext archive that both Andrés's university and the INALI can access.

    Doña Rosa earns $900/month. She had never earned money for speaking the language her
    grandmother taught her.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The knowledge is present. The demand is present. In Teotitlán, in Los Angeles, and in
    Mexico City, there are people who want exactly what Doña Rosa knows and can provide.

    The market fails because there is no mechanism to make her visible — no phonebook for
    living language carriers, no credential that certifies "Teotitlán Zapotec, full oral
    fluency," no payment channel that makes a small international transaction viable for
    an 80-year-old woman in a valley without a bank branch.

    The platform resolves all three: a profile system that makes her visible, a matching engine
    that finds the right match among the noise of generic "Zapotec teacher" requests, and a
    payment channel connected to her granddaughter's mobile money account.

    The market was always there. It was just invisible.

    *Characters are fictional. Zapotec language endangerment, the Oaxacan diaspora community in
    the United States, and the INALI language documentation ecosystem are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
