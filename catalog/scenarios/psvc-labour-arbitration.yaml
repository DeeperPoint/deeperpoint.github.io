  - title: "Collective Agreement Benchmarking and Negotiation Data Extension"
    type: commerce-extension
    revenue_model: "Collective agreement benchmarking report by sector and occupation category ($600–$1,500 per report); wage comparison data subscription ($800–$2,000/year); settlement pattern analytics for negotiating parties; platform earns data commerce revenue from every labour relations relationship it establishes"
