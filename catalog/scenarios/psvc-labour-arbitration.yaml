market_example:
  summary: "Grievance arbitrations involving specialized compensation structures, equity, accommodation, and public sector collective agreement interpretation require arbitrators with demonstrated sector-specific experience — a subspecialty that labour counsel cannot distinguish from a general arbitrator's roster listing."
  problem: "Labour arbitration in Canada operates through a professional community of federally and provincially approved arbitrators, some of whom are generalists and some of whom have deep subspecialty experience in specific collective agreement types (construction, healthcare, public service), dispute categories (accommodation, wage classification, technology change), or industry sectors. The parties to a complex arbitration — particularly one involving job classification in a technology environment, accommodation disputes under a recent human rights decision, or compensation structure grievances in health sector public-sector collective agreements — benefit substantially from appointing an arbitrator with prior decisions in the relevant subject area. The mechanism for identifying that arbitrator is currently informal: a roster list from the Ministry of Labour, personal reputation in the labour bar, or prior appointing tribunal experience. The wrong appointment wastes months of pre-hearing preparation on an arbitrator who must be educated on the domain before they can evaluate the arguments."
  dominant_forces:
    - "Participant scarcity — arbitrators with demonstrated prior decision-writing experience in specific dispute categories are a small subset of the total roster"
    - "Decision opacity — prior arbitral decisions are searchable in CanLII but not indexed against arbitrator profiles in any mechanism accessible to appointing parties who do not already know the decision exists"
    - "Trust and neutrality requirement — the arbitrator must be perceived as neutral by both parties; appointing parties are reluctant to propose candidates they appear to know well, even when that candidate has the relevant subspecialty"
    - "Offering complexity — the right arbitrator requires alignment on sector, dispute category, human rights jurisdiction, collective agreement type, and availability for the full hearing schedule"
    - "Temporal constraint — arbitration timelines in collective agreements are mandated; delay in arbitrator appointment extends grievance resolution timelines that affect operational management"
  deeperpoint_fit: "Semantic matching encodes arbitrator profiles (sector by industry, dispute category by type — accommodation, classification, layoff, technological change, compensation — collective agreement type, prior decision record by issue and outcome, availability window, appointment fee range) against party demand signals (sector, dispute category, collective agreement type, human rights dimension, timeline, jurisdiction). CanLII decision indexing enriches arbitrator profiles with decision-based evidence of subspecialty."
  economic_upside: "The Canadian labour arbitration and mediation services market is estimated at $150M–$250M annually. A single complex grievance arbitration — job classification dispute affecting 200 employees, accommodation dispute with Charter dimensions, technology change article interpretation — involves legal fees and direct arbitration costs of $80,000–$300,000 over its full term. An arbitrator appointment that requires two rounds of preliminary motions to establish domain context adds $25,000–$75,000 in avoidable cost. A platform that reduces wrong-appointment frequency generates substantial value relative to a per-appointment fee or subscription."

