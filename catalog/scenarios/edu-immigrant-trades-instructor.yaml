market_example:
  summary: "Canada has a documented skilled trades shortage and simultaneously a large population of recently immigrated master tradespeople -- Czech machinists, German tool-and-die makers, Italian marble workers, Filipino electricians -- whose credentials are unrecognized and whose teaching potential is untapped. A matching platform connects them to vocational programs, apprenticeship programs, and community colleges that need exactly their knowledge."
  problem: "Canada faces a structural trades shortage -- over 250,000 unfilled skilled trades positions are projected by 2030. At the same time, Canada's immigrant population includes tens of thousands of master tradespeople whose foreign credentials are not recognized by provincial licensing bodies or college hiring systems. A Czech precision machinist with 25 years of CNC lathe experience cannot easily become a Red Seal journeyman without requalification that ignores what he actually knows. He certainly cannot become a college instructor without a Canadian teaching credential. The result: he drives for Uber while community colleges post unfilled instructor positions in the manufacturing and machining programs that feed the same industry he mastered. This is a discovery and credentialing failure, not a skills failure."
  dominant_forces:
    - "Credential opacity -- Foreign trades credentials are not legible to Canadian institutions without an expensive, slow recognition process"
    - "Discovery failure -- College vocational programs and apprenticeship sponsors cannot find qualified immigrant trades instructors through any systematic channel"
    - "Institutional inertia -- Hiring systems built around Canadian credentials make it structurally difficult to hire based on verified practical competence without formal certification"
    - "Trust deficit -- Employers and program coordinators cannot verify the depth of a foreign-trained tradesperson's expertise without a hands-on evaluation mechanism"
    - "Geographic dispersion -- Immigrant tradespeople are concentrated in immigrant-dense cities; skills shortages are acute in smaller cities and rural industrial regions"
  deeperpoint_fit: "CoSolvent builds practitioner profiles using a competence-interrogation approach -- structured problem-based questions in the trade domain that extract and verify practical knowledge depth rather than simply accepting self-reported credentials. A Czech machinist's knowledge of GD&T tolerance stacking, cutting parameter selection, and tool change sequencing can be documented through an AI conversation without requiring a paper credential. Institutional profiles capture program type, skill domains needed, session format (in-shop demonstration, classroom lecture, virtual mentorship), and honorarium range. KnowledgeSlot carries Red Seal competency frameworks by trade, provincial journeyman equivalency tables, and community college sessional instructor engagement templates."
  economic_upside: "Canada's trades skills gap costs an estimated $20B annually in lost industrial output. Community colleges pay $60-$120/hour for sessional trades instructors. If 5,000 immigrant master tradespeople currently in underemployment were matched to even 10 instructional sessions per year each, that represents 50,000 instructional sessions -- filling gaps that are currently unmet and generating $3-6M in direct instructor income redirected from underemployment. Platform revenue: matching fee per confirmed engagement ($150-$400), credential-verification service fee, institutional subscription for program coordinators."

