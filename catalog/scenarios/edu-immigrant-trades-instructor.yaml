story:
  title: "The Machinist Who Wasn't Allowed to Teach"
  status: draft
  blog_slug: ""
  characters:
    - "Tomas Novak - Czech CNC machinist, 26 years experience, immigrated to Brampton 2022"
    - "Linda Kowalski - program coordinator, Sheridan College Manufacturing Technology program"
    - "Marco Rinaldi - apprentice machinist, Sheridan second-year student"
  summary: "Tomas spent two years driving for a rideshare company while Sheridan College's machining program ran three sections with only two instructors. A platform match -- built on a competence interrogation rather than a paper credential -- puts him in front of Marco's class."
  body: |
    ## Act A - The Market Structure

    Canada's manufacturing sector runs on precisely machined metal. CNC lathes, multi-axis
    milling centres, grinding, honing, EDM -- the physical infrastructure of Canadian industry
    depends on people who know how to run these machines to tight tolerance. The sector needs
    roughly 35,000 additional machining professionals over the next decade, by Industry Canada's
    own estimates. Community colleges cannot fill the instructional gaps in their machining
    programs.

    Canada welcomed 431,000 permanent residents in 2022. Among them: tool-and-die makers
    from Hungary, precision machinists from the Czech Republic, CNC programmers from Poland,
    mould makers from Germany. Their skills are real, their experience is deep, and their
    Canadian credentials are nonexistent.

    The provincial credential recognition process for a Red Seal machinist takes 18-36 months,
    requires fees most immigrants cannot afford while establishing themselves, and often demands
    supervised Canadian work hours that are impossible to accumulate without employment -- which
    is impossible without Canadian credentials. The circle closes on itself.

    Meanwhile, Linda Kowalski at Sheridan has been trying to hire a third machining instructor
    for eight months.

    ---

    ## Act B - The Story

    **Tomas Novak** spent 26 years at a precision component manufacturer in Brno, Czech Republic.
    He programmed and operated five-axis Mazak centres, trained apprentices on GD&T and tolerance
    analysis, and held the company's ISO 9001 quality sign-off authority for machined components.
    His Czech credentials: certified master machinist (Vyucni list + further qualifications),
    equivalent to a Red Seal journeyman with instructor certification by any technical measure.

    In Canada, he is unclassified. He drove for Uber for two years while working through the
    College of Trades recognition process.

    He registered on the platform through a settlement services organization in Brampton that
    had partnered with the provincial apprenticeship board. The platform's onboarding is different
    from a credential form: it is a conversation. An AI assistant, in Czech and English, asks
    Tomas to describe how he would set up a five-axis finishing operation on a titanium
    aerospace bracket. It asks him about tolerance stacking in an assembly with four mating
    surfaces. It asks what he would do if a cutting tool showed early wear signatures on the
    third pass.

    His answers are detailed, contextually correct, and reveal the accumulated judgment of
    26 years. The platform generates a **Competence Profile**: CNC five-axis programming and
    operation, GD&T and tolerance analysis, tool selection and wear monitoring, ISO quality
    process documentation, apprenticeship training experience. The document is formatted
    for institutional review -- not as a credential substitute, but as an evidence base.

    **Linda Kowalski** receives a match notification: immigrant machining practitioner, verified
    competence in five-axis CNC and GD&T, 26 years industry experience, available for sessional
    instruction, Brampton. She reviews the competence profile. She calls Tomas.

    They meet in the college shop. Tomas runs a setup on the Haas five-axis that Linda's
    most experienced remaining instructor watches carefully. "He knows what he's doing,"
    the instructor tells Linda afterward. "More than I do on the five-axis, honestly."

    Sheridan's legal team approves a sessional instructor engagement -- the platform's
    engagement template, pre-populated with the provincial college sessional instructor
    framework, reduces the contracting time from eight weeks to eleven days.

    **Marco Rinaldi** notices the new instructor in week three of his second semester. Tomas
    explains tolerance stacking differently from anyone Marco has encountered -- from the
    physical reality of cutting forces and material springback, not from the textbook diagram.
    Marco's project scores improve. He starts staying after class to ask questions.

    By the end of the semester, Tomas is teaching two sections. His Red Seal process is still
    pending. His classroom is full.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Tomas's skills did not diminish when he crossed the Atlantic. Linda's need did not diminish
    while the credential process ran. The credential system exists to protect quality -- a
    legitimate function. But it was built to assess skills that cannot be documented, not to
    exclude skills that can.

    The platform does not replace the credential system. It creates an evidence base that
    makes the human judgment at the end of the process better-informed -- and creates a pathway
    for sessional engagement while the formal process runs. Both things can be true: credentials
    matter, and a 26-year master machinist can teach before his Canadian paperwork is complete.

    Canada is importing the people and then not using what they brought. The platform is the
    mechanism that changes the calculation.

    *Characters are fictional. Canada's trades instructor shortage, Czech precision machining
    industry, and the Red Seal recognition process dynamics are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
