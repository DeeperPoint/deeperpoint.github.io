market_example:
  summary: "Provincial and national sport organizations cannot efficiently identify qualified coaches with the specific certification level, sport specialization, and geographic availability they need, while NCCP-certified coaches available for new positions cannot surface themselves to programs that need them."
  problem: "Provincial sport organizations, national sport organizations, and high-performance clubs struggle to identify qualified coaches with the specific certification level, sport specialization, athlete development philosophy, and geographic availability they need. Meanwhile, coaches at the NCCP Advanced Coaching Diploma and High Performance levels who are available for new positions cannot efficiently surface themselves to the programs that need them. Canada's coaching labour market is fragmented: most placements occur through word-of-mouth within sport-specific communities, leaving cross-sport transferable coaches undiscoverable and creating persistent vacancies in underserved regions and sports."
  dominant_forces:
    - "Opacity — no national searchable registry of coaches with current NCCP certifications, sport-specific experience, coaching philosophy indicators, and active availability status exists"
    - "Participant scarcity — coaches at the High Performance level in specific sports and geographic regions are few; the pool of programs that can support a professional coaching position is equally constrained"
    - "Offering complexity — each coach profile spans NCCP certification level and context, sport-specific experience, athlete development philosophy, administrative capacity, geographic mobility, engagement model, and compensation range"
    - "Geographic distance — high-performance coaching vacancies concentrate in provincial sport institutes and national training centres; qualified coaches outside those centres are effectively invisible"
    - "Strategic information withholding — programs do not publicly advertise detailed coaching philosophy requirements; coaches are reluctant to disclose current employment status or minimum compensation requirements"
  deeperpoint_fit: "KnowledgeSlot curates NCCP certification frameworks across all sport contexts, Coaching Association of Canada competency standards, Own the Podium coaching development criteria, and applicable employment law. Semantic matching encodes coach profile (certification level, sport, competitive level, development philosophy indicators, geographic mobility) against program need (sport, competitive level, certification requirement, vacancy type, location). The trusted intermediary protocol allows programs to share coaching philosophy priorities and coaches to share minimum compensation without premature disclosure. Anticipatory matching is particularly valuable: when a coaching certification is renewed or upgraded, the system resurfaces the coach to programs that previously fell short of the certification requirement."
  economic_upside: "Coaching quality is the single most significant determinant of athlete development outcomes at every level of Canadian sport. The inability to efficiently match qualified coaches to programs creates vacancy gaps that limit athlete development and waste public investment in coaching certification. Better matching increases coaching deployment rates, reduces geographic concentration of coaching talent, and supports Sport Canada's Long-Term Athlete Development framework."

