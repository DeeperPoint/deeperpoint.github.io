story:
  title: "Biology, Grade 11, Not Offered"
  status: draft
  blog_slug: ""
  characters:
    - "Sarah Loon - principal, Kee-Way-Win Community School, northern Ontario First Nation"
    - "Marcus Chen - AP biology teacher, Toronto, willing to teach remotely one semester"
    - "Jordan Flett - Grade 11 student, aspiring nurse"
  summary: "Jordan needs Grade 11 biology to apply to nursing school. Kee-Way-Win has not offered Grade 11 biology for three years because no one could fill the position. Marcus is in Toronto, has a setup for high-quality remote instruction, and would commit to one semester from home plus one in-community visit. The platform makes the connection."
  body: |
    ## Act A - The Market Structure

    Kee-Way-Win First Nation is on the English River in northwestern Ontario. The community
    is accessible by winter road for approximately eight weeks per year; the rest of the year,
    it is float plane only. The school enrolls 180 students from junior kindergarten through
    Grade 12. Sarah Loon has been principal for six years.

    The school has not offered Grade 11 biology, chemistry, or physics for three consecutive
    years. Not because the curriculum doesn't exist, not because the students don't need it —
    Jordan needs Grade 11 biology to apply to the nursing program at Confederation College.
    It is not offered because no one would take the posting and because there is no remote
    instruction arrangement in place.

    The provincial job board has listed the position twice. Two people applied. Neither
    accepted the offer.

    ---

    ## Act B - The Story

    **Jordan Flett** is 16 years old. She wants to be a nurse. Her grandmother is a nurse
    who worked at the Sioux Lookout Meno Ya Win Health Centre for 25 years. Jordan has
    known what she wants since she was eleven. She does Grade 10 science through an online
    credit recovery program — the content is thin, the feedback is automated, and she knows
    she is not learning what she needs.

    **Marcus Chen** teaches AP Biology at a Toronto high school. He is 34, lives alone,
    and has been thinking about how to do meaningful work outside his classroom. He registered
    on the platform after reading about a remote teaching placement matching initiative. His
    profile: Grade 11 and 12 biology, AP Biology, strong remote-teaching setup (dual camera,
    lab demo equipment), willing to commit one semester remote plus one in-community week.
    First Nations context: no previous experience, open to training.

    The platform's match shows Sarah a candidate she would never have seen in the provincial
    job board results: a qualified Grade 11–12 biology teacher in Toronto, explicitly
    available for remote one-semester engagement with a community visit component.

    KnowledgeSlot surfaces the platform's First Nations school context guide for Marcus:
    relationship protocols, the community's priority on land-connected learning, the school's
    bandwidth limitations (STARLINK-class connection, reliable), and Sarah's note that students
    engage best when the instructor shows genuine curiosity about the community.

    Marcus and Sarah spend 45 minutes on video. He asks about English River, about what the
    students see outside their windows. She tells him about the moose population, the wild rice
    harvest, the pike that the kids pull through ice holes in March.

    He asks if he can incorporate freshwater ecosystem ecology into the Grade 11 curriculum.
    "That's exactly what I was hoping you'd say," Sarah tells him.

    The semester begins in September. Marcus teaches four days a week via video. Jordan is
    in the front row. The curriculum lives in the English River watershed — dissolved oxygen,
    nutrient cycling in boreal lakes, the biology of the wild rice plant — alongside Ontario's
    required cellular biology and genetics units.

    In February, Marcus arrives at Kee-Way-Win for his community week. He brings slides of
    frog dissection that he adapts for a dissection kit the school already owns. He meets
    Jordan. They talk about nursing, about biochemistry, about what the body's systems have
    in common with an ecosystem.

    Jordan's Grade 11 biology final is 82%. She applies to Confederation College.
    She is accepted.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Marcus was available. Jordan needed biology. The discovery failure was total — two people
    150 kilometres apart (with a plane flight between them) who would both have said yes
    to this arrangement if anyone had put the question to them.

    The provincial job board was built for one model: full-time, in-person, permanent.
    That model cannot serve Kee-Way-Win. The hybrid model — predominantly remote, with
    a community visit — is a better fit for everyone and is completely invisible to the
    existing hiring infrastructure.

    The platform does not solve every problem in remote education. It solves one specific
    problem: the discovery failure that keeps qualified instructors from knowing which schools
    need them and keeps schools from knowing which instructors are willing to work in a
    new way.

    For Jordan, the stakes are not abstract. Biology was the prerequisite for the future
    she chose at age eleven.

    *Characters are fictional. Northwestern Ontario First Nations school access gaps,
    Confederation College nursing program requirements, and provincial remote school
    specialist shortages are real. [DeeperPoint](../../marketforge.html) is building
    the infrastructure this story describes.*
