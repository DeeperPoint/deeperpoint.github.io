market_example:
  summary: "Rural and northern Canadian schools — from the BC Interior to Northern Ontario to Nunavut — face chronic shortages of STEM, trades, and specialist instructors that urban hiring pipelines cannot fill. Qualified instructors in southern cities who would engage remotely or for short placements cannot find these schools through any matching mechanism."
  problem: "Canada's approximately 1,200 rural and remote schools serve over 400,000 students in communities where full-time specialist hiring is economically unviable and geographically challenging. First Nations schools operated under federal or band authority are particularly underserved — many operating in communities of 200–800 people, accessible by winter road or float plane, where a biology teacher, computer science instructor, or trades-foundations educator has never existed. Southern Canadian universities produce qualified instructors who are willing to engage remotely, travel for short residencies, or commit to one-semester postings — but no mechanism connects them to the specific schools whose needs match their profile. The discovery failure is total: the schools advertise in the same urban newspaper job boards that every other school uses, and specialists who might engage remotely don't know the opportunity exists."
  dominant_forces:
    - "Geographic isolation — Remote schools cannot attract full-time specialists through standard urban hiring channels and cannot afford the cost of full relocation packages"
    - "Discovery failure — No mechanism for remote-willing instructors to identify which schools have specific specialist gaps that match their expertise"
    - "Institutional capacity gap — Small remote school boards lack HR capacity to run targeted national recruitment for specialist positions"
    - "Trust deficit — Remote instructors considering a posting to a northern community need detailed information about living conditions, student context, and community support that standard job postings never provide"
    - "Continuity challenge — High turnover in remote postings destroys instructional continuity; short-term and hybrid (remote + residency) models may suit both parties better than permanent placement"
  deeperpoint_fit: "CoSolvent builds dual profiles: school/band profiles with detailed community context, student cohort characteristics, available technology infrastructure, subject gaps, and engagement format preferences (full remote, remote with two annual residencies, semester placement, permanent with relocation support); and instructor profiles with specialization, remote-teaching experience, comfort with cross-cultural Indigenous/non-Indigenous contexts, relocation preference, and availability. KnowledgeSlot carries First Nations school jurisdiction information, remote teaching certification requirements by province, ISC (Indigenous Services Canada) school funding parameters, and community profiles prepared by communities who have opted into the platform — giving instructors accurate pre-commitment information about what a posting involves."
  economic_upside: "Federal and provincial investment in remote and First Nations school staffing exceeds $200M annually. Filling specialist gaps in even 200 of the highest-need remote schools through matched hybrid-remote engagement models represents $40–80M in instructional value that is currently undelivered. Platform revenue: placement fee per confirmed school-instructor match ($300–$600), band and remote board subscription ($1,200–$4,000/year), ISC partnership data and reporting services. Network effect: verified remote-teaching performance records become portable credentials that instructors carry across schools and that schools reference when hiring."

