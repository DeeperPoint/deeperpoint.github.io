market_example:
  summary: "Municipalities matching individuals with complex needs to transitional housing units rely on caseworker personal knowledge rather than systematic matching, producing placement delays, poor fit, and preventable returns to street homelessness."
  problem: "Municipalities operating transitional housing programs struggle to match individuals with complex needs — mental health, addiction, physical disability, domestic violence history, immigration status — to specific units and service packages. Housing inventory is heterogeneous: some units accommodate wheelchairs, some have on-site mental health support, some accept pets, some have age restrictions. Matching an individual to the right placement is a high-stakes, multi-attribute problem that caseworkers solve through personal knowledge networks and manual spreadsheet tracking, producing delays, mismatches, and returns to street homelessness."
  dominant_forces:
    - "Participant scarcity — the right unit for an individual with a specific combination of needs may be one of a handful in the city, turning over infrequently"
    - "Information asymmetry — housing providers know their unit capabilities; intake workers know individual needs; no shared system encodes both in compatible terms"
    - "Temporal distance — placement delays create cascading harm; units sit empty while eligible individuals remain unsheltered"
    - "Cognitive overload — a caseworker managing 30+ active files cannot maintain current awareness of unit availability and eligibility criteria across dozens of housing programs"
    - "Strategic information withholding — individuals may not disclose needs that could disqualify them; providers may obscure real vacancy rates"
  deeperpoint_fit: "Semantic matching aligns individual need profiles (disclosed and AI-inferred from intake data) with unit capabilities across the full inventory without requiring a caseworker to manually search each provider. Multi-channel input (WhatsApp, SMS, voice) allows individuals to provide intake information through channels accessible to people without smartphones or stable internet access. CommonContext curates eligibility criteria for each housing program, service bundles available by unit type, and funding source requirements. The Generative Match Story translates a match recommendation into a caseworker-readable explanation, enabling faster placement decisions. ConsentEvent logging ensures sensitive personal data is handled with explicit, auditable consent."
  economic_upside: "Research consistently shows that every dollar invested in permanent supportive housing saves approximately three dollars in emergency shelter, hospital, and correctional system costs. Better matching reduces placement delays, reduces returns to homelessness through better fit, and allows case managers to serve more individuals with the same staffing."

