  body: |
    ## Act A - The Market Structure

    The assay laboratory is the last bottleneck in the exploration chain—the step between
    rock in the ground and numbers in a press release. It is the step that cannot be
    accelerated by having more money, more drillers, or faster helicopters. Every geochemical
    result that will ever appear in a NI 43-101 technical report must pass through an
    accredited laboratory's chain of custody and analytical workflow.

    When exploration activity surges—as it has in gold since 2024 and in copper since the
    critical minerals policy programs of 2025—the laboratories are the constraint. Their
    capacity is physical: fire assay furnaces, sample prep lines, ICP mass spectrometers.
    The equipment cannot be scaled overnight. The backlog grows, and the queue is not fair:
    major campaigns with frame agreements go first.

    ---

    ## Act B - The Story

    **Ingrid** submitted 2,400 drill core samples to her regular laboratory at the end of
    August. The laboratory's automated acknowledgement quoted 9-week turnaround. That puts
    her results in early November. Her follow-up Phase 2 decision needs to be made before
    December 1st to secure a drilling contractor for the following February ice-road window.
    November results give her three weeks to interpret the data, consult her QP, and make
    the Phase 2 commitment. That is not enough.

    **Dale** manages a laboratory that handles fire assay and multi-element ICP-MS. His
    major client—a senior gold company with a 14,000-sample campaign commitment—has
    pushed their next submission batch by three weeks because of a shipping delay. Dale
    has two fire assay furnaces running at 40% capacity for the next three weeks. He posted
    the availability to his sales contact list. Nobody who needed it responded.

    Ingrid queries the platform for accredited fire assay capacity: gold and multi-element
    (Au-Ag-As-Cu-Zn-Pb), 2,400 samples, 3-week turnaround target, Abitibi sample preparation
    standards. Dale's laboratory surfaces with confirmed capacity for 2,400 samples in the
    available window. The platform generates the submission protocol, chain-of-custody
    documentation, and NI 43-101 QA/QC reference standard specification. Ingrid's samples
    are in transit within 48 hours of the match. Results arrive October 20th. Phase 2 is
    committed before anyone else's Q4 scheduling window closes.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The assay laboratory is not an opaque market—capacity exists, demand exists, and the
    connection is as simple as knowing which laboratory has what capacity available this week.
    But "knowing" requires information that no individual exploration manager can collect
    efficiently across a multi-laboratory market. DeeperPoint makes the capacity visible
    and the matching instantaneous.

    *Characters are fictional. Assay laboratory backlogs of 6–10 weeks during exploration
    booms are documented and widely reported in the junior mining industry.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
