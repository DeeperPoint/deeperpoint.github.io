    submissions still produce compliant results."
  economic_upside: "Reducing a 10-week assay backlog to 3 weeks for 10% of Canadian exploration
    programs in a given season prevents multiple drilling season losses estimated at $5–50M
    each in program extension costs and delayed capital deployment. Platform revenue via
    subscription for laboratories and per-submission matching fees for exploration companies."
