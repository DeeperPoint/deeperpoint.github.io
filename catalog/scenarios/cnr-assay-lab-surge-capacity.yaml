market_example:
  summary: A real-time availability platform matching junior exploration companies with geochemical
    sample backlogs against accredited assay laboratories that have underutilized capacity between
    major campaign commitments—replacing a 6-to-10-week standard backlog with flexible surge
    matching that saves drilling seasons and NI 43-101 expenditure deadlines.
  problem: "Exploration drilling generates core samples that must be analyzed by an accredited
    laboratory—a requirement under NI 43-101 for publicly reported results—before the program's
    results can be filed, investors can be updated, and follow-up decisions can be made. During
    exploration booms, accredited assay laboratories in Canada (SGS Lakefield, Activation
    Laboratories in Ancaster, Bureau Veritas, ALS) are operating at full throughput and
    maintaining submission backlogs of 6–10 weeks. For a junior company whose drilling program
    generates 3,000 samples over a six-week field campaign, a 10-week assay backlog means
    the program's results are not available until four months after the last drill hole
    was completed—compressing or eliminating the window for follow-up decisions before the
    next field season. More critically, the backlog is uneven: major campaign clients with
    long-term frame agreements have priority; single-program junior companies are placed
    in the general queue regardless of their regulatory deadline urgency. Simultaneously,
    the same laboratories have occasional short windows of underutilized capacity between
    major campaign batches when rush submissions would be welcomed at standard pricing—
    but no mechanism exists to advertise these windows or match them to the queue of
    junior programs waiting for faster turnaround."
  dominant_forces:
    - "NI 43-101 requires accredited laboratory analysis for all publicly reported mineral
      results, creating unavoidable, time-critical dependence on a handful of Canadian
      laboratories that have no structured surge-capacity disclosure mechanism."
    - "Exploration boom cycles create simultaneous sample submission surges from hundreds
      of concurrent drilling programs, generating backlogs that delay results, compress
      follow-up decision windows, and in some cases cause junior companies to miss NI 43-101
      expenditure reporting deadlines."
    - "Laboratory capacity is not uniformly constrained—different methods (fire assay, ICP-MS,
      XRF, SEM-MLA) have different throughput limits, and a single laboratory may have spare
      ICP-MS capacity while its fire assay line is backlogged four weeks."
  deeperpoint_fit: "CoSolvent aggregates real-time throughput availability from participating
