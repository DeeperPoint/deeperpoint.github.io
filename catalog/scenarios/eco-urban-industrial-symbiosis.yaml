market_example:
  summary: "Municipal circular economy strategies target industrial waste diversion, but urban manufacturers cannot discover whether a facility across the industrial park could use their waste stream as feedstock — while processors seeking alternative raw materials cannot discover what industrial byproducts are available nearby."
  problem: "Major Canadian cities — Toronto, Hamilton, Montreal, Vancouver — have industrial districts where dozens of manufacturers operate within kilometres of each other, each generating waste streams that are expensive to dispose of and each purchasing virgin raw materials that could be partially or wholly replaced by a neighbouring facility's byproducts. A plastics injection moulder in Etobicoke generates 3,000 kg/month of off-spec polypropylene regrind — too contaminated for its own process, too valuable for landfill, too small a volume for commodity recyclers. Eight kilometres away, a manufacturer of parking lot wheel stops uses recycled polypropylene and would buy that regrind at a discount to virgin resin — if they knew it existed. A food manufacturer in Scarborough sends 2,000 kg/week of whey byproduct to wastewater treatment — at a surcharge. A craft brewery 4 km away could use that whey as a fermentation adjunct but has never considered sourcing it locally. A metal fabricator in Mississauga pays a hazardous waste hauler $4,200/month to dispose of spent cutting fluid. A fluid recycling company in Brampton — which collects, filters, and resells reconditioned cutting fluid — has capacity but no visibility into which shops near them generate the volumes they need. In every case, the transaction would reduce waste disposal costs for the generator, reduce input costs for the receiver, and divert material from landfill or wastewater — but the market between them does not exist because industrial waste composition, volume, consistency, and regulatory classification are not encoded in any discoverable format."
  dominant_forces:
    - "Opacity — industrial byproduct characteristics (composition, volume, consistency, contamination profile) are known only to the generator; no discoverable marketplace exists for matching waste outputs to input needs"
    - "Trust deficit — a receiver must trust that the waste stream is consistent, uncontaminated, and reliably available; a generator must trust that the receiver is legitimate and will handle material in regulatory compliance"
    - "Regulatory complexity — waste classification under Ontario Regulation 347 (or equivalent provincial regulation), generator registration, manifest requirements, and environmental compliance approval for alternative feedstock use create a regulatory barrier that discourages ad hoc arrangements"
    - "Scale mismatch — individual facility waste volumes are often too small for commodity recyclers but too large for the generator to handle internally; aggregation across multiple generators could achieve processing-viable volumes"
    - "Stigma — manufacturers do not advertise their waste streams because waste generation is perceived as inefficiency; the information that would enable symbiosis is actively concealed"
  deeperpoint_fit: "Semantic matching connects industrial waste generators to potential receivers based on material composition, volume and consistency, contamination profile, geographic proximity, and regulatory classification. The verification pipeline validates generator waste characterization data, receiver processing capabilities, environmental compliance status, and waste transportation permits. CommonContext curates Ontario waste regulation requirements by material classification, environmental compliance approval processes for alternative feedstock use, industrial symbiosis case studies and precedents, and available grants and incentives for circular economy projects. ClientSynth simulates industrial district byproduct flow dynamics — testing whether sufficient waste-to-input matches exist within a specific industrial district to justify platform deployment — before investing in recruitment."
  economic_upside: "Toronto alone diverts approximately 3 million tonnes of non-residential waste annually. Even a 1% improvement in industrial waste diversion through symbiotic matching — 30,000 tonnes — at an average disposal cost saving of $100–$200/tonne represents $3M–$6M in annual cost reduction for generators, plus input cost savings for receivers and measurable progress toward municipal waste diversion targets. The GTA's industrial base includes over 10,000 manufacturing establishments; at an average of $15,000–$25,000/year in addressable waste disposal costs per facility, the total addressable market for symbiotic matching exceeds $150M–$250M annually. Ontario's circular economy programs (Resource Productivity and Recovery Authority, Ontario Waste Management Association) and municipal waste diversion strategies provide natural funding channels."

