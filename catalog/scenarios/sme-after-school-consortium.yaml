    recurring: true

story:
  title: "The Maple Street School Contract"
  status: draft
  blog_slug: ""
  characters:
    - "Rosa — founder, licensed home-to-centre childcare operator converting to a small enrichment centre, Hamilton"
    - "Tim — owner, Hamilton Music Academy, offering piano and guitar instruction to children aged 5–14"
  summary: "A Hamilton elementary school's parent advisory council secures funding for an after-school enrichment program and issues an RFP—and the contract goes to the YMCA because the three small neighbourhood providers who could have covered the full scope didn't know the opportunity existed until after the deadline."
  body: |
    ## Act A — The Neighbourhood Contract

    Maple Street Elementary has 340 students in grades K–8. The school's parent advisory council successfully applied to the Hamilton Community Foundation for $140,000 to fund an after-school program: licensed childcare supervision from 3:30–5:30 PM, academic tutoring three days per week, and arts or music enrichment two days per week. Enrollment target: 60 children. Twenty-four week program.

    The PAC issued an RFP through the school board's procurement portal. Bid deadline: three weeks.

    The YMCA was notified through its standard procurement monitoring system on day one and submitted a fully compliant proposal on day eighteen. One other organization responded—a community centre that covered childcare and tutoring but had no arts or music enrichment.

    The YMCA won.

    ---

    ## Act B — The Story

    **Rosa** runs a licensed childcare program four blocks from Maple Street Elementary. She had heard through parent gossip that the school was "doing something with after-school programming" but had not seen the RFP. She does not have a procurement monitoring system. She doesn't have academic tutoring or arts enrichment programming to offer—only the licensed childcare supervision that is the regulatory backbone of any compliant program.

    **Tim's** Hamilton Music Academy serves 70 children within a one-kilometre radius of Maple Street Elementary. He teaches guitar and piano. He runs a beginner choir program on Saturday mornings. He would have been a natural arts enrichment partner. He did not know the RFP had been issued. He found out from a parent whose child was enrolled in his Saturday choir and whose family had tried unsuccessfully to use the YMCA program.

    A third provider—a tutoring centre three blocks from Rosa—had submitted to the same parent that she "would love to do school programming sometime."

    All three providers were within walking distance of Maple Street Elementary. Together they covered every required program component. None of them had a mechanism to discover the RFP in time, let alone to find each other and assemble a consortium response in three weeks.

    ---

    On the MarketForge after-school consortium platform, the Hamilton Community Foundation had posted the grant opportunity at the same time as the PAC issued the RFP—the platform monitored community foundation grant announcements and issued alerts to registered providers by geographic proximity and service category. Rosa, Tim, and the tutoring centre owner all received alerts within 24 hours of the opportunity being posted.

    The platform's consortium assembly tool identified that the three providers together covered all required program components. It surfaced a match recommendation—Rosa as lead contractor (licensed childcare standing), Tim for arts enrichment, and the tutoring centre for academic support.

    They met virtually on day three of the bid window. By day twelve they had a consortium agreement in place using the platform's framework. They submitted on day twenty with a compliant, fully documented proposal.

    The YMCA still won—this time. But the PAC noted the consortium proposal as the preferred option and committed to award the next program cycle to the neighbourhood providers if the renewal RFP produced a compliant response.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The neighbourhood consortium existed in potential. The three providers were qualified, close to the school, and would have produced a program that the PAC actually preferred—because their staff would know the children, would be embedded in the neighbourhood, and would respond to parent concerns faster than a large organization.

    What did not exist was a mechanism to make the opportunity visible to all three providers simultaneously and to identify that their combined capabilities satisfied the full program scope—before the bid window expired.

    [Thin market infrastructure](../../thin-markets.html) converts grant opportunity monitoring and consortium identification from a luck-of-awareness problem into a structured, time-sensitive alert and assembly process—at the speed that community program procurement actually requires.

    *Characters are fictional. Hamilton Community Foundation grant programs, school board after-school procurement in Ontario, and licensed childcare credential requirements are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
