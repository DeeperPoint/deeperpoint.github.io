market_example:
  summary: "Canadian business school entrepreneurship programs, startup incubators, and community economic development programs want mentors with lived experience of scaling businesses across cultural and regulatory boundaries. Canada's immigrant entrepreneur community — people who built and operated businesses in difficult markets before arriving — is exactly that experience base, and remains almost entirely untapped as an educational resource."
  problem: "Business school entrepreneurship programs, startup incubators, and economic development agencies want mentors who have operated businesses in difficult, resource-constrained markets — experienced operators who understand uncertainty, cash flow discipline, improvisation, and cross-cultural negotiation from genuine operational exposure. Canadian immigrant entrepreneurs who built businesses in Nigeria, Vietnam, Lebanon, India, Brazil, or Ukraine have exactly this experience. They understand thin markets, informal business networks, and operating without institutional support in ways that Canadian-born entrepreneurs rarely face. This knowledge pool is invisible to Canadian business education — not because it isn't valued in principle, but because no mechanism exists to discover, verify, and connect it to programs that would benefit from it."
  dominant_forces:
    - "Discovery failure — Business programs rely on personal referral networks for mentors; immigrant entrepreneurs are systematically outside those networks"
    - "Credential opacity — Immigrant entrepreneurs cannot easily represent their business experience in forms that Canadian institutions recognize for mentor qualification"
    - "Cultural communication gap — Immigrant entrepreneurs may be uncertain whether their business experience in a different regulatory and cultural context is relevant to Canadian students"
    - "Geographic clustering — Immigrant entrepreneur communities cluster in ethnic business associations and cultural networks that rarely intersect with university business school programming"
    - "Trust deficit — Programs cannot verify the depth and authenticity of claimed business experience without personal introduction or expensive vetting"
  deeperpoint_fit: "CoSolvent builds mentor profiles using a structured business narrative interrogation — what business did you operate, what was your market environment, what was your hardest operational challenge, how did you build customer trust without institutional infrastructure, how did you manage cash in a high-volatility context. The AI conversation extracts and verifies business knowledge depth in a way that is culturally portable and not dependent on Canadian-format credentials. Program profiles capture the mentorship need: startup stage, sector, student demographic, session format, and thematic focus (market entry, finance, operations, resilience). CommonContext carries Canadian regulatory context guides for mentors who will advise on Canadian business formation, sector-specific SIC code guides, and cultural communication frameworks for cross-background mentorship pairs."
  economic_upside: "Canada's startup incubator and business education ecosystem invests $150M+ annually in mentorship programs, accelerator programming, and entrepreneurship support. The average mentor in most programs is a retired Canadian-born executive or a service-sector professional — a relatively narrow experience base. Expanding the mentor pool to include immigrant entrepreneurs who bring operational experience in high-uncertainty environments would increase the quality and diversity of mentorship without requiring additional funding. Platform revenue: mentor matching fee per confirmed engagement ($100–$250), program subscription for universities and incubators ($600–$3,000/year), corporate immigration partner packages."

