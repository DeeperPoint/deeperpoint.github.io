story:
  title: "The Case Study That Wasn't in the Textbook"
  status: draft
  blog_slug: ""
  characters:
    - "Emeka Okonkwo - Nigerian-Canadian entrepreneur, former operator of a logistics company in Lagos"
    - "Prof. Sandra Walsh - entrepreneurship professor, Ryerson DMZ, Toronto"
    - "Ben Liu - MBA student, social enterprise track"
  summary: "Sandra is building a case study module on operating under extreme market uncertainty. Emeka ran a refrigerated transport business in Lagos during two naira devaluations and a fuel subsidy collapse. His operational decisions are a masterclass in thin-market improvisation — and he has never been asked to tell the story in an academic setting."
  body: |
    ## Act A - The Market Structure

    Canadian business school entrepreneurship curriculum draws its case studies from two sources:
    Harvard Business Review and the personal networks of its faculty. Both sources are geographically
    and demographically narrow. The result is a curriculum that teaches venture capital-backed
    startup dynamics to students who will mostly operate in markets that look nothing like
    Silicon Valley — small towns, ethnic communities, developing economies, resource sectors,
    social enterprise contexts.

    The operational knowledge that immigrant entrepreneurs carry — built under conditions of
    genuine market uncertainty, without institutional support, in environments that Canadian
    corporate training has never encountered — is pedagogically more relevant to most student
    entrepreneurs than the Harvard case studies that dominate the curriculum. It just isn't
    in any database that business faculty can search.

    ---

    ## Act B - The Story

    **Emeka Okonkwo** came to Canada in 2018. In Lagos, he had operated a cold-chain logistics
    company that served hospitals, pharmaceutical distributors, and occasionally food exporters.
    He ran fourteen refrigerated vehicles, employed 43 people, and navigated the 2016 and 2017
    naira crises by converting his vehicle lease deposits to USD, renegotiating contracts in
    parallel currency terms, and keeping his hospital clients paying while food clients paid
    late. He survived both crises without a bank guarantee, without government support, and
    without a single missed payroll.

    In Toronto, he is building a much smaller logistics consultancy. He is available as a mentor.
    He does not know how to describe his Lagos experience in terms Canadian business schools
    recognize, and he has not been asked.

    **Prof. Sandra Walsh** at the Ryerson DMZ runs an entrepreneurship module on operating
    under uncertainty. She has been looking for a guest case presenter who has actually
    operated under extreme market volatility — not described it academically, but run a
    business through it. She registered the need on the platform: entrepreneurship mentorship
    or case presentation, operating experience in high-uncertainty market conditions,
    operations or logistics sector.

    The platform identifies Emeka's profile as a structural match: logistics operations
    experience, documented high-volatility market navigation, Lagos (an extreme operational
    environment by any measure), mentorship available.

    The Generative Match Story presents the profile with a summary of the operational context
    the platform extracted: *"Emeka Okonkwo — cold-chain logistics operations, Lagos, Nigeria.
    14-vehicle fleet. Operated through 2016–17 naira crisis: currency hedging through USD
    lease deposits, parallel currency contract renegotiation, differential client payment
    management. 43 employees, zero missed payroll. Now building logistics consultancy in Toronto."*

    Sandra reads it twice. She calls Emeka that afternoon.

    He presents to her MBA cohort for ninety minutes. He does not use slides. He tells the
    story — the morning he realized that his fuel supplier would not take naira for the next
    delivery, the decision matrix he ran between reducing the fleet and renegotiating contracts,
    the conversation he had with his drivers about a two-week payment deferral that he promised
    to make up.

    **Ben Liu** is in the back row. His social enterprise project is a mobile health supply
    chain for rural Ontario communities. He has been thinking about buffer stock and payment
    terms. For the first time, he is hearing someone describe exactly those problems — not
    as theory, but as decisions made under pressure with real consequences.

    After class, he asks Emeka if he is available to consult on his supply chain model.

    Emeka says yes.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Emeka's Lagos experience is more instructionally valuable for Ben's enterprise than most
    Harvard case studies Sandra could assign — because Ben is not building a VC-backed startup
    in San Francisco. He is building a supply chain for underserved communities with constrained
    resources and unreliable demand signals. That is exactly what Emeka navigated for nine years.

    The Harvard case is in the database. Emeka is not. Not because his experience is less
    real — but because no one built the mechanism to find him, verify what he knows, and
    bring him into a room where it would change something.

    Canada's immigrant entrepreneur community is the single most underutilized curriculum
    resource in Canadian business education. The platform is not the solution to everything
    that is missing. It is the discovery infrastructure that makes the conversation possible.

    *Characters are fictional. Nigeria's 2016–17 naira devaluation, Lagos cold chain logistics
    dynamics, and the Ryerson DMZ entrepreneurship program are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
