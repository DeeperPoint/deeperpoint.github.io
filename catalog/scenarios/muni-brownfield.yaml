market_example:
  summary: "Ontario's estimated 30,000 brownfield sites represent over $10 billion in trapped development potential. Most sit idle for decades because assembling a viable transaction across municipality, developer, remediator, and funder requires information exchange that no existing platform supports."
  problem: "Municipalities hold or oversee significant inventories of brownfield properties — former industrial sites, gas stations, dry cleaners, rail yards — with known or suspected contamination. Matching a brownfield site to an appropriate developer and remediation firm is a multi-dimensional, high-stakes problem: the site's contamination profile, development potential, municipal risk tolerance, funding program eligibility, and regulatory pathway must all be aligned before a viable transaction can be assembled. Most brownfields sit idle for decades because the matching problem — across municipality, developer, remediator, and funder — is never solved."
  dominant_forces:
    - "Information asymmetry — the municipality knows the contamination profile; potential developers know their risk appetite; remediation firms know the technical options; no common framework connects these domains"
    - "Regulatory fragmentation — Record of Site Condition requirements, O. Reg. 153/04, federal contaminated sites programs, and provincial brownfield tax incentives vary by jurisdiction and site complexity"
    - "Risk — brownfield development involves environmental liability that cannot be fully characterized before commitment; both developers and municipalities use risk to justify inaction"
    - "Offering complexity — each site is unique in contamination type, depth, groundwater interaction, municipal servicing status, zoning, and surrounding land use context"
    - "Cognitive overload — economic development officers managing community benefit zones, heritage overlays, affordable housing requirements, and brownfield sites simultaneously cannot hold the full complexity of each brownfield transaction in mind"
  deeperpoint_fit: "Semantic matching aligns brownfield site profiles (contamination characterization, development potential, servicing status, zoning, funding eligibility) with developer profiles (development type, risk tolerance, capitalization, brownfield experience) and remediator capabilities (contaminant specialization, regulatory certification, provincial approvals). KnowledgeSlot curates Ontario Environmental Protection Act requirements, Record of Site Condition regulations, federal contaminated sites program eligibility, BFTIP financial incentive programs, and risk assessment methodologies. The trusted intermediary protocol allows municipalities to share site characterization data with pre-qualified developers without public disclosure that could depress adjacent property values. The Deal Brief captures the multi-party transaction structure."
  economic_upside: "Ontario alone has an estimated 30,000 brownfield sites representing over $10 billion in trapped development potential. Each successfully matched brownfield transaction generates construction jobs, increases the municipal tax base, removes environmental liability, and often enables affordable housing or community facility development on land that was otherwise creating negative value."

