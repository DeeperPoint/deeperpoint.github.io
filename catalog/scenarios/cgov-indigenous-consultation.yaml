story:
  title: "The Treaty Three Practitioner"
  status: draft
  blog_slug: ""
  characters:
    - "Leonard — independent consultation practitioner, deep expertise in Treaty 3 Anishinaabe governance and traditional territory, Thunder Bay"
    - "Sandra — consultation coordinator, federal northern Ontario infrastructure agency"
  summary: "A federal agency initiating consultation on a transmission line corridor through Treaty 3 territory defaults to a generalist Indigenous consultation firm — and receives a judicial review challenge that a Treaty 3-specific practitioner would have identified and prevented."
  body: |
    ## Act A — The Generalist Default

    The phrase "duty to consult" is well understood in Canadian administrative law. What is less well understood — in practice, despite being well-established in jurisprudence — is that the duty is specific. Haida Nation requires consultation calibrated to the rights at issue, the severity of the potential infringement, and the governance and decision-making structures of the affected nation. A consultation process designed for a Treaty 6 Cree nation does not transfer to a Treaty 3 Anishinaabe nation. The governance structures differ. The treaty text differs. The traditional land use documentation methodologies differ. The prior consultation positions differ. The relevant jurisprudence differs.

    Federal agencies know this in principle. In practice, they default to the consulting firms they know — firms that are competent generalists and competent at procedural compliance, but that lack the nation-specific depth the jurisprudence actually requires. The result is a consultation record that satisfies the form of the requirement and fails the substance.

    Judicial review is expensive for everyone.

    ---

    ## Act B — The Story

    **Sandra** is coordinating consultation on a 420-kilometre transmission line corridor proposed through northern Ontario. The corridor crosses significant portions of Treaty 3 territory and intersects with identified traditional harvesting areas of three Anishinaabe communities.

    Her agency has a standing arrangement with a national Indigenous consultation firm that has managed their consultation processes for several years. The firm is professionally competent. They have conducted dozens of consultation processes for federal infrastructure projects. Two of their senior practitioners have worked in northern Ontario before — on projects in Treaty 9 areas.

    Sandra engages them for the Treaty 3 corridor without a specialist search.

    The consultation proceeds. Procedurally, the record looks complete. Engagement letters sent, community sessions held, written representations received, accommodation measures proposed.

    Eighteen months later, the Rainy Lake band challenges the consultation record in Federal Court. The application for judicial review identifies a specific deficiency: the consultation failed to engage the Treaty 3 Grand Council governance structure in its proper decision-making role, defaulting instead to band-level engagement in a context where the Treaty 3 collective governance authority over the territory was established by prior panel decisions and the specific treaty text. The agency's consultation firm was not aware of the Grand Council's constitutional role in Treaty 3 territory. That knowledge required Treaty 3-specific expertise they did not have.

    ---

    **Leonard** has spent twenty-two years working with Treaty 3 Anishinaabe communities — first as a band council legal advisor, then as an independent practitioner. He knows the Treaty 3 Grand Council governance structure, its jurisdictional relationship to member bands, and the specific traditional land use documentation practices the communities use for corridor project engagement. He has served as an expert witness in two Federal Court proceedings involving Treaty 3 rights.

    He registered on the MarketForge Crown consultation expert platform after a colleague recommended it. His profile specifies: Treaty 3 Anishinaabe governance, Grand Council jurisdictional knowledge, traditional land use methodology specific to northwestern Ontario, court-accepted expert witness status, active conflict-of-interest declarations relative to specific communities.

    Sandra had no awareness of the platform. Her agency had not provisioned an account.

    The judicial review is in its third month of proceedings. Estimated resolution timeline: fourteen months. Estimated direct legal and delay costs: $2.8 million.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The expertise Leonard holds is not catalogued anywhere a federal coordination officer would find it. He does not appear in the generalist Indigenous consulting directories that procurement officers use. He does not work for a national firm with a federal standing offer. He operates as an independent practitioner in Thunder Bay, known in Treaty 3 communities and in the Federal Court Indigenous law bar — neither of which is a discovery channel for federal infrastructure project coordination staff.

    The consultation deficiency that produced the judicial review was foreseeable and preventable. The preventing information was: Treaty 3 Grand Council governance structure has collective jurisdictional standing over this territory that cannot be substituted by band-level engagement. That information exists in multiple prior decisions. Applying it to Sandra's project required a practitioner who knew the territory.

    [Thin market infrastructure](../../thin-markets.html) makes the distinction between nation-specific and generalist expertise legible at the point of procurement — before the consultation record is built, not after it is challenged.

    *Characters are fictional. The Treaty 3 Grand Council's governance authority, the Haida Nation Section 35 test for consultation adequacy, and Federal Court judicial review of Crown consultation records are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
