market_example:
  summary: "Federal and provincial Crown agencies discharging their Section 35 duty to consult cannot efficiently identify experts in specific First Nations governance structures, treaty histories, and traditional land use methodologies whose expertise is specific to the nation and territory involved in a given consultation process."
  problem: "The Crown's duty to consult under Section 35 of the Constitution Act and the United Nations Declaration on the Rights of Indigenous Peoples requires engagement that is specific to the particular First Nation, their treaty or pre-treaty rights, their governance structure, and the specific territory affected by a Crown decision or project. Generalist Indigenous relations consultants lack the depth of nation-specific knowledge that meaningful consultation requires. Experts with deep expertise in a specific nation's governance history, traditional land use documentation methodologies, and treaty interpretation are a small, poorly discoverable population distributed across law firms, academic institutions, First Nations government organizations, and independent practice. Federal and provincial agencies default to the same small network of recognized generalists — producing consultations that affected nations routinely challenge as procedurally deficient."
  dominant_forces:
    - "Participant scarcity — the pool of practitioners with deep expertise in specific First Nations governance histories, specific treaty frameworks, and nation-specific traditional land use methodologies is genuinely small"
    - "Opacity — the distinction between nation-specific expertise and general Indigenous consultation competency is not legible from standard consultant directories or academic CVs"
    - "Trust deficit — the credibility of a consultation process depends partly on the demonstrated nation-specific knowledge of the facilitators; using generalists in nation-specific contexts damages trust and produces legally vulnerable outcomes"
    - "Constitutional risk — procedurally deficient consultations are challenged through judicial review; the cost of a successful challenge exceeds the cost of competent consultation by an order of magnitude"
    - "Offering complexity — matching requires alignment across specific First Nation identity, treaty framework, territory geography, type of Crown decision, stage of consultation process, and required deliverable format"
  deeperpoint_fit: "Semantic matching encodes practitioner profiles (specific nation expertise by Treaty area and pre-treaty territory, governance structure knowledge depth, traditional land use documentation methodology, court-accepted expert witness experience, active conflict-of-interest declarations relative to specific nations) against agency demand signals (nation identity, treaty area, type of Crown decision, consultation stage, required deliverable). KnowledgeSlot curates Haida Nation, Mikisew Cree, and other foundational Section 35 decisions, UNDRIP FPIC provisions, and nation-specific governance documentation across all treaty areas. The trusted intermediary model holds agency strategy information confidentially until mutual interest is established."
  economic_upside: "Federal judicial reviews of consultation processes cost $500,000–$5,000,000 per proceeding and routinely delay major projects by two to five years. Better expert matching reduces the procedural vulnerability of consultation records, reduces challenged consultation rates, and accelerates project timelines. For affected First Nations, better-matched consultation practitioners deliver more substantively useful engagement."

