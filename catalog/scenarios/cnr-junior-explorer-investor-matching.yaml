  body: |
    ## Act A - The Market Structure

    There are roughly 1,200 junior exploration companies on the TSX Venture Exchange.
    Their geological datasets—drill databases, geophysical surveys, NI 43-101 technical
    reports filed on SEDAR+—contain more information about Canada's mineral endowment than
    any other public dataset on earth. And none of it is searchable by the criteria that
    actually matter for investment matching: deposit style, commodity combination, grade
    profile, intersection geometry, geological model analogue.

    SEDAR+ is a regulatory archive. PDAC is a promotional event. Neither was designed to
    match geologically excellent but promotionally invisible companies with the specialist
    investors whose mandates they would satisfy exactly.

    ---

    ## Act B - The Story

    **Claire** has spent five years supervising drilling on a copper-gold target in the
    Kapuskasing structural zone of northern Ontario. The Phase 1 program returned intersections
    of 0.8–2.4 g/t Au and 0.6–1.1% Cu over 12–28 metres in a magnetite-bearing gabbro—a
    magmatic sulphide system with 3.2 kilometres of strike extent visible on ground magnetics.
    Northreach filed the NI 43-101 report. The company's CEO attended PDAC, didn't get a
    Core Shack slot, had 340 conversations with other juniors in the same situation, and met
    two institutional investors who never followed up. The company will run out of cash in September.

    **Erik** manages a Nordic critical minerals fund with a specific mandate: copper-gold projects
    in Tier 1 jurisdictions, at the post-Phase-1 exploration stage, with NI 43-101 compliance,
    preferring magmatic sulphide or IOCG deposit styles—not porphyry, of which the fund already
    has BC and Chile exposure. Last year he reviewed 280 projects. Fourteen met his basic criteria.
    He funded one. The other 266 were projects that reached him through existing channels—not
    the universe of projects that would actually match his mandate.

    The Ontario Prospectors Association deploys the platform. Claire uploads the NI 43-101
    report and drill database. The system extracts the structured geological profile: Cu-Au,
    magmatic sulphide, Ontario, post-Phase-1, $2.8M capital requirement, JV preferred. Erik
    uploads his fund's 14-page screening criteria document. The match is structural, not
    categorical. The platform generates a Generative Match Story—a hypothetical JV term model
    aligned to Ontario conventions and CIM standards—giving Claire the vocabulary to engage
    Erik's term sheet before the first call.

    They connect in September. Drills are on the ground the following January.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The conference circuit cannot be the primary discovery mechanism for the industry that
    supplies the planet's critical minerals. Geological merit and promotional capacity are
    not the same thing, and systematically confusing them has left billions in exploration
    capital sitting undeployed while geologically excellent projects run out of cash.

    DeeperPoint builds the matching infrastructure that reads the geology, not the pitch deck.

    *Claire and Erik are fictional. The junior mining exploration dynamics, NI 43-101
    framework, and conference-dependent matching infrastructure described are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
