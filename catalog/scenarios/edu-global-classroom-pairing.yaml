market_example:
  summary: "Canadian secondary school teachers who want to pair their classrooms with partner classrooms in Mexico, Ethiopia, Colombia, Japan, Finland, and elsewhere for collaborative curriculum projects cannot navigate the discovery problem — finding a partner classroom that is at the same grade level, studying a compatible topic, and willing to commit to a structured semester exchange. A matching platform resolves this thin market."
  problem: "Global classroom partnership programs — where Canadian students collaborate with students in another country on shared curriculum projects — have demonstrated transformational impact on students' understanding of global issues, cross-cultural communication, and vocational empathy. The programs that exist (iEARN, PenPal Schools, COIL frameworks) are limited by the same discovery problem facing all thin markets: a teacher in Edmonton who wants to pair a Grade 10 social studies unit on food systems with a real classroom of students studying food security in Ethiopia or agricultural economics in Mexico cannot find that classroom through any efficient mechanism. She fills out a form on a global program website and waits months for a match that may not fit her curriculum at all."
  dominant_forces:
    - "Discovery failure — No mechanism to match teacher-classroom pairs across 195 countries by grade level, curriculum topic, language, and timing simultaneously"
    - "Temporal mismatch — School calendars differ by hemisphere, country, and curriculum system; overlapping windows for substantive collaboration are narrow and not indexed anywhere"
    - "Trust deficit — Teachers are reluctant to commit class time to a partnership with an unknown foreign classroom without confidence that the partner has equivalent commitment and aligned learning goals"
    - "Curriculum alignment complexity — Collaborative projects require that both classrooms are studying compatible topics at compatible depth — a match that requires detailed curriculum profile comparison"
    - "Institutional inertia — School boards are cautious about international partnerships due to data privacy, parent consent, and liability concerns; these barriers are navigable but only with structured support"
  deeperpoint_fit: "CoSolvent builds classroom partnership profiles with granular curriculum detail: subject, grade equivalent, specific unit topic, learning objectives, available collaboration formats (video exchange, joint research project, co-produced digital content, debate exchange), timeline, and technology available. The matching engine cross-references these profiles across time zones, school calendars, and language pairs to identify high-compatibility classroom pairs. KnowledgeSlot carries school board partnership consent templates by Canadian province, UN-aligned global citizenship competency frameworks, and structured project templates for common collaboration formats (food systems, climate, democracy, trade, arts) that give matched teachers a ready-made starting point."
  economic_upside: "Canada's 15,000+ secondary schools have 100,000+ teachers who survey after survey shows want global classroom connections they cannot find efficiently. Global citizenship education is a Ministry of Education priority in BC, Ontario, and Quebec. If 5% of willing teachers complete one verified global classroom partnership per year through the platform, that represents 5,000 classroom pairs per year — each generating $100–$300 in platform fees for a system managing matching, consent templates, and project scaffolding. Platform revenue: classroom pair matching fee ($100–$250 per confirmed partnership), board-level global education subscription ($2,000–$8,000/year), curriculum resource licensing from global citizenship organizations."

