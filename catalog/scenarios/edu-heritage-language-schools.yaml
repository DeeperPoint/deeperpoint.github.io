story:
  title: "Forty Kids and No Teacher"
  status: draft
  blog_slug: ""
  characters:
    - "Priya Nair - Tamil language program coordinator, Toronto District School Board"
    - "Dr. Meena Subramaniam - retired Tamil professor, University of Jaffna, immigrated 2021"
    - "Arjun Subramaniam - 9-year-old student, Priya's program waitlist"
  summary: "Forty Tamil-speaking children are on a waitlist for Saturday Tamil language classes in Scarborough. Dr. Meena retired from the University of Jaffna faculty and lives ten minutes from the school. Nobody connected them — until the platform did."
  body: |
    ## Act A - The Market Structure

    Tamil is one of Ontario's fastest-growing heritage languages. The Greater Toronto Area's
    Tamil community numbers over 300,000 — the largest concentration outside South Asia and
    Sri Lanka. The Toronto District School Board runs Saturday Tamil heritage classes at
    fourteen locations. At eleven of those locations, there is a waitlist.

    The waitlists exist not because of space or funding — both exist. They exist because
    the board cannot find instructors. The Tamil community's educated, formally trained teachers
    are invisible to the board's hiring system. They are retired professors, former school
    principals, language arts specialists — people who spent their careers teaching Tamil
    literature and grammar at levels far above what a Saturday heritage class requires.

    They are not on the job boards. They are not in the OCT system. They are, frequently,
    living within walking distance of a school where forty children are waiting for them.

    ---

    ## Act B - The Story

    **Priya Nair** has been trying to fill two instructor positions in the Scarborough Tamil
    program for four months. She has called three Tamil cultural associations, posted in two
    Facebook groups, and asked every instructor she currently employs if they know anyone.
    One lead fell through. One candidate could not pass the vulnerable sector check in time
    for the semester.

    **Dr. Meena Subramaniam** taught Tamil language, literature, and linguistics at the
    University of Jaffna for 31 years. She retired in 2020 and followed her daughter to
    Scarborough in 2021. She speaks and writes classical and modern Tamil at a scholarly level.
    She misses teaching. She has thought about contacting a Tamil school but does not know
    how the board program works and is uncertain whether her Sri Lankan qualifications
    would be accepted.

    She registered with the platform through her local Tamil Seniors Association, which
    had partnered with the board's settlement support program. The platform conversation
    asks her in Tamil: what age groups have you taught, what is your approach to teaching
    Tamil script to children who speak English at home, what literary texts do you consider
    foundational for ages 8–12, do you understand the difference between teaching a heritage
    language and teaching a first language.

    Her answers are expert and nuanced. Her competence profile notes: University-level Tamil
    instruction, literature and linguistics depth, experience adapting to diaspora student
    contexts, script instruction methodology, cultural heritage integration.

    Priya receives the match notification. She sees the profile. She calls Dr. Meena that afternoon.

    Dr. Meena's vulnerable sector check clears in three weeks. She begins teaching the
    following Saturday.

    **Arjun Subramaniam** — no relation — is nine years old. He has been on the waitlist
    since September. His parents want him to read Tamil, to write his grandmother letters
    in her own script, to know where he comes from. He starts classes in January.

    By June, he can read a simple poem. Dr. Meena assigns the first stanza of Thirukkural.
    He reads it aloud, slowly, in front of the class. She does not correct his pronunciation.
    She lets him finish.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Priya's problem is not a shortage of Tamil educators in Scarborough. It is a discovery
    failure — a complete absence of any mechanism connecting the board's documented need
    to the community's undocumented supply.

    The board's hiring system was built for the majority use case: a certified OCT teacher
    applying for a posted position. Heritage language instruction is not that use case.
    The community's educators are not in that pipeline. And no one built the alternative.

    The platform is not a workaround to the credential system. It is an infrastructure
    layer that the credential system never had in this vertical: a discovery and verification
    mechanism appropriate for the specific context of community heritage language instruction.

    Arjun's parents pay taxes that fund this program. The program exists. The teacher exists.
    The forty-child waitlist is a pure infrastructure failure — and a solvable one.

    *Characters are fictional. Ontario's heritage language program, the Tamil community's
    scope in the GTA, and school board hiring barriers for foreign-trained educators are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
