market_example:
  summary: "Ontario, BC, and Alberta school boards run heritage language programs that struggle chronically to find qualified teachers in the 60+ languages their immigrant communities speak. Those communities contain fluent, educated speakers — many with teaching backgrounds from their home countries — who are invisible to school board hiring systems built for Ontario Teachers' College graduates."
  problem: "Canada's heritage language programs — Saturday language schools, after-school programs, and board-integrated heritage classes — serve over 200,000 students annually in Ontario alone. These programs cover Arabic, Punjabi, Tagalog, Mandarin, Urdu, Tamil, Farsi, Ukrainian, and dozens of other languages. School boards routinely run waitlists because they cannot find qualified instructors. Meanwhile, every major Canadian city contains immigrant communities with thousands of highly educated native speakers — former teachers, professors, and cultural educators from countries where language instruction is a prestigious profession. The board's hiring portal requires an Ontario College of Teachers membership. The community's instructors have a degree from Lahore or Kyiv and are working in a call centre."
  dominant_forces:
    - "Credential barrier — School board hiring systems require provincial teaching certification that foreign-trained teachers cannot obtain quickly or cheaply"
    - "Discovery failure — School boards have no mechanism to find qualified heritage language speakers within specific immigrant communities"
    - "Community fragmentation — Heritage language instructors within the same city are unaware of each other and of board program vacancies"
    - "Trust deficit — School boards cannot verify the pedagogical competence of foreign-trained instructors without an expensive evaluation process"
    - "Cultural protocol — Heritage language programs require not just linguistic fluency but cultural authenticity — the right dialect, the right script, the community's trust"
  deeperpoint_fit: "CoSolvent builds instructor profiles with cultural and linguistic specificity: language variant (Levantine vs. Egyptian Arabic, Simplified vs. Traditional Mandarin), script literacy, pedagogical experience, age group specialization, and community recognition — assessed through a competence conversation and peer confirmation within the registered community network. School board profiles capture language needed, student age range, program format (weekend class, after-school, in-school), and engagement structure (casual supply, ongoing contract, community partnership). KnowledgeSlot carries provincial curriculum frameworks for heritage language instruction, school board engagement policy templates, and Ministry of Education community language program guidelines."
  economic_upside: "Ontario's heritage language program has an estimated $80M annual budget. BC, Alberta, and Manitoba run comparable programs. Instructor vacancy rates are estimated at 15–25% across heritage language programs nationally — representing 500–900 unfilled instructor positions at any given time. Platform revenue: matching fee per confirmed placement ($100–$300), board subscription for multi-language matching access ($800–$3,000/year), community organization partnership fee."

