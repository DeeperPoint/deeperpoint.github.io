market_example:
  summary: "Emerging food brands cannot reach independent grocery category buyers; buyers cannot discover differentiated regional brands outside personal networks."
  problem: "Independent grocery chains actively differentiate through distinctive regional brands, but their category buyers are unreachable without network access. Brand owners approach at the wrong time in the review cycle and are forgotten. Both sides want the same transaction; timing opacity and network dependency prevent it."
  dominant_forces:
    - "Opacity — category buyer contacts are not indexed by category and chain"
    - "Timing asymmetry — category review cycles are invisible to brand owners"
    - "Cognitive overload — buyers reviewing 40+ unsolicited submissions per month cannot compare systematically"
    - "Offering complexity — fit depends on price architecture, category gap, format, and marketing support"
    - "Trust deficit — buyers who list an unreliable brand receive direct consumer complaints"
  deeperpoint_fit: "Semantic matching aligns brand profiles (category, price point, certifications, shelf life, volume, marketing support) against buyer profiles (category gaps, price architecture, certification requirements, delivery logistics). Timing integration notifies matched brands when a buyer's category review window opens. KnowledgeSlot curates CFIA labelling requirements, GS1 registration procedures, and standard independent retail trade terms."
  economic_upside: "Independent grocery is where regional food brands establish commercial identity before achieving scale or acquisition. Reducing the 2–4 year network-access runway creates new shelf presence for regional products and a richer, more differentiated Canadian food retail landscape."

