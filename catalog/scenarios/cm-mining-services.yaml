market_example:
  summary: "Canadian junior mining service firms have globally applicable expertise but cannot find Mexican small-operator clients; Mexican junior companies and ejido operations cannot distinguish qualified Canadian specialists from undifferentiated solicitation."
  problem: "Canada has a dense ecosystem of junior mining service firms — geological services, environmental assessment consultants, metallurgical testing labs, assay services, drilling contractors, and mine finance advisors. Mexico's mining sector is extensive but dominated by large foreign majors and a fragmented tier of small Mexican junior operators and ejido community mining operations that lack access to specialized services. Canadian junior mining services cannot efficiently identify and reach Mexican small-operator clients; Mexican operators cannot distinguish qualified Canadian specialists from generic business development outreach and have a history of extractive relationships with foreign advisors that makes them wary."
  dominant_forces:
    - "Opacity — Canadian junior mining service firms are invisible to Mexican operators beyond direct referrals at PDAC (once per year); Mexican operators are not visible to Canadian services except through large-network brokers"
    - "Information asymmetry — Mexican ejido operators have technical needs but limited capacity to specify what type of Canadian expertise they actually need vs. what they can source locally"
    - "Offering complexity — Canadian mining services range from NI 43-101 resource estimation to ISO 17025-accredited assay labs to environmental permitting — not all applicable to Mexico's SEMARNAT framework"
    - "Trust deficit — Mexican operators have a history of extractive relationships with foreign advisors; Canadian service firms face reputational risk from contracting with ejido-affiliated operators without proper due diligence"
    - "Regulatory fragmentation — SEMARNAT environmental requirements, SEGOB ejido land tenure documentation, and Servicio Geológico Mexicano reporting standards are unfamiliar to most Canadian firms"
  deeperpoint_fit: "Semantic matching aligns Canadian service firm profiles (specific technical capabilities, prior Mexico experience, Spanish-language capacity, transferable certifications) with Mexican operator profiles (deposit type, regulatory pathway, current project stage, technical gap). KnowledgeSlot curates Ley Minera regulations, SEMARNAT environmental permitting sequences, Servicio Geológico Mexicano standards, and ejido land rights under Ley Agraria. The trusted intermediary protocol allows Mexican operators to share project details privately with matched Canadian service firms without public disclosure that could affect land tenure negotiations."
  economic_upside: "Mexico's mining services market is chronically undersupplied with specialized technical expertise — a constraint that depresses exploration productivity and small-operator viability. Better matching creates new professional service exports for Canada, improves permitting quality for Mexican operators, and reduces cycle time from discovery to production assessment."

