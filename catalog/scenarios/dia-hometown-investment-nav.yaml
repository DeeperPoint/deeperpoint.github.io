market_example:
  summary: "A Lebanese-Canadian dentist wants to invest $80,000 in a hometown building. He has urgency, a cousin who can manage it, and no idea whether the property registration system is currently operating or how to transfer funds under Banque du Liban restrictions. The market matches diaspora investors to homeland investment navigators who know current conditions — not the pre-crisis version."
  problem: "Diaspora Canadians collectively remit over $25 billion annually to their home countries, and a portion of this is investment capital rather than consumption support — money intended to buy property, fund a family business, or back a community enterprise. This capital flow is significantly larger than formal diaspora investment channels capture, because the informal channels are the only ones that actually work. A Jamaican-Canadian entrepreneur in Brampton who wants to invest $50,000 in her cousin's rum bar expansion in Kingston faces a set of obstacles that have nothing to do with her willingness to invest: Jamaican business registration requirements for foreign shareholders, the tax treatment of dividend repatriation under the Canada-Jamaica tax treaty, how to evaluate whether the lease on the cousin's premises has another five years or another nine months, and whether the cousin's accountant is actually filing the right returns. None of these questions are answerable by a Canadian investment advisor, a Canadian accountant, or a Canadian lawyer. They require a homeland-specific navigator who understands the current regulatory and market environment — not the one described in a Global Affairs Canada country brief written four years ago, but the one operating this week, with the current exchange controls, the current political environment, and the current enforcement practices of the business registration authority."
  dominant_forces:
    - "Regulatory environment instability — many diaspora home countries have volatile regulatory environments (capital controls, property registration freezes, currency restrictions) that change faster than any reference document stays current; investor decision-making requires real-time local knowledge"
    - "Due diligence gap — diaspora investors are relying on family members whose optimism about investment proposals is rarely calibrated against market comparables, lease terms, or competitor analysis; a neutral local advisor provides the missing due diligence layer"
    - "Cross-border financial transfer compliance — FINTRAC reporting requirements for transfers above $10,000, foreign ownership rules in many homeland countries, and anti-money-laundering compliance requirements create compliance complexity that informal transfer mechanisms handle by ignoring"
    - "Third-party management trust — diaspora investors who cannot be present to manage their investment are dependent on a local manager (often a family member) whose reporting practices, financial transparency, and conflict of interest are unverified"
    - "Currency and repatriation uncertainty — investors cannot rationally evaluate a homeland investment without knowing the realistic mechanism for repatriating returns; in countries with active capital controls (Lebanon, Pakistan, Zimbabwe), this question may have no good answer at present"
  deeperpoint_fit: "MarketForge matches diaspora investors to homeland investment navigators — professionals who combine local business and regulatory knowledge with experience serving non-resident investors from specific diaspora communities. Navigators are listed by homeland country and city, with profiles documenting their professional background, transaction experience with non-resident clients, and documented current-environment knowledge (last updated date prominent). Knowledge Slot provides current country-level investment environment summaries: regulatory status, capital control status, property registration operating conditions, and financial transfer compliance requirements — updated quarterly by navigator network contributors. An AI-assisted due diligence checklist generates a structured set of questions for any specific investment type and country pair."
  economic_upside: "Diaspora investment capital flowing to homeland small businesses and real estate is estimated at $3–5 billion annually from Canada alone, nearly all transacted without professional investment navigation services. A platform that provides verified navigator services for 1% of this flow — $30–50 million in navigated transactions — at a 1.5% navigator fee generates $450,000–$750,000 in annual platform-facilitated revenue at very modest market penetration. Platforms that reduce diaspora capital leakage and investment failure rates also reduce the pressure on humanitarian remittances — a secondary benefit measurable to development finance institutions. The African Development Bank, Caribbean Development Bank, and Inter-American Development Bank all have diaspora investment programs looking for operational infrastructure."

