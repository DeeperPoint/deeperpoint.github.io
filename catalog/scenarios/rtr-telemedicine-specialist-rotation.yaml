market_example:
  summary: "Matches specialized medical consultants with remote northern health centers for virtual triage or short-term fly-in rotations. Commercial Note: Highly dependent on provincial/territorial health authority sponsorship."
  problem: "Remote northern communities lack access to specialized healthcare (psychiatry, endocrinology, specialized pediatrics). Recruiting permanent specialists is impossible. Fly-in/fly-out (locum) models are highly inefficient, disorganized, and suffer from poor continuity of care. Meanwhile, specialists down south often have fractional capacity they would willingly donate or bill if the logistics and credentialing were frictionless."
  dominant_forces:
    - "Severe health outcome disparities in remote indigenous and northern communities."
    - "Massive administrative friction in cross-jurisdictional medical credentialing."
    - "Logistics of remote clinics (housing, precise scheduling, flight coordination) are brutal."
  deeperpoint_fit: "CoSolvent manages the complex multi-party scheduling between available physicians, charter flights, and clinic space. KnowledgeSlot securely manages the credentialing verification and temporary privileges across territories."
  economic_upside: "Reduces billion-dollar public outlays on medical transport (medevacs) by shifting to preventative local locum care. Market capture occurs through administrative fee reduction."

