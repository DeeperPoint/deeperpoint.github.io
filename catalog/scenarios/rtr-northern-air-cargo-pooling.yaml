market_example:
  summary: "Matches multiple smaller remote businesses, clinics, and band councils to pool air freight charters ('backhaul' or shared payload) to dramatically reduce supply costs."
  problem: "Air freight to remote communities without year-round road access is cripplingly expensive. A small grocery store ordering pallets of food often has to charter a plane and pay for the 'empty leg' returning south. Multiple buyers in the same region order independently, resulting in half-empty planes generating massive carbon footprints and inflated retail prices."
  dominant_forces:
    - "Extreme monopolies or duopolies in northern aviation routes."
    - "Information silos prevent independent businesses from coordinating shipments."
    - "High fixed costs for aviation mean partial payloads are financially punishing."
  deeperpoint_fit: "CoSolvent acts as an aggregation engine, matching the disparate volume needs of multiple buyers to fill dedicated cargo charters, optimizing aircraft payload constraints in real time."
  economic_upside: "A massive multi-million dollar logistics market. Unlocking a 30-40% reduction in freight costs dramatically alters the economic viability of remote living."

