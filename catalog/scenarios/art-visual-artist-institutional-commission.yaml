tags: [arts, public-art, commission, visual-artist, municipal, institutional, canada, participant-scarcity, opacity, percent-for-art]

market_example:
  summary: "Municipal percent-for-art programs, Indigenous-led public art initiatives, and hospital art commissions generate dozens of public art commission calls annually — but discovering qualified artists whose practice is right for the specific brief reaches only the already-connected institutional art world, while artists outside gallery representation have almost no mechanism to surface themselves to institutional commissioners."
  problem: "Public art commissioning in Canada and internationally is a structurally opaque market with a profound geographic and network bias. On the demand side: municipal governments, transit authorities, hospitals, universities, and Indigenous cultural organizations run percent-for-art commissions — typically 1–2% of capital project budgets directed to public art — that generate 50–200 commission calls per year nationally. These calls are published on institution-specific websites, through arts council mailing lists, and on platforms like public-art.ca and the Canada Council's funding announcement channels. On the supply side: thousands of professional artists have practices that could serve specific commission requirements — an Indigenous artist working in land-based reclamation themes for a Northern Ontario transit authority commission connecting to Treaty territory, a Haitian-Canadian artist whose practice addresses Caribbean diaspora identity for a Toronto community centre serving that community, a sculptor working with industrial salvage materials for a Hamilton steelworks heritage project. The connection between the right artist's practice and the right commission call depends almost entirely on whether the artist is already in the network of public art consultants, art administrators, and curators who circulate commission opportunities informally. Artists without gallery representation, outside major urban centres, or early in their institutional practice career are systematically excluded from a market they are qualified to serve."
  dominant_forces:
    - "Discovery gap — commission calls are published but not matched to artists; there is no mechanism that reads a commission brief and identifies which artists' practices are architecturally, thematically, and materially relevant to that specific call"
    - "Cultural specificity — community-specific commissions (Indigenous land-based themes, Caribbean diaspora identity, South Asian cultural expression) require artists with specific cultural credentials that general call-for-submission processes cannot effectively filter"
    - "Network dependency — public art consultants who manage commission processes maintain preferred artist lists built through personal relationship; artists outside these lists are not proposed even when their practice is directly relevant"
    - "Application burden — preparing a public art commission submission requires artist statements, portfolio preparation, references, and a project proposal; artists without institutional support invest 20–40 hours per application, creating a selection pressure toward artists with administrative infrastructure"
    - "Geographic exclusion — institutional commissions in Northern Ontario, rural British Columbia, and prairie cities are rarely served by Toronto or Vancouver-centric art world networks; regionally based artists whose practice is appropriate for the local context have no efficient mechanism to surface themselves"
  deeperpoint_fit: "Semantic matching encodes artist profiles (practice themes by conceptual and material framework, community and cultural identity — Indigenous Nation, diaspora affiliation, specific regional practice — prior commission history, scale and site-adaptation capability, budget range served, geographic base and travel willingness) against commission demand signals (thematic brief, material and site context, community served, cultural credential requirements, budget range, timeline, geography). The Generative Match Story helps artists understand commission opportunities that match their practice before they invest in a full application."
  economic_upside: "Canadian provincial and federal percent-for-art programs generate $30M–$60M in total public art commission value annually. The Canada Council's Public Lending Right and Visual Arts programs support an estimated 20,000+ professional visual artists. A platform that surfaces 10% more artist-commission matches than the current network-dependent process generates $3M–$6M in additional commission revenue distributed to artists outside the established institutional network — the highest-impact distribution being to mid-career and emerging artists in non-major-centre locations who are currently systematically excluded."

