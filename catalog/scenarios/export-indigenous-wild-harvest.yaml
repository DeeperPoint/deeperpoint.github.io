market_example:
  summary: A specialized, culturally secure marketplace connecting Indigenous-owned
    wild harvest collectives in Canada with premium global gastronomy and natural
    cosmetics brands.
  problem: Export Platform for Premium Indigenous-Harvested Botanicals and Seafood
  dominant_forces:
  - Surging global demand for ethically sourced, traceable wild ingredients.
  - Indigenous communities control vast pristine territories and traditional harvesting
    knowledge.
  - Exploitation by middlemen necessitates a platform that ensures equitable trade
    and IP protection.
  deeperpoint_fit: Focus on narrative, provenance, and sustainable harvest quotas
    rather than mass volume. Requires profound trust to protect traditional ecological
    knowledge (TEK) from biopiracy. Market design must respect Indigenous data sovereignty.
  economic_upside: Creates sustainable, high-margin economic engines for remote Indigenous
    communities. Delivers ultra-premium, authenticated ingredients to brands willing
    to pay for genuine provenance.
