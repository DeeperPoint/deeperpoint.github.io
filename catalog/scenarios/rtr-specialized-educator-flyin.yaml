market_example:
  summary: "Matches remote school boards with specialized educators (e.g., advanced STEM, special needs, arts) for short, intensive teaching modules rather than permanent hire. Commercial Note: Dependent on territorial or First Nations school board sponsorship."
  problem: "Northern and remote schools struggle constantly to recruit and retain permanent teachers, especially for specialized subjects like advanced high school calculus, coding, or intensive arts programs. Students miss out on critical curriculum because the board cannot justify or find a full-time hire. Meanwhile, many southern educators would love to teach a focused 2-week intensive module in the North but have no mechanism to arrange curriculum alignment, housing, and flights."
  dominant_forces:
    - "Massive educational outcome gaps between urban and remote schools."
    - "Burnout and high turnover of permanent northern teaching staff."
    - "Friction of credential matching across different provincial/territorial curricula."
  deeperpoint_fit: "CoSolvent aggregates the discrete modular curriculum needs of multiple remote schools and matches them with available blocks in a southern educator's schedule. KnowledgeSlot verifies cross-provincial teaching credentials and handles secure background/vulnerable-sector checks."
  economic_upside: "Reduces the millions spent on failed teacher retention programs. Platform economics center on managed-service deployment and credential verification fees paid by school districts."

