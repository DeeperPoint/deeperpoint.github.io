    revenue_model: "UNICEF standard cold chain equipment sourcing and procurement support (solar direct-drive refrigerators, passive cold boxes, vaccine carriers; 5–8% procurement coordination margin); cold chain equipment repair and spare parts sourcing for deployed equipment; refurbished equipment resale coordination"
