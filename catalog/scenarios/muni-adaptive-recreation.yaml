market_example:
  summary: "Municipal adapted recreation programs go undersubscribed while eligible residents remain at home because the program catalogue is flat and participants cannot determine whether any specific program truly accommodates their needs without making a call that may lead to disappointment."
  problem: "Municipal recreation departments run adapted and inclusive recreation programs for residents with physical, cognitive, and sensory disabilities, but matching individuals to appropriate programs is poorly done. A resident with a specific disability profile needs a program with the right accessibility infrastructure, staff training, adaptive equipment, and peer cohort — but the recreational programming catalogue is flat (a PDF or webpage) and self-navigation places an unreasonable burden on individuals or their caregivers. Programs go undersubscribed while potential participants remain at home."
  dominant_forces:
    - "Opacity — the actual accessibility features of programs (beyond generic 'accessible' labels) are not communicated in terms meaningful to individuals with specific disability profiles"
    - "Cognitive overload — families managing complex disability needs face an information environment fragmented across municipal departments, school boards, community organizations, and health providers"
    - "Participant scarcity — programs designed for rare disability combinations have thin populations on both sides"
    - "Trust deficit — individuals with disabilities have frequently encountered programs that claimed accessibility but could not deliver, creating justified reluctance to engage without detailed pre-confirmation"
    - "Information asymmetry — program coordinators know the real capabilities of their facilities and instructors; individuals know their specific access needs; this information never meets in a structured way before enrollment"
  deeperpoint_fit: "Semantic matching aligns participant accessibility profiles (disability type, mobility aids, communication needs, medical considerations, social preferences) with program capability profiles (staff training certifications, adaptive equipment available, physical accessibility features, peer cohort characteristics). Multi-channel input (phone, SMS, WhatsApp) allows caregivers and individuals without reliable internet access or fine motor control to interact through accessible channels. The Generative Match Story explains to a participant or caregiver why a specific program is a strong fit for their specific needs. KnowledgeSlot curates AODA inclusive design guidelines, CADS coaching certification requirements, and adaptive equipment specifications."
  economic_upside: "Undersubscribed adapted recreation programs represent both a financial inefficiency and a social failure. Better matching increases program filling rates, improves participant outcomes (social connection, physical health), and reduces the isolation that is a primary driver of health care utilization among people with disabilities."

