story:
  title: "The 3 AM Alarm"
  status: published
  blog_slug: ""
  characters:
    - "Priya — 47-year-old accountant in Brampton, nocturnal automated PD for fourteen months; her overnight cycler produces an alarm she has not encountered before; the on-call line puts her on hold for twenty-two minutes"
    - "Lena — experienced PD peer mentor in Victoria, 6 years on nocturnal APD; has seen the same alarm class three times; listed on the platform under technical troubleshooting"
    - "Dr. Ananya Singh — renal dietitian in Mississauga; listed on the platform with South Asian diet and vegetarian PD specialization"
  summary: "At 3:10 AM, Priya's cycler produces an alarm code she has never seen. The clinical on-call line puts her on hold. A platform peer match with an experienced APD patient resolves the alarm in four minutes and completes the cycle. The same morning, Priya books a dietary consultation with a renal dietitian who specializes in South Asian PD diet."
  body: |
    ## Act One: E47 at 3 AM

    The cycler had been running for three hours when the alarm woke her. Code E47. The machine voice said: "Treatment
    interrupted. Check drain line." Priya had checked the drain line. Nothing was kinked, nothing was blocked. She
    pressed resume. E47 again.

    Her dialysis binder was in the kitchen. The troubleshooting section for E47 said: "Contact your home dialysis nurse."
    At 3 AM.

    The on-call line answered in two minutes and put her on hold for twenty-two. She sat in her bedroom chair in the dark
    with the cycler alarming every forty seconds, running through everything she had been told about what happens if a
    cycle isn't completed.

    ---

    ## Act Two: Lena's Four Minutes

    She had created the platform account six weeks ago at the suggestion of her dialysis nurse, who had said the peer
    community was "quite active." She had not used it until now.

    She opened the app and searched: APD, E47, nocturnal. There was a peer thread and a mentor available — listed as
    online now at 3:08 AM. Lena, Victoria. Six years APD. "Comfortable with technical troubleshooting," her profile said.

    Lena answered the message in forty seconds. She had seen E47 three times. The drain line check was right but
    insufficient: the actual cause was pressure from the patient sleeping on the drain tubing segment near the mattress
    edge. She described the fix — repositioning the tube eighteen inches along the mattress edge — in two messages.

    Priya repositioned the tube. The cycle resumed. She was back in bed by 3:16 AM.

    ---

    ## Act Three: The Dietary Appointment

    The same morning, Priya looked at the dietitian listings. Her renal clinic dietitian saw her every three months and
    specialized in general renal diet; the appointment she had used for a South Asian home cooking question last year
    had produced a recommendation to avoid daal entirely.

    Daal entirely was not an option.

    Dr. Singh's listing described South Asian PD and vegetarian PD diet specialization. Her telehealth calendar had an
    opening the following Tuesday.

    In forty-five minutes, they redesigned Priya's weekly meal plan around low-potassium lentil preparation methods and
    phosphorus management in South Asian cooking — practical information her renal clinic had no capacity to provide.

    *Characters are fictional. Home dialysis epidemiology in Canada, the clinical outcomes data on home dialysis vs.
    in-centre hemodialysis, and the dietary complexity of peritoneal dialysis are real.
    [DeeperPoint](../../marketforge.html) is building the matching infrastructure this market requires.*
