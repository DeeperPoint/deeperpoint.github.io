market_example:
  summary: "6,000 Canadians manage kidney disease at home through peritoneal or hemodialysis — performing a complex medical procedure nightly, alone. The practical questions (equipment alarms, renal diet by cultural background, travel logistics) are best answered by experienced patients, not clinical teams. The market matches home dialysis patients to modality-specific peer mentors and to renal dietitians with relevant cultural diet expertise."
  problem: "A patient transitioning from in-centre hemodialysis to home peritoneal dialysis does not simply learn a procedure. They become the operator of a medical system in their own kitchen: managing cycler maintenance, peritoneal catheter site care, sterile technique, fluid exchange volumes, overnight alarm responses, and diet compliance — all outside the clinical environment where their care team can observe and intervene. The clinical team provides training and monthly assessment appointments. Between appointments, the patient is alone. The practical questions are relentless and highly specific: What do you do when the cycler alarm goes off at 3 AM and the manual says nothing useful? Which foods are actually tolerable on a renal diet that also fits a South Asian household cooking style? How do you manage a PD exchange while travelling internationally? How did you handle telling your employer that you need to go home at 5 PM every night for your overnight cycle? These questions are unanswerable by a clinical team from memory; they require recent, firsthand experience from someone doing the same procedure in a similar life context. The matching problem: a 45-year-old South Asian woman on nocturnal PD in Brampton and a 72-year-old retired farmer on HHD in rural Saskatchewan have different modalities, different life contexts, and different practical questions. Matching them to the right peer with matching experience requires infrastructure that does not exist."
  dominant_forces:
    - "Modality specificity — peritoneal dialysis and home hemodialysis are different enough that peer experience is largely non-transferable across modalities; within PD, nocturnal automated PD and manual CAPD have different schedules and different practical burdens"
    - "Dietary complexity — the renal diet (potassium, phosphorus, fluid, and protein restrictions that interact with each other) is one of the most complex therapeutic diets in medicine; renal dietitians are severely under-resourced and community dietary guidance is unreliable"
    - "Geographic isolation — home dialysis patients are distributed across every province, often in rural and semi-rural areas where the nearest home dialysis nurse is hours away and peer patients are unknown"
    - "Mental health burden — depression and caregiver burnout are common in home dialysis; peer support from someone who has navigated the same experience has documented positive outcomes but no delivery infrastructure"
    - "Technical surprise — equipment alarms, supply shortages, catheter complications, and travel logistics create urgent practical questions that clinical teams cannot answer in real time from a general phone line"
  deeperpoint_fit: "MarketForge lists experienced home dialysis patients willing to serve as peer mentors, filterable by modality (PD vs. HHD), dialect and cultural background (for diet translation), time on home dialysis, and life context (working, retired, caregiver). Renal dietitians with home dialysis specialization can list as professional members with their provincial licensing, telehealth availability, and cultural diet specialty. Home dialysis nurses and coordinators who offer private telehealth between clinical appointments can list as professional members. No clinical records are shared: patients voluntarily describe their modality, life context, and practical challenges in their profile."
  economic_upside: "Home dialysis is significantly less expensive to the health system than in-centre dialysis — roughly $35,000–$50,000 per patient per year less. Every patient dropout from home dialysis to in-centre care represents a significant avoidable cost. The primary causes of home dialysis dropout are mental health burden, dietary non-compliance, and social isolation — exactly the factors addressed by peer support infrastructure. A matching platform that reduces dropout rates by even 10% across 6,000 patients delivers tens of millions of dollars in annual system savings. The platform is fundable through Kidney Canada, provincial HSIO grants, and telehealth infrastructure programs."

