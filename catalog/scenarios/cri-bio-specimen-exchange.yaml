market_example:
  summary: "Matches academic researchers needing specific, ethically-sourced pathological samples, transgenic lines, or expensive reagents with labs that possess surplus inventory, bypassing slow commercial brokers."
  problem: "Life sciences research relies on highly specific biological inputs—like a cell line bearing a precise mutation. Often, Lab A throws out surplus aliquots of a reagent or euthanizes surplus transgenic mice while Lab B, just one region over, spends months waiting for commercial delivery or ethics approval to generate the exact same materials. The barrier is zero visibility into neighboring institutional deep-freezers."
  dominant_forces:
    - "Extreme cold-chain and material transfer agreement (MTA) legal requirements."
    - "Short shelf-lives of sensitive reagents and ethical drive to minimize animal waste."
    - "High cost and slow delivery times from primary commercial bioscience suppliers."
  deeperpoint_fit: "CoSolvent matches the specific genotype or chemical requirement against academic surplus inventory. CommonContext securely manages the execution of Material Transfer Agreements (MTAs) and Research Ethics Board (REB) alignment before any physical shipping occurs."
  economic_upside: "Massive reduction in wasted Canadian grant funding on redundant reagents and duplicated transgenic breeding. Platform monetizes through logistics and administrative efficiency."

