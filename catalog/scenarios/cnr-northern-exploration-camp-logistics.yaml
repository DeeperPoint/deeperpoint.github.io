story:
  title: The Shared Helicopter
  status: draft
  blog_slug: ""
  characters:
    - "Yasmin - Project Manager, junior base metal explorer, James Bay Lowlands, Quebec"
    - "Pierre - Operations Director, regional fly camp and helicopter charter provider, Chibougamau"
  summary: "A junior exploration company in the James Bay Lowlands reduces their helicopter
    charter costs by 22% and their camp setup timeline by three weeks by joining a district
    logistics coordination pool with two other programs, enabled by a shared logistics platform."
  body: |
    ## Act A - The Market Structure

    The logistics of a remote northern exploration program are less dramatic than the geology
    but more likely to determine whether the program gets completed on time and on budget.

    Every field day in the remote Canadian Shield requires fuel, food, a place to sleep, and
    a way to move people and equipment between camp and drill site. These things are supplied
    by a small regional service industry that knows its territory well but is structurally
    invisible to the first-time project manager who learned their trade in a city geology office.

    The hidden inefficiency is competition for shared infrastructure. In a district where three
    junior programs are operating in the same summer season, each of them has independently
    sourced a helicopter charter, each is running separate fuel resupply runs, and each is
    paying camp setup costs that a coordinated shared arrangement would cut by a third.
    Nobody coordinates because nobody knows who else is operating, and nobody trusts the
    other programs enough to coordinate without a neutral intermediary.

    ---

    ## Act B - The Story

    **Yasmin** is in the sixth week of logistics setup for a geophysical and reconnaissance
    drilling program on a nickel-cobalt target in the James Bay Lowlands. She has a helicopter
    charter committed at $5,800/hour, a camp operator she found through the Quebec mineral
    exploration association, and a fuel resupply schedule that requires two float plane rotations
    per week. Total fixed logistics costs: $380,000 for the eight-week program. Geology
    budget: $290,000. The ratio is wrong.

    **Pierre** runs a camp service and helicopter charter operation out of Chibougamau. He
    has a Bell 206 and an AS350 available for the same eight-week window. He is currently
    contracted to two other programs in the same lowlands district—a gold explorer 40 km
    north of Yasmin's camp and a chromite-vanadium program 60 km east. He has never spoken
    to either of the other program's project managers, but he knows the district has three
    concurrent programs because he's seen the helicopter traffic.

    The platform surfaces the three co-located programs to a district coordination proposal:
    shared fuel depot resupply (one float plane serving three camp locations on a coordinated
    schedule), coordinated helicopter repositioning (maximizing flight hours between client
    call-outs instead of returning to base between every rotation), and shared camp emergency
    protocol (mutual assistance agreements for medical evacuation). Yasmin agrees to the
    coordination arrangement. The shared logistics reduce her helicopter charter costs by 22%
    and her fuel resupply costs by 18%. She redirects the savings to three additional drill holes.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Northern exploration logistics are a shared district resource operating as competitive
    individual costs. Nobody coordinates because the coordination mechanism doesn't exist.
    DeeperPoint provides the trusted neutral platform that enables logistics pooling across
    competitive programs, delivering shared efficiency without compromising program independence.

    *Characters are fictional. Northern exploration logistics cost inefficiency and the
    absence of district coordination mechanisms are real and widely recognized in the industry.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
