market_example:
  summary: A coordinated logistics platform matching junior exploration companies with shared
    remote camp capacity, helicopter charter availability, and specialty fly-in logistics providers
    across northern Canada's exploration districts—replacing the fragmented, relationship-dependent
    coordination that costs exploration programs weeks of setup time and 20–30% in camp cost premiums.
  problem: "Running a diamond drilling or geophysical survey program in the remote Canadian Shield
    or sub-Arctic requires establishing and supplying a field camp: a remote site with accommodation,
    cook service, fuel storage, equipment staging, and helicopter access. In Canada's northern
    exploration districts—the Abitibi and James Bay Lowlands in Quebec and Ontario, the Northwest
    Territories, Nunavut, and northern BC—the infrastructure that supports these camps is provided
    by a small number of specialty service providers: fly camp operators who establish and supply
    seasonal field camps, helicopter companies with long-line supply and exploration-specific
    aircraft, fuel depot operators at staging points, and boat charter services for lake access
    in the Shield. This services market is thin and relationship-dependent. A junior exploration
    company running its first northern program has no directory of regional providers, no visibility
    into current availability, and no mechanism to assess whether a camp operator has experience
    in their specific district. Camp setup for a single-season program can consume six to eight weeks
    of the project manager's time in logistics coordination before a single metre of drilling has begun.
    The cost premium for poorly sourced logistics—expensive helicopter charters, camp setup delays,
    fuel resupply inefficiencies—routinely adds 15–25% to drilling program budgets. When two or
    three junior companies are operating in the same district in the same season, there is also
    significant uncoordinated demand for the same limited helicopter and camp supply capacity,
    driving up costs for all when shared logistics could reduce them."
  dominant_forces:
    - "Northern exploration logistics providers are small, regional, and invisible to junior
      companies without existing network connections in the specific district."
    - "Helicopter charter capacity in remote exploration districts is the critical scheduling
      constraint: a single helicopter company may serve five concurrent junior programs in
      the same district, with no mechanism for coordinating demand or sharing capacity."
    - "Camp setup and supply logistics consume a disproportionate share of junior company
      management time relative to their budget weight—logistics coordination is not a
      core competency for geologists managing first northern programs."
    - "Co-located programs in the same district represent a natural shared logistics
      opportunity that is almost never exploited due to competitive sensitivity about program
      locations and lack of a trusted coordination mechanism."
  deeperpoint_fit: "CoSolvent coordinates district-level logistics pooling: for programs operating
    within the same geological district and seasonal window, the platform facilitates shared
    helicopter charter, co-located camp capacity sharing (with program independence preserved),
    and coordinated fuel depot resupply scheduling. CommonContext encodes northern logistics
    best practices: camp regulatory requirements, food safety standards for fly-in camps,
    fuel storage regulations, and Transport Canada helicopter charter requirements for exploration."
  economic_upside: "A coordinated logistics exchange reducing camp and charter costs by 15%
    across 200 programs per season represents $10–30M in operational savings returned to
    exploration budgets—extending net drilling meters by 10–15% without additional investor capital.
    Platform revenue via logistics coordination fees and helicopter charter booking commissions."
