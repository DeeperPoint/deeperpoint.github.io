market_example:
  summary: "Boutique fitness studios, registered dietitians, mental health practitioners, and employee engagement specialists cannot efficiently assemble the comprehensive corporate wellness program packages that HR departments require—leaving enterprise wellness contracts to large benefit platforms while specialized boutique providers serve only the walk-in market."
  problem: "HR departments at medium and large employers increasingly issue RFPs for comprehensive employee wellness programs that span physical fitness, nutritional counselling, mental health support, financial wellness, and engagement programming. No single boutique wellness provider covers all of these areas. A boutique fitness studio with a stellar group fitness program is not also a registered dietitian practice or an EAP mental health provider. A nutrition counselling practice cannot also deliver mindfulness workshops and on-site fitness challenges. The enterprise wellness contract that would transform a boutique provider's revenue requires a consortium that the provider has no mechanism to assemble. HR departments default to large corporate wellness platforms—Maple, Dialogue, Inkblot—that aggregate services through acquisitions. The boutique providers who might deliver higher-quality, more personalized programming cannot package themselves into the single-contract format that HR procurement requires."
  dominant_forces:
    - "Offering complexity — a credible corporate wellness proposal requires alignment across physical fitness programming, registered nutrition counselling, mental health services under PHIPA-compliant delivery, financial wellness content, and engagement measurement reporting"
    - "Regulatory specificity — mental health service delivery requires specific credentials and privacy compliance (PHIPA, provincial regulated health profession requirements); not every wellness provider can be a consortium partner for this component"
    - "Accountability structure — HR departments want a single invoice, a single contact, and a single performance report; a visible partnership of independents is not the procurement outcome they seek"
    - "Participant scarcity — boutique providers with the right credentials, enterprise insurance coverage, and appetite for consortium participation are a small subset of the total wellness provider population"
    - "Opacity — compatible boutique wellness providers in the same geographic market cannot efficiently find each other to explore consortium formation before the RFP deadline"
  deeperpoint_fit: "Semantic matching encodes provider profiles (wellness service category, credential and regulatory standing, enterprise delivery experience, PHIPA compliance status, geographic coverage, insurance tier, consortium role preference) against lead firm opportunity signals (HR program scope, headcount, budget tier, service categories required, contract structure, reporting requirements). The consortium agreement template pre-structures invoice consolidation, data privacy protocols, and performance reporting in the employer-facing format HR procurement requires."
  economic_upside: "Enterprise corporate wellness contracts in Canada range from $50,000 to $500,000+ annually for mid-to-large employers. Boutique wellness providers averaged $150–$250 per client per month in the individual consumer market; enterprise contracts at comparable service levels generate equivalent per-participant revenue with multi-year contract stability. Consortium access to enterprise wellness contracts is a structural revenue upgrade for boutique providers currently constrained to the individual consumer acquisition cycle."

