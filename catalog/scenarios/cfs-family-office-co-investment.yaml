story:
  title: The Co-Investment Gap
  status: draft
  blog_slug: ""
  characters:
    - "William - CIO, single-family office, Winnipeg"
    - "Sandra - Managing Partner, Ontario PE firm specializing in industrial acquisitions"
  summary: "A Winnipeg family office seeking direct co-investment in Canadian manufacturing
    businesses is matched with an Ontario PE sponsor who has co-investment capacity in a
    specialty packaging acquisition—through a family office syndication platform."
  body: |
    ## Act A - The Market Structure

    Co-investment is the most efficient form of private equity exposure: you get the
    sponsor's deal origination, their due diligence, their management relationships, and
    their board presence—without paying the full carried interest and management fee of
    a blind-pool fund commitment. For family offices that prefer concentrated, understood
    exposures over diversified fund allocations, co-investment is the preferred private
    equity vehicle.

    The market dysfunction is entirely structural. PE sponsors offer co-investment to their
    existing LPs first. Unaffiliated family offices—regardless of how well their mandate
    aligns with the transaction—never receive the co-investment notice. The LP relationship
    is the gate. Building LP relationships requires committing to a fund, which requires
    a minimum commitment typically above $5–10M. A family office whose preferred ticket
    size is $1.5M cannot become an LP in a $500M fund to access the co-investment that
    would suit them. The co-investment market is gated by a fund commitment requirement
    that excludes exactly the investors who most need the co-investment structure.

    ---

    ## Act B - The Story

    **William** manages the investment portfolio for a Winnipeg family whose wealth originated
    in industrial manufacturing. His investment mandate includes direct co-investment in
    Canadian businesses in manufacturing, packaging, and industrial distribution—sectors
    he knows well from the operating background. His preferred ticket size is $1–3M per deal.
    He has made four co-investments in eight years, all referred through his banker and
    one trusted PE contact in Toronto. He knows the deal flow he is seeing is a small
    fraction of what exists.

    **Sandra** completed due diligence on a specialty packaging acquisition in southwestern
    Ontario last month. The transaction is $28M enterprise value—right in her fund's sweet
    spot. She has $6M in co-investment capacity that her existing LPs have fully funded,
    but she would welcome a $1.5M additional co-investor from outside her LP base to
    complete the co-investment tranche and begin a family office relationship for future deals.
    She mentioned this to her placement agent. The placement agent's family office coverage
    list is concentrated in Toronto and Vancouver. Winnipeg is not in his network.

    William registers his co-investment mandate: manufacturing and industrial distribution,
    Ontario or Manitoba, $1–3M ticket, minimum 3-year hold tolerance, accredited investor
    documentation on file. Sandra posts her co-investment availability: specialty packaging,
    Ontario, $1.5M ticket available, 5-year fund hold, sponsor track record on file. The
    platform generates the match and presents Sandra's deal profile with co-investment terms.
    William reviews the deal summary and requests the full data room. He commits within
    three weeks of first contact. The co-investment closes alongside Sandra's fund acquisition.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The family office co-investment market is gated by LP relationships that most family
    offices cannot build at the ticket sizes that suit them. DeeperPoint builds the
    structured discovery mechanism that matches family office mandate profiles with sponsor
    co-investment availability without requiring an existing fund LP relationship as the
    price of access.

    *Characters are fictional. The Canadian family office co-investment discovery gap is
    recognized by the Canadian Venture Capital and Private Equity Association.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
