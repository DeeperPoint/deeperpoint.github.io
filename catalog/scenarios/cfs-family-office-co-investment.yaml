market_example:
  summary: A structured co-investment syndication platform connecting Canadian family offices—
    whose principals want direct deal exposure alongside institutional-quality due diligence—
    with private equity sponsors, growth equity firms, and sophisticated angel syndicates
    that have co-investment capacity in specific transactions and are actively seeking
    family office LP participation.
  problem: "Canada has a significant and growing family office community—estimates suggest
    400–700 single-family offices managing assets above $30M, with combined assets under
    management exceeding $300B. These family offices have investment mandates that frequently
    include direct private equity co-investment: they want to invest $500K–$5M alongside
    a lead PE sponsor in specific transactions, gaining concentrated exposure to individual
    companies while benefiting from the sponsor's deal origination and due diligence.
    The structural problem is discovery. PE sponsors that regularly offer co-investment
    capacity to their LP base do not have efficient mechanisms to reach unaffiliated family
    offices that are not already in their LP network. Family offices that are not LP
    in the sponsor's fund do not receive co-investment notices—the economic logic of
    co-investment requires existing LP relationships. The result is that co-investment
    capacity that a sponsor would willingly allocate to a qualified family office—to
    build relationships, diversify their LP base, or fill co-investment capacity beyond
    their existing LPs—sits unused or is allocated to the same repeat LPs while dozens
    of Canadian family offices with mandate alignment never knew the transaction was available.
    A family office in Winnipeg with a manufacturing sector mandate and a $2M co-investment
    ticket has no mechanism to discover that a Toronto-based PE firm is co-investing a
    specialty packaging acquisition at exactly that ticket size in their preferred sector."
  dominant_forces:
    - "PE sponsor co-investment capacity is allocated to existing LP relationships first—
      family offices without an existing fund LP relationship are structurally excluded from
      co-investment deal flow regardless of mandate alignment or investment sophistication."
    - "Family office co-investment mandates are highly specific to sector, geography, deal
      stage, and ticket size in ways that the informal co-investment introduction market
      (placement agents, bank private capital desks) does not efficiently capture."
    - "Regulatory requirements for exempt market distribution mean co-investment offerings
      must reach only qualified accredited investors—making open marketing impossible and
      creating a natural role for a structured, credential-verified matching platform."
  deeperpoint_fit: "CommonContext encodes the co-investment deal structure framework: LP
    co-investment agreement terms, carried interest treatment in co-invest vehicles, regulatory
    requirements for exempt market distribution in each province, and qualification documentation
    for accredited investor status. CoSolvent matches family office co-investment profiles—
    sector preferences, deal size range, hold period tolerance, geographic preference, and
    accredited investor qualification—against sponsor co-investment availability notices
    with deal-specific term parameters."
  economic_upside: "Canadian family offices deploy an estimated $3–8B in direct co-investment
    annually, a significant portion of which is concentrated in a small number of sponsor
    relationships. Platform revenue via annual subscription for family offices and per-transaction
    introduction fees charged to sponsors. The SEC and OSC exempt market distribution frameworks
    make a qualified-investor-only platform both legally compliant and defensible."
