market_example:
  summary: "Matches employers willing to hire individuals with criminal records with pre-screened candidates whose trade credentials, work history, and parole conditions align with specific job requirements — solving the mutual invisibility that keeps inclusive employers unfilled and qualified candidates unemployed."
  problem: "Approximately 4 million Canadians have a criminal record. Many have trade certifications or skilled work experience that lapsed during incarceration. Employers willing to hire them exist but are invisible to candidates, and candidates are invisible to employers. Standard job boards penalize criminal records in screening algorithms. Staffing agencies avoid the liability. The result is a two-sided discovery failure: employers with labour shortages cannot find pre-screened candidates, and candidates with genuine skills cannot find employers who will consider them. Unemployment within the first year of release is the single strongest predictor of recidivism."
  dominant_forces:
    - "Mutual invisibility — ban-the-box employers cannot signal their willingness through standard hiring channels, and candidates cannot identify them without insider knowledge"
    - "Credential decay — trade licences and safety tickets lapse during incarceration; reinstatement processes are opaque, vary by province, and cost money the candidate does not have"
    - "Liability perception — employers fear negligent-hiring lawsuits; without structured due diligence documentation, legal risk suppresses willingness even among sympathetic employers"
  deeperpoint_fit: "CoSolvent operates the two-sided marketplace: candidates register their trade credentials, work history, and parole conditions; employers register positions with explicit ban-the-box status and conviction-category restrictions. CommonContext curates the credential reinstatement pathway for every provincial licensing body. The Generative Match Story produces a structured candidate summary documenting employer due diligence without exposing raw criminal record data."
  economic_upside: "Each avoided reincarceration saves approximately $130,000 per year. Employment within 90 days of release reduces recidivism by 30–50%. A platform facilitating 500 placements annually generates $1.5–$2.5M in placement and subscription revenue while producing $30–$65M in avoided incarceration costs."

