market_example:
  summary: "Canadian municipalities developing climate adaptation plans and infrastructure — urban heat island mitigation, green stormwater infrastructure, urban tree canopy planning, coastal flood protection — cannot efficiently find practitioners with the combined ecological design and municipal engineering credentials their specific project type requires."
  problem: "Federal and provincial climate adaptation funding programs have created significant municipal demand for climate resilience infrastructure. The projects funded — green stormwater infrastructure, urban forest canopy expansion, passive cooling design for vulnerable populations, coastal setback and nature-based flood protection — require practitioners who combine ecological design knowledge with municipal engineering context. A stormwater engineer who has not worked with bioretention cell design does not have the right profile. A landscape architect without urban hydrology credentials cannot lead a green infrastructure drainage project. A coastal ecologist without municipal permitting experience cannot navigate the approvals process for a shoreline restoration project. The interdisciplinary practitioner who combines these credentials is a small population that is systematically invisible in both engineering and landscape architecture directories — because their credential combination does not map cleanly to standard professional category classifications."
  dominant_forces:
    - "Participant scarcity — interdisciplinary practitioners combining ecological design and municipal infrastructure engineering credentials are genuinely rare"
    - "Offering complexity — project-practitioner fit requires matching on climate hazard type (heat, flood, drought, wind), infrastructure category (green stormwater, urban forest, coastal), municipal approval pathway experience, and federal/provincial funding program familiarity"
    - "Opacity — interdisciplinary credential combinations are not legible from single-profession directories; practitioners registered as engineers, landscape architects, or ecologists do not cross-appear in each other's directories"
    - "Funding timeline pressure — federal climate adaptation funding programs have fixed application and delivery windows; municipalities that cannot assemble the right technical team lose funding or deliver inadequate projects"
    - "Political accountability — climate resilience infrastructure is highly visible; projects that fail to perform as designed — bioretention cells that flood, urban tree canopy that does not survive, coastal restoration that erodes — produce political costs that exceed the project budget"
  deeperpoint_fit: "Semantic matching encodes practitioner profiles (climate hazard specialization, infrastructure type expertise, municipal approval process experience, specific funding program familiarity, ecological credential and engineering credential combinations) against municipal demand signals (climate hazard type, infrastructure category, project scale, funding program constraints, required credential combination, municipal approval pathway). KnowledgeSlot curates the federal Climate Resilience and Green Infrastructure Fund program guidelines, provincial green infrastructure standards, and technical design references for bioretention, urban tree canopy, and coastal nature-based solutions."
  economic_upside: "The federal government has committed $1.625 billion to climate resilience infrastructure through DMAF and successor programs. A significant proportion of funded projects underperform against stated climate adaptation objectives because the technical design was developed by practitioners without the specific interdisciplinary competency required. Better specialist matching increases the proportion of climate investment that delivers measurable adaptation outcomes."

