market_example:
  summary: "Well-equipped hospitals in sub-Saharan Africa with CT scanners, dialysis machines, and digital imaging systems cannot efficiently reach the specialized biomedical engineers who can help resolve complex equipment faults — while qualified engineers in developed countries who want to contribute their expertise remotely cannot find the right facilities to work with."
  problem: "Hospitals across sub-Saharan Africa have acquired sophisticated medical equipment through procurement programs, donated equipment initiatives, and domestic capital investment. The challenge is not acquisition — it is complex fault resolution. A biomedical technician at a referral hospital in Tanzania may have the basic training and the test equipment to maintain most systems, but a specific fault on a Siemens MAGNETOM 1.5T MRI gradient amplifier board, or a calibration drift on a GE Vivid E9 echocardiograph, requires subspecialty knowledge that may not exist domestically for that specific machine generation. The biomedical technician knows what the fault is. They know what it is probably not. What they lack is the specific firmware and hardware depth for that one model. Meanwhile, retired and active biomedical engineers at NHS trusts, Canadian health authorities, and US academic medical centres — people with exactly this model-specific knowledge built over careers — want to contribute but have no reliable discovery mechanism to connect with the facility whose technician needs a two-hour collaboration on a specific problem."
  dominant_forces:
    - "Participant scarcity — subspecialty biomedical engineering knowledge for specific equipment models and generations is concentrated in the service histories of technicians and engineers at the health systems that have operated those specific machines"
    - "Opacity — hospitals with complex equipment faults cannot efficiently signal their specific technical need in a form that reaches the right developer-country expert; general volunteer platforms do not index by equipment model and fault type"
    - "Offering complexity — match quality depends on alignment between the specific equipment model and firmware version, the nature of the fault, the local technician's existing capability envelope, and the prospective expert's model-specific experience"
    - "Trust and accountability — health institutions need structured engagement frameworks, not informal social media consultations; the match must create a relationship with appropriate documentation and accountability"
    - "Language and knowledge transfer — effective remote collaboration requires shared technical vocabulary and the ability to transfer procedural knowledge across a video or documentation exchange; a well-structured engagement protocol is not trivial"
  deeperpoint_fit: "Semantic matching encodes facility profiles (equipment inventory by manufacturer and model, local biomedical technician capability level, connectivity for remote collaboration, types of faults currently active) against volunteer expert profiles (equipment model experience by manufacturer and generation, subspecialty certification, remote collaboration availability, language capacity). The engagement framework structures the collaboration protocol — documentation, diagnostic sharing, session recording — in a way that creates institutional accountability on both sides and builds a knowledge record that benefits the facility beyond the specific engagement."
  economic_upside: "An MRI scanner offline for three months at a referral hospital eliminates diagnostic capacity for a region of hundreds of thousands of people. Equipment vendor service contracts for sub-Saharan facilities are priced at rates that most public health systems cannot sustain. A structured remote expert network reduces equipment downtime, extends machine service life, and builds domestic biomedical engineering capacity through documented knowledge transfer."

