story:
  title: The FEED Mismatch
  status: draft
  blog_slug: ""
  characters:
    - "Omar - VP Carbon Strategy, major oil sands upgrader, Fort McMurray"
    - "Dr. Renata - VP Process Engineering, specialty gas capture engineering firm, Calgary"
  summary: "An oil sands upgrader preparing a $6M CCUS FEED study identifies the only
    Canadian engineering firm with genuine amine solvent post-combustion capture FEED
    experience through a process-design credential matching platform—avoiding being served
    by a policy-capable but design-inexperienced team."
  body: |
    ## Act A - The Market Structure

    Carbon capture is simultaneously one of the most critical and most technically demanding
    engineering disciplines in industrial decarbonization. The chemistry of amine-based
    post-combustion capture—solvent selectivity, regeneration heat duty, degradation products,
    heat integration with the host facility—took the global engineering profession decades
    to understand at the project scale. The engineers who understand it are a small, identifiable
    community whose experience lives in a handful of engineering firms and project teams.

    Canada's CCUS tax credit has created strong demand for CCUS FEED studies that greatly
    exceeds the supply of qualified process engineers to execute them. The engineering
    procurement process—standard RFP scoring on technical approach, team credentials, and
    price—cannot distinguish a team that has designed a 500-tonne-per-day absorber column
    from a team that has written white papers about doing so. The distinction costs $50M
    when it is discovered mid-FEED.

    ---

    ## Act B - The Story

    **Omar** has board approval for a $6M CCUS FEED study targeting 2.2 million tonnes
    per year of CO2 capture from his facility's coker and fluid catalytic cracker flue gas
    streams. He issued an engineering services RFP to eight firms. Six responded. His evaluation
    committee read the technical approaches. Three appeared technically credible. When his
    internal process engineer reviewed the lead engineer CVs on each proposal, she identified
    that only one firm had a named lead with a completed amine solvent FEED study in their
    portfolio—the other two named leads had CCUS policy and techno-economic analysis backgrounds.
    The one qualified firm submitted the highest price and the least polished proposal.

    **Dr. Renata** leads a 40-person Calgary process engineering firm that has completed
    two amine post-combustion capture FEED studies—one for a gas processing plant in BC,
    one as an engineering subcontractor on a Gulf Coast refinery CCUS project. Her firm
    does not have a strong BD&M function; they are engineers, not marketers. They saw Omar's
    RFP but submitted a technically dense, not commercially polished, proposal. They came
    third in the initial scoring.

    Omar's team queries the platform after a trusted peer's recommendation: CCUS specialist
    registry, amine post-combustion capture FEED, oil sands flue gas characteristics, 2+ Mtpa
    capture capacity. Renata's firm surfaces with two verified amine FEED portfolio projects,
    named engineer credentials, and specific oil sands flue gas chemistry experience. Omar's
    evaluation committee rescores the proposals with verified project portfolio evidence weighting.
    Renata's firm is awarded the FEED study. The study proceeds on schedule and within budget.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    CCUS engineering procurement cannot be solved by better RFP scoring when the critical
    differentiator—genuine process design experience—is invisible to generic credential review.
    DeeperPoint builds the verified project portfolio registry that puts process design depth
    at the centre of engineering firm selection where it belongs.

    *Characters are fictional. Canada's CCUS engineering capacity bottleneck is documented
    by Natural Resources Canada and the Pembina Institute.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
