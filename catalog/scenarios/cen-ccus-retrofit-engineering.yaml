market_example:
  summary: A specialist matching platform connecting Canadian industrial emitters pursuing
    Carbon Capture Utilization and Storage (CCUS) projects with the thin pool of process
    engineers and engineering firms who have genuine post-combustion capture or oxy-fuel
    project experience—expertise that is structurally scarce and almost exclusively
    distributed through confidential corporate networks.
  problem: "Canada's federal and provincial CCUS policy frameworks—the Clean Fuel Regulations,
    the federal Investment Tax Credit for CCUS (50% credit on capture equipment), and Alberta's
    Carbon Competitiveness Incentive Regulation—have created a wave of CCUS feasibility and
    FEED studies across the oil sands, refining, petrochemical, cement, and steel sectors.
    A 2023 survey by the Pembina Institute identified over 20 active large-scale CCUS project
    studies in Canada involving combined capture capacity of 30+ million tonnes per year. The
    bottleneck is human capital. Post-combustion carbon capture engineering—the design and
    integration of amine solvent absorption systems, direct air capture processes, and
    compression-transport interfaces with geological storage formations—is a discipline with
    perhaps 200–400 genuinely expert practitioners globally. Most of them work inside the
    same six to eight engineering firms (Shell's Quest project team, Fluor's Econamine FG+
    group, CB&I's long history in gas treating). Canadian chemical and process engineering
    firms with bona fide CCUS project experience—not just CCUS policy analysis experience,
    but actual process design and commissioning experience—number in the single digits.
    An oil sands operator preparing a CCUS FEED study cannot simply issue an RFP and
    expect five qualified responses; they will receive one or two from firms with genuine
    CCUS process design depth and a dozen from firms that are building the capability for
    the first time using the FEED study as on-the-job training. The inability to distinguish
    these is costing industry $50–100M per misdirected FEED study."
  dominant_forces:
    - "Canada's CCUS Investment Tax Credit and Clean Fuel Regulations have created a mandated
      demand wave for CCUS engineering services that far exceeds the current supply of engineers
      with genuine post-combustion capture or geological storage integration experience."
    - "CCUS process design errors discovered during FEED or detailed engineering—in solvent
      system sizing, regenerator heat duty, compression train design—compound quadratically
      into capital cost overruns; retaining an underqualified engineering team for a
      large-scale FEED study is a $50–200M risk."
    - "The global CCUS engineer pool is concentrated in a small number of engineering disciplines
      and project teams whose experience is almost entirely undocumented in conventional professional
      profiles—resume screening cannot distinguish process-design depth from policy familiarity."
  deeperpoint_fit: "CommonContext encodes the CCUS process design credential framework: the
    specific disciplines required for each project phase (solvent chemistry, column design,
    heat integration, geological storage geomechanics, compression engineering) and the
    project-portfolio evidence that distinguishes genuine design experience from analysis
    familiarity. CoSolvent matches industrial operator CCUS study specification packages—
    emission source characteristics, capture rate target, solvent technology preference,
    transport and storage pathway—against engineering firm profiles built from verified project
    portfolios and named engineer credentials."
  economic_upside: "Canada's CCUS Investment Tax Credit is expected to mobilize $15–30B in
    CCUS capital investment by 2040. Each large-scale CCUS project involves $2–15M in engineering
    study fees across FEED and detailed design. Matching the right engineering capability to
    each project—reducing FEED cost overruns and timeline failures—represents hundreds of
    millions in avoided misallocation annually across the sector's program portfolio."
