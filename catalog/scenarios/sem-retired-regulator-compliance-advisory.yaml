      consulting firm."
    recurring: true

story:
  title: "What the Inspector Is Actually Looking For"
  status: draft
  blog_slug: ""
  characters:
    - "Marco - owner, medium-size pasta and sauce manufacturer, 80 employees, Brampton"
    - "Sylvia - retired CFIA food safety officer, 24 years, meat and processed food programs, Guelph"
  summary: "A Brampton pasta manufacturer who receives a CFIA Safe Food for Canadians
    compliance order with twenty-two corrective action items and a 45-day deadline submits
    a corrective action response that a retired CFIA officer prepared in two days — a response
    that closes fourteen items immediately and establishes a verified timeline for the
    remaining eight, compared to the previous corrective action response that the company's
    food safety consultant wrote and the CFIA rejected as inadequate."
  body: |
    ## Act A - The Market Structure

    The Safe Food for Canadians Regulations set the legal standard for food safety in
    Canadian processing facilities. The CFIA inspection process determines whether a
    facility meets that standard in practice. What the regulations require and what a
    specific CFIA inspector will accept as evidence of compliance are related but not
    identical: the regulations specify outcomes; the inspector assesses the process evidence
    that demonstrates the outcomes are achieved. The format, specificity, and verification
    methodology of a corrective action response determine whether it closes the compliance
    file or triggers a follow-up inspection.

    Food safety consultants know the regulations. They have read the Safe Food for Canadians
    Act, the SFCR, and the guidance documents. They can write corrective action plans that
    address each non-conformance identified in an inspection report. What they may not know
    is the specific documentation format that a CFIA inspector closing a compliance file
    expects to see — the level of process detail in the corrective action narrative, the
    evidence type (photo documentation versus log records versus third-party verification)
    that the inspector will accept for each category of non-conformance, and the verification
    commitment language that signals the facility has understood the root cause versus
    just fixed the observed symptom. These distinctions are learned by writing corrective
    action responses and watching which ones get closed and which ones trigger follow-up.
    That learning belongs to the regulator, not the regulated.

    ---

    ## Act B - The Story

    **Marco** has operated a pasta and sauce manufacturing facility in Brampton for sixteen
    years. His facility produces private-label and branded pasta products for Canadian
    grocery retailers and produces under a preventive controls licence under the Safe Food
    for Canadians Regulations. In February, a routine CFIA inspection resulted in a
    compliance order with twenty-two items across preventive controls documentation,
    sanitation verification, and allergen control procedures. The compliance order required
    a corrective action response within 45 days and a satisfactory follow-up inspection
    within 90 days. His food safety consultant — who had helped him achieve SFCR licensing
    three years earlier — prepared a corrective action response within 30 days. The CFIA
    inspector rejected four of the corrective actions as inadequate and requested clarification
    on six others. The follow-up inspection window was approaching with half the items unresolved.

    **Sylvia** spent twenty-four years as a CFIA food safety officer, the final eight years
    as a senior inspector in the SFCR processed food program covering the Brampton-Mississauga
    corridor. She reviewed several thousand corrective action responses during her career and
    trained new inspectors on corrective action adequacy assessment. She retired eighteen
    months ago and was available for fractional advisory work. She had never received an
    inquiry from the food processing industry because no mechanism existed for a Brampton
    pasta manufacturer to find a retired CFIA inspector with processed food program experience
    in Peel Region.

    Sylvia reviewed Marco's rejected corrective action response in one evening. The pattern
    was immediately familiar: the response addressed the observed non-conformances but not
    the underlying preventive control system gaps the inspector had identified as root causes;
    the verification commitments specified monitoring records without defining the record
    review frequency that the SFCR preventive control documentation standard required;
    and the sanitation verification corrective action used third-party audit language for
    items that the specific inspector expected to see resolved through internal documented
    verification. Sylvia rewrote the fourteen rejected and clarification items over two days.
    The resubmitted corrective action response closed all fourteen items on first review.
    The follow-up inspection resolved the remaining eight items within the 90-day window.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Sylvia's knowledge of SFCR corrective action adequacy standards was not proprietary
    regulatory information. It was the accumulated pattern recognition of twenty-four years
    of reviewing responses and teaching inspectors what adequacy looked like. That knowledge
    is available inside CFIA and invisible outside it. The food safety consultant who wrote
    Marco's initial corrective action response was technically competent and legally correct.
    They did not know what the inspector expected to see because they had never been the
    inspector.

    Every food processing facility in Canada that receives a CFIA compliance order has the
    same access problem: the knowledge that would produce an adequate corrective action
    response on the first submission lives inside the regulatory agency, and no mechanism
    exists to connect regulated facilities to the retired staff who carry that institutional
    knowledge into their post-career years.

    *Characters are fictional. CFIA Safe Food for Canadians Regulations compliance order
    procedures and corrective action adequacy assessment processes are factual.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
