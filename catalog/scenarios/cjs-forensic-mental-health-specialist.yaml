story:
  title: "The Assessment That Took Four Months"
  status: draft
  blog_slug: ""
  characters:
    - "Daniel - accused person held in remand, Thunder Bay"
    - "Court Clerk Arsenault - criminal court administrator, Thunder Bay"
  summary: "A court clerk in Thunder Bay finds a forensic psychiatrist in
    48 hours through the platform after four months of failed phone calls,
    freeing a mentally ill accused from deteriorating remand conditions."
  body: |
    ## Act A - The Market Structure

    The forensic mental health assessment system operates on a model designed
    for a time when courts were few and specialists were attached to local
    institutions. That infrastructure no longer exists. Provincial psychiatric
    hospitals have closed or consolidated. Forensic psychiatry fellowships
    produce fewer than 15 new specialists per year nationally. The result is a
    system where a two-hour clinical task creates a four-month bottleneck
    because the logistics of connecting a willing specialist to a waiting
    courtroom have no supporting infrastructure.

    The cost is not abstract. An accused person sitting in remand without
    treatment is not on pause — they are actively deteriorating. The assessment
    delay does not merely inconvenience the court; it harms the person the
    assessment is meant to help.

    ---

    ## Act B - The Story

    **Daniel** was arrested after a psychotic episode in a Thunder Bay grocery
    store. The Crown and defence agree he needs a fitness assessment before
    the case can proceed. The judge orders it. That was four months ago.

    **Court Clerk Arsenault** has called every forensic psychiatrist she knows
    of in Northern Ontario — all three of them. Two are booked for six months.
    One retired last year. She has left messages with the Centre for Addiction
    and Mental Health in Toronto, but their forensic unit prioritizes GTA
    cases. Daniel sits in the Thunder Bay District Jail, unmedicated, in a
    cell designed for short stays.

    Arsenault logs into the provincial assessment matching platform. She inputs
    the court order parameters: adult male, fitness assessment, Indigenous
    cultural competency preferred, secure video acceptable. The platform
    returns three matches within the hour. Dr. Patel, a forensic psychiatrist
    in Ottawa with telepsychiatry certification, has availability next Tuesday.
    The platform verifies her Ontario credentials, confirms the jail's secure
    video facility meets clinical standards, and generates the encrypted
    referral package.

    Tuesday morning, Dr. Patel conducts the assessment via secure video.
    Her sealed report is transmitted to the court by Thursday. The case
    proceeds. Daniel receives a treatment order. Total elapsed time from
    platform query to completed assessment: six days.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Forensic mental health is the textbook thin market: extreme supply
    scarcity, geographic mismatch, high-stakes urgency, and zero discovery
    infrastructure. No individual court clerk can solve this — the problem
    is structural. Without a platform that aggregates specialist availability
    across jurisdictions and enables secure remote delivery, every court
    outside Toronto, Montreal, and Vancouver is left making phone calls into
    a void while accused persons deteriorate in custody.

    [Thin market infrastructure](../../thin-markets.html) does not create
    more forensic psychiatrists. It makes the ones who exist findable,
    schedulable, and deployable to the jurisdictions that need them most.

    *Characters are fictional. The forensic mental health specialist shortage
    and remand assessment delays are real and well-documented across Canadian
    jurisdictions. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
