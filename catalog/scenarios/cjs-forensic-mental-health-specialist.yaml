market_example:
  summary: "Matches courts requiring fitness-to-stand-trial or NCR assessments
    with qualified forensic psychiatrists and psychologists, reducing months-long
    remand waits caused by an extreme specialist shortage concentrated in a
    handful of urban centres."
  problem: "When a Canadian court orders a fitness-to-stand-trial or Not
    Criminally Responsible (NCR) assessment, it requires a forensic psychiatrist
    or forensic psychologist — a subspecialty with fewer than 200 practitioners
    nationally. Most are concentrated in Toronto, Montreal, and Vancouver.
    Courts in mid-sized cities and rural jurisdictions face wait times of three
    to six months for an assessment that takes a few hours to conduct. During
    that wait, the accused sits in remand custody at approximately $350 per day,
    often without treatment, in conditions that actively worsen their mental
    health. The assessment bottleneck is not a capacity problem — it is a
    matching and logistics problem. Qualified specialists exist but cannot be
    discovered, scheduled, or deployed to the jurisdictions that need them."
  dominant_forces:
    - "Extreme concentration — fewer than 200 forensic mental health specialists
      nationally, clustered in three cities, while courts in 300+ jurisdictions
      need their services"
    - "Scheduling opacity — no centralized visibility into specialist
      availability; court administrators rely on personal contact lists and
      sequential phone calls"
    - "Remand cost escalation — every month of delayed assessment costs the
      province $10,000+ per accused in custody costs alone, plus deteriorating
      mental health outcomes"
  deeperpoint_fit: "CoSolvent aggregates the availability, geographic
    willingness-to-travel, and subspecialty credentials (adult vs. youth,
    language capability, Indigenous cultural competency) of forensic mental
    health specialists across the country. KnowledgeSlot curates the
    jurisdiction-specific procedural requirements for court-ordered
    assessments — report format, chain-of-custody protocols, and provincial
    certification standards. The platform enables a court clerk to input the
    assessment order parameters and receive a ranked match of available
    specialists within hours, not months."
  economic_upside: "Canada processes approximately 4,000 fitness and NCR
    assessments annually. Reducing the average remand wait by even 30 days
    across 20% of cases saves provincial corrections systems $8–12 million
    per year. Platform monetized via enterprise SaaS to provincial Ministries
    of the Attorney General and health authorities."

