market_example:
  summary: "Organizations facing a sudden C-suite vacancy, a turnaround, a regulatory intervention, or a complex integration event need interim executives who have managed exactly that transition type in the same sector — not a generalist executive who needs months of onboarding before they can add value in a crisis."
  problem: "Interim executive placement — a CFO, COO, CTO, or CEO brought in for a defined engagement to manage a specific organizational transition — requires matching that is fundamentally different from permanent executive search. The permanent hire has months to learn the organization and build relationships. The interim executive must be operational in two to four weeks, make high-stakes decisions without a relationship foundation, and achieve a defined transition outcome within twelve to eighteen months. This requires prior experience in the specific transition type: a financial institution regulator intervention, a manufacturing turnaround, a post-merger integration of two competing brands, a CEO succession with a family ownership structure. Most executive search firms maintain general interim rosters without the depth to distinguish transition-type subspecialty. The board or CEO reaching for an interim in a crisis defaults to their personal network — and the personal network of a CEO who has not been through a turnaround does not contain a turnaround specialist."
  dominant_forces:
    - "Participant scarcity — experienced interim executives who have successfully managed the specific transition type in the relevant sector are a small population in any Canadian market"
    - "Trust threshold — the interim executive relationship requires immediate strategic access to the board and senior leadership; the trust required cannot be built purely through credential verification, requiring reputation signals beyond a CV"
    - "Transition-type specificity — the interim CFO skill set for a regulatory capital adequacy remediation at a credit union is not the same as the skill set for a manufacturing cash flow crisis; the wrong type is worse than no interim"
    - "Speed of engagement — the crisis that triggers an interim executive need rarely allows for a four-to-six-month search; the board needs a candidate within ten days and deployed within three weeks"
    - "Exit structuring — the interim engagement must be structured to enable a clean handoff to a permanent successor; an interim who does not plan their own exit from week one creates organizational dependence that extends the engagement and increases cost"
  deeperpoint_fit: "Semantic matching encodes interim executive profiles (transition type specialization — turnaround, regulatory intervention, post-merger integration, founder succession, rapid growth stabilization — sector experience by industry and company size, prior interim engagements by type and outcome, board comfort level and references, speed-to-deploy timeline, honorarium range) against organization demand signals (transition type, sector, company size, urgency, engagement duration, board structure). Trusted referral verification adds the reputation signal that credential verification alone cannot provide."
  economic_upside: "Interim executive fees in Canada range from $8,000–$25,000 per month plus success fees for turnaround outcomes. A day-one-effective turnaround CFO deployed in a manufacturing company facing covenant breach generates value by preventing a $2M–$10M credit facility termination. A regulatory intervention at a financial institution without qualified interim leadership can result in regulatory receivership — a multi-million dollar outcome relative to the $150,000–$250,000 cost of a twelve-month interim engagement. The Canadian interim executive market is estimated at $400M–$700M annually and is predominantly driven by Board Chair and CEO personal networks that systematically exclude the right specialist when the network owner has not personally experienced the relevant crisis type."

