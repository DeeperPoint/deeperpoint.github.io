market_example:
  summary: "Property owners, developers, and municipalities discovering contamination on sites slated for redevelopment — petroleum hydrocarbons, chlorinated solvents, heavy metals, PFAS, asbestos — cannot find the niche remediation specialists whose specific contaminant expertise, treatment technology experience, and provincial regulatory knowledge match their site's conditions."
  problem: "Canada has an estimated 30,000+ contaminated sites requiring remediation, ranging from former gas stations to industrial complexes. When a developer purchases a site and discovers contamination during due diligence, they need a remediation specialist — but not just any environmental consultant. A site contaminated with trichloroethylene (TCE) in fractured bedrock requires a hydrogeologist specializing in DNAPL migration in fractured rock, using in-situ chemical oxidation or enhanced bioremediation — technologies that fewer than 20 firms in Canada have deployed successfully. A site with PFAS contamination requires an emerging-contaminant specialist with experience in granular activated carbon treatment and the evolving PFAS regulatory framework. The developer calls a large environmental consulting firm, which assigns a generalist project manager who subcontracts the specialty work — adding cost, communication layers, and risk. The specialist who could handle the project directly, efficiently, and with better outcomes is a five-person firm in another province that the developer has never heard of."
  dominant_forces:
    - "Contaminant-specific expertise scarcity — for emerging contaminants (PFAS, 1,4-dioxane) and complex hydrogeological settings, the pool of qualified specialists may be fewer than 10 firms nationally"
    - "Technology matching complexity — remediation technologies (in-situ chemical oxidation, bioremediation, thermal desorption, pump-and-treat, excavation) are contaminant-specific and site-condition-specific; generic consultants default to the most conservative (and expensive) approach"
    - "Provincial regulatory variation — remediation standards, risk assessment frameworks, and closure criteria vary by province; a specialist experienced in Ontario standards may not know Alberta's Tier 2 guidelines"
    - "Generalist intermediation — large consulting firms capture projects and subcontract specialty work, adding 25–40% cost overhead without adding expertise"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (contaminant expertise by specific compound, treatment technologies deployed with project references, provincial regulatory experience, hydrogeological specialty, firm size and availability, project portfolio with outcomes data) against site owner demand signals (contaminant type and concentration, site geology, provincial jurisdiction, project timeline, budget, regulatory closure requirements). KnowledgeSlot curates provincial remediation standards and regulatory frameworks."
  economic_upside: "Canadian contaminated site remediation spending exceeds $2B annually. An estimated 20–30% of projects involve contaminant or site conditions where specialist matching would reduce cost by 15–30% compared to generalist approaches. A platform capturing 10% of this specialty segment generates $30–60M in facilitated specialist engagements with measurably better remediation outcomes."

