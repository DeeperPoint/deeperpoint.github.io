market_example:
  summary: "Canadian authors and publishers seeking literary translators — particularly
    for Indigenous languages, French-to-English and English-to-French literary
    translation, and immigrant-language works — cannot find translators whose
    stylistic register, subject-matter knowledge, and cultural fluency match the
    source text, while qualified literary translators are invisible outside
    narrow professional networks."
  problem: "Literary translation is not a commodity service. A translator who renders
    a Cree Elder's oral history into English must understand Cree narrative
    structure, possess the English prose register appropriate to the subject, and
    navigate the cultural politics of Indigenous knowledge translation. A
    translator converting a Québécois literary novel into English must capture
    joual dialect, Montreal cultural references, and the author's specific
    sentence rhythm. These requirements make every translation commission a thin
    market micro-problem: the pool of qualified translators for any given book is
    often fewer than ten people in the entire country, and neither the author nor
    the publisher knows who they are. The Literary Translators' Association of
    Canada has approximately 300 members. Canada Council translation grants fund
    roughly 50 books per year. The matching is done almost entirely through
    personal referral networks that favour translators in Toronto and Montreal
    with established publisher relationships. A translator in Winnipeg who is
    perfectly qualified to translate a Michif-influenced Prairie novel is
    invisible to the Toronto publisher who needs her."
  dominant_forces:
    - "Stylistic register opacity — a translator's prose voice and cultural
      fluency are only evaluable through reading their prior work, which
      publishers rarely have time to do for unfamiliar translators"
    - "Language pair scarcity — for Indigenous languages, immigrant languages,
      and non-standard dialect work, the pool of qualified literary translators
      may be fewer than five people nationally"
    - "Network concentration — the referral network is concentrated in
      Toronto and Montreal, rendering translators outside those cities
      effectively invisible to commissioning publishers"
    - "Cultural navigation complexity — Indigenous language translation
      involves community consent, cultural protocol, and knowledge governance
      that standard translation contracts do not address"
  deeperpoint_fit: "Semantic matching encodes translator profiles (language pairs
    including dialect and register specificity, published translation samples
    with prose style analysis, subject-matter domains, cultural protocol
    experience, Canada Council grant history, turnaround capacity) against
    publisher demand signals (source text genre, dialect, cultural context,
    budget, timeline, target audience). CommonContext curates Indigenous
    language translation protocols and community consent frameworks."
  economic_upside: "Canada Council for the Arts funds ~$3M annually in translation
    grants. Total Canadian literary translation market including commercial
    publishing is estimated at $15–25M annually. A platform capturing 15% of
    commission matching generates $2–4M in facilitated translation revenue
    and measurably increases the diversity of translated Canadian literature."

