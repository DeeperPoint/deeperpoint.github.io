market_example:
  summary: "An infantry reserve regiment in Sudbury needs a civilian wilderness survival instructor qualified to deliver Arctic-rated training before a February tasking. The qualified pool in Ontario is three individuals, two of whom are already contracted for the winter season. The regiment's training officer has never booked this type of training before and has six weeks. No CAF database lists qualified civilian instructors by specialty and availability."
  problem: "Canada's Reserve Force and some Regular Force units regularly require specialized training that the CAF's own school system does not deliver at the unit level — Arctic and cold-weather survival, CBRN (chemical, biological, radiological, nuclear) decontamination procedures for civilian industrial scenarios, combat casualty care for non-medical personnel, explosive ordnance reconnaissance, maritime search and rescue coordination, cyber defence fundamentals for signals units, and cultural or language preparation for specific NATO deployment destinations. This training is available from civilian vendors who have built specific expertise: wilderness survival schools with Arctic qualification, Level A hazmat training organizations, Tactical Combat Casualty Care (TCCC) civilian instructors, EOD awareness training providers. In each specialty the qualified vendor pool in Canada is small — often three to eight providers nationally — and the demand side is fragmented across dozens of reserve units that do not share procurement information or track vendor availability collectively. The result is a matching failure that manifests in multiple ways: units that cannot find the right vendor before the training window closes and deploy undertrained; units that find unqualified vendors because no verification standard exists; units that pay above-market rates because they are one-off buyers who cannot benchmark against what other units paid; and units that rediscover the same qualified vendors from scratch on each training cycle because institutional memory in reserve units is disrupted by annual turnover in training officer positions."
  dominant_forces:
    - "Vendor pool size — the nationally qualified pool for specific training specialties (e.g., Arctic survival to CAF-equivalent standard, CBRN Level A industrial) is two to eight providers; one or two availability mismatches eliminates most options for a unit with a fixed training window"
    - "Training officer turnover — reserve unit training officer positions turn over annually; institutional knowledge of qualified vendors does not transfer reliably; each new training officer rediscovers the vendor market from scratch"
    - "DND procurement complexity — unit-level training procurement must comply with PSPC contracting rules that vary by dollar threshold; training officers without procurement training routinely encounter compliance errors that delay or prevent vendor engagement"
    - "Qualification verification gap — no CAF-authoritative database lists civilian training vendors by specialty and qualification standard; units cannot verify whether a vendor's claimed credentials meet the CAF training standard their unit requires"
    - "Calendar compression — reserve unit training plans are built six to twelve months in advance but vendor booking decisions are often made four to eight weeks before the training date; the late-decision window coincides with peak demand from other units operating on the same fiscal calendar"
  deeperpoint_fit: "MarketForge lists civilian defence-accredited training vendors by specialty, qualification standard, geographic service area, and current availability calendar. Reserve and Regular Force units post training requirements with specialty, qualification standard required, unit location, training window, and participant count. The platform matches to vendors who meet the qualification, are available in the training window, and have delivered to CAF units previously — with a verified delivery track record drawn from previous unit ratings. Knowledge Slot provides DND training requirement standards by specialty, PSPC procurement threshold rules for unit contracting officers, and current CAF B-GG-005 training policy guidance."
  economic_upside: "Canadian Forces reserve unit training budgets are approximately $50M–$80M annually for unit-level discretionary training (excluding base school training). A platform that captures 10% of this procurement as structured vendor matching — $5–8M in matched training contracts — at a 2% facilitation fee generates $100,000–$160,000 in annual revenue from the reserve sector alone. Regular Force unit training and DND-wide specialized training procurement (Joint Staff, CJOC, formation HQs) extend the addressable market significantly. Reserve unit associations and Canadian Forces base training staffs are natural sponsors."

