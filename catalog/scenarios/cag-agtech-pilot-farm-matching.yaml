market_example:
  summary: "Canadian precision agriculture startups — soil sensor networks, variable-rate application AI, drone-based crop monitoring, yield prediction models — need farm-scale pilot partners with the right crop type, equipment compatibility, and data-sharing appetite. Finding those farms through industry conferences and personal networks takes six to twelve months that early-stage ventures cannot afford."
  problem: "Agricultural technology commercialization in Canada stalls at the pilot stage. A startup with a validated soil carbon sequestration measurement system needs a pilot farm partner with specific attributes: crop rotation including a perennial component, existing soil testing program for baseline comparison, no conflicting sensor contracts with competing vendors, farm owner who is willing to share yield and application data under a research agreement, and sufficient scale to generate statistically meaningful results. A startup with an AI-based variable-rate nitrogen application system needs a pilot partner with a precision planter, a compatible telemetry system, a cooperative agronomic advisor, and a farmer willing to accept split-field experimental design. These attributes are not captured anywhere. Ag industry directories list farms by size and crop type only. Agricultural Research Organizations have waiting lists for their demonstration farm networks. University extension programs have their own demonstration agendas. The startup's founder searches the conference circuit and asks every contact they know — a search that consumes the majority of the founding team's first operating year, delays commercialization by twelve to eighteen months, and is frequently resolved by accepting a pilot farm partner whose attributes are suboptimal for the technology."
  dominant_forces:
    - "Attribute specificity — the pilot farm requirements are highly specific by crop type, existing equipment, sensor compatibility, data sharing willingness, and agronomic program — attributes not indexed in any agricultural directory"
    - "Trust threshold — a pilot farm partner is sharing sensitive production data (yield maps, application rates, soil test results) and accepting unproven technology on their commercial production; the trust required is not established through a cold introduction"
    - "Temporal constraint — pilot study designs require spring or fall initiation aligned to the planting calendar; a failed pilot farm search means a full growing season lost"
    - "Participant scarcity — farmers with the right equipment compatibility, technology openness, data sharing willingness, and operational scale for a credible pilot are a small subset of the total farmer population"
    - "Offering complexity — the startup's pilot requirements must be articulated precisely enough that a farmer can evaluate whether their operation qualifies — a level of specificity that a conference introduction cannot efficiently convey"
  deeperpoint_fit: "Semantic matching encodes farm profiles (crop type and rotation, existing precision agriculture equipment by make and telemetry system, prior research participation history, data sharing policy, agronomic advisory relationship, scale by commodity category, geographic region) against startup demand signals (technology type, crop application, equipment compatibility requirements, data requirements, pilot design, field scale required, geographic accessibility). The Generative Match Story helps startups articulate pilot requirements in farmer-legible terms."
  economic_upside: "Canadian agtech VC investment exceeded $800M in 2024. The most common cause of early-stage agtech company failure is not technology — it is the inability to generate commercial-scale proof-of-concept data that justifies scale-up investment. A pilot farm match that is resolved in four weeks rather than twelve months accelerates the commercialization timeline by a full growing season, worth 12–18 months of venture runway in the most capital-intensive stage of the company's life. The Canadian federal AgriInnovate and CDFA programs fund agtech pilots specifically, creating a government grant channel that a pilot-match platform can interface with as a submission enabler."
  
