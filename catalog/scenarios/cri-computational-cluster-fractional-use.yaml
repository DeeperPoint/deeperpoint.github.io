market_example:
  summary: "Matches labs that possess surplus local compute cluster capacity with researchers whose datasets exceed standard university allocations but don't warrant massive national supercomputer access."
  problem: "Data science and AI applications in research cause intense but bursty computational demand. Compute Canada/Digital Research Alliance provides massive national resources, but wait times can be long. Conversely, many highly funded individual labs build expensive local GPU or CPU clusters that sit completely idle between their own training runs. There is no mechanism to rent or trade this local high-performance compute (HPC) capacity securely to neighboring researchers."
  dominant_forces:
    - "Surging demand for GPU availability across all scientific disciplines."
    - "Millions in grant funding wasted on redundant, underutilized local server hardware."
    - "Security and data-residency fears prevent blind sharing."
  deeperpoint_fit: "CoSolvent aggregates idle GPU/CPU cycles across institutional labs. KnowledgeSlot guarantees adherence to data residency and ethics compliance restrictions. The platform manages the fractional job queueing and inter-lab micro-billing."
  economic_upside: "Democratizes access to high-performance compute for underfunded labs while providing vital cost-recovery for labs carrying heavy localized hardware maintenance and cooling costs."

