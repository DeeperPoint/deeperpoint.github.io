  - title: "Trade Credit Receivables Portfolio Monitoring"
    type: commerce-extension
    revenue_model: "Annual trade credit monitoring subscription per seller ($2,000–8,000/year;
      covers continuous customer credit monitoring for the seller's top 20 accounts,
      limit utilization tracking, credit limit change alerts, and claim early warning indicators)."
    strategic_logic: "Trade credit insurance policyholders must actively monitor customer
      credit limits set by the insurer and report significant credit changes. A monitoring
      service that tracks customer credit health against trade credit policy limits and
      generates early warning alerts before limit reductions create coverage gaps converts
      the trade credit administrative burden into a managed subscription service—maintaining
      the seller's relationship with the platform through the life of their trade credit policy."
    recurring: true

  - title: "Supply Chain Disruption Response Logistics Extension"
    type: logistics-extension
    revenue_model: "Retainer subscription for pre-qualified alternative supplier identification
      ($3,000–10,000/year; covers maintaining a pre-vetted alternative supplier database
      for a company's top 10 single-source dependencies, enabling rapid supplier transition
      if primary supplier disruption occurs); per-event alternative supplier activation
      coordination fee."
    strategic_logic: "Insurance covers the financial loss from supply chain disruption;
      it does not resolve the operational problem of finding an alternative supplier
      during a disruption event. A pre-qualified alternative supplier database maintained
      alongside the CBI policy creates an operational response capability that the insurer
      values (it reduces claim severity) and the policyholder values (it shortens disruption
      duration). The logistics extension converts CBI placement into a supply chain resilience
      service, creating a recurring revenue stream from every CBI account the platform established."
    recurring: true

story:
  title: "The Supplier Nobody Knew About"
  status: draft
  blog_slug: ""
  characters:
    - "Anita - VP Operations, precision automotive components manufacturer, Windsor"
    - "Derek - supply chain risk engineer and CBI specialist broker, Toronto"
  summary: "A Windsor automotive components manufacturer discovers—through a CBI underwriting
    process structured by a specialist broker—that 60% of its production depends on a single
    Tier 2 resin supplier in Texas whose plant flood risk was never mapped, and obtains CBI
    coverage that pays $3.2M when that supplier closes for twelve weeks following a hurricane."
  body: |
    ## Act A - The Market Structure

    Supply chain concentration risk is endemic in manufacturing. Every manufacturer has
    single-source dependencies—a component, a compound, a subassembly—that was single-sourced
    for cost or quality reasons and never re-qualified with an alternative because the primary
    supplier has never failed. The risk is invisible until it materializes. When it materializes,
    the downstream revenue loss is severe and occurs before any physical damage at the insured's
    own facility—making it unrecoverable under a standard property or business interruption policy.

    Contingent business interruption insurance exists to cover this scenario. The coverage is
    available, the underwriting logic is sound, and Lloyd's and specialty insurers maintain
    meaningful capacity for CBI covers. The access barrier is the underwriting requirement:
    the insured must identify the named suppliers whose disruption would trigger coverage,
    characterize the dependency (how much revenue depends on this supplier), and provide the
    supplier's location, business operations, and known risk factors. Most manufacturers
    have never assembled this information in underwriting format. Most commercial brokers
    have never asked them to. CBI remains the most consistently underutilized commercial
    insurance product relative to the risk it covers.

    ---

    ## Act B - The Story

    **Anita** runs operations for a Windsor precision components manufacturer supplying
    plastic and composite parts to three Canadian OEM automotive plants. Her annual revenue
    is $42M. She has comprehensive commercial insurance including standard business interruption
    coverage for damage to her own plant. She has never purchased CBI coverage. Her commercial
    broker has never mentioned it.

    When a peer at a manufacturing association conference described a CBI claim settlement,
    Anita mentioned it to her commercial broker. The broker contacted three commercial CBI
    underwriters; two declined to quote without a supply chain risk assessment, and one
    offered a limited named-supplier policy if Anita could identify her top five suppliers.
    Anita realized she didn't know where all of her critical components originated—she
    bought from a Tier 1 compound distributor in Michigan who sourced from multiple Tier 2
    resin manufacturers. The chain was opaque.

    **Derek** is a supply chain risk engineer who structures CBI and trade credit submissions
    for specialty brokers. His process maps supply chains to the second and third tier,
    identifies geographic concentration and single-source dependencies, and formats the
    risk presentation to CBI underwriting standards. He has worked with automotive, aerospace,
    and pharmaceutical manufacturers—never had an inbound inquiry from a Windsor Tier 2
    supplier. He found clients through reinsurance broker referrals and one Lloyd's syndicate
    underwriter who sent him referrals when direct submissions arrived without adequate supply
    chain characterization.

    Anita's risk profile surfaces Derek's practice on the specialist platform. Derek's
    supply chain risk assessment reveals that 60% of Anita's production depends on a single
    Tier 2 resin formulator in Port Arthur, Texas—a facility located in a coastal flood zone.
    The assessment produces a CBI-ready named-supplier submission. Coverage is placed for
    the Texas supplier at a $4M per-occurrence limit. Fourteen months after placement,
    Hurricane Beryl causes twelve weeks of plant closure at the Port Arthur facility.
    Anita's CBI policy pays $3.2M in revenue loss. Her commercial property policy pays nothing—
    no damage occurred at her Windsor plant.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Anita had insurable supply chain risk for the entire life of her company. The risk was
    characterized by Derek in six weeks of structured supply chain mapping. The coverage was
    available and the premium was commercially reasonable relative to the risk. The market
    failed because Anita's commercial broker did not have supply chain risk engineering
    capability, Derek's practice was not visible to Anita's commercial broker, and no
    mechanism existed to connect a Tier 2 automotive manufacturer's unexplored CBI need
    with the specialist who could convert that need into a bindable submission.

    This failure pattern repeats across Canadian manufacturing: significant insurable supply
    chain concentration risk, commercially available coverage, specialist capacity—and no
    matching infrastructure connecting them.

    *Characters are fictional. Contingent business interruption insurance underwriting requirements
    and mid-market penetration gaps are well-documented in the commercial insurance market.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
