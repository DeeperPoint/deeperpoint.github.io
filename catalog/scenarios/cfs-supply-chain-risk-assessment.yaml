market_example:
  summary: "Canadian manufacturers and distributors with concentrated or opaque supply
    chains carry material disruption risk that contingent business interruption insurance
    could transfer—but CBI underwriting requires supply chain transparency that most
    companies lack, and the specialists who can both map the risk and structure the
    coverage are unknown to the buyers who need them. A matching platform connects
    supply chain risk managers, trade credit insurers, and CBI underwriters around
    specific buyer risk profiles."
  problem: "Contingent business interruption insurance covers revenue loss caused not by
    damage to the insured's own property but by disruption to a key supplier or customer.
    It is the natural insurance response to supply chain concentration risk—the single-source
    supplier, the sole qualified subcomponent manufacturer, the monopoly logistics provider.
    The structural problems are interconnected: CBI underwriting requires that the insured
    can identify and characterize their key supplier dependencies with sufficient specificity
    for the insurer to assess the probability and severity of disruption scenarios; most
    mid-market manufacturers have never mapped their supply chain to this standard; and
    the specialists who can conduct supply chain risk assessments in the format CBI
    underwriters require are concentrated in a small number of risk engineering and supply
    chain consulting practices that work primarily with large industrial accounts. Trade
    credit insurance—covering the credit risk of key customers defaulting on accounts
    receivable—presents a symmetric problem: trade credit insurers will cover a portfolio
    of receivables if the seller can present customer credit profiles in underwriting-ready
    format, a structured risk presentation that most mid-market sellers have never
    prepared. The result is that Canadian manufacturers and distributors with material
    supply chain concentration or customer credit concentration carry risks that are
    technically insurable but remain uninsured because the matching and risk structuring
    infrastructure does not exist in the mid-market."
  dominant_forces:
    - "CBI and trade credit underwriters require supply chain and customer credit data
      in structured underwriting formats that mid-market companies do not routinely
      maintain, creating a risk presentation gap that no standard commercial broker can
      bridge without specialist supply chain risk engineering capability."
    - "Post-pandemic supply chain reconfiguration has substantially increased single-source
      and geographic concentration risk for Canadian manufacturers who reshored or
      near-shored production but retained concentrated supply relationships—expanding the
      addressable CBI market at the same time as supply chain risk engineering capacity
      remains scarce."
    - "Trade finance lenders and export credit agencies (EDC, BDC) are increasingly
      requiring supply chain risk assessment and trade credit insurance as conditions
      of financing, creating regulatory pressure on mid-market companies to access
      the specialist ecosystem the commercial insurance market cannot efficiently direct
      them toward."
  deeperpoint_fit: "CommonContext encodes the supply chain risk assessment methodology
    frameworks used by CBI and trade credit underwriters—supplier tier mapping standards,
    single-source concentration metrics, customer credit profile requirements, geographic
    concentration assessment frameworks—alongside the specialist practices that conduct
    supply chain risk assessments and the CBI and trade credit underwriters that accept
    their risk presentations. CoSolvent matches the buyer's industry, supply chain
    structure, and concentration profile against the appropriate risk assessment specialists
    and the underwriters most likely to provide coverage for the characterized risk."
  economic_upside: "The global contingent business interruption insurance market exceeds
    $4B in annual premium, growing at 15% annually post-pandemic. The Canadian mid-market
    segment—manufacturers and distributors at $10–500M revenue with uninsured supply chain
    concentration risk—represents an estimated $300–800M in addressable CBI and trade credit
    premium. Trade credit insurance alone covers approximately $80B in Canadian trade
    receivables annually; mid-market penetration is estimated below 25% of eligible
    receivables. A platform enabling 15% of uninsured mid-market CBI and trade credit
    demand to find coverage generates $45–120M in placed annual premium."

