market_example:
  summary: "Municipal procurement portals built for commodity trades cannot encode heritage restoration specializations, causing projects to be awarded to unqualified contractors and producing rework that costs 15–30% of project budgets."
  problem: "Municipalities maintaining heritage-designated buildings — courthouses, transit stations, libraries, civic halls — regularly need trades workers with specific restoration skills: lime-mortar pointing, heritage window restoration, copper roofing, ornamental plaster repair, structural timber work. Standard procurement portals (Bids & Tenders, Merx) are built for commodity trades and cannot encode these specializations. The result: heritage projects go to general contractors who subcontract poorly qualified workers, producing inadequate work, expensive rework, and conservation violations."
  dominant_forces:
    - "Participant scarcity — certified heritage trades practitioners are few, aging, and geographically dispersed"
    - "Opacity — specialized subcontractors operate through word-of-mouth networks invisible to procurement officers"
    - "Offering complexity — heritage skill sets are highly specific and non-interchangeable (a lime mortar specialist is not qualified to restore heritage tilework)"
    - "Regulatory fragmentation — heritage conservation standards vary by designation type (federal, provincial, municipal), material specifications, and certifying body"
    - "Cognitive overload — procurement officers cannot assess niche heritage trades qualifications without domain expertise they do not have"
  deeperpoint_fit: "Semantic matching encodes heritage trades by specific technique, material, heritage designation type, and certification body — far beyond the NAICS code-based filtering of current procurement portals. CommonContext curates Standards and Guidelines for the Conservation of Historic Places in Canada, Secretary of the Interior's Standards, Parks Canada Technical Bulletins, material specifications, and certifying body requirements. The Generative Match Story explains to procurement officers why a specific artisan is qualified for a specific project, bridging the knowledge gap between heritage expertise and bureaucratic procurement."
  economic_upside: "Municipalities currently spend an estimated 15–30% of heritage project budgets remediating inadequate first-attempt work. Better matching between procurement and qualified heritage trades protects capital investments, reduces rework costs, and sustains the artisan economy that keeps these skills alive."

