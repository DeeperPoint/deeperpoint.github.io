story:
  title: "The Map No One Gave Her"
  status: draft
  blog_slug: ""
  characters:
    - "Diane — 44-year-old elementary school teacher in Sudbury, permanent end-colostomy following rectal cancer surgery, 12 weeks post-discharge"
    - "Marie-Josée — retired nurse in Montreal, 8 years post-ileostomy, Crohn's disease; active lifestyle mentor profile on platform covering return-to-work and athletic activity"
    - "Kevin — independent ostomy supply advisor in Hamilton, 20 years pharmacy background, specialized in ostomy product assessment; no manufacturer affiliation"
  summary: "Twelve weeks after ostomy surgery, a Sudbury teacher is still managing daily leaks with the product she was discharged with and has found no practical help — not from the hospital, not from online groups whose members have fundamentally different ostomy types. She finds a peer mentor with the same ostomy cause and lifestyle profile in twelve minutes."
  body: |
    ## Act One: The Wrong Equipment

    Twelve weeks out of surgery, Diane Kowalski was still taping. Every morning before school she applied the same pouching
    system the hospital had discharged her with, and every afternoon by third period she was managing a slow leak under her
    teacher's cardigan.

    The WOC nurse at Health Sciences North had been excellent during the two days she had been available. The follow-up
    appointment was six weeks out. When Diane called to describe continued leaking, the advice was more adhesive tape.

    The online forum was warm. But the top post from someone who "totally understood" was about managing an ileostomy after
    Crohn's. Diane had a permanent end-colostomy from rectal cancer. The output consistency was different. The pouching
    physics were different. The product geometry was different. The dietary triggers were different. She left the tab open
    for a week without posting.

    She typed her situation into the platform search at 11 PM on a Tuesday with no real expectation.

    ---

    ## Act Two: The Specific Match

    The system returned three mentor profiles filtered to end-colostomy, surgical cause colorectal cancer, time since surgery
    under eighteen months. Two didn't match her lifestyle tags. The third was a woman in her 40s — a retired nurse,
    end-colostomy, listed as active in athletic activity and return-to-work mentoring.

    Marie-Josée had been through six product failures in her first year. She described exactly which combination had worked
    for her anatomy and daily schedule, and mentioned an independent supply advisor in Hamilton she had found through the
    platform — no manufacturer affiliation, flat-fee virtual assessment.

    Kevin offered a video fitting session the following Saturday. He documented Diane's stoma profile, skin condition, daily
    schedule, and the products she had tried. He recommended three systems she had never encountered — none of which were in
    her discharge kit.

    ---

    ## Act Three: September

    By the end of the school year, Diane had not had a leak in eight weeks. She had returned to the pool. She had posted one
    carefully detailed answer in the forum about returning to work as a teacher — not to the general group, but to the
    end-colostomy / return-to-work thread — and had applied to become a peer mentor herself.

    The platform logged fourteen new matches that month in the end-colostomy / active lifestyle / return-to-work category.
    Each one was a conversation the healthcare system had no infrastructure to facilitate.

    *Characters are fictional. Ostomy prevalence data, the role of WOC nurses in Canadian hospital discharge, and the
    complexity of ostomy product selection are real. [DeeperPoint](../../marketforge.html) is building the matching
    infrastructure this market requires.*
