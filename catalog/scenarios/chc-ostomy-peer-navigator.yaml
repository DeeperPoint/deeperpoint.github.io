market_example:
  summary: "200,000 Canadians live with an ostomy but receive almost no practical support after hospital discharge. Online patient groups are too undifferentiated to help: a colostomy is not an ileostomy. The market matches new ostomates to peer mentors with the same ostomy type, cause, and lifestyle — and to independent supply advisors who can find the right product."
  problem: "After ostomy surgery, patients are typically discharged with a basic pouching kit, a pamphlet, and a brief visit from a Wound, Ostomy, and Continence (WOC) nurse whose caseload and mandate centre on wound healing, not longer-term self-management. WOC nurses are concentrated in major urban hospitals; patients outside those centres have limited access even during the critical early months. The product landscape is genuinely complex: dozens of manufacturers, hundreds of product combinations, and optimal product selection requires knowing a patient's stoma profile, skin type, activity level, and daily schedule — knowledge that takes months of trial and error to develop unassisted. Online patient communities are supportive but undifferentiated. A 72-year-old with a permanent end-colostomy from rectal cancer and a 30-year-old athletic professional with a temporary loop ileostomy from Crohn's disease share an emotional bond but almost nothing practical. The match on ostomy type, surgical cause, lifestyle, and goals is essential to useful peer support, and no infrastructure exists to create it systematically."
  dominant_forces:
    - "Type specificity — colostomy, ileostomy, and urostomy have fundamentally different output characteristics, pouching requirements, and dietary implications; loop vs. end, temporary vs. permanent add further dimensions that make undifferentiated peer groups unreliable"
    - "Thin supply of qualified mentors — experienced ostomates willing and able to mentor are dispersed and invisible; there is no directory and no mechanism for newly diagnosed patients to find them"
    - "Search cost on both sides — newly diagnosed patients lack the vocabulary to search effectively; potential mentors have no platform to list themselves"
    - "Trust barrier — patients share private medical and lifestyle information only with people who have direct experiential credibility with the same condition"
    - "Commercial conflict of interest — stoma supply manufacturers' patient outreach is product-specific; hospital discharge support is liability-constrained; independent matching infrastructure does not exist"
  deeperpoint_fit: "MarketForge can structure the match on ostomy type, surgical cause, age range, and lifestyle priorities — all voluntarily disclosed by patients, with no clinical record sharing required. Peer mentors create profiles describing their ostomy type, time since surgery, and areas of expertise (return to work, athletic activity, travel, diet management). WOC nurses may list themselves as professional resources with specialty tags. Independent ostomy supply advisors — unaffiliated with any manufacturer — can participate as professional members. The privacy exposure is minimal: patients disclose only what they choose, to peers they select."
  economic_upside: "The Canadian ostomy supply market is approximately $200 million per year. Patients who receive better matched guidance earlier make better product selections, reduce costly trial and error, and sustain engagement with the healthcare system rather than retreating in frustration. A platform funded through a national patient organization, health foundation grants, and professional member subscriptions (supply advisors, WOC nurses) operates without requiring access to clinical data. Provincial health systems benefit from reduced stoma-related complications and emergency visits driven by product failure — a real and measurable cost."

