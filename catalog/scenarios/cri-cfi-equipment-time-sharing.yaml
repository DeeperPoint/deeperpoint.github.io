market_example:
  summary: "Matches researchers needing highly specialized equipment (e.g., electron microscopes) with underutilized Core Facilities at other universities to maximize grant ROI. Commercial Note: Dependent on federal CFI/Tri-Agency sponsorship."
  problem: "The Canada Foundation for Innovation (CFI) funds million-dollar lab instruments, encouraging them to operate as 'Core Facilities' with cost-recovery models. However, discovering which university has an available, properly calibrated instrument—and managing the cross-institutional billing and liability—is a bureaucratic nightmare, leading to idle machines while nearby researchers wait months for access or buy redundant equipment."
  dominant_forces:
    - "CFI grant compliance strongly encourages multi-institutional time sharing."
    - "High fixed maintenance costs for complex lab instruments whether they run or not."
    - "Inter-university financial transfers and liability waivers are notoriously slow and opaque."
  deeperpoint_fit: "CoSolvent aggregates equipment availability and researcher demand. KnowledgeSlot stores hardware calibration states and standard operating procedures (SOPs). The platform generates compliant smart-contracts to handle indemnification and inter-university cross-billing seamlessly."
  economic_upside: "Optimizes a multi-billion dollar national research hardware portfolio. Capturing even 2% of the wasted depreciation via a transaction clearinghouse models into a highly sustainable platform."

