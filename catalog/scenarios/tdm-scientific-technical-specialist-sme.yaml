market_example:
  summary: "SMEs in food science, biotech, specialty chemicals, and industrial R&D need
    laboratory and research specialists whose methodological experience precisely matches
    their specific analytical systems, regulatory frameworks, and product contexts — qualities
    invisible in a credential and visible in lab reports, method validations, and published work.
    A rich-profile platform lets employers upload their SOPs and method documents while
    candidates upload their actual scientific work product."
  problem: "A craft beverage company developing a line of botanical extracts for the functional
    food market needs a food chemist whose methodological experience covers HPLC method
    development for polyphenol quantification, GRAS self-determination process familiarity,
    and botanical ingredient identity testing under Health Canada's Natural Health Products
    Regulations. These requirements are not unusual for a specialist in this space, but they
    are also not visible from a food science degree and a list of previous employers on a
    resume. They are visible from a method validation report the candidate wrote, from the
    HPLC protocol they developed for a similar botanical extract, from the GRAS notification
    they participated in preparing, or from the academic paper they published on polyphenol
    stability in aqueous matrices. The credential says 'food chemist.' The document corpus
    says 'this person has done exactly this kind of work.' The thin market for scientific
    and laboratory specialists in Canadian SMEs is acutely mismatched by credential-based
    search. SME R&D operations — specialty chemical manufacturers, food ingredient companies,
    cannabis extraction operations, medical device manufacturers, environmental testing labs —
    need specialists with specific methodological and regulatory experience that the generalist
    scientific degree does not certify. The candidates who have that experience are typically
    employed, not actively searching, and not visible in standard job boards. They are visible
    in their publications, their conference posters, their method validations, their technical
    reports, and their patent filings — documents that contain precisely the information an
    employer needs to evaluate the match but that no standard hiring platform has any
    mechanism to ingest and semantically match against the employer's own technical documentation."
  dominant_forces:
    - "Scientific methodological expertise is product- and application-specific in ways that
      general degree credentials cannot capture: a chemist with HPLC experience in pharmaceutical
      method development is not necessarily qualified for cannabis terpene profiling using the
      same instrument platform, because the matrix, the regulatory framework, and the
      validation standard are all different — and the difference is visible in method
      validation documents, not in credential listings."
    - "SME scientific employers cannot compete for scientific talent through compensation or
      institutional prestige against large pharmaceutical, food, or chemical companies —
      but can offer research autonomy, product ownership, and applied impact that attracts
      specialists whose interests align with SME-scale innovation. The matching problem is
      finding these candidates before the large employer does, which requires a different
      discovery channel than standard job boards."
    - "Scientific candidate visibility is concentrated in publication databases, conference
      presentation archives, and institutional research repositories — not in job boards.
      The chemist who is the best match for an SME's specific analytical program has likely
      never posted a resume on Indeed; they have posted a paper in the Journal of Agricultural
      and Food Chemistry and presented a poster at the Canadian Society for Chemistry conference."
  deeperpoint_fit: "KnowledgeSlot encodes the scientific and laboratory method taxonomy
    across Canadian regulatory and technical domains: Health Canada NHP Regulations
    analytical requirements, CFIA food chemistry method standards, HC Drug Identification
    Number analytical submission requirements, cannabis quality testing requirements under
    the Cannabis Regulations, environmental analytical method standards under CCME protocols,
    and medical device biocompatibility testing standards. CoSolvent semantically matches
    the employer's uploaded technical documents (SOPs, method validation reports, product
    technical files, regulatory submission sections) against the candidate's uploaded work
    product (publications, thesis work, conference posters, method validation reports,
    technical reports, patent applications) — identifying candidates whose methodological
    practice is verified by their documented work against the employer's documented technical
    requirements."
  economic_upside: "The Canadian SME science and technology sector — specialty food and
    ingredients, cannabis science, environmental analytics, specialty chemicals, industrial
    biotech, medical device manufacturing — employs an estimated 45,000–70,000 laboratory
    and R&D technical specialists. Annual hiring demand is estimated at 4,000–8,000 positions
    in the specialist technical category where credential-based matching is insufficient.
    At employer subscription values of $1,000–3,000/month per active technical job profile,
    and 500 concurrent active profiles at any time, the platform generates $6–18M annually
    in scientific employer subscriptions alone, with scaling potential across the national
    research institution and industrial science workforce."

