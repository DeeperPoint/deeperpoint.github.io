market_example:
  summary: "The Immigration and Refugee Board cannot efficiently identify qualified country conditions experts and language interpreters with dialect-specific competency for hearings involving applicants from conflict zones, minority linguistic communities, and countries undergoing rapid political change."
  problem: "Refugee Protection Division hearings at the Immigration and Refugee Board require two categories of scarce expertise: country conditions experts who have current, specific knowledge of the political, security, and social conditions in an applicant's country of origin; and interpreters who are competent in not just the national language but the specific regional dialect, minority language, or cross-border linguistic variant the applicant uses. A country conditions expert on Nigeria is not interchangeable with an expert on Delta State targeting of Ijaw environmental activists. An interpreter qualified in Sudanese Arabic is not interchangeable with a Nuer interpreter for a South Sudanese Nuer applicant. These distinctions are legally consequential — country conditions errors and interpreter accuracy failures are among the most frequent grounds for successful Federal Court judicial review of refugee determinations. Yet the IRB's capacity to identify the right expert and the right interpreter for a specific hearing remains limited by a roster system that has not kept pace with the diversity of current refugee claimant origins."
  dominant_forces:
    - "Participant scarcity — qualified country conditions experts with current, specific sub-national knowledge of conflict zones and minority community targeting are a small and poorly organized population in Canada"
    - "Dialect specificity — the distinction between a qualified national language interpreter and a qualified minority dialect or regional variant interpreter is legally consequential and not captured in standard interpreter registries"
    - "Offering complexity — matching requires alignment on country of origin, specific region and ethnicity, claimed persecution basis (ethnic, political, religious, gender-based), hearing urgency tier, and interpreter dialect classification"
    - "Knowledge timeliness — country conditions change rapidly in active conflict zones; an expert whose knowledge is three years out of date may provide testimony that misrepresents current conditions"
    - "Access to justice — errors in expert and interpreter matching systematically disadvantage claimants from minority linguistic and ethnic communities with limited diaspora presence in Canada"
  deeperpoint_fit: "Semantic matching encodes expert profiles (country expertise by region, ethnicity, and persecution basis type; most recent in-country or primary source research; court qualification history) and interpreter profiles (language family, dialect classification, regional variant, IRB certification status, security check levels) against hearing demand signals (country, region, ethnicity, persecution basis, hearing date, urgency tier, official vs. minority language requirement). KnowledgeSlot curates IRB Refugee Protection Division rules of procedure, UNHCR country of origin information reports, and the IRB's country conditions expert guideline."
  economic_upside: "Federal Court judicial review of IRB decisions costs $15,000–$50,000 per proceeding and results in a significant proportion of successful applications being returned for re-determination — adding 18–36 months to resolution timelines for applicants who are frequently in precarious status. Better expert and interpreter matching at the hearing stage reduces the substantive errors that produce successful judicial reviews, improves the accuracy of determinations, and reduces the systemic costs of re-determination cycles."

