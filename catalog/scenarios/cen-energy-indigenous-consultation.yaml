market_example:
  summary: A specialist matching platform connecting major energy infrastructure developers—
    pipeline, transmission, and generation project proponents—with Indigenous consultation
    practitioners who have established community relationships, CER proceeding experience,
    and territory-specific cultural competency within the specific First Nations and Métis
    communities whose traditional territories the project traverses.
  problem: "The duty to consult and accommodate Indigenous peoples whose rights may be affected
    by energy project approvals is a constitutionally grounded obligation that has become
    the primary determinant of energy project approval timelines in Canada. Projects that
    fail to conduct meaningful consultation do not receive CER construction approvals;
    projects that conduct consultation through practitioners who lack genuine community
    relationships face litigation and conditional approval delays that can add 3–8 years
    to project schedules worth $1–10B. The Indigenous consultation practitioner market is
    a thin market by every definition. Meaningful consultation—not procedural compliance,
    but the kind of substantive dialogue that satisfies the constitutional standard and
    reduces litigation risk—requires practitioners with three attributes simultaneously:
    relevant cultural knowledge and relationship history with the specific community, familiarity
    with the CER's and provincial EA's procedural consultation requirements, and economic
    development expertise to structure meaningful accommodation packages. The number of
    practitioners who combine all three attributes for any given community is small. This
    is distinct from the mining sector: energy regulatory proceedings (CER Act, provincial
    utility board hearings) have specific consultation record requirements and formal Intervenor
    processes that do not apply to mine development permitting. An Indigenous relations
    consultant experienced with mine permitting in the Athabasca oil sands context is not
    automatically equipped for a CER pipeline hearing involving Gitxsan title territory in BC."
  dominant_forces:
    - "The constitutional duty to consult creates non-negotiable consultation requirements
      for energy projects—but the practitioners who can satisfy those requirements at the
      community-relationship depth that avoids litigation are structurally scarce and
      almost entirely allocated through existing developer-consultant relationships."
    - "CER proceeding consultation records are formal regulatory documents—the consultation
      adequacy of the record is subject to judicial review and must be built by practitioners
      with specific CER process familiarity, not just community relations expertise."
    - "Post-UNDRIP alignment, the standard for consultation adequacy in Canadian courts has
      risen: procedural compliance without substantive accommodation is increasingly a failed
      consultation that delays or defeats project approval."
  deeperpoint_fit: "KnowledgeSlot encodes the consultation adequacy framework: constitutional
    standards from Haida Nation, Tsilhqot'in, and subsequent jurisprudence; the CER's
    consultation and accommodation requirements by project type; and the elements of an
    accommodation package that courts have recognized as meeting the substantive standard.
    CoSolvent matches project geographic routes and territorial overlaps against practitioner
    profiles built from specific First Nation and Métis community engagement history,
    CER proceeding participation records, and accommodation package structuring experience."
  economic_upside: "A single pipeline or transmission project delayed three years by inadequate
    Indigenous consultation represents $200M–3B in deferred capital expenditure and lost
    project value. The Canadian energy infrastructure pipeline includes $100B+ in projects
    where consultation quality will determine approval timelines. Matching the right practitioner
    to the right community is worth tens of millions in avoided delay risk per project."
