  body: |
    ## Act A - The Market Structure

    The constitutional duty to consult is not a checkbox. Courts have been explicit:
    procedural consultation—sending letters, holding open houses, recording objections—
    without substantive accommodation is an inadequate discharge of the duty. And inadequate
    consultation leads to judicial review, which leads to project approval conditions being
    overturned, which leads to years of delay at a cost that makes the consultation investment
    look microscopic in retrospect.

    The energy developer who invests in the right consultation practitioner—the one with
    the community relationships, the CER proceeding experience, and the accommodation
    structuring capability—is not spending money on consultation. They are buying schedule
    certainty. The developer who retains whichever firm responded to the RFP most confidently
    is gambling with a billion-dollar asset.

    The problem is that the practitioners who deliver genuine consultation adequacy are not
    discoverable through RFPs. Their value is the specific community relationships they bring—
    relationships built over years of previous engagements that are not visible in a proposal document.

    ---

    ## Act B - The Story

    **Ian** is managing the Indigenous relations program for a 480-kilometre transmission line
    project extending from southern Alberta into Saskatchewan. The route crosses the traditional
    territories of four First Nations and traverses Métis Region 3 territory. CER pre-filing
    consultation is required to be substantially complete before the application is filed. He
    has 18 months before filing. He issued a consultation lead RFP. Six firms responded. None
    of the six has documented engagement history with more than two of the five communities
    on the route. The two with the most relevant community history have never been a party
    to a CER proceeding. The two with CER experience have no relationship with the Métis
    communities at all.

    **Danielle** has spent 14 years in Indigenous consultation work in the Alberta-Saskatchewan
    border area. She has worked on three previous utility projects traversing Métis Region 3,
    has established professional relationships with the Métis Nation of Alberta's Resource
    Development department, and was the consultation lead on a pipeline project that achieved
    full accommodation agreements with two of the four First Nations on Ian's route. She
    maintains a small independent practice and didn't see Ian's RFP.

    Ian queries the platform: transmission line project, Alberta-Saskatchewan corridor,
    Métis Region 3, four First Nation territories (specified by name), CER pre-filing
    consultation, accommodation package structuring required. Danielle's profile surfaces
    with documented engagement history across all five community groups and two CER
    proceedings on her record. Ian contacts her within a week of the query. The
    consultation program commences with practitioners who have the relationships required
    to make it substantive rather than procedural.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Energy project consultation cannot be done adequately by practitioners who lack the
    community relationships—and those relationships are invisible to any procurement process
    that doesn't specifically structure for them. DeeperPoint builds the practitioner registry
    that makes community-relationship history into a discoverable, matchable qualification
    rather than a hidden advantage of the development team's existing network.

    *Characters are fictional. The consultation adequacy standard in Canadian energy project
    approvals is real and has been established in multiple Supreme Court decisions.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
