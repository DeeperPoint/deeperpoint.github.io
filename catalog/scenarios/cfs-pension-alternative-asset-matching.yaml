story:
  title: The Mandate Gap
  status: draft
  blog_slug: ""
  characters:
    - "Anne - CIO, Ontario municipal pension fund with $800M in assets, Windsor"
    - "Patrick - Managing Partner, specialist Canadian cleantech infrastructure fund, Toronto"
  summary: "A Windsor municipal pension fund seeking cleantech infrastructure exposure finds
    a specialist Canadian fund manager whose LP profile, fund size, and OSFI documentation
    align with their $35M mandate—through a structured alternative asset matching platform."
  body: |
    ## Act A - The Market Structure

    The Canadian pension system protects retirees through two very different experiences
    of the investment world. Large plans—CPPIB, OTPP, OMERS—have the scale to hire former
    McKinsey partners as investment directors, co-invest directly in airports, and negotiate
    separately managed accounts with top-quartile fund managers. The 400 smaller plans
    below them have the same obligation to their beneficiaries and access to a fraction
    of the opportunity set.

    The alternative asset deficit is not a matter of investment sophistication—most smaller
    plan CIOs have the expertise to evaluate private equity and infrastructure opportunities.
    It is a matter of discovery. The established pension consulting firms cover the
    large-manager universe comprehensively; their coverage of specialist and emerging managers
    who actively want smaller LP mandates is thin. The CIO who would allocate $35M to a
    genuine cleantech infrastructure platform has no systematic mechanism to find the fund
    manager whose target LP ticket is exactly $35M.

    ---

    ## Act B - The Story

    **Anne** manages investments for Windsor's municipal pension plan. Her investment policy
    targets 18% in alternatives—$144M at current plan size. Her current allocation is 9%,
    all in large established infrastructure funds with $100M minimum LP commitments that
    she accessed through her pension consultant. She has identified cleantech infrastructure
    as an underallocated asset class aligned with her liability profile: long-duration,
    inflation-linked returns from regulated or contracted revenue streams. She has asked
    her consultant for options. The response was three mega-funds with $250M LP minimums.
    None of them will take her $35M ticket.

    **Patrick** is in final close on a $600M Canadian cleantech infrastructure fund focused
    on battery storage, EV charging networks, and district energy systems in Ontario and
    Quebec. His target LP profile is pension funds between $200M and $2B in total assets—
    precisely the tier that the large managers ignore. His fund minimum is $25M. He has
    filled 80% of his LP roster through direct relationships and placement agents who cover
    the large-plan market. He has 15 LP slots remaining for smaller plans whose ticket size
    fits his fund model. He has no efficient way to reach Anne.

    Anne queries the platform: alternative asset class (cleantech infrastructure), mandate
    size ($35M LP ticket), OSFI-compliant due diligence preference, Ontario/Quebec geographic
    exposure priority, fund size range ($400–800M). Patrick's fund surfaces as one of two
    matching profiles in Canada. The platform presents Patrick's OSFI Guideline B-7–aligned
    due diligence package. Anne's investment committee reviews it at their next meeting.
    Patrick presents in person four weeks later. Anne's $35M commitment is executed as
    part of Patrick's final close.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The smaller pension plan's alternative allocation deficit is not a governance failure—
    it is a discovery failure. The specialist managers who would serve these plans exist;
    the plans' mandate sizes are appropriate; the regulatory framework supports the transaction.
    What does not exist is the structured intermediary that operates below the large-consultant
    coverage threshold. DeeperPoint builds the mandate-matching platform that extends the
    reach of specialist managers to every pension fund whose investment policy they satisfy.

    *Characters are fictional. The bifurcation of Canadian pension alternative asset access
    between large and smaller plans is well-documented in pension industry research.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
