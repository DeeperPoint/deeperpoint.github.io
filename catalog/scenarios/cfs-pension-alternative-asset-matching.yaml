market_example:
  summary: A structured mandate-matching platform connecting smaller Canadian pension funds
    and public sector benefit plans—whose alternative asset allocations are too small for
    direct coverage by the largest fund managers—with specialized private equity, infrastructure,
    and private credit managers whose fund sizes and GP relationships align with sub-$500M
    institutional mandates.
  problem: "Canada's pension landscape is bifurcated. The large funds—CPPIB, OTPP, OMERS, CDPQ—
    have the scale to access any alternative asset manager in the world, build direct co-investment
    programs, and negotiate separately managed accounts with GPs. Below that tier sits several
    hundred Canadian pension funds, public sector benefit plans, union pension trusts, and
    municipal defined-benefit plans whose total assets range from $100M to $5B and whose
    alternative asset allocations represent $10M to $500M mandates. These funds need the same
    portfolio diversification—private equity, infrastructure, private credit, real assets—
    that their larger peers access, but the fund managers who serve the large plans have
    minimum mandate sizes, fund minimums, and LP governance requirements that exclude the
    smaller plans. Simultaneously, a significant number of specialist alternative managers—
    niche infrastructure funds, regional private equity firms, specialized private credit
    managers in sectors like healthcare, senior housing, or cleantech—actively want access
    to smaller pension plan capital but have no efficient mechanism to reach plan investment
    committees. The pension consultant community serves as the traditional intermediary,
    but consultants cover the established large-manager universe well; their coverage of
    emerging and specialist managers is sparse. The smaller plan's investment committee
    never sees the specialist infrastructure manager whose mandate policy aligns with the
    plan's liability profile, simply because neither party has a discovery mechanism that
    operates below the large-pension-consultant coverage threshold."
  dominant_forces:
    - "Smaller Canadian pension funds require alternative asset exposure for liability matching
      and return adequacy, but minimum fund sizes and separately managed account thresholds
      at major managers systematically exclude mandates below $50–100M."
    - "Specialist alternative managers with niche infrastructure, healthcare real estate, or
      cleantech private equity funds have LP target profiles that align with smaller pension
      mandates but cannot efficiently reach investment committees without existing consultant
      relationship coverage."
    - "OSFI Guideline B-7 and provincial pension legislation impose governance documentation
      requirements on alternative asset manager selection that smaller plans cannot satisfy
      without structured due diligence processes—creating an additional compliance barrier
      to emerging manager access."
  deeperpoint_fit: "KnowledgeSlot encodes the alternative asset mandate framework: OSFI
    Guideline B-7 due diligence requirements, fund structure types (closed-end, open-end,
    separately managed account), LP governance documentation standards, and performance
    benchmark structures by asset class. CoSolvent matches pension plan investment policy
    statements—alternative allocation size, target return, risk budget, LP liquidity needs,
    ESG investment policy—against manager profiles built from fund size, target LP profile,
    track record, and current fundraising status."
  economic_upside: "Canada's smaller pension funds manage an estimated $500B in aggregate assets,
    with alternative allocation targets of 15–25% suggesting $75–125B in allocatable capital
    systematically underserved by specialist managers. A platform matching even 5% of this
    flow represents $3.75–6.25B in mandate placement annually. Revenue via annual subscription
    for managers and per-mandate introduction fees."
