market_example:
  summary: "Hundreds of thousands of Canadians own property in their home countries — inherited or purchased — but cannot manage renovations or monitor tenants from 10,000 km away. Flying over costs $10,000–$15,000 in time and travel. Trusting a cousin costs differently. The market matches diaspora property owners to vetted local contractors and property managers, with AI-verified milestone photos and escrow-backed payments replacing the plane ticket."
  problem: "An Ethiopian-Canadian nurse practitioner in Toronto owns a house in Addis Ababa that needs electrical upgrades, bathroom retiling, and kitchen plumbing repairs. She estimates the work at $10,000 CAD equivalent. Flying to Addis to supervise costs more than the renovation itself — $1,600 in flights, two weeks of vacation, $8,000 in lost income, and five days of jet lag recovery. Her cousin Dawit is willing to help but cannot evaluate whether PVC conduit was installed before the walls were plastered. She can wire money and hope for the best, or let the property deteriorate. Neither option is acceptable for a professional with real assets to protect. This is the defining diaspora thin market: the seller is right there, the buyer is 10,000 km away, and no trust infrastructure can bridge the gap. The same problem applies to supervising a care nurse attending an elderly parent, verifying a vehicle manager's maintenance receipts, or auditing a local attorney's work on a property dispute — all are versions of the same trust problem in different verticals."
  dominant_forces:
    - "Travel cost barrier — the biological tax of intercontinental travel (jet lag, altitude, time zone recovery) makes supervision trips economically irrational for projects under $30,000 in value"
    - "Information asymmetry — diaspora owners lack current knowledge of local building codes, material prices, contractor market rates, and legal requirements; local contractors cannot interpret diaspora clients' quality expectations"
    - "Trust deficit — verbal commitments and WhatsApp photos are insufficient verification for escrow release; the lack of verifiable oversight creates systematic contractor moral hazard"
    - "Currency complexity — official and parallel exchange rates, escrow regulations, and digital payment availability vary by country; a single unresolved payment dispute can consume the project's entire margin"
    - "Community network opacity — diaspora networks share contractor referrals by word of mouth; there is no verified directory of contractors with documented diaspora-grade work quality"
  deeperpoint_fit: "MarketForge matches diaspora property owners to vetted local contractors through a competence-verified profile system — not a directory listing, but a structured capability match against the specific project scope. The platform wraps the engagement in a transparency layer: geotagged milestone photos reviewed by an AI-powered inspection model, Knowledge Slot loaded with local building codes and material prices, and escrow-backed milestone payments released upon AI-verified completion. The diaspora owner monitors the project from their Canadian city on the same interface they use for everything else."
  economic_upside: "The Ethiopian diaspora alone remits $5–6 billion per year to Ethiopia; a significant portion is for property maintenance, renovation, and management that currently flows through informal channels with high leakage. Across Canada's diaspora communities (300,000+ Ethiopians, 500,000+ Filipinos with property ties, hundreds of thousands of South Asian and West African Canadians with homeland assets), the addressable market for verified remote property oversight is in the hundreds of millions of dollars annually. Diaspora business associations — Ethiopian Diaspora Business Association, Philippine Chamber of Commerce Canada — are natural sponsors with a direct member service value proposition."

