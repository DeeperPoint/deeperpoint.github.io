market_example:
  summary: "Technology companies, universities commercializing research, and parties to IP-intensive acquisitions need IP valuators with sector-specific royalty rate database access and litigation support qualification — a combination that most IP consulting firms describe generically while delivering only partial expertise."
  problem: "Intellectual property valuation for licensing negotiation, acquisition due diligence, or litigation damages requires three simultaneous competencies that are rarely co-located in a single practitioner: access to defensible comparable royalty rate databases for the specific technology category, methodology qualification under the selected damages model (income, market, or cost approach), and expert witness qualifiability if the valuation will be challenged in court or before a tribunal. A university technology transfer office negotiating a pharmaceutical compound licensing term needs a valuator with biotechnology royalty rate database access. A software company defending an infringement claim needs a valuator whose damages methodology has survived Daubert challenge in the relevant jurisdiction. A manufacturer in an M&A transaction needs a valuator who can opine on the fair value of trade secret assets under ASC 805 or IFRS 3. Each of these requirements narrows the eligible practitioner population substantially — and the standard 'IP valuation' servicemark describes all of them and none of them precisely."
  dominant_forces:
    - "Participant scarcity — IP valuators with technology-category-specific royalty rate database access and methodology qualifications simultaneously are a small population in Canada"
    - "Offering complexity — the right match requires alignment on technology category, valuation purpose (licensing vs. M&A vs. litigation), damages model, expert witness qualifiability, and litigation jurisdiction"
    - "Data access asymmetry — proprietary royalty rate databases (ktMINE, RoyaltySource, Duff & Phelps) are expensive; not all practitioners have current access in every technology category"
    - "Trust and defensibility requirement — the valuation will be challenged; the parties need a practitioner whose methodology and database sourcing will survive cross-examination from an opposing expert"
    - "Timeline pressure — M&A due diligence and litigation expert report deadlines are non-negotiable; a wrong match discovered after thirty days of engagement is a sunk-cost crisis"
  deeperpoint_fit: "Semantic matching encodes valuator profiles (technology category specialization, royalty rate database subscriptions by provider and technology domain, valuation methodology certifications — CBV, CPA, ASA — litigation damages model experience, expert witness qualification history by court and tribunal, M&A transaction types) against demand signals (technology category, valuation purpose, damages model, jurisdiction, expert witness requirement, timeline)."
  economic_upside: "IP-intensive acquisitions in Canada — software, biotech, pharma, medical device, cleantech — frequently involve IP-related consideration of $10M–$500M. A valuation that is successfully challenged in court or rejected in an audit reduces the transaction value by the disputed amount. Licensing royalty rate errors persist over multi-year agreement terms: a 1% royalty rate error on a $50M annual revenue licensee is $500,000 per year over a ten-year agreement. The IP valuation fee ($25,000–$200,000) is a rounding error relative to the value at stake — creating high willingness to pay for a specialist match service that reduces methodology challenge risk."

