market_example:
  summary: Canadian secondary schools and community colleges want practicing professionals
    to supplement STEM instruction with real-world context — engineers, chemists,
    software developers, biologists. The immigrant professional community in Canada's
    cities contains extraordinary depth across every STEM domain, in people who are
    between professional engagements, in underemployed roles, or actively seeking
    ways to contribute. A matching platform resolves the discovery problem.
  problem: Secondary school and community college STEM programs are chronically underpowered
    in real-world application and industry context. Teachers are curriculum experts
    but not practicing engineers or scientists; students graduate with academic knowledge
    but limited understanding of how STEM fields actually work in industry. Schools
    and colleges want practicing professionals to contribute as guest instructors,
    mentors, and project sponsors — but their outreach is limited to whoever the teacher
    or guidance counsellor personally knows. Meanwhile, Canada's immigrant professional
    community — engineers from India, chemists from Ukraine, biomedical researchers
    from Brazil, geotechnical specialists from Iran — includes thousands of practitioners
    whose professional networks and job searches have not yet connected to the industries
    that would employ them. They are available, motivated to contribute, and undiscoverable.
  dominant_forces:
  - Discovery failure — Schools cannot find guest instructors with specific domain
    expertise through any systematic channel; immigrant professionals cannot signal
    their availability to educational institutions
  - Cultural and credential gap — Immigrant professionals are uncertain whether their
    industry experience is legible to Canadian educators; educators are uncertain
    how to evaluate non-Canadian credentials
  - Institutional inertia — Schools rely on personal referral networks for industry
    contacts; immigrant professionals who are new to Canada are not in those networks
  - Time mismatch — Guest instruction works best as a recurring, structured commitment
    rather than a one-time visit; schools need reliability that ad hoc referrals cannot
    guarantee
  - Diversity gap — Industry contacts via personal teacher networks systematically
    underrepresent the demographic diversity that would benefit students seeing themselves
    reflected in STEM practitioners
  deeperpoint_fit: CoSolvent builds practitioner profiles from professional background,
    domain specialization, industry sector, communication style and language capacity,
    and availability (one session, monthly series, semester commitment). School and
    college profiles capture course and grade level, specific STEM topic gaps where
    industry context is most needed, and instructor preferences (presentation, project
    mentorship, panel participation, lab demonstration). KnowledgeSlot carries school
    board volunteer engagement protocols, Vulnerable Sector Check process guidance,
    liability framework templates for guest instructors, and domain-specific topic
    menus by curriculum unit that help schools request exactly what they need and
    practitioners prepare exactly what fits.
  economic_upside: 'Canadian school boards and colleges spend $20–40M annually on
    industry engagement programs (workplace visits, guest speaker series, co-op coordination)
    that produce inconsistent results due to network limitations. A platform that
    systematizes industry-professional matching for guest instruction could serve
    5,000+ schools and colleges nationally, delivering 50,000+ guest instruction sessions
    per year. Platform revenue: matching fee per confirmed engagement ($50–$150 per
    session), institutional subscription for unlimited match access ($500–$2,000/year),
    corporate STEM engagement package (employer-sponsored practitioner availability
    for specific school sectors).'
sponsor_opportunities:
- title: STEM Guest Instructor Matching SaaS
  type: saas
  revenue_model: Per-confirmed-match fee ($50–$150/session). Annual subscription for
    schools and colleges with recurring engagement programs ($500–$2,000/year). Premium
    subscription includes reporting dashboard for grant-funded STEM engagement programs.
  strategic_logic: Schools with active industry engagement programs manage their contacts
    manually through spreadsheets and Rolodexes. A platform that gives them on-demand
    access to a pre-screened, self-described pool of immigrant professionals — with
    VSC guidance and engagement templates included — is a clear operational improvement.
  recurring: true
- title: Corporate STEM Pipeline Sponsorship
  type: managed-service
  revenue_model: Annual corporate sponsor package ($15,000–$60,000). Employer sponsors
    a pool of their immigrant-professional employees as guest instructors in targeted
    school sectors aligned to their hiring pipeline. Platform manages scheduling,
    preparation, and outcome reporting.
  strategic_logic: 'Large Canadian employers with diverse workforces — engineering
    firms, tech companies, pharmaceutical manufacturers — want to invest in STEM pipeline
    development in communities where they recruit. Sponsoring their own employees
    as guest instructors is a dual benefit: community investment and professional
    development for the employee.'
  recurring: true
- title: Student-Professional Mentorship Network
  type: saas
  revenue_model: Per-matched-pair monthly fee ($15–$30/month, paid by school or sponsor).
    Structured semester-long mentorship pairings between immigrant STEM professionals
    and secondary students interested in related fields.
  strategic_logic: One guest lecture changes a student's perception. A semester of
    monthly conversations with an immigrant professional in a STEM field changes their
    trajectory — and gives the professional a relationship with Canadian educational
    culture that helps their own integration.
  recurring: true
- title: Credential Bridging Commerce
  type: commerce-extension
  revenue_model: Referral fee from provincial professional engineering and science
    associations for platform-verified practitioners pursuing Canadian certification
    ($200–$400 per successful referral). Guest instruction performance records serve
    as professional development documentation in recognition applications.
  strategic_logic: Immigrant professionals who build a documented guest instruction
    record on the platform have demonstrated communication competence, curriculum
    alignment capability, and Canadian institutional engagement — all of which count
    in professional recognition applications. The platform creates a virtuous cycle
    between teaching and certification.
  recurring: false
story:
  title: The Equation She Actually Needed
  status: draft
  blog_slug: ''
  characters:
  - Kavitha Rajan - civil/structural engineer from Chennai, recently immigrated to
    Mississauga
  - Mr. David Park - Grade 12 physics teacher, Mississauga secondary school
  - Preet Sidhu - Grade 12 student, interested in structural engineering
  summary: Kavitha has been in Canada eight months, her P.Eng. recognition in process,
    working a contract role. She registers on the platform. David's Grade 12 physics
    unit on structural loading has never had a practiced structural engineer in the
    room. Preet, a second-generation Punjabi-Canadian who has never met a South Asian
    structural engineer, meets one who looks like her and knows what she wants to
    be.
  body: '## Act A - The Market Structure


    Secondary school physics is taught from textbooks. The textbooks are correct.
    The problems

    are well-posed. The gap is application: what does a structural loading calculation
    look like

    when the structure is a real building in a real city, with real soil conditions,
    real wind

    loads, and real liability? What does an engineer actually do with the free body
    diagram that

    the textbook shows in isolation?


    David Park has been teaching Grade 12 physics for fourteen years. He is an excellent
    teacher.

    He has never worked as an engineer. He does his best with the application examples
    in the

    textbook. He has invited two engineers to speak to his class in fourteen years
    — both through

    personal contacts, both male, both white, both from structural firms where he
    happened to know

    someone who knew someone.


    The class has never seen anyone who looks like Preet.


    ---


    ## Act B - The Story


    **Kavitha Rajan** has a master''s degree in structural engineering from IIT Madras
    and eight

    years of experience designing commercial and residential structures in Chennai.
    She is in

    Mississauga because her husband''s tech role transferred. Her P.Eng. recognition
    application

    is with Engineers Canada. She is doing a contract role reviewing shop drawings
    for a

    low-rise residential developer — underemployed by any measure.


    She registered on the platform to stay professionally active and to feel like
    she was

    contributing while her career transition ran. Her profile: structural engineering,
    seismic

    and wind load design, reinforced concrete and steel frame, Grade 11–12 and first-year

    university appropriate, Tamil and English, available for guest sessions, panel
    participation,

    and mentorship.


    **David Park** registered his unit on the platform: Grade 12 physics, chapter
    on static

    equilibrium and structural loading, needs a practicing structural engineer to
    provide

    real-world application context, one or two sessions preferred.


    The match is exact. Kavitha''s profile covers Grade 11–12 appropriate structural
    engineering

    content. David''s unit covers static equilibrium — Kavitha''s daily working tool.


    The Generative Match Story confirms: *Kavitha Rajan, P.Eng. candidate, structural
    engineering,

    8 years commercial/residential structural design, Chennai. Experienced: seismic
    and wind load

    analysis, reinforced concrete design to IS and transferring knowledge to NBCC
    context. Tamil

    and English. Available for one or two sessions on structural load analysis and
    real-world

    engineering problem-solving.*


    David invites her for two sessions. She declines a PowerPoint. She brings printed
    structural

    drawings — a three-storey mixed-use building she designed in Chennai.


    In the first session, she walks the class through the load path from roof to foundation.

    She uses the same notation from their textbook. The students see — for the first
    time — that

    the textbook notation refers to something real. Something that stands up in the
    world.


    **Preet Sidhu** is in the front row. After the session, she stays to ask about
    the IIT Madras

    master''s program, about structural versus civil, about what it means to stamp
    a drawing.

    Kavitha answers every question.


    After the second session, Preet asks the platform to connect her with Kavitha
    as a semester

    mentor. Kavitha agrees. They meet for forty-five minutes once a month for the
    rest of the

    school year.


    In May, Preet''s university application list includes structural engineering programs
    at

    Waterloo and McMaster. Kavitha writes her a reference letter that describes, specifically,

    the engineering intuition she demonstrated in their conversations.


    ---


    ## Act C - Why This Market Stays Broken Without Infrastructure


    Kavitha wanted to contribute. David needed what she had. Preet needed to see what
    she could

    become. The infrastructure to connect all three was a matching platform — something
    that took

    David''s curriculum need and Kavitha''s specific expertise and put them in the
    same room.


    David''s personal network does not include Tamil structural engineers from Chennai.

    That is not a criticism; it is a fact. Personal networks reflect the world we
    have already

    encountered. The platform reflects the world we are in.


    Canada is importing extraordinary professional depth. The question is whether
    we use it

    or leave it on the floor while we continue to tell students in our cities that
    the people

    who build the world they live in do not look like them.


    *Characters are fictional. The P.Eng. recognition process for internationally
    trained

    engineers, the IIT Madras engineering faculty, and the demographic makeup of Canada''s

    engineering profession are real. [DeeperPoint](../../marketforge.html) is building

    the infrastructure this story describes.*

    '
