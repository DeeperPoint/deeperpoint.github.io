market_example:
  summary: "Canadian manufacturers routinely operate at 60–80% capacity utilization. Billions of dollars of five-axis machining, EDM, and precision grinding capability sits idle every night — but no one advertises surplus capacity, and no one admits they cannot fill their own order. The market failure is active strategic concealment, not passive opacity."
  problem: "In Canadian manufacturing, admitting you have idle machines signals business distress — customers read it as revenue decline, banks read it as covenant risk, competitors read it as opportunity. Simultaneously, a manufacturer with a capability gap will never publicly announce they cannot fill their own order. Both sides are deliberately hiding. The result is that a five-axis machining center in Hamilton runs one shift while a robotics integrator in Kitchener books $400,000 of new machine capital for six weeks of work — because the confidential intermediary that would let them exchange capacity without disclosure does not exist. Unlike commodity spot markets, manufacturing capacity cannot be advertised openly without strategic cost. The platform must protect secrets, not merely reduce search friction."
  dominant_forces:
    - "Strategic concealment — both buyer and seller have strong reputational incentives to hide their surplus capacity and capability gaps"
    - "Temporal perishability — an idle shift tonight is gone tomorrow; unlike equipment, capacity cannot be warehoused"
    - "Opacity — no platform exists where capacity can be registered and matched confidentially"
    - "Trust deficit — executing a capacity exchange requires disclosure of production schedules, customer commitments, and quality systems"
    - "Deal complexity — capacity agreements require rate negotiation, quality protocols, IP protection, and reciprocity tracking"
  deeperpoint_fit: "CoSolvent's confidential matching layer is the core capability: participants register capacity and requirements independently, the AI engine matches without either side disclosing identity, and structured anonymous disclosure follows mutual opt-in. KnowledgeSlot holds industry rate benchmarks (by machine type, material, and region), non-disclosure template provisions, and quality protocol standards — so neither party negotiates blind. The Trusted Intermediary Protocol enables Priya to disclose surplus capacity to the platform without it being visible to competitors, customers, or lenders. The platform's institutional memory tracks reciprocity signals — building progressive alliances between complementary shops over time."
  economic_upside: "If Canadian manufacturers average 70% utilization and the manufacturing sector generates $750B in annual output, the idle 30% represents $320B of latent productive capacity annually. Even a fraction of this converted to billable capacity exchange would generate enormous economic value. A platform facilitating 5% of Ontario's idle five-axis capacity would intermediate $50–$100M in annual machining transactions at typical contract rates of $185–$280/machine hour."

