market_example:
  summary: "Matches urban law firms that have an excess of articling students with rural sole practitioners who desperately need junior help for complex trials, via 3-month strategic secondments."
  problem: "To become a lawyer in Canada, graduates must complete an 'articling' period. Massive corporate urban firms hire dozens of students, who often spend 10 months doing mindless document review, gaining zero trial experience. Conversely, rural and small-town law firms are drowning in actual, high-stakes trial work (criminal, family) but cannot afford the 10-month commitment or recruitment overhead to hire an articling student of their own."
  dominant_forces:
    - "Urban law firms use articling students as a blunt instrument for corporate due diligence."
    - "Small-town practitioners have an acute need for temporary junior capacity during major trials."
    - "Law Societies require students to gain diverse, practical legal experience."
  deeperpoint_fit: "CoSolvent aggregates the tactical needs of rural practitioners and matches them with urban firms seeking to provide 'community service' or trial secondments for their students. CommonContext ensures Law Society supervisory mandates and confidentiality silos are strictly maintained."
  economic_upside: "A powerful HR and capability arbitrage. Solves the junior capacity problem for rural lawyers while providing irreplaceable trial experience to urban students. Revenue via secondment placement fees."

