market_example:
  summary: "Municipal food strategies target neighbourhood food entrepreneurship in priority areas, but aspiring producers cannot find or afford commercial kitchen time, co-packing partners, or distribution channels — while nearby shared kitchens, institutional food services, and community food organizations sit underutilized between their own programming blocks."
  problem: "Canadian municipalities — Toronto, Vancouver, Edmonton, Hamilton — have adopted food strategies that explicitly target food entrepreneurship in underserved neighbourhoods as a tool for economic development and food access. In practice, the gap between policy aspiration and kitchen reality is enormous. A Somali-Canadian entrepreneur in Scarborough with a proven injera recipe and steady farmers' market demand cannot scale because she cannot find a commercially licensed kitchen with available hours at a price she can afford. A Jamaican-Canadian sauce maker in Jane-Finch has an Ontario retail licence but cannot find a co-packer willing to run batches under 500 units. A Filipino-Canadian baker in Regent Park makes pan de sal that sells out every Saturday morning but has no pathway to supply even the three cafés that have asked to carry it. Meanwhile, church kitchens with commercial licences sit dark five days a week. Community centre kitchens funded by municipal grants run programming three evenings and sit empty from 6am to 3pm. College culinary programs have commercial-grade facilities that are unused during breaks. The capacity exists. The entrepreneurs exist. The matching infrastructure does not."
  dominant_forces:
    - "Opacity — shared commercial kitchens, church kitchens with commercial licences, and college culinary facilities are invisible to food entrepreneurs who are not already embedded in the institutional networks that control access"
    - "Temporal fragmentation — available kitchen hours are scattered across facilities, days, and times in patterns that no single entrepreneur can discover or navigate without institutional knowledge"
    - "Trust deficit — facility operators need assurance that users have food handler certification, liability insurance, and product liability coverage; entrepreneurs need assurance that facilities meet their regulatory requirements"
    - "Scale mismatch — co-packers and distributors have minimum run sizes designed for established brands; micro-batch food producers fall below every threshold"
    - "Regulatory complexity — Health Unit requirements, municipal zoning for home-based food production, Ontario food premises regulations, and organic/halal/kosher certification requirements create a compliance maze that entrepreneurs navigate alone"
  deeperpoint_fit: "Semantic matching connects food entrepreneurs to available commercial kitchen capacity based on equipment requirements, certification needs, schedule compatibility, and geographic proximity. The verification pipeline validates food handler certification, municipal health unit compliance, facility licensing status, and insurance coverage for both operators and users. CommonContext curates Ontario food safety regulations, Health Unit requirements by municipality, home-based food production rules, co-packing minimum run thresholds, and available municipal food entrepreneurship grants. ClientSynth simulates neighbourhood food hub dynamics — testing whether sufficient producer density exists in priority neighbourhoods to sustain shared facility utilization — before committing resources to physical infrastructure."
  economic_upside: "Toronto's food economy generates over $30 billion annually, but neighbourhood food entrepreneurship in priority areas captures a tiny fraction. A matching platform that connects 200 micro-food entrepreneurs to available kitchen capacity in their first year — at average annual kitchen rental value of $8,000–$15,000 per entrepreneur — generates $1.6M–$3M in matched facility revenue while creating 200+ self-employment positions in communities where the economic multiplier effect is highest. Municipal food strategy programs (Toronto's FoodShare, Hamilton's Good Food Box, Vancouver's neighbourhood food networks) provide natural institutional sponsors with existing relationships to both facility operators and entrepreneurs."

