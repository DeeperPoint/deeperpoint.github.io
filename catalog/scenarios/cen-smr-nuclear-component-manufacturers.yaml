story:
  title: The N-Stamp Gap
  status: draft
  blog_slug: ""
  characters:
    - "Sylvie - VP Supply Chain, Canadian SMR developer, Ottawa"
    - "Howard - President, precision machining and pressure vessel manufacturer, Cambridge, Ontario"
  summary: "A Canadian SMR developer discovers that a Cambridge precision manufacturer has
    the material processing capability for a critical pressure boundary component but lacks
    N-stamp certification—and assembles a multi-developer qualification cost-sharing agreement
    through a nuclear supply chain registry platform."
  body: |
    ## Act A - The Market Structure

    Building a Small Modular Reactor requires manufacturing thousands of components to
    standards that almost no industrial supplier currently meets. The ASME nuclear codes—
    the N-stamp certification framework—require a quality assurance program that most
    industrial manufacturers have never needed. Getting certified takes 18–36 months and
    costs up to $2M in audit fees, program development, and equipment upgrades.

    No rational manufacturer will make that investment without a customer commitment.
    No SMR developer will make a customer commitment before the manufacturer demonstrates
    capability. The standard qualification deadlock—common to every new defense and nuclear
    supply chain development—is structurally worse in the SMR context because multiple
    developers are procuring simultaneously, each hoping that someone else will fund the
    qualification investment they all need.

    ---

    ## Act B - The Story

    **Sylvie** is building the procurement list for Canada's first SMR project. Her pressure
    boundary components—the vessels, nozzles, and flanges that form the nuclear island's
    primary pressure boundary—need manufacturers with ASME NP- or N-stamp certification
    and CNSC-aligned quality programs. She has sent capability surveys to 40 Canadian
    manufacturers. Three have active N-stamp programs. One of those is currently fully
    committed to CANDU fuel channel work for two years. She is looking at 90% offshore
    sourcing for components that Canadian manufacturers could theoretically produce.

    **Howard** runs a 180-person precision machining and pressure vessel fabrication shop
    in Cambridge that holds ASME U-stamp and PED certification. His team produced reactor
    feed water heaters for conventional thermal plants for twelve years. The material
    processing capability for Sylvie's pressure boundary castings exists on his floor.
    What he lacks is the nuclear quality assurance program and ASME N-stamp—the 18-month
    process he hasn't started because he's never had a nuclear customer approach him.

    Sylvie queries the platform for pressure boundary fabrication capability: material
    specification (low-alloy carbon steel, SA-508), pressure class, weld qualification
    requirements, dimensional tolerancing. Howard's facility surfaces with a matching
    material processing capability profile and a qualification gap assessment showing
    the 18-month N-stamp pathway from his current U-stamp base. Two other SMR developers
    also see Howard's profile. The platform structures a three-developer qualification
    cost-sharing agreement: each contributes $400,000 toward Howard's N-stamp qualification
    in exchange for preferred supplier pricing commitments on their respective programs.
    Howard begins the qualification process with funding in hand and three customers waiting.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Canada has the manufacturing capability to supply its own SMR program. What it lacks is
    the supply chain visibility infrastructure to connect developers with manufacturers before
    the procurement calendar forces offshore defaults. DeeperPoint builds the qualification
    registry that turns Canadian manufacturing potential into Canadian nuclear supply chain reality.

    *Characters are fictional. The SMR supply chain qualification gap is documented in the
    federal SMR Action Plan. [DeeperPoint](../../marketforge.html) is building the infrastructure
    this story describes.*
