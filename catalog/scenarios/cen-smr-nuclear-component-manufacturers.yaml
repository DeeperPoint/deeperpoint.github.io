market_example:
  summary: A qualification and matching platform connecting Canadian Small Modular Reactor
    developers with precision manufacturers capable of meeting nuclear-grade component
    specifications—ASME N-stamp, CNSC Quality Assurance Program, nuclear-grade material
    traceability—helping build the Canadian nuclear supply chain before first-of-kind SMR
    deployments begin.
  problem: "Canada has committed to Small Modular Reactor deployment as a cornerstone of its
    clean energy transition, with five SMR developer agreements signed with provinces and a
    federal regulatory framework that supports construction at multiple sites by the early 2030s.
    The gap between regulatory approval and actual construction is the supply chain. SMR
    components—reactor pressure vessels, steam generators, control rod drive mechanisms,
    primary coolant pumps, and hundreds of specialty valve and instrument assemblies—must
    be manufactured to nuclear-grade standards: ASME Nuclear Codes (N-stamp certification),
    CNSC Quality Assurance programs, nuclear-grade material certification with documented
    traceability back to heat number. Canada has a legacy nuclear manufacturing base from
    the CANDU era—some of it still active, some of it dormant or converted to other industrial
    uses. SMR developer procurement teams face a structural problem: they do not have a structured
    registry of Canadian manufacturers currently holding or capable of obtaining N-stamp
    certification for specific component categories. Individual manufacturers do not have
    a mechanism to signal readiness or capability to multiple SMR developers simultaneously.
    The qualification process—which involves facility audits, quality management system reviews,
    and ASME program certification—takes 18–36 months and costs $500,000–$2M per manufacturer.
    Coordinating this investment across multiple potential SMR developer customers, before any
    single developer has committed purchasing volumes, is a collective action problem that no
    individual company can solve."
  dominant_forces:
    - "SMR procurement timelines require supply chain qualification to begin 5–8 years before
      first deliveries—but no individual SMR developer has the volume certainty to justify
      funding a manufacturer's N-stamp qualification program alone."
    - "Canada's legacy CANDU manufacturing base has partial but dormant nuclear-grade manufacturing
      capability that could be reactivated for SMR components—but the current capability gap
      is unknown to SMR developers because no structured registry exists."
    - "Nuclear component manufacturing requires multi-year quality program investment before
      any production orders can be placed—creating a qualification investment that is only
      rational if multiple potential customers can be identified before the investment begins."
  deeperpoint_fit: "KnowledgeSlot encodes the ASME nuclear code requirements by component
    category (N-stamp, NP-stamp, NU-stamp), CNSC Quality Assurance program requirements,
    and the qualification timeline and cost model for each certification level. CoSolvent
    matches SMR developer component procurement lists—organized by component category, delivery
    timeline, and volume requirements—against Canadian manufacturer profiles built from
    current certification status, material processing capabilities, and quality program maturity.
    The platform also identifies manufacturers whose existing industrial certificates (ASME
    U-stamp, ISO 3834 welding) give them the shortest qualification path to nuclear grade."
  economic_upside: "Canadian SMR procurement is estimated at $5–15B over the next 15 years
    in domestic components alone. The federal SMR Action Plan targets 50% Canadian content.
    Each percentage point of Canadian content captured from an offshore-default supply chain
    represents $50–150M in domestic manufacturing revenue. The platform's value to government
    sponsors—NRCan, EDC, provincial economic development agencies—is direct and quantifiable."
