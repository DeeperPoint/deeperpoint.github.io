market_example:
  summary: "A small town approves a fire truck budget in Canadian dollars, then waits years for a vehicle whose price can follow the US dollar. Councils defer, and old trucks stay in service. Matching towns to builders, dealers and each other by specification, delivery date and price terms would shorten the wait and narrow the exposure."
  problem: "Fire apparatus is built to order by specialized manufacturers, and many units sold in Canada are built in the United States or priced with reference to the US dollar. The wait is long. A City of Toronto staff report in May 2024 gave the production lead time for pumpers as 18 to 36 months. In April 2025 Calgary's fire chief said the department had been told its first new engine would take four years. In December 2025 the International Association of Fire Fighters reported that Surrey, British Columbia faced a three-year wait for engines and at least four years for an aerial truck, against 12 to 18 months before the pandemic, and that Shawinigan, Quebec had bought used trucks to cover the gap. The price moves while the town waits. In May 2020 the council of Plympton-Wyoming, Ontario, which had approved up to $1,350,000 for two pumpers two months earlier, approved a contract of $1,603,500, an increase of 18.7 per cent that the fire chief's report attributed mainly to the US dollar exchange rate. The same association report says a Fort St. John, British Columbia truck ordered in 2022 rose from $1.2 million to more than $1.5 million before delivery. Joint purchasing has answered part of this. The Canoe Procurement Group of Canada holds firefighting apparatus contracts, valid to December 2029, that members can buy through without running their own tender. For transit buses in Ontario, the Metrolinx Transit Procurement Initiative runs joint procurements whose stated benefits include multi-year price protection, and its 12 and 18 metre bus contracts are with New Flyer and Nova Bus, which it describes as Canadian manufacturers. Research for this entry did not support the idea that a single small order is too small for a builder to schedule. What remains for a small municipality buying a fire truck is the gap between the day its council approves a figure and the day the truck is priced and delivered, and the lack of any view of earlier options: a build slot freed by a cancelled order, a dealer's stock unit, a used truck another department is retiring, or a neighbour ordering the same specification."
  dominant_forces:
    - "Macro & FX Exposure: the budget is approved in Canadian dollars and the vehicle is priced, in whole or in part, against the US dollar and input costs that move during a wait of two to four years"
    - "Temporal Distance: the town needs the truck when the old one ages out, the builder's next open slot is years later, and earlier slots or finished units appear and disappear without the town hearing of them"
    - "Decision-Process Opacity: the fire chief who talks to the dealer does not hold the money. Council approves a figure once a year, and a price that has moved must go back to a meeting the builder cannot see or hurry"
    - "Deferral: when a price exceeds the approved budget the easiest decision is to wait, and the Canadian Association of Fire Chiefs' 2024 census found more than 56 per cent of responding departments deferring equipment purchases"
  deeperpoint_fit: "The matching engine, Cosolvent, works from descriptions in ordinary words. A fire department would describe what it needs as a chief would say it: the type of truck, pump and tank size, the roads and hall it must fit, when the old unit must retire, and how firm its council approval is. A builder or dealer would describe open build slots, stock and demonstrator units, and the price terms attached to each. A department retiring a serviceable truck could describe that too. Document reading can turn a specification, a dealer's quotation or a council report into a profile. The trusted-intermediary pipeline keeps protected details, such as a town's approved budget or a dealer's price, hidden until both sides agree to reveal them. A match produces a Content Match Story, one account given to both parties while anonymous, and a Deal Brief, a non-binding summary that a chief can put in front of the treasurer, the purchasing officer and council. A domain wiki prepared with CommonContext would hold sourced material on lead times, cooperative contracts and how other councils have handled exchange-rate terms. ClientSynth would generate invented towns and dealers to test the matching. Combining two or more towns' orders into one run is aggregation, and protecting a budget against the exchange rate is risk insulation. Both are designed and not yet built. Purchases would still follow each municipality's procurement by-law or a cooperative contract."
  economic_upside: "The Canadian Association of Fire Chiefs' 2024 Great Canadian Fire Census, answered by 614 departments, found 46 per cent in need of a new fire truck, pumper or emergency vehicle, 60 per cent using pumpers more than 15 years old, and total fire department budgets of $6.25 billion, up from $5.89 billion in 2023 (as reported by the Ontario Association of Fire Chiefs, December 2024). The International Association of Fire Fighters reported in December 2025 that a typical engine in Winnipeg, which cost $300,000 to $500,000 in the mid-2010s, now costs over $1 million, and a ladder truck $2 million or more. In Plympton-Wyoming's 2020 purchase the exchange rate was linked to about $218,409 of the increase on two trucks (Petrolia Lambton Independent, 8 May 2020). On the transit side, the Metrolinx Transit Procurement Initiative reports $80 million saved and 3,253 buses purchased through joint procurement since 2006 (annual report, fiscal 2025-26), which shows what coordination has been worth where it exists."

sponsor_opportunities:
  - title: "Apparatus Availability Board"
    type: saas
    revenue_model: "A provincial fire chiefs' association, a municipal association or a cooperative purchasing group would pay an annual subscription so that its member departments can describe needs and see matched build slots, stock units and retiring trucks."
    strategic_logic: "Associations already hear, one phone call at a time, who is waiting and who has a truck to release. A sponsor that puts those descriptions in one place gives members a service they now get by chance."
    recurring: true

  - title: "Council Report Preparation"
    type: managed-service
    revenue_model: "A municipality would pay per purchase for a draft staff report built from the Deal Brief: the options found, the delivery dates, the price terms and the exchange-rate exposure of each, in the form its council expects."
    strategic_logic: "A small department has no purchasing staff, and the chief writes the report. A clear account of the exposure, prepared before the vote, is what lets a council approve a range or a contingency and avoid a second approval months later."
    recurring: false

  - title: "Dealer and Builder Listings"
    type: commerce-extension
    revenue_model: "Builders and dealers would pay a listing or success fee to have open slots, cancelled-order units and demonstrators matched to departments whose described needs they fit."
    strategic_logic: "A cancelled order is a cost to the builder until it is resold, and the buyer who needs that exact unit may be three provinces away. Being matched by specification is worth more to a dealer than an advertisement."
    recurring: true

  - title: "Used Apparatus Transfer Coordination"
    type: logistics-extension
    revenue_model: "The receiving municipality would pay a coordination fee per transfer covering the inspection record, the pump test, transport and registration between provinces. Any sale price would be settled between the two municipalities."
    strategic_logic: "At least one department facing a wait of several years has bought used trucks to bridge the gap, and each such transfer is arranged from scratch. A sponsor that standardizes the steps makes a serviceable truck reach the next hall sooner."
    recurring: false

story:
  title: "The Pumper With a Date on It"
  status: draft
  blog_slug: ""
  characters:
    - "Marguerite - fire chief of a volunteer department, Shelburne, Nova Scotia"
    - "Dev - sales manager at a fire apparatus dealer, Truro, Nova Scotia"
    - "Lucien - treasurer, Shelburne, Nova Scotia"
  summary: "A volunteer fire chief with a council-approved budget and a twenty-four-year-old pumper is matched with a dealer holding a build slot that another town gave up, at a price and date her council can vote on once."
  body: |
    ## Act A - The Market Structure

    A fire truck is built to order. A City of Toronto report in 2024 put the production lead time for a pumper at 18 to 36 months. Other Canadian cities have since reported waits of three and four years.

    The price is often tied to the US dollar. In 2020 the council of Plympton-Wyoming, Ontario approved $1.35 million for two pumpers and, two months later, a contract of $1,603,500. The chief's report pointed to the exchange rate.

    A council approves a capital budget once a year, in Canadian dollars. If the price moves, the purchase goes back to council. A small town that cannot absorb the change defers. The 2024 census of Canadian fire departments found more than half of those responding deferring equipment purchases, and 60 per cent running pumpers more than 15 years old.

    Earlier options exist. Orders are cancelled and slots open. Dealers hold stock units. Departments retire trucks with years left in them. None of this is posted anywhere a small-town chief would see it in time.

    The following is a fictional account of how a marketplace built on DeeperPoint's design could close this gap.

    ---

    ## Act B - The Story

    **Marguerite** is the chief of a volunteer department in Shelburne, Nova Scotia. Her first-due pumper is twenty-four years old. Council approved a replacement budget in the spring. The quotation she obtained then has expired, and the new one is higher and names a delivery date three years away.

    **Lucien**, the town treasurer, has told her what council will want to know: one number, one date, and how far the number can move.

    The provincial fire chiefs' association sponsors a marketplace for apparatus. Marguerite describes what she needs in her own words: a pumper with a four-person cab, a pump and tank sized for a town with hydrants in the core and none outside it, short enough for a hall built in 1978, needed before the old truck's next pump test. She marks the approved budget as protected.

    **Dev** manages sales for an apparatus dealer in Truro. A municipality in another province has withdrawn from an order after amalgamating two halls. The chassis is ordered and the build slot is eleven months out. Dev describes the unit, the date, and the terms: a price in Canadian dollars that is firm if the contract is signed within sixty days. He marks the price as protected.

    The marketplace matches the two descriptions. Marguerite and Dev receive the same **Content Match Story**, without names. It says that a department needing a short-wheelbase pumper within a year has a described need close to a unit already in a builder's schedule, and that the seller is offering a firm Canadian dollar price for a prompt signature. It lists the differences: the tank is larger than she asked for, and the overall length has to be checked against her hall door.

    Both agree to be introduced. The drawings show the truck fits her hall.

    The **Deal Brief** gives Lucien what he asked for: the price, the date, the sixty-day window, and the one remaining exposure, a pump option still quoted in US dollars. He attaches it to the staff report.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Nothing in this story changed the exchange rate or the builder's backlog. What changed was that a slot with a date and a firm price reached the one department whose need it fit, while the offer was still open.

    Two parts of the gap stayed open. The marketplace did not combine Shelburne's order with another town's, and it did not protect the budget against the dollar. It made the terms visible early enough for a council to decide. That is the role of [thin-market infrastructure](../market-physics.html) in a market where timing, not supply, is what fails.

    *Marguerite, Lucien, Dev, the dealer and the cancelled order are fictional. The lead times, the Plympton-Wyoming purchase and the census findings are real. Combining orders and insulating a budget against the exchange rate are designed and not yet built. [DeeperPoint](../marketforge.html) is building the infrastructure this story describes.*
