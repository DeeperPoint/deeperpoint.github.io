tags: [trade, export, mining, critical-minerals, geopolitics, battery-metals]
market_example:
  summary: A private, trust-enforced marketplace matching Canadian junior miners and processors
    of lithium, cobalt, nickel, and rare earths with vetted international buyers from allied
    nations, securing battery and high-tech supply chains while bypassing opaque commodity
    broker intermediaries.
  problem: "The geopolitical scramble for critical minerals has transformed what was once a
    quiet corner of the mining sector into a high-stakes, strategically important trade arena.
    Canada sits on vast deposits of lithium, cobalt, nickel, graphite, and rare earths—materials
    that are the non-negotiable inputs for electric vehicles, defence electronics, and clean
    energy infrastructure. Allied nations (the US, EU, Japan, South Korea, Australia) are
    desperately seeking to reduce dependence on adversarial sources and have specifically
    identified Canadian supply as a strategic priority. The market failure is one of trust
    and qualification: junior Canadian miners rarely have the international commercial
    relationships or the compliance infrastructure to meet the rigorous provenance, ESG
    verification, and supply security documentation requirements of automotive OEMs and
    defence prime contractors. And those buyers, despite the political urgency, have no
    dependable mechanism for finding and qualifying junior Canadian producers who can
    actually deliver. Existing commodity broker networks are opaque and supply-chain
    agnostic—they do not distinguish between conflict-free, traceable Canadian nickel and
    alternative sources, which is precisely the distinction that allied-nation buyers now
    need to make."
  dominant_forces:
    - Allied nations (US, EU, Japan) have identified Canadian critical minerals as a strategic
      supply-chain priority and are actively funding pathways to secure them, but lack
      structured access to junior producers.
    - Junior Canadian miners have the geological assets but not the international commercial
      relationships or compliance infrastructure to access premium allied-nation procurement.
    - Rigorous provenance, ESG tracing, and supply-security documentation are now non-negotiable
      requirements for battery-grade material buyers—criteria existing commodity brokers cannot verify.
    - The Inflation Reduction Act and EU Critical Raw Materials Act are creating premium-price
      corridors for traceable, allied-source material, incentivizing the market to solve the
      qualification problem.
  deeperpoint_fit: "CommonContext manages the highly sensitive qualification data on both sides:
    buyer allied-nation status and security clearance requirements, seller's geological reserve
    verification, ESG audit status, and processing-grade assay data. CoSolvent enforces the
    matching logic that prevents mismatched introductions—a buyer requiring battery-grade lithium
    carbonate equivalent is never matched with a producer whose current output is spodumene
    concentrate without explicit flag. The platform structures off-take negotiation through
    sovereign-grade data rooms, with immutable provenance records for downstream compliance."
  economic_upside: "A single multi-year off-take agreement for battery-grade cobalt or lithium
    can be worth hundreds of millions of dollars. The platform captures margin at two points: the
    introduction and qualification event (replacing an opaque broker margin) and the ongoing
    compliance-data subscription (provenance records required annually by downstream manufacturers).
    The geopolitical urgency of the moment makes this one of the highest-stakes thin-market
    opportunities in the Canadian export landscape."
