story:
  title: The Battery-Grade Cobalt
  status: draft
  blog_slug: ''
  characters:
    - Kenji - Strategic Procurement Director, Japanese EV battery manufacturer
    - Sylvia - President, junior cobalt developer near Cobalt, Ontario
  summary: A Japanese battery OEM secures a politically critical, traceable Canadian cobalt
    off-take through a structured marketplace purpose-built for allied-nation critical mineral supply chains.
  body: "## Act A \u2014 The Market Structure\n\nThe critical minerals market sits at the brutal
    intersection of geology, geopolitics, and industrial procurement. Battery manufacturers
    desperately need traceable, ESG-verified, allied-source cobalt, but the market's intermediary
    layer—traditional commodity brokers—was not built for provenance verification, political
    classification, or the specific compliance documentation that EV supply chains now require.
    The result is a dangerous stalemate: allied nations want Canadian supply, Canadian producers
    want allied-nation customers, and a structurally inadequate market fails to connect them.\n\n
    ---\n\n## Act B \u2014 The Story\n\n**Kenji** is under board-level pressure. His company\u2019s
    largest cobalt supplier is in a jurisdiction that now triggers EU forced-labour compliance
    flags, and their Korean competitors have already announced Canadian supply agreements. He needs
    a battery-grade cobalt source that is verifiably conflict-free, ESG-audited, and within allied-nation
    jurisdiction\u2014and he needed it yesterday. The two brokers his team has used for years are
    offering him leads that cannot produce the geological reserve documentation or ESG audit history
    his legal team requires.\n\n**Sylvia** runs a development-stage cobalt project with a published
    NI 43-101 reserve estimate, a completed independent ESG audit, and metallurgical test work
    confirming battery-grade hydroxide production capability. She has been trying to get in front
    of an Asian battery OEM for two years. She has attended one mining conference in Japan at
    significant cost and produced zero qualified leads.\n\nKenji\u2019s government affairs team
    directs him to the platform through the Canadian High Commission in Tokyo. He inputs his
    requirements: battery-grade equivalent, minimum proven reserve, ESG third-party audit, allied-nation
    jurisdiction. Sylvia\u2019s project profile—with linked NI 43-101 summary, ESG audit report, and
    metallurgical results—surfaces as a top match. The platform structures a secure data room. Kenji\u2019s
    technical team conducts a virtual due diligence session. They agree on a memorandum of understanding
    for a 1,500-tonne annual off-take, contingent on construction financing. The platform\u2019s
    provenance data architecture will track every lot from mine to battery cell.\n\n---\n\n## Act C \u2014
    Why This Market Stays Broken Without Infrastructure\n\nThe political will to secure Canadian critical
    mineral supply is real. The financing is increasingly available. What is missing is the trusted
    matching and qualification infrastructure that gets the right buyer in front of the right producer
    with the right verified data. Commodity brokers are not built for provenance. Government trade
    missions are infrequent and untargeted. DeeperPoint provides the sovereign-grade marketplace
    this strategically critical sector demands.\n\n*Characters are fictional. The critical minerals
    supply-chain realignment is real and urgent. DeeperPoint is building the infrastructure this
    story describes.*\n"
