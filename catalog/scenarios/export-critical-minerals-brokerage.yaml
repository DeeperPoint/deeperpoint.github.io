market_example:
  summary: A private marketplace for matching Canadian junior miners and processers
    of critical minerals with vetted international buyers from allied nations, securing
    battery and high-tech supply chains.
  problem: Connecting Canadian Critical Mineral Producers with Allied Supply Chains
  dominant_forces:
  - Heightened geopolitical focus on securing non-adversarial supply chains for battery
    metals.
  - Junior miners struggle to navigate complex international procurement requirements.
  - Significant regulatory compliance required for critical minerals tracing.
  deeperpoint_fit: Requires rigorous qualification of both buyers (allied status/credit)
    and sellers (ESG/quality). Transactions are high-stakes but infrequent, suitable
    for non-continuous trading. Trust and verifiable provenance are the primary barriers
    to transaction.
  economic_upside: Enables multi-million dollar long-term off-take agreements. Captures
    higher margins by bypassing traditional opaque commodity broker networks. Accelerates
    mine development capital through visible forward demand.
