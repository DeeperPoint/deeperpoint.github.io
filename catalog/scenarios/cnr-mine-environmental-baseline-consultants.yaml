market_example:
  summary: A specialist matching platform connecting new and expanding mining operations with
    environmental baseline consultants who have site-specific expertise in the water quality,
    hydrology, wildlife, and traditional land use surveys required before provincial and federal
    environmental assessment triggers are met—matching on watershed, ecozone, and Indigenous
    engagement methodology.
  problem: "Environmental baseline studies are the regulatory foundation for any mining project
    advancing toward production or mine expansion. Before a project crosses the threshold
    requiring a provincial or federal environmental assessment—or before it can apply for
    a water licence, a wildlife disturbance permit, or an Environmental Effects Monitoring
    (EEM) program under the Metal and Diamond Mining Effluent Regulations—the proponent must
    demonstrate baseline conditions: what does water quality look like before mine discharge
    begins? What wildlife species use the area? What traditional land and water uses do
    nearby First Nations depend on? These studies must be conducted by consultants with
    specific expertise in the relevant ecozone (boreal, Shield, sub-Arctic, cordilleran),
    watershed hydrology, target species ecology, and—critically—the Indigenous engagement
    protocols and relationship history relevant to the specific First Nation whose territory
    the project sits in. The market failure is a double mismatch: consultants with the
    specific regional ecosystem expertise are few in number, and their relationships with
    the relevant First Nations communities are the product of years of previous work—they
    cannot be substituted by any credentialed environmental firm. A mining company attempting
    to source environmental baseline consultants for a northwest Ontario project may receive
    proposals from eight firms, only two of which have the watershed-specific hydrology
    expertise required, and only one of which has an existing working relationship with the
    First Nation whose territory the project sits in."
  dominant_forces:
    - "Environmental baseline studies require ecosystem-specific expertise (watershed hydrology,
      ecozone ecology, target species methods) that cannot be provided by generalist environmental
      consultants—and the pool of specialists with the specific regional expertise for remote
      Canadian mining districts is thin."
    - "Indigenous engagement for environmental baseline work requires pre-existing community
      relationships and culturally appropriate methods that cannot be established on a project
      timeline—only consultants with prior engagement history with the relevant First Nation
      are credible interlocutors."
    - "Regulatory timelines for EA and permitting are extremely sensitive to baseline study
      quality; inadequate baseline documentation is the single most common cause of EA
      delays and project licence reversals at the review stage."
  deeperpoint_fit: "CommonContext encodes the provincial and federal baseline study requirements
    by project stage and assessment trigger: Ontario Mining Act thresholds, the federal Impact
    Assessment Act triggers, MMER EEM requirements, and the Crown's duty to consult obligations
    for each stage of project development. CoSolvent matches a mining project's location,
    ecozone, Indigenous territory context, and regulatory pathway against consultant profiles
    organized by watershed expertise, ecozone certification, target species competency, and
    documented First Nations engagement history."
  economic_upside: "Environmental baseline study packages for a mid-tier mine development cost
    $200,000–$2M and must be completed before the project can advance to EA. The matching market
    across Canada's active mining districts includes hundreds of active projects annually.
    Platform revenue via subscription for mining companies and per-project matching fees, plus
    government interest in funding the platform as Indigenous engagement quality infrastructure."
