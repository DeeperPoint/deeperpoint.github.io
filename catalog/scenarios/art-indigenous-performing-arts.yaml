market_example:
  summary: "Festivals, schools, libraries, and institutional presenters seeking Indigenous performers, storytellers, and cultural knowledge keepers cannot find performers whose Nation-specific traditions, language capabilities, and presentation format match their audience and context, while Indigenous performing artists lack a discovery channel that respects cultural protocol."
  problem: "Demand for Indigenous performing arts programming has surged since the TRC's Calls to Action. Schools need Haudenosaunee storytellers for governance curriculum, not generic 'Indigenous performers.' Festivals seek Nation-specific cultural presentations. But talent agencies categorize performers as 'Indigenous' without encoding Nation, tradition, format, or age-appropriateness. A school board 45 minutes from Six Nations cannot find a Mohawk storyteller because no directory encodes the cultural specificity the curriculum requires. The result is either no booking or a culturally mismatched one."
  dominant_forces:
    - "Cultural protocol complexity — protocols vary by Nation, clan, ceremony, and season; a platform must encode these rather than ignore them"
    - "Nation-specific tradition scarcity — the pool of performers in any specific Nation's tradition who also do educational or public presentation is very small"
    - "Trust deficit — Indigenous performers have experienced exploitation and underpayment; any discovery platform must include Indigenous cultural authority governance"
    - "Presentation format mismatch — a performer who does adult festival main-stage may not do children's educational storytelling; format specificity is critical"
  deeperpoint_fit: "Semantic matching encodes performer profiles (Nation, language, tradition type, presentation formats with age-appropriateness, cultural protocols, geographic range, fee structure, Elder endorsement status) against presenter demand signals (event type, audience age, curriculum connection, Nation-specific requirements, budget, date). KnowledgeSlot curates Nation-specific cultural protocols."
  economic_upside: "Indigenous performing arts generate an estimated $50–100M annually across festivals, schools, corporate events, and institutional programming. A platform capturing 10% of the educational segment generates $2–5M in facilitated bookings and improves the cultural accuracy of Indigenous programming across Canadian institutions."

sponsor_opportunities:
  - title: "Indigenous Performer Discovery Platform (SaaS)"
    type: saas
    revenue_model: "Annual presenter subscription ($150–$400/year for school boards, libraries, festivals); per-booking facilitation ($50–$150). Performer profiles are free — no financial barrier to Indigenous participation."
    strategic_logic: "The Indigenous Performing Arts Alliance, provincial Indigenous education authorities, and Canada Council Indigenous arts programs provide organized communities on both sides. Platform governance must include Indigenous cultural authority representation."
    recurring: true
  - title: "Cultural Protocol Navigation Service"
    type: managed-service
    revenue_model: "Cultural protocol consultation ($200–$500 per event); curriculum alignment review ($150–$300); Elder protocol coordination ($200–$400 per event)"
    strategic_logic: "Schools are anxious about protocol errors. A managed service that guides presenters through appropriate protocols converts anxiety into respectful engagement."
    recurring: false
  - title: "Educational Resource Extension"
    type: commerce-extension
    revenue_model: "Curriculum-integrated resource packages ($50–$150 per package); teacher preparation guides ($30–$80); post-visit learning materials ($40–$100)"
    strategic_logic: "A performer visit is most effective with pre-visit prep and post-visit reinforcement. Nation-specific, curriculum-aligned materials convert a single performance into sustained learning."
    recurring: true
  - title: "Festival Programming Curation Service"
    type: managed-service
    revenue_model: "Indigenous programming curation for festivals ($500–$2,000 per festival); multi-performer coordination ($300–$800 per block)"
    strategic_logic: "Festivals seeking respectful Indigenous content need curation, not just booking. Assembling culturally coherent programming blocks converts ad hoc content into thoughtful cultural presentation."
    recurring: false

story:
  title: "The Storyteller from Six Nations"
  status: draft
  blog_slug: ""
  characters:
    - "Karen — curriculum coordinator, Waterloo Region District School Board"
    - "Tom — Mohawk storyteller, Six Nations of the Grand River; educational performer specializing in the Great Law of Peace for children ages 8–12"
  summary: "A school board curriculum coordinator searching for a Haudenosaunee storyteller finds only generic 'Indigenous performer' directories — until the platform surfaces a Mohawk storyteller 45 minutes away whose educational repertoire is precisely what the curriculum requires."
  body: |
    ## Act A — The Cultural Specificity Problem

    The TRC's Call to Action 63 asks every school to integrate Indigenous content into curriculum. A Grade 4 unit on the Haudenosaunee Confederacy needs a Haudenosaunee storyteller — not a generic Indigenous performer. A Plains Cree Elder cannot and should not teach the Great Law of Peace. But the school board's booking process categorizes performers as "Indigenous" without Nation, tradition, or format differentiation.

    ---

    ## Act B — The Story

    **Karen** had been trying to arrange Haudenosaunee storytelling visits for 28 elementary schools in Waterloo Region — within an hour of Six Nations of the Grand River. She contacted three talent agencies. All offered "Indigenous cultural presentations" without Nation specificity. She emailed Six Nations tourism with no response.

    **Tom** had been doing educational storytelling at Six Nations schools for fifteen years — the Creation Story and the Great Law of Peace, interactive and age-appropriate, with Mohawk language teaching. He had no agent, no website, and no listing in any directory a curriculum coordinator would search.

    His platform profile: Haudenosaunee — Mohawk Nation, Great Law of Peace content, children's educational storytelling ages 6–14, Mohawk language, $400 per school visit plus travel.

    The match was immediate. Karen booked him for all 28 schools. Teachers reported measurably higher assessment scores. Three schools invited him back. Two additional school boards contacted him within two months.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Tom's fifteen years of educational storytelling were perfect evidence of his capability. His location — 45 minutes from Kitchener — made logistics trivial. He was invisible because discovery infrastructure does not encode Nation, tradition, content, format, or age-appropriateness. [Thin market infrastructure](../../thin-markets.html) encodes the cultural specificity that defines appropriate matching — governed by Indigenous cultural authority.

    *Characters are fictional. TRC Call to Action 63, the Great Law of Peace, Six Nations of the Grand River, and the Waterloo Region District School Board are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
