market_example:
  summary: "A Persian cultural festival in Toronto, a Sikh arts organization in Vancouver, or a Cape Verdean music society in Montreal seeks a tradition-specific artist — with authentic credentials in the specific regional style and pedagogy — but their sourcing reaches only as far as their existing personal network, while the artist they need is invisible to them in a village in Alentejo or a city in Gujarat."
  problem: "Diaspora cultural organizations running arts programming — cultural festivals, teaching residencies, community workshops, intergenerational transmission programs — need artists who are not merely competent in a tradition but are genuine carriers of a specific regional variant of that tradition. A Persian classical music organization in Toronto presenting a radif reconstruction needs a vocalist schooled in the Dastgah Shur in the Isfahan school, not merely a classically trained Iranian vocalist. A Cape Verdean community organization in Montreal seeking a morna guitarist needs a player whose style descends from the São Vicente tradition, not merely a Lusophone musician with a guitar. These specificity requirements are not articulable in a job posting and are not legible to the general arts booking ecosystems (talent agencies, arts council grant processes) that diaspora organizations use for all other programming. The matching problem is symmetric: tradition-bearing artists in source communities rarely have diaspora organizational connections except through the specific individuals who happen to be in their personal networks."
  dominant_forces:
    - "Credential specificity — tradition authenticity requires demonstration of specific stylistic lineage, learning transmission, and regional practice that cannot be assessed from a biography or a YouTube video without tradition-insider knowledge"
    - "Cultural trust — diaspora communities vetting an artist for cultural programming need confidence that the artist's presentation will represent the tradition accurately to a community audience that contains both tradition-knowledgeable elders and younger members encountering the form for the first time"
    - "Geographic opacity — tradition-bearing artists in source communities are often in rural or semi-rural areas with minimal digital presence, invisible to diaspora communities searching in English-language digital spaces"
    - "Temporal mismatch — festival programming decisions are made 6–12 months in advance; artists in tradition communities make teaching and performance commitments informally and are often unavailable when programming decisions require confirmation"
    - "Language barrier — diaspora organizations whose administrative capacity is primarily in English or French cannot navigate source-community directories, social media groups, and cultural organizations that operate in the tradition language"
  deeperpoint_fit: "Semantic matching encodes artist profiles (tradition and regional variant, stylistic lineage and transmission history, pedagogy capability for diaspora context, language capacity, international engagement experience, diaspora community familiarity) against organization demand signals (tradition type and regional variant required, event type, audience profile and generation mix, language environment, budget, timeline). CoSolvent's trusted intermediary model enables cultural organization vetting of tradition authenticity through verified referees. CommonContext encodes tradition taxonomy and regional variant characterization."
  economic_upside: "The Canadian arts sector supporting cultural communities generates over $1B annually in grants, ticket revenues, and volunteer program value. Diaspora cultural organizations are among the fastest-growing arts organizations in Canada — federal multiculturalism funding, provincial arts council grants, and Heritage Canada programs all support tradition-specific cultural programming. A platform that improves artist matching quality for 500 diaspora arts organizations, each programming two to four tradition-specific residencies per year at average artist fees of $3,000–$8,000, represents $3M–$16M in annual artist engagement facilitated."

sponsor_opportunities:
  - title: "Diaspora Cultural Arts Matching Platform (SaaS)"
    type: saas
    revenue_model: "Annual cultural organization subscription ($300–$800/year); artist profile listing ($60–$150/year); per-engagement facilitation (3–5% of artist fee)"
    strategic_logic: "Heritage Canada's multiculturalism programming branch, provincial arts councils with diaspora community programming mandates (Ontario Arts Council, Canada Council Community Arts), and national cultural umbrella organizations (Canadian Ethnocultural Council) all fund diaspora cultural programming. A platform integrated with arts council grant application processes — appearing as a resource in Heritage Canada's program documentation — reaches the organized diaspora cultural organization community through the funding channels they already navigate."
    recurring: true

  - title: "Artist Tradition Credential Verification Service"
    type: managed-service
    revenue_model: "Per-artist tradition credential verification through tradition-specific referee networks ($150–$350 per artist); cultural organization tradition vetting consultation ($200–$400 per engagement)"
    strategic_logic: "The trust barrier in diaspora cultural programming is not about the artist's general competence — it is about tradition authenticity that the cultural organization's committee elders will evaluate. A credential verification service that solicits structured referee assessments from tradition-insider validators — teachers, tradition organisation officers, prior engagements — converts an informal trust mechanism into a documented verification that the organization's programming committee can present to its community."
    recurring: false

  - title: "Grant Application Writing and Documentation Support"
    type: managed-service
    revenue_model: "Heritage Canada and arts council grant application writing support for diaspora cultural programming ($400–$900 per application); artist engagement documentation for grant reporting ($150–$300 per engagement)"
    strategic_logic: "The most resource-constrained diaspora cultural organizations are run by volunteer committees whose members have deep cultural knowledge but limited grant-writing capacity. A grant application support service that helps them articulate the tradition-specific value of a platform-matched artist engagement for Heritage Canada and provincial arts council applications converts the platform's matching function into a complete funding and programming service."
    recurring: false

  - title: "Cultural Tourism and Heritage Experience Extension"
    type: commerce-extension
    revenue_model: "Cultural heritage tourism experience facilitation (tradition community immersion programs, source-community visit coordination; 8–12% coordination margin); diaspora community cultural heritage package curation; intercultural arts exchange documentation and promotion; platform earns cultural commerce revenue from every tradition connection it establishes"
    strategic_logic: "The relationship between a diaspora cultural organization and a tradition-bearing artist frequently generates interest in source-community immersion — members of the diaspora organization wanting to visit the tradition community, study directly in the source region, or participate in tradition community festivals. A cultural heritage experience facilitation service that coordinates these visits converts the one-time artist residency into a multi-year cultural tourism relationship with each tradition community."
    recurring: true

story:
  title: "The Morna in Montreal"
  status: draft
  blog_slug: ""
  characters:
    - "Dina — president, Associação Cultural Cabo-Verdiana de Montreal; planning a centenary celebration of morna with an authentic São Vicente style artist"
    - "Arlindo — guitarrista and vocalist, morna tradition, São Vicente, Cape Verde; direct student of a generation that learned from contemporaries of Cesária Évora"
  summary: "A Montreal Cape Verdean cultural association planning a centenary morna celebration cannot find a São Vicente-style guitarrista through any English-language search — while an Arlindo, a São Vicente musician whose stylistic lineage descends from Cesária Évora's generation, has never received a diaspora booking inquiry."
  body: |
    ## Act A — The Morna Specificity Problem

    Morna is the national music of Cape Verde — a melancholic, rhythmically subtle genre with roots in the Portuguese colonial period and the blues of the African Atlantic. It is the music of saudade, of ocean crossing, of longing. Cesária Évora brought morna to international attention in the 1990s. What the international audience did not learn from her international career is that morna has strong regional variants: the São Vicente style — more syncopated, more harmonically adventurous, influenced by the island's port culture and continental jazz exposure — is distinct from the Brava island style and the Santo Antão style. A Cape Verdean community audience attending a centenary morna celebration will notice the difference.

    The diaspora community that wants to celebrate morna authentically is not looking for Cape Verdean music. It is looking for São Vicente morna, in the style of the generation that shaped Cesária Évora's musical formation, performed by a player whose guitar accompaniment style descends from the tradition lineage of that island.

    This requirement is not articulable in English. It is barely articulable in Cape Verdean Crioulo to someone outside the tradition community. It is entirely legible to a cultural organization committee member who knows the music — and entirely opaque to any arts booking agency, talent directory, or concert promoter who might otherwise help.

    ---

    ## Act B — The Story

    **Dina's** association had been planning a morna centenary celebration for two years. The programming committee had identified three priorities: a lecture on morna history, a dance demonstration of the traditional morna style, and a concert featuring a guitarist and vocalist whose musical lineage connected directly to the founders of the São Vicente style. The first two were manageable. The third was not.

    She searched for Cape Verdean musicians in Canada: a handful, none specifically São Vicente style. She wrote to the Cape Verdean Embassy in Ottawa: they responded warmly but could not help with artist sourcing. She posted in a Facebook group for Cape Verdean diaspora: she received names of two musicians in Lisbon and one in Rotterdam, none with São Vicente specialty the committee could verify. She emailed the Arquivo de Música Cabo-Verdiana in Praia — no response.

    The celebration was eight months away. She was preparing to accept a Cape Verdean musician from Lisbon whose style was more Praia-influenced than São Vicente.

    She found the platform through a Canada Council for the Arts resources page. She registered her engagement: morna, São Vicente regional style specifically required, guitar and vocal, tradition lineage verification important, Montreal engagement, two-week residency plus one public concert, Heritage Canada grant budget.

    **Arlindo** was fifty-three years old and had played morna in São Vicente for thirty-five years. He had learned guitar from a player who had accompanied Cesária Évora in her pre-international club years — a transmission lineage that was deeply significant within the São Vicente community and entirely unrepresented in any internationally accessible artist directory. He had played at cultural festivals in Lisbon and in São Paulo but had never been to Canada.

    His platform profile — submitted with the help of a younger musician in São Vicente who knew about the platform — encoded: morna, São Vicente style, guitar and vocal, tradition lineage (student of Cesária Évora's generation accompanists), diaspora engagement experience, Portuguese and Crioulo, no English (would require an interpreter).

    Dina's search matched his profile on all four tradition-specific criteria plus all three logistics criteria.

    ---

    The platform provided a Portuguese-to-English translated introduction. Dina's committee chair — who spoke Cape Verdean Crioulo — confirmed Arlindo's tradition credentials in a video call. The Heritage Canada grant application was prepared with the platform's documentation service, which included Arlindo's tradition biography in the format Heritage Canada's multicultural programming stream required.

    Arlindo flew to Montreal in October. Two hundred members of the Cape Verdean community attended the concert. Three elderly members who had grown up in São Vicente told Dina afterward that hearing Arlindo's guitar style — the specific rhythmic pattern of his accompaniment — was the first time since leaving Cape Verde that they had felt entirely at home.

    Dina's committee had not been searching for that effect. They found it because the platform could encode "São Vicente guitar accompaniment lineage from Cesária Évora's contemporaries" as a searchable attribute.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Arlindo's tradition lineage — the specific biographical detail that most precisely defined Dina's requirement — was known in São Vicente, known in the Cape Verdean communities in Lisbon and Rotterdam, and known to every morna musician in the Cape Verdean Atlantic triangle. It was not known in Montreal because Dina's search operated in English-language digital spaces where São Vicente guitar lineage from Cesária Évora's era was not an indexed category.

    The cultural organizations that could have helped — the Embassy, the music archive, the diaspora Facebook group — were not structured to answer a question this specific. They could identify "Cape Verdean musicians." They could not identify "São Vicente style, Évora-generation lineage, guitar, diaspora-ready."

    [Thin market infrastructure](../../thin-markets.html) encodes the tradition depth — regional variant, generation lineage, diaspora engagement experience — as searchable attributes that a diaspora cultural organization's programming committee can find and verify before accepting a compromise that their elders would have noticed immediately.

    *Characters are fictional. Morna's São Vicente regional style, its distinction from other regional variants, Cesária Évora's cultural significance, and Heritage Canada's multicultural programming grants are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
