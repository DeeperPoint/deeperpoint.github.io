market_example:
  summary: "Independent sport science professionals cannot find provincial and national sport organizations that need their expertise, while PSOs and smaller professional programs cannot identify practitioners with current credentials relevant to their specific sport and competitive level."
  problem: "Independent sport science professionals — biomechanists, strength and conditioning specialists, sport psychology consultants, nutrition practitioners, video analysis experts — cannot easily find clubs, provincial sport organizations (PSOs), or national sport organizations (NSOs) that need their services. Meanwhile, PSOs and smaller professional programs in the CFL, Canadian Premier League, and regional hockey need specialized expertise but do not know who is available, what credentials are current, or whether a consultant's experience is relevant to their specific sport and competitive level. Most placement happens through informal referral networks that concentrate opportunity among practitioners embedded in major centres."
  dominant_forces:
    - "Participant scarcity — sport science practitioners certified at the high-performance level are few; organizations that can pay for their services are also limited"
    - "Opacity — no searchable national registry of sport science consultants with current credentials, specializations, and availability exists"
    - "Offering complexity — each consultant's profile spans certifications (CSCS, BASES, RD, CPsychol), sport-specific experience, competitive level worked, geographic availability, engagement model, and pricing"
    - "Trust deficit — sport organizations need confidence in credentials and athlete safety before granting facility access; consultants need assurance their professional recommendations will be respected"
    - "Strategic information withholding — NSOs do not publicly advertise performance deficits; consultants do not publicize pricing floors for fear of commoditization"
  deeperpoint_fit: "KnowledgeSlot curates CSEP, CSCA, Sport Canada, and Own the Podium credential frameworks, enabling AI-verified competency matching rather than self-reported expertise. Semantic matching encodes the multidimensional practitioner profile against organizational need, competitive level, sport context, and engagement model. The trusted intermediary protocol protects confidential performance assessment data — neither the organization's performance gaps nor the consultant's minimum pricing need be disclosed prematurely. The Deal Brief captures service scope, deliverables, testing protocols, data ownership, confidentiality obligations, and performance metrics."
  economic_upside: "Canada's high-performance sport infrastructure depends on the effective deployment of qualified sport science professionals. Better matching reduces reliance on informal networks that concentrate opportunity in major centres, increases PSO access to specialized expertise without permanent hiring, and contributes to medal outcomes at the Olympic level."

