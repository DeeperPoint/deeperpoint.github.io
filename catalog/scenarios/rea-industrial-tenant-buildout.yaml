story:
  title: "The Dock Door Question"
  status: draft
  blog_slug: ""
  characters:
    - "Raj — industrial property manager, 95,000 sq.ft. distribution centre, Brampton, Ontario; four existing dock doors, tenant requesting eight"
    - "Craig — dock equipment installer and industrial TI specialist, Mississauga; certified Blue Giant and Poweramp dock systems"
  summary: "A Brampton industrial property manager loses a major logistics tenant to a competing property not because his building is inferior, but because he couldn't answer 'can you add four dock doors in nine weeks?' with a committed yes at the negotiation."
  body: |
    ## Act A — The Eight-Dock Requirement

    The prospective tenant was a regional third-party logistics operator moving from a smaller facility. They needed 90,000–100,000 sq.ft. of distribution space in the Brampton highway corridor. Their operational requirement: eight dock doors with hydraulic levelers, a drive-in door large enough for oversized freight, and 30-foot clear height. The current building had four dock doors and the clear height. It needed four more dock doors.

    The tenant's real estate manager asked Raj directly at their first site visit: can you add four dock doors, and by when?

    Raj knew the structural system of the building could accommodate additional dock doors—the existing four were proof. He did not know the dock equipment lead time, the permit timeline in Brampton, or the contractor's schedule. He said: "I'll get back to you on the timeline."

    He was given two weeks to respond before the tenant closed their site search.

    ---

    ## Act B — The Story

    Raj called his general contractor. The GC knew how to cut openings and frame dock doors but did not install hydraulic dock leveling equipment. He referred Raj to a loading dock equipment supplier. The supplier was a sales-and-distribution operation, not an installation contractor, and referred Raj to two installation contractors.

    The first installation contractor was available but had not installed Blue Giant or Poweramp leveling systems—the manufacturer-certified options that qualify for the warranty the tenant's insurance required. The second was certified but had an 11-week project backlog.

    Raj asked the second for a quote anyway. The quote came back six days into his two-week window. He called back to confirm: eleven weeks, not nine.

    The tenant's requirement was nine weeks to their operational launch date.

    He went back to the tenant on day fourteen with: "We can do the dock additions in approximately eleven weeks." The tenant signed the lease on the competing property, whose landlord had responded on day three with: "Eight weeks, confirmed with our dock contractor."

    **Craig** had completed 31 dock equipment installations in the Brampton-Mississauga industrial corridor over six years. He was manufacturer-certified for Blue Giant and Poweramp systems. His typical structural-plus-equipment timeline for four dock additions on a Brampton building was eight to nine weeks depending on permit processing. He had two projects completing in two weeks and had open capacity he was looking to fill.

    He was on the MarketForge industrial TI contractor platform with his availability status and dock installation certifications documented. Raj's property management firm had not registered.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Craig's availability and certification were precisely what the lease negotiation required. His eight-to-nine-week timeline—confirmed in advance—was the answer that would have closed the deal. He had the capacity. He was not visible.

    The industrial TI contractor market is entirely organized through informal referral chains: GC to supplier to installer, across two conversational referrals that each added multiple days to Raj's two-week window. When the referral chain delivers the wrong contractor first—one with an eleven-week backlog and no alternatives—the deal is lost before the right contractor is found.

    [Thin market infrastructure](../../thin-markets.html) makes the certified, available, timeline-reliable specialist visible at the start of the tenant negotiation—so the landlord can say "yes, eight weeks" with a contractor confirmation in hand, not "I'll get back to you" while the tenant's clock runs.

    *Characters are fictional. Blue Giant and Poweramp dock leveling systems, Brampton Ontario's industrial real estate market, and the logistics tenant TI requirement dynamics are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
