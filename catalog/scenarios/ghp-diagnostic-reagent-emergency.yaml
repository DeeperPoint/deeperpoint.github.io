market_example:
  summary: "When a novel pathogen or unexpected outbreak creates sudden demand for diagnostic reagents — PCR primers, rapid test antigens, reference panels — validated manufacturers cannot find laboratories with surge processing capacity, and laboratories cannot find WHO-accepted suppliers before distribution collapses and testing bottlenecks form."
  problem: "Diagnostic surge response is one of the most acute thin market failures in global health. When a novel pathogen creates sudden demand for diagnostic tests — as occurred with SARS-CoV-2, mpox, and Sudan Ebolavirus outbreaks — the bottleneck quickly shifts from clinical capacity to diagnostic supply chain and laboratory processing capacity. On the supply side: a small number of manufacturers hold WHO Emergency Use Listing (EUL) or pathogen-specific validated reagent production capacity for novel tests. These manufacturers often have surge production capacity that is not known to national laboratory systems seeking to expand testing. On the demand side: national reference laboratories and regional public health laboratories that want to add testing capacity need specific reagents — validated PCR primer-probe sets, positive control panels, extraction reagents — whose validation status for the specific outbreak pathogen and the laboratory's existing platform is not published anywhere. WHO Emergency Use Listing status for diagnostic reagents is publicly available — but WHO EUL is a product-level authorization, not a laboratory-specific validated pairing. A laboratory using a Roche cobas 6800 platform needs reagents validated for that specific platform by a manufacturer that also holds WHO EUL — a two-constraint match that neither the WHO EUL list nor the laboratory's platform vendor has indexed."
  dominant_forces:
    - "Simultaneous surge on both sides — outbreak reagent demand and pandemic testing scale-up create simultaneous supply and demand surges that overwhelm existing supply chain relationships built for steady-state procurement"
    - "Platform-specific validation requirement — reagents validated for one PCR platform rarely transfer without revalidation to another; the laboratory's existing equipment constrains the reagent options, creating a dual-constraint matching problem"
    - "Regulatory status opacity — WHO EUL, national FDA/Health Canada emergency use authorization, and CE-IVD mark combinations differ by product and jurisdiction; a laboratory's regulatory environment determines which authorizations it can accept"
    - "Cold chain and logistics constraint — diagnostic reagents for novel pathogens often require cold chain handling; the combination of supply shortage and cold chain demand creates logistics bottlenecks that generic freight channels cannot resolve"
    - "Temporal urgency — diagnostic capacity gaps during outbreak surges directly limit contact tracing and case isolation capacity; each day of testing bottleneck corresponds to measurable outbreak amplification"
  deeperpoint_fit: "Semantic matching encodes reagent manufacturer profiles (pathogen scope by validated assay type, platform compatibility by instrument model, regulatory authorization status by jurisdiction, production capacity volume and surge capability, cold chain shipping capability, minimum order quantity) against laboratory demand signals (pathogen, instrument platform, regulatory jurisdiction, volume required, timeline, existing extraction reagent type, shipping destination). KnowledgeSlot encodes WHO EUL status and national EUA status by product and jurisdiction as a continuously updated reference asset."
  economic_upside: "The COVID-19 pandemic demonstrated the economic scale of diagnostic testing failures: the US testing deficit in March–April 2020 is estimated to have contributed to epidemic amplification worth $75B–$150B in economic losses above what successful early containment would have produced. The global in vitro diagnostics market for infectious disease testing exceeded $30B in 2024, with outbreak-driven surge events generating episodic demand spikes that the existing distribution infrastructure consistently fails to serve efficiently. A platform that connects validated reagent manufacturers to surge laboratory capacity within 48–72 hours of an outbreak alert reduces the testing bottleneck formation that amplifies outbreak trajectories."

