market_example:
  summary: A specialist matching platform connecting Canadian financial institutions, fintechs,
    and money services businesses with FINTRAC-experienced AML analysts, compliance officers,
    and transaction monitoring specialists—solving the chronic shortage of practitioners who
    combine Canadian AML regulatory depth with specific sector experience during compliance
    remediation, FINTRAC examination preparation, and rapid growth scaling events.
  problem: "Canada's anti-money laundering compliance regime under the Proceeds of Crime
    (Money Laundering) and Terrorist Financing Act and FINTRAC's compliance program requirements
    imposes specific, technically demanding obligations on financial institutions, MSBs,
    casinos, real estate developers, and lawyers. The AML compliance practitioner market in
    Canada is chronically thin relative to demand: FINTRAC regulatory scrutiny has intensified
    sharply since 2019, with administrative monetary penalties growing from millions to hundreds
    of millions annually, and the fintech growth wave has created a rapidly expanding pool
    of newly regulated entities whose compliance programs must be built from near-zero.
    The technical expertise required—understanding FINTRAC's specific STR and LTRE reporting
    requirements, Canada's own beneficial ownership registry requirements under Bill C-86,
    the specific AML risks in crypto asset trading, the correspondent banking AML risk frameworks,
    or the real estate transaction monitoring requirements post-2023—is jurisdiction-specific
    and not well served by generic compliance staffing agencies who treat 'AML compliance'
    as a single undifferentiated skill category. A fintech being examined by FINTRAC for
    the first time needs a practitioner with FINTRAC examination experience, not a practitioner
    whose AML background is US BSA/FinCEN reporting to FinCEN. A credit union implementing
    its first transaction monitoring system needs someone who has built one before within
    the FINTRAC framework—not a generic risk management consultant. The staffing market
    for AML consultants conflates all of these into a single resume filter ('5+ years AML
    experience') that produces systematically poor matches."
