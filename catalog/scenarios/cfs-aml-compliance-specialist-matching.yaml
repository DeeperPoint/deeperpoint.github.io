  summary: "A Vancouver crypto exchange with a FINTRAC examination scheduled in 90 days
    finds an independent consultant with both MSB examination experience and crypto
    asset transaction monitoring expertise through an AML specialist matching platform."
  body: |
    ## Act A - The Market Structure

    FINTRAC examinations are not like audit engagements. A FINTRAC examiner arriving at
    a regulated entity's offices is not looking for best efforts and reasonable interpretations.
    They are reviewing whether the entity's compliance program meets specific, technical
    requirements: whether the risk assessment covers all prescribed risk factors, whether
    transaction monitoring thresholds are calibrated to the entity's specific risk profile,
    whether STR filings are complete, timely, and accurately categorize the suspicious activity.

    The expertise required to prepare a compliance program for FINTRAC examination is
    jurisdiction-specific and current: FINTRAC's guidance evolves, its examination procedures
    evolve, and its administrative monetary penalty precedents from the past three years
    define what "adequate" means today. A compliance consultant whose AML background is US BSA
    regulation cannot prepare a Canadian crypto exchange for FINTRAC examination—they don't
    know what FINTRAC actually looks at, in what sequence, and with what evidentiary standard.

    Finding the Canadian-specific, crypto-asset-experienced, examination-track-record-verified
    practitioner that the situation requires is not a Google search. It is a network call
    to people who know the small community of former FINTRAC examiners and senior compliance
    officers who have actually been through this.

    ---

    ## Act B - The Story

    **Elena** received a FINTRAC examination notice six weeks ago. The examination is scheduled
    in 90 days. Her exchange holds an MSB registration and processes $40M per month in crypto
    asset transactions. She has a compliance program that was designed two years ago, before
    FINTRAC's 2023 crypto asset risk assessment guidance update changed the STR categorization
    requirements for her transaction type. She needs someone who has prepared a crypto MSB for
    examination under the current guidance. Her compliance staffing agency sent three resumes.
    Two are US-trained BSA specialists. One has Canadian bank AML experience, but no MSB or
    crypto background. None of them has been inside a FINTRAC examination as a respondent.

    **Marcus** spent eleven years at FINTRAC as an examination officer before establishing
    an independent AML consulting practice. He has prepared four MSBs for FINTRAC examination
    since leaving, two of them crypto asset trading platforms. He knows exactly which program
    elements FINTRAC focused on in its 2024 crypto sector examination sweep. He doesn't use
    staffing agencies. He fills engagements through a network of six compliance officers who
    refer him when a client is in his specialty. He has a three-week gap opening in his
    calendar that leads directly into Elena's examination window. He doesn't know Elena exists.

    Elena queries the platform: FINTRAC examination preparation, crypto asset MSB entity type,
    90-day engagement timeline, STR program remediation and transaction monitoring review.
    Marcus surfaces as one of two practitioners in Canada with verified FINTRAC examination
    history and crypto asset MSB compliance experience. Elena contacts him that afternoon.
    Marcus's gap in his calendar aligns with her preparation timeline. He is engaged within
    48 hours. The FINTRAC examination proceeds with a fully remediated compliance program.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    AML compliance expertise is one of the most jurisdiction-specific and context-specific
    capabilities in financial services. Treating it as a generic 'compliance' category in staffing
    searches produces systematically poor matches with potentially $50M consequences in avoided
    AMPs. DeeperPoint builds the specialty matching platform that puts FINTRAC examination
    track record and entity-type expertise at the centre of practitioner selection.

    *Characters are fictional. FINTRAC's administrative monetary penalty program and the
    crypto asset compliance examination wave are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
