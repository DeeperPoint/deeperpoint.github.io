market_example:
  summary: "Municipal climate action program budgets are chronically underspent because standard tendering cannot find qualified green infrastructure contractors — bioswale builders, urban foresters, green roof installers — who don't monitor commodity procurement portals."
  problem: "Municipalities implementing climate action plans need specialized contractors for green infrastructure projects: urban tree canopy installation, green roof and living wall installation, bioswale and rain garden construction, energy retrofit for civic buildings, EV charging infrastructure, and community solar. These contractors are a different and often smaller pool than standard construction contractors. Standard tendering produces either zero qualified bids or awards to general contractors who lack genuine green infrastructure expertise, resulting in poor outcomes and wasted program budgets."
  dominant_forces:
    - "Participant scarcity — qualified green infrastructure contractors are a small and relatively new professional community; many small enterprises do not track municipal tender portals"
    - "Search friction — municipal procurement systems cannot encode green infrastructure specialization beyond broad categories; certified contractors cannot efficiently monitor all relevant municipal opportunities"
    - "Regulatory fragmentation — climate program funding comes with different eligibility rules, certification requirements, and reporting obligations that vary by funder and project type"
    - "Offering complexity — green infrastructure projects involve materials, species selection, hydrology, soil science, and performance guarantee requirements standard construction contracts do not capture"
    - "Cognitive overload — sustainability officers managing six program streams cannot stay current on which contractors operate in their region and at what scale"
  deeperpoint_fit: "Semantic matching aligns project specifications (ecosystem type, installation size, performance targets, funding program rules) with contractor capabilities (certified species, equipment, project experience, insurance coverage, geographic service area). KnowledgeSlot curates Green Municipal Fund, Low Carbon Economy Fund, and ICLEI program standards, green infrastructure performance standards, certified species lists, and carbon accounting protocols. Anticipatory matching proactively notifies qualified contractors when a new program budget is approved, before formal tendering opens. User aggregation allows small green infrastructure firms to present collective capacity for larger projects."
  economic_upside: "Climate action program budgets are time-limited and frequently underspent because municipalities cannot find qualified contractors in time. Better matching reduces underspend, improves project quality, grows the local green infrastructure contractor base, and accelerates measurable progress toward municipal climate targets."

