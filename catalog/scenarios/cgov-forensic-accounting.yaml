market_example:
  summary: "Federal and provincial regulatory agencies and Crown prosecutors pursuing complex financial fraud and asset recovery cases cannot efficiently assemble the forensic accounting and financial investigation capacity required for cases involving novel instrument types, cross-jurisdictional asset structures, or sector-specific accounting methodologies."
  problem: "Complex financial fraud investigations — procurement fraud in government contracting, securities fraud involving novel financial instruments, health sector billing fraud, real estate money laundering — require forensic accounting expertise that is specific to the instrument type, sector methodology, and jurisdictional asset structure involved. The provincial securities commissions, federal RCMP financial crime units, and Crown prosecutor offices pursuing these cases rely on a small network of recognized forensic accounting experts. Cases involving novel structures — cryptocurrency asset tracing, private equity fund accounting manipulation, Indigenous band council procurement fraud — require subspecialty expertise that is not present in the standard forensic accounting network. The result is either underpowered investigation that produces acquittals or settlement terms below actual losses, or expensive and slow recruitment of US-based specialists."
  dominant_forces:
    - "Participant scarcity — forensic accountants with the specific subspecialty experience required for novel case types are a genuinely small Canadian population"
    - "Trust deficit — forensic investigation capacity requires security clearance, proven expert witness record, and demonstrated professional liability coverage; standard contractor directories cannot verify these"
    - "Offering complexity — case-specific matching requires alignment on instrument type, sector methodology, jurisdictional asset structure, expert witness qualification history, and active conflict-of-interest declarations relative to accused entities"
    - "Opacity — subspecialty forensic accounting expertise is not legible from standard CPA directories or standard government contractor registries"
    - "Case sensitivity — the existence and nature of an investigation cannot be broadly disclosed during specialist search; discovery mechanisms that require open market solicitation create investigative compromise risk"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (subspecialty forensic accounting expertise by instrument type, sector, and asset structure — cryptocurrency tracing, procurement fraud, health billing, real estate layering — along with security clearance level, expert witness qualification history by court and case category, active conflict-of-interest declarations) against investigative agency demand signals (case category, instrument type, asset structure, required clearance, expert witness role, confidentiality tier). The trusted intermediary model holds case identity confidentially until clearance-verified specialist mutual interest is established."
  economic_upside: "Canadian government procurement fraud alone represents an estimated $5–15 billion annually. Health sector billing fraud costs federal and provincial health systems hundreds of millions per year. Under-powered investigations — where the forensic accounting capacity is inadequate to the case complexity — produce outcomes worth a fraction of the actual losses. Better specialist matching increases investigation quality, conviction rates, and asset recovery amounts in cases where the evidence exists but the analytical capacity to present it is the limiting factor."

