market_example:
  summary: "Matches remote communities facing housing crises with flat-pack or modular housing manufacturers adept at harsh climates, optimizing bulk transport and local assembly."
  problem: "Building homes in Canada's north is exorbitantly expensive due to short building seasons, lack of skilled local trades, and insane material transport costs. Southern modular home builders have capacity but struggle to bid on northern projects due to complex logistics (barges, ice roads) and lack of local site-prep partners. Communities suffer from severe overcrowding as a result."
  dominant_forces:
    - "Extreme logistical constraints for moving oversized loads to remote towns."
    - "Short summer building windows require micro-precise scheduling."
    - "Lack of local cranes/specialized assembly crews requires hybrid delivery."
  deeperpoint_fit: "CoSolvent matches specific municipal/band housing grants with production slots at modular factories. The matching engine forces alignment with seasonal logistics windows (e.g., sealift barges)."
  economic_upside: "A multi-billion dollar federal push for Indigenous and northern housing relies on effectively deploying capital. A specialized matching market captures value by eliminating supply-chain failures."

