    strategic_logic: "SME exporters entering a new market for the first time benefit most
      from a structured briefing that covers the five knowledge domains where market ignorance
      is most costly: regulatory pathway, distributor norms, institutional contacts,
      tariff treatment, and realistic timeline. A managed briefing service that structures
      the retired specialist's knowledge into a standard format produces a defensible deliverable
      that EDC, BDC, and provincial export programs can reference as part of their client support."
    recurring: false

  - title: "In-Market Distributor Introduction Facilitation"
    type: commerce-extension
    revenue_model: "Per-introduction facilitation fee for warm distributor and institutional
      introductions from the retired specialist's in-country network ($500–2,000 per
      qualified introduction); success fee on first distribution agreement ($1,500–5,000)."
    strategic_logic: "The highest-value asset of a retired Trade Commissioner or EDC country
      specialist is not their regulatory knowledge — it is their in-market institutional
      contact network: the distributor they know personally, the chamber of commerce officer
      who will take a call because of a trusted relationship. Facilitating warm introductions
      from the retired specialist's network to qualified SME clients converts a knowledge
      advisory service into a market access commerce service with substantially higher
      per-transaction value."
    recurring: false

  - title: "Export Documentation and Compliance Coordination Service"
    type: managed-service
    revenue_model: "Annual export compliance subscription per SME exporter ($2,000–6,000/year;
      covers ongoing export documentation review, trade agreement tariff update monitoring,
      and country-specific regulatory change alerts for active export markets); per-shipment
      compliance review fee for high-value or regulated exports."
    strategic_logic: "SME exporters who have successfully entered a market with specialist
      advisory assistance have an ongoing compliance and documentation monitoring need as
      regulatory requirements, trade agreement tariff schedules, and country-specific import
      procedures evolve. The compliance subscription creates recurring revenue from the same
      SME exporters the market entry advisory matched, while keeping the retired specialist
      productively engaged on an ongoing basis."
    recurring: true

story:
  title: "The Distributor Who Said No to Everyone"
  status: draft
  blog_slug: ""
  characters:
    - "Chantal - CEO, precision water filtration technology company, Quebec City"
    - "Howard - retired Trade Commissioner, 11 years in Japan and South Korea, Victoria BC"
  summary: "A Quebec City water filtration technology company that has failed to establish
    a Japanese distribution relationship through three years of trade show attendance and
    embassy introductions is matched with a retired Trade Commissioner who explains in one
    session why their approach was being declined — and introduces them to a Japanese
    manufacturer's representative who has been looking for a Canadian water treatment partner."
  body: |
    ## Act A - The Market Structure

    Export market entry failure in Japan is not usually a product problem. Japanese
    industrial distributors are risk-averse by design, relationship-driven by culture,
    and protocol-sensitive by training. A Canadian company that approaches a Japanese
    distributor with the materials and methods appropriate for a German trade fair — a
    slick product brochure, a direct pricing proposal, a request for a distribution
    agreement in the first meeting — will be politely declined. The distributor is not
    signalling product rejection. They are signalling relationship phase mismatch.
    A relationship that would take eighteen months to develop through the correct protocol
    has been foreclosed in the first meeting by an approach that signals ignorance of
    the protocol.

    This is not taught in export trade courses. It is learned through years of in-market
    relationship experience — watching a Canadian company with a genuinely superior product
    fail in Japan because their entry approach was American rather than Japanese, and then
    watching a subsequent company with a comparable product succeed because they understood
    that the first three meetings were not about the product at all. The Trade Commissioner
    who has facilitated two hundred of these entry attempts over eleven years in Tokyo
    and Seoul knows the protocol at a granular level. The Canadian company that has never
    exported to Japan does not know what they do not know.

    ---

    ## Act B - The Story

    **Chantal** leads a company that produces specialized municipal water filtration systems
    with a technology profile well-suited to Japanese water infrastructure requirements —
    ageing municipal systems in mid-size Japanese cities are a documented upgrade market.
    Her company has attended the Japan Water Works Association exhibition twice, received
    positive technical reviews from Japanese municipal engineers at both events, and generated
    three rounds of email inquiry from potential distributor contacts — none of which
    progressed beyond the initial exchange. She engaged the Canadian Trade Commissioner
    Service office in Tokyo, who provided an introduction to two potential distributor
    contacts; both meetings were cordial and produced no follow-up. She did not understand
    why. Her product was technically competitive, her pricing was acceptable, and her
    company had a genuine market opportunity she could not access.

    **Howard** retired after eleven years as a Trade Commissioner in Tokyo and Seoul,
    followed by four years managing TCS Japan programs from Ottawa. He has facilitated
    entry for sixty-three Canadian companies in the Japanese market across environmental
    technology, municipal infrastructure, and industrial systems categories. He now lives
    in Victoria and consults occasionally for former TCS colleagues, but has no advisory
    visibility in the SME export market.

    Howard's specialist profile surfaces on the platform when Chantal posts her situation:
    Japan market entry, municipal water infrastructure category, three years of failed
    distributor engagement, TCS introductions that didn't progress. Howard reviews her
    approach materials in advance of their first call. The issue is immediately apparent:
    her product technical documentation has been prepared for the North American regulatory
    context, not the JWWA (Japan Water Works Association) certification framework; her
    distributor pitch opens with pricing, which in Japanese distributor culture signals
    that she is treating the relationship as a transaction; and her follow-up emails
    have been sent to the contact name on the business card rather than through the
    organizational hierarchy that Japanese distributors use for incoming supplier evaluation.

    Howard provides a market entry protocol briefing — forty-five minutes of specific,
    actionable guidance on the sequence of relationship steps, the documentation adaptations
    required for JWWA pre-approval, and the organizational approach to follow-up. He
    then makes one phone call: to a Tokyo-based manufacturer's representative he has known
    for fifteen years who specializes in placing Canadian and European environmental
    technology with Japanese municipal procurement channels and who has been looking for
    a Canadian water filtration partner for eighteen months. A formal introduction is made.
    A distributor relationship begins.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Howard's knowledge of Japanese distributor protocol and his personal contact network
    in the municipal environmental technology sector are not reproducible through any
    standard advisory channel at any price. The TCS can provide institutional introductions
    but cannot provide the granular protocol coaching that changes how an approach is
    made rather than just who it is made to. The trade consulting market in Canada does
    not employ retired Trade Commissioners whose in-country contact networks remain active.

    Chantal spent three years and approximately $80,000 in trade show attendance, travel,
    and consultant fees making an approach that Howard diagnosed in a forty-five minute
    briefing. The knowledge that would have redirected her approach was forty minutes
    away by phone, held by a retired professional in Victoria who had no mechanism to
    signal its availability to a Quebec City water technology company he had never heard of.

    *Characters are fictional. Japanese distributor relationship norms, JWWA certification
    requirements, and TCS market entry advisory programs are factual.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
