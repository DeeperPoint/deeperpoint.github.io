    type: saas
    revenue_model: "Annual subscription to land rights NGOs, government reform units, and civil society organizations ($800–$2,500/year, sliding scale); technologist profiles (free for volunteer contributors)"
    strategic_logic: "Land rights programs funded by the Omidyar Network, the Bill & Melinda Gates Foundation land tenure programs, and bilateral land reform programs have active interests in the technical quality of the digital infrastructure their grantees build. An institutional subscription model aligned with these funders creates sustainable revenue while directly improving grantee technical capacity."
