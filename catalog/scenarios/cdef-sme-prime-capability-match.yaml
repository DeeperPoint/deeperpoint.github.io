market_example:
  summary: "A Waterloo quantum sensing startup has a magnetometer small enough to fit in a UAS payload — exactly what a prime on a RCAF surveillance program needs. The prime has been searching for six months through trade shows and PSPC procurement notices. The startup has been pitching investors, not primes. No market infrastructure connects Canadian defence SMEs to prime subcontract opportunities on specific programs before the RFP closes."
  problem: "Canada's defence industrial base includes hundreds of small and mid-size firms with genuinely world-class capabilities in specific technical niches — sovereignty-enabling technologies that ITAR restrictions mean only Canadian firms can supply to Canadian programs. A Dartmouth firm building ruggedized power electronics for Arctic-rated platforms. A Kanata signals company with a software-defined radio architecture that a specific DND communication modernization program needs. A Montreal firm with an AI-based anomaly detection pipeline trained on shipboard sensor data that fits a RCN requirements document almost exactly. These firms exist. The prime contractors running the programs that need them exist. In many cases, the prime has an unfilled subcontract requirement that the SME could fill, and the SME has a capability that the prime's program office would fund, if they knew about each other before the proposal deadline. The gap is discovery: PSPC's Build in Canada Innovation Program and IDEaS provide some matchmaking, but they operate on government timelines and are not designed for the fast-tempo, proposal-deadline-driven matching that defence procurements actually require. Trade shows (CANSEC, DEFSEC) enable networking but not structured capability-to-requirement matching. The result is that capable Canadian SMEs end up as tier-2 suppliers to American primes rather than tier-1 subcontractors to Canadian primes on Canadian programs — a sovereign capability loss that DND policy explicitly wants to prevent."
  dominant_forces:
    - "Security clearance gating — subcontract opportunities on classified programs require facility security clearances (FSC) that SMEs must have before they can even receive the capability requirement; the clearance process takes 12–18 months and SMEs cannot start it until they know a program exists"
    - "Proposal deadline compression — defence subcontract teaming decisions happen 60–90 days before RFP close; an SME that finds the prime after that window has missed the program cycle regardless of capability fit"
    - "Capability vocabulary mismatch — SMEs describe their technology in commercial or academic language; DND requirements documents use MIL-SPEC and NATO STANAG vocabulary; neither side can immediately recognize the match without a translation layer"
    - "Incumbent bias — prime contractors default to known subcontractors from previous programs; new SME entrants must overcome a discovery barrier and a trust barrier simultaneously"
    - "ITAR segregation opportunity — Canadian-only subcontract requirements arise specifically because ITAR restrictions prevent American firms from supplying certain Canadian-sovereign program elements; Canadian SMEs are the only eligible suppliers, but must be known to the prime before source selection"
  deeperpoint_fit: "MarketForge lists Canadian defence SMEs by capability domain using a structured technical profile — not a capability brochure, but a structured competence description matched to DND/NATO vocabulary: platform type, environmental rating, certification status (ISO 9001, AS9100, CMMC), clearance level held, ITAR-exempt status. Prime contractors post subcontract opportunity requirements with the same structured vocabulary. The matching engine identifies SME capabilities that map to prime requirements before the teaming window closes. Knowledge Slot carries current DND program pipeline, PSPC Industrial and Technological Benefits (ITB) obligation tracking, and IDEaS challenge status."
  economic_upside: "Canada's defence procurement budget exceeds $30 billion over the next decade in announced programs (F-35 sustainment, surface combatant, Arctic and Offshore Patrol, ground vehicle modernization). DND's Industrial and Technological Benefits policy requires value-for-value Canadian industrial activity as a condition of major foreign procurement — primes have formal obligations to find and develop Canadian suppliers. A platform that systematically surfaces Canadian SME capabilities to prime subcontract teams before proposal close captures a portion of this mandated industrial matching activity. A 1% agency fee on facilitated subcontract engagements at $5M average value generates $50,000 per match — 20 successful matches per year produces $1M in annual revenue."

