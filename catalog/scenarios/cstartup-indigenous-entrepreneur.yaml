market_example:
  summary: "First Nations, Métis, and Inuit entrepreneurs in remote and reserve communities with commercially viable business concepts cannot access mainstream startup programs, mentorship networks, or investment communities, while Indigenous-focused funds and reconciliation-mandated accelerators cannot efficiently discover them."
  problem: "First Nations, Métis, and Inuit entrepreneurs in remote and reserve communities cannot easily access mainstream startup programs, mentorship networks, or investment communities. Meanwhile, Indigenous-focused venture funds, Indigenous entrepreneur support organizations, and mainstream accelerators with reconciliation mandates cannot efficiently discover Indigenous founders in remote communities with commercially viable business concepts. Most Indigenous entrepreneurship funding flows through government programs (NACCA, CFDC networks) that are not designed for high-growth startup pathways. The result is a dual-track system where Indigenous founders compete for smaller pools of specifically designated funding rather than accessing the full range of Canadian startup capital."
  dominant_forces:
    - "Geographic distance — startup ecosystem activity concentrates in urban centres far from the majority of on-reserve and remote Indigenous communities"
    - "Opacity — Indigenous founders with commercially viable concepts are invisible to mainstream investors or accelerators through normal deal flow channels"
    - "Trust deficit — Indigenous entrepreneurs are wary of mainstream ecosystem institutions due to historical extraction of community IP without fair compensation; trust requires appropriate intermediation"
    - "Structural barriers — many Indigenous entrepreneurs operate businesses on reserve land with different regulatory frameworks (Indian Act corporations, band council ownership structures) that mainstream investors and advisors do not understand"
    - "Network concentration — Indigenous entrepreneurship networks are not connected to mainstream startup capital networks, creating a dual-track system with smaller designated funding pools"
  deeperpoint_fit: "The trusted intermediary model is essential: Indigenous founders need assurance that their business concept and community knowledge will be protected before disclosure; investors and accelerators need assurance of genuine commercial viability before engaging. KnowledgeSlot curates NACCA lending program criteria, provincial CFDC networks, Indian Act corporate structures, federal Indigenous procurement programs, and UNDRIP business partnership frameworks. Semantic matching encodes founder profile (business stage, domain, community context, legal structure, capital need) against program or investor profile (investment thesis, Indigenous mandate, reconciliation framework, structural flexibility). Facilitator roles accommodate Indigenous Business Network nodes and NACCA-affiliated community futures offices."
  economic_upside: "Indigenous communities represent some of Canada's most significant untapped economic potential — in natural resource management, land-based technology, cultural industries, and community services. Better connectivity between Indigenous founders and appropriate capital and mentorship would accelerate economic self-determination and create high-growth companies from within Indigenous communities rather than from extractive relationships with them."

