  - title: "Indigenous Business Structure Navigation Service"
    type: managed-service
    revenue_model: "Per-founder structure navigation consultation ($299–$499); annual advisory retainer for NACCA-affiliated CFDCs ($800/year)"
    strategic_logic: "The primary structural barrier for Indigenous founders accessing mainstream capital is that investors and advisors do not understand Indian Act corporate structures, band council ownership requirements, and reserve land business frameworks. A navigation service that translates between Indigenous business legal structures and mainstream investor requirements reduces the structural mismatch without requiring Indigenous founders to abandon community-appropriate business forms."
    recurring: true

  - title: "Indigenous Startup Readiness Program Design"
    type: managed-service
    revenue_model: "Per-program design and facilitation ($2,500–$5,000); annual program coordination for accelerators ($3,000/year)"
