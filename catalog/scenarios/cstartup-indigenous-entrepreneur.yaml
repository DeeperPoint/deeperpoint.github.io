    strategic_logic: "The federal government's Indigenous Entrepreneurship Action Plan and the National Indigenous Economic Strategy create institutional mandates for accelerators, banks, and investors to reach Indigenous communities. A platform that makes Indigenous founders discoverable — with appropriate trust protocols — is a direct implementation tool for those mandates."
