market_example:
  summary: "Power wheelchairs, adjustable hospital beds, Hoyer lifts, stair lifts, and other adaptive equipment cost between $3,000 and $60,000 new. Provincial assistive technology programs (Ontario's MOATC, BC's HIDBC, Alberta's AADL) cover a portion of new equipment costs but have eligibility restrictions and often multi-month waiting lists. When adaptive equipment is no longer needed — because the user has moved to long-term care, recovered, or passed away — it typically sits unused in a family home or goes to landfill. The thin market: connecting families with excess equipment to patients who need it, at verified condition and appropriate clinical specification, without the safety risks of unstructured online marketplaces and without waiting for provincial program approval."
  problem: "The used adaptive equipment market in Canada exists but operates as a true thin market: isolated Facebook groups, community bulletin boards, occasional Kijiji listings, and charity warehouse programs that are regionally limited and often poorly organized. The matching problems are significant. A family in Oakville who needs to move a hospital bed out of a deceased parent's home faces the reverse problem from a family in Burlington who has been waiting three months for the provincial MOATC program to approve funding for the same item. The two families almost certainly never connect. When they do connect through informal channels, the transaction has no quality verification, no clinical appropriateness check, and no documentation for insurance purposes. When equipment is donated rather than sold, the recipient may receive a device that is incompatible with their needs — a power wheelchair set up for a different body size, or a hospital bed without the appropriate mattress for pressure injury prevention. The market failure is structural: there is no trusted aggregator with clinical oversight to match supply and demand efficiently."
  dominant_forces:
    - "Perishable availability — adaptive equipment becomes available unpredictably when a user dies, moves to LTC, or recovers; the supply side events are not foreseeable by families in waiting"
    - "Clinical specification complexity — adaptive equipment suitability is not obvious from general descriptions; a power wheelchair requires weight capacity, seat width, control configuration, and terrain suitability matching that lay sellers and buyers cannot reliably verify"
    - "Provincial program delays — MOATC, AADL, and similar programs have processing times of weeks to months; families in urgent need cannot wait and often go without"
    - "Trust deficit — unstructured online marketplaces offer no quality verification, no documentation, and no recourse if equipment is misrepresented; buyers are cautious about purchasing safety-critical items from private parties"
    - "Geographic mismatch — supply and demand are geographically co-located at provincial scale but often misaligned at city scale; a platform aggregating listings across an entire province dramatically improves match probability"
  deeperpoint_fit: "MarketForge operates an adaptive equipment exchange with condition-verified listings created by sellers or donating families, reviewed by a registered occupational therapist before publication. Buyers filter by equipment category, provincial location, clinical specification (weight capacity, seat width, stair lift rail length, etc.), and price. Occupational therapist reviewers — listed as professional platform members — provide condition verification for a flat fee, generating a brief written report attached to the listing. The matching problem is pure information: who has what, where, and whether it is clinically appropriate for a given need. No health records are involved."
  economic_upside: "The Canadian adaptive equipment market is approximately $500 million per year for new equipment, with provincial programs covering a portion. A structured resale market that captures 5–10% of replacement throughput represents $25–50 million in annual transaction volume. The platform earns transaction facilitation fees, OT verification fees shared with participating therapists, and provincial program administrative partnerships for approved second-hand equipment pathways (which several provinces are actively developing). Families with excess equipment recover value; families in waiting obtain equipment faster; provincial programs offset their costs by approving certified second-hand equipment as eligible for subsidy top-up."

