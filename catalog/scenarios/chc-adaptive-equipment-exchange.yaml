story:
  title: "The Wheelchair in the Garage"
  status: draft
  blog_slug: ""
  characters:
    - "The Okafor family — Scarborough family managing the estate of Margaret Okafor, 84; her power wheelchair has been in their garage for seven months; they have no idea what to do with it"
    - "Tomás — 41-year-old man in Mississauga with progressive MS; approved for MOATC funding but the power wheelchair he's been matched to new is a six-month wait; his current manual chair is no longer adequate"
    - "Janet — registered OT in Hamilton; listed on the platform as equipment reviewer for power mobility devices; reviews for condition, clinical specification, and safety"
  summary: "The Okafor family has a power wheelchair in their garage for seven months with no mechanism to find it a home. Tomás has been approved for a power wheelchair but is waiting six months for new delivery. Janet verifies the chair's condition and specification match in forty minutes. The chair moves from garage to Tomás's home two weeks later, with MOATC subsidy top-up approved on the certified second-hand pathway."
  body: |
    ## Act One: The Garage Inventory

    Eight months after Margaret's funeral, her son David was doing the last room. The power wheelchair had been
    a $14,000 purchase four years ago and it was in excellent condition — Margaret had used it for eleven months
    before moving to the nursing home where manual mobility was sufficient and the chair sat. David had called
    three charities. One said they didn't accept power chairs. One had a six-month pickup list. One hadn't called
    back.

    He listed it on Kijiji for $2,800. Three responses in two weeks — all asked questions he couldn't answer. What's
    the weight capacity? Is the joystick configuration changeable? How wide is the seat? He had no idea. The chair
    sat in the garage.

    ---

    ## Act Two: The Platform Listing

    He found the platform through a social worker at the nursing home who had mentioned it twice in the past month.

    The listing process asked him to describe the chair model (the sticker on the seat post gave him the manufacturer
    and model number), the approximate date of purchase, and visible condition. It flagged the model as a mid-range
    indoor/outdoor power chair and requested an OT verification before publication.

    Janet Kowalski's verification appointment was three days later by video. She walked David through a structured
    condition check — battery health indicator, joystick response test, wheel bearing check, seat cushion condition —
    and pulled up the manufacturer's specification sheet. Weight capacity: 300 lbs. Seat width: 19 inches. Joystick:
    standard right-hand, reconfigurable. She wrote the report in thirty minutes after the call.

    The listing went live with Janet's verification attached.

    ---

    ## Act Three: Tomás's Two Weeks

    Tomás had been using the platform's search for three weeks. His MOATC approval specified a mid-range indoor/outdoor
    power chair, 300 lb capacity minimum, seat width 18–21 inches. The new chair from his designated vendor was a
    six-month delivery queue.

    The Okafor listing matched his specifications. The OT report confirmed clinical suitability. The asking price was
    $2,800; his MOATC subsidy top-up for certified second-hand equipment covered $2,100 of it.

    David brought the chair to Tomás's building in his father's van on a Saturday morning. Tomás was outside waiting.

    The garage had been empty for eleven months. The driveway in Mississauga had a new wheelchair ramp, built the
    previous week in anticipation.

    *Characters are fictional. Ontario's MOATC program, AADL in Alberta, the adaptive equipment resale market, and
    OT scope of practice for equipment verification are real. [DeeperPoint](../../marketforge.html) is building the
    matching infrastructure this market requires.*
