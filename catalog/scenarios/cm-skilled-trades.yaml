market_example:
  summary: "Canada faces a 300,000-worker construction trades shortage by 2030; Mexico has a large, trained, underemployed trades workforce. The regulatory pathway exists but is too complex for either party to navigate without structured intermediary support."
  problem: "Canada has persistent shortages of welders, pipefitters, ironworkers, millwrights, heavy equipment operators, and concrete finishers — particularly in Alberta, British Columbia, and Ontario, where energy infrastructure, transit, and housing projects are all underway simultaneously. Mexico has a large, trained, and relatively underemployed skilled trades workforce. Federal Skilled Worker pathways and Temporary Foreign Worker Programs exist but are administratively complex, employer-specific, and poorly matched to project-based labour needs. Contractors cannot efficiently identify, screen, verify, and sponsor Mexican trades workers. Mexican workers cannot identify which Canadian contractors have vacancies, reciprocity agreements, and TFWP approval to sponsor them."
  dominant_forces:
    - "Opacity — Canadian project labour needs are posted in provincial job boards; Mexican trades workers and their unions have no systematic visibility to project-level demand in Canada"
    - "Regulatory fragmentation — Trade certification reciprocity between Mexican NOM standards and provincial Red Seal certification is partial and complex; TFWP requirements differ by province, occupation code, and employer size"
    - "Cognitive overload — A Mexican welder with TMEC/AWS certification faces pages of IRCC documentation without any guide to which pathway applies to their specific situation"
    - "Trust deficit — Canadian contractors cannot verify Mexican credentials at scale; Mexican workers fear sponsor misrepresentation without institutional backing"
    - "Temporal distance — Construction project labour needs peak during specific build phases; seasonal availability windows rarely align without advance planning"
  deeperpoint_fit: "Semantic matching aligns worker profiles (certified trade, NOM/AWS/CWB equivalency level, language, prior Canada experience, willing provinces) with contractor project profiles (occupation, project phase, location, LMIA status, Red Seal equivalency acceptance). The verification pipeline validates Mexican NOM trade certificates and TMEC credential equivalency before encoding in matching profiles. KnowledgeSlot curates Red Seal/NOM equivalency tables by trade, TFWP LMIA application requirements by province and occupation, and CUSMA professional categories applicable to trades. Multi-channel input (WhatsApp/SMS in Spanish) allows Mexican workers to participate without English-language job portals."
  economic_upside: "Canada's construction labour gap is estimated at 300,000+ workers by 2030. Mexico's underemployed trades workforce is a natural counterpart. Legal, documented labour mobility reduces project delays, creates formal employment for Mexican workers with better wage protection than informal migration, and builds bilateral human capital links that outlast individual project cycles."

