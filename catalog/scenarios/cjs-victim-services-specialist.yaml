market_example:
  summary: "Matches crime victims with appropriate support specialists — trauma counsellors, court preparation workers, restitution advisors, and language-specific support — by crime type, language, and cultural context, filling the gap left by fragmented victim services agencies with no shared intake or discovery system."
  problem: "Canada's victim services landscape is fragmented across hundreds of agencies funded by federal, provincial, and municipal governments plus private nonprofits. A victim of domestic violence needs different support than a victim of fraud; a Mandarin-speaking victim of elder abuse needs different resources than an English-speaking victim of sexual assault. Crown attorneys and police-based victim services units are supposed to connect victims with appropriate support, but they rely on outdated contact lists and personal knowledge. When the right specialist cannot be found — a trauma counsellor who speaks Tigrinya, a restitution advisor with experience in complex fraud, a court preparation worker available before Thursday's preliminary hearing — the victim goes unsupported, trials are weakened by unprepared witnesses, and public confidence in the justice system erodes."
  dominant_forces:
    - "Fragmentation — victim services are delivered by hundreds of agencies with separate intake processes, eligibility criteria, and specializations, with no shared discovery infrastructure"
    - "Specificity of need — victims' support requirements vary enormously by crime type, language, cultural context, disability, and stage of proceedings, making generic referral inadequate"
    - "Temporal urgency — court dates create hard deadlines; a victim who cannot access court preparation support before a preliminary hearing may give inconsistent testimony, damaging the prosecution"
  deeperpoint_fit: "CoSolvent aggregates the real-time capacity of victim services specialists across agencies: trauma counsellors (by crime-type specialization and language), court preparation workers, Victim Impact Statement coaches, restitution advisors, and culturally specific support workers. KnowledgeSlot curates the eligibility requirements and available services by province, including Victim Quick Response Program criteria, Criminal Injuries Compensation Board processes, and court-based vs. community-based service distinctions. Matching aligns the victim's specific needs to available specialist capacity within the court timeline."
  economic_upside: "Provincial victim services programs collectively serve hundreds of thousands of victims annually. Improved matching reduces trial adjournments caused by unprepared witnesses (estimated $2,000–$10,000 per adjournment), increases restitution recovery rates, and improves victim satisfaction scores that governments track as justice system KPIs. Platform monetized via provincial Ministry contracts ($50,000–$150,000/year) and agency subscriptions ($499–$999/year)."

