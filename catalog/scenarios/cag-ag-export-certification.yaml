market_example:
  summary: "Canadian agricultural exporters entering new overseas markets — Indonesian pulse importers, Vietnamese honey buyers, Indian maple syrup distributors — face phytosanitary, pesticide MRL compliance, and market-access certification requirements that are country-specific, constantly evolving, and rarely documented in the consultants their trade commissioners can refer them to."
  problem: "Canada exports $70B+ in agricultural and agri-food products annually, but the export complexity for new market entries is concentrated at the certification and phytosanitary compliance stage. Each destination market has its own phytosanitary import requirements, maximum residue limit (MRL) schedules for pesticides and contaminants, halal or kosher certification requirements, country-of-origin documentation requirements, and CFIA export certificate formats. An Ontario honey producer seeking to export to China navigates CFIA honey export certificate requirements, Chinese customs registration for overseas food manufacturers, pesticide residue MRL schedules that differ from Canadian limits, traditional Chinese medicine market positioning for specific botanical origins, and Mandarin-language label requirements. A Saskatchewan lentil exporter targeting Vietnam needs Vietnamese phytosanitary import permit requirements, container fumigation protocols acceptable to Vietnamese customs, the specific CFIA export certificate format the Vietnamese NAPPO counterpart authority will accept, and the Vietnamese import duty classification that applies to their specific lentil size grade. This country-specific, commodity-specific compliance knowledge is held by a small number of agricultural trade specialists who have done business in those markets — and who are entirely invisible to the Canadian exporter relying on a trade commissioner's contact list."
  dominant_forces:
    - "Participant scarcity — export compliance specialists with current in-country knowledge for specific destination markets and commodity categories are a small professional population; the combination of Vietnam phytosanitary requirements and lentil-specific documentation is a narrow subspecialty even within the already small agricultural trade consulting community"
    - "Knowledge depreciation — phytosanitary requirements and MRL schedules change continuously; a consultant's Vietnam market knowledge from three years ago may be materially incorrect for the current import season"
    - "Trust and credential specificity — the exporter committing to a container of product needs a compliance consultant with verifiable recent track record in the specific market and commodity, not a general trade consultant who will research the requirements from scratch"
    - "Temporal pressure — export orders create documentation deadlines; CFIA export certificate applications, fumigation certifications, and pre-shipment inspections have booking windows that cannot be extended"
    - "Language and jurisdiction complexity — in-country regulatory relationships often require multilingual specialist capacity that is independent of the technical compliance knowledge"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (destination country experience by commodity category, current engagement level in destination market, CFIA export certificate type experience, fumigation protocol expertise, in-country regulatory relationship record, language capability, recent market entry track record) against exporter demand signals (commodity type, destination market, certification required, container timeline, specific compliance challenge). CommonContext encodes current phytosanitary requirements by country-commodity combination as a regularly updated knowledge asset."
  economic_upside: "A failed export shipment — rejected at the destination port for phytosanitary non-compliance or MRL violation — costs the Canadian exporter $50,000–$300,000 in cargo value, fumigation or disposal costs, and lost market relationship. Canadian agricultural export value to Asian markets alone exceeded $12B in 2024; China, Vietnam, Indonesia, and India represent the highest-growth destination markets for Canadian pulse crops, honey, maple syrup, and cereal grains. The compliance failure rate for first-time Canadian exporters entering these markets is estimated at 15–25% per first shipment — a systemic waste that a specialist matching platform can reduce significantly."

