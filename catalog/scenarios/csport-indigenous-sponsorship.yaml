market_example:
  summary: "Indigenous sport organizations need corporate sponsors aligned with reconciliation commitments, while corporations with Indigenous community investment mandates cannot discover authentic, well-governed sport programs that match their sector, geography, and partnership objectives."
  problem: "Indigenous sport organizations — provincial Indigenous Sport Bodies (ISBs), Aboriginal Sport Circles, and community-level programs — need corporate sponsors and government funding partners but have limited capacity to identify, approach, and steward the right organizations. Meanwhile, corporations with Indigenous community investment mandates (driven by UNDRIP commitments, ESG reporting, and reconciliation action plans) struggle to identify authentic, well-governed sport programs that match their geography and partnership intent. Most Indigenous sport funding flows through government intermediaries rather than through direct corporate partnerships — creating inefficiency on both sides."
  dominant_forces:
    - "Opacity — Indigenous sport programs have minimal web presence; corporate sponsor development officers have no systematic way to discover them"
    - "Search friction — no coordinated national registry of Indigenous sport programs with governance ratings, program reach data, and sponsorship opportunity descriptions exists"
    - "Offering complexity — each program offers a unique combination of sport type, community reach, geographic presence, cultural mandate, governance maturity, and partnership needs"
    - "Trust deficit — corporate sponsors need assurance of program governance and fund stewardship; Indigenous programs need assurance that sponsors will respect community protocols"
    - "Information asymmetry — corporations do not know what authentic partnership looks like in specific Indigenous communities; programs cannot assess which corporate partners have genuine reconciliation commitments vs. performative intent"
  deeperpoint_fit: "KnowledgeSlot curates Sport Canada funding frameworks, Indigenous Sport Body governance standards, UNDRIP principles applicable to sport partnerships, and TRC Calls to Action related to sport. Semantic matching encodes program profile (sport, community reach, governance level, geographic region, cultural mandate) against sponsor objectives (sector, geography, ESG framework, partnership budget, reporting requirements). The trusted intermediary protocol handles sensitive community governance details and corporate budget flexibility without premature one-sided disclosure. Psychological framing presents opportunities in ways that speak to different corporate motivations — brand authenticity, employee engagement, supply chain reconciliation — without misrepresenting program values."
  economic_upside: "Better matching between corporate sponsors and authentic Indigenous programs would increase direct corporate resource flow to community programs, reduce government intermediation overhead, and support the development of Indigenous athletes who face systemic barriers. It enables corporations to fulfil reconciliation commitments in a meaningful, measurable way consistent with TRC Calls to Action and UNDRIP obligations."

sponsor_opportunities:
