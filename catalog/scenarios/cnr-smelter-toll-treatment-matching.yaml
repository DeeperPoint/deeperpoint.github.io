market_example:
  summary: A B2B platform matching junior and mid-tier mine operators with episodic concentrate
    surpluses or single-season production with smelters and refineries that have spare toll
    treatment capacity—solving a capital-intensive market failure that forces small producers
    out of production when they cannot secure a term smelting contract.
  problem: "Processing concentrated mineral output into refined metal requires access to a
    smelter or refinery, typically under a long-term 'smelting contract' that fixes the terms
    for concentrate payment, penalty elements, treatment charges, and refining charges over
    multiple years. The major mining companies have no difficulty securing these arrangements;
    they have the production volume and the corporate relationships that smelters require for
    long-term offtake commitments. The market failure falls on small producers: a junior mine
    operator whose copper-gold deposit produces 2,000 tonnes of concentrate per year—far below
    the minimum commitment threshold for most Canadian smelters' standard contracts—has essentially
    no path to toll treatment. The smelters that do accept toll treatment (ad-hoc processing of
    concentrate on a per-tonne basis when their own feed is short) have no transparent mechanism
    to advertise available windows, and the junior producer has no mechanism to discover them.
    Several Canadian and US copper-gold producers have failed to begin commercial production, or
    have suspended production after startup, not because of geological failure but because they
    could not secure toll treatment—a $0 capital cost solution to a problem that conventional
    financing cannot solve."
  dominant_forces:
    - "Smelter and refinery minimum throughput requirements systematically exclude small producers
      from term contracts, creating a structural access gap at exactly the production scale where
      junior mines operate."
    - "Toll treatment windows—when a smelter has spare capacity between major feed contracts—are
      sporadic, short-notice, and communicated only through existing relationship networks."
    - "Concentrate specifications (penalty elements, moisture content, particle size distribution)
      are highly variable and must match the smelter's circuit design, making generic commodity
      brokerage inadequate for toll treatment matching."
  deeperpoint_fit: "KnowledgeSlot models the concentrate specification matching problem: copper
    grades, arsenic and bismuth penalty element profiles, silver and gold credits, moisture ranges,
    and particle size distributions are matched against each smelter's circuit tolerance profiles
    and current campaign schedules. CoSolvent manages the B2B matching: a junior producer's
    concentrate production specification is matched against smelter toll treatment availability
    windows with the specificity required to produce a viable term sheet, not just a general introduction."
  economic_upside: "A single toll treatment agreement enabling a small copper-gold mine to begin
    or sustain production represents $5–50M in annual gross revenue for the mine operator.
    The platform captures a brokerage margin on matched toll treatment volume—a portion of a
    market that is currently entirely opaque and relationship-gated. Governments seeking to
    develop Canadian critical mineral processing capacity have direct policy interest in funding
    the platform as supply-chain infrastructure."
