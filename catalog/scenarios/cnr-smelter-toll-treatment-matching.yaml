story:
  title: The Concentrate in the Shed
  status: draft
  blog_slug: ""
  characters:
    - "Lena - COO, small copper-gold mine in northern British Columbia"
    - "David - Commercial Manager, Canadian smelter and refinery complex"
  summary: "A small BC copper-gold mine on the verge of suspending production secures toll
    treatment access through a concentrate-specification matching platform, avoiding a shutdown
    that would have put 47 people out of work."
  body: |
    ## Act A - The Market Structure

    The mining industry has a processing bottleneck that is almost never discussed because
    it primarily affects companies too small to have investor relations staff to talk about it.

    Copper production requires a copper smelter, and copper smelters need volume. A major
    mine has no problem securing a term smelting contract; its production justifies the
    smelter's fixed overhead. A small mine producing 2,000 tonnes of concentrate per year—less
    than a week's throughput for a major Canadian smelter—is structurally invisible to the
    term contract market. The only path is toll treatment: paying a smelter to process
    concentrate on a spot basis during feed gaps. But toll treatment windows are communicated
    through the same relationship networks that the small producer was excluded from in the
    first place.

    ---

    ## Act B - The Story

    **Lena** is staring at 800 tonnes of copper-gold concentrate in a warehouse on a haul road
    in northern BC. The mine has been operating for seven months. Both of the smelters their
    Vancouver broker introduced them to declined: one because the arsenic penalty profile
    exceeds their circuit tolerance, one because they have no available campaign slot until
    Q3 next year. If the concentrate doesn't move within 60 days, Lena will need to suspend
    production—her bonded storage limit is finite and the next ore parcel is ready.

    **David's** smelter has a six-week toll treatment window opening in three weeks because a
    major feed contract customer moved their shipment. He needs concentrate that is compatible
    with his reverberatory furnace's arsenic tolerance and that can be delivered in two tranches.
    His commercial team posted the availability in industry newsletters. Nobody who matched
    his specification has seen it.

    Lena's metallurgist uploads a concentrate specification to the platform: copper grade,
    arsenic content, bismuth, lead, silver credit, moisture. David's commercial team has
    already registered the smelter's circuit specifications and the available window. The
    match is automatic. The platform generates a draft toll treatment term sheet specifying
    treatment charges, penalty deductions, metal credits, and delivery schedule. Lena's
    logistics coordinator books the trucks within 48 hours of the match. The mine stays open.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Toll treatment availability is one of the most valuable pieces of information in the
    small-mine value chain, and it circulates through a handful of relationship conversations
    that most small producers are never part of. DeeperPoint builds the specification-matched
    broker layer that turns a closed network into an open, transparent market—keeping small mines
    in production when they should be operating.

    *Characters are fictional. The toll treatment access gap for small Canadian producers is real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
