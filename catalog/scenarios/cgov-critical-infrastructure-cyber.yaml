market_example:
  summary: "Canadian municipal and provincial governments operating critical infrastructure — water treatment, transit, power distribution — cannot rapidly identify and retain cybersecurity specialists with operational technology (OT) security experience specific to their infrastructure category when facing incidents or conducting security assessments."
  problem: "The cybersecurity threat to Canadian municipal critical infrastructure is well-documented by the Communications Security Establishment. The gap in the response capability is not awareness — it is specialist access. OT security for water treatment control systems is a different discipline from IT network security. ICS/SCADA security for transit control systems is not the same expertise as SCADA security for power grid management. Municipalities and provincial agencies seeking OT security specialists for their specific infrastructure category find that the national pool is small, concentrated in a handful of consulting firms, and in extremely high demand. When an incident occurs — a ransomware intrusion into a water treatment SCADA system, an anomalous access event in a transit control network — the municipality has hours to identify response capacity. Their procurement mechanisms take weeks."
  dominant_forces:
    - "Participant scarcity — OT cybersecurity specialists with infrastructure-category-specific experience are genuinely rare; Canada's ICS/SCADA security practitioner community numbers in the hundreds nationally"
    - "Offering complexity — OT security fit requires matching on specific control system manufacturer experience (Siemens, Honeywell, Rockwell), infrastructure category (water, transit, power), incident type (ransomware vs. intrusion vs. insider threat), and regulatory framework (CSE guidelines, NERC CIP for power)"
    - "Urgency — critical infrastructure incidents have hour-scale response windows; government procurement mechanisms operate on day-scale timelines"
    - "Trust deficit — municipalities require cleared practitioners for infrastructure security work; Security Clearance validation takes weeks through standard channels"
    - "Market concentration — a small number of consulting firms hold most of the OT security talent; sole-sourcing those firms is expensive and creates dependency"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (OT platform experience by manufacturer and version, infrastructure category expertise, incident response methodology, active security clearance status, current availability) against municipal demand signals (infrastructure category, control system manufacturer, incident type or assessment scope, urgency tier, clearance requirement). The pre-cleared specialist layer maintains validated clearance status so cleared practitioners can be deployed without the standard CSE validation delay during incident response. KnowledgeSlot curates CSE critical infrastructure protection guidelines, NERC CIP standards for power sector, and the CISA ICS advisory database."
  economic_upside: "A successful ransomware attack on municipal water treatment infrastructure carries direct remediation costs of $1–5 million plus weeks of manual operation risk. A proactive OT security assessment that identifies and closes the vulnerability costs $80,000–$200,000. The economic case for better specialist access is clear; the barrier is discovery and procurement speed, not budget."

