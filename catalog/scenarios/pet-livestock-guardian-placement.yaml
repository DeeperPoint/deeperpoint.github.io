market_example:
  summary: "Livestock producers losing animals to coyotes, wolves, bears, and eagles need livestock guardian dogs bred and raised for working temperament, but cannot find responsible working-line breeders whose dogs are appropriate for their specific predator threat, terrain, and livestock type — while working-line breeders cannot find verified farm placements that will work their dogs appropriately."
  problem: "Livestock guardian dogs — Great Pyrenees, Maremma Sheepdogs, Akbash, Kangal, Anatolian Shepherds — are the most effective non-lethal predator deterrent for sheep, goat, poultry, and cattle operations. But the market for placing working guardian dogs on farms is severely broken. Most 'Great Pyrenees breeders' produce companion animals — dogs bred for appearance and temperament suitable for suburban homes, not for the independent judgment, territorial instinct, and weather tolerance required to guard livestock in a Canadian winter. A sheep farmer in the Cariboo region of BC who is losing lambs to coyotes needs a dog from working parents who have guarded livestock — not a show-line puppy that will chase the sheep. The working-line breeders who produce appropriate dogs are small operations, often on farms themselves, with no online presence beyond a Facebook page. They select buyers carefully — a guardian dog placed in a suburban home becomes a liability — but have no way to verify that prospective buyers are genuine livestock producers with appropriate conditions. The farmer has no way to find them. The breeder has no way to verify the farmer. Both sides are guessing."
  dominant_forces:
    - "Working-line vs. show-line opacity — the critical distinction between dogs bred for livestock guardian temperament and dogs bred for companion appearance is invisible in breed registries and generic breeder directories"
    - "Placement verification — working-line breeders need to verify that buyers are genuine livestock producers with appropriate conditions; no current mechanism provides this verification"
    - "Predator-specific matching — different guardian breeds and breeding lines have different strengths (size for wolf country, agility for coyote pressure, heat tolerance for southern climates); matching dog to threat requires breed-specific knowledge"
    - "Geographic fragmentation — working-line breeders are scattered across rural Canada with minimal online presence"
  deeperpoint_fit: "Semantic matching encodes breeder profiles (breed, working-line verification with parent working history, predator types parents have guarded against, livestock types guarded, climate tolerance, litter availability timeline, placement screening requirements) against farm demand signals (livestock type, predator threat, property size, terrain, climate, existing guardian dogs, fencing infrastructure, experience level). KnowledgeSlot curates breed-specific guardian dog husbandry and training protocols."
  economic_upside: "Canadian livestock predation losses exceed $50M annually. Livestock guardian dogs reduce predation by 80–95% where properly deployed. The working guardian dog market — puppies, trained dogs, and breeding stock — is estimated at $5–15M annually in Canada. A platform that improves working-line placement matching generates $500K–1.5M in facilitated sales and measurably reduces livestock predation losses."

