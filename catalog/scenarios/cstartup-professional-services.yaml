market_example:
  summary: "Founders in remote communities cannot efficiently find lawyers, accountants, and IP professionals with genuine startup experience at startup-stage pricing, while startup-savvy professionals in mid-size cities cannot signal their expertise to founders in adjacent smaller communities."
  problem: "Founders in remote communities — when they need a lawyer who understands option pool structures, a startup-experienced accountant who knows SR&ED and IRAP, or an IP professional who can handle a PCT filing without Bay Street rates — cannot efficiently find service providers willing to work at startup-stage pricing with genuine startup context knowledge. Meanwhile, lawyers, accountants, and IP professionals in mid-size cities who have developed startup expertise cannot signal that expertise to founders in adjacent smaller communities and distinguish themselves from general practice firms that charge the same rates with a fraction of the startup context. Founders default to general practice advisors locally, resulting in cap table errors, missed SR&ED claims, and unprotected IP that compound as costly structural failures."
  dominant_forces:
    - "Opacity — startup-savvy professional service providers in smaller cities have minimal web presence that reveals genuine startup expertise; founders cannot determine from generic firm websites whether startup experience is real"
    - "Search friction — no searchable directory of Canadian startup-experienced professional service providers indexed by startup domain expertise, geographic coverage, startup-stage pricing, and remote service model exists"
    - "Trust deficit — professional advice is high-stakes; founders need confidence in startup-specific expertise before disclosing sensitive corporate, financial, and IP matters"
    - "Geographic distance — remote founders cannot easily access major-hub startup legal communities; they default to local general practice firms that lack startup context"
    - "Offering complexity — each founder's professional service need is discrete: a specific combination of corporate structure, financing, IP protection, employment, and regulatory advice whose configuration depends on industry, stage, and investment structure"
  deeperpoint_fit: "Semantic matching encodes service provider profile (startup domain expertise, stage experience, SR&ED/IRAP familiarity, remote service model, pricing tier, geographic coverage) against founder need (corporate stage, financing situation, IP portfolio, current gaps, budget). The trusted intermediary protocol manages confidential disclosure of corporate and financial details to pre-screened professional service providers. KnowledgeSlot curates SR&ED claim frameworks, provincial startup grant corporate eligibility requirements, NRC-IRAP administrative requirements, provincial securities exemptions for startup fundraising, and PCT filing timelines. Facilitator slots accommodate law society referral services and BDC startup advisory program referral networks."
  economic_upside: "Legal and accounting mismatch is among the most common causes of preventable startup failure — cap table errors, missed SR&ED claims, improper share structure, and unprotected IP are problems that compound over time. Better matching between remote founders and startup-experienced advisors would reduce these structural failures significantly and extend the effective reach of Canada's startup professional services community beyond the major hubs."

