market_example:
  summary: "Federal and territorial governments managing infrastructure in permafrost zones — roads, buildings, water systems — cannot efficiently identify permafrost geotechnical engineers, northern structural engineers, and climate adaptation specialists specific to the warming rates and soil conditions of the project location."
  problem: "Climate-driven permafrost degradation is creating an infrastructure maintenance and design crisis across Canada's northern territories and northern provincial regions. Thawing permafrost is destabilizing roads, airstrips, water and sewage systems, and buildings in dozens of northern communities. Designing and rehabilitating this infrastructure requires geotechnical engineers with specific permafrost knowledge — not just cold-region engineering generally, but permafrost creep, ice-rich soil behaviour under warming, and the specific foundation systems (thermopiles, passive cooling, pile adjustment) applicable to Canadian permafrost zone conditions. This expertise is concentrated at three or four universities and a small number of engineering firms, most headquartered in southern Canada. Territorial and federal project managers searching for this expertise through standard engineering directory channels consistently encounter firms that claim cold-region experience but lack permafrost-specific knowledge — a distinction that is not legible in standard professional registrations."
  dominant_forces:
    - "Participant scarcity — permafrost-specific geotechnical engineering expertise is genuinely rare; the Canadian active research and consulting community numbers in the dozens"
    - "Opacity — permafrost-specific competency is indistinguishable from general cold-region engineering in standard professional registration databases and engineering firm directories"
    - "Climate urgency — accelerating permafrost warming rates mean design standards from ten years ago are no longer adequate; only practitioners current with active permafrost research can specify to the appropriate warming rate scenario"
    - "Geographic remoteness — project sites in Yukon, NWT, Nunavut, and northern Quebec require practitioners willing to conduct site investigations in remote conditions; not all qualified practitioners are willing or equipped to do so"
    - "Indigenous community context — northern infrastructure projects in Indigenous communities require awareness of community governance, land use priorities, and cultural context that southern engineering firms frequently lack"
  deeperpoint_fit: "Semantic matching encodes practitioner profiles (permafrost subtype expertise by active layer depth and ice-content classification, specific foundation system experience, northern site investigation capacity, warming rate modelling methodology, community-based project experience) against project demand signals (geographic location, permafrost zone classification, infrastructure type, climate scenario in use, community governance context, project stage). KnowledgeSlot curates NRC permafrost engineering guidelines, Arctic Climate Impact Assessment warming projections by region, and territorial building and infrastructure standards."
  economic_upside: "The federal government has committed $400 million to northern and remote infrastructure adaptation. Infrastructure failure from permafrost degradation in northern communities carries remediation costs of $2–10 million per facility. Competent permafrost-specific engineering at the design stage reduces failure risk by an order of magnitude. Better specialist matching accelerates project delivery and reduces the probability of repeat infrastructure failures in communities that cannot absorb the service disruption."

