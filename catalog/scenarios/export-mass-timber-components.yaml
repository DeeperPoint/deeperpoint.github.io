market_example:
  summary: A platform matching Canadian manufacturers of engineered mass timber components
    with large-scale sustainable commercial and residential developments in the US
    and Europe.
  problem: Exporting Canadian Cross-Laminated Timber (CLT) to Global Construction
    Markets
  dominant_forces:
  - Global push for low-carbon construction materials.
  - Canadian forestry is shifting to high-value engineered products.
  - Logistics and structural certification are major barriers to trans-national timber
    trade.
  deeperpoint_fit: Matching requires deep integration with architectural plans and
    structural specs. Projects have long lead times, requiring capacity booking far
    in advance. Chain-of-custody sustainability certification is non-negotiable.
  economic_upside: Enables reliable international scaling for Canadian mass timber
    plants. De-risks supply chain for mega-projects seeking green building certifications.
