market_example:
  summary: "Pharmaceutical sponsors running Phase II and III trials in rare disease and specialty therapeutic areas cannot efficiently identify Canadian clinical trial sites and principal investigators with the enrolled patient population, subspecialty clinical experience, and GCP compliance infrastructure required by their protocol — extending timelines by months and inflating per-patient costs."
  problem: "Clinical trial site selection is among the most time-consuming and failure-prone activities in pharmaceutical and device development. A Phase II trial in a rare metabolic disease needs a principal investigator with an active patient cohort in the specific disease, GCP-trained coordination staff, and a site infrastructure capable of processing and storing biospecimens under protocol-specified conditions. The sponsor's medical affairs team searches through registry databases — ClinicalTrials.gov, clinical research network databases, regulatory agency site lists — that index sites by general therapeutic area and trial volume but do not capture the precision attributes that determine protocol fit: current patient population in the exact disease subtype, prior experience with the specific biomarker assessments the protocol requires, staff capacity for the site's current enrollment obligation, and regulatory inspection history. The result is site selection processes that run four to eight months, sites that enrol one or two patients before losing capacity, and sponsor budgets that bear the cost of re-qualifying replacement sites."
  dominant_forces:
    - "Participant scarcity — principal investigators with active patient cohorts in rare disease subtypes are a genuinely small professional population; the difference between a PI with twelve active rare metabolic disease patients and one with two is a protocol viability determination"
    - "Offering complexity — protocol fit requires simultaneous alignment on disease subtype, biospecimen handling infrastructure, staff GCP training, current site enrollment capacity, and regulatory inspection standing"
    - "Patient population opacity — a site's current enrolled patient cohort in a specific disease subtype is not indexed in any registry; it is known only to the PI and the site's patient roster"
    - "Infrastructure verification — GCP compliance, biospecimen storage, and protocol-specific laboratory capability must be verified, not assumed from prior trial participation"
    - "Timeline pressure — clinical trial initiation timelines are set by protocol regulatory approval; each month of delayed site activation costs sponsors $150,000–$500,000 in extended phase timelines"
  deeperpoint_fit: "Semantic matching encodes site and PI profiles (therapeutic area specialization by disease subtype, current patient cohort composition by diagnosis, biospecimen and laboratory capability, staff GCP training current status, regulatory inspection history, current enrollment capacity and active trial commitments) against sponsor demand signals (therapeutic area, disease subtype, protocol biospecimen requirements, enrollment timeline, site geographic requirement, language requirement for patient population). KnowledgeSlot encodes GCP regulatory requirements and protocol-specific site qualification criteria as structured knowledge assets."
  economic_upside: "A Phase II rare disease trial with twenty enrolled patients costing $30,000 per patient represents a $600,000 enrollment investment at each site. A site that enrols two patients before capacity failure — requiring re-qualification of a replacement site — costs the sponsor $400,000–$600,000 in wasted activation and re-qualification expense, plus two to four months of timeline extension. The global clinical trial site selection market is estimated at $4B+ annually; Canada's share is proportionally large given its per-capita research productivity and public health system infrastructure that creates accessible patient cohorts."

