story:
  title: "The Premium That Built Nothing"
  status: draft
  blog_slug: ""
  characters:
    - "Conrad - VP Finance and Risk, mid-size trucking and logistics company, Saskatoon"
    - "Josephine - captive insurance actuary and formation specialist, Winnipeg"
  summary: "A Saskatoon trucking company paying $4.2M annually in commercial insurance
    premiums—with consistently below-market loss ratios that enrich their insurer year
    after year—is matched with a captive feasibility actuary who structures a group captive
    with three compatible Prairie logistics operators, redirecting the underwriting profit
    to the companies generating it."
  body: |
    ## Act A - The Market Structure

    Commercial insurance is priced at the portfolio level: the insurer aggregates premiums
    from hundreds of accounts and prices each account based on its expected contribution
    to portfolio loss. A company with a consistently below-average loss ratio—one that
    has paid in far more than it has ever collected—is nonetheless priced at a rate that
    subsidizes the rest of the portfolio. The insurer has no mechanism and no incentive
    to return the underwriting profit to the low-loss-ratio insured.

    Captive insurance solves this structurally. A company forms a subsidiary to insure
    its own risks. The subsidiary collects the premium the parent would have paid to a
    commercial insurer, invests it, and retains the underwriting profit when losses are
    below expectation. Over time, the captive accumulates capital that represents the
    underwriting profit the company would otherwise have donated to commercial insurers.
    The economics are compelling for the right risk profile. The access barrier is severe
    for companies that have never operated in the specialist captive formation market.

    ---

    ## Act B - The Story

    **Conrad** manages risk for a Saskatoon trucking and logistics company with 340 power
    units operating across the Prairies. The company's five-year loss ratio across its
    commercial insurance program averages 38%—meaning it has recovered 38 cents for every
    dollar of premium paid. Its commercial insurer renews the account willingly each year
    at a modest rate reduction. Conrad knows his company is a profitable account for the
    insurer. He has no framework for quantifying what a captive structure would look like,
    no introduction to the actuarial specialists who could evaluate the economics, and no
    knowledge that the BC Protected Cell Company framework has been operational since 2021
    and would allow a domestic Canadian captive domicile without an offshore structure.

    **Josephine** is a consulting actuary specializing in captive feasibility for transportation
    and logistics companies in Western Canada. She has completed thirty-two captive feasibility
    assessments, eight of which proceeded to formation. Her practice is known in the captive
    domicile and fronting carrier community; it is invisible to the commercial risk management
    community in Saskatchewan. Conrad's commercial broker has never mentioned her name.

    Conrad describes his company's situation on the specialist platform: trucking and logistics,
    $4.2M annual commercial premium, 5-year average loss ratio 38%, interest in evaluating
    alternative risk transfer. Josephine's profile surfaces: captive feasibility, transportation
    and logistics specialty, Western Canada, BC PCC experience. Conrad engages Josephine for
    a feasibility assessment. Her analysis confirms the captive economics are compelling.
    She identifies three compatible Prairie logistics companies—non-competing, similar risk
    profiles, comparable loss ratios—and proposes a group captive structure. The group captive
    is formed within fourteen months. Year one of captive operation, the combined underwriting
    profit that would have accrued to the commercial insurer remains within the group captive.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Conrad's company has been generating underwriting profit for a commercial insurer for
    fifteen years because he lacked an introduction to an actuary who could demonstrate
    that the profit belonged in his captive. Josephine's practice could evaluate dozens
    more commercial accounts per year than she currently receives as referrals—but her
    referral network reaches only the reinsurance brokers and domicile attorneys who already
    know her. The companies most likely to benefit from captive evaluation are the ones
    least likely to have the specialist connections to initiate it.

    The captive formation market is not broken because captives are complicated. It is broken
    because the information connecting candidate companies to formation specialists is absent
    from the commercial insurance market where risk management decisions are made.

    *Characters are fictional. Captive insurance economics for below-market loss ratio commercial
    accounts and the BC Protected Cell Company framework are factual.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
