market_example:
  summary: "Mid-market Canadian companies with unusual risk profiles, hard market premiums,
    or recurring uncovered losses can self-insure through a captive insurance structure—
    but the formation process requires specialist actuaries, domicile counsel, and fronting
    carriers whose market access is invisible to the firms that would benefit most.
    A matching platform connects captive candidates with the right specialists across
    formation, domicile, and ongoing captive management."
  problem: "A captive insurance company is a subsidiary formed to insure the risks of its
    parent. For the right risk profile—a firm with predictable, high-frequency losses in
    categories the commercial market prices expensively—a captive converts insurance
    premium outflow into a self-funding structure where underwriting profit accumulates
    within the corporate group. The structural problem is that captive formation and
    operation require a specialist ecosystem: a captive feasibility actuary to determine
    whether the risk profile is suitable and the minimum premium volume is adequate; a
    domicile lawyer in the selected jurisdiction (Cayman, Vermont, Barbados, or the emerging
    BC Protected Cell Company framework); a fronting carrier willing to write admitted paper
    and cede back to the captive; a captive manager who handles regulatory compliance and
    investment management; and a reinsurance broker to structure any excess-of-loss
    protection. None of these specialists operate in the standard commercial insurance
    market, and none are reachable through a standard commercial broker relationship.
    Canadian mid-market firms—typically at $3–25M annual insurance premium where captive
    economics become compelling—routinely over-pay for commercial insurance for years
    because they lack the introduction to a captive feasibility specialist who could evaluate
    their program in a single engagement. Group captives—where multiple non-competing
    companies in the same industry share a captive structure—multiply the access problem:
    the organizer of a group captive must simultaneously find domicile counsel, fronting
    carriers, and a critical mass of member companies whose aggregate premium justifies
    formation, each a thin market matching problem on its own."
  dominant_forces:
    - "Captive formation requires coordinated access to five specialist categories—actuarial,
      domicile legal, fronting carrier, captive manager, and reinsurance broker—none of
      whom can be sourced through the standard commercial insurance purchasing process,
      and whose joint availability creates a coordination problem no individual specialist
      can solve alone."
    - "Hard market cycles in commercial insurance—where standard lines premiums rise 20–40%
      over 2–3 years—create sudden captive economics for firms that were previously satisfied
      with the commercial market, generating episodic demand spikes for captive specialists
      that expose the matching infrastructure deficit."
    - "The emergence of protected cell company legislation in British Columbia creates a new
      Canadian domestic captive option, expanding addressable demand to firms that previously
      rejected captive formation due to offshore domicile complexity—but the BC PCC
      framework is new enough that few commercial brokers or risk managers understand its
      availability."
  deeperpoint_fit: "CommonContext encodes the captive formation specialist ecosystem: actuarial
    firms with captive feasibility methodology, domicile-specific legal counsel organized by
    jurisdiction, fronting carriers with captive cession programs by risk class, captive
    managers organized by domicile and captive size, and reinsurance brokers with excess-of-loss
    captive experience. CoSolvent matches a candidate firm's risk profile—annual premium,
    loss history, risk categories, domicile preference—against the appropriate specialist
    combination, identifying which specialists are jointly available and whether a group
    captive formation could aggregate the candidate with compatible non-competing peers."
  economic_upside: "The North American captive insurance market manages over $100B in premium
    annually through more than 7,000 licensed captives. The Canadian mid-market segment—firms
    at $3–25M in commercial premium who would benefit from a captive or group captive but
    lack access to the formation ecosystem—is estimated to represent 500–1,000 prospective
    captive members. A platform enabling 50 new captive formations in its first three years
    generates approximately $500M in premium transition from commercial markets to captive
    structures, with platform revenue via specialist subscription fees and facilitated
    formation project fees."

