market_example:
  summary: "Food entrepreneurs at the pre-commercial stage cannot find food technologists willing to take small-client early-stage engagements; qualified practitioners are invisible in discovery channels food entrepreneurs actually use."
  problem: "Food entrepreneurs with a home kitchen recipe or farmers' market product need food technologists to solve shelf stability, pH validation, nutritional labelling, allergen declaration, CFIA compliance, and co-manufacturing specification problems before they can reach retail. Qualified food technologists with small-client early-stage experience exist but are not visible in entrepreneurship-facing channels. Discovery happens through incubator referrals, university food science networks, and peer connections that systematically favour well-connected founders."
  dominant_forces:
    - "Participant scarcity — food technologists willing to take small-client early-stage work are a subset of the broader food science community"
    - "Opacity — food technology consulting practices are not aggregated by service type, food category, or minimum engagement scale"
    - "Cognitive overload — an entrepreneur who doesn't know what they don't know cannot specify what type of food science help they need"
    - "Offering complexity — scope varies enormously: water activity assessment (2 days) vs. full shelf life study (3 months) are both 'food science help'"
    - "Trust deficit — early-stage entrepreneurs cannot absorb the cost of an engagement that doesn't solve their actual problem"
  deeperpoint_fit: "Semantic matching aligns entrepreneur profiles (product category, intended market, specific problem, regulatory stage, budget, timeline) against food technologist profiles (specialization by category and technical discipline, small-client experience, engagement scope offered, geographic or remote service). CommonContext curates CFIA food labelling requirements, Health Canada nutritional labelling methodology, water activity and pH thresholds for shelf-stable classification, and standard sensory evaluation protocols. The Generative Match Story diagnoses the technical problem the entrepreneur cannot articulate — converting a vague 'I need help with my recipe' into a structured technical project brief."
  economic_upside: "Product development failure is a primary cause of attrition among early-stage Canadian food entrepreneurs. A well-matched food technologist engagement at the beginning of product development prevents much more expensive failures discovered at retail listing or — worse — after product is in market."

