title: "Selling an Innovation into a Health Authority: Making the Approval Path Visible Before the Pilot"
card_title: "Selling an Innovation into a Health Authority"
sector: canadian-healthcare-support
sub_sector: "Health Technology Adoption and Procurement"
forge_tier: 3
