market_example:
  summary: "Solar-powered cooling hubs are being deployed across Ethiopia's produce corridors — but smallholder farmers cannot access them because no matching mechanism exists between their harvest windows and hub capacity. A time-slot matching platform resolves the cold chain access problem without building new infrastructure."
  problem: "Ethiopia loses 20–35% of its fresh produce to post-harvest damage. Solar cold hubs operated by cooperatives and private investors (SokoFresh-model, Cooling as a Service) are emerging in key corridors — the Meki-Addis corridor, Hawassa valley, Bale highlands. But these hubs operate at 40–60% capacity utilization because smallholder farmers cannot book time slots, don't know what the hub will pay for their produce grade, and have no mechanism to coordinate harvest timing with hub availability. Meanwhile, the hub operators have excess cold storage capacity on off-peak days that goes empty. This is a classic two-sided thin market: supply and demand are physically proximate but informationally disconnected."
  dominant_forces:
    - "Discovery failure — Farmers within 15 km of a cold hub do not know the hub's capacity, pricing, or grade requirements on any given day"
    - "Temporal mismatch — Harvests peak unpredictably; hub operators cannot schedule capacity without advance booking"
    - "Trust deficit — Farmers who have never used a hub do not trust that their produce will be stored safely or that payment will follow on the schedule promised"
    - "Quality standard gap — Smallholder farmers do not know the grading standards required for hub acceptance and premium pricing"
    - "Information asymmetry — Hub operators cannot see which farmer clusters in their catchment area are approaching harvest stage"
  deeperpoint_fit: "CoSolvent builds farmer profiles with harvest calendar data (crop type, estimated harvest date, estimated volume) and cold hub profiles with capacity schedules, grade requirements, and pricing tiers. A time-slot matching layer connects approaching harvest clusters to available hub capacity — farmers receive voice or SMS confirmation of their slot, grade requirements, and expected payment before harvest begins. CommonContext delivers grade standards in Amharic (GAIN's E-PLAN grading protocols), proper crate handling guides, and hub payment terms — building farmer competence before the first transaction. The platform's transaction records become the basis for cooperative input credit and microfinance access."
  economic_upside: "Ethiopia's government targets 50% reduction in post-harvest losses by 2030 (aligned with AU Malabo Declaration). Each percentage point of post-harvest loss reduction on the Meki-Addis corridor alone represents approximately 500 tonnes of additional marketable tomatoes per season. At current Addis wholesale prices, full utilization of existing cold hub capacity on the corridor could recover $8–12M in annual produce value. Platform revenue: time-slot booking fee ($2–8 per slot), hub capacity utilization management SaaS subscription ($300–$800/month per hub), transaction data licensing to microfinance institutions."

sponsor_opportunities:
  - title: "Cold Hub Capacity Management SaaS"
    type: saas
    revenue_model: "Monthly subscription per cold hub operator ($300–$800/month). Dynamic capacity scheduling, demand forecasting from farmer harvest profiles, and utilization reporting dashboard."
    strategic_logic: "Hub operators running at 40–60% utilization are bleeding fixed operating cost. The platform's demand forecasting — based on registered farmer harvest calendars — turns unpredictable capacity into scheduled utilization. This is a directly measurable ROI for the hub sponsor."
    recurring: true

  - title: "Farmer Time-Slot Booking"
    type: saas
    revenue_model: "Per-slot booking fee ($2–$8 per slot, sliding scale by volume). Free for first two bookings to build adoption, fee activates at third booking."
    strategic_logic: "The booking fee is trivial relative to the income premium the farmer earns from selling graded cold-stored produce vs. roadside distress-price produce. Adoption is demand-pull: the first successful booking demonstrates the value."
    recurring: true

  - title: "Microfinance Data Bridge"
    type: commerce-extension
    revenue_model: "Referral fee from microfinance institutions for verified platform transaction records used in credit underwriting ($50–$150 per successful loan facilitation)."
    strategic_logic: "Hub transactions generate the first formal income documentation many smallholders have ever produced. Microfinance partners will pay for this pre-qualified borrower pipeline — the platform creates it as a byproduct of normal operations."
    recurring: true

  - title: "Input Supplier Pre-Commitment Commerce"
    type: commerce-extension
    revenue_model: "Commission on pre-season input supply contracts facilitated between registered farmers and input suppliers (1–2% of input order value)."
    strategic_logic: "Farmers with hub booking confirmations — guaranteed sale at a known price — can pre-commit to input purchases on credit. Input suppliers who can see confirmed downstream demand take lower repayment risk. The platform is the information bridge that makes this pre-commitment market possible."
    recurring: false

story:
  title: "The Slot That Saved the Season"
  status: draft
  blog_slug: ""
  characters:
    - "Tigist Bekele - tomato farmer, Meki, Central Rift Valley"
    - "Habtamu Girma - cold hub manager, SokoFresh-model cooperative, Meki"
    - "Meron Tesfaye - microfinance loan officer, Adama"
  summary: "Tigist books her first cold hub slot three days before harvest — and learns, for the first time, exactly what grade her tomatoes need to meet, what she will be paid, and when. The hub runs full. Tigist's income for that cycle is double what it was the previous season."
  body: |
    ## Act A - The Market Structure

    The Central Rift Valley produces tomatoes year-round under irrigation. The Meki-to-Addis
    corridor handles several thousand tonnes per season. A cooperative-operated solar cold hub
    opened eighteen months ago — 80 MT capacity, staffed for grading, reusable plastic crates
    in pool. On paper, it should be transforming the corridor.

    In practice, the hub runs at 52% utilization. Farmers within 12 km have heard of it but
    do not know how to access it. They do not know the daily booking availability, the grade
    standards, or the payment schedule. They wait by the road for the brokers they have always
    waited for.

    The hub manager knows the farmers are there. He cannot reach them without driving to each
    farm individually — an impossible round trip before morning temperatures make tomato
    handling unworkable.

    ---

    ## Act B - The Story

    **Tigist Bekele** farms half a hectare near Meki. The broker she sells to pays 11 birr
    per kilogram. She knows the hub exists. She passed it on the road three times.

    A government extension agent registered her with the platform program six weeks ago.
    The platform sent her a voice call in Amharic: "Your tomatoes are likely to reach harvest
    stage in 9 to 12 days. The Meki cold hub has available capacity on June 14th and 15th.
    Grade A tomatoes (firm, uniform, 5–8 cm diameter, no blemish) will receive 24 birr per
    kilogram. Grade B will receive 17 birr. Would you like to book a slot?"

    Tigist booked 800 kg for the morning of June 14th.

    Three days before harvest, she received another voice message: "Your slot is confirmed.
    Bring your tomatoes sorted by grade — loose ripe and blemished fruit in a separate
    crate. The grader will weigh and confirm at arrival. Payment will arrive to your
    mobile money account within 48 hours of grade confirmation."

    On the morning of June 14th, **Habtamu Girma** saw Tigist arrive in the flat-bed of
    her nephew's motorcycle, four crates of tomatoes. The grader assessed: 640 kg Grade A,
    160 kg Grade B. Habtamu photographed the crates, entered the grade result, and the
    platform confirmed payment: 640 × 24 + 160 × 17 = 18,080 birr. Released to Tigist's
    Telebirr account on June 16th.

    Tigist's previous season average for the same volume: 8,800 birr, paid on delivery by
    the broker, always in cash, always at his price.

    The hub ran at 89% capacity that week — the highest since it opened.

    Three months later, **Meron Tesfaye** at the Adama microfinance cooperative reviewed
    Tigist's platform transaction record. Two hub sales confirmed, 1,600 kg total, 34,160 birr
    gross income, 100% payment delivery rate. For the first time, Tigist had a verified income
    document that matched what she told loan officers she earned.

    She borrowed 40,000 birr to extend her drip irrigation system for the next season's
    expanded planting.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The hub is there. Tigist is there. The platform is the only missing element — the
    information channel that connects her harvest calendar to Habtamu's capacity schedule.

    Without that channel, Habtamu runs at 52% utilization and cannot justify expanding capacity.
    Tigist sells to the broker at 11 birr because the hub is inaccessible — not because it
    is absent.

    This is the thin market pattern precisely. Supply and demand are present, economically
    motivated to transact, and physically proximate. The market fails because discovery is
    impossible without infrastructure.

    The platform does not build the cold hub. It makes the cold hub work.

    *Characters are fictional. The Meki-to-Addis corridor, SokoFresh cooling-as-a-service models,
    GAIN's E-PLAN reusable plastic crate programme, and the Ethiopian smallholder microfinance
    market are real. [DeeperPoint](../../marketforge.html) is building the infrastructure
    this story describes.*
