market_example:
  summary: A real-time availability exchange matching junior mining companies that need diamond
    drill rig capacity in northern Canada with drilling contractors whose rigs and experienced
    crews have sudden or seasonal availability—replacing a fragmented phone-tree system that
    wastes program time and overheats the spot market.
  problem: "Diamond drilling is the primary method of geological exploration in hard rock,
    and drill rig utilization across Canada's northern Shield exploration districts (northern
    Ontario, northern Quebec, the Northwest Territories, Nunavut) has been running at 80–90%
    since the gold and copper exploration rebounds of 2024–2026. At this utilization level,
    finding available rig capacity on a timeline that matches an exploration program's funding
    window, freeze-up dates, and NI 43-101 expenditure commitments is a genuine operational
    crisis. The current mechanism for matching exploration companies with drill contractors
    is almost entirely informal: phone calls to known drillers, emails to provincial mining
    associations, and word-of-mouth from other exploration managers. Cancellations—which occur
    frequently as programs lose funding, weather windows close, or permit conditions change—open
    rig availability on short notice that the informal system cannot fill efficiently. The result
    is that rigs sit idle for days or weeks while companies that could use them immediately have
    no mechanism to discover the availability. Program delays cost junior companies month-end
    reporting windows, threaten their NI 43-101 expenditure timelines, and can push programs into
    the following field season—a full year's delay over what might have been a three-day logistics gap."
  dominant_forces:
    - "Drill rig utilization at 80–90% in peak exploration seasons means even a single rig
      cancellation creates a matching crisis: dozens of companies need the capacity but have
      no central visibility into it."
    - "Exploration program timelines are constrained by freeze-up windows, ice road access,
      permit conditions, and NI 43-101 expenditure deadlines—making a two-week delay equivalent
      to a full-season delay in many northern Ontario and Quebec programs."
    - "Drilling contractors operate fleets of 3–40 rigs and schedule them informally; there is
      no industry-wide availability registry, so competing contractors cannot even refer overflow
      to each other efficiently."
  deeperpoint_fit: "CoSolvent aggregates real-time rig availability calendars from participating
    drilling contractors—surface and underground rigs, by size class and rock type suitability.
    It matches junior company program requirements (rig type, rock type, depth target, location,
    start date, duration, camp requirements) against contractor availability, generating a structured
    rig booking proposal that includes crew mobilization timeline and camp logistics. A transparent
    spot-price layer prevents the informal market's price gouging during peak demand."
  economic_upside: "Each week of rig time wasted to matching inefficiency costs $15,000–$60,000
    in program cost and far more in delayed geological results. Across the ~450 junior exploration
    companies active in Canada's Shield districts at peak season, even a 5% improvement in rig
    utilization efficiency represents hundreds of millions in compounded exploration value. Platform
    revenue via subscription for contractors and per-booking transaction fees."
