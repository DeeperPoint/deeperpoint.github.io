  title: The Open Window
  status: draft
  blog_slug: ""
  characters:
    - "Priya - Exploration Manager, junior gold company, Timmins area"
    - "Gary - Operations Manager, diamond drilling contractor, Cochrane, Ontario"
  summary: "A junior gold company learns of a sudden drill rig cancellation in their district
    through a real-time rig availability exchange and saves a Phase 2 program that would have
    otherwise been deferred a full field season."
  body: |
    ## Act A - The Market Structure

    Diamond drilling is the clock that sets the pace of the entire mineral exploration industry.
    Every geological interpretation, every NI 43-101 resource estimate, every investment decision
    and royalty negotiation downstream of the drill program depends on whether the drill was
    running on schedule.

    At 85% average utilization across northern Ontario's exploration corridor, rig availability
    operates permanently at the edge of crisis. When a program cancels—and they cancel constantly,
    for reasons ranging from funding delays to permit condition changes to bad weather—the
    resulting availability window opens and closes before the informal network can process it.

    ---

    ## Act B - The Story

    **Priya** has been sitting on an approved Phase 2 program budget and a completed environmental
    baseline for six months, waiting for a rig. Every contractor she called in April was booked
    through September. In October, when freeze-up will close the access road to her camp, she
    has at most eight weeks of viable drilling window remaining.

    **Gary's** crew just finished a four-month program for a copper junior near Chapleau.
    The next program on his schedule—a three-week commitment in northeastern Quebec—has just
    been cancelled because the client lost their funding. Gary has one Boart Longyear LF-90 rig,
    two drillers, and a helper crew available starting Monday, 340 kilometres from Priya's camp.

    Gary's company registers the cancellation on the exchange at 8 AM Monday. By 10 AM, Priya
    has a match notification. The platform confirms rig specifications are appropriate for the
    target depth and estimated ground conditions. By Wednesday, the mobilization checklist is
    agreed. Gary's crew is on the access road Thursday afternoon. Priya's Phase 2 program
    starts 72 hours after a rig she didn't know existed became available. The freeze-up
    deadline passes with 1,200 metres of drill core in the shed.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The exploration industry has accepted scheduling by phone tree as a fact of life for so long
    that the waste is invisible. DeeperPoint makes the waste visible and eliminates it: real-time
    contractor availability, matched algorithmically to program requirements with a logistics
    handshake that compresses a two-week coordination process into 72 hours.

    *Characters are fictional. Drill rig utilization bottlenecks and cancellation waste are
    real and documented. [DeeperPoint](../../marketforge.html) is building the infrastructure
    this story describes.*
