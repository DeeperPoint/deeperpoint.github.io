market_example:
  summary: "Towns and school bus operators electrifying fleets must build depots around charging standards that are still being revised and vehicle makers that may not last. Two bus makers supplying Canadian fleets have gone through insolvency since 2023. This market would match fleet owners with charger suppliers and installers on compatibility and support terms."
  problem: "A charging depot is built to last longer than the buses it first serves, and the things it must fit keep changing. Plug-in transit buses typically charge through the SAE J1772 standard with a Combined Charging System Type 1 connector. Overhead automated charging follows SAE J3105, which was revised in May 2023 to add a vehicle pairing system because the original was written for on-route charging and not for depots with buses parked side by side. A third connector, SAE J3400, was first published as a technical report in December 2023 and became a recommended practice in 2024. Mixing makers is possible but has had to be proven: a trial at Brampton Transit, listed by Natural Resources Canada, demonstrated overhead charging that worked across two charger manufacturers and two bus manufacturers. The suppliers change too. The City of Edmonton bought 60 electric buses from Proterra. In November 2023, during the manufacturer's bankruptcy proceedings, a union official said 16 of the 60 were available for service, with the rest waiting for parts or repairs, and the city later sought more than 82 million dollars in damages. Lion Electric, a Quebec maker of electric school buses, sought creditor protection in December 2024 and was sold to a group of Quebec investors in a sale approved by a Quebec judge on May 22, 2025. A letter from the court-appointed monitor dated July 15, 2025 told clients in the United States that their warranties and purchase orders were void, while warranties on about 1,000 buses in Quebec were to be honoured. Lion had sold roughly 100 buses to the government of Prince Edward Island, and in 2026 that province paused its electrification plan and announced it would buy 137 diesel school buses. The money has also shifted. The federal Zero Emission Transit Fund, launched on August 10, 2021 with 2.75 billion dollars over five years, is closed. The Canada Public Transit Fund provides up to 3 billion dollars a year starting in the 2026 to 2027 fiscal year, and as of March 2026 its allocation for school buses was not known. A town or a school bus operator choosing chargers this year is therefore choosing a connector, a power level, a software system and a set of suppliers, each of which may be different when the next buses arrive. The proposal for this entry also named decisions hidden inside councils and regulatory barriers as likely causes. Research did not find sources for either, so they are not claimed here."
  dominant_forces:
    - "Technological Obsolescence: connector and automated charging standards were revised or newly published in 2023 and 2024, so a depot built for this year's buses may not fit the buses bought in five years"
    - "Risk: two makers of electric buses used by Canadian fleets went through insolvency between 2023 and 2025, leaving owners short of parts and, for some, without warranties"
    - "Offering Complexity: a depot combines connectors, power levels, utility service, charge-management software and building work, each from different suppliers, and all must work with buses from more than one maker"
  deeperpoint_fit: "Three parts of the Cosolvent engine exist today and apply here. A fleet owner can describe its position in ordinary words (the buses it has and expects to buy, the yard, the utility service, the routes, what it fears being stranded with) and be matched against charger suppliers, installers and engineering firms who describe their equipment and support terms the same way. The trusted-intermediary pipeline keeps protected details, such as a supplier's pricing or a fleet's budget and timing, hidden until both sides agree to reveal them. The engine reads documents such as fleet transition plans, site drawings and equipment specifications into a profile. It produces a Content Match Story, one account of why two parties might deal, given to both while they are still anonymous, and a Deal Brief, a non-binding summary for the parties' own engineers, lawyers and funders. A public buyer would still follow its own purchasing rules, and the Deal Brief would inform a tender and would not replace one. A domain wiki, prepared with CommonContext, would hold the sourced reference material: the standards and their revision dates, funding rules and the published results of interoperability trials. ClientSynth generates invented test participants so the market can be tried before real ones join. The part aimed most directly at obsolescence is not built. Risk insulation would let an upgrade or support commitment be structured so that a fleet is protected if a standard changes or a supplier fails; it is designed and not yet built. Aggregation, which would pool several small fleets into one order, is also designed and not yet built."
  economic_upside: "No sourced figure for the size of the depot equipment market was found, and none is estimated here. The fleet to be converted is known: the Canadian Electric School Bus Alliance's report card of March 2026 counted more than 52,000 school buses in Canada, of which 1,980, or 3.8 per cent, were fully electric. The same report said an electric school bus can cost up to 2.6 times a comparable diesel model. Federal funding gives the order of public money involved: 2.75 billion dollars over five years under the Zero Emission Transit Fund (2021), 1.5 billion dollars committed by the Canada Infrastructure Bank to zero-emission buses (2021), and up to 3 billion dollars a year under the Canada Public Transit Fund for transit of all kinds."

sponsor_opportunities:
  - title: "Depot Equipment Matching Service for Small Fleets"
    type: saas
    revenue_model: "A provincial municipal association, a school transportation consortium or a utility would pay an annual subscription to offer the service to member fleets. Charger suppliers and installers would pay a listing fee to describe equipment and support terms."
    strategic_logic: "Large transit agencies have engineering staff for this work. Small towns and school bus operators do not, and they make the same choices one at a time. A sponsor that serves many small fleets would let each see suppliers matched to its own buses and yard."
    recurring: true

  - title: "Compatibility and Support Terms Review"
    type: managed-service
    revenue_model: "The fleet owner would pay a fixed fee per project for an independent engineer who checks a proposed depot design against the fleet's present and planned buses and reviews the supplier's support and upgrade terms before a tender is issued."
    strategic_logic: "The costly errors are made before purchase: a connector that the next buses do not use, or software only one maker supports. A review at that point costs little next to rebuilding a depot."
    recurring: false

  - title: "Upgrade and Supplier-Failure Commitments"
    type: commerce-extension
    revenue_model: "Suppliers, insurers or lenders would pay a fee on each completed deal that uses standard terms for an upgrade path if a standard changes and for parts and software access if a supplier fails. This depends on the risk insulation part of the design, which is not yet built."
    strategic_logic: "Fleet owners have seen what a supplier's insolvency does to parts and warranties. A commitment that survives the supplier, on terms a council can read, would let a cautious buyer proceed."
    recurring: true

  - title: "Installation, Commissioning and Parts Coordination"
    type: logistics-extension
    revenue_model: "Fleet owners would pay per project for the coordination of equipment delivery, utility connection, installation and commissioning, and per order for replacement parts found through the service when an original supplier cannot deliver."
    strategic_logic: "A depot involves a utility, an electrical contractor, a charger maker and a bus maker, and a small fleet has no one to hold the schedule. Parts for equipment whose maker has failed are the hardest to find."
    recurring: true

story:
  title: "A Depot for Buses Not Yet Bought"
  status: draft
  blog_slug: ""
  characters:
    - "Nadine - fleet manager for a town transit service, Cobourg, Ontario"
    - "Ravi - project engineer at a charging equipment supplier, Burnaby, British Columbia"
  summary: "A small-town fleet manager who must build a charging depot for buses she has not yet ordered finds a supplier whose terms speak to the buses that will come after."
  body: |
    ## Act A - The Market Structure

    A charging depot outlasts its first buses. The standards it must fit are still moving. The overhead charging standard was revised in 2023 so that it would work in depots. A new connector standard was published the same year and confirmed in 2024.

    The suppliers move too. Edmonton bought 60 electric buses from a maker that entered bankruptcy, and at one point in 2023 a union official said 16 were available for service. A Quebec school bus maker sought creditor protection in late 2024 and was sold in 2025, and warranties on its buses in the United States were declared void.

    A large transit agency has engineers to work through this. A small town has a fleet manager, a public works yard and a council that has read the same news.

    The following is a fictional account of how a marketplace built on DeeperPoint's design could close this gap.

    ---

    ## Act B - The Story

    **Nadine** manages a transit fleet of nine buses for the town of Cobourg, Ontario. Council has approved two electric buses for next year and expects more to follow. She has to build the charging before the buses arrive.

    She describes her position to the marketplace in ordinary words: nine buses, two electric next year, a yard with room for four charging bays, overnight charging, and the local utility's answer on available power. Then she writes her worry: she does not want to rebuild the yard if the next buses use a different connector, or if a supplier is gone. She uploads the town's fleet plan and a site drawing. The engine reads them into her profile. Her budget stays hidden.

    **Ravi** is a project engineer at a charging equipment supplier in Burnaby, British Columbia. His firm's description sets out what it sells and how: chargers whose cables and connectors can be changed without replacing the cabinet, charge-management software that works with chargers from other makers, and a list of the bus makers whose vehicles it has tested with.

    The engine matches the two descriptions. Both receive the same Content Match Story while still anonymous. It says why they might deal: the yard and the utility service suit overnight charging at the power the firm offers, and the changeable connectors and open software speak to Nadine's worry. It says what is open: the firm has not tested with every bus maker the town might choose, and the town must tender the work.

    Both agree to reveal who they are. Ravi sends test records.

    The marketplace produces a Deal Brief. It is not a contract and it is not a bid. It sets out what the town needs, which terms matter and the questions that are still open. Nadine uses it to write the tender, with requirements for changeable connectors, software that is not tied to one maker, and access to parts and software if the supplier fails. Ravi's firm bids, and so do two others.

    Council awards the contract in the spring. The depot is ready before the buses.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Nadine did not lack suppliers. She lacked a way to know which questions to put to them, and which of them had answers.

    A tender tests price and compliance with what the buyer thought to ask. It does not tell a small buyer what to ask. The match here was between a worry and a set of terms, each stated in its owner's words, with prices and budgets held back until both sides chose. That is the kind of [friction that keeps a market thin](../market-physics.html), and it is what [MarketForge](../marketforge.html) is designed to reduce.

    *Nadine, Ravi, the supplier and the town's fleet, plan and tender are fictional. The standards, the Edmonton fleet figures and the school bus maker's insolvency are real. The matching, the anonymous Content Match Story and the Deal Brief are parts of the design that exist today. The part of the design that would back an upgrade or supplier-failure commitment is designed and not yet built.*
