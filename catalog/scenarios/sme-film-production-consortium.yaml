story:
  title: "The Commission That Required a Company"
  status: draft
  blog_slug: ""
  characters:
    - "Leo — director of photography, Toronto; broadcast-quality reel including national automotive and financial services brand spots"
    - "Nadia — senior editor and colourist, Toronto; independent, Emmy-adjacent broadcast colour work"
  summary: "A Toronto DP with a strong broadcast reel and a Toronto editor with exceptional colour credentials try to bid a $240,000 branded content commission as an informal partnership—and discover that the corporate communications department requires a recognized production company of record, not two named individuals."
  body: |
    ## Act A — The Company Requirement

    The brief came through a mutual contact in Toronto's advertising community. A national consumer packaged goods brand was seeking production for a six-episode branded documentary series for digital distribution. Budget: $240,000. Timeline: four months. The client wanted to see production company credentials, a named executive producer with commission experience, and a CMPA-member production company of record.

    Leo had the camera work. His reel had three national brand campaigns and a documentary feature. He was not a CMPA member. He was not a production company. He was a freelance DP.

    He called Nadia. Her editing and colour work was exceptional—a documentary feature that had screened at Hot Docs, three national brand post-production credits. Also not a CMPA member. Also not a production company.

    Between them they had two of the eight crew positions the production required covered.

    ---

    ## Act B — The Story

    They spent two weeks trying to assemble around the commission. Sound design: confirmed through Leo's regular sound mixer. Production coordinator: a producer friend of Nadia's who could step into the executive producer role and was CMPA eligible but not currently a member. Camera assistants: Leo's regular 1st AC was available.

    What they could not cover: a grip and electric package at the production scale required, a motion graphics artist whose credits matched the digital brand scope the client specified, and the CMPA membership that the client required as a standing legal necessity for the production company of record.

    The CMPA membership application required two prior commissioned credits as a production company. Neither Leo nor Nadia had produced a commission as a company. The membership was not achievable on the bid's timeline.

    They submitted the partnership proposal anyway, with Leo's DP reel as the primary credential document. The client responded that they were unable to consider proposals from unregistered production entities.

    ---

    On the MarketForge film crew consortium platform, three small CMPA-member production companies in Toronto had registered as open consortium partners—willing to function as the production company of record for commissions that originated from crew-led consortiums, in exchange for production company overhead percentage. One listed specific experience with digital branded documentary formats.

    Leo and Nadia did not know this category of partner existed in a structured form.

    The platform also indexed a motion graphics studio with digital brand documentary credits and a grip company with IATSE-compatible equipment packages and day-rate consortium pricing.

    The full consortium was assembable. The gap was discovery and the production company of record mechanism—both of which the platform addressed directly.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Leo and Nadia's creative capabilities were exactly right for the commission. The production company of record requirement is a legitimate industry standard—it ensures insurance, union compliance, and contractual accountability. It is also a structural barrier that prevents the most talented freelance crew from accessing commission-scale work without years of company-building overhead.

    A consortium infrastructure that includes CMPA-member production companies willing to serve as consortium production companies of record—for a defined overhead share—removes the structural barrier without requiring Leo and Nadia to stop being freelancers.

    [Thin market infrastructure](../../thin-markets.html) makes that production company partner visible alongside the compatible crew members who complete the commission-ready team—turning the structural exclusion of freelance crew from commission markets into a solvable assembly problem.

    *Characters are fictional. CMPA membership requirements, IATSE crew classifications in the Canadian film industry, and branded documentary production budgets in Toronto are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
