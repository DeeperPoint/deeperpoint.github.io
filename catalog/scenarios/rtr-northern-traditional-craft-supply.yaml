market_example:
  summary: "Connecting remote Indigenous artisans with bulk specialized supplies (specific beads, textiles, carving tools) by aggregating demand across multiple isolated communities to bypass predatory retail markups."
  problem: "Remote northern artisans creating traditional goods (mukluks, beadwork, carvings) face massive supply chain friction. They require highly specific materials (e.g., size 11/0 Czech seed beads, specific hides) that are completely unavailable locally. Buying individually online results in retail markup and shipping costs that entirely consume their profit margins."
  dominant_forces:
    - "Incredibly high postal and freight costs for individual consumer parcels."
    - "Artisans lack access to wholesale accounts due to low individual volume."
    - "Niche materials are not stocked by general northern retailers."
  deeperpoint_fit: "CoSolvent aggregates the micro-purchases of hundreds of remote artisans into massive wholesale orders. ClientSynth optimizes the logistics, mapping out how bulk shipments can be broken down regionally, leveraging existing community networks for distribution."
  economic_upside: "Transforms the unit economics of Indigenous art. By cutting supply costs by 50-70%, the platform creates sustainable micro-economies. Revenue is derived from a transparent, ethical wholesale margin."

