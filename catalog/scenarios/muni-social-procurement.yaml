market_example:
  summary: "Social procurement policies adopted by municipalities go unfulfilled because procurement officers cannot identify prequalified local and social enterprise suppliers at contract time, and those suppliers cannot navigate RFP processes designed for large contractors."
  problem: "Many municipalities have adopted social procurement policies that require or encourage purchasing from local small businesses, Indigenous-owned enterprises, immigrant-owned businesses, and social enterprises. In practice, these procurement preferences go unfulfilled because procurement officers cannot identify which local suppliers are legitimately prequalified for specific contract categories, and small/social enterprise suppliers cannot navigate RFP processes designed for large contractors. Social procurement policies read well in reports but produce little actual procurement change."
  dominant_forces:
    - "Opacity — social and small enterprise suppliers are not visible in procurement systems; their capabilities are not encoded in standardized terms that enable discovery at contract time"
    - "Cognitive overload — a procurement officer managing 60 active contracts cannot maintain awareness of the local supplier landscape for each category and match it to social procurement criteria in real time"
    - "Regulatory fragmentation — social enterprise qualification standards, Indigenous business certification, and reporting requirements vary by contract, funder, and jurisdiction"
    - "Trust deficit — procurement officers are risk-averse; awarding to an unknown local supplier requires confidence in capacity, insurance, and performance track record"
    - "Information asymmetry — local suppliers know their capabilities; procurement officers know their contract requirements; the two are never systematically compared"
  deeperpoint_fit: "Semantic matching identifies pre-qualified local and social enterprise suppliers for specific contract categories, accounting for capability, capacity, certification status, and geographic fit. The verification pipeline validates Indigenous business certification (CCIB), social enterprise status, insurance coverage, WSIB clearance, and relevant professional certifications before encoding in matching profiles. The Generative Match Story helps procurement officers document the rationale for a social procurement award in terms required for audit and reporting. KnowledgeSlot curates social procurement policies by jurisdiction, Indigenous procurement guidelines, CCIB certification standards, and performance reporting frameworks."
  economic_upside: "Social procurement is widely recognized as a high-leverage tool for municipal economic development: every dollar spent locally circulates through the economy multiple times. Better matching converts a policy commitment into actual purchasing practice, creating jobs in enterprises that serve social objectives and growing a supplier base that becomes more competitive over time."

