market_example:
  summary: "Independent plumbing, electrical, HVAC, landscaping, and cleaning companies cannot efficiently assemble the full-coverage building services bundles required to bid strata corporation and commercial property management maintenance contracts—leaving these contracts to large property services companies while specialized independents compete only for individual service calls."
  problem: "Strata corporations and commercial property managers seek annual maintenance service agreements that cover all routine maintenance categories under a single contract with a single provider relationship, consolidated invoicing, and coordinated scheduling. No independent plumber, electrician, HVAC technician, landscaper, or commercial cleaner covers all of these categories. Large property service companies—FirstService Residential, Brookfield Residential, commercial maintenance chains—can offer this bundle because they have internal capacity in most trades or have pre-negotiated sub-trade relationships. Independent tradespeople with strong local reputations, competitive pricing, and faster response times than large companies cannot access these contracts because they cannot present the single-vendor bundle the strata council is looking for. Meanwhile, independent tradespeople in the same neighbourhood with complementary coverage areas are not connected to each other and have no mechanism to propose a joint service arrangement that competes with the large provider."
  dominant_forces:
    - "Offering complexity — a complete building services bundle requires certified coverage across at least plumbing, electrical (including ESA compliance in Ontario), HVAC/refrigeration, elevator (third-party contract), landscaping and snow removal, and commercial cleaning, each with the appropriate trade licensing and insurance"
    - "Insurance and liability — each trade requires trade-specific liability insurance, and a bundle proposal must demonstrate combined coverage adequate to the strata's property value"
    - "Geographic coverage alignment — all consortium partners must serve the same neighbourhood or building district for the bundle to be operationally coherent"
    - "Contract structure — property managers want a master agreement with one lead contractor accountable for all service coordination and emergency response, not a panel of independent vendors"
    - "Opacity — independent tradespeople with compatible service territories and complementary trade coverage are not organized in any format that allows them to discover each other for consortium formation"
  deeperpoint_fit: "Semantic matching encodes trade firm profiles (trade certification and licensing, service territory by postal code range, insurance coverage tier, emergency response SLA, sub-trade role vs. lead contractor preference) against property manager opportunity signals (building type and age, service categories required, service territory, response time SLA, contract value, incumbent relationship). Geographic proximity filtering ensures consortium partners have overlapping service territories."
  economic_upside: "Annual building services contracts for a mid-sized strata corporation represent $80,000–$250,000 in predictable maintenance revenue across trade categories. Independent tradespeople in those categories typically see highly variable, demand-driven revenue from individual service calls. A single strata building services contract provides one to two years of partially predictable base revenue—equivalent to the revenue certainty of having several long-term residential service agreements. Consortium access to strata and commercial property contracts represents a structural improvement in revenue stability for independent trades."

