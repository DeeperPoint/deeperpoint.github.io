market_example:
  summary: A structured brokerage platform connecting industrial facilities with standby
    generation capacity or flexible load with grid operators seeking demand response and
    peaking capacity contracts—enabling Canadian industrial operators to monetize their
    grid flexibility while providing utilities an alternative to expensive peaking generation.
  problem: "Canada's electricity grids face a growing capacity adequacy problem. As coal
    is retired in Alberta (completed 2024) and fossil gas peaking capacity is constrained
    by emissions targets in Ontario and BC, grid operators require flexible peaking resources
    to manage peak demand events. The traditional response—new gas peaking plants—is becoming
    increasingly expensive politically and regulatory. The alternative—industrial demand response—
    exists but is systematically underutilized due to market access complexity. Thousands of
    Canadian industrial facilities have controllable electrical loads—aluminum smelters, pulp
    mills, cement kilns, large refrigeration systems, pumping stations—that can be curtailed
    on short notice for $15–60/MWh in compensation. Many also have standby diesel or gas
    generators that were installed for reliability backup but could be dispatched to the grid.
    Alberta's AESO has a Demand Response Program; Ontario's IESO has Demand Response contracts
    and Capacity Auction participation mechanisms. But the qualification process, program
    rules, dispatch protocols, and metering requirements for grid-connected demand response
    are complex enough that most industrial operators have never successfully enrolled, even
    those with potentially valuable grid flexibility. Small and mid-sized industrial facilities
    without dedicated energy management staff—the 5–50 MW load range—are almost entirely
    absent from Canadian demand response markets despite representing the majority of potential
    flexible load."
  dominant_forces:
    - "Grid operators need cost-effective peaking capacity alternatives as retirement of fossil
      fuel peaking plants accelerates—but the industrial demand response market is fragmented
      and inaccessible to the mid-size facilities that represent the majority of flexible load."
    - "Industrial demand response qualification (AESO DR program, IESO capacity auction) involves
      metering upgrades, dispatch protocol implementation, and regulatory registration that
      mid-size facilities cannot navigate without dedicated energy management resources they
      don't have."
    - "Aggregation requirements—most grid programs require minimum demand response commitments
      of 1–5 MW—mean that individual small industrial loads cannot participate without an
      aggregator who bundles their capacity, but the aggregator market is underdeveloped and
      operates on opaque commercial terms."
  deeperpoint_fit: "CommonContext encodes the demand response program qualification requirements
    for AESO, IESO, and provincial utilities: metering specifications, dispatch response time
    requirements, curtailment duration limits, and commercial compensation structures. CoSolvent
    matches industrial facility load profiles—peak load, curtailable load fraction, response
    time capability, constrained curtailment periods—against grid operator program requirements
    and aggregator portfolios, identifying which facilities qualify for which programs and at
    what compensation level."
  economic_upside: "Canada's controllable industrial load exceeds 10,000 MW—most of it currently
    providing zero grid services. At $30/MWh average demand response compensation, even 10%
    enrollment represents $3B in annual grid service revenue for Canadian industrial operators.
    Platform revenue via aggregation fee on enrolled demand response capacity and success fees
    on capacity auction contract awards."
