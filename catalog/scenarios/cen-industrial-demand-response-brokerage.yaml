story:
  title: The Invisible Megawatts
  status: draft
  blog_slug: ""
  characters:
    - "Nadia - Energy Manager, mid-size Alberta cement manufacturer"
    - "Chris - VP Market Development, industrial demand response aggregator, Calgary"
  summary: "An Alberta cement plant discovers its 12 MW of interruptible kiln load qualifies
    for AESO demand response enrollment—and earns $340,000 in its first program year—through
    a demand response qualification matching platform."
  body: |
    ## Act A - The Market Structure

    The Canadian electricity grid has a peaking capacity problem that it is trying to solve
    by building expensive infrastructure when the solution is already installed across thousands
    of industrial facilities.

    An aluminum smelter can drop 40 MW in three minutes when dispatched. A cement kiln can
    suspend clinker production for four hours without process consequence. A cold storage
    warehouse can pre-cool and coast through a two-hour peak event. These facilities contain
    the flexible capacity that grid operators need—but they are invisible to the grid's
    capacity markets because qualification is complicated, aggregation is opaque, and nobody
    has ever connected the industrial energy manager to the demand response program.

    The AESO has a Demand Response Program. The IESO has capacity auctions. Provincial
    utilities have interruptible load tariffs. Most of the industrial load that could serve
    these programs is simply not enrolled, because the path from "I think I have some curtailable
    load" to "I am enrolled and receiving dispatch events" involves a regulatory maze that
    most industrial operators have never navigated.

    ---

    ## Act B - The Story

    **Nadia** manages energy procurement for a cement manufacturing plant consuming 85 GWh
    per year in Alberta. She knows intuitively that their kiln load is somewhat flexible—
    they routinely curtail during planned maintenance, and the kiln can tolerate a 3–4
    hour clinker production interruption without affecting product quality. She has
    heard of demand response programs. She has never enrolled. Nobody has asked her to.

    **Chris** runs an industrial demand response aggregation business aggregating flexible
    load from large industrial facilities into AESO-compliant DR portfolios. He needs to
    build to 50 MW of aggregated enrolled capacity to participate in the AESO's DR program
    at the price that makes his model work. He's enrolled 23 MW from three large clients
    through his existing industrial network. He needs 27 more MW. He doesn't know Nadia
    exists.

    Nadia enters her facility's load profile into the platform: peak load, production
    schedule, interruptible segments, response time capability, blackout periods. The
    platform's qualification engine assesses AESO DR program eligibility: her interruptible
    kiln load of approximately 12 MW with a 10-minute response time qualifies for the
    AESO's Class B Demand Response. Chris's aggregation portfolio has capacity for exactly
    12 MW in the industrial zone where Nadia's plant sits. The platform surfaces the match.
    Chris handles the metering upgrade coordination and AESO registration. Nadia's plant
    is enrolled in three months. In its first program year the plant receives $340,000 in
    demand response compensation for 14 AESO dispatch events totalling 38 hours of curtailment.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Canada's industrial demand response potential is worth billions annually to grid operators,
    industrial operators, and electricity consumers—and almost none of it is being captured
    because the matching infrastructure between flexible load and program qualification doesn't
    exist. DeeperPoint builds the market access platform that closes this gap, providing grid
    operators the flexibility they need and industrial operators the revenue they deserve.

    *Characters are fictional. AESO and IESO demand response programs and the significant
    underenrollment of eligible industrial load are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
