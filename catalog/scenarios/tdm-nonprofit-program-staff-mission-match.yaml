      association members with semantic matching access as a member benefit)."
    strategic_logic: "Volunteer centers, United Way affiliate networks, and nonprofit
      sector associations have existing relationships with both the organizations hiring
      program staff and the volunteers and community members who are the pipeline for
      those roles. Integrating these existing community relationships into the matching
      platform converts the association's network value into a structured talent matching
      infrastructure — while providing the association a high-value member service that
      justifies membership fees and drives platform adoption."
    recurring: true

story:
  title: "The Program Proposal She Never Submitted"
  status: draft
  blog_slug: ""
  characters:
    - "Fatou - Executive Director, youth homelessness prevention organization, Halifax"
    - "Kieran - long-term youth outreach volunteer and community garden organizer, 26, Dartmouth"
  summary: "A Halifax youth homelessness prevention organization whose previous program
    coordinator wrote participatory program designs that transformed their impact is unable
    to find a replacement through standard hiring — until a rich-profile matching system
    finds a 26-year-old Dartmouth community garden organizer whose volunteer project
    proposals and reflective journals demonstrate the same participatory program design
    practice the organization's documents reveal."
  body: |
    ## Act A - The Market Structure

    Community program design practice is not a certification. It is a way of working
    with people that either treats them as program recipients or treats them as program
    co-designers. Organizations that have built their impact on the participatory model —
    where program structure emerges from ongoing community consultation rather than
    being delivered from an organizational plan — need staff who practice in that way
    instinctively, not staff who can describe participatory design methodology in an
    interview and then deliver programs the standard way under schedule pressure.

    The distinction is visible in work product. A program coordinator who genuinely
    practices participatory design writes about their programs differently — the community
    voice appears in their program writeups, the design changes they document reflect
    participant feedback, their impact narratives describe relationships rather than
    service transactions. A volunteer who genuinely organizes in this way writes volunteer
    reports that sound different from the standard 'we helped forty people' narrative.
    The practice is in the documents. It is not in the credential.

    Standard hiring processes for program coordinator roles filter for social work or
    human services credentials, relevant sector experience, and some evidence of program
    coordination history. They do not filter for participatory design practice. They
    cannot: no resume field captures it, no credential certifies it, and no standard
    interview question reliably elicits the evidence of it.

    ---

    ## Act B - The Story

    **Fatou** has led a youth homelessness prevention organization for seven years. Her
    previous program coordinator, who left for a graduate program in social work, had built
    two programs that had become models for the sector in Nova Scotia: a peer-designed
    housing navigation program developed entirely with young people who had experienced
    homelessness, and a community kitchen program co-designed with participants whose
    structure changed every quarter based on what participants said was working and what
    wasn't. The programs' impact reports had been cited by the provincial housing department
    as examples of effective participatory program design. When her coordinator left, Fatou
    posted the position through sector association networks and received thirty-one applications.
    All had relevant credentials. Five were interviewed. None had the participatory design
    practice her programs required. She offered the role to the strongest technical candidate.
    He resigned after four months: the participatory model was not how he worked, and he
    had not understood from the interview what it would require in practice.

    Fatou uploaded the job description, the theory of change document for both programs,
    the program design narratives her previous coordinator had written for two grant
    applications, and the reflective program review her previous coordinator had written
    after the first year of the housing navigation program — a document that demonstrated,
    in detail, how participant feedback had changed the program's structure and why.

    **Kieran** was 26 years old, had no social work credential, and had spent four years
    organizing a community garden network in Dartmouth that had grown from one plot to
    eleven sites through participant-led expansion. His uploaded profile included: a
    volunteer coordinator's report about his garden network (written by someone else),
    three program proposals he had written to the Halifax Regional Municipality for new
    garden sites (which included participant consultation processes he had designed), a
    reflective journal entry he had written for a community leadership program about what
    he had learned about participatory decision-making from the garden expansion, and a
    brochure about the garden network's winter programming that participants had designed.
    He had applied for the position through the sector network posting. His application
    had not passed the credential filter.

    The platform's semantic matching identified Kieran's document corpus as the strongest
    match to Fatou's employer document corpus. The participatory design language in his
    program proposals matched the participatory design approach in her previous coordinator's
    grant narratives. His reflective journal demonstrated the same practice orientation —
    the same posture toward participant voice and program adaptation — that her theory of
    change document described. Fatou received a match explanation that identified the
    specific document-level parallels. She contacted Kieran, who had already accepted
    a position at a community centre. She called him before his start date.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Fatou's organization needed a person whose practice matched its program design approach.
    Kieran's practice was that match. The evidence of the match existed in documents Fatou
    had produced over seven years and documents Kieran had produced over four years of
    community organizing. The credential filter that separated their paths was a proxy for
    a quality the credential did not actually certify. The platform that could read the
    documents and find the match did not exist in the channel where Fatou posted and
    Kieran applied.

    Every participatory program, every trauma-informed service, every community-led
    initiative in the nonprofit sector faces the same hiring problem: the credential
    certifies the generalist; the documents reveal the practitioner. The infrastructure
    to match on documents has not been built for this sector.

    *Characters are fictional. Participatory program design practice in youth homelessness
    and community development, and the limitations of credential-based hiring for
    mission-aligned roles, are factual domains.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
