market_example:
  summary: "An Ethiopian-Canadian in Toronto wants to arrange verified nursing care for an aging parent in Addis Ababa. A Mexican-American in Houston needs to coordinate specialist care for a family member in Oaxaca. In both cases the buyer has money, the local provider exists, and only the trust infrastructure is missing."
  problem: "Diaspora communities in North America and Europe routinely support family healthcare in home countries. The unmet need is verified healthcare coordination — arranging, monitoring, and paying for nursing attendance, medication management, specialist referrals, and rehabilitation care for patients the diaspora family member cannot visit. The challenge is identical to the diaspora property management problem: the buyer cannot project presence across 8,000 kilometres; the local caregiver has no mechanism to signal verified competence; and the trust gap between these parties eats significant value — either through unverified care arrangements, costly family emergency trips, or simply deferred care. No verified healthcare coordination market exists for this segment in either country."
  dominant_forces:
    - "Trust deficit — Diaspora patient advocates cannot verify caregiver attendance, medication adherence, or care quality from abroad"
    - "Discovery failure — Qualified nurses and home health aides in Addis Ababa or Oaxaca have no mechanism to reach diaspora clients who can pay above-market rates"
    - "Information asymmetry — Diaspora clients do not know local healthcare system standards, caregiver licensing requirements, or medication pricing"
    - "Geographic dispersion — Patients in secondary cities and rural areas are further from qualified care, compounding the matching problem"
    - "Verification gap — No existing directory of home health providers is vetted for diaspora-grade accountability standards"
  deeperpoint_fit: "CoSolvent builds caregiver profiles with verified competence signals — nursing license, care specialization (geriatric, post-surgical, chronic disease management), language, location, daily rate, and availability — matched against patient care profiles built by diaspora coordinators (medical condition, care hours required, medication schedule, reporting requirements). CommonContext carries local healthcare licensing standards, medication guides in local languages, Telebirr and Remitly payment integration protocols, and — critically — a Virtual Caregiver Monitoring module: geotagged attendance photos, AI-assisted medication adherence tracking using phone camera pill identification, and structured daily reporting templates the caregiver submits via WhatsApp or Telegram."
  economic_upside: "Ethiopia's diaspora sends $5B+ per year in remittances; a significant fraction supports family health expenses with poor accountability. Mexico-US remittance healthcare payment is estimated at $2–4B annually. A verified coordination platform capturing 0.5% of this flow as service fees on verified, escrow-backed care contracts represents $35–50M in annual revenue. Network effect: verified caregivers build tracked records; diaspora families build usage history. Both sides accumulate platform-verifiable credentials that have value independent of any single transaction."

