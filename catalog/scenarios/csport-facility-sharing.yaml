    strategic_logic: "Municipalities pay substantial overhead to manage booking requests from sport organizations. A platform that handles cross-organization discovery and initial scheduling negotiation reduces municipal booking staff workload while increasing facility utilization — a dual value proposition that justifies direct institutional subscription."
