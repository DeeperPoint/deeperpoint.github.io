id: csport-facility-sharing
title: "Sport Facility Sharing: Cross-Organization Scheduling"
sector: canadian-sport
sub_sector: Facility Management
forge_tier: 2
status: published
tags: [sport, facilities, scheduling, amateur, municipal, temporal-distance, canada, aggregation]

market_example:
  summary: "Amateur sport organizations compete against each other for facility time while municipal recreation departments have utilization gaps — because there is no cross-organization discovery mechanism for available sport facility time in a region."
  problem: "Amateur sport organizations — community hockey associations, soccer clubs, gymnastics clubs, swimming clubs — compete for ice time, field time, and facility access while municipal recreation departments struggle with utilization gaps. A hockey association with excess prime-time ice in February may be unaware a speed skating club needs exactly that time. A gymnastics club needing eight hours of gym time on Saturday mornings cannot discover which community centres in their region have that availability. Scheduling is managed through manual processes, personal relationships, and fragmented municipal booking systems that have no cross-organization discovery mechanism."
  dominant_forces:
    - "Temporal distance — facility availability is highly time-specific; a match on the wrong night is worthless, and availability windows shift week to week"
    - "Search friction — no aggregated view of available sport facility time exists across multiple organizations and municipalities in a region"
    - "Offering complexity — each facility has specific characteristics: surface type, dimensions, lighting, equipment, accessibility, parking, and associated services"
    - "Geographic distance — organizations operate within narrow geographic catchment areas; the viable search radius for facility access is often under 30 km"
    - "Regulatory fragmentation — municipal booking policies, insurance requirements, and priority allocation rules vary across municipalities and facility types"
  deeperpoint_fit: "Temporal distance modelling is the defining capability — matching must account for time-slot specificity, recurring vs. one-off needs, seasonal cycles, and tournament-window peaks. KnowledgeSlot curates municipal facility policies, insurance requirements by facility type and sport, and applicable accessibility standards. User aggregation allows small clubs to pool scheduling requests, achieving scale needed to negotiate multi-facility arrangements with municipalities. Semantic matching handles facility-to-need fit including surface type, dimensions, equipment, associated services, geographic proximity, and pricing."
  economic_upside: "Municipal recreation facilities represent billions of dollars in Canadian public infrastructure. Poor utilization represents a direct loss to taxpayers and a barrier to participation for sport organizations that cannot access appropriate facilities. Better matching increases utilization rates, reduces time coaching staff spend on scheduling logistics, and enables participation by organizations currently excluded by informal allocation systems."

