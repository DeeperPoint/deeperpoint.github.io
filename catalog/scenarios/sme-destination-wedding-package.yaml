    recurring: false

story:
  title: "The Same Saturday"
  status: draft
  blog_slug: ""
  characters:
    - "Isabelle — destination wedding photographer, known for editorial-romantic style, based in Montreal but travels across Quebec and Atlantic Canada"
    - "Marc — floral designer, recognized for lush organic arrangements, Charlottetown PEI; destination wedding clients across Atlantic Canada"
  summary: "A Montreal destination wedding photographer tries to assemble a full-package PEI destination wedding consortium for a high-budget client who wants boutique quality across every service element—and the assembly challenge nearly loses the client to a PEI resort package."
  body: |
    ## Act A — The Request She Couldn't Fulfill Alone

    The clients found Isabelle's portfolio through Instagram. A Toronto couple planning a destination wedding at a rented heritage farmhouse on PEI. Guest count: 80. Budget: $95,000 across all service elements. What they wanted: Isabelle's photography, a florist whose lush organic aesthetic matched her images, a caterer who could do a farm-to-table experience at a non-venue location, a string quartet for the ceremony and a jazz combo for the dinner reception, and a day-of coordinator.

    They were not planning to hire a wedding planner. They wanted to hire Isabelle and have her help them assemble the rest. She is a photographer, not a coordinator—but she had done this informally twice before, assembling loose referral networks for destination clients who needed help.

    What she had in Charlottetown was one floral referral from a prior wedding: Marc.

    ---

    ## Act B — The Story

    **Marc** does extraordinary organic floral work. His portfolio is full of overflowing garden-style arrangements that look like they grew from the ground at the venue. His aesthetic aligns exactly with Isabelle's photography. He was available for the date. He immediately said yes to the consortium conversation.

    Two elements down. Still needed: heritage-farmhouse-capable catering (not a hotel catering company—the clients were specific about artisan food and farm sourcing), ceremony string quartet, dinner jazz combo, and a day-of coordinator with destination wedding experience on PEI.

    Marc gave her two catering contacts. One was not available. The second had the right style but did not have the equipment for off-venue preparation at scale.

    The string quartet she found through PEI's music conservatory network took three weeks to confirm—not because demand was high but because the process required reaching individual musicians and confirming quartet availability as a group rather than individually.

    The day-of coordinator she found through an online wedding forum. She confirmed by email, then discovered during the contract conversation that the coordinator did not carry liability insurance adequate for a $95,000-value event.

    The client was patient. For six weeks. Then they emailed asking whether they should just book the Fairholm National Historic Inn package, which covered most elements in a single contract.

    Isabelle found the remaining pieces in week seven. The client booked with her.

    ---

    On the MarketForge wedding consortium platform, which went live in the region four months after this booking cycle, nine PEI-based wedding service providers had active profiles: two caterers, one with farm-to-table sourcing documented in their profile, one string quartet available as a bookable unit, two jazz combos, and three day-of coordinators—two of whom listed their liability insurance tier in their profile.

    Marc was also on the platform, where he had listed his aesthetic style tags as "lush organic, garden-style, European wild."

    Isabelle and Marc's aesthetic tags had a 94% compatibility score. The platform would have introduced them directly, along with the three compatible caterers and the string quartet, on the day Isabelle accepted the booking inquiry.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The PEI boutique wedding market had every service element the clients wanted. The providers existed, were available, and had the right aesthetic tier and insurance standing.

    What did not exist was a mechanism by which Isabelle—working from Montreal, planning a wedding on PEI for Toronto clients—could find compatible, available, insured providers in less time than it takes to lose the client to a resort package.

    [Thin market infrastructure](../../thin-markets.html) converts the destination-specific, aesthetic-matched, date-synchronized consortium assembly problem from a six-week referral campaign into a same-day structured search—at the moment an inquiry converts to a booking, not six weeks after.

    *Characters are fictional. PEI's destination wedding market, farm-to-table catering in Atlantic Canada, and heritage farmhouse wedding venues are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
