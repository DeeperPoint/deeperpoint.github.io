story:
  title: The Invisible Conductor
  status: draft
  blog_slug: ""
  characters:
    - "Marcus - Chief Geologist, junior nickel-copper explorer, northwest Ontario"
    - "Sylvia - Operations Director, specialty helicopter TDEM geophysics company, Timiskaming"
  summary: "A junior company targeting a deep nickel sulphide conductor in northwest Ontario
    finds the only available helicopter TDEM system with the penetration depth specification
    their target requires through a structured geophysics contractor exchange."
  body: |
    ## Act A - The Market Structure

    Geophysics is the geological telescope—the instrument that lets an exploration company
    see below the overburden and rock surface to where the ore body might be. But there is
    no universal geophysical camera. A helicopter TDEM system tuned for uranium detection
    in the Athabasca Beaufort Basin will not image a nickel sulphide conductor at 400-metre
    depth in a Proterozoic terrane. Survey method, system parameters, line spacing, and
    data processing protocol are all deposit-model-specific decisions.

    The pool of contractors capable of executing the right survey for a given geological
    target is thin by definition. There are perhaps six helicopter TDEM operators in Canada
    whose systems can penetrate to the depth and conductivity contrast required for deep
    sulphide detection. In a hot exploration season, they are booked months in advance—and
    they are not all registered anywhere.

    ---

    ## Act B - The Story

    **Marcus** has a ground magnetics anomaly at his flagship property that is consistent
    with a mafic-ultramafic intrusion—the kind of host that carries Voisey's Bay-style
    nickel-copper-cobalt mineralization if the sulphide content is high enough. He needs
    a helicopter TDEM survey: minimum 400-metre depth penetration, Geotem or Tempest-class
    specifications, flown at 60-metre line spacing over a six-square-kilometre target area.
    His geological consultant called three contractors. Two booked. One operates a system
    with depth penetration rated to 250 metres—not enough for the interpreted target depth.

    **Sylvia's** company returned from a six-week uranium survey in Saskatchewan two weeks
    early because permitting delays pushed back the client's program. Her Hs350 helicopter
    is hangared in Timiskaming with the MEGATEM II system already mounted. She has a five-week
    window before her next committed program. She didn't send any marketing emails.

    Marcus queries the platform: TDEM, helicopter, minimum 400m depth, 60m line spacing,
    northwest Ontario, available within three weeks. Sylvia's system specs surface as the
    only matching available operator in Canada. Marcus reviews her system parameters and
    reference program history. The mobilization is booked. The survey generates 47 lineal
    kilometres of TDEM data over a 14-day program. The strongest conductor anomaly—380 metres
    of depth, 92 siemens—is precisely where the geological model predicted it should be.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The difference between the right geophysics contractor and the wrong one is the difference
    between a drill hole that intersects mineralization and a drill hole that costs $400,000
    and proves nothing. The market cannot afford to match on availability and price alone—it
    must match on geological suitability. DeeperPoint builds the structured deposit-model-aware
    contractor matching that the industry needs.

    *Characters are fictional. The specialty geophysics contractor bottleneck is a recognized
    constraint in Canadian exploration. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
