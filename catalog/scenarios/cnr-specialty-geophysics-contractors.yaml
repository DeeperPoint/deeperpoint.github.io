market_example:
  summary: A structured matching platform connecting junior and mid-tier exploration companies
    needing specialty geophysical surveys—airborne TEM, ground TDEM, IP, gravity—with the
    small pool of accredited geophysical survey contractors whose equipment and expertise
    match the required survey design and deposit model.
  problem: "Geophysical surveys are the primary tool for targeting drill programs in blind
    mineral exploration—the difference between drilling into productive ground and wasting
    $500,000 on a miss often hangs on survey design choices and the competency of the
    contractor executing the survey. The specialty geophysics sector in Canada is a thin
    market by any definition: a handful of Canadian-based contractors operate helicopter-borne
    time-domain electromagnetic (TDEM) systems capable of deep basement penetration in
    the conductivity ranges relevant to base metal and nickel-copper targets. Fewer than
    a dozen operators run fixed-wing frequency-domain EM systems suited to uranium exploration
    in the Athabasca Basin. Ground-based induced polarization survey crews with proven
    competency in hard rock settings number in the tens nationally. These contractors have
    different equipment capabilities, different regional expertise, different seasonal
    deployment calendars, and dramatically different suitability for different geological
    targets. A junior company scoping a magnetite-bearing nickel sulphide target needs
    a different contractor capability than one chasing an unconformity uranium target
    in Saskatchewan. But the mechanism for finding, evaluating, and booking specialty
    geophysics contractors is the same as for drill rigs: personal networks, trade show
    introductions, and the geological consulting firm's existing contractor relationships—a
    system that systematically fails first-time programs and companies without established
    geological advisor relationships."
  dominant_forces:
    - "Specialty geophysics equipment availability is limited to a small national pool:
      fewer than a dozen TDEM helicopter operators, fewer than 10 fixed-wing frequency-domain
      systems, with seasonal demand peaks driven by exploration funding windows."
    - "Survey design must match the geological target—wrong equipment selection for a deposit
      model produces data that is not only useless but actively misleading, causing drill
      programs to be sited in incorrect locations."
    - "Geophysics contractors have strong regional preferences driven by mobilization costs,
      crew familiarity with local conditions, and existing maintenance relationships with
      regional camp operators—factors invisible to a junior company scoping their first survey."
  deeperpoint_fit: "KnowledgeSlot encodes the survey design matching logic: deposit model to
    geophysical method relationships (e.g., TDEM for deep sulphide conductors, IP for porphyry
    and intrusion-hosted targets, gravity for mafic intrusions and dense ore bodies). CoSolvent
    matches the geological target description against contractor capability profiles—system
    type, maximum depth penetration, accreditation status, regional deployment experience,
    and current calendar availability."
  economic_upside: "A single airborne TDEM survey for a shield exploration program costs
    $80,000–$400,000. Poor contractor selection for a geological target results in unusable
    data and wasted program budgets. The platform captures a matching fee on survey bookings
    while dramatically reducing the geological mismatch rate that wastes millions in exploration
    capital annually."
