market_example:
  summary: "Food processors generating high-quality organic residuals — fruit pomace, whey, vegetable trimmings, spent grain, coffee grounds, bakery returns — pay for disposal while upcycling manufacturers, animal feed compounders, and composting operations would pay for the same material as a feedstock."
  problem: "Canada's food processing industry generates approximately 11 million tonnes of organic residuals annually. Much of this material has significant secondary value: apple pomace contains pectin and fibre for food ingredient manufacturing; whey from cheese production is a protein source for sports nutrition; spent coffee grounds contain oils suitable for biofuel and cosmetics; bakery returns are ideal animal feed ingredients; vegetable trimmings from salad processing can be dehydrated for soup base. But food processors treat waste as a cost centre, not a revenue opportunity. A cheese plant in Belleville generating 2,000 litres/day of whey permeate pays $0.03/litre for disposal. An animal feed compounder in Lindsay, 90 km north, purchases liquid whey protein at $0.15/litre from a supplier in Wisconsin. The match is obvious, but the cheese plant's waste manager and the feed company's procurement manager have never been in contact."
  dominant_forces:
    - "Temporal urgency — organic residuals deteriorate quickly; matching must happen within hours or days, not weeks"
    - "Quality variability — organic residuals vary in composition by season, batch, and processing method; buyers need consistency data that generators don't collect"
    - "Regulatory classification — whether a food processing residual is 'waste' or 'animal feed ingredient' depends on provincial classification that affects transport, handling, and liability"
    - "Volume mismatch — large processors generate huge volumes; many upcyclers are small operations that need a fraction of the available supply"
  deeperpoint_fit: "Semantic matching encodes food processor profiles (residual type, volume, frequency, composition data, freshness window, location, current disposal cost) against upcycler demand signals (feedstock specification, volume needs, acceptable quality variation, location, transport constraints, price point). Real-time availability matching addresses the perishability constraint."
  economic_upside: "Canadian food processing organic waste has an estimated secondary value of $500M–$1.5B annually if diverted from disposal to upcycling. A platform capturing 5% of this diversion generates $25–75M in facilitated transactions while diverting hundreds of thousands of tonnes from landfill and composting."

