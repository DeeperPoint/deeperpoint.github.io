market_example:
  summary: "Matches federal and provincial correctional facilities with qualified Indigenous Elders and cultural advisors who can provide culturally appropriate programming — sweat lodges, healing circles, land-based learning — fulfilling legal obligations under Gladue principles while addressing chronic understaffing of cultural services."
  problem: "Indigenous peoples represent 5% of Canada's population but 32% of the federal prison population. The Correctional Service of Canada (CSC) is legally required to provide culturally appropriate programming for Indigenous inmates under Gladue principles, the Corrections and Conditional Release Act, and multiple court directives. This programming depends entirely on Elders and cultural advisors entering facilities to lead ceremonies, healing circles, and land-based programming. The supply of qualified, willing Elders is critically thin: many live in remote communities, compensation is inadequate, the institutional environment is hostile, and no centralized mechanism exists to discover Elders willing to serve specific facilities. Facilities outside major cities often go months without any Elder programming."
  dominant_forces:
    - "Geographic remoteness — many qualified Elders live in remote and northern communities far from the federal and provincial facilities that need them"
    - "Cultural and spiritual diversity — Indigenous nations have distinct ceremonial traditions; a Cree Elder may not be appropriate for Anishinaabe inmates, and vice versa, requiring nuanced matching"
    - "Institutional barriers — correctional security clearance processes are slow and opaque, and the institutional environment deters many Elders from volunteering or accepting contracts"
  deeperpoint_fit: "CoSolvent maintains a registry of Elders and cultural advisors with verified credentials, nation affiliation, ceremonial specialization, security clearance status, and geographic willingness. CommonContext curates the cultural protocols, facility-specific access procedures, and nation-specific ceremonial requirements. The matching engine aligns a facility's Indigenous inmate demographics (by nation, language, ceremonial tradition) with available Elders, respecting cultural protocols around gender, ceremony type, and seasonal availability."
  economic_upside: "CSC spends $3.6 billion annually on corrections, with per-inmate costs for Indigenous inmates significantly higher due to over-classification and longer sentences. Programs that meaningfully reduce Indigenous recidivism — which cultural programming demonstrably does — generate savings of $130,000+ per avoided reincarceration. Enterprise SaaS contracts with CSC and provincial corrections ($100,000–$300,000/year) plus managed-service facilitation fees."

