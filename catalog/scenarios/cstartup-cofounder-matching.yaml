market_example:
  summary: "A technical founder in Charlottetown building a fisheries data platform cannot find a business co-founder with supply chain domain experience, while a former supply chain manager in New Brunswick with the right domain expertise cannot find a technical partner to build the platform she has been planning for years."
  problem: "Co-founder matching in Canada is almost entirely network-dependent — it happens at university startup programs, accelerator cohorts, and startup weekends concentrated in a handful of cities. Founders outside those cities face a dramatically narrowed co-founder search pool. A technical founder in a small city building a domain-specific platform cannot easily find the complementary business, sales, or domain expertise co-founder they need. The person with exactly that domain expertise in an adjacent community has no systematic way to signal their co-founding availability. Both parties carry unbuilt companies because the introductory mechanism doesn't reach their geography."
  dominant_forces:
    - "Participant scarcity — the pool of people willing to co-found in a given domain, at a given stage, with a given equity structure, near a specific community is very small"
    - "Opacity — no structured, searchable registry of people actively seeking co-founders exists with published domain expertise, startup stage readiness, and commitment level"
    - "Trust deficit — co-founding is among the highest-stakes professional commitments; both parties require significant vetting before disclosing idea details or financial circumstances"
    - "Geographic distance — effective co-founder relationships require some in-person presence; remote community founders face a narrowed viable search radius"
    - "Offering complexity — each co-founder opportunity involves idea stage, equity philosophy, domain expertise requirement, time commitment, and geographic flexibility"
  deeperpoint_fit: "The three-layer information architecture is ideal for co-founder matching: founders can signal need publicly, share a partial idea description at the match stage, and disclose the full business plan only after mutual interest is confirmed. Semantic matching encodes what each party offers and seeks (functional complement, domain expertise, stage readiness, equity philosophy, time commitment, geographic flexibility) before any sensitive disclosure. KnowledgeSlot curates co-founder agreement frameworks, provincial startup grant requirements that mandate team composition, and IRAP/NRC eligibility criteria. Geographic compatibility matching prioritizes distributed-first arrangements for remote founders explicitly open to that model."
  economic_upside: "Founding team composition is among the strongest predictors of startup survival and growth. In communities where the potential co-founder pool is thin, DeeperPoint can effectively expand that pool nationally while filtering for genuine compatibility — dramatically improving founding team quality available to founders in remote communities where the local pool is otherwise near-empty."

