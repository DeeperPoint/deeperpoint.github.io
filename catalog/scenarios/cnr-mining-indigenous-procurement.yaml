story:
  title: The IBA Gap
  status: draft
  blog_slug: ""
  characters:
    - "Dawn - Economic Development Coordinator, Matachewan First Nation, northern Ontario"
    - "Kevin - Procurement Manager, gold mining company, northern Ontario"
  summary: "A Matachewan First Nation economic development corporation identifies a credible
    mine catering contract opportunity through a procurement specification matching platform,
    builds the HSE pre-qualification requirements, and awards the first IBA-compliant catering
    contract within the mine's target year."
  body: |
    ## Act A - The Market Structure

    Impact and Benefit Agreements are among the most important policy instruments for
    Indigenous economic participation in Canadian resource development. When a company
    negotiates in good faith to source 20% of contracted services from the community whose
    territory the mine sits in, that commitment represents genuine wealth-sharing intent.

    The implementation gap is not cynicism—it is market structure failure. Mine procurement
    systems were built by and for established industrial service companies: they require
    specific insurance certificates, safety training records, equipment registrations, and
    prior-performance references. A community business starting from scratch cannot provide
    a prior-performance reference for a service it has never previously been given the
    opportunity to provide. The procurement system was not designed to accommodate the
    capability ramp-up timeline that community business development actually requires.

    ---

    ## Act B - The Story

    **Dawn** is presenting the Third-Year IBA Compliance Report to the joint company-community
    IBA committee. The mine has met 6.3% Indigenous procurement against a 20% target. The shortfall
    is not for lack of trying. She has submitted three companies to the mine's supplier portal.
    Two were rejected because their safety management systems did not meet the mine's HSMS
    standard. One was pre-qualified but has not received a purchase order eight months later.

    **Kevin** genuinely wants to close the gap. His problem is operational: every supplier
    that comes through the community referral process needs to go through the same HSE
    pre-qualification system as any other contractor. He cannot reduce the safety standard.
    What he needs is a supplier that has already met the pre-qualification requirements—which
    means the community needs to know what those requirements are before starting the business,
    not after submitting the first proposal.

    Dawn queries the platform for the mine's active procurement categories against the
    community's current business capabilities: environmental monitoring crews (community
    has trained staff), light vehicle fleet maintenance (community has a certified mechanic
    among its members), camp catering (community has commercial cooking certification through
    a federal training program). The platform maps each category against the mine's published
    HSE pre-qualification checklist and identifies the gap: the catering business needs
    a valid CFIA food handler program and a commercial kitchen inspection before the mine's
    HSE system will accept the pre-qualification application. Kevin's procurement team reviews
    the match output and confirms the catering contract volume available for the following year.
    Dawn's economic development corporation applies for CFIA certification in January. By March,
    pre-qualification is complete. The catering contract—worth $840,000 annually—is awarded
    in the mine's next annual contract cycle.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    IBA procurement commitments fail not because of intent but because the information needed
    to build a qualifying Indigenous business—specific regulatory requirements, procurement
    timelines, contract volume availability—is never structured, never shared, and never
    connected to community economic development planning. DeeperPoint builds the transparent
    matching infrastructure that makes IBA procurement commitments real.

    *Characters are fictional. The IBA Indigenous procurement compliance gap is well-documented
    across Canada's mining sector. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
