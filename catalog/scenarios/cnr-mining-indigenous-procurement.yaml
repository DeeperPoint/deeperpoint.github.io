market_example:
  summary: A structured procurement matching platform connecting active and developing Canadian
    mines to Certified Indigenous Businesses operating in the mine's territory—enabling genuine
    supply chain participation under Impact and Benefit Agreement commitments by matching
    Indigenous business capabilities against specific mine procurement needs with technical
    specification accuracy.
  problem: "Impact and Benefit Agreements (IBAs) between Canadian mining companies and First
    Nations whose territories mines operate in routinely include commitments to Indigenous
    business procurement: a defined percentage of contracted services value to be awarded
    to certified businesses owned by community members. These commitments are negotiated
    in good faith and represent genuine policy intent: to ensure that resource extraction
    generates economic participation for communities bearing environmental and social costs.
    The implementation frequently fails—not because of bad faith, but because of structural
    market failure. Mine procurement teams operate with detailed material and service specifications
    (equipment maintenance standards, supply chain certification requirements, safety training
    prerequisites) and tight schedules. Newly established Indigenous businesses often lack
    the procurement track record, safety certification portfolio, or equipment registration
    that a mine's HSE and procurement systems require before a contract can be awarded. The
    discovery of qualified Indigenous suppliers is done through informal community liaison
    mechanisms—band council referrals, community newsletters—that are poorly adapted to
    technical procurement specifications. The result is that IBAs commit to 20% Indigenous
    procurement and achieve 4–8% in practice, not from intent failure but from market
    infrastructure failure."
  dominant_forces:
    - "IBA Indigenous procurement commitments are legal obligations negotiated by senior mining
      company management, but operational failure is driven by procurement system requirements
      (HSE pre-qualification, equipment certification, insurance minimums) that most new
      Indigenous businesses cannot immediately demonstrate."
    - "First Nations economic development corporations often have the capital, willingness,
      and community support to build mine-supply businesses, but lack the technical procurement
      specification knowledge that would allow them to develop services that meet the actual
      requirements—not the perceived ones."
    - "Mine procurement cycles (quarterly contracts, annual blanket purchase agreements)
      operate on timelines that community liaison mechanisms cannot track or respond to—leading
      to missed opportunities that compound the IBA compliance gap."
  deeperpoint_fit: "KnowledgeSlot encodes the procurement specification requirements for the
    most common mine services contracted to Indigenous businesses: light vehicle maintenance,
    road dust suppression, camp catering, waste management, reclamation seedling supply,
    and environmental monitoring. It translates mine HSE pre-qualification requirements into
    actionable business development plans for emerging Indigenous suppliers. CoSolvent matches
    mine procurement timelines and specifications against Indigenous business capability profiles,
    surfacing genuine qualification gaps with actionable remediation pathways."
  economic_upside: "A single mine with a $50M annual contracted services budget and a 20%
    IBA procurement commitment represents $10M in Indigenous business potential. Across
    Canada's 200+ operating mines with IBA obligations, the unmet commitment gap is estimated
    at hundreds of millions annually. Governments and mining companies alike would sponsor
    a platform that demonstrably closes the compliance gap."
