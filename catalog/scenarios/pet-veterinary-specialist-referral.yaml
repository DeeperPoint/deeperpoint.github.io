market_example:
  summary: "Pet owners in rural and secondary-city Canada needing veterinary specialists — oncologists, cardiologists, orthopedic surgeons, dermatologists, neurologists — cannot find specialists with available appointments within reasonable travel distance, while veterinary specialists in urban centres have capacity gaps they cannot fill because rural referring veterinarians lack visibility into specialist availability."
  problem: "Canada has approximately 500 board-certified veterinary specialists, concentrated almost entirely in Toronto, Montreal, Vancouver, Calgary, and Guelph. A dog owner in Prince George whose pet has a suspected mast cell tumour needs a veterinary oncologist. The nearest one is in Vancouver — 8 hours away. The local veterinarian knows the dog needs specialist care but has no systematic way to determine which oncologist has availability, whether a telehealth consultation could substitute for an in-person visit for initial staging, or whether a specialist might be doing locum rotations in a closer city. The owner either drives 16 hours round trip, delays care while calling clinics individually, or foregoes specialist treatment entirely. Meanwhile, a veterinary oncologist in Calgary has a cancellation opening next Tuesday that would be perfect — but neither the Prince George vet nor the dog's owner knows about it."
  dominant_forces:
    - "Geographic concentration — 85%+ of veterinary specialists practice in five urban centres; rural pet owners face 4–12 hour drives for specialist appointments"
    - "Availability opacity — specialist clinics manage their own appointment books with no cross-clinic visibility; referring vets cannot see who has openings"
    - "Telehealth uncertainty — many specialist consultations (dermatology, behavioural, oncology staging review) could begin via telehealth, but neither referring vets nor owners know which specialists offer it"
    - "Referral network narrowness — rural veterinarians refer to the 2–3 specialists they personally know, not the full pool of available specialists"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (board certification, species, subspecialty, telehealth capability, appointment availability by date, geographic location, locum rotation schedule, fee range) against referral demand signals (species, presenting condition, urgency, owner location, travel willingness, telehealth preference, budget). Real-time availability integration surfaces the appointment that exists — not just the specialist who exists."
  economic_upside: "Canadian pet care spending exceeds $10B annually. Veterinary specialist services represent an estimated $500M–$1B. A platform that improves rural-to-specialist referral matching for 10% of cases generates $50–100M in facilitated specialist consultations and measurably reduces delayed or foregone treatment in rural Canada."

