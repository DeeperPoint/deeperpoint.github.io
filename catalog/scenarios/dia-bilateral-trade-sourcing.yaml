market_example:
  summary: "A Ghanaian family business wants to import Canadian lentils. A Canadian equipment dealer wants to sell into the Nigerian market. Both searches stall because neither side can verify the other's credibility across an 8,000 km gap in a market without a shared trade infrastructure. Diaspora Canadians who know both sides of the relationship are the natural bridge — but they have no platform to formalize that role."
  problem: "Canada's diaspora communities are an underutilized bilateral trade asset. A Ghanaian-Canadian food distributor in Toronto knows personally which Canadian pulse crop exporters are reliable, which Lagos-based food wholesalers have the cold storage to handle Canadian product, and how to navigate both countries' import documentation — because she has been doing it informally for six years, making introductions over WhatsApp and collecting finder's fees through informal channels. The same pattern appears across Canadian diaspora communities: South Asian Canadians brokering equipment and pharmaceutical imports to family businesses; Latin American Canadians connecting Canadian technology companies to regional distributors they know personally; Lebanese Canadians facilitating real estate investment inquiries between Gulf capital and Canadian markets. The matching problem in every case is identical: a Canadian business trying to enter a foreign market cannot find a credible local partner through conventional channels, and a foreign business trying to source from Canada lacks a trusted Canadian intermediary. The diaspora intermediary exists and has the knowledge to make the connection — but has no formal identity as a trade facilitator, no platform to list their market knowledge, no escrow mechanism for their fee, and no liability protection for introductions that go wrong. The market exists; the infrastructure to make it formal and scalable does not."
  dominant_forces:
    - "Trust asymmetry — foreign buyers and sellers cannot evaluate Canadian counterparties through conventional due diligence channels; diaspora intermediaries reduce the verification cost by functioning as living references"
    - "Regulatory opacity — import/export documentation, tariff classification, phytosanitary requirements, and country-of-origin rules vary by product and country pair; a diaspora intermediary who has navigated the specific bilateral corridor has irreplaceable practical knowledge"
    - "Informal fee structures — diaspora trade facilitators currently collect finder's fees through informal channels with no formal agreement, no escrow, and no recourse if the transaction closes and the fee is not paid"
    - "Bilateral trust asymmetry — Canadian businesses are often skeptical of foreign market intelligence provided by diaspora intermediaries whose conflict of interest is unclear; a verified platform listing with documented transaction history addresses this"
    - "Language and cultural negotiation — business negotiations in West Africa, South Asia, and Latin America involve communication norms that Canadian counterparties without diaspora guidance routinely misread, causing deals to stall or fail that would have succeeded with proper facilitation"
  deeperpoint_fit: "MarketForge lists diaspora trade facilitators by bilateral corridor (Canada–Ghana, Canada–Pakistan, Canada–Colombia), product category expertise, and verified transaction history. Canadian businesses post trade development opportunities with the corridor and product category — the platform matches them to facilitators with documented expertise in that specific pair. Facilitator fees are agreed through the platform and held in escrow, released upon verified introduction milestone or transaction close. Knowledge Slot provides facilitators with current tariff information, import documentation requirements, and trade finance options for their corridor."
  economic_upside: "Canadian bilateral trade with diaspora-origin countries is significantly underdeveloped relative to the size and commercial sophistication of the diaspora communities. A platform that formalizes $500M–$1B in annual diaspora-facilitated trade introductions, capturing 1–2% in facilitation fees, generates $5–10M in annual transaction revenue. Trade associations — Canadian Association of Importers and Exporters, bilateral chambers of commerce — are natural sponsors with direct member value. Global Affairs Canada has a diaspora trade facilitation mandate that is chronically underfunded and would benefit from a scalable platform alternative."

