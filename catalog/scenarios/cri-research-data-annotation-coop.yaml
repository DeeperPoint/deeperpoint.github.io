market_example:
  summary: "Matches PI data-labeling needs (for AI/ML training on specialized datasets like pathology slides) with vetted students requiring stipends or co-op blocks, rather than relying on low-quality generic crowdsourcing."
  problem: "Academic AI research in medicine, engineering, and the humanities requires massive datasets annotated by domain experts (e.g., circling tumors on thousands of biopsies). Generic crowd-workers (like Amazon MTurk) produce useless, low-quality results. Meanwhile, thousands of Canadian graduate and undergraduate students need remote, flexible, specialized work to support their degrees."
  dominant_forces:
    - "GIGO (Garbage In, Garbage Out) principle in AI dictates absolute reliance on high-quality annotation."
    - "Traditional grant funding is highly restrictive about hiring temporary unclassified labor."
    - "Students have bursty availability unsuited to standard employment models."
  deeperpoint_fit: "CoSolvent aggregates specific annotation micro-tasks across national research labs. ClientSynth models student domain expertise (e.g., matching a 3rd-year anatomy student to to an MRI labeling task). CommonContext tracks accuracy metrics and anonymizes patient data compliance."
  economic_upside: "Reallocates millions in grant funding currently sent to offshore click-farms directly into the pockets of Canadian students, achieving vastly superior AI training outcomes. Monetization via standard platform transaction margins."

