  - title: "HR Challenge Triage and Scoping Service"
    type: managed-service
    revenue_model: "Per-engagement triage fee for complex HR situation assessment ($400–800
      per triage; covers a structured HR situation analysis, legal exposure assessment,
      urgency rating, and recommended specialist type specification) prior to full expert
      engagement facilitation."
    strategic_logic: "Nonprofit executive directors frequently know they have an HR problem
      but not what kind of specialist they need or how urgent the legal exposure is. A
      triage service that converts 'we have a harassment complaint' into a structured
      situation brief — complaint characterization, investigation independence requirement,
      documentation protocol, and employment law exposure estimate — enables the platform
      to match the right specialist while creating a defensible pre-engagement record."
    recurring: false

  - title: "Nonprofit HR Compliance Toolkit Subscription"
    type: commerce-extension
    revenue_model: "Annual compliance toolkit subscription per organization ($600–1,800/year;
      covers jurisdiction-specific employment law update monitoring, policy template library
      (progressive discipline, accommodation, harassment), pay equity plan template,
      and HR audit checklist for the nonprofit sector); updated quarterly for legislative changes."
    strategic_logic: "Nonprofits between complex HR challenges need basic compliance
      infrastructure — up-to-date HR policies, provincial employment law change alerts,
      and periodic HR audit checklists — that most cannot afford through a commercial
      HR consulting retainer. A toolkit subscription that provides this infrastructure
      between expert engagements creates recurring revenue while keeping organizations in
      the platform ecosystem between episodic specialist matches."
    recurring: true

  - title: "Nonprofit Board HR Governance Workshop Service"
    type: managed-service
    revenue_model: "Per-workshop facilitation fee for nonprofit board HR governance sessions
      ($1,500–4,000 per session; covers board duties regarding executive compensation
      approval, harassment complaint escalation governance, CRA reasonableness standards
      for executive pay, and HR audit oversight responsibility); delivered by matched
      retired HR executives with charitable sector governance experience."
    strategic_logic: "Nonprofit boards are legally responsible for HR governance decisions —
      executive compensation approval, harassment investigation oversight, CRA compliance
      for compensation — but most board members have no HR governance training specific
      to the charitable sector. A board governance workshop delivered by a retired HR
      executive with charitable sector experience converts a one-time advisory engagement
      into a recurring educational service for nonprofit boards, while generating referrals
      from board-level relationships to the executive director HR challenges the platform
      serves."
    recurring: true

story:
  title: "The Complaint That Could Have Ended Everything"
  status: draft
  blog_slug: ""
  characters:
    - "David - Executive Director, 55-person community mental health organization, Ottawa"
    - "Claire - retired CHRO, 32 years in healthcare and social services HR, Ottawa"
  summary: "An Ottawa community mental health organization receives a formal harassment
    complaint against a senior program manager — a situation that requires an independent
    workplace investigation the organization has never conducted — and avoids a $200,000
    employment tribunal exposure through a retired CHRO who has conducted forty harassment
    investigations and designs a procedurally defensible investigation process in the
    first forty-eight hours."
  body: |
    ## Act A - The Market Structure

    Harassment complaints in workplaces with fewer than 100 employees follow the same
    legal process as harassment complaints in organizations with 10,000 employees. The
    duty to investigate promptly, the obligation to maintain procedural fairness, the
    requirement that the investigator be sufficiently independent to avoid a reasonable
    apprehension of bias, the documentation standards that determine whether the investigation
    findings will withstand challenge at an employment tribunal — these are not scaled
    to organizational size. They apply to a fifty-person nonprofit with the same force
    as to a major hospital.

    The cost of getting the investigation process wrong is also not scaled. An investigation
    that lacks procedural fairness, that is conducted by a person with an apparent conflict
    of interest, or that produces findings unsupported by the documented evidence creates
    employment tribunal exposure that regularly reaches $100,000–300,000 in legal fees,
    tribunal awards, and reputational damage. For a community mental health organization
    with a $3M annual budget, this is an existential risk.

    The investigation process is learnable but requires experience to execute defensibly.
    A retired CHRO who has designed and overseen forty workplace investigations knows
    exactly where the procedural vulnerabilities lie, what documentation protocol protects
    the organization, and when to retain external legal counsel versus when the investigation
    can be conducted internally with appropriate independence. This knowledge does not exist
    in a $2,500-per-day external HR consulting firm billing its standard process, and it
    does not exist in David's HR coordinator who has never conducted an investigation.

    ---

    ## Act B - The Story

    **David** has led a community mental health organization in Ottawa for eleven years.
    On a Tuesday morning, he received a written harassment complaint from a senior support
    worker alleging a pattern of workplace harassment by the program manager responsible
    for the support worker's team. The complaint named specific incidents over four months,
    included text message documentation, and was submitted with a formal request for
    investigation. David's HR coordinator had processed thirty standard HR transactions
    in the previous year. She had never conducted a workplace investigation. David's
    employment lawyer quoted $15,000 to manage the investigation process through the
    firm. He did not have $15,000 in unallocated budget in Q2.

    **Claire** retired two years ago after a thirty-two year career in hospital and social
    services HR, the final ten years as CHRO of a large Ottawa-area health authority.
    She had personally overseen forty-three formal workplace investigations, retained
    external investigators where independence required it, and designed investigation
    protocols that had been tested at the Ontario Human Rights Tribunal without adverse
    procedural findings. She was available for fractional advisory work two days per week.
    She was not on any advisory list David had access to.

    David found Claire through the specialist platform forty-eight hours after receiving
    the complaint. Claire reviewed the complaint documentation that evening and provided
    a written investigation protocol the next morning: interim separation arrangement,
    independent investigator qualification criteria (given the small organization, an
    external investigator was required), witness interview sequencing, documentation
    standards, and timeline. The protocol cost $800 for four hours of advisory time.
    The investigation, conducted by an external investigator Claire identified and briefed,
    was completed within six weeks and produced findings that withstood subsequent legal
    review. Total cost of Claire's involvement: $2,400 across three advisory sessions.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Claire's investigation protocol expertise was not a proprietary methodology. It was
    the accumulated procedural knowledge of thirty-two years of designing and defending
    investigation processes in an employment law environment. That knowledge is available
    in the labour relations department of any major law firm at $450/hour, and in any
    CHRO with comparable career experience at $0/hour — because retired CHROs who want
    to contribute this knowledge to the nonprofit sector have no mechanism to do so at
    the moment an organization needs them.

    The mismatch is not geographic. It is not financial. It is informational: David did
    not know that retired HR executives with investigation process expertise were available
    for fractional advisory work; Claire had no mechanism to signal her availability to
    a community mental health organization she had never heard of. The match that resolved
    a potentially existential situation cost less than three hours of lawyer time.

    *Characters are fictional. Ontario workplace investigation procedural requirements,
    employment tribunal exposure for procedurally deficient investigations, and charitable
    sector HR governance obligations are factual.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
