story:
  title: "Forty-Eight Hours"
  status: draft
  blog_slug: ""
  characters:
    - "Helen — 64-year-old retired teacher in London, Ontario; full-time caregiver for her husband Robert, who has stage-moderate frontotemporal dementia with significant behavioural symptoms; has not had an overnight away in eleven months"
    - "Wanda — retired geriatric nurse in Lambeth, Ontario; eight years of home respite experience including FTD-specific behavioural care; listed on the platform with dementia subtype specialization and short-duration flexibility"
    - "Carol — peer caregiver companion in Guelph; also spousal caregiver for FTD; two years further into the caregiving journey; listed on the platform for peer connection with spousal caregivers"
  summary: "Helen has not had a night away from caregiving in eleven months. Her daughter is getting married in Niagara-on-the-Lake and Helen will not consider not going. The platform matches her to a retired geriatric nurse with FTD behavioural experience within thirty kilometres, and to a peer companion who has navigated the same moral weight of a caregiver taking a night off."
  body: |
    ## Act One: The Wedding

    Megan's wedding was in six weeks. Niagara-on-the-Lake. Two nights. Helen had been to the dress fitting, had contributed
    to the centrepiece decisions, and had not told Megan that she could not possibly go.

    Robert's last incident with the part-time PSW from the agency had ended the agency relationship. Robert had become
    agitated during dinner, and the worker — excellent with physical care, no specific dementia training — had responded
    in a way that escalated the situation. The agency sent a different worker the following week. Robert refused to open
    the door.

    Helen had been on the Alzheimer Society of Canada's resource page for forty minutes. The local society chapter
    offered a volunteer visitor program with a twelve-week wait list. The provincial respite program required a formal
    needs assessment that took six to eight weeks to complete.

    Megan's wedding was in six weeks.

    ---

    ## Act Two: The Match

    The platform search filtered to: London and surrounding area, dementia behavioural, overnight and multi-day available,
    FTD experience preferred.

    Wanda had been a geriatric ward nurse for twenty-six years and had offered private respite since retirement. Her
    profile noted FTD behavioural experience specifically — she had provided respite for three FTD families in the past
    two years. She offered a pre-engagement home visit at no charge to meet the care recipient and observe the household
    routine before accepting a booking.

    Helen called her the same evening. Wanda came the following Saturday. She spent two hours with Robert, observed his
    routine, noted the kitchen layout that triggered the most predictable agitation, and asked about the music he had
    listened to in his forties. She accepted the booking.

    The peer companion match surfaced separately. Carol in Guelph, spouse with FTD, two years further into the journey,
    had written in her profile: "happy to talk about the guilt of going somewhere without them." Helen sent a message at
    10 PM. Carol answered at 10:42.

    ---

    ## Act Three: The Forty-Eight Hours

    Helen attended the wedding. She danced at the reception. She called Wanda twice — once the first evening, once the
    following morning. Robert was sleeping well. The kitchen routine had held.

    On the drive home from Niagara, she called Carol. Carol said: "The first time you go away is the hardest. The second
    time you believe it can work."

    Wanda had left a handwritten note on the kitchen table: what Robert had eaten, what he had watched, what time he had
    gone to bed, and one observation: "He hummed along to the Miles Davis record for about forty minutes after dinner.
    Might be worth more of that."

    *Characters are fictional. Canadian caregiver epidemiology, the economic cost of caregiver burnout, and the
    structural gaps in provincial respite programs are real. [DeeperPoint](../../marketforge.html) is building the
    matching infrastructure this market requires.*
