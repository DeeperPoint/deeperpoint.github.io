market_example:
  summary: "Apartment building owners and property managers executing capital renewal programs—roofing, window replacement, building envelope, mechanical systems—cannot efficiently assemble the specialist contractors needed to complete multi-component capital programs within a single construction season, maximizing reserve fund deployment efficiency."
  problem: "A mid-size apartment building—80 to 200 units, 30 to 50 years old—typically requires major capital renewal every 15 to 25 years: roofing replacement, window replacement, building envelope repairs (caulking, brick repointing, parapet caps), mechanical system upgrades (boiler replacement, balancing, domestic hot water replacement), and parking structure repairs. A reserve fund study specifies these work categories with projected costs. The property manager's job is to execute the capital program efficiently—ideally grouping as many capital components as possible into a single construction season to minimize tenant disruption and take advantage of mobilization cost efficiencies when contractors are already on-site. The challenge is that each capital component requires a specialist contractor: a roofing company for the roofing, a window installation company for the windows, a building envelope engineer and restoration contractor for brick and caulking, and a mechanical contractor for the boiler and hot water systems. Coordinating these specialists to work in sequence on the same building over the same season—managing access, sequencing to avoid interference, and coordinating where systems interact (e.g., window installation affects the air infiltration assumptions for the mechanical system balancing)—requires assembling a compatible, available team before the construction season opens."
  dominant_forces:
    - "Availability synchronization — all capital renewal specialists must have availability in the same construction season window, which is constrained to May–October in northern Canadian climates; booking competition for these windows is intense"
    - "Technical sequencing dependency — window replacement before mechanical balancing allows the new air infiltration profile to be incorporated; roofing before parapet caulking avoids rework; the specialists must coordinate their sequencing"
    - "Tenant disruption management — capital work in an occupied building requires coordinated noise and access schedules; multiple contractors managing their own schedules independently produce chaotic tenant disruption"
    - "Specification consistency — building envelope engineer specifications must be consistent with the window and roofing contractor's materials; mismatches between independently specified systems create warranty voids"
    - "Opacity — specialist capital renewal contractors—particularly building envelope restoration contractors with engineer relationships—are not organized in directories accessible to property managers who do not regularly execute major capital programs"
  deeperpoint_fit: "Semantic matching encodes contractor profiles (capital renewal specialization, building type experience, same-season multi-component coordination experience, engineering relationship for specifications, geographic coverage, typical project timeline and crew size, available season windows) against property manager opportunity signals (building type and age, capital component list, target construction season, budget range, tenant occupancy sensitivity level). Multi-component coordination capability—contractors with experience managing their work alongside other trades on occupied residential buildings—is a specific match criterion beyond individual specialization."
  economic_upside: "A capital renewal program that groups $800,000 in building renewal work into a single construction season—versus spreading it across three seasons—saves mobilization costs of $40,000–$80,000, reduces tenant disruption duration, and deploys the reserve fund on schedule. Reserve funds that accumulate excess balances due to deferred capital execution reduce the building's net operating income through opportunity cost. Better capital renewal contractor assembly improves reserve fund deployment efficiency, lowers total project costs, and maintains building condition that supports rental pricing."

