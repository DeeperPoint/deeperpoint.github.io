  body: |
    ## Act A - The Market Structure

    Credit union amalgamations are not ordinary M&A transactions. The parties are member-owned
    cooperatives whose boards are accountable to thousands of individual depositors who have
    the right to vote on the outcome. The regulatory framework is provincial legislation—
    provincial credit union acts, not the Canada Business Corporations Act. The approval
    body is a provincial financial services regulator, not a competition bureau. The success
    criterion is not a shareholders' meeting resolution but a member vote that clears a
    supermajority threshold while preserving the confidence of the merged membership.

    Boards that retain investment bank advisors because they look like the most credible
    M&A option discover at the first town hall that their advisor's presentation—the financial
    modeling, the synergy deck, the integration timeline—sounds and feels like a bank takeover
    to members who joined a credit union specifically to avoid bank-style financial services.
    The advisor can be technically correct and still destroy the member trust that is the
    transaction's primary asset.

    Finding an advisor who has navigated this specific combination of cooperative governance,
    FSRA regulatory requirements, and member confidence management is finding someone from
    a very small community that boards rarely access before the amalgamation clock has already
    started.

    ---

    ## Act B - The Story

    **Janet** chairs a 14,000-member credit union in southwestern Ontario. FSRA has encouraged
    the board to consider amalgamation with a smaller CU in the same region. The board is
    receptive but concerned about member communication. Their legal counsel recommended two
    advisory firms: a regional M&A boutique and a major accounting firm's financial services
    advisory practice. Janet asked both about their credit union amalgamation experience. The
    boutique had completed one credit union amalgamation, in 2014. The accounting firm had
    advised on two—both in BC, under BCFSA, not FSRA. Neither had managed a member vote
    campaign. Neither had worked with a cooperative communications specialist.

    **Robert** has spent 22 years working exclusively with Canadian credit unions and cooperatives.
    He has managed the governance and member communication workstream of eight Ontario credit
    union amalgamations, most under FSRA's current framework. He knows the typical member
    concerns at each phase of the process, the disclosure language that FSRA current staff
    expect in plan filings, and the town hall format that generates constructive member
    dialogue rather than opposition. He operates a small practice, does not advertise, and
    fills engagements through referrals from credit union directors who have worked with him before.
    He is not in Janet's board network.

    Janet queries the platform: Ontario credit union amalgamation, FSRA regulatory jurisdiction,
    member vote management required, 14,000-member union, cooperative governance experience
    required. Robert's profile surfaces as one of three practitioners with FSRA amalgamation
    track record and member communication methodology. Janet reviews his engagement history and
    contacts him directly. He has availability aligned with their timeline. The amalgamation plan
    proceeds with a governance advisor who speaks the cooperative language the membership expects.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Credit union boards selecting amalgamation advisors through standard professional advisory
    networks consistently reach advisors whose expertise is conventional M&A, not cooperative
    governance. The advisors who understand cooperative governance and regulatory requirements
    simultaneously are a known—but undiscoverable—community. DeeperPoint builds the registry
    that makes cooperative expertise visible before the board has committed to the wrong choice.

    *Characters are fictional. The Canadian credit union consolidation wave and the FSRA
    amalgamation approval framework are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
