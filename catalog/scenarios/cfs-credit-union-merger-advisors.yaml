market_example:
  summary: A specialist matching platform connecting Canadian credit unions undergoing
    voluntary amalgamation or OSFI/provincial regulator-directed consolidation with the
    thin pool of advisors who combine credit union regulatory knowledge, cooperative
    governance expertise, and member communication experience—a market where selecting
    the wrong advisor costs the merger two years and damages member trust.
  problem: "Canada's credit union sector is undergoing a prolonged consolidation wave.
    Driven by rising technology investment requirements, talent competition with chartered
    banks, and provincial regulatory pressure to achieve minimum capital and scale thresholds,
    the number of Canadian credit unions has declined from over 800 in 2010 to under 240
    by 2025—and consolidation continues. Credit union mergers are regulated transactions
    with specific provincial requirements: credit union acts in each province mandate member
    vote thresholds, disclosure requirements, regulatory approval timelines, and governance
    transition protocols. The advisory market for credit union amalgamations is a genuine
    thin market. The financial advisory firms that execute most M&A transactions—investment
    banks, corporate finance boutiques—lack familiarity with cooperative governance and
    the specific regulatory approval processes of provincial credit union regulators
    (FSRA in Ontario, BCFSA in BC, DICO, etc.). The credit union–specific consultants who
    understand cooperative governance and member communication—a small community of former
    credit union executives and cooperative management specialists—lack the financial modeling
    and regulatory filing expertise for complex amalgamations. The boards of credit unions
    facing amalgamation routinely discover this gap only after retaining advisors through
    existing board connections, which produces the same small pool of repeat advisors
    regardless of whether their specific expertise matches the amalgamation's complexity."
