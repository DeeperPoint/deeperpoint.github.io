tags: [energy, retrofit, climate, housing, municipalities, canada, heat-pump, contractors]

market_example:
  summary: "Municipal and regional energy retrofit programs for low-to-moderate income homeowners are chronically underspent because eligible homeowners cannot find program-qualified contractors, and qualified contractors cannot efficiently identify eligible homeowners in their service area."
  problem: "Municipalities and regional housing authorities running residential energy retrofit programs face a dual thin market: homeowners eligible for subsidized retrofits cannot easily find contractors qualified under program rules, and qualified contractors cannot efficiently identify and reach eligible homeowners in their service area. Program administrators receive applications from homeowners whose preferred contractors are ineligible, and applications from eligible contractors whose service areas don't match applicant locations — producing lengthy delays, program underspend, and frustrated participants."
  dominant_forces:
    - "Search friction — no mechanism connects eligible homeowners with program-qualified contractors in specific geographic service areas"
    - "Regulatory fragmentation — retrofit incentive programs (Canada Greener Homes, provincial programs, utility-funded efficiency programs) have different technical requirements, contractor registration conditions, and payment processes"
    - "Cognitive overload — a homeowner deciding whether to replace their furnace cannot navigate the combination of federal grants, provincial rebates, utility incentives, zero-interest loans, and municipal matching programs to determine which combination applies to their situation"
    - "Offering complexity — each retrofit project involves a unique combination of baseline energy performance, priority measures, available incentives, financing options, and technical specifications that change with each program funding cycle"
    - "Temporal distance — program funding is annual and time-limited; homeowners and contractors must connect during a narrow eligibility window, and delays result in missed fiscal-year deadlines"
  deeperpoint_fit: "Semantic matching aligns homeowner profiles (house type, current heating system, postal code, income bracket, program eligibility) with contractor profiles (certified measures, service area, program registration status, current capacity) across all applicable programs simultaneously. KnowledgeSlot curates program eligibility rules, technical specifications (NRCan EnerGuide requirements, heat pump specifications, insulation R-value thresholds), contractor registration requirements, and incentive stacking rules by jurisdiction and program year. The Generative Match Story explains to a homeowner exactly which programs they qualify for and why a specific contractor is the right fit. Anticipatory matching proactively notifies eligible homeowners when a qualified contractor is available in their postal code."
  economic_upside: "Energy retrofit programs are among the highest-leverage municipal climate tools: they reduce emissions, lower energy costs for low-income families, create skilled trades jobs, and improve housing stock. Program underspend caused by matching failure is endemic. Better matching converts announced program budgets into actual retrofitted homes, contractor billings, and measurable emissions reductions."

