market_example:
  summary: "A Kenyan-Canadian civil engineer has Canadian P.Eng. credentials and fifteen years of infrastructure project experience. A county government in Kenya is designing a water treatment plant and cannot afford a full-time international consultant, but would pay well for ten hours a week of qualified technical review. Neither knows the other exists, and no platform matches Canadian diaspora professionals to their home-country employers on a structured basis."
  problem: "Canada has trained hundreds of thousands of professionals — engineers, physicians, nurses, lawyers, accountants, urban planners, IT architects — from countries where those credentials and the experience they represent are acutely scarce. Many of these professionals maintain deep personal connections to their home countries and would gladly contribute professional expertise on a part-time, paid basis to projects in those countries. The obstacles are structural rather than motivational. A Ghanaian-Canadian physician in Montreal cannot provide clinical consultations to a rural hospital in Kumasi because the Ghana Medical and Dental Council's remote practice rules are unclear and she has no way to establish a professional liability framework for that engagement. A Pakistani-Canadian software architect in Vancouver cannot provide contract architecture reviews to a Karachi fintech startup because the engagement fee, in Pakistani rupees, is unremittable under current State Bank of Pakistan capital controls. A Bangladeshi-Canadian civil engineer cannot provide project review services to a Dhaka municipality because the municipality's procurement rules require a formal contract with a registered local firm, which she does not have. These obstacles are solvable in each specific case — but only by someone who knows the specific regulatory and payment context, which the Canadian professional almost certainly does not. The matching problem involves not just finding the employer and the professional, but assembling the legal, payment, and regulatory framework that makes part-time diaspora professional employment actually work."
  dominant_forces:
    - "Cross-border professional licensing ambiguity — most developing-country professional regulatory bodies have not established frameworks for telehealth, remote engineering review, or remote legal consultation; the regulatory gap creates liability uncertainty that deters engagement without legal structure"
    - "Payment remittance barriers — professional fees paid in local currency in many developing countries are difficult to remit internationally under capital control regimes; fee structures that avoid this (payment in Canadian dollars by the diaspora professional's home-country employer's Canadian subsidiary) require a legal entity structure most small employers do not have"
    - "Procurement rule incompatibility — government and institutional employers in developing countries often require formal vendor registration, bonding, and local business registration that diaspora individual contractors cannot satisfy"
    - "Credibility signal gap — Canadian credentials are valuable but not self-evidently so to employers in origin countries who have no mechanism to verify their standing or equivalence"
    - "Engagement scale mismatch — the work that home-country employers need is often 5–15 hours per month — too small for formal consulting contracts and too significant for informal advice"
  deeperpoint_fit: "MarketForge lists diaspora professionals by homeland country, professional discipline, and available capacity. Home-country employers post technical advisory and project review opportunities. The platform matches on discipline, capacity, and country pair, then assists with the engagement structure — providing template professional agreements that are reviewable under Canadian law, identifying payment pathways that work for the specific country pair, and loading Knowledge Slot with the relevant cross-border licensing and remittance regulations. A verified completed engagement history creates a diaspora professional advisory record that increases with each completed engagement."
  economic_upside: "Professional knowledge transfer from diaspora Canadians to home-country employers is currently zero-infrastructure, zero-fee, and largely zero-occurring outside personal networks. A platform that generates 1,000 active diaspora professional advisory engagements at an average of $500/month creates $500,000 in monthly platform-facilitated fee flow — with a 5% platform fee, this is $25,000/month ($300,000/year) at very modest scale. At 10,000 active engagements — a realistic number given the scale of Canada's professional diaspora — this is $3M/year. Development finance institutions (Global Affairs Canada's Indo-Pacific Strategy, World Bank diaspora engagement programs) are natural funders of the platform's launch-phase costs."

