story:
  title: The Commissioning Gap
  status: draft
  blog_slug: ""
  characters:
    - "Farah - Project Director, Alberta IPP developing a 50 MW wind-plus-storage project"
    - "Leo - VP Projects, specialty grid-scale electrical and controls contractor, Edmonton"
  summary: "An Alberta IPP discovers that only three Canadian EPC firms have utility-scale
    BESS commissioning records from above 25 MW through a qualification registry platform—
    narrowing an 18-firm RFP short-list to a credible evaluation in 72 hours."
  body: |
    ## Act A - The Market Structure

    Grid-scale battery energy storage is the most complex commissioning challenge in
    modern electrical infrastructure. Integrating a 50 MW lithium iron phosphate system
    with a utility SCADA framework, programming the battery management system to respond
    correctly to frequency regulation dispatch signals, and passing the AESO's grid code
    compliance testing—all before a single commercial dispatch cycle—requires engineering
    experience that most electrical contractors do not have and cannot acquire on a first project.

    The problem for procurers is that the contracting market has not yet separated into
    clearly qualified and clearly unqualified tiers. Everyone is selling BESS experience.
    Distinguishing a firm that commissioning signed off a 30 MW system to AESO operational
    standards from a firm that has installed battery backup systems in commercial buildings
    is not possible from RFP technical approaches and company presentations. The distinction
    becomes apparent only at commissioning—by which point the cost consequences of selecting
    wrongly are catastrophic.

    ---

    ## Act B - The Story

    **Farah** has a 50 MW wind and 25 MW/100 MWh BESS project with an AESO grid connection
    agreement conditional on commercial operation by March 2027. Her financial model is built
    on the BESS providing frequency regulation and spinning reserve services under an AESO
    Ancillary Services Contract. She issued a BESS EPC RFP to 18 firms. Fourteen responded
    with confident technical proposals. Her evaluation committee had no objective mechanism
    to verify the utility-scale commissioning experience that 11 of the 14 firms claimed.

    **Leo** leads a 90-person electrical and controls engineering firm in Edmonton that
    has completed commissioning on two utility-scale BESS projects: a 30 MW system for
    a BC utility and a 20 MW frequency regulation system in Ontario that completed IESO
    commissioning in 2024. Both projects have independent commissioning verification sign-offs.
    His RFP response was technically strong but not the most commercially polished.

    Farah queries the platform for BESS EPC qualifications: minimum 20 MW utility-scale
    commissioning, AESO or comparable grid operator sign-off, LFP battery chemistry experience,
    frequency regulation ancillary service dispatch programming. Three of the 18 responding
    firms surface with verified project records. Leo's firm is one of the three. Farah's
    evaluation committee scores the three qualified firms against technical and commercial
    criteria. Leo's team is awarded the contract. Commissioning completes on schedule.
    The AESO ancillary service contract is activated within the project finance covenant.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The grid-scale BESS contractor market will not self-correct through project failures
    alone—the commissioning failures will be absorbed by IPP developers and ultimately
    by electricity consumers, while the unqualified contractors move to the next RFP.
    DeeperPoint builds the verified commissioning record registry that separates genuine
    grid-scale experience from behind-the-meter capability before the first dollar is committed.

    *Characters are fictional. Grid-scale BESS commissioning complexity and contractor
    qualification challenges are documented across North American energy markets.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
