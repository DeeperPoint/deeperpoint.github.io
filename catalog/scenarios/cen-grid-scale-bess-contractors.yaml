market_example:
  summary: A qualification and matching platform connecting utilities, independent power
    producers, and grid operators procuring grid-scale Battery Energy Storage Systems
    (BESS) with EPC contractors who have demonstrated utility-scale BESS commissioning
    experience—solving a qualification discovery problem in a market where contractor
    experience claims are unverifiable through standard procurement channels.
  problem: "Grid-scale battery energy storage—utility-scale systems from 10 MW to 500 MW+
    paired with renewable generation or providing standalone grid ancillary services—is
    the fastest-growing segment of Canadian electricity infrastructure. Alberta's grid
    operator AESO has hundreds of megawatts of BESS in queue; Ontario's IESO has issued
    RFPs for frequency regulation and operating reserve services from storage; provincial
    utilities across Canada are procuring BESS to firm up renewable integration. The EPC
    contractor market for grid-scale BESS in Canada is thin and young: truly qualified
    contractors—those with completed commissioning experience on systems above 20 MW with
    utility SCADA integration and grid compliance testing—number in the range of 10–20 firms
    nationally. The procurement problem is verification: dozens of electrical contracting
    firms position themselves as BESS-capable in RFP responses, citing battery installation
    experience that is primarily behind-the-meter commercial or industrial in scale, not
    utility-grade. The critical differentiators—utility SCADA integration, state-of-charge
    management under ancillary service dispatch protocols, battery management system integration,
    and performance testing to NERC reliability standards—cannot be verified from contractor
    presentations or standard industrial qualification forms. Utilities and IPPs that select
    unqualified EPC contractors for grid-scale BESS commissioning face project cost overruns
    of 25–50%, commissioning delays of 6–18 months, and operational performance gaps that
    undermine grid service contracts."
  dominant_forces:
    - "Grid-scale BESS commissioning involves utility SCADA integration, ancillary service
      dispatch algorithms, and NERC reliability standard compliance that differ fundamentally
      from behind-the-meter battery installation—but this distinction is effectively invisible
      in standard contractor qualification processes."
    - "The Canadian grid-scale BESS market is doubling every 18 months, with procurement
      volumes outpacing the qualified contractor base—creating systematic pressure on procurers
      to accept contractor self-certification of capability rather than verified project history."
    - "BESS technology is evolving rapidly (lithium iron phosphate chemistry, AC-coupled vs.
      DC-coupled architecture, thermal management systems)—contractor experience with a
      2-year-old project may not be current for today's dominant technology configurations."
  deeperpoint_fit: "KnowledgeSlot encodes the BESS EPC qualification framework: utility SCADA
    interface specifications (DNP3, IEC 61850), state-of-charge management under frequency
    regulation dispatch, battery management system integration requirements, and NERC CIP
    cybersecurity standards applicable to grid-connected storage. CoSolvent matches project
    procurement specifications—MW capacity, DC/AC architecture, grid connection voltage, ancillary
    service type—against contractor profiles built from verified project portfolio records with
    AESO/IESO/utility commissioning sign-offs."
  economic_upside: "Canada's grid-scale BESS procurement is expected to exceed $10B over the
    next decade. A 5% reduction in commissioning cost overruns through better contractor
    qualification saves $500M in avoided project failures. Utilities, IPP developers, and
    provincial energy ministries all have direct financial incentive to sponsor the qualification
    registry."
