market_example:
  summary: "Millions of Canadians with immigrant backgrounds are the primary financial supporters of aging parents overseas, but cannot verify whether the care worker is actually showing up, whether medications are being taken, or whether the parent's condition is deteriorating. The market connects diaspora families to vetted local care workers and physicians, with verified attendance and daily condition documentation replacing the anxiety of unknowing."
  problem: "A Filipino-Canadian registered nurse in Winnipeg pays 25,000 Philippine pesos per month for a caregiver to attend her 81-year-old mother in Iloilo. She has no reliable way to verify that the caregiver is actually present during the contracted hours, that her mother is taking her medications, that her blood pressure readings are being recorded accurately, or that the decline in her mother's voice quality over the past two months is medication-related or something more serious. She calls daily, but her mother minimizes problems to avoid worrying her. The caregiver's references were from a neighbour — unverifiable from Winnipeg. When she asked the caregiver to send daily photos, she received three photos on day one and then silence. This is the same trust gap as diaspora property management, but the stakes are different: an unsupervised renovation leads to a poorly built wall; an unsupervised caregiver leads to preventable deterioration or worse. The matching problem has the same structure: a diaspora principal who cannot physically verify the service they are paying for, and a local service provider who has no accountability infrastructure — with family health as the cost of the gap."
  dominant_forces:
    - "Non-verifiable attendance — care worker presence cannot be confirmed remotely; GPS check-in apps exist but are easily spoofed; a verification system must be credible to both parties"
    - "Medical translation gap — diaspora family members often have healthcare knowledge in English and Canadian clinical context; their parent's local physician communicates in a different language and clinical framework"
    - "Cultural deference barrier — elderly parents routinely minimize health problems and caregiver failures to avoid burdening children abroad; diaspora family members cannot calibrate the actual situation from calls alone"
    - "Care worker quality dispersion — the range of competence among home care workers in high-emigration countries is enormous; no credible certification or matching infrastructure exists in most markets"
    - "Emergency response gap — when a diaspora parent has a fall or acute health event, the diaspora family member has no pre-cleared emergency contact, no physician relationship, and no actionable protocol"
  deeperpoint_fit: "MarketForge matches diaspora families to vetted care workers using a profile system that captures care recipient condition, caregiver experience level, specific health monitoring tasks required, and language compatibility. Verified daily attendance is recorded through a combination of geotagged photo submissions and a simple structured daily report (medications taken, meals, any observations). A physician liaison option matches families to a local doctor willing to provide monthly video consultations with the diaspora family member in English. Emergency protocol documentation is part of the match setup."
  economic_upside: "Remittances for elder care are among the most emotionally charged and abuse-prone financial flows in the diaspora economy. Filipino diaspora remittances to the Philippines exceed $38 billion annually; a significant share supports aging parents. Indian, Pakistani, and West African diaspora communities in Canada have similar elder care obligations. A verified care monitoring platform that reduces caregiver fraud, improves care quality, and gives diaspora families reliable information commands a meaningful premium over informal channels. Association of Filipino Workers in Canada and comparable organizations are natural sponsors."

