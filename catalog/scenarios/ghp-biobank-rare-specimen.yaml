market_example:
  summary: "Researchers studying rare diseases, novel pathogens, and genetic variants need access to specific biospecimen collections — longitudinal serum samples from a specific outbreak cohort, tissue from a rare autoimmune presentation, PBMC from confirmed post-infectious conditions — that exist in biobanks distributed across dozens of countries with no unified discovery mechanism."
  problem: "Biospecimen availability is one of the most critical bottlenecks in translational biomedical research. A researcher studying the long-term immunological sequelae of a novel infectious disease needs longitudinal serum samples collected at defined timepoints from confirmed cases — paired with clinical outcome data, vaccination history, and co-morbidity information. These samples exist: biobanks at national reference laboratories, research hospitals, academic medical centers, and WHO-affiliated specimen collections hold hundreds of millions of biospecimens globally. The problem is discovery. The International Society for Biological and Environmental Repositories (ISBER) directory lists biobanks by institution and broad specimen category but does not capture the specific disease condition, collection timepoint, sample type, and minimum collection size that define a specimen request's eligibility. A researcher seeking post-COVID-19 PBMC samples from patients with confirmed myocarditis, collected at six-month and twelve-month intervals, with matched pre-infection baseline samples, is searching for a collection profile that may exist in three biobanks globally — or in twenty-three — but the researcher has no mechanism to determine this without contacting every potentially relevant biobank individually."
  dominant_forces:
    - "Discovery opacity — biobank catalogues describe collections at the institutional level with broad disease category and specimen type fields that do not encode the specific phenotype, collection timepoint, sample processing method, and clinical annotation depth that defines research eligibility"
    - "Data governance complexity — access to human biospecimens requires ethics board approval, material transfer agreement (MTA) negotiation, and donor consent clause compliance that differ by jurisdiction; a single international biospecimen request may require eight separate ethics reviews"
    - "Participant scarcity — longitudinal collections from specific rare disease events (outbreak cohorts, rare autoimmune conditions, specific genetic variant presentations) may exist in only two or three collections globally"
    - "Trust threshold — biobank custodians must protect donor privacy and collection integrity; they are cautious about sharing detailed catalogue information with unfamiliar researchers before a formal governance pathway is established"
    - "Quality and processing method specificity — specimen processing methods (PBMC isolation protocol, serum separation timing, cryopreservation method, RNA stabilization) affect downstream assay compatibility; a specimen collected under an incompatible protocol is unusable regardless of the phenotype match"
  deeperpoint_fit: "Semantic matching encodes biobank profiles (disease condition by phenotype and exposure status, specimen type and processing method, collection timepoint structure, minimum transfer lot size, clinical annotation depth, ethics governance tier, data privacy framework by jurisdiction) against researcher demand signals (disease condition, specimen type, processing method required, timepoint required, minimum sample size, clinical annotation required, data access format). CoSolvent's trusted intermediary model enables preliminary feasibility disclosure before formal MTA initiation."
  economic_upside: "Drug discovery programs can spend $2M–$10M on biomarker assay development using surrogate specimen collections before discovering that the specific disease phenotype they need for validation is unavailable in accessible biobanks. Rare disease drug development programs — where the entire addressable patient population may be under 10,000 globally — depend critically on biospecimen discovery efficiency. The global translational research biospecimen market is estimated at $4B–$8B annually. A platform that reduces the biospecimen discovery phase from six to twelve months to four to six weeks accelerates the drug development pipeline at the stage where delay is most costly."

