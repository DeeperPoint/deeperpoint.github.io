    type: saas
    revenue_model: "Annual pharmaceutical sponsor subscription ($10,000–$30,000/year based on pipeline volume); academic researcher subscription ($800–$2,000/year); biobank profile listing and catalogue maintenance ($1,000–$3,000/year per institution)"
    strategic_logic: "Global biobank networks (BBMRI-ERIC, Canadian Biobank Network, LifePool), NIH-funded biorepository programs, and WHO Biobanking Network have member institutions seeking to increase specimen utilization. A platform offered through these networks as discovery infrastructure reaches the organized biobank community without direct institutional marketing."
