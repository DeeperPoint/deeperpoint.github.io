market_example:
  summary: "Food manufacturers seeking kosher or halal certification cannot determine which certifying body is appropriate for their target market; certifying bodies cannot efficiently signal their capacity and recognition profile."
  problem: "Canadian food manufacturers seeking kosher or halal certification face a fragmented landscape of certifying bodies with different fee structures, standards rigour, and international recognition profiles. Over a dozen kosher certifying agencies operate in Canada; halal certification similarly involves multiple bodies. Manufacturers cannot determine which agency is recognized by their specific target market, what their facility must undergo, or what mashgiach or halal auditor availability looks like for their region and production schedule."
  dominant_forces:
    - "Opacity — certifying body capabilities and recognition profiles are not systematically described"
    - "Cognitive overload — determining the right agency requires simultaneous evaluation of retailer requirements, export market recognition, ingredient status, facility requirements, and ongoing supervision cost"
    - "Regulatory fragmentation — kosher and halal standards are not government-regulated in Canada, creating genuine variation between bodies"
    - "Trust deficit — manufacturers investing in facility modifications need confidence the certification will remain valid and be recognized"
    - "Participant scarcity — qualified, regionally available mashgichim and halal auditors are in short supply outside major cities"
  deeperpoint_fit: "Semantic matching aligns manufacturer profiles (product category, facility location, target market, production schedule, budget, ingredient list complexity) against certifying body profiles (standard and governing body, geographic coverage, export market recognition, fee structure, specialty categories). CommonContext curates Canadian kosher agency recognition profiles by retailer, CFIA halal labelling guidance, OIC Halal Standard recognition by export destination, and standard facility modification requirements. The Generative Match Story explains which agency is right for the manufacturer's specific situation before any application begins."
  economic_upside: "The Canadian kosher market exceeds CAD $1 billion annually; the halal food market exceeds $1.5 billion. Combined export market access enabled by certification adds several billion more in addressable market. The primary constraint on manufacturer participation is the complexity of navigating certification pathways."

