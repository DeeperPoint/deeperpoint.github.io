  body: |
    ## Act A - The Market Structure

    NI 43-101 is Canada's framework for protecting investors in mining and exploration
    companies—and it is enforced through the legal liability of a single individual, the
    Qualified Person, who must vouch with their professional license for every material
    technical claim a public company makes about a mineral project.

    The system works because the QP's professional license creates a genuine deterrent
    against promotional inflation. What it does not do is ensure that the right QP finds
    the right project. That matching happens through personal professional networks built
    over decades at CIM conferences and in the hallways of PDAC—a system that is
    catastrophically slow when a junior company has a drilling season deadline and two
    weeks to find compliant supervision.

    ---

    ## Act B - The Story

    **Raj** has a problem he didn't see coming. Novus Copper's drilling contractor moved
    up the start date for the winter program by three weeks—taking advantage of a sudden
    rig availability—and Raj needs a QP on site in northern Manitoba in 14 days. Their
    previous QP, a retired Falconbridge geologist, had a cardiac event and cannot travel.
    Finding a replacement through the usual channels—emails to his network, a call to
    the company's geological advisor—has produced two names. The first is booked through
    March. The second has never worked on a magmatic sulphide system; their expertise is
    porphyry copper. That mismatch would undermine the independence determination.

    **Dr. Keig** spent 22 years at Inco and Sudbury-based junior companies characterizing
    magmatic sulphide Cu-Ni-PGE systems across the Sudbury Basin, Thompson Nickel Belt,
    and Raglan area. She retired from Inco two years ago and now takes independent consulting
    engagements on QP supervision contracts. She has two weeks free between her current
    Saskatchewan engagement and a scheduled QP review starting in April. She is in exactly
    the right deposit-type domain. Raj has never heard of her.

    Raj queries the platform for QP availability: magmatic sulphide competency, Manitoba
    jurisdiction, 14-day lead time, full drilling supervision scope. Dr. Keig's profile
    appears—credential-verified, availability confirmed, independence documentation pre-loaded.
    A supervised engagement scope agreement is structured through the platform. Dr. Keig
    is on a flight to Thompson three days later. The program starts on schedule. The NI 43-101
    technical report is filed on time. Novus Copper avoids a TSX-V suspension notice.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    When a single professional's license is the regulatory linchpin of an entire country's
    mining disclosure system, the mechanism for finding that professional must be faster,
    more structured, and more expertise-specific than word of mouth. DeeperPoint builds the
    credentialed QP registry that the industry has needed since NI 43-101 came into force.

    *Characters are fictional. The QP bottleneck is real and regularly delays exploration
    programs and securities filings. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
