market_example:
  summary: A specialist matching platform connecting junior mining companies that need an
    NI 43-101 Qualified Person to supervise drilling, sign technical reports, or provide
    independent sign-off with P.Geo.- or P.Eng.-registered geological consultants who have
    the deposit-type expertise and availability to take on the engagement.
  problem: "Every technical report, resource estimate, and public disclosure made by a
    publicly-listed Canadian mining company under National Instrument 43-101 must be
    reviewed and signed off by an independent 'Qualified Person'—a P.Geo. or P.Eng.
    whose professional credentials and relevant domain expertise make them legally
    responsible for the scientific content of the disclosure. This is not a technicality;
    the QP requirement is the cornerstone of Canada's mineral disclosure regime and the
    primary protection against fraudulent promotions. The structural problem is a severe
    mismatch between the QP supply and the surging demand for QP services during exploration
    booms. QPs are senior geological professionals with decades of specific deposit-type
    experience—they are not interchangeable. A QP with twenty years in Archean VMS systems
    is not a credible independent authority on a platinum-group element intrusion in a
    Proterozoic layered complex. Junior companies in a drilling season need QP availability
    on short timelines, but the market for QP services operates almost entirely through
    personal professional networks. There is no structured registry of available QPs by
    deposit-type expertise, jurisdiction familiarity, and current engagement status—so junior
    companies routinely delay technical report filings, fail to meet regulatory deadlines,
    or make do with QPs whose expertise doesn't match their deposit type."
  dominant_forces:
