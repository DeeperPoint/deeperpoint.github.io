market_example:
  summary: "Municipalities, Business Improvement Areas, and community organizations seeking mural artists for place-specific public art projects — reflecting local history, cultural identity, or community narrative — cannot find artists whose mural experience, stylistic range, and community engagement skills match the project's cultural context, while experienced mural artists outside major cities lack visibility to commissioning organizations."
  problem: "Community mural and public art commissions have surged across Canada as municipalities, BIAs, and neighbourhood organizations use murals for placemaking, heritage interpretation, and downtown revitalization. But the matching between commissioning organization and mural artist is structurally broken outside Toronto, Montreal, and Vancouver. A BIA in Sault Ste. Marie wanting a mural series celebrating the city's Finnish, Italian, and Anishinaabe heritage needs an artist who can paint at architectural scale, engage meaningfully with three distinct cultural communities during the design process, and work within a municipal procurement framework. That artist may be in Sudbury, Thunder Bay, or Kenora — but the BIA has no way to find them. The standard discovery process is a public call for proposals that generates either zero responses (in small cities) or dozens of irrelevant submissions (from artists who have never painted a mural). Municipal arts officers in secondary cities report that finding a qualified, culturally appropriate mural artist is the single most difficult aspect of public art programming."
  dominant_forces:
    - "Mural-specific skill opacity — architectural-scale outdoor painting requires specific technical skills (surface preparation, weather-resistant materials, scaffolding comfort, community co-design facilitation) that are not visible in a standard artist portfolio"
    - "Cultural engagement capacity — community murals require an artist who can facilitate community input sessions, translate diverse cultural narratives into visual imagery, and navigate the politics of public representation"
    - "Geographic discovery gap — mural artists outside major cities are invisible to commissioning organizations in other secondary cities"
    - "Procurement mismatch — municipal procurement processes (RFP, evaluation committee, insurance requirements) are unfamiliar to many independent artists"
  deeperpoint_fit: "Semantic matching encodes mural artist profiles (scale experience, surface types, outdoor durability expertise, community engagement methodology, cultural subject-matter experience, previous mural portfolio with location and commissioner type, insurance and procurement documentation readiness) against commissioning organization demand signals (wall dimensions, surface type, cultural subject matter, community engagement requirements, budget, timeline, procurement format). Portfolio analysis surfaces stylistic and thematic match beyond keyword search."
  economic_upside: "Municipal public art spending in Canada exceeds $100M annually. Community mural commissions — excluding major institutional public art — represent $15–30M. A platform capturing 15% of secondary-city mural commissions generates $2–4.5M in facilitated commissions and measurably improves the cultural quality of public art in Canadian communities."

