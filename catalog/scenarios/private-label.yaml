market_example:
  summary: "Independent grocery chains developing private label programs cannot reach processors with matching formulation capability; processors cannot identify which retailers are actively developing new categories."
  problem: "Independent grocery chains with private label ambitions need processors who can develop and produce a custom formulation to a specific retailer brief. Meanwhile, Canadian specialty food processors with formulation capability and spare capacity cannot efficiently identify which retailers are actively developing private label programs and in which categories. Private label development is multi-stage and commitment-intensive; existing discovery is entirely referral-based."
  dominant_forces:
    - "Opacity — retailers developing private label don't advertise publicly; processors aren't in retail-facing directories"
    - "Offering complexity — fit requires matching on formulation capability, price architecture, certifications, scale, and timeline"
    - "Trust deficit — private label involves the processor knowing the retailer's margin structure; retailer trusting the processor with brand reputation"
    - "Strategic information withholding — both parties are reluctant to disclose category strategy or client relationships prematurely"
    - "Cognitive overload — evaluating private label development in multiple categories simultaneously requires structured support"
  deeperpoint_fit: "The trusted intermediary protocol is essential: retailer private label category strategy is disclosed to the matching AI but not to processors until mutual expression of interest. Semantic matching aligns retailer briefs (category, target price point, nutritional requirement, certifications, volume, launch timeline) against processor profiles (formulation capability by category, certifications, capacity, prior private label experience). KnowledgeSlot curates CFIA private label labelling requirements and standard private label agreement terms."
  economic_upside: "Canadian grocery private label penetration (~25%) is significantly below UK (40%+) and EU averages. The gap represents substantial opportunity for both retailers (margin, differentiation) and Canadian food processors (stable volume, longer-horizon contracts)."

