market_example:
  summary: "A Nigerian-Canadian inherits a Lagos compound — and discovers she is the named executor of an estate under Nigerian law, with six family members who may have claims and a lawyer who has quoted $8,000 without explaining the process. The market matches diaspora executors to homeland estate lawyers with non-resident experience and to Canadian diaspora legal navigators who can prepare clients for what to expect and what to watch for."
  problem: "Diaspora Canadians who inherit property, are named as executors, or face property disputes in their home countries are navigating foreign legal systems that operate on different timelines, different fee structures, different evidentiary standards, and — critically — different informal expectations than the Canadian legal system. An Indian-Canadian engineer in Mississauga who is the joint owner of a family plot in Kerala that needs subdivision faces a procedural system in which a simple matter can take two to seven years without active management and personal presence. A Ghanaian-Canadian teacher in Hamilton who is named executor of her mother's estate in Accra needs to understand the relationship between customary land tenure (which may govern her mother's home) and statutory succession law, a distinction that will affect the outcome for six family members and that neither Canadian Google searches nor Canadian estate lawyers can explain. The matching problem is layered: the diaspora Canadian needs first to find a homeland lawyer with actual experience in non-resident executor cases (who will communicate reliably with a client in a different time zone, not just bill hours and go silent), and second to understand enough about the process that they can monitor the engagement rather than being led blindly. A Canadian diaspora legal navigator — a Canadian-licensed paralegal or lawyer who has specific knowledge of a given homeland country's legal processes — fills the second role."
  dominant_forces:
    - "Legal system opacity — diaspora Canadians lack basic knowledge of homeland procedural timelines, fee structures, court systems, and the informal expectations (fixers, court registrars, government certificate offices) that shape how cases actually proceed"
    - "Remote executor incapacity — many probate and property transactions in homeland countries require in-person presence, notarized documents, or wet signatures that diaspora Canadians cannot provide without travel; electronic power of attorney availability varies by country"
    - "Attorney accountability gap — diaspora clients paying homeland attorneys in local currency have limited leverage to demand communication standards or milestone reporting; the attorney's local reputation is not visible to a Canadian client"
    - "Family complexity — diaspora estates frequently involve multiple family members in the homeland country whose claims, relationships, and informal expectations the diaspora executor must navigate without being present"
    - "Fee structure shock — homeland estate lawyers often quote in structures that are unfamiliar to Canadian clients (percentage of estate value, informal facilitation fees, government certificate charges not disclosed upfront); diaspora clients without a navigator overpay systematically"
  deeperpoint_fit: "MarketForge matches diaspora Canadians to homeland estate lawyers with a verified non-resident executor track record, filtered by homeland country and estate type (property, business interest, testate/intestate). A diaspora legal navigator profile — available for Indian, Nigerian, Ghanaian, Philippine, and other major corridors — provides onboarding consultation to help the client understand what to expect, prepare questions, and monitor the engagement. Knowledge Slot carries country-specific probate timelines, government certificate requirements, e-POA availability, and fee structure norms — giving diaspora clients the baseline knowledge to evaluate whether their attorney's bill is reasonable."
  economic_upside: "Diaspora estate and property legal matters represent tens of thousands of unresolved cases across Canada at any given time, most proceeding slowly, expensively, and with high client dissatisfaction. The primary cost is not legal fees — it is the lost time value of unresolved estates and the family friction caused by years of uncertainty. A platform that reduces average estate resolution time and gives diaspora clients cost-effective monitoring has a clear value proposition at fees well below the cost of uninformed engagement. Legal navigator service at $150/hour for a 5-hour onboarding and monitoring engagement costs the diaspora family $750 — compared to potentially $5,000–$15,000 in overpaid attorney fees without it."

