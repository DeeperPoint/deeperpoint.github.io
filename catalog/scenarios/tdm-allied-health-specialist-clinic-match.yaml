tags: [talent-matching, allied-health, occupational-therapy, speech-language, physiotherapy, community-clinic, pediatric, geriatric, semantic-matching, rich-profile, population-specialty]

market_example:
  summary: "Community clinics, pediatric practices, and specialty rehabilitation centers
    need allied health professionals — OTs, SLPs, PTs, RDs — whose population and setting
    experience matches their client base with specificity that a registration and years-of-
    experience filter cannot provide. A rich-profile platform where clinics upload program
    documents and practitioners upload case type narratives, publications, and training
    certificates enables semantic matching on the clinical practice that matters."
  problem: "An occupational therapist who has spent six years working with adults recovering
    from stroke in an acute hospital setting and an occupational therapist who has spent six
    years working with autistic children in a school-based program carry the same OT registration
    and may list the same credential level on a resume. For a pediatric autism clinic seeking
    a new OT, these candidates are not equivalents. The clinical reasoning, the assessment
    tools, the family support approach, the interdisciplinary collaboration norms, and the
    outcome measurement frameworks are entirely different between acute neurorehabilitation
    and pediatric autism intervention. The wrong hire — the stroke rehab OT in the autism
    clinic — will need twelve months of retraining and will deliver lower-quality intervention
    to a vulnerable population in the interim. This mismatch is entirely preventable from
    documents: the stroke rehab OT's client narratives, case study writeups, and continuing
    education certificates all demonstrate the neurorehabilitation focus; the autism intervention
    OT's practice documents demonstrate the pediatric and neurodevelopmental focus. Community
    and specialty clinics in Canada routinely hire allied health professionals by credential
    and registration status, interview them for values alignment, and discover the population
    and setting mismatch only after onboarding — at high cost to both the professional and
    the client population. The rich-profile matching model allows clinics to upload their
    program descriptions, clinical protocols, case complexity profiles, and exemplary assessment
    report formats, and allows practitioners to upload continuing education certificates,
    clinical case study writeups (appropriately anonymized), published work, program development
    proposals, and any other documents that represent their clinical practice. Semantic matching
    across this document corpus identifies the practitioners whose documented clinical practice
    aligns with the clinic's documented service model."
  dominant_forces:
    - "Allied health clinical competence is population-, setting-, and approach-specific in
      ways that registration credentials cannot capture: an SLP with a pediatric articulation
      and language disorder specialty provides qualitatively different clinical value to a
      school-based program than an SLP whose practice has been entirely in adult dysphagia
      management — the same registration covering fundamentally different clinical practices."
    - "Community and specialty clinics in rural and remote areas, and those serving specific
      cultural communities, need allied health professionals whose cultural competence, language
      capability, or geographic comfort matches the community served — attributes that are
      visible in practitioner background documents (training certificates, community program
      involvement, cultural competency training records, lived experience disclosures) but
      invisible in a credential filter."
    - "New graduates in allied health professional programs are difficult to evaluate through
      standard credential-based hiring because their clinical placement records, capstone
      project reports, and clinical supervisor assessments contain substantially more evaluable
      information about their clinical approach and population interest than their registration
      certificate alone — but clinical supervisors and academic program directors are not
      connected to the clinic hiring market in a structured way."
  deeperpoint_fit: "CommonContext encodes the allied health population and setting taxonomy:
    OT specialty areas (pediatric neurodevelopmental, adult neurorehabilitation, geriatric
    falls prevention, mental health and psychosocial rehabilitation, assistive technology);
    SLP specialty areas (pediatric language and articulation, autism and AAC, adult dysphagia,
    aphasia, fluency); PT specialty areas (musculoskeletal orthopaedic, neurological
    rehabilitation, vestibular, pelvic health, pediatric). CoSolvent semantically matches
    the clinic's document corpus (program descriptions, clinical protocols, assessment
    report exemplars, case complexity profiles) against the practitioner's document corpus
    (continuing education certificates, anonymized case writeups, capstone project reports,
    publications, cultural competency training records) — identifying the population and
    setting match that registration credentials cannot provide."
  economic_upside: "Canada's allied health workforce — occupational therapists, speech-language
    pathologists, physiotherapists, dietitians, and audiologists — numbers approximately
    90,000 registered professionals, with community clinic, pediatric practice, and specialty
    rehabilitation center hiring representing an estimated 8,000–12,000 positions annually.
    Average cost of an allied health wrong hire in a specialty clinic (recruitment, onboarding,
    reduced service quality during retraining, early departure) is estimated at $25,000–60,000.
    A platform reducing wrong-hire rates in 20% of specialty allied health hiring prevents
    $40–144M in annual wrong-hire costs. Platform subscription revenue at $600–1,500/month
    per active clinic job profile generates $6–18M annually across the specialty allied
    health employer market."

sponsor_opportunities:
  - title: "Allied Health Specialist Matching Platform SaaS"
    type: saas
    revenue_model: "Clinic subscription ($600–1,500/month per active position; covers
      clinical document corpus ingestion, population-and-setting-aware semantic indexing,
      and match explanation with clinical specificity); practitioner profile hosting
      (free; premium CE certificate integration and clinical portfolio tools at $60–120/year)."
    strategic_logic: "Specialty clinics pay for allied health recruitment support because
      clinical wrong hires in specialized populations — pediatric autism, geriatric falls,
      pelvic health — create both client care quality problems and regulatory exposure.
      A matching service that reads clinical practice from documents rather than credentials
      provides a qualitatively different service than registration-board member directories
      or generalist job boards."
    recurring: true

  - title: "Clinical Placement Record Integration Service"
    type: managed-service
    revenue_model: "Annual integration subscription for allied health academic programs
      ($8,000–20,000/year per program; connects graduating student clinical placement
      records, capstone project reports, and clinical supervisor assessments into the
      matching platform — enabling clinics to identify graduating students whose clinical
      placement profile matches their service model before graduation)."
    strategic_logic: "Allied health academic programs — OT, SLP, PT programs at Canadian
      universities — maintain detailed clinical placement records, supervisor assessments,
      and capstone project reports for every graduating student. This institutional information
      is exactly what specialty clinics need to evaluate new graduate fit and is not available
      through any standard hiring channel. An integration that converts the academic clinical
      record into a structured candidate profile creates a direct pipeline from allied health
      programs to specialty clinic employers."
    recurring: true

  - title: "Cultural and Linguistic Competency Profile Matching Extension"
    type: commerce-extension
    revenue_model: "Cultural competency profile add-on for clinics serving specific
      cultural communities ($200–500/month per clinic; enables matching on practitioner
      language capabilities, cultural competency training records, lived experience
      disclosures, and community connection documents alongside clinical practice matching)."
    strategic_logic: "Clinics serving Indigenous communities, recent immigrant populations,
      or specific cultural communities need allied health professionals whose cultural
      competency and community connection match the client population as much as their
      clinical specialty does. A cultural competency matching extension that reads
      practitioner documents (cultural safety training records, community involvement
      evidence, language proficiency documentation) expands the matching to the full
      set of attributes that determine success in community-specific clinical roles."
    recurring: true

  - title: "Continuing Education and Specialty Certification Pathway Service"
    type: commerce-extension
    revenue_model: "CE pathway subscription per practitioner ($80–200/year; identifies
      the continuing education courses, specialty certifications, and mentorship programs
      that would advance the practitioner's match score for the specific clinic roles
      in their target practice area); clinic-sponsored CE subsidy program facilitation
      (connecting clinics willing to subsidize CE for matched candidates with the candidates
      who need specific CE to qualify for the role)."
    strategic_logic: "A practitioner who is a 70% match for a specialty clinic role —
      strong in clinical population fit but missing a specific certification — is much
      more valuable to the clinic than a 40% match with the right credential list.
      A CE pathway service that identifies the specific training gap and facilitates
      the CE course — potentially subsidized by the hiring clinic — converts near-matches
      into strong placements while creating a practitioner development revenue stream
      from the professional development investment clinics are already making."
    recurring: true

story:
  title: "The Assessment Nobody Recognized"
  status: draft
  blog_slug: ""
  characters:
    - "Dr. Sarah - clinic director, pediatric autism and neurodevelopmental services, Saskatoon"
    - "Maya - OT, autism and AAC specialty, new graduate, recently completed 14-month clinical placement in pediatric autism program, Saskatoon"
  summary: "A Saskatoon pediatric autism clinic that has been unable to find an OT with
    autism intervention and augmentative communication experience through three months of
    posting finds a new graduate OT whose capstone project, clinical placement supervisor
    assessment, and AAC equipment training certificate demonstrate exactly the clinical
    profile the clinic needs — documents that never appeared in her job application because
    no application field asked for them."
  body: |
    ## Act A - The Market Structure

    New graduate allied health professionals are particularly poorly served by credential-
    based hiring. They all hold the same credential — the degree and the registration.
    The differences between them — the clinical population they focused on during their
    training, the intervention approaches they developed competence in, the supervisor
    assessments that rated their reasoning and communication, the capstone projects that
    demonstrated their clinical interest — are documented in institutional records that
    the employment market has no mechanism to access or evaluate.

    A new OT graduate whose fourteen months of clinical placements were concentrated in
    pediatric autism and AAC programs at a specialized center has clinical foundation
    experience that is directly relevant to a pediatric autism clinic's needs — and
    entirely invisible to an employer who sees only 'new graduate OT, University of
    Saskatchewan, 2024.' The clinical placement record, the supervisor assessment, the
    AAC equipment manufacturer training certificate, and the capstone project report on
    PECS protocol implementation all contain evaluable, specific evidence of clinical
    population focus. They are in the university's records. They are not in the job
    application form.

    The employer who needs an OT with autism and AAC experience and the new graduate who
    spent fourteen months developing exactly that experience are in the same city. The
    information that would complete the match is in institutional documents that no
    hiring platform currently has a mechanism to ingest.

    ---

    ## Act B - The Story

    **Dr. Sarah** directs a pediatric autism clinic in Saskatoon serving 120 children
    and their families. Her clinic uses the ESDM (Early Start Denver Model) with augmentative
    communication integration — a specific clinical approach that requires OT practitioners
    who understand both the ESDM framework and AAC device programming and family coaching.
    She had been posting for a new OT for three months. The Saskatchewan OT registration
    body's public directory listed 40 OTs in Saskatoon. Three had responded to her posting.
    None had autism-specific or AAC experience. She had considered hiring a new graduate
    if she could find one with the right clinical foundation.

    Dr. Sarah uploaded her clinic's job posting, the program description for the ESDM
    service model, an exemplary AAC device programming report from her current senior OT,
    and the clinic's family coaching protocol document.

    **Maya** had deliberately structured her OT training around pediatric autism and
    neurodevelopmental intervention. Her two longest clinical placements — seven months
    at a pediatric autism program and seven months in a school-based AAC program — had
    given her more autism and AAC clinical hours than most practicing OTs in the province.
    She had completed a capstone project on PECS protocol fidelity assessment for
    preschool-age children with autism. Her clinical supervisor at the autism program
    had written an assessment describing her ESDM-informed clinical reasoning in specific
    terms. She had completed a Tobii Dynavox device programming certification. She had
    applied to Dr. Sarah's clinic through the Saskatchewan Health Authority job portal.
    Her application listed 'University of Saskatchewan OT graduate, clinical placements
    in pediatric and school settings.' The job portal had no field for clinical placement
    specialization, capstone project title, or equipment certification. Her application
    looked identical to every other new OT graduate who applied.

    Maya uploaded to the rich-profile platform: her capstone project report (title and
    abstract), her Tobii Dynavox certification, a letter from her clinical supervisor
    at the autism program describing her clinical reasoning (shared with supervisor
    consent), and an anonymized case writeup she had done for her capstone demonstrating
    PECS protocol implementation. The semantic matching engine found her profile against
    Dr. Sarah's clinic corpus: the ESDM vocabulary in her supervisor letter matched the
    ESDM program description; the AAC device programming content in her Tobii certification
    matched the exemplary AAC report; the PECS protocol content in her capstone matched
    the clinical approach described in the family coaching protocol.

    Dr. Sarah received the match notification and the explanation. She called Maya within
    the hour. Maya was hired before the end of the week.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Maya's clinical training was the most specific possible preparation for Dr. Sarah's
    role. That specificity was fully documented in institutional records, supervisor
    assessments, and a manufacturer training certificate. The job portal that separated
    them had no mechanism to ingest any of those documents. The application form had no
    field that captured the information that made Maya the right match.

    The infrastructure failure is not in the candidates or the employers. It is in the
    application forms and job board architectures that were designed for credential filtering,
    not for clinical practice matching. Building the infrastructure that reads the documents
    instead of the credential list is all that is required to find these matches — and they
    are waiting to be found in every allied health specialty in every Canadian city.

    *Characters are fictional. OT clinical specialty distinctions between autism intervention
    and neurorehabilitation, ESDM methodology, and AAC integration in pediatric programs
    are factual. [DeeperPoint](../../marketforge.html) is building the infrastructure
    this story describes.*
