market_example:
  summary: "A timber licence holder with a steep slope, riparian buffer, or ecologically sensitive harvest area requiring helicopter, cable yarding, or horse logging methods cannot find a qualified specialty contractor through standard forest operations directories — while contractors specializing in these methods have no efficient mechanism to surface themselves to volume licence holders who need their capability."
  problem: "The conventional logging market is well-served by established contractor relationships and provincial operations directories. The specialty low-impact logging market — helicopter logging for inaccessible steep terrain, cable yarding (highlead, grapple yarder) for slopes above 35%, horse logging for sensitive riparian and old-growth areas, and Nordic-style single-grip harvester systems for partial-cut operations — is a thin market defined by specialized equipment, crew certification, and operational methodology that most forestry operations directories do not distinguish from conventional logging. For a BC timber licence holder with harvest blocks on slopes above 60% gradient — the practical limit for ground-based mechanized logging — helicopter logging is the only legal harvesting method. The number of helicopter logging contractors operating in BC is small and geographically concentrated. Their availability, equipment type (heavy lift versus medium lift helicopter, longline versus quick-release hook configuration), and crew certification profile varies significantly. A licence holder planning a helicopter harvest block needs a contractor whose helicopter lift capacity matches the average wood piece weight in the block, whose crew has experience with specifically the slope angle and terrain type, and whose mobilization schedule is compatible with the cutting permit timeline — a three-constraint match that no BC forest operations directory indexes."
  dominant_forces:
    - "Equipment-to-wood match specificity — helicopter logging efficiency depends on matching helicopter lift capacity to average piece weight for the specific species and log length being harvested; an undersized helicopter on a high-density Douglas fir block produces poor cycle times and uneconomical extraction costs"
    - "Crew certification specificity — helicopter logging crew members require specific safety certifications (helicopter long-line procedures, hover-exit safety, rigging for aerial extraction) that ground-based logging crews do not have; a contractor whose helicopter crew certificates are not current is unavailable for a certified block"
    - "Geographic mobilization economics — helicopter logging contractors base their equipment at specific staging areas; mobilization cost to a harvest block is a function of flight hours from base, which determines the break-even extraction distance that makes helicopter logging economically viable for the licence holder"
    - "Environmental permit coordination — specialty logging in riparian zones, old-growth reserves, and caribou habitat requires environmental monitor coordination and specific operational protocols that standard logging contractors have not established"
    - "Seasonal and weather window constraints — helicopter logging operations are weather-constrained to visual flight conditions; contractor availability windows are unpredictable and must align with both the cutting permit window and seasonal weather patterns"
  deeperpoint_fit: "Semantic matching encodes contractor profiles (harvest method specialty — helicopter type and lift capacity, cable yarding system type, horse logging, Nordic partial-cut system — crew certification currency, primary operating region and staging base, mobilization cost structure by distance tier, environmental protocol compliance by habitat type, available operating windows) against licence holder demand signals (harvest block location, terrain slope and aspect, species and log length, harvest method required, timber volume, cutting permit window, environmental sensitivities, budget per cubic metre). CommonContext encodes BC timber harvesting regulation slope-gradient method requirements."
  economic_upside: "Helicopter logging in BC harvests approximately 2–4 million cubic metres annually — roughly 3–6% of provincial AAC (Annual Allowable Cut) — at extraction costs of $80–$180 per cubic metre versus $15–$35 for ground-based methods. The premium extraction cost is unavoidable for steep terrain: the alternative is either leaving the timber in environmentally compliant non-harvest areas or incurring road construction costs that often exceed the timber value. A platform that reduces average helicopter logging contractor search time from eight weeks to two weeks — allowing licence holders to plan cutting permit windows with matched contractor capacity — prevents the costly cutting permit window misses that currently cost licence holders $500,000–$5M per cancelled harvest block. The BC helicopter and cable yarding specialty market represents an estimated $200M–$400M in annual harvest value."

