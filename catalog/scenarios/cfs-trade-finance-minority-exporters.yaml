market_example:
  summary: A structured matching platform connecting minority-owned Canadian exporting companies—
    too small for EDC programs, too complex for standard bank trade finance—with specialty
    factors and trade finance providers whose programs serve the transaction sizes, markets,
    and business profiles common in Canada's diverse small exporter community.
  problem: "Canada's trade finance system has a well-documented gap for small exporters.
    Export Development Canada's primary insurance and guarantee programs have minimum
    transaction thresholds and minimum annual export revenue requirements that exclude
    the majority of Canada's 45,000 exporting SMEs. Chartered bank trade finance products—
    letters of credit, documentary collections, export factoring—are structured for established
    business banking relationships with multi-year operating history and hard asset collateral.
    The gap falls particularly sharply on minority-owned small exporters: immigrant-owned
    businesses exporting to diaspora markets (clothing, food products, specialty goods to
    South Asian, West African, Caribbean, and East African markets), First Nations economic
    development corporations exporting natural products to Indigenous consumer markets,
    and women-owned businesses in sectors where cross-border sales are the primary growth
    path. These exporters share specific characteristics: their export markets are often
    informal, high-growth, relationship-based markets that bank underwriters struggle to
    risk-assess; their export receivables are in currencies and from counterparties whose
    creditworthiness is not covered by standard trade credit insurance; their transaction
    sizes ($10,000–$500,000 per shipment) are below the minimum economic threshold for
    bank trade finance operations. Specialty factors and minority-market trade finance
    providers who serve exactly this profile—community development finance institutions,
    specialty factors with diaspora market expertise, EDC-partnered credit unions—exist
    but are structurally invisible to exporters navigating standard bank trade finance rejection."
  dominant_forces:
    - "EDC program eligibility thresholds systematically exclude early-stage small exporters
      whose annual export revenue is below $1M—precisely the companies for whom trade
      receivables risk is most existential."
    - "Bank trade finance underwriting relies on counterparty credit ratings and established
      market credit data that does not cover the informal import markets, diaspora distribution
      networks, and emerging market export channels where minority-owned Canadian exporters
      have competitive advantage."
    - "Specialty factors and community trade finance providers with diaspora and emerging
      market expertise exist but have no efficient mechanism to reach minority-owned
      exporters beyond their immediate community networks."
  deeperpoint_fit: "KnowledgeSlot encodes the trade finance instrument framework for small
    exporters: invoice factoring vs. purchase order financing vs. supply chain finance, EDC
    accounts receivable insurance structures for small exporters, and the alternative trade
    finance providers who specialize in diaspora and emerging market export receivables.
    CoSolvent matches exporter profiles—export market, product type, transaction size, buyer
    creditworthiness documentation, minimum revenue—against trade finance provider profiles
    organized by eligible export markets, transaction size minimums, and business profile
    suitability."
  economic_upside: "Canada's small exporter community includes 45,000+ companies; the segment
    below EDC standard program thresholds represents an estimated $2–5B in annual export
    receivables seeking trade finance. Closing even 5% of the trade finance gap for this
    segment would represent $100–250M in new annual receivables financing. Platform revenue
    via subscription for trade finance providers and per-transaction referral fees."
