    - "David - Portfolio Manager, specialty trade finance facility for diaspora markets, CDFI, Toronto"
  summary: "A Toronto plantain products exporter whose receivables from informal West African
    distribution networks are rejected by bank trade finance finds a diaspora-specialized CDFI
    trade factor through a small-exporter trade finance matching platform."
  body: |
    ## Act A - The Market Structure

    International trade finance exists to solve a specific problem: the time between
    shipping goods and receiving payment is a gap that can bankrupt a small producer
    even when their buyer is reliable and the product is in demand. The mechanism—
    invoice factoring, supply chain finance, letters of credit—has existed for centuries.

    For large exporters with creditworthy counterparties in rated markets, it works
    smoothly. For small exporters sending goods to rapidly growing but informally
    structured markets—the West African community in the UK, the Caribbean diaspora
    grocery network across the US and Canada, the East African specialty food market—
    the standard trade finance system has no product. The banks' trade finance underwriting
    requires buyer credit ratings, country risk assessments within their own approved country
    lists, and minimum transaction sizes. None of these conditions hold for diaspora market
    export channels, whose commercial relationships are real, whose payment histories are
    reliable, and whose growth trajectories are strong—but whose creditworthiness is
    invisible to standard trade finance underwriting.

    ---

    ## Act B - The Story

    **Amara** manufactures specialty plantain products in Scarborough with $1.2M in annual
    revenue. Sixty percent of her revenue comes from export—primarily through diaspora
    distribution networks in the UK, the Netherlands, and select West African markets.
    Her buyers are reliable; her average receivable collection is 45 days. But she has
    a $180,000 gap between product delivery and payment that her working capital cannot
    bridge during peak production months. Her bank declined invoice factoring: her buyers
    are informal distributors without credit ratings, in countries not on the bank's
    approved trade finance market list. EDC's accounts receivable insurance program has
    a minimum annual export revenue threshold she doesn't yet meet.

    **David** manages a $12M trade finance facility at a community development finance
    institution that specializes in diaspora-market export receivables. He has developed
    a proprietary buyer assessment methodology for informal distributors in West African
    and Caribbean markets, based on relationship history, community reputation, and shipping
    document track record rather than formal credit ratings. His facility has funded $8M
    in factored receivables over three years with a 96% collection rate. He originates
    through relationships with two Toronto trade finance lawyers and a single referral
    from the Black Business and Professional Association. He cannot scale origination
    beyond his personal network.

    Amara queries the platform: trade finance type (invoice factoring), export market
    (West Africa/UK diaspora), buyer type (informal distributor, no credit rating),
    transaction size ($15,000–$40,000 per invoice), annual export revenue ($720,000).
    David's facility surfaces as one of two providers in Canada with buyer assessment
    methodology for informal diaspora market distributors. Amara submits three invoices
    for factoring within two weeks of the match. David's facility funds them at 80%
    advance rate within 48 hours of invoice verification. Her working capital gap closes.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Canada's minority-owned small exporter community has genuine export markets, reliable
    buyers, and strong growth potential. What it lacks is access to trade finance that
    understands its buyers. The CDFIs and specialty factors who have built that understanding
    cannot reach the exporters who need them through standard bank referral networks.
    DeeperPoint builds the matching platform that connects the exporter with the trade
    finance provider who was built for exactly their market.

    *Characters are fictional. The trade finance gap for small minority-owned Canadian
    exporters is documented by EDC and Export Promotion Canada.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
