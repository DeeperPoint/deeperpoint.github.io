market_example:
  summary: "Indigenous Nations and private forest landowners with eligible carbon sequestration potential cannot find carbon project developers with the specific methodology expertise — BC Forest Carbon Offset Protocol, voluntary market REDD+, improved forest management IFM — and the community partnership model required for projects that generate revenue without surrendering land stewardship control."
  problem: "The voluntary forest carbon market in Canada — particularly in British Columbia under the BC Forest Carbon Offset Protocol and through internationally traded voluntary market credits verified under VCS or Gold Standard — represents one of the most structurally mismatched thin markets in Canadian natural resources. On the supply side: hundreds of First Nations, Métis communities, and private woodlot owners across BC, Ontario, and Quebec hold forested land with eligible carbon sequestration and avoided deforestation potential. Many have never quantified their carbon potential, do not know which voluntary market methodology applies to their situation, and have no mechanism to evaluate which project developers are trustworthy partners. On the demand side: a small number of carbon project developers have the methodology expertise, market relationships, and verification track record to develop and sell forest carbon credits into voluntary and compliance markets — but they lack efficient access to the landowner supply side except through legal firms, treaty offices, and government programs that are not organized for their commercial purposes. The matching problem is compounded by trust: Indigenous Nations who have experienced exploitative resource extraction relationships over generations are deeply cautious about entering commercial agreements with developers whose intentions, methodology expertise, and revenue-sharing terms they cannot evaluate through any organized information source."
  dominant_forces:
    - "Methodology specificity — BC Forest Carbon Offset Protocol, VCS REDD+, Improved Forest Management (IFM), and Afforestation/Reforestation methods each apply to different forest types, ownership structures, and land management histories; the developer's methodology expertise must match the landowner's eligible credit type"
    - "Trust and Indigenous governance — First Nations carbon project agreements require engagement with both elected band council governance and, in many cases, hereditary governance structures whose authority over traditional territory is legally distinct; developers without experience navigating this governance structure cannot build functional project partnerships"
    - "Baseline and additionality complexity — forest carbon credit legitimacy depends on demonstrating that the carbon sequestration would not have occurred without the project (additionality) and on establishing a credible baseline of carbon stocks; developers with imprecise baseline methodology create regulatory risk for the landowner"
    - "Revenue-sharing structure opacity — the range of developer-landowner revenue sharing models is wide (25–75% to landowner) and the structures (upfront payment, per-credit royalty, co-ownership) are not comparable without expertise in carbon project finance"
    - "Long project timelines — forest carbon projects under BC FCOP require 25+ year agreements; First Nations and landowners entering 25-year agreements with a developer are making a generational commitment that requires high trust and clear governance terms"
  deeperpoint_fit: "Semantic matching encodes developer profiles (methodology expertise by protocol and forest type, verified project track record by credit type and jurisdiction, revenue-sharing model range, Indigenous community partnership experience, community benefit program history, verification body relationships) against landowner demand signals (forest type and acreage, applicable methodology, governance structure, revenue-sharing floor, term length acceptable, Indigenous partnership preference, community benefit priorities). CoSolvent's trust model enables community-controlled initial vetting before commercial disclosure."
  economic_upside: "BC's forest carbon offset market has generated over $1B in credit value since 2008. The voluntary carbon market for forest projects traded at $8–$15 per tonne of CO2 in 2023; a typical 10,000-hectare forest carbon project can generate 50,000–150,000 tonnes of credits per year, representing $400,000–$2.25M in annual credit value. First Nations hold title or stewardship authority over tens of millions of hectares of forested land in Canada that has never been assessed for carbon credit potential. A platform that connects 50 Nation-developer partnerships per year on successful 25-year projects — at average annual credit value of $500,000 — represents $25M in new annual forest carbon revenue flowing to Indigenous communities."

