story:
  title: "The Call at 6 AM"
  status: draft
  blog_slug: ""
  characters:
    - "Priya — epidemiologist, FETP graduate, currently attached to an academic medical centre in Halifax"
    - "Dr. Renata — Chief Medical Officer, regional health authority, interior British Columbia"
  summary: "A BC regional health authority Medical Officer of Health needs a Norovirus outbreak investigator with long-term care facility experience on a 48-hour timeline. The right person is in Halifax and has never worked in BC — but her availability and her credential profile are already in the platform."
  body: |
    ## Act A — The Speed Problem

    Outbreak investigation is time-sensitive in a way that most government specialist deployment is not. When a cluster of gastrointestinal illness appears in a 200-bed long-term care facility, the window for effective epidemiological response is measured in days. A competent outbreak investigator who arrives on day twelve is not a solution — the outbreak has either resolved or escalated beyond the point where field epidemiology changes the trajectory.

    Provincial health authorities know this. They maintain relationships with their provincial network specialists and with PHAC field teams precisely because they expect to need them quickly. But those networks are finite, and surge events do not distribute evenly across the relationships that exist. A health authority experiencing its third simultaneous outbreak in a month has exhausted its personal contact list. The question is where to look next, and how fast the answer comes back.

    The following is a short fictional account of what happens when the answer takes hours instead of weeks.

    ---

    ## Act B — The Story

    **Dr. Renata** got the call at 5:40 AM. A 214-bed long-term care facility in her health authority's catchment had thirteen confirmed gastroenteritis cases across two wings — eleven residents, two staff — with lab samples submitted and preliminary results due in six hours. The facility's infection control practitioner had identified two additional probable cases overnight.

    Her immediate problem was not laboratory capacity. It was field investigation capacity. Her health authority's two outbreak-experienced epidemiologists were both engaged: one managing a respiratory cluster at a different care facility, one on scheduled leave. She needed a Norovirus-experienced outbreak investigator, ideally with long-term care facility investigation experience specifically, available to travel within 24–48 hours.

    She logged into the MarketForge surge specialist platform at 6:15 AM. Her demand signal: Norovirus or gastrointestinal outbreak experience, long-term care setting preferred, field deployment available within 48 hours, BC credentialing or cross-jurisdictional willingness, duration 7–14 days.

    The platform returned four profiles. All had FETP or equivalent credentials. Two were currently deployed on other assignments. One had long-term care experience but no availability declaration for the next month. The fourth was **Priya**.

    ---

    **Priya** had completed her FETP placement at the PHAC national microbiology laboratory and spent three years at Nova Scotia Health investigating gastrointestinal and respiratory outbreaks. Long-term care facility investigations were her primary concentration — she had led or assisted on fourteen of them in five years. Her platform profile included an availability flag she had set two weeks earlier when her current academic project entered a low-intensity phase: "Available for surge deployment, 1–3 weeks, interprovincial."

    Dr. Renata sent an outreach request at 6:23 AM.

    Priya's phone showed the notification at 6:31 AM. She read the demand summary, confirmed availability, and replied through the platform by 6:48 AM.

    The credentialing navigator service resolved the BC practice authorization question by 9:30 AM — Priya's Nova Scotia registration was recognized under the applicable mutual recognition provision with a standard notification filing.

    Priya landed in Kamloops the following afternoon. The field investigation began that evening.

    ---

    The outbreak was contained within nine days. The source — a contaminated food handler on a single dietary shift — was identified on day four of the investigation. Secondary transmission was broken by day seven.

    Without field investigation capacity on site within 72 hours of cluster identification, the health authority's protocol would have escalated to PHAC federal deployment — a process that typically adds four to six days.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The speed problem in surge specialist deployment is not primarily a capacity problem — Canada has enough outbreak-trained epidemiologists to handle most provincial surge events. The problem is a visibility problem. Priya was available, credentialed, experienced, and willing to travel. Dr. Renata's personal network extended to the practitioners she had worked with in BC. Priya was outside that network, on the other side of the country, with an availability flag that existed in a platform profile and nowhere else visible to a health authority coordinator searching at 6 AM.

    [Thin market infrastructure](../../thin-markets.html) converts the availability signal from private (in Priya's own knowledge) to discoverable (visible to any authorized health authority demand initiator in the platform) — without requiring either party to maintain a relationship in advance of the need.

    *Characters are fictional. PHAC's Field Epidemiology Training Program, interprovincial licensing mutual recognition provisions, and long-term care outbreak investigation protocols are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
