market_example:
  summary: "Provincial health authorities responding to outbreak events, disease surges, or novel public health emergencies cannot rapidly identify and deploy the narrow specialist expertise required — epidemiologists, infection control practitioners, lab diagnosticians — from outside their immediate institutional network."
  problem: "Public health emergencies require specialized expertise that is distributed unevenly across provincial health systems. Epidemiologists with specific outbreak investigation experience, infection control practitioners with long-term care facility expertise, laboratory diagnosticians credentialed in specific pathogen categories, and risk communicators with experience in specific cultural communities are spread across academic medical centres, federal agencies, regional health authorities, and private consulting firms. When a provincial health authority faces a surge event, their internal demand signal — what specific expertise they need and for how long — cannot be efficiently transmitted to the practitioners who could fill it. The result is either under-resourced response or expensive deployment of federal PHAC teams when provincial-level matching would have sufficed."
  dominant_forces:
    - "Participant scarcity — the pool of outbreak-experienced epidemiologists and specialized infection control practitioners is genuinely small; Canada trains fewer than 200 field epidemiologists through FETP"
    - "Opacity — provincial health authorities have no searchable visibility into specialists at other health authorities, academic medical centres, or federal agencies who have surge availability"
    - "Urgency — outbreak response timelines are measured in days; discovery mechanisms that require weeks produce specialists after the surge peak has passed"
    - "Offering complexity — each deployment position requires matching on pathogen-specific expertise, outbreak context (long-term care vs. community vs. institutional), regulatory credentialing, and availability for the duration of the surge"
    - "Jurisdictional barriers — interprovincial practitioner deployment involves licensing and liability questions that are poorly codified and slow to resolve without prior relationship"
  deeperpoint_fit: "Semantic matching encodes specialist profiles (pathogen-specific outbreak experience, facility type expertise, credentialing jurisdiction, outbreak investigation methodology, field deployment availability) against health authority demand signals (current outbreak category, facility type affected, required expertise slots, deployment duration, urgency tier). The anticipatory layer monitors provincial outbreak notification systems and pre-positions relevant specialist profiles before formal deployment requests are issued. KnowledgeSlot curates interprovincial licensing mutual recognition provisions, PHAC FETP deployment frameworks, and the credentialing requirements for infection control across healthcare settings."
  economic_upside: "Each week of delayed specialist deployment in an institutional outbreak costs the affected facility and provincial system an estimated $200,000–$500,000 in extended outbreak duration, quarantine compliance costs, and litigation exposure. Better surge matching reduces outbreak duration, reduces federal response burden, and strengthens the provincial-level public health infrastructure that is Canada's first line of defence against novel health threats."

