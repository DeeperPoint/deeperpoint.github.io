market_example:
  summary: "Each Ring of Fire underground mining operation is individually too small in its early production phase to justify a resident full-time Occupational Health Nurse—but the eight to ten operations collectively represent a full-time career for a pool of OH professionals based in Greenstone. No mechanism currently exists to assemble and coordinate that shared capacity."
  problem: "Ontario Regulation 854 (Mines and Mining Plants) requires underground mining operations to maintain occupational health coverage tied to the volume and nature of work being conducted. An early-stage Ring of Fire operation running two development headings with crews of thirty to fifty underground workers on a two-week-in, one-week-out rotation schedule needs OH coverage for approximately twenty days per month—not forty. A qualified Occupational Health Nurse commanding $90,000–$115,000 per year in Northern Ontario, plus housing, travel, and benefits, represents a fixed cost that is difficult to absorb at a single early-stage operation generating no revenue. Multiply that by the ten-plus Ring of Fire operations advancing on various timelines toward production—Wyloo's Eagle's Nest nickel-copper deposit, several chromite projects, and junior exploration programs running advanced drill campaigns—and the aggregate demand is clear: enough full-time equivalent OH work to sustain a hub of six to eight OH professionals, but each individual operation can only use a fraction of one. The operations individually can't afford a full-time OH professional. They can afford a fractional one. The problem: fractional OH employment doesn't exist as a stable career option in Northern Ontario. There is no mechanism by which an OHN can commit to a portfolio of rotational engagements across multiple operations, coordinate scheduling with those operations' supervisors, maintain continuity of health records across sites, and build the site-specific knowledge of hazards and crew health profiles that makes OH work effective. And from the operations' side, there is no mechanism to locate qualified OH professionals willing to work a rotational portfolio, negotiate shared coverage arrangements, or coordinate schedules with other operations to avoid coverage gaps."
  dominant_forces:
    - "Regulatory coverage mandate — Ontario Reg. 854 creates a non-negotiable OH coverage floor for underground operations regardless of operation size or production stage, making this a compliance cost that cannot be deferred"
    - "Fractional demand mismatch — each Ring of Fire operation in early development needs 15–22 OH coverage days per month, not 44; a resident full-time OHN is chronically underutilized and individually unaffordable"
    - "Career stability barrier — qualified OHNs with Northern Ontario experience won't accept casual or project-by-project OH work without career continuity, benefits, and professional development access; a portfolio of fractional engagements is only attractive if the portfolio itself is managed and stable"
    - "Site knowledge requirement — OH professionals need detailed familiarity with site-specific hazards (geological conditions, equipment fleet, crew injury history, chemical inventory); rotating randomly across many unknown sites without continuity degrades OH quality"
    - "Scheduling opacity — each operation's OH demand varies with crew rotation schedules, development phase, and seasonal factors; coordinating multi-site coverage without a shared calendar and booking infrastructure produces dangerous gaps"
  deeperpoint_fit: "A hub-based OH services cooperative in Greenstone employs a pool of OH professionals who are matched to Ring of Fire operations by schedule, site familiarity, regulatory specialty, and language. The matching layer maintains each OH professional's site certification history, crew health record continuity, and rotation schedule, and surfaces coverage gaps to operations in advance. Operations subscribe to the pool, post their upcoming crew rotation schedules, and the system coordinates coverage across all subscribers, ensuring regulatory compliance and professional continuity without each operation individually bearing the cost of a full-time OH hire."
  economic_upside: "A Greenstone-based OH services hub employing eight professionals and serving ten Ring of Fire operations generates $1.2–1.6M in annual revenue—sustainable as a small-to-medium professional services firm—while reducing each operation's OH cost by an estimated 35–50% relative to a resident full-time hire. The hub also creates stable, well-paid professional careers in Greenstone that support housing demand, local spending, and school enrollment—the community economic effects the Ring of Fire needs to generate in an existing hub town rather than exclusively in fly-in camp infrastructure."

