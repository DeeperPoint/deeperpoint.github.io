market_example:
  summary: "Matches accused individuals lacking traditional familial ties with verified community organizations willing to act as bail sureties, reducing unnecessary pre-trial detention. Commercial Note: Dependent on Non-Profit/Justice sponsorship."
  problem: "The Canadian bail system relies heavily on 'sureties'—family or friends who pledge money and promise to supervise an accused person. Marginalized individuals, the homeless, or those far from home frequently cannot find a surety. Consequently, they languish in brutal pre-trial detention (remand) for months, presumed innocent, simply because they lack a social network. Non-profit bail programs exist, but courts and duty counsel lack a fast, reliable mechanism to match an accused with a qualified community supervisor before the bail hearing concludes."
  dominant_forces:
    - "The catastrophic societal and financial cost of mass pre-trial detention."
    - "Strict judicial requirements for bail supervision capability and credibility."
    - "A massive disconnect between well-meaning community organizations and the chaotic realities of urgent bail court."
  deeperpoint_fit: "CoSolvent aggregates the capacity and specific supervision capabilities of regional non-profits (e.g., John Howard Society, addictions programs). When an accused needs a surety, it matches their specific release conditions with a community partner. KnowledgeSlot securely verifies the organization's legal standing to the judge."
  economic_upside: "Solves a major constitutional crisis. Remand costs the state hundreds of dollars a day per person. A platform that reduces remand by 5% saves the justice system tens of millions annually."

