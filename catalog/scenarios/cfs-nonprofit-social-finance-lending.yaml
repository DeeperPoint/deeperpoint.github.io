story:
  title: The Patient Capital Problem
  status: draft
  blog_slug: ""
  characters:
    - "Grace - Executive Director, Indigenous women's housing organization, northern Ontario"
    - "Thomas - Investment Manager, community development finance institution, Ottawa"
  summary: "A northern Ontario Indigenous women's housing organization seeking $1.8M in
    subordinate debt to acquire a property finds an impact lender with an Indigenous
    housing sector mandate through a social finance matching platform—avoiding a three-year
    grant fundraising cycle."
  body: |
    ## Act A - The Market Structure

    Canada's social finance system was designed on the premise that non-profit organizations
    should be able to access patient capital for their missions without depending entirely
    on charitable donations and government grants. The financial instruments are real:
    community bonds, subordinate impact loans, blended finance facilities with foundation
    guarantee wraps. The CDFIs and impact lenders who offer them are real and funded.

    The problem is that impact lending origination is embedded in the social sector peer
    network—a fabric of relationships among United Way chapters, Imagine Canada members,
    provincial community sector associations, and foundation grantmaking circles. Organizations
    outside this fabric—newer immigrant-serving agencies, rural organizations, Indigenous
    community enterprises not integrated in the mainstream social sector network—are
    essentially invisible to impact lenders who would fund them, because the intermediary
    that would make the referral does not exist in their region or community context.

    The non-profit that discovers impact lending by accident, after years of grant-only
    fundraising, feels like they found a door that was there the whole time. The structural
    failure is that nobody told them the door existed or which key opened it.

    ---

    ## Act B - The Story

    **Grace** runs an organization providing transitional housing and employment support
    for Indigenous women leaving domestic violence situations in northern Ontario. Her
    organization leases its current facility; the landlord is selling and the acquisition
    price is $2.2M. She has $400,000 in reserve. She needs $1.8M. Her bank offered
    $700,000 secured against the organization's operating receivables—insufficient. She
    has been told by her accountant that she might qualify for a community bond, but her
    accountant doesn't know who issues them in Ontario for Indigenous housing organizations.
    Her funder contacts at two provincial foundations have not responded.

    **Thomas** manages a $15M impact lending portfolio at a CDFI whose mandate includes
    Indigenous community organizations in northern Ontario. He has a specific program for
    property acquisition by Indigenous housing providers: subordinate loans at below-market
    rates, up to $2M, with flexible repayment tied to occupancy revenue. He has deployed
    $4M of this program. He originates through provincial Indigenous community network
    referrals, but his reach does not extend to all regions. He has never received an
    inquiry from Grace's organization. His program has $3M of undeployed capital.

    Grace uploads her organization profile to the platform: organization type (Indigenous
    non-profit, housing), capital purpose (property acquisition), amount ($1.8M), sector
    (transitional housing), geographic market (northern Ontario). Thomas's program surfaces
    with mandate match—Indigenous community organization, property acquisition, Ontario,
    subordinate loan, $2M maximum. Thomas contacts Grace within a week. She submits the
    property documentation. The loan is approved in six weeks. The property acquisition
    closes. Three years of grant fundraising become unnecessary.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The non-profit capital gap is not a shortage of social finance capital—the CDFIs and
    impact lenders are funded. It is a shortage of matching infrastructure that extends
    impact lender reach beyond the peer social sector networks that exclude the organizations
    with the most urgent capital needs. DeeperPoint builds the social finance matching
    platform that connects impact capital with the organizations it was designed to reach.

    *Characters are fictional. Canada's social finance market deployment gap and the federal
    Social Finance Fund are real. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
