market_example:
  summary: A structured matching platform connecting Canadian non-profit organizations and
    social enterprises seeking patient structured debt—community bonds, social impact bonds,
    subordinate loans, and blended finance instruments—with the growing pool of impact lenders,
    CDFIs, and foundations whose capital is specifically designed for the non-profit credit
    profile but who struggle to reach borrowers outside their existing community networks.
  problem: "Canada's non-profit sector manages $350B in assets and employs over 2 million
    people, yet it is systematically underserved by commercial debt markets. The gap is
    structural: banks underwrite based on cash flow predictability, collateral, and debt
    service coverage ratios calibrated to for-profit borrowers. Non-profit cash flows—
    dependent on government contracts, charitable donations, and program fees that do not
    carry commercial enforceability—do not score well on bank lending criteria. Non-profits
    that need capital to acquire property for expanded service delivery, build out a social
    enterprise revenue stream, or bridge a government contract cash flow cycle cannot access
    commercial debt efficiently. But the financial product that would serve them—patient
    subordinate debt, community bonds with community investor marketing support, social
    impact bonds with payment contingent on measured outcomes, blended finance with
    foundation guarantee wraps—exists and is offered by a growing Canadian ecosystem of
    impact lenders: SVX Canada, Community Forward Fund, Island Community Futures, Vancity
    Community Investment Bank, and foundations with program-related investment mandates.
    The matching failure: impact lenders originate almost entirely through their existing
    networks of social sector peers and intermediary organizations like Imagine Canada,
    United Way, and provincial community sector associations. Non-profits outside these
    networks—smaller Indigenous organizations, immigrant-serving agencies not integrated
    in the mainstream social sector reference network, social enterprises in rural areas—
    are structurally invisible to impact lenders whose mandate they would satisfy."
  dominant_forces:
    - "Commercial bank lending criteria systematically fail non-profit credit profiles:
      cash flow predictability requirements, collateral standards, and debt service coverage
      ratios were calibrated to for-profit borrowers whose revenue dynamics are structurally
      different from non-profits funded through grants, contracts, and donations."
    - "Impact lenders with mandates specifically designed for non-profit and social enterprise
      borrowers originate almost entirely through social sector peer networks—systematically
      excluding smaller, newer, or rural organizations not integrated in the major social
      sector reference networks."
    - "Non-profit boards and executive directors often lack financial literacy around the
      alternative debt instruments that would serve their capital needs—community bonds,
      blended finance, program-related investments—because these products have not been part
      of the mainstream grant-focused non-profit funding narrative."
  deeperpoint_fit: "CommonContext encodes the social finance instrument framework: community
    bond structure and securities exemption requirements, social impact bond outcome payment
    models, program-related investment criteria for foundations, and blended finance guarantee
    wrap structures. CoSolvent matches non-profit borrower profiles—organization type, capital
    purpose (property, working capital, social enterprise), revenue model, sector, and
    geographic market—against impact lender profiles organized by eligible borrower type,
    instrument offered, minimum loan size, and current deployment capacity."
  economic_upside: "Canada's social finance market has been estimated at $10–30B in unmet
    non-profit capital demand. The federal Social Finance Fund committed $755M to impact
    lenders; provincial programs add hundreds of millions more. A platform closing 5% of
    the matching gap represents $500M–$1.5B in deployed non-profit capital annually.
    Government investment in the platform is directly aligned with federal and provincial
    social finance fund mandates."
