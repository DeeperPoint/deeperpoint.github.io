    recurring: false

story:
  title: "The Green Beans That Almost Weren't"
  status: draft
  blog_slug: ""
  characters:
    - "Fatima Haile - smallholder farmer, Awash Valley, Ethiopia"
    - "Diego Morales - organic export buyer, Hamburg, Germany"
    - "Tekeste Berhe - cooperative coordinator, regional agricultural bureau"
  summary: "A German organic importer searching for verified Ethiopian green bean supply discovers a cooperative cluster he could never have reached without the platform — and Fatima learns, for the first time, what her beans are worth on the export market."
  body: |
    ## Act A - The Market Structure

    Ethiopia grows fine haricot beans and French beans in irrigated valley plots that
    meet GlobalG.A.P. quality standards. Germany's organic food retail market pays
    a premium for verified East African provenance. Between these two facts sits an
    unbridgeable gap: export buyers in Hamburg cannot source reliably from smallholder
    clusters they cannot see, and farmers in the Awash Valley have no mechanism to
    signal that their harvest is export-grade and available this week.

    The coyote network handles local aggregation. But coyotes have no relationship
    with export terminals. The export buyers who do operate in Ethiopia source exclusively
    from large commercial farms — not because those farms grow better beans, but because
    their supply is legible. Volume is predictable. Documentation exists.

    The smallholder clusters are invisible. Not because they are unworthy — because no
    one built the infrastructure to see them.

    ---

    ## Act B - The Story

    **Tekeste Berhe** has been trying for two years to get the cooperative cluster in
    Metahara registered for export. Sixty-two member households. Eight to twelve tonnes
    of haricots per season. He knows the quality is there — he has seen the test samples.
    But the exporter he approached last year said: "Come back when you have GlobalG.A.P."
    GlobalG.A.P. group certification requires documentation Tekeste does not know how to
    produce, and a consultant he cannot afford.

    **Fatima Haile** is one of the sixty-two. She farms 0.4 hectares under drip irrigation
    near the highway that runs east toward Djibouti. Her beans are firm, clean, and picked
    at the right stage. She sells at the regional market for 8 birr per kilogram.

    In Hamburg, **Diego Morales** runs import procurement for a certified organic distributor.
    He needs 15 tonnes of haricots per season from traceable, smallholder sources — his retail
    clients want the provenance story. He has been sourcing from a Kenyan cooperative, but
    volumes are declining and he needs an alternative. He has heard there is good production in
    Ethiopia, but his Ethiopian contact says: "The farms are there. Nobody has organized them."

    The platform changes what is possible.

    Tekeste uploads the cooperative's profile through the sponsor NGO's interface: sixty-two
    members, 8–12 tonnes haricot fine beans per season, Metahara, irrigated, manual harvest.
    He photographs three sample lots with his phone. The platform's vision model confirms
    visual grading characteristics consistent with Class I export standards.

    Diego's buyer profile has been live for three months: Ethiopia region preferred,
    smallholder provenance required, 12–18 tonnes per season, GlobalG.A.P. or equivalent
    in progress accepted, FOB Djibouti delivery.

    The match runs silently. The platform flags a high-confidence correspondence — volume,
    quality indicators, season alignment — and generates a Generative Match Story:

    *"Metahara Cooperative, Awash Valley — 62 smallholder households, irrigated haricot fine
    bean production, 10–12 tonnes available harvest window April–June. Visual quality assessments
    consistent with Class I export grade. Cooperative coordinator is pursuing GlobalG.A.P. group
    certification. Logistics pathway: farm cluster → Modjo cold hub → Djibouti container port.
    Estimated FOB price range: $1.40–$1.65/kg. Certification gap: GlobalG.A.P. group process
    initiated; estimated completion 8–12 weeks with facilitation."*

    Diego reads it over his morning coffee. He has never seen a smallholder-level supply
    profile this specific. He requests contact.

    Over four weeks, Diego and Tekeste negotiate through the platform's deal channel.
    The CommonContext surfaces GroupG.A.P. documentation templates in Amharic. A certification
    facilitator registered on the platform visits the cooperative twice. Diego agrees to
    pre-commit purchase at a price that covers the certification cost amortized over two seasons.

    Fatima's beans ship for the first time in a refrigerated container. Her cooperative
    receives 32 birr per kilogram — four times the local market rate.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Diego is not unwilling to buy from Ethiopian smallholders. He has been trying for two years.
    The barrier is not price, not quality, not geography — it is legibility. He could not see
    Tekeste's cooperative. Tekeste could not produce the documentation that would make the
    cooperative visible to Diego.

    The coyote system is not the enemy. It is the symptom of a market where the infrastructure
    to connect producer to destination has never been built. Coyotes exist because they are the
    only entity willing to absorb the search cost of finding dispersed supply — and they are
    compensated for that search precisely by capturing the price spread.

    A platform does not eliminate the search. It industrializes it. It makes the invisible legible,
    the informal documentable, and the distant present.

    For Fatima, the transformation is not merely economic. She has a transaction record now.
    A microfinance institution in Adama has seen the platform's credit summary of her cooperative.
    Next season, the cooperative will apply for input credit — improved seed, drip irrigation
    extension — against the verified income history that a single export season created.

    *Characters are fictional. Ethiopian haricot bean export dynamics, GlobalG.A.P. group
    certification, the Modjo cold hub, and the Ethio-Djibouti cool corridor are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
