market_example:
  summary: "Thousands of smallholder farmers in the Ethiopian Rift Valley and Mexican highlands grow export-quality produce that never reaches foreign buyers — not because of quality, but because the match between what they grow and what buyers want is never made. A matching platform can bridge farm-gate to export terminal."
  problem: "Smallholder farmers in countries like Ethiopia and Mexico produce tomatoes, avocados, green beans, and chiles that meet international quality standards during peak season. But they have no mechanism to signal their production to export buyers — who in turn cannot reliably source consistent volumes from dispersed smallholders. Coyotes and brokers intermediate aggressively, capturing the export premium while leaving farmers at local-market prices. Post-harvest losses of 20–40% further erode what little margin reaches the farm. Export buyers who want smallholder provenance stories — for ethical sourcing certifications, premium retail channels — cannot verify production conditions or aggregate reliable supply."
  dominant_forces:
    - "Information asymmetry — Farmers lack real-time export price visibility; buyers cannot see farm-level supply without intermediaries"
    - "Geographic dispersion — Production scattered across hundreds of villages, too fragmented for individual export lots"
    - "Trust deficit — Export buyers require quality certification, provenance documentation, and consistent volume guarantees that informal chains cannot provide"
    - "Post-harvest loss — 20–40% spoilage between farm and port destroys the economics of export aggregation"
    - "Discovery failure — No mechanism for export buyer to identify which smallholder clusters produce export-grade quality in which season"
  deeperpoint_fit: "CoSolvent builds dual profiles: farmer clusters (volume, quality grade, harvest calendar, geographic coordinates) and export buyers (volume requirements, certification standards, price bands, preferred provenance types). CommonContext is populated with export grading standards (GlobalG.A.P., EU phytosanitary requirements, USDA grade specifications), cold chain protocols, and post-harvest handling guides — delivered via voice interface in Amharic or Spanish. The Generative Match Story walks each match through a structured narrative: what the buyer needs, what the cluster produces, what logistics sequence gets the produce there, and what certification steps are required."
  economic_upside: "Ethiopia's horticultural export market targets $1B USD annually; Mexico's vegetable export sector exceeds $6B. Even a 10% rerouting of smallholder production through verified aggregation channels would represent $100M+ in additional farmer-captured value. Platform revenue: transaction fee on matched export volume, CommonContext SaaS subscription to exporters, certification facilitation fees."

