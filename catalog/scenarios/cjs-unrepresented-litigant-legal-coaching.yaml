market_example:
  summary: "Matches self-represented litigants (who clog family courts) with fractional 'legal coaches'—junior lawyers who don't take the whole case, but review affidavits for structural soundness before filing."
  problem: "Over 60% of people in Canadian family courts are entirely self-represented because they cannot afford a $10,000 lawyer retainer. They file handwritten, legally incoherent affidavits, forcing judges to spend hours deciphering them, collapsing the entire court schedule. These litigants are willing to pay $300 for help, but traditional law firms refuse to 'unbundle' services, fearing liability if they touch a case they don't fully control."
  dominant_forces:
    - "Catastrophic collapse of family court timelines due to systemic self-representation."
    - "The 'all-or-nothing' retainer model of traditional legal practice."
    - "Law Society rules that make 'unbundled' legal services legally precarious without strict scoping."
  deeperpoint_fit: "CoSolvent aggregates self-represented litigants. It matches them with junior lawyers or paralegals willing to do fractional, asynchronous document review. KnowledgeSlot generates an ironclad Limited Scope Retainer, legally protecting the coach from being dragged into the full trial."
  economic_upside: "Unlocks the massive, entirely unserved latent market of middle-class litigants who can afford to pay for fractional help but not full representation. Revenue derived from platform transaction fees."

