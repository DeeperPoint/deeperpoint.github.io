market_example:
  summary: "Municipalities invest heavily in attracting international students but lose the majority at graduation because students cannot find employers experienced with post-graduation work permit processes, and employers with PGWP/LMIA experience cannot efficiently discover graduating students whose skills match their needs."
  problem: "Canadian universities and colleges in major cities — Toronto, Vancouver, Montreal, Ottawa, Waterloo — graduate tens of thousands of international students annually. These graduates have Canadian credentials, Canadian work experience from co-op and part-time employment, English or French fluency, and professional networks that took years to build. Municipal economic development strategies explicitly identify international student retention as a workforce priority. Yet the majority leave — not because they want to, but because they cannot find employers willing to navigate the post-graduation work permit (PGWP) process, sponsor a future Labour Market Impact Assessment (LMIA), or simply hire someone whose work authorization has an expiry date. The employers who have done it before — who know that a PGWP is an open work permit requiring no employer paperwork, that the LMIA process for a skilled worker takes 8–12 weeks and costs $1,000, that Express Entry candidates with Canadian work experience score dramatically higher — are invisible to the students who need them. Career services offices at universities maintain employer databases organized by industry, not by immigration process experience. Job boards do not filter for 'employer has successfully hired PGWP holders before.' The result is a matching failure that exports talent the municipality invested in attracting."
  dominant_forces:
    - "Opacity — employers with PGWP and LMIA experience are not identifiable through any existing directory or job board; their immigration process competence is not encoded anywhere"
    - "Fear of regulatory complexity — employers who have never hired an international graduate overestimate the complexity of the PGWP (which requires no employer action) and conflate it with the LMIA (which does)"
    - "Temporal pressure — PGWP holders have a fixed work authorization window (typically 1–3 years); every month spent searching is a month lost from the pathway to permanent residence"
    - "Information asymmetry — international graduates know their skills and Canadian experience; employers know their hiring needs and immigration comfort level; career services offices cannot systematically bridge the gap"
    - "Trust deficit — employers worry about work authorization expiry, training investment loss if the employee must leave Canada, and paperwork liability; graduates worry about employers who will exploit their precarious status"
  deeperpoint_fit: "Semantic matching connects graduating international students to employers based on skills alignment, immigration process experience (has the employer hired PGWP holders before? filed LMIAs?), geographic proximity, industry fit, and start-date compatibility with graduation timelines. The verification pipeline validates employer hiring history with international graduates, LMIA filing track record, workplace safety record, and position legitimacy. CommonContext curates PGWP eligibility rules, LMIA process guides by NOC code, Express Entry CRS score optimization strategies, provincial nominee program requirements, and available employer incentives for hiring international graduates. The Generative Match Story helps employers understand exactly what paperwork (if any) is required for a specific candidate's work authorization status — demystifying the process at the point of decision."
  economic_upside: "Canada hosts approximately 800,000 international students, generating over $22 billion annually in economic activity. Toronto alone hosts 100,000+ international students. Each retained graduate who transitions to permanent residence and skilled employment generates an estimated $50,000–$80,000 in annual tax revenue and local economic activity — compared to an export loss of the entire public investment in their education if they leave. A matching platform that improves retention rates by even 5% in Toronto — retaining 5,000 additional graduates per year — represents $250M–$400M in annual economic value retained in the city. Municipal economic development offices, university career services, and immigrant settlement organizations all have mandates and budgets that align with this outcome."

