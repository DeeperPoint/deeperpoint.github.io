market_example:
  summary: "Credit unions, pension plan committees, non-profit boards, and emerging company audit committees need independent directors with specific governance credential combinations — financial literacy certification, actuarial background, sector-specific regulatory experience — that the informal board recruitment market consistently fails to surface in time for governance compliance deadlines."
  problem: "Boards of directors and trustee committees in regulated entities — pension plan administrator boards, credit union supervisory committees, hospital foundation audit committees, cooperative governance boards — have specific independent director requirements set by regulators, funders, or by-laws. A credit union's supervisory committee may require a member with audit committee financial expert (ACFE) certification. A pension plan board may require an independent trustee with actuarial credentials and no conflicts of interest with plan sponsors. A non-profit seeking accreditation may need an independent director with sector-specific governance credentials by a specific date. These requirements are narrow, compliance-driven, and externally imposed — but the mechanism for finding the right person is a combination of outgoing board member referrals, association directories, and governance committee chair's personal network. The candidate who has the right credentials, available time, and no conflict-of-interest exposure is rarely the person the network surfaces first."
  dominant_forces:
    - "Credential specificity — regulatory governance requirements specify combinations of credentials (financial literacy, actuarial, legal, sector-specific oversight) that most governance candidates can only partially satisfy"
    - "Conflict-of-interest constraint — independent director requirements mean candidates with employer relationships, supplier relationships, or prior board service involving related entities are disqualified; the pool shrinks further after conflict screening"
    - "Time availability — qualified governance candidates hold multiple board positions across their professional network; availability for another commitment is not legible from credentials alone"
    - "Opacity — governance candidate qualifications and conflict-of-interest profiles are not indexed in any mechanism accessible to a board nominating committee without personal access to the candidate"
    - "Regulatory deadline — governance compliance requirements have specific dates (annual meeting, regulator examination, accreditation renewal) that cannot be negotiated"
  deeperpoint_fit: "Semantic matching encodes director profiles (governance credential by type, sector governance experience, prior board roles and conflict-of-interest landscape, time availability, geographic preference, honorarium expectation) against board demand signals (governance credential required, entity type, sector, regulatory jurisdiction, conflict-of-interest universe, meeting frequency, term length, honorarium range). Pre-screening for conflict of interest before identity disclosure protects both candidate and organization."
  economic_upside: "Canada has approximately 160,000 active non-profit organizations, 240 credit unions, and thousands of pension plan administrator boards — all with ongoing independent director requirements. Average board term is three years; typical board refresh of 30% of seats per year generates a structural recurring demand for qualified independent directors. The governance consulting and search market in Canada is estimated at $200M–$400M annually — predominantly concentrated in large executive search firms that are not cost-effective for small regulated entities whose governance requirements are equally strict."

