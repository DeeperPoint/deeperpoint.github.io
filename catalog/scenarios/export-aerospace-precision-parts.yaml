market_example:
  summary: A secure platform for matching the surplus capability of Canadian precision
    aerospace machine shops with tier-one suppliers and OEMs in the global supply
    chain.
  problem: Connecting Canadian Precision Machining with Global Aerospace OEMs
  dominant_forces:
  - Aerospace supply chains are recovering and experiencing severe bottlenecks.
  - Canada has a deep bench of highly certified (e.g., AS9100) aerospace machine shops.
  - OEMs need rapid discovery of highly capable, certified capacity to avoid downstream
    delays.
  deeperpoint_fit: Exacting certification and quality control requirements mandate
    extreme trust. Dynamic matching of machine capabilities (e.g., 5-axis CNC) and
    material handling. ITAR and controlled goods compliance are critical constraints.
  economic_upside: Maximizes machine utilization across the Canadian aerospace cluster.
    Provides global OEMs with a resilient, high-quality, allied-nation supply alternative.
