market_example:
  summary: "Manufacturers in low- and middle-income countries seeking to produce newly off-patent medicines need access to formulation dossiers and manufacturing know-how from originator or first-generic manufacturers who have solved the technical development challenges — but the mechanism connecting dossier holders to LMI-country producers is informal, expensive, and dependent on established global health procurement networks that most manufacturers outside India cannot access."
  problem: "The global access-to-medicines gap is fundamentally a technology transfer market failure. When a pharmaceutical patent expires, the pathway to affordable generic production requires more than the chemical formula — it requires the formulation development work that took the originator manufacturer eighteen months and $2M to optimize: excipient selection for stability in tropical climate conditions, dissolution method development that satisfies stringent pharmacopoeia standards, analytical method validation suitable for WHO PQ submission. This knowledge is held by the originator, by early generic entrants who have completed WHO PQ, or by contract development organizations that have developed the formulation on behalf of multiple clients. The LMI-country manufacturer with the facility capacity, the regulatory capability, and the market access intention cannot efficiently find the dossier holder who is willing to share or license formulation knowledge on terms compatible with the manufacturer's economics. The dossier holder — who may be willing to license technology in exchange for a royalty or a capacity partnership — has no efficient mechanism to reach the LMI-country manufacturer whose market intentions are compatible with their own."
  dominant_forces:
    - "Participant scarcity — WHO PQ holders for a specific off-patent essential medicine are a small population; among those, the subset willing to engage in technology transfer with LMI-country manufacturers on commercially viable terms is smaller"
    - "Commercial complexity — technology transfer transactions require agreement on royalty structure, minimum production volumes, geographic exclusivity terms, and know-how transfer schedule; these negotiations are long and legally complex without a framework"
    - "Trust and quality assurance — the originator or first-generic manufacturer transferring know-how must be confident that the recipient manufacturer's quality systems will maintain the product quality that their WHO PQ dossier represents"
    - "Access agenda alignment — dossier holders with access-to-medicines mission alignment (MPP licensees, USAID/PEPFAR manufacturers, MSF pharmacy suppliers) have different licensing terms than commercially motivated originators; matching on commercial intent is as important as matching on technical capability"
    - "Geographic exclusion — the LMIC manufacturer seeking technology transfer is typically outside the conference circuits, global health procurement networks, and CRO relationship infrastructure where originator and first-generic manufacturers are visible"
  deeperpoint_fit: "Semantic matching encodes dossier holder profiles (medicine list by INN and dosage form, WHO PQ status and jurisdiction coverage, geographic territory available for technology transfer, licensing model — royalty, paid-up, access-program — minimum production volume requirement, manufacturing know-how transfer scope) against LMI-country manufacturer demand signals (medicine sought by INN and dosage form, production capacity by dosage form, WHO PQ status current or target, geographic market intention, licensing model acceptable, financing available, regulatory jurisdiction target). CoSolvent's trusted intermediary model enables commercial intent alignment before NDA/MTA negotiation begins."
  economic_upside: "The access-to-medicines financing gap for off-patent essential medicines is estimated at $5B–$8B annually — the cost difference between current LMI-country purchase prices and the prices achievable with competitive local generic manufacturing. A technology transfer platform that accelerates ten generic product entries per year in LMI markets — reducing unit costs by 40–70% through local competition — generates access-to-medicines economic value worth hundreds of millions of dollars annually in avoided healthcare expenditure. The Medicine Patent Pool (MPP), USAID's GHSUPPLY, and Global Fund procurement agreements represent $2B+ in annual medicine procurement channels that LMI-country generic manufacturers can access with successful WHO PQ technology transfer."

