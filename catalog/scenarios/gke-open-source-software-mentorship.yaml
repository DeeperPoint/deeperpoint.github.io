market_example:
  summary: "African software engineering teams building digital public infrastructure — health information systems, agricultural data platforms, land registry software, open financial systems — cannot efficiently find senior software architects and systems engineers in developed countries willing to provide structured technical mentorship on specific architectural challenges."
  problem: "Africa's software engineering community is one of the world's fastest-growing and most innovative. Teams building real systems for real users — DHIS2 implementations, mobile money integrations, off-grid IoT platforms, open source e-government systems — are navigating architectural challenges of genuine technical sophistication: distributed systems consistency under intermittent connectivity, data governance frameworks for population health databases, API design for interoperability across health system silos, cryptographic approaches for privacy-preserving land registry systems. These questions have right answers — answers that experienced systems architects in developed countries have arrived at through years of building similar systems. The gap is not the African engineer's ability to reason about the problem; it is access to the institutional knowledge that comes from having built at scale — the patterns, anti-patterns, and decision frameworks that reduce the probability of expensive architectural mistakes."
  dominant_forces:
    - "Opacity — African software teams with specific architectural questions cannot efficiently find the senior engineers in developed countries whose experience is directly relevant to their specific system context"
    - "Context specificity — generic software mentorship is not useful; the mentor needs to understand the specific problem domain (offline-first health data, mobile money APIs, land registry cryptography) to provide advice that is actionable"
    - "Time zone and async collaboration — effective technical mentorship across time zones requires structured asynchronous exchange protocols, not just calendar availability"
    - "Mentor credibility signaling — a junior engineer seeking architectural guidance needs a way to evaluate the mentor's relevant experience before investing in the relationship; informal platforms do not provide this"
    - "Institutional knowledge — the most valuable mentorship is not tutorial-level instruction but the transfer of hard-won architectural knowledge: what went wrong, what the second-order effects of specific design choices were, what the experienced engineer would do differently"
  deeperpoint_fit: "Semantic matching encodes mentor profiles (systems architecture domain, specific technology stack experience, problem domain experience, mentorship format preference — async review, periodic video session, code review) against mentee team profiles (system type being built, specific architectural challenge, tech stack, team experience level, desired engagement format and pace). The structured engagement protocol guides the knowledge exchange through documented architectural decision records and written question-answer exchanges that create lasting knowledge artifacts beyond the session."
  economic_upside: "A major architectural mistake discovered at scale — a data model that cannot be migrated, a distributed consistency approach that breaks under the actual connectivity pattern, an API design that blocks interoperability with every system it needs to connect to — can cost months of rework and significantly delay the social impact of systems that serve large populations. Better architectural mentorship access reduces the probability of expensive architectural mistakes and concentrates the engineering productivity of African teams on problems where they are strongest: understanding the user context, building for the specific infrastructure environment, and designing for the communities they serve."

