market_example:
  summary: "Addresses the replication crisis by matching discipline-specific PIs (who often write unstable simulation code) with fractional Research Software Engineers (RSEs) to refactor models prior to journal submission."
  problem: "Modern science is overwhelmingly computational, but most biologists, physicists, and chemists are completely self-taught, untrained programmers. This leads to the 'replication crisis': highly impactful scientific papers rely on spaghetti code that crashes on other machines or contains hidden statistical logic errors. PIs cannot afford a full-time senior software engineer on an NSERC grant, but desperately need expert code review."
  dominant_forces:
    - "Major journals and federal grants increasingly mandate public, reproducible code repositories."
    - "A massive gap between academic domain expertise and commercial software engineering best practices."
    - "Academic career incentives completely ignore code quality."
  deeperpoint_fit: "CoSolvent aggregates small, bursty code-refactoring jobs from hundreds of PIs and matches them with a distributed guild of fractional Research Software Engineers (RSEs). ClientSynth profiles the technical stack (e.g., Python vs. Fortran vs. R) to optimize the match."
  economic_upside: "Saves thousands of hours of wasted peer-review time and prevents high-profile retractions. Platform revenue model acts as a highly specialized technical talent agency."

