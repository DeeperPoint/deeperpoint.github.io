tags: [trade, export, mining, automation, battery-electric, hard-rock, underground]
market_example:
  summary: A platform matching Canadian developers of battery-electric mining vehicles, autonomous
    drilling software, and ventilation-on-demand systems with global underground mining operators
    seeking to transition to zero-emission, automated operations in deep hard-rock mines.
  problem: "The global underground hard-rock mining industry is undergoing a forced technological
    revolution. As mines go deeper—many now exceeding 2km depth—diesel ventilation costs become
    prohibitive, heat becomes a safety emergency, and human operators face unacceptable rock-mechanics
    risk. The shift to battery-electric vehicles (BEVs), autonomous drilling and mucking systems,
    and ventilation-on-demand (VOD) platforms is not optional: it is a survival imperative for
    deep hard-rock operations. Canada—specifically the Sudbury and Val-d'Or mining clusters—has
    built the world's leading concentration of underground mining technology companies, driven by
    decades of operating the world's deepest hard-rock mines. Firms like MacLean Engineering,
    Epiroc Canada, and dozens of deep-tech startups have built BEV tramming systems, precision
    blast control platforms, and digital ventilation infrastructure tested in Canadian mines that
    are deeper and harder than almost anything else on earth. The market failure is commercial
    access: a copper mine operator in Chile or a gold producer in Western Australia knows they
    need this technology but has no structured mechanism to evaluate and qualify the specific
    Canadian systems that address their precise geological and operational conditions. Consortium
    purchases—where a BEV manufacturer, a charging infrastructure provider, and a fleet management
    software company must be matched and bundled as an integrated solution—add another layer of
    complexity that no individual broker or trade mission can coordinate."
  dominant_forces:
    - Hard-rock mines worldwide are approaching depths where diesel ventilation costs and heat
      management make continued diesel operations economically non-viable, forcing BEV and
      automation adoption regardless of capital cost.
    - The Sudbury and Val-d'Or clusters have produced the world's most battle-tested underground
      BEV and automation capability but lack the commercial infrastructure to export it systematically.
    - Major mining conglomerates require rigorous operational validation—typically including
      underground trials at similar geological conditions—before committing to capital-intensive
      technology deployment, creating a validation bottleneck that individual companies cannot
      clear alone.
    - Consortium purchasing (BEV + charging + fleet management software) is the actual procurement
      unit for most major mines, but no existing marketplace can match and bundle multi-company
      Canadian solution stacks.
  deeperpoint_fit: "CommonContext models the highly specific technical matching: a buyer's
    geological profile (rock type, mine geometry, depth, temperature, ground-support regime)
    and operational parameters (fleet size, development cycle, productivity targets) are mapped
    against verified Canadian technology portfolios and reference-deployment records.
    CoSolvent handles consortium matching—automatically identifying complementary Canadian
    companies that together constitute a complete integrated solution and can submit a united
    proposal. The platform structures the underground trial coordination workflow, connecting
    Canadian technology providers with host mines willing to conduct evaluation deployments."
  economic_upside: "A single deep mine BEV fleet conversion and automation package for a
    mid-tier operation is a $15–100M procurement. Canada has dozens of world-class companies
    in this space currently capturing a fraction of their addressable market due to
    commercial-discovery failure. The platform also creates durable data assets:
    the performance record of each technology in each geological context becomes a
    premium product for mining engineering consultants and investors."
