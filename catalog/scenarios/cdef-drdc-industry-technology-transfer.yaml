market_example:
  summary: "A DRDC Suffield researcher has developed a real-time atmospheric dispersion model for CBRN events that runs on commercial hardware. It has $40M in military R&D behind it. A Calgary environmental monitoring startup has the commercialization infrastructure and a civilian market in industrial incident response. DRDC has no mechanism to find that startup, and the startup doesn't know the model exists."
  problem: "Defence Research and Development Canada (DRDC) — Canada's national defence science and technology organization — operates six research centres across Canada with an annual budget exceeding $500M. The research produces technologies in areas including autonomous systems, directed energy, survivability, CBRN defence, communications, and human performance that have substantial dual-use commercial potential. The path from DRDC laboratory to commercial application is systematically underdeveloped. DRDC has mechanisms for industry engagement — the IDEaS program, the Build in Canada Innovation Program, the Canadian Safety and Security Program — but these are primarily mechanisms for industry to bring problems to DRDC, not mechanisms for DRDC innovations to find commercial partners. A DRDC Halifax researcher who has developed a novel underwater acoustic classification algorithm that would be valuable to offshore seismic survey companies has no operational pathway to connect with those companies. A DRDC Valcartier team that has developed composite armour materials with weight and cost profiles competitive with commercial ballistic protection applications has two industry relationships established through personal academic contacts, not through a structured commercialization matching process. The dual-use technology transfer gap between Canadian defence research and Canadian industry is structural: DRDC's mandate is defence science, not commercialization; NRC's mandate is commercialization, not defence; the gap between them is where promising dual-use technologies sit unexploited."
  dominant_forces:
    - "Classification barrier — many DRDC technologies carry classification levels that restrict disclosure to industry even at the capability description level; commercialization potential cannot be assessed by industry partners who cannot access the technical description"
    - "Mandate boundary — DRDC's institutional mandate does not include commercialization or industry development; researchers whose work has commercial potential have no internal career incentive or operational support to pursue industry engagement"
    - "Vocabulary mismatch — DRDC research is described in defence science and military requirements language; potential commercial adopters from civilian industries cannot identify the match without translation to commercial application vocabulary"
    - "IP ownership complexity — technologies developed under DND funding may have joint Crown-researcher IP ownership, ITAR-controlled elements from allied research collaboration, or contractor-developed components that create complex licensing arrangements commercial partners cannot easily navigate"
    - "Industry discovery failure — Canadian SMEs and startups that would be natural commercialization partners for DRDC dual-use technologies have no awareness of what DRDC has developed that is declassified and available for licensing; DRDC's published research library is not a commercial technology catalogue"
  deeperpoint_fit: "MarketForge lists DRDC and affiliated defence research technologies available for commercialization licensing — described in dual-use commercial vocabulary by a translation layer that maps military capability terms to civilian application domains. Canadian companies post technology needs or commercialization interest by domain. The matching engine identifies research-to-industry fit based on application domain, technology readiness level (TRL), IP licensing structure, and industry sector. Knowledge Slot provides DRDC technology transfer policy, Crown IP licensing frameworks, ITAR-inherited restrictions on specific technologies, and IDEaS/BCIP grant programs available to industry commercialization partners."
  economic_upside: "DRDC's cumulative defence R&D investment represents billions in taxpayer-funded innovation, a portion of which has commercial application that is currently unrealized due to structural discovery failure. Even 10 successful dual-use technology transfers per year at an average commercial licensing value of $2M produces $20M in Canadian industrial (and tax) value — transforming sunk defence R&D cost into civilian economic return. A platform that facilitates these matches at a 3% facilitation fee on licensing agreement value generates $600,000 per year at this modest scale. NRC's National Research Council Industrial Research Assistance Program (IRAP) and DND's S&T Program are natural co-funding sources for a platform that directly advances Canada's defence innovation mandate."

