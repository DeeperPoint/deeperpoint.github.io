market_example:
  summary: A structured matching platform connecting royalty and streaming companies seeking
    early-stage pipeline exposure with junior mining companies at the pre-resource or pre-feasibility
    stage—bypassing the broker-exclusive deal flow that concentrates royalty capital into the
    same repeat relationships while leaving hundreds of well-structured projects without a royalty path.
  problem: "The royalty and streaming model has become the dominant early-stage finance mechanism
    for mid-tier and major mine development. A royalty company provides upfront capital in
    exchange for a perpetual right to purchase a percentage of future metal production at a
    fixed or discounted price—typically 1–3% of gross revenue as a NSR royalty, or 5–20% of
    production at a fixed cost as a streaming agreement. For the mine operator, royalty financing
    is non-dilutive compared to equity and non-amortizing compared to debt—it carries no
    repayment schedule. For the royalty company, a diversified portfolio of early-stage royalties
    generates exponential returns when projects advance to production. The market failure is
    structural: royalty companies source almost exclusively through broker networks, major
    mining company divestiture processes, and corporate relationships with senior geologists
    and bankers who have worked with them before. A junior company at the pre-resource stage in
    a Tier 1 jurisdiction with a project geologically suited to royalty financing—strong grade
    continuity, a deposit style with good metallurgical predictability, a jurisdiction with
    established permitting timelines—has essentially no mechanism to get their project in front
    of the three to five royalty companies whose portfolio criteria it would satisfy, unless they
    have a pre-existing banking relationship that spans the royalty sector."
  dominant_forces:
    - "Royalty and streaming deal flow is almost entirely broker-intermediated, creating a
      structural exclusion of pre-resource junior companies that have not yet built the banking
      relationships through which deals circulate."
    - "Royalty company portfolio criteria are highly specific—commodity preferences, jurisdiction
      risk tolerance, minimum project stage, maximum royalty rate, deposit style suitability—but
      are never published or made discoverable outside confidential LP disclosure documents."
    - "Junior company management teams often lack the deal-structuring knowledge to recognize
      when their project is appropriately structured for royalty financing versus equity—compounding
      the discovery gap with a financial literacy gap."
  deeperpoint_fit: "KnowledgeSlot encodes royalty and streaming deal structures: NSR vs. GRR
    royalties, stream coverage percentages, typical advance payment ranges by project stage,
    and the geological characteristics (grade, metallurgical recovery, deposit scale) that
    royalty companies use to assess the long-term value of royalty positions. CoSolvent matches
    junior project profiles against royalty company mandate profiles—commodity, stage, jurisdiction,
    deal size, and deposit style preferences—generating a structured deal model that gives
    both parties a shared reference frame for the opening conversation."
  economic_upside: "A royalty advance payment to a pre-resource junior ranges from $500,000
    to $10M depending on project stage and commodity. Canada has 100+ junior companies at any
    given time whose projects would qualify for royalty financing but who lack the relationship
    access to reach royalty companies. Structured intermediation captures a matching fee on deal
    events while transforming the royalty market from a closed relationship network into a
    structured open marketplace."
