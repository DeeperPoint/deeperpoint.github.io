story:
  title: The Royalty Nobody Offered
  status: draft
  blog_slug: ""
  characters:
    - "Owen - CEO, junior lithium brine exploration company, Saskatchewan"
    - "Michelle - VP Business Development, Toronto-based royalty company"
  summary: "A Saskatchewan lithium brine project—geologically ideal for royalty financing but
    without a banking relationship—reaches a royalty company portfolio team through a structured
    deal profiling platform and secures a $2.5M advance royalty that funds a definitive
    resource estimate."
  body: |
    ## Act A - The Market Structure

    The royalty model is elegant precisely because it benefits both sides: the mine operator
    avoids dilution and debt service; the royalty company builds a portfolio of long-duration
    assets whose value compounds over decades as underlying projects advance through development.

    It should be the first financing tool that a junior company considers for a project
    approaching resource-estimate stage. In practice, it is available only to junior companies
    that have pre-existing relationships with royalty company business development teams—
    relationships built through banking contacts, corporate advisory roles, and years of
    conference floor interaction. A first-time or early-stage junior without those relationships
    cannot access the royalty market, even with a project that would qualify on every technical
    and structural criterion.

    ---

    ## Act B - The Story

    **Owen** has been building a lithium brine position in the Williston Basin of southwestern
    Saskatchewan for three years. His technical team has completed extensive brine sampling,
    pumping tests, and a preliminary resource-estimate-quality geological model. The brine
    chemistry—low magnesium-to-lithium ratio, manageable calcium, high lithium concentration—is
    suited to direct lithium extraction without extensive pre-processing. A royalty advance
    of $2.5M would fund the full NI 43-101 resource estimate and a DLE pilot test. His three
    approaches to equity financing have been rejected: too early for institutional equity, too
    small for flow-through (the project is brine, not hard rock). His mining finance contact
    told him royalty companies won't look at pre-resource brine plays. He filed that belief
    away and prepared to approach family offices.

    **Michelle** leads business development for a royalty company that has explicitly added
    lithium as a target commodity since the battery metals policy programs of 2024. She is
    specifically looking for Saskatchewan basin brine exposure—the Williston Basin's brine
    chemistry being well-characterized compared to Latin American salar assets. She has reviewed
    six lithium projects in the past year through broker introductions. None were basin brine.
    She doesn't know Owen exists.

    Owen uploads his project profile to the platform: deposit style (brine), commodity (Li),
    jurisdiction (Saskatchewan), stage (pre-resource, pilot test complete), capital requirement
    ($2.5M advance royalty). Michelle's portfolio criteria profile matches on every dimension.
    The platform generates a royalty deal model aligned to standard NSR structures for brine
    projects. Owen reads the deal model and, for the first time, understands that his project
    is royalty-financeable. Michelle reads the project profile and schedules a technical call
    within a week. The advance royalty agreement is executed four months later.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The royalty model cannot serve its function as the most efficient early-stage finance tool
    for Canadian mining if deal flow circulates exclusively through banking relationships that
    most junior companies never build. DeeperPoint creates the structured pipeline that connects
    geologically suitable projects with the royalty companies whose portfolio criteria they satisfy.

    *Characters are fictional. Royalty deal flow concentration in banking relationships is a
    documented structural feature of the junior mining capital market.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
