market_example:
  summary: "Aging, terminally ill, or suddenly hospitalized pet owners needing to arrange long-term care for their animals cannot find verified guardians whose living situation, experience, and commitment level match their pet's specific needs, while willing adopters who would provide excellent homes for these animals have no way to connect with the urgent need."
  problem: "When a pet owner enters long-term care, is hospitalized, or dies, their animals face an immediate crisis. Shelters receive thousands of 'owner surrender' animals annually — not because the animals are unwanted, but because no matching infrastructure exists to connect the owner (or their family) with a verified guardian who can provide appropriate long-term care. A 78-year-old woman entering a long-term care home has two cats — one elderly and diabetic requiring twice-daily insulin, one young and healthy. She needs a guardian willing to manage a diabetic cat's medical regime, not just a general adopter. Her family is calling shelters, posting on Facebook, and asking friends — all under time pressure, all without any way to verify the quality of potential placements. The diabetic cat is especially hard to place because shelters categorize it as 'special needs' and potential adopters are scared off. Meanwhile, a retired veterinary technician 30 km away — experienced in feline diabetes management, living alone in a quiet home, specifically looking for a senior or special-needs cat — exists but is invisible to the family."
  dominant_forces:
    - "Time pressure — pet estate situations are often urgent (hospitalization, death, facility admission), leaving days rather than weeks for placement"
    - "Trust verification — the owner or family needs assurance that the guardian will provide appropriate long-term care, not just temporary fostering; no current mechanism provides this verification"
    - "Special needs matching — many surrendered pets are senior or have medical conditions; matching these animals with guardians experienced in their specific needs is a micro-market within a micro-market"
    - "Emotional complexity — the owner is grieving the loss of their companion; the process must be handled with sensitivity that shelter intake processes are not designed to provide"
  deeperpoint_fit: "Semantic matching encodes guardian profiles (living situation, pet experience by species and condition, veterinary care capability, willingness to manage specific medical needs, home environment, other animals present, long-term commitment verification, references) against owner/family demand signals (animal species, age, temperament, medical conditions, behavioural characteristics, urgency, geographic preference, owner's wishes for the animal's future). KnowledgeSlot curates veterinary care protocols for common senior pet conditions."
  economic_upside: "An estimated 30,000–50,000 Canadian pets are surrendered annually due to owner death, illness, or facility admission. The cost of shelter intake, care, and rehoming for these animals exceeds $50M annually. A platform that matches 20% of these animals directly to verified guardians saves $10M+ in shelter costs and places animals in homes matched to their specific needs."

