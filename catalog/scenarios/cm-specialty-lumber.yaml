market_example:
  summary: "Certified Mexican community forestry operations producing legal traceable tropical hardwoods cannot find Canadian specialty manufacturers; Canadian furniture, instrument, and millwork shops buy the same species through US importers with poor provenance transparency at significant premium."
  problem: "Mexico has significant standing timber of tropical hardwood species — mahogany, ziricote, bocote, tzalam — harvested under SEMARNAT permits by certified community forestry operations (CFOs) in Oaxaca, Chiapas, and the Yucatán. Canadian secondary wood manufacturers, custom furniture makers, instrument builders, and lutherie suppliers have a recurring need for exactly these species and currently source them through US importers at premium, with inconsistent grading and poor supply chain transparency. Direct trade between certified Mexican CFOs and Canadian specialty manufacturers is nearly nonexistent due to CITES documentation complexity, species identification uncertainty, and the lack of any structured discovery channel between the two groups."
  dominant_forces:
    - "Participant scarcity — certified Mexican CFOs producing legal, traceable tropical hardwoods are few; Canadian specialty manufacturers who need them are geographically dispersed"
    - "Regulatory fragmentation — CITES Appendix II documentation, SEMARNAT certificate of legal origin, CBSA import requirements, and provincial endangered species regulations create a compliance matrix neither party can navigate alone"
    - "Offering complexity — tropical hardwood is not a commodity; board-foot quantities, moisture content, defect allowances, figure and grain characteristics, and species-level verification all matter critically to the buyer"
    - "Trust deficit — Canadian manufacturers have encountered fraudulent or illegally logged timber; Mexican CFOs have encountered buyers who reject shipments on quality grounds after receipt"
    - "Opacity — neither party has visibility to the other's existence through any structured channel"
  deeperpoint_fit: "Semantic matching encodes CFO supply profiles (certified species, current inventory, sustainable harvest volume, SEMARNAT permit status, moisture and grading capabilities) against manufacturer demand profiles (species, figure requirements, dimensions, quantities, CITES compliance expectation). KnowledgeSlot curates CITES Appendix II permit requirements, SEMARNAT certificate of legal provenance procedures, CUSMA wood product tariff classifications, and CBSA import requirements. Facilitator role slots accommodate CITES-authorized Mexican export brokers and QSP-accredited dendrology labs for species verification."
  economic_upside: "Community forestry operations in Mexico employ tens of thousands of rural families in areas with few livelihood alternatives. Better market access for certified legal timber creates economic incentive for communities to maintain and expand certification, reducing pressure toward illegal logging. Canadian manufacturers gain access to supply chains with verifiable legal and environmental provenance — increasingly required by end-consumer expectations."

