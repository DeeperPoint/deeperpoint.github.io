market_example:
  summary: "Every Ring of Fire operation has IBA obligations requiring Indigenous contractor participation — but each company maintains its own informal contact list, and each First Nation manages its own roster of available contractors separately. No shared matching infrastructure exists. The thin market is not fractional labour; it is chronic information opacity between operations with compliant contract opportunities and Indigenous contractors with verified capability."
  problem: "Impact Benefit Agreements between Ring of Fire mining companies and Webequie First Nation, Marten Falls First Nation, and other affected First Nations include specific provisions requiring Indigenous contractor participation in construction, operations, and service procurement. These provisions are enforceable, tracked in annual IBA compliance reports, and increasingly tied to operating permits and regulatory approvals. The mining companies are motivated to fulfill them—partly from contractual obligation, partly from genuine commitment to the partnership model that makes Ring of Fire development politically and socially viable. The problem is locating and qualifying Indigenous contractors for specific short-term work packages on short notice in one of the most remote regions of Ontario. An upcoming 40-day shaft station concrete pour needs a qualified forming crew. A winter logistics contract needs a licensed heavy equipment operator certified for ice road operations. A surface infrastructure project needs HVAC mechanical contractors who meet Transport Canada dangerous goods handling requirements. The individuals and small businesses with these qualifications exist within the First Nations communities—Webequie, Marten Falls, Nibinamik First Nation, Fort Hope—but are not organized into a searchable, verified registry with current availability information. Each Ring of Fire operation's community liaison officer is building and maintaining its own informal contact list. When a construction superintendent needs an Indigenous forming crew starting in three weeks, the search is a phone-tree through personal contacts rather than a registry lookup—and the search fails when the contact list is six months out of date or the relevant person has moved to a different community."
  dominant_forces:
    - "IBA compliance obligation — Impact Benefit Agreement Indigenous participation targets are contractually binding and tied to operating permit conditions; they cannot be deferred or satisfied through informal processes as operations scale"
    - "Information opacity, both directions — qualified Indigenous contractors don't know which operations have upcoming contract opportunities; operations don't know which contractors are currently available, certified, and looking for work; both sides have the information the other needs and no shared mechanism to exchange it"
    - "Verification cost duplication — every operation independently verifies trade certifications, WCB coverage, safety training, and equipment ownership for each new Indigenous contractor engagement; a shared verified registry eliminates redundant verification across the cluster"
    - "Competing operation demand without visibility — as Ring of Fire development intensifies, multiple operations will simultaneously seek contractors from the same First Nations communities, creating scheduling conflicts that are invisible until a contractor is double-booked"
    - "Community registry gap — Marten Falls and Webequie First Nations economic development offices are actively building contractor lists from the community side but lack a connection point to the specific contract opportunities at each operation; neither side has the full picture"
  deeperpoint_fit: "A shared Indigenous contractor registry, anchored in Greenstone and maintained in partnership with Webequie, Marten Falls, and other affected First Nations, holds verified capability profiles for businesses and tradespeople eligible for IBA-compliant Ring of Fire procurement. Operations post upcoming contract opportunities with scope, duration, certification requirements, and preferred commencement date. The platform matches against available verified contractors and surfaces opportunities to community members through a mobile interface accessible from remote First Nations communities with satellite internet coverage. IBA compliance administrators at each mining company track the awarding and completion of Indigenous contracts through the same interface, generating the documentation required for annual IBA reporting."
  economic_upside: "A functioning Indigenous contractor registry increases the probability that IBA participation targets are met across all Ring of Fire operations—reducing regulatory and political risk for operations and increasing economic benefit flow to Webequie, Marten Falls, and other First Nations communities. Indigenous contractors who participate in Ring of Fire work build documented capability profiles and financial track records that support bonding, insurance, and access to larger contracts over time. The registry, maintained and partially owned by the First Nations communities themselves, becomes a durable economic infrastructure asset that outlasts any individual mining project and applies to road construction, community infrastructure, and future resource development."

