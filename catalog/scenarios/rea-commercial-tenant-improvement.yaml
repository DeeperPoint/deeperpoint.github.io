market_example:
  summary: "Commercial property managers and landlords trying to close leases on vacant office and retail space cannot efficiently assemble the specialized tenant improvement trade teams—IT cabling, HVAC balancing, custom millwork, accessibility compliance, signage—required to present a credible TI package to a prospective tenant before they lease elsewhere."
  problem: "Commercial lease negotiations for office and retail space increasingly include landlord-provided tenant improvement (TI) allowances that cover base buildout costs. A prospective tenant who is deciding between two available spaces will award the lease to the landlord whose space comes with a credible, detailed, costed TI plan presented at the negotiation stage—ideally with contractor commitments, not just estimates. Property managers at mid-size commercial properties do not have standing TI contractor teams assembled and on call. They manage maintenance with a small roster of general maintenance trades, but specialized TI requirements—structured IT cabling and patch panel installation, HVAC zoning reconfiguration to match the new tenant's open-plan layout, custom reception millwork, accessibility washroom retrofits to current AODA standards, and illuminated exterior signage—require specialty contractor relationships that the property manager does not maintain. The landlord who can say 'our contractor team has committed to an eight-week build timeline starting at lease signing' closes leases faster than the landlord who says 'we'd solicit three quotes after you sign.'"
  dominant_forces:
    - "Offering complexity — a complete TI package for a professional office requires structural, mechanical (HVAC), electrical, IT infrastructure, millwork, accessibility compliance, and signage trades, each with specific commercial tenancy experience"
    - "Timeline commitment — what closes leases is not the estimate but the committed timeline; specialty trades must be able to confirm start dates before the lease is signed, not after"
    - "Vacancy cost pressure — every month of vacancy on a commercial space costs the landlord net operating income; slow TI assembly extends vacancy timelines and directly reduces property value"
    - "Tenant industry specificity — a law firm's TI requirements (privacy offices, secure server room, reception standards) are structurally different from a tech company's (open plan, server access, EV charging in parking); the TI team must have experience in the prospective tenant's space type"
    - "Opacity — property managers cannot efficiently determine which specialty trade contractors have current availability and commercial tenancy experience for the specific space type and timeline"
  deeperpoint_fit: "Semantic matching encodes contractor profiles (trade specialization, commercial TI experience by tenant type, availability for project start dates, timeline commitment track record, typical scope size in square footage) against property manager opportunity signals (space type, square footage, prospective tenant industry, TI scope components required, target timeline, budget). Pre-built TI contractor panels—assembled in advance for a property or geographic market—allow property managers to respond to lease inquiries with committed contractor timelines, not speculative estimates."
  economic_upside: "A commercial space leasing at $28/sq.ft. on a 4,000 sq.ft. floor generates $112,000/year in rent. Every month of additional vacancy while the TI team is being assembled costs the landlord approximately $9,300. A TI contractor panel that enables lease closing one month faster than the competition pays for itself immediately. At scale, a property manager with a pre-assembled TI trade panel can quote committed TI timelines across their entire portfolio, converting leasing from a reactive negotiation into a proactive competitive differentiator."

