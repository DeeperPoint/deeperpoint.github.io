market_example:
  summary: A structured matching platform connecting junior Canadian mineral explorers seeking
    flow-through share financing with high-net-worth individual investors and their tax advisors
    who need to deploy Canadian Exploration Expense credits before year-end—bypassing the
    expensive brokered placement circuit that extracts 6–8% in agent commissions.
  problem: "Flow-through shares are a uniquely Canadian financing instrument: investors in
    a junior mineral exploration company's flow-through share placement can renounce the
    qualifying exploration expenditures to the investor, who claims them as a deduction against
    income—effectively providing a 30–50% after-tax cost reduction on the investment, depending
    on the investor's provincial tax rate. The CRA requires that the renounced expenditures
    be incurred within 24 months of the share issuance, creating a structured capital deployment
    mechanism that aligns investor tax planning timelines with exploration program execution.
    The market failure is on the distribution side. Accessing flow-through investors today
    requires retaining a brokerage firm that specializes in resource financings—typically charging
    6–8% in agent commissions plus warrant sweeteners that dilute existing shareholders. For a
    junior company raising $500,000, this means $40,000 in commissions and a legal bill of
    $25,000–$35,000 before a dollar is in the ground. Smaller companies below the threshold of
    broker interest—raising $150,000 to $400,000 for a focused Phase 1 program at a genuinely
    early-stage prospect—cannot access the investor pool at all. Meanwhile, thousands of
    high-net-worth Canadians and family offices with year-end tax-planning needs actively seek
    flow-through placements but have no structured way to discover small, geologically sound
    exploration companies below the broker coverage threshold."
  dominant_forces:
    - "Canada's flow-through share regime is one of the world's most effective exploration
      financing tools, but its distribution through brokered placements systematically excludes
      small-raise companies and direct investors who do not run through institutional channels."
    - "Year-end tax planning creates predictable capital deployment windows (October–December)
      that junior companies could exploit efficiently if they could reach the right investors
      without broker intermediation."
    - "The 2023 Critical Mineral Exploration Tax Credit (CMETC) added a federal 30% tax
      credit on top of existing provincial credits for qualifying critical mineral exploration,
      dramatically increasing flow-through investment returns for qualifying projects—but
      awareness among direct investors is limited without structured outreach."
  deeperpoint_fit: "KnowledgeSlot encodes the CRA flow-through share rules, CMETC qualifying
    criteria, and the standard renunciation agreement structure. CoSolvent matches a company's
    qualifying exploration program (commodity, location, exploration budget, expenditure timeline)
    against investor profiles that specify their tax-credit eligibility, investment size range,
    and sector preferences. The platform structures a compliant term sheet and renunciation
    agreement template, eliminating much of the legal setup cost."
  economic_upside: "The Canadian flow-through share market deploys approximately $1–1.5 billion
    annually. The platform targets the sub-$500K raise segment that is systematically underserved
    by brokers and represents hundreds of early-stage programs. Revenue from a 2–3% platform fee
    versus 6–8% broker commissions makes the platform significantly cheaper for issuers while
    being sustainable for the operator."
