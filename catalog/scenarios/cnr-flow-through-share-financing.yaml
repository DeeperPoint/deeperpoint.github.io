story:
  title: The Year-End Window
  status: draft
  blog_slug: ""
  characters:
    - "Tomas - President, small gold-nickel explorer, Red Lake area, Ontario"
    - "Diane - Wealth Advisor managing HNW client portfolios with year-end tax needs, Toronto"
  summary: "A gold-nickel junior that cannot afford broker commissions directly places flow-through
    shares with high-net-worth investors through a platform that matches the company's CMETC-qualifying
    program with the clients' year-end tax-planning timeline."
  body: |
    ## Act A - The Market Structure

    Canada's flow-through share regime is one of the most elegant resource financing tools
    ever designed. It lets the government subsidize mineral exploration by routing tax credits
    through the investor rather than the company—aligning private capital with public resource
    development goals without direct government spending.

    Its fatal flaw is distribution. The brokered placement circuit that delivers flow-through
    capital to junior companies works beautifully for raises above $1M. Below that threshold,
    brokers cannot cover their costs, and the junior company—which may have a perfectly competent
    geological program, a valid CMETC-qualifying commodity, and a year-end expenditure timeline
    that maps perfectly onto investor tax planning—simply cannot reach the market.

    ---

    ## Act B - The Story

    **Tomas** needs to raise $280,000 to fund a Phase 1 soil geochemistry and ground magnetics
    survey on a gold-nickel target southwest of Red Lake. The commodity qualifies for CMETC.
    The expenditure window is right. Two Toronto brokers told him the raise is too small to
    economically underwrite. One suggested a finder's fee arrangement, but the legal costs
    alone would consume 10% of the raise. Tomas is considering funding the program personally,
    which would exhaust his working capital and leave nothing for the next stage.

    **Diane** manages portfolios for sixteen families with tax years ending December 31st. She
    routinely places $15,000–$40,000 per client in flow-through investments. Her current flow-through
    inventory comes from two Toronto brokers who allocate her clients into the same three repeat
    issuers. Her clients want diversification into earlier-stage programs with higher exploration
    leverage—and the CMETC premium for qualifying critical minerals makes gold-nickel exposure
    particularly attractive this year. She has no mechanism to find Tomas.

    Tomas uploads his qualifying exploration program to the platform in October: commodity,
    location, planned CEE expenditures, timeline, CMETC eligibility pre-screen. The platform
    generates a compliant flow-through offering profile. Diane queries the platform for her
    clients' Q4 window: investment size range, CMETC qualification, gold and base metal exposure.
    Tomas's program surfaces as a qualified match. The platform generates the term sheet and
    renunciation agreement framework. Diane places $240,000 across eight client accounts.
    Tomas starts the field program in January with zero broker commissions paid.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The flow-through share mechanism was designed to deploy private capital into Canadian
    mineral exploration regardless of broker coverage. Without a distribution platform that
    reaches below the broker threshold, the mechanism fails for the smallest, earliest-stage
    programs—precisely the ones where geological risk is highest and the incentive is most
    needed. DeeperPoint builds the marketplace that makes flow-through financing work as intended.

    *Characters are fictional. The flow-through market gap below broker thresholds is real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
