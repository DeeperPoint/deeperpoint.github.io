    strategic_logic: "Organic certification bodies (OCPP, COABC, QCO), specialty grain marketing organizations, and provincial organic producer associations have both producers and processors as members. A platform offered through certification body partner channels reaches the organized specialty grain market on both sides without requiring direct-to-farmer marketing."
