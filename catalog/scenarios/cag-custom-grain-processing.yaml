market_example:
  summary: "Farmers growing organic, food-grade, or specialty grain for premium markets cannot access identity-preserving cleaning, drying, and milling capacity without lengthy search and scheduling crises — while commercial processors with certified idle capacity have no efficient mechanism to reach the specialty grain producers who need short-run, documentation-rich processing runs."
  problem: "Commodity grain handling is designed for volume throughput without identity preservation. The terminal elevator system commingles all grain of a given grade; identity disappears at the first handling point. Farmers producing specialty crops for food-grade or organic markets — heritage wheats requiring identity-preserved milling, organic oats requiring certified organic cleaning facilities with documented flush protocols, specialty pulses requiring allergen-control cleaning between runs — must find processing facilities that offer identity preservation as a service. These facilities exist: small commercial mills, custom cleaning operations, organic-certified elevators, and specialty dryer operators. The problem is mutual opacity. The specialty grain farmer who produces 30 tonnes of identity-preserved organic oats does not know which cleaning facility in their region has organic certification, which is willing to do a 30-tonne short run, which has documented flush protocols that satisfy food-grade buyer requirements, and which has scheduling availability in the post-harvest window. The processing facility operator who has certified identity-preserving capacity available does not know which farmers in their catchment radius are growing the specialty crops that would fill that capacity profitably."
  dominant_forces:
    - "Certification specificity — food-grade and organic identity preservation requires specific facility certifications (CFIA-registered, CFIA food-grade, Canada Organic Regime certified, allergen control protocols) that are held by a small subset of prairie processing facilities"
    - "Volume fragmentation — specialty grain producers typically have short-run volumes (20–150 tonnes) that require short-run processing flexibility; commodity processing infrastructure is optimized for multi-thousand tonne continuous runs"
    - "Scheduling window constraint — post-harvest grain processing must occur within a specific moisture and quality window; delayed processing access creates grain quality loss and premium degradation"
    - "Documentation intensity — food-grade buyers require full chain-of-custody documentation (field identity, cleaning facility records, flush protocol documentation) that commodity processors do not routinely issue"
    - "Geographic constraint — short-run identity-preserved grain handling requires proximity; long-distance hauling is cost-prohibitive for premium grain in specialty quantities"
  deeperpoint_fit: "Semantic matching encodes processor profiles (certification status by type, minimum/maximum run size, crop capabilities by grain type, allergen control protocol, flush documentation system, geographic service radius, seasonal availability calendar) against farmer demand signals (crop type and variety, processing required by type, certification required, volume, timeline, documentation requirements, distance tolerance). Scheduling integration enables real-time capacity availability visibility."
  economic_upside: "Food-grade grain premiums range from 30–200% over commodity prices, depending on the crop and specification. The premium is realized only if the farmer can access identity-preserving processing at a cost that preserves the margin. A prairie organic oat farmer who cannot access certified organic cleaning loses the organic premium on their entire crop — a loss of $0.10–$0.25/lb on 50 tonnes ($10,000–$25,000 per growing season) — not because their crop is not organic but because the processing bottleneck could not be resolved. The Canadian organic grain market exceeded $500M in farm gate value in 2024; organic and food-grade specialty grain processing capacity is growing but remains fragmented and opaque to the producers who need it."

