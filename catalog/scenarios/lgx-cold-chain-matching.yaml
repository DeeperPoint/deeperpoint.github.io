market_example:
  summary: "A small Ontario craft dairy producer needs a carrier certified for HACCP temperature-controlled dairy transport for a single pallet of artisan cheese to a Toronto distributor. Standard load boards don't filter by food safety certification or product-specific temperature range. The producer makes twelve calls before finding a carrier that may be compliant — and cannot verify it."
  problem: "Temperature-controlled freight is not a monolithic market. A carrier approved for general refrigerated transport is not necessarily approved for HACCP-compliant dairy, regulatory-grade pharmaceutical distribution, live seafood transport, or ultra-low-temperature vaccine logistics. The certification requirements differ by product category, regulatory regime (CFIA, Health Canada, FDA for cross-border), and temperature range (chilled 0–4°C, frozen −18°C, deep frozen −40°C, ultra-low −80°C). Standard freight matching platforms — refrigerated or otherwise — do not index certification scope. A pharma shipper who needs a carrier with Health Canada Good Distribution Practice (GDP) documentation and validated temperature monitoring cannot determine this from a load board listing. The result: food and pharma shippers make extensive verification calls before trusting a carrier; specialty carriers cannot efficiently signal their certified capability; and high-value, sensitive freight routinely moves on carriers whose compliance with relevant regulations is self-reported and unverified."
  dominant_forces:
    - "Certification opacity — carrier cold-chain certifications (HACCP, GDP, FSMA, specific temperature range validations) are not indexed on any load board or carrier directory"
    - "Regulatory complexity — CFIA food safety transport regulations, Health Canada GDP, FDA FSMA 204 differ by product type, creating a verification burden most shippers cannot efficiently discharge"
    - "Search friction — 'refrigerated carrier' does not distinguish between a grocery van and a GDP-certified pharma distributor"
    - "Trust deficit — food and pharma shippers cannot accept carrier non-compliance without product liability and regulatory exposure"
    - "Temporal perishability — chilled and fresh freight has narrow delivery windows that cannot accommodate extended carrier search times"
  deeperpoint_fit: "KnowledgeSlot holds the cold chain certification taxonomy — HACCP scope by product category, Health Canada GDP requirements for pharmaceutical distribution, CFIA Safe Food for Canadians Act transport requirements, and FSMA requirements for cross-border food transport — enabling semantic matching on certified capability, not self-reported category. The platform verifies carrier certifications against regulatory databases rather than relying on self-reporting. The Generative Match Story explains to the shipper what the carrier's specific certifications mean in terms of their product's regulatory compliance requirement — reducing the verification burden from twelve phone calls to a single structured brief."
  economic_upside: "Canada's cold chain logistics market is estimated at $18–25B annually. A significant fraction of shipments — particularly for SMB food producers, specialty pharma distributors, and craft producers — operate in a discovery environment that costs 10–20% of shipment value in wasted search and carrier qualification time. A matching platform serving even 5% of the SMB cold chain segment would facilitate $900M–$1.25B in annual freight value, generating $27–$38M in facilitation fees at 3% while materially reducing regulatory non-compliance risk across the sector."

