market_example:
  summary: "Internationally trained professionals arrive in Canada with verifiable skills and willing employers exist — but Canada's credential recognition system is so fragmented across provincial bodies, language assessors, bridging programs, and employer portals that neither side can find the other efficiently."
  problem: "An internationally trained nurse practitioner from the Philippines, a software architect from India, a civil engineer from Nigeria — all arrive in Toronto ready to work. A hospital system, an engineering firm, a construction company faces persistent shortages in those exact roles. Both sides exist. They cannot find each other efficiently because Canada's credential recognition system is fragmented across provincial professional bodies, language assessors, bridging programs, and employer HR portals — and because the immigrant cannot parse this landscape without paying advisors they cannot afford."
  dominant_forces:
    - "Regulatory fragmentation — provincial licensing bodies, profession-specific colleges, and bridging program eligibility rules all differ by profession and province"
    - "Opacity — immigrants cannot discover which bridging programs apply to them without expert navigation"
    - "Cognitive overload — the navigation burden across regulators, assessors, programs, and employers is prohibitive for a new arrival"
    - "Trust deficit — employers cannot validate unfamiliar foreign credentials without costly independent verification"
    - "Information asymmetry — the immigrant knows their qualifications; the employer knows the local requirements; both need a translator between the two knowledge domains"
  deeperpoint_fit: "KnowledgeSlot curates provincial licensing requirements, bridging program inventories, and credential equivalency tables for dozens of professional categories. Semantic matching aligns the immigrant's profile (credential type, country of origin, language scores, prior experience) with the right bridging path, the right employer sponsor, and the right regulatory body simultaneously. The Generative Match Story becomes a personalized credential roadmap — what to do first, second, and third. Multi-channel input (WhatsApp-based intake) removes the digital access barrier for new arrivals."
  economic_upside: "Canada spends approximately $2.4 billion annually on settlement services. Credential recognition failure drives up to 30% earnings loss for internationally trained professionals relative to Canadian-born peers with equivalent skills. Better matching compresses the 18–36 month limbo period to 90 days for candidates in well-documented professions, creating immediate labour market productivity and immigrant economic success."

