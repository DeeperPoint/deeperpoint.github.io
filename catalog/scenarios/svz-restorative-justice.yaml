market_example:
  summary: "A person leaving incarceration needs housing, employment, addiction services, legal aid, and government benefit enrollment — simultaneously. These services exist across dozens of agencies. The person has no map. The agencies have no shared intake system. The system expects the person with the most limited capacity to coordinate the most fragmented landscape."
  problem: "A person leaving incarceration needs, simultaneously: housing, employment, addiction services, legal aid, and government benefit enrollment. These services exist across dozens of agencies with separate intake processes, eligibility criteria, and waitlists. The person has no map. The agencies have no shared intake system. The result: the person with the most limited capacity to navigate is expected to coordinate across the most fragmented system, unsupported, within a release window that determines whether reintegration or re-incarceration follows."
  dominant_forces:
    - "Cognitive overload — the system of services, eligibility criteria, application processes, and waitlists is nearly impossible to navigate without a dedicated case coordinator"
    - "Regulatory fragmentation — services funded by federal, provincial, and municipal governments each have different eligibility rules, documentation requirements, and intake processes"
    - "Trust deficit — institutions don't extend trust to individuals with criminal records; the person has often experienced serious institutional harm and does not extend trust to institutions"
    - "Opacity — available service capacity is not visible; people don't know which agencies have openings, which have waitlists, or which have intake requirements they can actually meet"
    - "Temporal distance — the reintegration window is narrow; the first 72 hours and 30 days after release are the highest-risk period; matching delays in critical services create cascading failures"
  deeperpoint_fit: "KnowledgeSlot curates service eligibility rules across categories: housing (subsidized housing, transitional housing, halfway house eligibility by conviction type), employment (ban-the-box employer registry, ACCES Employment programs, Ontario Works enrollment), addiction services (RAAM clinic access, CAMH community services, peer support programs), legal aid (Legal Aid Ontario eligibility, duty counsel availability), and benefit enrollment (Ontario Works, ODSP, OSAP reinstatement). Semantic matching aligns the individual's situation (sentence length, conviction category, housing history, employment history, disclosed needs) with available service capacity. The consent model and data minimization protocol are essential — this population cannot be exposed to standard data profiling."
  economic_upside: "The Annual cost of reincarceration in Canada is approximately $130,000 per person per year. Successful reintegration that prevents even one reincarceration event per successfully matched individual generates government savings that are 10–50x the cost of the matching infrastructure. Social return on investment studies of reintegration support programs consistently find SROI ratios of 3:1 to 8:1."

