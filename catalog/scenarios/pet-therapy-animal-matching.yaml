market_example:
  summary: "Hospitals, long-term care homes, schools, and mental health programs seeking certified therapy animal teams for structured programming cannot find handlers whose animal's temperament, certification level, and availability match their patient population and schedule, while certified therapy animal handlers volunteer informally or not at all because no systematic matching channel exists."
  problem: "Animal-assisted therapy has strong clinical evidence for reducing anxiety, improving mood, and supporting rehabilitation in hospital, long-term care, palliative, pediatric, and mental health settings. Canada has an estimated 3,000–5,000 certified therapy animal teams (handler plus animal, certified through organizations like St. John Ambulance Therapy Dog Program, Pet Therapy Society, or Therapeutic Paws of Canada). But institutions seeking therapy animal programming have no systematic way to find certified teams. A palliative care ward in Hamilton wanting weekly therapy dog visits needs a handler whose dog is specifically certified for healthcare settings (not just community visits), comfortable with medical equipment, calm around patients in beds, and available on Tuesday afternoons. That handler exists — she is a retired nurse with a certified golden retriever who lives 20 minutes from the hospital. She has been looking for a regular placement since her previous long-term care home visit program ended. Neither side knows the other exists."
  dominant_forces:
    - "Certification level opacity — therapy animal certifications vary widely; a dog certified for library reading programs may not be certified for hospital environments with medical equipment, fragile patients, and infection control requirements"
    - "Temporal matching — institutions need regular, scheduled visits; handlers need placements that fit their personal schedules; these rarely align without a matching system"
    - "Trust and liability — institutions need verified certification, insurance, and vaccination documentation; handlers need institutions that understand and respect therapy animal welfare protocols"
    - "Population-specific temperament — a therapy dog excellent with children may be inappropriate for dementia patients; matching animal temperament to patient population requires more specificity than 'certified therapy dog'"
  deeperpoint_fit: "Semantic matching encodes therapy team profiles (certification body, certification level, animal species and breed, temperament profile by population type, healthcare vs. community setting experience, infection control training, availability schedule, insurance status, handler professional background) against institutional demand signals (setting type, patient population, visit frequency and schedule, infection control requirements, space constraints, program goals). KnowledgeSlot curates institution-specific therapy animal protocols."
  economic_upside: "Animal-assisted therapy programming in Canadian healthcare and education is estimated at $20–50M annually when valued at market rates for comparable therapeutic services. Most current therapy animal work is volunteer-based. A platform that improves matching could formalize $5–15M in structured programming while supporting both volunteer and compensated models."

