market_example:
  summary: "Ontario pharmacists can now assess and prescribe for 19 minor ailments, but most patients still go to ER or urgent care because they don't know the pharmacist option applies — and pharmacists with capacity have no mechanism to signal availability to patients who need them."
  problem: "In Ontario, pharmacists can now assess and prescribe for 19 minor ailments (UTIs, pink eye, athlete's foot, etc.) under the Minor Ailments and Injections Program. But most patients go to the ER or an urgent care clinic anyway — because they don't know what they can take to a pharmacist, they don't know which nearby pharmacist has time, and pharmacists with capacity have no mechanism to signal availability to patients."
  dominant_forces:
    - "Opacity — patients don't know the pharmacist option exists or that their specific condition qualifies"
    - "Cognitive overload — determining whether a specific condition qualifies under the 19 authorized ailments is non-trivial for a layperson"
    - "Search friction — no discovery mechanism exists for 'pharmacist with capacity for minor ailment assessment near me right now'"
    - "Regulatory fragmentation — the 19 qualifying conditions, provincial ODB billing codes, and scope-of-practice rules are non-intuitive and change with program updates"
  deeperpoint_fit: "CommonContext curates the 19 qualifying conditions, ODB billing codes, formulary constraints, and scope-of-practice rules — kept current as the program evolves. Semantic matching aligns patient symptom description (provided via WhatsApp or SMS) with the qualifying condition taxonomy and pharmacist specialization. The WhatsApp interaction mode is particularly relevant: a patient texts a symptom description; AI assesses whether it qualifies as a minor ailment; if yes, the nearest available and appropriately trained pharmacist is matched. The Generative Match Story explains to the patient in plain language whether and how the pharmacist can help — removing the opacity barrier at the point of decision."
  economic_upside: "Each minor ailment ER visit costs the Ontario health system approximately $350–$600 vs. $15–$30 for a pharmacist minor ailment assessment. Ontario performs an estimated 6–8 million minor ailment-eligible ER and urgent care visits per year. Diverting even 10% to appropriately matched pharmacist assessment would save $200–$500 million annually in system costs. Parmazip and similar ventures are positioned at exactly this intersection."

