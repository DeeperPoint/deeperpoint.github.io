market_example:
  summary: "Matches overloaded courts and willing victims with culturally appropriate, certified restorative justice facilitators, diverting massive caseloads from the formal court system."
  problem: "The Canadian court system is catastrophically backlogged. For non-violent or youth offenses, Crown prosecutors increasingly want to use 'Restorative Justice' (RJ) diversion programs, which are proven to reduce recidivism and heal communities. However, finding an RJ facilitator who is culturally appropriate for the victim and offender, has active capacity, and is certified by the province is an administrative nightmare, often resulting in the case languishing until the charges are stayed."
  dominant_forces:
    - "The 'Jordan ruling' dictates strict time limits on trials, putting immense pressure on courts to divert cases."
    - "Victims require extreme care and specific, trauma-informed facilitator matching."
    - "RJ facilitators are largely disorganized non-profits or independent contractors with no centralized dispatch."
  deeperpoint_fit: "CoSolvent aggregates the regional capacity of RJ facilitators. It maps the specific cultural and trauma-informed requirements of the victim/offender against the facilitator's profile. CommonContext handles the intense privacy requirements of transferring police summaries for the diversion."
  economic_upside: "A single criminal trial costs the state tens of thousands of dollars. Diverting even 2% of the docket via efficient RJ matching saves the system millions. Monetization via Ministry of Justice deployment SaaS."

