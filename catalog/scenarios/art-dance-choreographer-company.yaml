market_example:
  summary: "A contemporary dance company seeking a choreographer whose movement vocabulary engages with South Asian classical idioms for a specific community commission, or a Northern Ontario Indigenous dance collective needing a choreographer with land-based practice, cannot surface the right practitioner through Canada Council directories or dance industry networks that index by geography and credentials rather than by movement vocabulary and cultural practice."
  problem: "Dance commissioning is among the most specificity-intensive arts matching problems. A dance company commissioning an outside choreographer is not hiring by credential — they are hiring a specific movement intelligence, a specific relationship to the body in space, a specific cultural or conceptual lens. A professional Toronto dance company mounting a piece about South Asian-Canadian diaspora identity needs a choreographer whose practice lives at the intersection of Bharatanatyam and contemporary movement — not any choreographer who has studied South Asian dance, but one whose body and vocabulary has internalized that intersection in a way that translates to the company's dancers. An Indigenous dance collective in Northern Ontario commissioning a collaborative work needs a choreographer whose practice connects to land-based movement rather than studio-based contemporary technique. These distinctions are not articulable in a job posting, are not represented in Canada Council artist directory listings, and are invisible to the booking relationship networks that direct dance companies source from. The choreographer whose specific vocabulary is exactly right is likely not in the company's geographic network and may not have produced work at the scale the commission requires — but has the exact movement intelligence the commission needs."
  dominant_forces:
    - "Movement vocabulary specificity — choreographic practice is constituted by a specific relationship to movement, space, and the body that is difficult to evaluate without watching the choreographer's work, and that text descriptions inadequately capture"
    - "Cultural practice depth — commissions requiring cultural specificity (South Asian classical idiom, Northern Indigenous movement practice, African dance traditions) require choreographers with genuine practice depth, not academic familiarity"
    - "Repertory fit — the choreographer's movement vocabulary must match the training and technique of the commissioning company's dancers; a contemporary company whose dancers are trained in release technique needs a different choreographer than a company trained in codified contemporary methods"
    - "Geographic network dependency — artistic directors commission choreographers from their existing professional relationships; a choreographer outside the artistic director's geographic and institutional network is invisible regardless of practice relevance"
    - "Commission risk — commissioning an outside choreographer is a creative risk; the artistic director needs confidence that the choreographic vision will translate into stage-ready work within the production timeline, which requires assessment of creative process and collaborative capacity as well as movement vocabulary"
  deeperpoint_fit: "Semantic matching encodes choreographer profiles (movement vocabulary and conceptual framework, cultural practice tradition and depth, dancer technique compatibility, production type and scale experience, collaborative process description, geographic base and residency capacity, prior commission history and timeline performance) against commission demand signals (company technique and training, commission theme and cultural context, scale and production timeline, budget, geographic context, artistic director's evaluation of company's movement needs). Video portfolio analysis evaluates movement vocabulary beyond textual description."
  economic_upside: "Canada Council for the Arts investment in dance exceeds $20M annually; Ontario Arts Council dance investment adds $8M+; provincial arts councils across Canada add further investment. Most of this funding eventually generates choreographic commission spending. A platform that improves choreographic commission matching — surfacing the right vocabulary match beyond the artistic director's existing network — distributes commission income more equitably across the choreographic community while improving artistic outcomes for companies whose commissions currently default to the known network. An estimated 2,000+ professional choreographers in Canada are actively available for commissions; fewer than 200 are in the networks where commissions regularly circulate."

