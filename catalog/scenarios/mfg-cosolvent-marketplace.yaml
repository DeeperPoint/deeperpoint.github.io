market_example:
  summary: "Independent machining shops with rare or specialized capabilities — Swiss-turn screw machining, EDM wire cutting, 5-axis contouring, deep-hole gun drilling — are effectively invisible to the OEMs and contract manufacturers who need exactly what they do. No directory captures the combination of machine type, material certification, and demonstrated tolerance needed to make a reliable match."
  problem: "The contract machining market has two chronic failures. On the supply side, specialty machining shops — gun drilling, Swiss-turn, EDM, precision grinding, ultra-precision diamond turning — cannot effectively market their capabilities to a buyer universe that doesn't know what to search for. On the demand side, OEM procurement and manufacturing engineers spend days or weeks cold-calling shops to determine whether any has the right combination of equipment, certifications, and available capacity for a specific job. General outsourcing platforms match only by process category; they cannot determine whether a shop's gundrilling capacity can achieve the L/D ratio, surface finish, and repeatability a specific hydraulic manifold requires. The transaction cost of discovering whether a match exists is so high that it often exceeds the value of the job itself for small-volume specialty work."
  dominant_forces:
    - "Opacity — specialty capability (specific machine configurations, demonstrated tolerances, material experience) is locked in shop-floor knowledge invisible to any external directory"
    - "Search friction — buyers cannot specify their need precisely enough for keyword search to find a relevant match; the vocabulary of machining capability is too technical"
    - "Information asymmetry — buyers cannot evaluate shop capability from a website; sellers cannot know that their specific capability is exactly what a buyer needs"
    - "Deal complexity — quoting specialty machining requires material specs, tolerance requirements, surface finish, quantity, and delivery time — a structured conversation, not a catalog transaction"
    - "Cold-start fragmentation — specialty capability is geographically dispersed; no single region has enough specialty shops in any one category to sustain a conventional marketplace"
  deeperpoint_fit: "KnowledgeSlot holds the machining capability taxonomy — process types, machine configurations, material grades, achievable tolerance ranges, surface finish standards — enabling semantic matching between a buyer's engineered requirement (expressed in drawing language or natural text) and a shop's documented capability profile. The Cosolvent matching layer handles the translation between buyer intent (expressed as a part requirement) and seller capability (expressed as process terms). The Generative Match Story produces a capability alignment brief — explaining to the buyer why a specific shop's equipment and experience match their requirement, and explaining to the shop what the job involves before either party invests in a full quote."
  economic_upside: "Canada's custom machining sector generates an estimated $8–12B annually. A matching platform that reduces buyer search time from days to hours — and improves shop utilization by routing specialty work to the shops best qualified to do it — could capture 1–2% of transaction value in facilitation fees, generating $80–$240M in annual platform revenue while materially improving capital efficiency across the sector."

