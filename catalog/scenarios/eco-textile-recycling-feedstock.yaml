market_example:
  summary: "Clothing retailers, uniform suppliers, hotel linen services, and textile manufacturers generating sorted post-consumer or post-industrial textile waste cannot find fibre recyclers whose processing technology matches the fibre composition of their waste stream, while fibre recyclers operate below capacity because they cannot source consistent feedstock in the fibre types their equipment processes."
  problem: "Canada generates approximately 500,000 tonnes of textile waste annually — making it the fastest-growing waste category in the country. Less than 15% is diverted from landfill. The recycling infrastructure exists but is chronically underfed: mechanical fibre recyclers in Quebec and Ontario can process cotton, wool, and polyester into insulation, industrial wiping cloths, and recycled yarn — but only if the feedstock is sorted by fibre type, free of contamination, and delivered in sufficient volume. A hotel chain replacing 50,000 cotton sheets generates a feedstock stream that a cotton fibre recycler would pay for. A uniform company retiring 100,000 polyester-blend workwear garments generates feedstock for a synthetic fibre recycler. A fashion retailer's take-back program collects thousands of garments that, if sorted, would feed multiple recyclers. But none of these generators know which recyclers exist, what fibre types they accept, or what sorting standards they require. The textiles go to landfill or to offshore 'recycling' that is often re-export to developing country markets."
  dominant_forces:
    - "Fibre composition opacity — textile waste must be sorted by fibre type (cotton, polyester, wool, blends) for recycling; most generators don't know the fibre composition of their waste and have no way to sort it"
    - "Volume aggregation — individual generators produce volumes too small for direct recycler relationships; aggregating multiple generators' streams requires coordination"
    - "Processing technology specificity — different recyclers process different fibre types with different equipment; a cotton recycler cannot process polyester; matching feedstock to technology is critical"
    - "Quality and contamination standards — recyclers require feedstock free of buttons, zippers, prints, and chemical contamination; these standards are recycler-specific and not published"
  deeperpoint_fit: "Semantic matching encodes textile waste generator profiles (material type, fibre composition if known, volume and frequency, current state — sorted/unsorted, source type — post-consumer/post-industrial, location, current disposal cost) against recycler demand signals (accepted fibre types, contamination standards, minimum volume, sorting requirements, pricing, processing technology, location). CommonContext curates fibre identification protocols and recycler-specific feedstock standards."
  economic_upside: "Canadian textile waste has an estimated diversion value of $100–300M annually if processed through fibre recycling rather than landfilled. A platform facilitating 10% of textile-to-recycler matching generates $10–30M in facilitated feedstock transactions while diverting 50,000+ tonnes from landfill annually."

