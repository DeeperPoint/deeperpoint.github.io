title: "Music Licensing: Matching Independent Film and Documentary Composers to Production Music Briefs"
card_title: "Independent Film Composer to Production Brief Matching"
sector: arts-cultural-markets
sub_sector: Film & Documentary Music Composition
forge_tier: 1
