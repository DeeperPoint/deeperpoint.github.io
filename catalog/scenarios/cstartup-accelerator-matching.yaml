market_example:
  summary: "Founders outside the major hubs do not know which accelerators accept remote cohort participants or have geographic mandates covering their region, while accelerators with remote capacity or regional mandates cannot efficiently discover quality founders outside their existing application pipelines."
  problem: "Founders in communities outside the major hubs do not know which accelerators, incubators, and startup programs accept remote cohort participants, have geographic mandates covering their region, or have relevant sector focus for their industry. Meanwhile, accelerators with remote participation capacity or regional mandates cannot efficiently discover quality founders in their geographic or sector scope who are not embedded in the networks feeding their application pipelines. The result: undersubscribed programs in some cities coexist with unfunded remote founders who don't know the programs exist or could admit them."
  dominant_forces:
    - "Search friction — no comprehensive, filterable directory of Canadian accelerators and incubators exists that specifies remote participation policies, geographic mandates, sector focus, cohort timing, and application requirements"
    - "Offering complexity — each program is unique in sector focus, stage requirements, equity or fee structure, programming format, remote vs. in-person requirements, and post-program support"
    - "Opacity — most accelerator deal flow comes through warm referrals from within the program's university, corporate, or investor network; founders outside those networks cannot access the pipeline"
    - "Temporal distance — cohort applications open and close on fixed schedules that do not align with founders' readiness timelines; founders miss windows without any systematic notification"
    - "Information asymmetry — programs do not publicize internal selection criteria with enough specificity for founders to self-select accurately, generating high volumes of mismatched applications"
  deeperpoint_fit: "Semantic matching encodes founder company profile (stage, sector, team composition, capital raised, geographic location, remote participation preference) against program profile (sector focus, stage requirements, remote participation policy, geographic mandate, cohort timing, equity/fee model). KnowledgeSlot curates the Canadian accelerator and incubator landscape with normalized profiles across sector, stage, remote policy, and funding eligibility — including BDC-affiliated programs, IRAP accelerator partnerships, and provincial startup program directories. Anticipatory matching surfaces cohort application windows to founders with matching profiles before the deadline. The trusted intermediary allows founders to share business details with pre-screened programs rather than with the open internet."
  economic_upside: "Canadian accelerator and incubator capacity is underutilized in many regions while being oversubscribed in others. Better geographic matching extends the reach of existing programs without requiring new program creation — a capital-efficient way to expand the startup support ecosystem to underserved regions, and directly aligned with BDC, NRC-IRAP, and provincial program mandates to serve founders outside the major hubs."

sponsor_opportunities:
  - title: "Canadian Accelerator Discovery Platform (SaaS)"
    type: saas
    revenue_model: "Annual program listing subscription for accelerators ($299–$699/year, tiered by cohort size and geographic reach); founder search subscription ($49/year or free through BDC/economic development agency partnerships)"
    strategic_logic: "BDC operates or funds multiple accelerator programs and has an explicit mandate to reach remote and underserved founders. A discovery platform that normalizes program profiles and makes them searchable by founder context solves a known access gap in BDC's program delivery — creating a direct partnership or integration opportunity."
    recurring: true

  - title: "Application Readiness Assessment Service"
    type: managed-service
    revenue_model: "Per-founder application readiness assessment ($199–$349); cohort pre-assessment for economic development agencies ($999 for groups of 6–10)"
    strategic_logic: "Remote founders applying to accelerators fail disproportionately due to application quality, not business quality. A structured readiness assessment that benchmarks the application against the specific program's disclosed selection criteria and identifies specific improvement areas before submission reduces preventable application failures."
    recurring: false

  - title: "Program Cohort Supply Analytics"
    type: data-service
    revenue_model: "Annual analytics subscription for accelerators ($799/year); provincial economic development agency cohort supply analysis ($1,200/year)"
    strategic_logic: "Accelerators with remote participation capacity often don't know how many qualified founders in their geographic mandate are not applying — the invisible demand problem. An analytics service that maps unmatched founder profiles against program parameters quantifies the pipeline opportunity and justifies outreach investment."
    recurring: true

story:
  title: "The Deadline She Didn't Know About"
  status: published
  summary: "A cleantech founder in Timmins, Ontario rebuilding herself after a failed first startup is ready for an accelerator. There is a BDC-affiliated Northern Ontario program with two open cohort spots, specifically mandated for cleantech companies in resource communities, currently accepting applications. She has never heard of it. The program coordinator has no mechanism to find her."
  characters:
    - "Josée — cleantech founder, mine water treatment startup, Timmins, ON"
    - "Luke — program coordinator, Northern Ontario startup accelerator, Sudbury"
  body: |
    ## Act A — The Invisible Deadline

    Every Canadian accelerator cohort has a close date. Most of them pass without the founders they were designed to serve knowing they existed.

    The Canadian accelerator landscape is large enough to be genuinely useful to remote founders — there are programs with Northern Ontario mandates, resource sector focuses, cleantech streams, and remote participation policies. But it is not organized enough to be discoverable. Unless you know to search NRC-IRAP's program browser, follow the right LinkedIn accounts, or have a mentor who knows the right coordinator, the programs that were built for you close without your application.

    The following is a fictional account of what changes when the discovery infrastructure exists.

    ---

    ## Act B — The Story

    **Josée** left a mine engineering position in Timmins three years ago to build a water treatment system for acid mine drainage in northern Ontario tailing ponds. Her first company failed eighteen months in — she had the technology but not the go-to-market infrastructure. She has spent a year rebuilding: refining the core process, finding a test site partnership with a small Ontario mine operator, and thinking carefully about what she would do differently.

    She is ready for an accelerator. She knows abstractly that programs exist. She has searched "cleantech accelerator Canada" and found three results — one is in Vancouver and in-person only, one has already closed, one is a US program.

    She registers on the DeeperPoint accelerator discovery platform. Her founder profile specifies: cleantech, mine water treatment, Northern Ontario location, 1 team member, pre-revenue (test site in place), seeking accelerator with cohort starting within 6 months, remote or Northern Ontario in-person, open to equity or fee-based programs.

    ---

    **Luke** coordinates a BDC-affiliated startup accelerator based in Sudbury. The program has an explicit geographic mandate: founders in Northern Ontario, with a cleantech or resource technology focus preferred. The current cohort has two open spots. The application window closes in three weeks.

    Luke's program has received thirty-one applications. Twenty-three came from the Greater Toronto Area. None came from Timmins. He is not certain any Timmins founders know the program exists.

    His program profile on the platform specifies: Northern Ontario geographic mandate, cleantech and resource technology focus, remote participation available, seed and pre-seed stage, equity-free grant model, cohort opening in 8 weeks.

    The platform matches Josée's founder profile against Luke's program profile. Geographic mandate: Northern Ontario confirmed. Sector: cleantech confirmed. Stage: pre-seed confirmed. Remote participation: available. Cohort timing: within Josée's 6-month window.

    ---

    Josée receives a match notification three weeks before the application deadline. The notification includes the program's selection criteria, cohort format, and a pre-qualification link.

    She submits her application ten days later. It is the most thoroughly prepared application the program coordinator has received for two cohort cycles — she used the readiness assessment tool.

    Luke reviews her application. He calls her within forty-eight hours. Josée receives her acceptance letter before the close date.

    She completes the accelerator from Timmins, via video, with one mandatory in-person week in Sudbury. Her test site partnership converts to a paid pilot during the program. She receives a $30,000 BDC grant through the accelerator.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The program existed. Josée was exactly the founder it was designed for. It was in her province. It had remote participation. It offered an equity-free grant. The application window was open for eight weeks.

    She didn't know it existed.

    [Thin market infrastructure](../../thin-markets.html) is not a radical intervention in the startup program ecosystem. It is a structurally simple one: make the program findable to the founder it was built for, and make it findable before the deadline rather than after.

    *Characters are fictional. The program landscape — BDC-affiliated Northern Ontario accelerators, cleantech grant programs, NRC-IRAP partnerships — reflects real Canadian startup program infrastructure. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
