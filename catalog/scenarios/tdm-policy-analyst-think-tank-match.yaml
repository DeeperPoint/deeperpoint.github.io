    recurring: true

  - title: "Policy Knowledge Management Archive Integration"
    type: commerce-extension
    revenue_model: "Annual knowledge archive integration subscription per policy organization
      ($2,000–6,000/year; converts the organization's historical policy research, briefing
      note library, and analytical memo archive into a semantic knowledge base that
      enhances future job profile quality and serves as an institutional knowledge management
      resource independent of hiring activity)."
    strategic_logic: "The employer document corpus that powers rich-profile matching —
      the exemplary memos, briefing notes, and research reports uploaded to define the job
      profile — is also an institutional knowledge asset. An archive integration service
      that maintains this corpus as a persistent, searchable organizational knowledge base
      creates value for the organization's analytical team between hiring cycles while
      ensuring that the employer's job profile quality improves continuously as new
      high-quality work product is added to the institutional archive."
    recurring: true

story:
  title: "The Memo That Found Its Author"
  status: draft
  blog_slug: ""
  characters:
    - "Elena - Research Director, housing policy think tank, Ottawa"
    - "James - policy analyst, MA economics, housing finance specialty, recently completed a 2-year federal government term, Halifax"
  summary: "An Ottawa housing policy think tank whose previous senior analyst produced
    briefing notes that defined how the sector understood the housing affordability crisis
    finds a successor by uploading those exemplary memos to a rich-profile platform, which
    matches a Halifax analyst whose published housing finance analysis demonstrates the
    same evidence integration approach — a match no keyword search of 'housing policy'
    resumes would have found."
  body: |
    ## Act A - The Market Structure

    Policy writing quality is not a credential. It is a practice that develops through
    specific combinations of domain knowledge, institutional experience, and analytical
    habit. The practice is visible in output and invisible in a CV. A think tank whose
    research has influenced federal housing policy has achieved that influence because
    specific analysts on its team wrote in a register that senior officials read — a
    register that integrates empirical evidence with policy instrument analysis, that
    quantifies uncertainty honestly, that frames recommendations in the decision context
    of the intended reader rather than the analytical context of the author. That register
    is not taught in any MPP program. It is developed in practice and demonstrated in work.

    The hiring process for a policy analyst role that requires this practice is forced into
    a paradox: it needs to evaluate the candidate's analytical practice before hiring them,
    but the evaluation tools it has — credential review, interview, generic writing sample
    — do not provide the information required to make the evaluation. The informal hiring
    norm in policy research circles — 'hire someone whose work you know, or hire through
    trusted peer referral' — is an attempt to solve this information problem through
    relationship networks. It systematically excludes the equally skilled analyst who is
    not in the network.

    ---

    ## Act B - The Story

    **Elena** directs research at a housing policy think tank whose analytical output
    has been cited in three federal housing strategy documents. The think tank's influence
    derives largely from the briefing note quality that her previous senior analyst produced
    over four years — memos that restructured how the sector understood the relationship
    between rental supply constraints and ownership affordability. That analyst left for
    a Deputy Minister's office. Elena needed a replacement who could write at the same
    level on housing finance mechanisms — the specific domain where the previous analyst's
    work had been most influential.

    Elena posted the position through standard channels: an academic listserv, LinkedIn,
    and a policy sector association newsletter. Forty-two applications arrived. Twenty-eight
    had MPP or equivalent credentials. Twelve listed housing-related experience. Four were
    interview-worthy. None of the four wrote in the analytical register Elena needed. Their
    interviews were technically competent. Their writing samples were adequate. None of
    them wrote like someone whose briefing note a Deputy Minister would annotate and keep.

    Elena uploaded five of her previous analyst's best memos — anonymized — to the rich-
    profile platform alongside the job description. The platform indexed the document corpus:
    the evidence integration approach, the policy instrument vocabulary, the uncertainty
    quantification methodology, the recommendation framing conventions the memos demonstrated.

    **James** had spent two years as an economist in a federal housing policy branch under
    a term appointment, and before that completed an MA thesis on rental market supply
    elasticity that had been cited in three journal articles. His profile on the platform
    included his resume, his anonymized chapter on housing finance mechanisms from a policy
    brief he had co-authored for the federal branch (with disclosure permission), a blog
    post he had written on the relationship between CMHC mortgage insurance parameters and
    first-time buyer leverage constraints, and a conference presentation on secondary suite
    intensification as a rental supply mechanism. He had applied to Elena's think tank
    through LinkedIn. His application had been one of the forty-two.

    The platform's semantic matching identified James's document corpus as the closest
    match to Elena's exemplar memos — not because 'housing finance' appeared in both, but
    because the evidence integration approach in his blog post and the policy instrument
    framing in his conference presentation matched the analytical conventions documented
    in the exemplar memos. Elena received a match explanation that identified three specific
    analytical parallels between James's work and her previous analyst's exemplar memos.
    She went back to his LinkedIn application, which she had filtered out at the credential
    review stage because his degree was economics rather than public policy. She read his
    blog post. She understood immediately. She contacted him that day.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    James's analytical practice was the match Elena needed. The evidence of the match
    was in documents he had produced and documents her previous analyst had produced.
    Both sets of documents were digitally available. No part of the standard hiring
    infrastructure — the job post, the credential filter, the LinkedIn application review —
    had any mechanism to semantically compare them and find the match.

    Elena's informal network would have found someone whose work she knew directly, or
    someone referred by a colleague whose analytical judgment she trusted. That network
    would not have reached a federal term economist in Halifax whose blog post was the
    clearest public demonstration of the analytical practice her think tank needed.

    The platform found the match that the network could not reach and the credential filter
    could not see.

    *Characters are fictional. Policy analyst hiring practices, the role of informal
    networks in policy sector recruitment, and the analytical register requirements
    of high-influence policy briefing are factual domains.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
