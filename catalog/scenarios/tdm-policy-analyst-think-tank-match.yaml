market_example:
  summary: "Think tanks, policy NGOs, and government research offices seeking policy analysts
    need candidates whose analytical voice, argumentation style, and policy domain expertise
    match their institutional approach — qualities that a resume cannot signal and a job
    description cannot specify. A rich-profile platform where employers upload exemplary
    policy memos and candidates upload their actual work product enables semantic matching
    on the thing that matters: how the analyst thinks."
  problem: "Policy analysis is a craft. The analyst who can produce a briefing note that
    a senior minister reads before a cabinet meeting writes differently — structures evidence
    differently, weights uncertainty differently, frames recommendations differently — from
    the analyst who produces competent academic literature reviews. Both may hold the same
    MPP or MA in public policy. Both may list identical credentials on a standard resume.
    The difference between them is visible in their work product, and it is the difference
    that determines whether a think tank's research output influences policy debate or
    accumulates in a document library. Organizations hiring policy analysts face a thin
    market with a deep matching problem: the candidate pool for a specialized policy role —
    trade policy, housing policy, Indigenous economic development policy, climate finance
    policy — is small, and the credential filter (MPP + relevant field experience) is
    insufficient to identify whether the candidate thinks in the analytical register the
    organization needs. What organizations actually need to evaluate is a work product match:
    does the candidate's writing demonstrate the same level of evidence integration, the
    same policy instrument literacy, the same institutional audience awareness as the
    exemplary memos that defined the role's best historical performance? The current hiring
    process tries to proxy this through writing sample requests — but writing samples are
    solicited late in the process, evaluated subjectively, and rarely matched against
    the actual work product standard of the role. The rich-profile matching model changes
    the entire dynamic: the employer uploads exemplary memos and briefing notes from
    high-performing predecessors alongside the job description; the candidate uploads
    their published work, policy memos they authored, blog articles, academic papers,
    conference presentations, and any other documents that represent their analytical
    practice. The semantic matching engine operates across the full corpus, identifying
    candidates whose analytical work product most closely matches the organization's
    documented work product standard."
  dominant_forces:
    - "Policy analytical competence is domain- and register-specific in ways that credentials
      cannot signal: a candidate with the right academic training in the wrong policy domain,
      or with the right domain knowledge but in an academic register incompatible with the
      organization's policy-facing output style, will underperform in the role regardless of
      their qualifications — a mismatch that is visible in work product and invisible in a resume."
    - "The policy analyst talent market is geographically and institutionally thin in Canada:
      the population of experienced analysts with specific domain expertise (housing finance
      policy, Indigenous resource revenue policy, climate transition industrial policy) is
      small, dispersed across academia, government, NGOs, and think tanks, and not actively
      visible in standard job markets where they are employed or consulting rather than
      posting resumes."
    - "Policy organizations' hiring decisions are frequently made on informal network
      referrals rather than open competition — not from preference for closed hiring, but
      because the formal hiring process (job description → resume filter → interview) fails
      to surface the analytical match that the informal network provides through reputation
      and familiarity with the candidate's actual work. A rich-profile system systematizes
      what the informal referral network currently does informally."
  deeperpoint_fit: "KnowledgeSlot encodes the policy domain taxonomy across Canadian
    federal and provincial policy areas — housing, trade, Indigenous economic development,
    climate and energy transition, social policy, fiscal policy — and the analytical register
    vocabulary that distinguishes policy-facing briefing note style from academic research
    style. CoSolvent's semantic matching operates across both the employer's document corpus
    (exemplary memos, briefing notes, research reports) and the candidate's document corpus
    (published work, policy memos, academic papers, blog analyses, presentations), identifying
    candidates whose analytical approach, evidence integration, and policy domain vocabulary
    match the organization's documented work product standard. The Generative Match Story
    explains the match in analytical terms: 'this candidate's approach to synthesizing
    conflicting evidence in their housing policy brief matches the evidence integration
    approach your organization demonstrated in [exemplar document].'"
  economic_upside: "Canada's policy research sector — federal and provincial government
    research offices, think tanks, policy-focused NGOs, and advocacy organizations —
    employs an estimated 15,000–25,000 policy analysts, with annual hiring needs of
    2,000–4,000 positions. The specialized domain subset — positions requiring specific
    policy domain expertise beyond general analytical training — represents an estimated
    500–1,000 thin-market placements annually where standard job board matching fails.
    At average employer subscription values of $1,500–4,000 per active job profile, the
    platform generates $750K–4M annually in policy sector employer subscriptions alone,
    with cross-sector scaling to corporate government relations, consulting, and legal
    policy practices."

