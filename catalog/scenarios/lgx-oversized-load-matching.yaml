market_example:
  summary: "A mining equipment dealer in Timmins needs to move a 72-tonne haul truck from a suspended mine to a buyer in Red Lake — a move that requires a specific multi-axle lowbed deck configuration, a pilot car service, MNR road use authorization, and a carrier licensed for Class 7 oversized loads in two jurisdictions. No load board surfaces this combination."
  problem: "Oversized and overweight transport — equipment exceeding 2.6 metres wide, 4.15 metres high, or 63,500 kg gross — requires carriers with specific permit licenses, specialized equipment (extended lowbeds, multi-axle decks, hydraulic trailer systems), and route-specific regulatory clearances that vary by province, season, and road authority. A shipper moving a mining haul truck, a wind turbine tower section, or an industrial transformer cannot find a qualified carrier through any conventional freight platform. Permit carriers don't advertise through general load boards; their capacity is known only through industry relationships. The shipper typically calls a handful of known carriers, all of whom may be committed, before reaching a qualified option — a search process that can take days while the equipment is idle, a crane is holding, or a project schedule is bleeding cost."
  dominant_forces:
    - "Equipment specificity — oversized moves require exact deck configurations, axle counts, and weight ratings that vary by load; no general directory captures this"
    - "Regulatory complexity — provincial permits, MNR road use authorizations, utility company pre-clearance, and seasonal load restrictions create a compliance maze specific to each move"
    - "Opacity — permit carrier capacity and scheduling is invisible to shippers without existing relationships"
    - "Deal complexity — each oversized move requires permit coordination, route planning, escort vehicle booking, and sometimes utility line lifts — coordination most shippers cannot manage"
    - "Temporal urgency — oversized moves are often tied to project schedules (crane availability, installation windows) where delay costs are measured in thousands of dollars per day"
  deeperpoint_fit: "KnowledgeSlot holds provincial permit authority requirements, seasonal road restriction databases, equipment classification tables (by load dimensions, weight, type), and utility clearance protocols — enabling the platform to determine whether a proposed move requires pilot cars, utility lifts, MTO Corridor Management System coordination, or special Ministry authorization before a carrier is even matched. Semantic matching aligns the load's physical and regulatory characteristics against the carrier's license class, equipment inventory, and regional permit relationship network. The Generative Match Story delivers a move feasibility brief — not just 'here is a carrier' but 'here is what this move requires, which permits are needed, and why this specific carrier's equipment and permit relationships match your load.'"
  economic_upside: "Ontario alone issues approximately 500,000 oversize/overweight permits annually through MTO, generating significant compliance revenue and supporting a specialty transport sector estimated at $3–5B nationally. A platform facilitating 10% of the permit-required transport matching market — at a 2% facilitation fee — would generate $60–$100M in annual platform revenue while reducing the search friction that adds 2–5 days to the average oversized move coordination timeline."

