story:
  title: The Sour Gas Window
  status: draft
  blog_slug: ""
  characters:
    - "Jordan - Operations Manager, junior Montney gas operator, Grande Prairie area"
    - "Carla - Fleet Manager, specialty coiled tubing and sour gas completion company, Red Deer"
  summary: "A junior Montney operator with a three-well fall completion program secures the
    only H2S-rated coiled tubing unit available in their area through a real-time service
    availability exchange, avoiding a six-week delay that would have pushed completions into
    freeze-up."
  body: |
    ## Act A - The Market Structure

    Completion season in the Montney is a controlled scramble. Every operator with a fall
    program is calling the same ten service companies in September, and the service companies
    are filling their calendars from the top down: the Tourmalines and ARC Resources of the
    world before anyone else. A junior operator with a three-well program represents three
    weeks of work. For a major service company managing forty concurrent commitments, three
    weeks of junior business does not move the needle.

    The structural problem compounds when specialty equipment is involved. Montney wells
    at depth in the Grizzly liquids-rich fairway carry H2S concentrations that require fully
    rated sour gas equipment—dedicated coiled tubing units with H2S-certified wellhead
    equipment, sour-gas-trained crews with certificate currency, and completion fluid systems
    formulated for high H2S environments. This equipment pool is small. In the fall season,
    it is fully committed by October 1st for companies with preferred supplier relationships.

    ---

    ## Act B - The Story

    **Jordan** has three Montney wells ready to complete. He called his regular coiled tubing
    company in August. All four of their H2S-rated units are committed through the end of
    October. The next company on his list: same answer. His third call: one unit available,
    but their crew's H2S tickets expired in July and they haven't scheduled retraining. He is
    staring at wells that will sit uncompleted if he doesn't secure a qualified crew within
    two weeks. After October 25th, road bans and rig release timing make fall completions
    unworkable until spring. A six-month delay on three producing wells.

    **Carla** manages a four-unit fleet in Red Deer. Three units are committed to a major
    operator program starting October 1st. Her fourth unit—fully H2S-rated, crew certified
    through January, completion fluid system compatible with Montney sour completions—has
    a two-week gap between a Duvernay program ending September 28th and a long-term contract
    starting November 12th. She has not advertised the gap because she normally fills these
    windows through her network, and she doesn't know Jordan exists.

    Jordan queries the platform: H2S-rated coiled tubing, Montney sour completions, Grande
    Prairie area, available October 1–14. Carla's fourth unit surfaces with H2S rating,
    crew certification status, completion fluid compatibility, and mobilization distance.
    The platform generates a three-well program proposal. Jordan's completions engineer
    reviews the unit specs and approves the fluid system compatibility. Carla mobilizes
    on October 2nd. All three wells are completed by October 16th. The freeze-up delay
    that would have deferred $12M in first-year production is avoided.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The specialty well services market is the arterial system of Canadian oil and gas production.
    When it fails—due to opaque availability and relationship-priority allocation—junior
    operators bear the cost in deferred production and spot premiums. DeeperPoint builds
    the transparent service availability exchange that gives every operator, not just the
    largest ones, a fair shot at the services they need.

    *Characters are fictional. Specialty well service scarcity during peak completion seasons
    is a recognized constraint in the Montney and Duvernay fairways.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
