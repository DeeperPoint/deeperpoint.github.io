market_example:
  summary: A real-time matching platform connecting junior and mid-tier Canadian oil and gas
    operators with specialty well service contractors—sour gas completions specialists, coiled
    tubing crews, high-pressure pumping fleets, and production chemical specialists—during
    peak completion seasons when these services are critically scarce and allocated through
    opaque relationship networks.
  problem: "The Montney, Duvernay, and Deep Basin plays of western Canada have driven a
    multi-year renaissance in Canadian natural gas and condensate production. Completion
    activity in these formations—horizontal multi-stage hydraulic fracturing, intensive
    coiled tubing intervention, and specialized wellbore chemistry programs—requires
    specialty services that are structurally scarce during peak drilling and completion
    seasons. The market failure is acute for junior operators: the largest operators—
    Tourmaline, ARC Resources, Pembina—have dedicated service company relationships built
    over years of continuous activity. When completion season peaks in the fall and spring,
    these preferred relationships are activated first, leaving junior and mid-tier operators
    scrambling for the remaining capacity through whatever informal connections their operations
    team has managed to build. Specialty services—high H2S-rated coiled tubing units, sour gas
    completion fluid systems, specialty production chemical programs specific to Montney
    condensate chemistry—are not interchangeable. A coiled tubing crew without sour gas
    training and equipment cannot work a 15% H2S well. A production chemical program designed
    for a light oil reservoir will not manage the wax and scale issues in a deep Duvernay
    condensate well. Matching on generic service category misses the specification requirements.
    Small operators routinely delay completions, accept inferior service quality, or pay
    significant spot premiums because they cannot discover or secure the right specialty
    contractor in time."
  dominant_forces:
    - "Peak completion seasons (fall and spring) create simultaneous demand surges for specialty
      well services that the relationship-priority allocation system cannot serve below the major
      operator tier—junior companies are systematically last in queue."
    - "Specialty well service requirements are highly specific to formation characteristics and
      wellbore conditions—sour gas rating, pressure ratings, fluid chemistry compatibility—
      but the service market has no structured capability registry that operators can query
      by these technical parameters."
    - "Completion delays cost junior operators $50,000–$200,000 per deferred well-day in lost
      production and carrying costs, creating urgent economic pressure that the spot market
      exploits through premium pricing."
  deeperpoint_fit: "CommonContext encodes the well service specification framework: completion
    fluid system compatibility by formation type (Montney, Duvernay, Deep Basin), H2S rating
    requirements by wellbore condition classification, coiled tubing unit specifications by
    wellbore geometry, and production chemical program requirements by fluid chemistry profile.
    CoSolvent matches operator well programs against service contractor profiles built from
    equipment specifications, H2S certification status, formation experience, and real-time
    crew availability."
  economic_upside: "Canadian natural gas and condensate completion activity exceeds 2,500 wells
    per year. A 5% improvement in specialty service matching efficiency—reducing completion
    delays and spot-market premiums—represents $250–500M annually in operator cost savings.
    Platform revenue via subscription for service companies and per-well booking transaction fees."
