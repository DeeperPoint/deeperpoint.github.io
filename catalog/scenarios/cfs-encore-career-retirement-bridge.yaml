      tool creates direct consumer value that converts platform visitors into matched
      advisor clients while providing advisors a shared computational infrastructure
      for the integration analysis that is currently done in separate spreadsheet models."
    recurring: true

  - title: "Small Business Formation Services Facilitation"
    type: commerce-extension
    revenue_model: "Business incorporation facilitation coordination fee connecting encore
      career clients to matched corporate lawyers and accountants for business formation
      ($500–1,500 per facilitated incorporation); HST registration and CRA account setup
