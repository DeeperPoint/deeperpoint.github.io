market_example:
  summary: "Canadians aged 55–70 who want to launch businesses, consult independently,
    or transition to purpose-driven part-time work face a financial planning problem that
    straddles retirement planning and startup advisory — two specialties that rarely
    coexist in one advisor. A matching platform connects encore career planners with
    the small number of financial planners who specialize in the financial architecture
    of second-act professional transitions."
  problem: "The binary model of retirement — full-time work followed by full-time leisure —
    no longer describes the trajectory of a significant portion of Canadians aged 55–70.
    Many are transitioning to encore careers: consulting practices built on their professional
    expertise, social enterprises, small businesses, portfolio board work, or hybrid
    part-time employed and self-employed arrangements. These transitions create financial
    planning complexity that does not fit neatly into either the retirement planning or
    the small business planning advisor categories. The encore career planner needs advice
    on: when to begin drawing CPP (the answer changes when the client has earned income
    from self-employment, which generates additional CPP contributions and affects the
    post-retirement benefit calculation); how to structure a consulting practice for tax
    efficiency while preserving RRSP room and TFSA contribution capacity; whether to
    incorporate and pay salary or dividends in a way that interacts optimally with their
    pension income, CPP timing, and OAS eligibility; how to manage a phased RRSP drawdown
    that funds a business startup period without triggering OAS clawback in later years;
    how to structure business income to maintain RRSP contribution room during income-
    generating years of the encore career; and how to plan business succession or
    wind-down that aligns with the client's eventual full retirement. Standard retirement
    planners are not trained in small business tax structure or startup financial planning.
    Standard startup advisors know nothing about CPP post-retirement benefit calculations
    or OAS clawback thresholds. The advisor who holds both domains simultaneously — and
    has worked enough encore career clients to have developed methodology for the integration —
    is rare. They are findable through accounting firm referrals and word-of-mouth from
    clients who have completed the transition, but not through any structured discovery
    mechanism."
  dominant_forces:
    - "Encore career financial planning requires simultaneously optimizing registered asset
      drawdown strategy, government benefit timing, self-employment tax structure, and
      business financial planning in an integrated framework that spans two advisory domains
      that have no established collaboration infrastructure — creating a planning gap that
      most advisors cannot bridge individually."
    - "The encore career population is growing rapidly: an estimated 40% of Canadians aged
      55–64 who report planned retirement within five years also report intention to do
      some form of self-employment or consulting work — a planning need that is invisible
      to the retirement advisory market because it does not look like a conventional
      retirement client."
    - "The financial consequences of uncoordinated encore career planning are substantial
      and often irreversible: a client who begins CPP at 65 without modelling the post-
      retirement benefit effect of continued self-employment contributions, or who accumulates
      RRSP assets during high-income encore years without a drawdown strategy for the
      transition to full retirement, locks in suboptimal tax outcomes that cannot be
      corrected after the fact."
  deeperpoint_fit: "CommonContext encodes the encore career financial planning specialist
    profile: CFP practitioners with documented encore and phased retirement client experience,
    small business tax structure competence (incorporation, salary vs. dividend optimization,
    HST registration, business expense planning), and CPP post-retirement benefit calculation
    methodology. CoSolvent matches clients by their planned encore activity type (consulting,
    small business, portfolio work, social enterprise), existing asset structure (pension,
    RRSP, TFSA, non-registered), business revenue projection, and target full-retirement
    timeline against advisors whose competence profile spans the required domains."
  economic_upside: "The Canadian encore career market represents an estimated 1.5–2.5 million
    people aged 55–70 who are in active planning for a professional transition that is
    neither full retirement nor continuation of their current career. At average advisory
    engagement values of $3,500–8,000 (comprehensive encore career financial plan plus
    annual review), the addressable market is $5.25–20B in annual advisory services. A
    platform connecting 15,000 encore career planners annually to specialist advisors
    generates $52–120M in facilitated advisory revenue."

