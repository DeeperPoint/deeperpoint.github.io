      business concept, the incorporated structure recommendation, and the tax objectives.
      Extending into business formation service facilitation converts a planning match into
      a business formation commerce relationship whose value substantially exceeds the
      planning fee."
    recurring: false

  - title: "Encore Career Peer Learning Community Subscription"
    type: commerce-extension
    revenue_model: "Annual encore career peer community subscription ($150–400/year;
      includes facilitated peer group access organized by encore career type, monthly
      expert sessions on encore career financial topics, and a community knowledge base
      of encore career planning case studies); employer pre-retirement program license
      ($5,000–20,000/year per employer for employee access)."
    strategic_logic: "Canadians planning encore careers benefit from peer connection with
      others who have already navigated the transition — not just professional advice, but
      the experiential knowledge of people who built consulting practices, launched social
      enterprises, or structured phased retirement arrangements. A peer community organized
      by encore career type creates network value that the financial planning match initiates
      but does not fully deliver, creating recurring subscription revenue from members long
      after the initial advisor match."
    recurring: true

story:
  title: "The Business Plan Nobody Knew to Make"
  status: draft
  blog_slug: ""
  characters:
    - "Gordon - former VP Engineering, age 61, planning an independent project management consultancy, Calgary"
    - "Fatima - CFP with encore career and phased retirement specialty, Edmonton"
  summary: "A Calgary VP Engineering who plans to retire at 62 and immediately launch an
    independent project management consultancy discovers through an encore career financial
    specialist that his plan to draw CPP at 65 and take salary from his consulting
    corporation simultaneously is one of the most tax-inefficient structures possible —
    and that a restructured approach increases his after-tax income by $28,000 annually
    during the first decade of his encore career."
  body: |
    ## Act A - The Market Structure

    Canadians who plan to leave employment and begin self-employment face a planning
    transition that looks, from the outside, like a retirement. They are leaving a
    job. They have registered assets. They are asking questions about CPP. Their financial
    advisor puts them in the retirement planning file.

    But the financial structure of an encore career is not a retirement. It generates
    earned income — which creates RRSP contribution room, CPP post-retirement contributions,
    and potentially HST registration obligations. It involves a business entity — which
    creates decisions about incorporation, salary versus dividend, retained earnings, and
    business expense deductibility. It involves a transition period during which registered
    assets may be drawn down to fund low-income startup years — and then a second transition
    to full retirement when the encore career winds down. Each of these decisions interacts
    with the others. The retirement advisor models the registered assets. The accountant
    handles the corporation. Neither models the integration. The client pays the tax cost
    of uncoordinated advice.

    ---

    ## Act B - The Story

    **Gordon** spent twenty years at a Calgary energy company, the last seven as VP Engineering.
    He has a defined contribution pension plan valued at $720,000, $380,000 in RRSP, $95,000
    in TFSA, and an expectation of CPP at approximately $12,000 per year at 65. His plan
    was to retire from the corporation at 62, take six months off, and then build a project
    management consulting practice drawing on his energy sector expertise. He expected to
    earn $120,000–180,000 annually in consulting fees for eight to ten years. He brought
    this plan to his financial advisor, who confirmed that the registered assets were well-
    positioned for the retirement phase and suggested taking CPP at 65 alongside consulting
    income. He brought it to his accountant, who suggested incorporating the consulting
    practice to defer corporate tax on retained earnings. Neither had worked through the
    interaction between the two pieces.

    **Fatima** has spent seven years building a practice specifically around encore career
    and phased retirement financial planning. Her client base is almost entirely Canadians
    aged 58–68 who are transitioning from employment to self-employment. The first thing
    she models for every new encore client is the CPP post-retirement benefit: if a client
    takes CPP at 65 while earning self-employment income that generates CPP contributions,
    each year of contribution generates a modest additional benefit — and the interaction
    with the salary-versus-dividend decision in an incorporated consulting practice determines
    whether self-employment income generates CPP contributions at all. The second thing she
    models is the registered asset drawdown: if Gordon can generate enough RRSP deductions
    during his high-income consulting years, he may reduce the registered asset balance enough
    to eliminate OAS clawback exposure in his full retirement years.

    The integrated analysis — CPP post-retirement benefit timing, incorporated salary
    optimization for CPP contribution, RRSP management during the encore income years,
    transition to full retirement drawdown — is not available from either Gordon's financial
    advisor or his accountant individually. Fatima assembles it. The restructured plan
    increases Gordon's projected after-tax income by $28,000 per year during his consulting
    decade and eliminates his projected OAS clawback exposure entirely.

    Gordon found Fatima through the specialist platform after reading a provincial energy
    industry retiree newsletter that mentioned encore career financial planning as a
    distinct advisory category. His financial advisor had never mentioned the category existed.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Gordon's situation is not unusual. It is the standard condition of the educated, financially
    literate professional who plans an encore career with two good advisors who do not
    communicate with each other about the integration. The planning gap is not created by
    bad advice. It is created by the absence of a specialist who bridges the two advisory
    domains. That specialist exists — in Calgary, in Edmonton, in Toronto — but has no
    discovery mechanism that reaches the population of encore career planners who need
    integration before they make the decisions that cannot be reversed.

    *Characters are fictional. CPP post-retirement benefit calculation, RRSP contribution room
    under self-employment income, and OAS clawback thresholds are factual elements of Canadian
    encore career financial planning. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
