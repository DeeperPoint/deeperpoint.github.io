market_example:
  summary: "Top-tier Canadian youth athletes in hockey, soccer, basketball, and volleyball cannot efficiently find development programs and university programs that fit their profile, while recruiting coordinators miss genuinely appropriate candidates outside their existing network."
  problem: "Elite youth athletes across Canada cannot easily discover which development programs, prep academies, or university athletic programs are the best match for their profile. Meanwhile, recruiting coordinators sift through hundreds of unqualified prospects while missing candidates who are not embedded in well-resourced regional networks. Matching happens through fragmented scouting systems, personal connections, and showcase circuits — mechanisms that systematically favour athletes in hockey-centric markets and major urban centres. Talented athletes in smaller cities and rural communities are effectively invisible to national programs."
  dominant_forces:
    - "Opacity — athlete performance data is scattered across team records, coach evaluations, and local tournament results; no standardized discovery mechanism exists for programs that have not directly scouted an athlete"
    - "Geographic distance — elite programs concentrate in major urban centres; talented athletes in smaller cities and rural communities are invisible to national recruiters"
    - "Offering complexity — each athlete is unique across athletic metrics, academic standing, position-specific skills, coachability indicators, graduation year, eligibility status, and financial aid eligibility"
    - "Cognitive overload — recruiting coordinators at mid-major programs cannot efficiently evaluate large applicant pools with the nuance required"
    - "Information asymmetry — families invest heavily in showcases without knowing which scouts attend or what they are looking for; programs do not reveal their recruitment priorities or remaining roster needs"
  deeperpoint_fit: "Semantic matching encodes athlete profiles (skill metrics, academic standing, position, graduation year, preferred geography) against program needs (roster gaps, budget, academic requirements, playing system). The trusted intermediary protocol allows families to share detailed athlete data confidentially while programs share roster priorities without publicly disclosing strategic intentions. KnowledgeSlot curates U SPORTS, NCAA, and CCAA eligibility rules, scholarship rules by sport and jurisdiction, and transfer regulations. Anticipatory matching proactively surfaces athletes to newly eligible programs before recruitment windows close. The three-layer architecture protects sensitive family financial information while enabling aid-eligibility matching."
  economic_upside: "Every year, hundreds of elite Canadian youth athletes miss meaningful development opportunities because they are not discovered. Better matching increases scholarship placement rates, reduces athlete and family investment in misdirected showcase circuits, and strengthens the development pipelines that produce Canada's international-calibre teams. For mid-major university programs, better recruitment matching reduces roster gaps and coaching hours wasted on unqualified prospects."

