market_example:
  summary: "3 million Canadians have a rare disease. Most wait years for a correct diagnosis, then face two simultaneous searches: a Canadian physician with real expertise in their specific condition, and another patient with the same diagnosis willing to share hard-won coping experience. Both searches require only a diagnosis name — no clinical records — but no matching infrastructure exists."
  problem: "A Canadian patient who receives a rare disease diagnosis typically does so after a protracted diagnostic odyssey averaging four years. When the diagnosis arrives, so does a different problem: their diagnosing physician is often a specialist who has seen the condition one to three times, is not a specialist in long-term management, and has limited guidance to offer on the disease course, treatment options, or emerging clinical trials. The diagnosis name is often the patient's most valuable search asset, and the first resource they reach is often an American patient organization whose clinical references and drug availability information do not translate to the Canadian system. Finding a Canadian physician who has managed ten or more patients with the condition — rare but real — requires navigating a specialist directory without a reliable specialty tag for conditions that often span multiple specialties. Finding another Canadian with the same diagnosis who is willing to talk is almost entirely word-of-mouth. The Canadian Organization for Rare Disorders (CORD) advocates nationally but does not operate a patient-to-patient or patient-to-specialist matching service. Many disease-specific patient organizations exist only for the highest-prevalence rare diseases; the long tail of conditions affecting fewer than 500 Canadians has no organized patient community at all."
  dominant_forces:
    - "Extreme demand fragmentation — 7,000+ conditions mean that even a nationally aggregated platform may have only a few dozen patients with any given rare disease; the market will never achieve critical mass through conventional means"
    - "Specialist scarcity and invisibility — Canadian physicians with genuine rare disease expertise rarely have a formal specialty designation for it; a metabolic disease specialist who has managed twelve patients with a specific lysosomal storage disorder is virtually undiscoverable from outside their hospital network"
    - "Consent-based disclosure model — patients voluntarily share their diagnosis name to find matches; no clinical data sharing is involved or required"
    - "Diagnostic translation — patients who receive a diagnosis in French-language health systems and need to access English-language clinical resources (or vice versa) face additional barriers that a bilingual matching infrastructure can reduce"
    - "Clinical trial access gap — Canadian rare disease patients often do not learn about relevant clinical trials because their specialist is not connected to the trial network and the patient cannot navigate the trial registry independently"
  deeperpoint_fit: "MarketForge operates as a voluntary matching registry indexed on diagnosis name (including synonyms and ORPHA numbers for technical precision). Patients create a profile disclosing only their diagnosis name, province, and optionally their language, age range, and matching preferences. The system surfaces available peer companions, Canadian specialists who have registered their rare disease patient population experience, and patient organizations (Canadian or international) relevant to the condition. A clinical trial alert service notifies matched patients when a trial opens in Canada for their condition. The platform imposes no clinical data sharing — it functions as a structured discovery layer on top of voluntary disclosure."
  economic_upside: "Canada's national rare disease strategy (launched 2023) allocates $1.5 billion over ten years for rare disease drug access, but the matching problem for patients who don't yet know their specialist options and peer community is not addressed by drug funding. A matching platform operated by CORD or a consortium of disease-specific foundations, with support from provincial health technology offices, operates at a fraction of that investment. The downstream value — reduced diagnostic odyssey duration, earlier specialist engagement, improved clinical trial enrolment — is measurable and fundable through CIHR patient-oriented research grants."

