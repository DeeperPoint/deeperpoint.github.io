story:
  title: "Nineteen Patients in Seven Years"
  status: draft
  blog_slug: ""
  characters:
    - "Gabriel — 38-year-old software developer in Halifax, diagnosed with a rare mitochondrial disorder after a four-year diagnostic odyssey; his diagnosing neurologist has seen two patients with the condition"
    - "Dr. Fatima Osei — metabolic neurologist at Toronto Western; has managed nineteen patients with mitochondrial disorders; registered on the platform with her rare disease population expertise"
    - "Yuki — patient peer companion in Winnipeg; same diagnosis; two years further into disease management; listed on the platform as willing to connect"
  summary: "Gabriel has been diagnosed with a rare mitochondrial disorder. His neurologist has seen two cases. After four years of searching, the platform finds a Toronto specialist with nineteen patients and a Winnipeg peer who has lived with the same condition for two years longer and navigated the same practical decisions."
  body: |
    ## Act One: Two Cases

    Gabriel's neurologist in Halifax had delivered the diagnosis with genuine care and visible discomfort. She had seen
    two patients with this mitochondrial disorder in her career — one in residency, one six years ago at the Dalhousie
    neurology clinic. She had ordered the correct genetic panel and interpreted the results correctly. What she did not
    have was a treatment course, a prognosis calibrated to his phenotype, or a referral that she was confident in.

    "There's a metabolic neurology team at Toronto Western," she had said. "I can refer you, but I don't know their
    specific experience with your variant."

    He had tried the ORPHA number. He had searched the Canadian rare disease registry. He had found a Quebec patient
    organization whose website had not been updated in three years. He had joined an American Facebook group and received
    American drug pricing information and American trial listings that did not include Canadian sites.

    Four weeks after diagnosis, he knew the Latin name of his condition and almost nothing else.

    ---

    ## Act Two: The Nineteen

    The platform search took his ORPHA number and returned two match categories: confirmed Canadian specialists with
    registered patient experience, and peer companions willing to connect.

    Dr. Osei's profile listed mitochondrial spectrum disorders as her primary rare disease specialty and gave a patient
    volume indicator: 15–25 patients over career. She was listed as accepting referrals from outside Ontario.

    Gabriel shared the profile with his Halifax neurologist the following morning. The referral was written that afternoon.

    The peer companion listing was one match: Yuki, Winnipeg, same ORPHA number, two years into management, listed
    under "practical coping, career impact, exercise tolerance, fatigue management."

    They spoke by video call for ninety minutes that weekend. Yuki described the fatigue management protocol she had
    worked out with Dr. Osei — who was now also Gabriel's specialist — and the workplace accommodation framework she
    had negotiated under Ontario Human Rights guidelines, which applied in Nova Scotia as well.

    ---

    ## Act Three: The Trial Alert

    Three months later, Gabriel received a platform alert: a Phase II trial for his mitochondrial variant had opened a
    Canadian site at the Ottawa Hospital, with a Halifax satellite assessment option.

    He forwarded it to Dr. Osei. He was enrolled six weeks later.

    He had spent four years finding a diagnosis. He found his specialist, his peer, and his trial in eleven days.

    *Characters are fictional. The Canadian rare disease context, CORD's national mandate, and the ORPHA number
    classification system are real. [DeeperPoint](../../marketforge.html) is building the matching infrastructure
    this market requires.*
