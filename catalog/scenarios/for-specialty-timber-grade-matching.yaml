market_example:
  summary: "A furniture maker commissioning figured maple slabs, an architect specifying FSC-certified old-growth Douglas fir for a heritage restoration, or a guitar manufacturer sourcing quarter-sawn Sitka spruce cannot find the sawmill or woodlot owner whose cut matches their specification — while mills producing premium material have no efficient mechanism to reach the buyers who pay for it."
  problem: "The structural timber market is highly organized: commodity dimensional lumber flows through established distribution channels from large sawmills to building suppliers to contractors. The specialty timber market — figured wood, FSC-certified old-growth salvage, quarter-sawn cuts, specific species and grain profiles required for musical instrument making, high-end furniture, and architectural millwork — is a thin market served by personal reputation networks, mill visits, and occasional kijiji advertisements that cannot encode the specification detail that premium buyers require. A guitar manufacturer in Chilliwack sourcing Sitka spruce for soundboard production needs specific acoustic properties: tight, consistent grain count (minimum 10–12 annual rings per inch), no runout, no figure, from a specific regional elevation where slow growth produces the density the soundboard requires. A heritage restoration architect in Vancouver specifying Douglas fir for millwork in a 1910 mansion needs old-growth ring-tight clear fir that matches the original material — not the wide-grain second-growth fir that commodity channels supply. These specifications are not communicable in a standard lumber order. The sawmill that produces the matching material has no mechanism to signal its specific production to the buyer who will pay a premium for it."
  dominant_forces:
    - "Specification complexity — premium wood specifications combine species, grade, cut orientation (flat-sawn, quarter-sawn, rift-sawn), grain count, figure presence or absence, treatment history, and certification status in ways that standard lumber commodity terminology does not encode"
    - "Small lot size — premium timber buyers frequently want small lots (1–10 slabs, 500–2,000 board feet) that large sawmills cannot profitably process through their standard sales channels"
    - "Temporal mismatch — premium timber production is driven by specific harvesting opportunities (salvage after wind event, land clearing on private woodlot, blow-down recovery) that produce available material in unpredictable windows that buyers cannot anticipate"
    - "Geographic opacity — small-scale sawyers and woodlot operations producing premium specialty cuts are geographically dispersed across BC, Ontario, and Quebec without organized market presence"
    - "Trust and verification — premium wood buyers need to verify grain count, figure, moisture content, and defect profile before committing to a purchase; photos alone are insufficient for high-value specification wood"
  deeperpoint_fit: "Semantic matching encodes sawmill and producer profiles (species by provincial region, cut type and width capacity, certification status, current production and available inventory, specialty characteristics — figure type, grain density, acoustic properties — visual documentation of prior lots) against buyer demand signals (species, cut orientation, grain specification, figure presence, certification requirement, volume, timeline, budget per board foot). CommonContext encodes wood species acoustical and structural property vocabulary. The Generative Match Story helps buyers articulate specification requirements they know perceptually but struggle to describe."
  economic_upside: "Canadian specialty and premium wood products represent an estimated $200M–$400M in annual value above commodity lumber pricing. Guitar-grade Sitka spruce commands $15–$40 per board foot versus $2–$4 for commodity lumber. FSC-certified heritage-grade Douglas fir for architectural millwork sells at $8–$25 per board foot. Figured maple slabs for furniture command $300–$2,000 per slab. A platform connecting 500 specialty wood buyers to 200 specialty producers — each transacting 5–10 specialty lots per year at $2,000–$20,000 per lot — represents $5M–$100M in annual specialty timber transactions currently served by informal networks."

sponsor_opportunities:
  - title: "Specialty Timber Discovery and Matching Platform (SaaS)"
    type: saas
    revenue_model: "Annual producer/sawmill listing ($200–$600/year); buyer search subscription ($150–$400/year); per-transaction facilitation (2–4% of specialty timber sale)"
    strategic_logic: "The BC Wood Specialties Group, Ontario Wood WORKS!, the Canadian Hardwood Plywood and Veneer Association, and FSC Canada all have organized constituencies on both the producer and buyer sides of the specialty timber market. Platform distribution through these organizations reaches the organized specialty wood community at both production and procurement levels."
    recurring: true

  - title: "Specialty Timber Specification and Grading Documentation Service"
    type: managed-service
    revenue_model: "Per-lot specialty timber grading documentation for producer listing (grain count photography, moisture analysis documentation, figure assessment; $200–$500 per lot); buyer specification translation service ($100–$250 per purchase brief)"
    strategic_logic: "The gap between what a specialty wood buyer needs and what a producer can articulate without technical vocabulary support is the most consistent cause of failed premium timber transactions. A grading documentation service that produces standardized, photography-backed specification records for each specialty lot — grain count measurement, figure classification, moisture reading, defect map — gives buyers the technical evidence they need to commit to a remote purchase without a mill visit."
    recurring: false

  - title: "FSC and Sustainable Certification Support Service"
    type: managed-service
    revenue_model: "FSC small producer group certification support ($800–$2,500 per woodlot operation); Chain of Custody documentation for certified specialty timber sales ($150–$350 per transaction)"
    strategic_logic: "FSC certification for small woodlot operations is administratively onerous — the audit, documentation, and annual fee structure is designed for large industrial producers and creates a barrier that excludes the small-scale specialty timber producers whose material most needs certification for architectural and furniture markets. A group certification support service that aggregates small woodlot operations into FSC group certificates distributes the certification cost across multiple producers while enabling each to sell into FSC-requiring architectural and furniture markets."
    recurring: false

  - title: "Specialty Timber Inventory and Commerce Extension"
    type: commerce-extension
    revenue_model: "Specialty timber consignment and inventory management for producers without direct sales capability (15–20% consignment margin); slab photography, videography, and online gallery listing for furniture-grade material; specialty timber transport coordination for small lot shipping; platform earns commerce revenue from every specialty timber transaction it facilitates"
    strategic_logic: "Many specialty timber producers — small woodlot operators, portable sawmill owners — produce premium material but lack the time, digital presence, and shipping logistics to sell it directly to premium buyers. A consignment and gallery service that photographs slabs, lists them with full specification documentation, and manages transport coordination converts the producer's salvage and specialty production into a digital retail relationship with premium buyers across Canada — creating a recurring revenue stream from the timber inventory the platform facilitates."
    recurring: true

story:
  title: "The Guitar Tops"
  status: draft
  blog_slug: ""
  characters:
    - "Andre — production manager, boutique guitar manufacturer, Chilliwack BC; sourcing Sitka spruce guitar tops with consistent tight grain count for their classical and acoustic line"
    - "Glen — portable sawmill operator, Terrace BC; has processed 400 board feet of perfectly grained Sitka spruce salvaged from a wind event on Crown land, grain count averaging 14 rings per inch"
  summary: "A Chilliwack guitar manufacturer's annual sourcing trip to traditional Sitka spruce suppliers comes up short on tight-grain tops — while a Terrace portable sawmill operator has 400 board feet of perfectly-specced salvage Sitka sitting in his drying shed with no buyer."
  body: |
    ## Act A — The Acoustic Grain Problem

    Sitka spruce is the dominant soundboard wood for North American acoustic and classical guitar production. Its combination of stiffness-to-weight ratio, damping characteristics, and long-run consistent grain structure makes it the standard against which other soundboard woods are measured. But not all Sitka spruce is guitar-grade. The acoustic properties that make a soundboard work — stiffness without brittleness, consistent resonant response across the surface — are produced by slow growth. A Sitka spruce growing at high elevation on the BC coast, in the cool, wet conditions of the Terrace or Haida Gwaii coastal zone, lays down narrow annual rings. Ten rings per inch is the minimum for a functional soundboard. Fourteen or more rings per inch is exceptional material that commands premium prices from instrument makers.

    The Sitka spruce from a fast-growing second-growth coastal plantation — abundant in commodity lumber supply — grows at four to six rings per inch. It looks like the same species. It does not behave like the same species under acoustic excitation.

    Guitar manufacturers know this. They have established supplier relationships with specific producers who have historically supplied tight-grain material. These relationships are relationship-based, not market-based. When a supplier's production changes — a harvest area moves to faster-growing timber, a wind event affects the traditional supply area — the manufacturer's tight-grain supply dries up and there is no market mechanism to replace it.

    ---

    ## Act B — The Story

    **Andre's** company built 300 classical and acoustic guitars per year. Their Sitka spruce tops came from two suppliers: a sawmill in the Queen Charlotte Islands who had supplied them for fifteen years and a portable mill operator on Vancouver Island whose material had been reliable for eight. The Queen Charlotte supplier had retired. The Vancouver Island supplier's harvest area had moved to second-growth timber following a provincial tenure reallocation.

    Andre's sourcing trip covered four BC coastal sawmills. Three produced commodity spruce. One produced tight-grain material but at a volume too small for his production requirements. He returned from three weeks in BC with enough material for forty guitars.

    He needed material for 300.

    He listed a specification request on the platform: Sitka spruce, guitar soundboard grade, minimum 12 rings per inch, no runout, no figure, kiln or air-dry to 8% MC, BC Coastal origin preferred, minimum 200 board feet, quantity 400 board feet preferred.

    **Glen** had been operating a portable Woodmizer mill in the Terrace area for nine years. He milled salvage timber primarily — blow-down cedar and spruce from Crown land following wind events, private woodlot timber for local construction. The previous spring, a wind event on a Crown timber licence had knocked down a stand of old-growth Sitka spruce at approximately 900 metres elevation. He had salvage authorization. He had milled 420 board feet of tight-grain Sitka that averaged, when he counted the rings per his practice of checking every board, 13–15 rings per inch.

    He had sold 20 board feet to a local woodworker who made knife handles. The remaining 400 board feet were in his drying shed, air-drying toward 8% MC. He had listed them on kijiji for three months with no response — the buyers who would pay premium prices for this material were not searching kijiji.

    He registered on the platform at the recommendation of a BC Wood Specialties Group newsletter he had been receiving for a year without acting on.

    His profile: Sitka spruce, salvage Crown land, 900m elevation origin, ring count verified at 13–15 per inch (photography uploaded), air-drying to 8% MC, available in 6 weeks, 400 board feet, Terrace BC.

    Andre's specification request matched Glen's listing on all six technical criteria.

    ---

    The platform introduced them. Glen shipped 12 sample tops — six at maximum grain density, six at minimum — to Chilliwack at his cost. Andre's production team evaluated them over a week. The grain count was consistent. The acoustic tap-tone response was exceptional.

    Andre bought 380 board feet. Glen's drying shed was empty within two months of the match. His production from the following spring's salvage season was pre-sold before he milled it.

    Andre's classical line for that production year used tops that his production team rated among the best they had seen in a decade.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Glen's 400 board feet of old-growth salvage Sitka at 13–15 rings per inch was the best material Andre had sourced in five years. It was sitting 1,100 kilometres north of him in a drying shed in Terrace.

    The gap between them was not geographic. BC is not a large province for timber production. The gap was that Glen's material was listed on kijiji where acoustic-grade specialists did not search, and Andre's sourcing trips followed the supplier relationships he had built over fifteen years — relationships that were no longer producing the material he needed.

    [Thin market infrastructure](../../thin-markets.html) encodes the grain count, the elevation origin, the salvage certification, and the moisture content timeline as searchable attributes that a guitar manufacturer's specification brief can find at the moment his established suppliers fail — before the production shortfall forces a compromise that ends up in 40 guitars rather than 300.

    *Characters are fictional. Sitka spruce acoustic grade specifications, ring count requirements for guitar soundboard production, BC coastal Sitka spruce elevation-growth relationships, and BC Wood Specialties Group are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
