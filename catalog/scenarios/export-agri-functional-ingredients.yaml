market_example:
  summary: A specialized platform connecting Canadian producers of pulse proteins,
    oat beta-glucan, and specialty bio-ingredients with European and Asian food formulators
    and CPG companies.
  problem: Export Platform for Canadian High-Value Plant Proteins and Nutraceuticals
  dominant_forces:
  - Global shift towards plant-based and functional foods.
  - Canada is a leading producer of high-quality raw pulses but needs to export more
    value-added ingredients.
  - Food formulators have rigorous functional and nutritional spec requirements.
  deeperpoint_fit: Requires matching complex bio-chemical specifications with product
    formulation needs. High need for traceability, organic/kosher/halal certifications.
    Sample-to-scale purchasing cycle is highly structured.
  economic_upside: Shifts export value from bulk commodities to premium ingredients.
    Provides consistent, higher-margin international off-take for processors.
