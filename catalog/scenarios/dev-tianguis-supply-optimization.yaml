market_example:
  summary: "Mexico City's 1,500+ tianguis vendors and 50,000+ street food operators source produce individually from CEDA each pre-dawn, creating fragmented, inefficient procurement trips. A collective buying and delivery platform can dramatically reduce their sourcing cost while improving product freshness — without disrupting the informal commercial system that feeds 22 million people."
  problem: "Mexico City's tianguis (mobile street market) system is a remarkable pre-technology solution to last-mile food distribution — but its procurement model is deeply inefficient. Individual tianguis operators make individual pre-dawn trips to CEDA to buy their daily inventory, competing with thousands of other small buyers for the same produce at the same bodeguero stalls. They travel alone, buy in small quantities, pay individual prices, and return hours before their markets open — exhausted and with produce that has already been handled twice. A collective procurement platform — matching tianguis by product need, coordinating buying pools that qualify for wholesale pricing, and routing CEDA delivery to aggregation points — could cut sourcing cost by 15–30% while improving freshness and reducing the dangerous pre-dawn solo transit."
  dominant_forces:
    - "Scale fragmentation — Individual tianguis operators lack volume to negotiate wholesale pricing with CEDA bodegueros operating at 100+ tonne daily throughput"
    - "Discovery failure — Tianguis operators in adjacent neighborhoods do not know each other's product needs and cannot spontaneously form buying pools"
    - "Information asymmetry — Individual vendors cannot track CEDA price movements across multiple bodeguero stalls before committing to a purchase"
    - "Temporal urgency — All procurement must happen in the same pre-dawn window (2–5 AM), compressing the opportunity for any coordination"
    - "Trust deficit — Collective buying requires shared payment arrangements among vendors who have no established trust relationship beyond neighborhood acquaintance"
  deeperpoint_fit: "CoSolvent matches tianguis operators by product need profile (crops, quantities, quality grade, pickup neighborhood) and coordinates buying pools — groups of 5–15 operators who pool their daily order for a single bodeguero delivery or aggregation-point pickup. CommonContext tracks real-time CEDA price movements by crop and bodeguero, surfacing the best price-quality combinations for each pool's product list. A Telegram or WhatsApp-based order aggregation interface requires no special app: vendors submit their daily list by message, the platform groups compatible orders, and confirms the pool composition and delivery logistics before the first vendor would need to leave for CEDA."
  economic_upside: "Mexico City's 1,500+ active tianguis involve 50,000–80,000 vendors. Average daily procurement cost per vendor is estimated at 800–2,500 pesos. A 20% procurement cost reduction through collective buying represents $3–9M in annual vendor cost savings across the system. Platform revenue: per-pool coordination fee (50–100 pesos per pool delivery), CEDA bodeguero subscription for pre-organized bulk order access ($500–$2,000/month), and CDMX government urban food security program sponsorship."

