story:
  title: "The Pool That Beat the Dark"
  status: draft
  blog_slug: ""
  characters:
    - "Doña Carmen Ríos - tianguis fruit vendor, Coyoacán market rotation, Mexico City"
    - "Pedro García - tianguis vegetable vendor, same rotation circuit"
    - "Marcos Valdez - CEDA bodeguero, Pasillo 4 produce section"
  summary: "Doña Carmen and Pedro have worked adjacent stalls in the Coyoacán tianguis circuit for eight years. They have never coordinated their CEDA trips — until the platform shows them that their daily product lists are almost perfectly complementary and their combined order qualifies for a direct delivery that neither could afford alone."
  body: |
    ## Act A - The Market Structure

    The tianguis system that serves Mexico City's 22 million residents operates through 1,500+
    rotating street markets that appear in specific neighborhoods on specific days of the week.
    Each tianguis has regular vendors who follow the same circuit week after week, building
    neighborhood relationships that are the foundation of the system's resilience.

    But the supply side of this system is a daily chaos. Each vendor leaves for CEDA individually
    in the dark — 2 AM, 3 AM — navigates the market alone, buys from whichever bodeguero they
    know, and returns hours later to set up their stall. The process is physically exhausting,
    personally risky (pre-dawn solo transit in a megacity), and commercially inefficient.

    Adjacent vendors who need different produce buy separately at the same stalls, paying
    individual prices when they could be pooling orders, qualifying for volume pricing, and
    — if a delivery service were involved — not making the trip at all.

    ---

    ## Act B - The Story

    **Doña Carmen** sells fruit. Her daily CEDA list: 30 kg mangoes, 25 kg mamey, 15 kg
    guavas, 20 kg strawberries in season. She leaves at 2:30 AM three times a week.
    She is 58 years old.

    **Pedro** sells vegetables from the stall beside her: 40 kg tomatoes, 25 kg avocados,
    15 kg nopal, 10 kg chiles, 20 kg zucchini. He makes the same trip.

    They have worked beside each other since 2016. They have never coordinated a CEDA trip.
    There was no mechanism to do it — no shared order system, no delivery option that served
    the tianguis pickup locations, no way to know that their combined order of 200 kg would
    qualify for **Marcos Valdez**'s minimum wholesale delivery of 180 kg to a neighborhood
    aggregation point.

    The platform changes this. A tianguis cooperative coordinator in the Coyoacán circuit
    registers 14 vendors with the platform, collects their standard daily product lists, and
    runs the pool matching algorithm.

    The platform identifies that Carmen and Pedro's combined produce list — plus three other
    vendors in their circuit who need tomatoes, mangoes, and avocados — totals 420 kg of
    overlapping CEDA categories. It constructs a buying pool of five vendors, calculates the
    combined order for Marcos's bodega in Pasillo 4, and presents the pool to all five vendors
    via WhatsApp at 10 PM the night before.

    **Marcos**, who has a standing subscription with the platform, receives the organized order
    by 11 PM. His staff pre-pulls the order. At 3:30 AM, a platform-coordinated transport
    service delivers the assembled order to a Coyoacán neighborhood aggregation point —
    a security-controlled loading bay that the cooperative has arranged with a local business.

    Carmen and Pedro arrive at 4:30 AM. The produce is there. Pre-weighed. Tagged with
    each vendor's portion.

    Carmen does not get into her car until 4:00 AM. She is home by 5:30 instead of 7:00.
    Her produce has spent less time in transit. Her cost is 19% lower than her individual
    CEDA price because the pool order qualified for Marcos's wholesale tier.

    She is at her stall when the tianguis opens.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Carmen and Pedro are not strangers. They have worked two meters apart for eight years.
    They have never coordinated their CEDA trips because no mechanism existed to do it:
    no shared order platform, no pooled payment system, no delivery option matched to their
    logistics reality.

    The tianguis system feeds Mexico City because 50,000 small entrepreneurs absorb what a
    corporate distribution system would reject as uncommercially small. The platform does not
    replace that system. It makes it more efficient — reducing the procurement cost and physical
    burden that is slowly forcing aging tianguis operators out of the market.

    For Marcos in Pasillo 4, the pre-organized pool order means he knows his day's sales at
    midnight instead of guessing at 3 AM. His margins improve because he pre-pulls the right
    produce instead of scrambling to fill individual orders from bins that have been picked over
    by a hundred prior customers.

    The system continues. The participants are less exhausted and better paid. That is the
    whole goal.

    *Characters are fictional. Mexico City's tianguis system, CEDA operations, and bodeguero
    pricing dynamics are real. [DeeperPoint](../../marketforge.html) is building the
    infrastructure this story describes.*
