market_example:
  summary: "Most Canadian financial advisors are trained in accumulation — growing a portfolio
    over a working career. The reverse problem — converting savings into sustainable retirement
    income while managing sequence-of-returns risk, CPP and OAS timing, RRSP meltdown, and
    estate objectives — requires a specialist most Canadians cannot find. A matching platform
    connects Canadians approaching or entering retirement with the small pool of advisors
    who specialize in decumulation strategy."
  problem: "The Canadian financial advisory industry is structurally organized around
    accumulation: growing registered and non-registered assets over a working career.
    Training, compensation models (AUM fees that grow with portfolio growth), product
    sales incentives, and advisor marketing all orient toward the accumulation client.
    Decumulation — the practice of converting an accumulated asset base into a sustainable
    income stream that lasts a client's lifetime without depleting capital prematurely —
    is a fundamentally different discipline. It requires integrating CPP optimization
    (claiming at 60, 65, or 70 depending on health status and other income sources),
    OAS deferral analysis, RRSP meltdown strategies (deliberately drawing RRSP to defer
    RRIF conversion and reduce lifetime OAS clawback exposure), sequence-of-returns risk
    management (protecting against a market crash in the first five years of retirement
    that could permanently impair the portfolio), pension bridge strategies for early
    retirees, and estate objective integration (whether the client wants to die with
    maximum estate value or maximum lifetime income). Most financial advisors who served
    a client's accumulation phase adequately are not trained in decumulation strategy at
    this level of integration. They tend to recommend conservative asset allocation shifts
    and systematic withdrawal plans rather than the holistic income architecture that
    optimizes lifetime after-tax income, government benefit timing, and estate outcomes
    simultaneously. The specialist decumulation advisors who can execute this analysis —
    typically Certified Financial Planner professionals with additional retirement income
    specialist designations (RIPS, CSWP, MFA-P) — exist in small numbers and are not
    discoverable through the standard financial advisory referral process. Canadians
    approaching the transition point — typically 55–68, with accumulated savings of
    $500K–3M — make the most consequential financial decisions of their lives with advisors
    whose expertise ends at the accumulation phase."
  dominant_forces:
    - "Decumulation strategy requires integrating at least seven interdependent income
      and tax decisions — CPP timing, OAS timing, RRSP meltdown, RRIF conversion, pension
      bridge, asset drawdown sequencing, and estate objective — in a single optimization
      that most generalist advisors have never executed for a client and for which
      no standardized advisory product exists."
    - "The financial advisory compensation model creates a structural conflict: AUM-fee
      advisors are financially incentivized to retain assets under management rather
      than recommend annuitization, CPP deferral (which reduces portfolio drawdown pressure),
      or RRSP meltdown strategies (which temporarily reduce AUM). Genuine decumulation
      optimization requires an advisor whose fee structure does not conflict with the
      optimal strategy — typically a fee-only planner — a community that is small and
      not widely discoverable."
    - "The Canadian retirement transition market is growing at an accelerating rate as
      the leading edge of the Baby Boom generation passes 75 and the following cohort
      enters the 60–70 decumulation decision window — creating expanding demand for
      decumulation expertise precisely as the generation of advisors most familiar with
      the cohort's accumulation histories approaches their own retirement."
  deeperpoint_fit: "CommonContext encodes the decumulation specialist taxonomy: designation
    frameworks (CFP with RIPS, MFA-P, CSWP), fee structure models (fee-only versus AUM),
    CPP and OAS optimization methodologies, RRSP meltdown strategy frameworks, and pension
    bridge product knowledge by institutional provider. CoSolvent matches clients by
    asset structure (RRSP/TFSA balance ratio, pension vs. non-pension income sources,
    real estate equity, expected inheritance), health profile (affecting CPP timing
    analysis), and estate objectives against decumulation advisors with the specific
    competency profile required for the client's income architecture. The Generative Match
    Story explains why the client's accumulation advisor may not be the right person for
    the decumulation phase."
  economic_upside: "An estimated 4.5 million Canadians are in the 55–70 age bracket
    actively navigating or approaching the retirement income transition. The addressable
    market for specialist decumulation planning — clients with $500K–3M in accumulated
    assets who would measurably benefit from professional decumulation optimization —
    is estimated at 800,000–1.2 million Canadians, the majority of whom are currently
    receiving generalist accumulation-phase advice. Average lifetime income improvement
    from optimized decumulation strategy (CPP deferral, RRSP meltdown, OAS clawback
    management) is estimated at $40,000–150,000 per client. A platform connecting
    30,000 clients annually to decumulation specialists at average advisory engagement
    values of $3,000–8,000 generates $90–240M in facilitated annual advisory revenue."

