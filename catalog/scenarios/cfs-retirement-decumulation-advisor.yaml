    recurring: false

story:
  title: "The Advice That Was Never Wrong"
  status: draft
  blog_slug: ""
  characters:
    - "Robert - retired teacher, age 64, defined benefit pension plus $850K in RRSP and TFSA, Hamilton"
    - "Simone - fee-only financial planner, RIPS designation, decumulation specialist, Kitchener"
  summary: "A Hamilton retired teacher whose longtime advisor recommends taking CPP at 65
    and drawing his RRSP systematically discovers through a decumulation specialist that
    CPP deferral to 70 combined with an RRSP meltdown strategy would increase his after-tax
    lifetime income by over $130,000 and eliminate his OAS clawback exposure entirely."
  body: |
    ## Act A - The Market Structure

    Retirement income optimization is not intuitive. The conventional wisdom — take CPP
    at 65, draw your RRSP systematically, keep a balanced portfolio — is not wrong.
    It is simply not optimized. The optimization requires integrating decisions that are
    individually simple but collectively complex: deferring CPP to 70 increases the
    monthly benefit by 42%, but requires drawing other assets to cover the five years
    before the enhanced CPP begins; deliberately converting RRSP to income before RRIF
    conversion is mandated reduces the future RRIF minimum withdrawal that would trigger
    OAS clawback; spousal income splitting can reduce the effective tax rate on pension
    and RRIF income substantially; annuitizing a portion of the asset base eliminates
    longevity risk at the cost of flexibility. No single advisor credential guarantees
    competence in integrating all of these. A financial advisor who managed a client's
    accumulation phase skillfully may have never executed a decumulation optimization
    for a client with a defined benefit pension, a substantial RRSP, and an OAS clawback
    threshold concern.

    The client does not know what they do not know. The advisor's recommendation — the
    one they have given to dozens of similar clients — is not negligent. It is not the
    one that maximizes the client's lifetime after-tax income.

    ---

    ## Act B - The Story

    **Robert** retired from the Hamilton-Wentworth District School Board at 61 after
    thirty-two years of teaching. His defined benefit pension pays $48,500 annually,
    indexed to inflation. He accumulated $850,000 in registered and TFSA savings during
    his career. His financial advisor — who managed his accumulation for eighteen years —
    recommended taking CPP at 65 (approximately $9,200/year at his projected amount),
    shifting the portfolio to 50/50 equities and fixed income, and drawing RRSP income
    as needed supplementing his pension. The advice was competent. Robert was comfortable.

    Robert's sister mentioned a conversation she had with a financial planner at her
    accounting firm who specialized in decumulation for former public sector employees.
    Robert was not looking to replace his advisor. He booked a single consultation out
    of curiosity.

    **Simone** has worked exclusively with clients transitioning from accumulation to
    decumulation for eleven years. Seventy percent of her clients are former public sector
    employees with defined benefit pensions and substantial registered savings — exactly
    Robert's profile. Her first question when she sees a pension-plus-RRSP client is
    always whether CPP deferral has been modelled against an RRSP meltdown strategy.
    In Robert's case, the modelling reveals the following: deferring CPP to 70 produces
    an annual benefit of approximately $15,500 — $6,300 more per year for life, inflation-
    indexed. Funding the five years of deferred CPP by drawing his RRSP at $35,000 per
    year — deliberately melting it down before RRIF conversion — reduces his projected
    RRIF minimum withdrawals sufficiently that his total income in CPP years never triggers
    the OAS clawback threshold. The integrated strategy increases his after-tax lifetime
    income projection by $132,000 over the conventional approach.

    The match did not replace Robert's advisor. Simone produced a decumulation analysis
    that Robert brought to his advisor, who adjusted the withdrawal strategy accordingly.
    The platform connected Robert to the specialist who could run the analysis his
    generalist advisor had not been trained to perform.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Robert's advisor gave him the same advice he gives every similar client because he
    has never been introduced to a decumulation specialist who demonstrated what integrated
    optimization looks like. Simone's practice reaches a few hundred clients in Waterloo
    Region through accounting firm referrals. Hundreds of thousands of Canadians in
    Robert's situation — DB pension, substantial RRSP, OAS clawback range concern, no
    decumulation analysis ever completed — make suboptimal decisions not from lack of a
    good advisor, but from lack of the right specialist at the transition moment.

    Decumulation optimization is not withheld by anyone. It is simply not searchable.

    *Characters are fictional. CPP deferral mathematics, RRSP meltdown strategy, and OAS
    clawback thresholds are factual elements of Canadian retirement income planning.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
