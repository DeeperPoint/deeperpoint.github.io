market_example:
  summary: "Municipal HR systems match applicants with disabilities to job classifications using generic criteria, missing the specific technology environment, workspace, and task-structure attributes that determine whether a required accommodation is actually available in a specific role."
  problem: "Municipalities face persistent difficulty matching job seekers with disabilities to municipal roles where the specific accommodation required is available and where the person's skills match actual task requirements. The municipal HR system encodes jobs by generic classification; accommodation requirements (screen reader compatibility with specific software, specific transit access, particular ergonomic configurations) are never systematically matched against position characteristics before offers are made. High failure rates of accommodated placements result in disability discrimination complaints, legal costs, and ongoing vacancy."
  dominant_forces:
    - "Information asymmetry — applicants with disabilities know their accommodation requirements; HR knows the actual working conditions of positions; the two are matched at offer stage (too late) rather than at application stage"
    - "Opacity — the details of which roles are genuinely accommodation-compatible are not encoded in job postings"
    - "Cognitive overload — HR generalists responsible for 50+ job classifications cannot maintain working knowledge of which roles are best suited to which accommodation profiles"
    - "Trust deficit — applicants with disabilities reasonably fear disclosing accommodation needs early in the recruitment process due to documented discrimination; this produces mismatches that neither party can prevent without earlier honest exchange"
    - "Regulatory fragmentation — Ontario Human Rights Code duty-to-accommodate requirements, AODA employment accessibility standards, WSIB return-to-work obligations, and federal accessibility legislation create overlapping compliance requirements"
  deeperpoint_fit: "Semantic matching aligns applicant profiles (skills, accommodation requirements disclosed at the matching stage, career goals) with position profiles (actual task requirements, technology environment, physical access characteristics, team structure) — with the trusted intermediary protocol protecting disclosure until the candidate chooses to engage. KnowledgeSlot curates AODA employment standards, Ontario Human Rights Commission accommodation policy guidelines, WSIB return-to-work responsibilities, and best-practice accommodation inventories by disability type. The Generative Match Story helps HR officers articulate to hiring managers why a specific candidate-position pairing is a strong match, including how the required accommodation is already available."
  economic_upside: "More effective disability employment matching reduces legal risk, improves workforce diversity, taps a pool of skilled workers municipalities are systematically underutilizing, and demonstrates civic leadership that strengthens the municipality's standing as a social employer."

