market_example:
  summary: "In communities with no bus, residents who cannot drive depend on neighbours and volunteer drivers to reach medical appointments and work. Ride services stall for want of density: riders stop asking after unanswered requests, and drivers stop checking after empty weeks. A sponsored exchange would keep requests and offers open until they meet. It needs public or charitable sponsorship."
  problem: "Statistics Canada's 2021 Census counted 6.6 million people living in rural areas. Many of their communities have no scheduled transport of any kind. The Saskatchewan Transportation Company closed in May 2017. Greyhound Canada withdrew from Western Canada in 2018 and ended all its remaining Canadian routes on May 13, 2021. What is left for a resident who cannot drive is a relative, a neighbour, a taxi from the nearest town, or a volunteer driver programme run by a charity. Those programmes work, and they are fragile. Global News reported in March 2024 that one New Brunswick charity, serving about 700 clients with about 100 volunteers, sometimes had to deny trips because nobody was available. CBC News has reported that the same charity gave about 10,000 rides a year with about 70 volunteer drivers before the pandemic and about 6,000 with about 35 afterward. The structural problem is density. In a city, a ride request meets a driver within minutes because thousands of both are present. In a rural county a request for Thursday at nine may reach four possible drivers, none of whom is going that way that day. The rider hears nothing, or hears no. After two or three such answers she stops asking and arranges her life around not going. The driver who offered his Tuesdays sees no requests for a month and stops looking. Each side reads the silence as proof the service does not work, and by leaving makes it true. Yet the trips are there: people in the same area already drive to the regional hospital, the college and the plant every week, with empty seats, and are not known to anyone who needs one."
  dominant_forces:
    - "Cold Start: a rider who gets no answer stops asking, and a driver who gets no requests stops checking. The service needs many of both before either has a good experience, and neither stays long enough for the numbers to build."
    - "Geographic Distance: the hospital, the specialist and the employer are in a regional centre, and riders and drivers are spread along different roads. A driver a few roads over is of no use if he is heading the other way."
    - "Temporal Distance: an appointment is at a fixed hour on a fixed day, and a volunteer is free on other days. The trip a driver is already making and the trip a rider needs seldom coincide without someone looking for the overlap."
    - "Trust: riders are often older or unwell and are getting into a stranger's car, and a driver is taking a stranger into his own. Both rely on an organization to have checked the other."
    - "Opacity: regular private trips with empty seats are known only to the people making them. No one holds a picture of who drives where and when."
  deeperpoint_fit: "The design fits how these trips are described and how much each side should see of the other. The cold start depends on a part that is not built. Cosolvent, the engine, matches from descriptions in ordinary words. A rider or a coordinator taking her call can state the need as it is: the eye clinic every second Thursday morning, a walker that must fit in the trunk, home by two. A driver can state what he already does: in to the hospital for a seven o'clock shift on weekdays, back after three, room for two. The trusted-intermediary pipeline keeps protected details hidden until both sides agree to reveal them, such as a rider's address and health condition or a driver's home and plate. The engine reads documents into profiles, so a charity's existing driver screening records and vehicle insurance confirmations can be loaded without retyping. Each match produces a Content Match Story, one account of why this trip and this driver fit, given to both while anonymous. A Deal Brief has a smaller role here: it would summarize a proposed standing arrangement, such as a weekly paid run by a local operator, for the charity's board, insurer or funder, without binding anyone. CommonContext would prepare the reference library behind a domain wiki of provincial rules on volunteer driving, insurance, reimbursement and medical travel assistance. What this market needs most is memory: a request that stays open and is matched when a suitable driver joins three weeks later, and a driver's offer that waits for a rider. Memory across sessions is designed and not yet built. Grouping several riders into one trip is aggregation, also designed and not yet built; a coordinator would do it by hand. ClientSynth generates invented riders and drivers so a sponsor can test and demonstrate the service before launch. Invented participants are kept out of any live market, so they cannot be used to make a thin service look busy."
  economic_upside: "Statistics Canada's 2021 Census put the rural population at 6.6 million. The federal Rural Transit Solutions Fund, launched in 2021, committed $250 million over five years, and its 2023 backgrounder lists on-demand services, publicly owned ride shares and volunteer community car-pooling among eligible solutions, with capital contributions of up to $3 million, or up to $5 million for zero-emission projects. A 2020 Queen's University planning report described one New Brunswick volunteer driver programme that grew from about 1,000 to about 10,000 rides a year after it began in 2014. These figures show public money and proven demand. They do not measure the value of appointments kept or jobs held, and no such figure is estimated here. The entry carries little commercial value per ride and depends on public, health-system or charitable sponsorship."

sponsor_opportunities:
  - title: "Ride Exchange for a Community Transportation Charity or Regional Service Commission"
    type: saas
    revenue_model: "A charity, municipality or regional service commission would pay an annual subscription, sized to its service area, for a private exchange of ride needs and driver offers that its own coordinators operate."
    strategic_logic: "These organizations already screen drivers and take riders' calls. Most keep the matching in a coordinator's head and a spreadsheet. An exchange that holds open requests and regular private trips lets one coordinator serve more riders with the same volunteers."
    recurring: true

  - title: "Health-System Appointment Travel Coordination"
    type: managed-service
    revenue_model: "A regional health authority or hospital foundation would pay an annual contract for a coordinator who receives travel needs from clinics at the time of booking and arranges rides through local programmes."
    strategic_logic: "A missed appointment costs the health system a clinic slot and often a later emergency visit. Clinics know the appointment weeks ahead, which is the notice a volunteer programme needs. Referrals from clinics also supply a steady flow of requests, which keeps drivers engaged."
    recurring: true

  - title: "Paid Operator Standing Runs"
    type: logistics-extension
    revenue_model: "A local taxi or shuttle operator would pay a coordination fee per scheduled run when the exchange shows enough regular riders on one route and day to fill a vehicle. Riders, or a subsidy programme on their behalf, would pay the operator's fare."
    strategic_logic: "Where requests cluster, a weekly paid run is more dependable than volunteers. The exchange shows an operator where that demand is before it commits a vehicle, and federal rural transit funding lists on-demand services as eligible."
    recurring: true

  - title: "Volunteer Driver Insurance and Reimbursement Administration"
    type: commerce-extension
    revenue_model: "An insurer or broker would pay a referral fee for group volunteer driver coverage placed through the sponsor, and the sponsor would pay a per-driver administration charge for mileage reimbursement records."
    strategic_logic: "Insurance questions and unpaid fuel costs are common reasons volunteers stop. A sponsor that handles both removes two reasons for drivers to leave, which protects the density the service depends on."
    recurring: true

story:
  title: "The Thursday Seat"
  status: draft
  blog_slug: ""
  characters:
    - "Edna - retired resident who no longer drives, Hillsborough, New Brunswick"
    - "Marcel - hospital maintenance worker and new volunteer driver, Riverside-Albert, New Brunswick"
    - "Paulette - ride coordinator at a community transportation charity, Moncton, New Brunswick"
  summary: "A woman who stopped asking for rides after two unanswered requests is matched, weeks later, with a hospital worker who drives past her road every weekday with an empty seat."
  body: |
    ## Act A - The Market Structure

    Statistics Canada counted 6.6 million rural residents in 2021. Scheduled transport has thinned around them. Greyhound Canada ended its last Canadian routes on May 13, 2021. For a resident who cannot drive, what remains is family, neighbours, an expensive taxi, or a volunteer driver programme.

    Those programmes run on density they seldom have. A request for Thursday at nine may reach four drivers, none heading that way. Global News reported in March 2024 that one New Brunswick charity sometimes had to deny trips because nobody was available. A rider who is refused twice stops asking. A driver who sees no requests for a month stops looking. Each takes the silence as proof, and leaves.

    The following is a fictional account of how a marketplace built on DeeperPoint's design could close this gap.

    ---

    ## Act B - The Story

    **Edna** lives outside Hillsborough and gave up her licence last year. She needs to be at an eye clinic in Moncton every second Thursday morning. In the spring she phoned the charity twice. Both times no driver was free. Her niece took two days off work to drive her, and Edna did not phone again.

    **Paulette** coordinates rides for the charity. When it began using a ride exchange, she entered the requests she had on paper, including the ones she had been unable to fill. Edna's went in as Paulette had taken it down: eye clinic, every second Thursday, there by nine, a walker that folds, home by early afternoon. Edna's address and the reason for the appointments were marked private. The request stayed open.

    **Marcel** does maintenance at a hospital in Moncton and lives in Riverside-Albert, farther down the same road. In June a notice in the staff room asks employees who drive in from the county to offer their empty seats. He signs up with the charity, which checks his licence, his insurance and his record, and loads those documents into his profile. He adds a few lines of his own: in for seven on weekdays, home after three, room for two, glad to go a few minutes out of his way but not twenty.

    The exchange matches his description against the open requests. Edna's has been waiting eleven weeks. Both receive the same Content Match Story, without names. It says a screened driver already makes this trip on the rider's clinic day and passes near her road. It says the rider would arrive two hours before her appointment and wait an hour after it, and asks whether that is acceptable. It says the walker fits.

    Paulette phones Edna to read it to her. Edna says she would rather sit in a waiting room for two hours than ask her niece again. Marcel agrees too. Only then does each learn the other's name, and Marcel the turn-off to her lane.

    He picks her up on the second Thursday of July. Paulette has two more open requests on the same road, and asks Marcel whether his second seat is still free. That grouping she does herself, by phone.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Edna's ride existed in the spring. It was in a car that passed her road five days a week. Nobody knew, and by the time the driver came forward she had stopped asking.

    A dispatch app built for cities answers a request now or not at all. Rural rides need the opposite: a request that stays open, an offer that waits, and enough said in plain words to find the overlap between a trip already being made and a trip that is needed. These are the [forces that keep small markets thin](../market-physics.html). [MarketForge](../marketforge.html) describes how a sponsor would build such a service.

    *Edna, Marcel, Paulette and the charity in this story are fictional. The census figure, the end of Greyhound Canada's routes and the Global News report are real. Matching a request that had waited eleven weeks relies on memory across sessions, which is designed and not yet built. Grouping riders into one trip is also not built, and was done here by the coordinator.*
