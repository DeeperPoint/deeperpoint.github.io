  body: |
    ## Act A - The Market Structure

    A business interruption insurance claim is fundamentally an economic argument about
    what did not happen. The forensic accountant's job is to reconstruct the revenue and
    profit the insured business would have generated during the period of indemnity—absent
    the fire, the flood, the cyber attack, the evacuation order—using historical performance,
    industry benchmarks, and economic context to build a defensible counterfactual.

    This is a credible undertaking only if the forensic accountant understands both the
    accounting methodology and the economics of the specific industry. A hotel's revenue
    projection after a wildfire-triggered evacuation must account for seasonality
    (was it peak ski season?), displacement patterns (where do the guests go?), recovery
    trajectory (how fast do resort hotels rebuild occupancy after wildfire events?), and
    avoided costs (which hotel operating costs genuinely stopped during closure?). A
    forensic accountant who has not worked with hotel revenue models in wildfire-affected
    tourism markets will produce a projection that the hotel's own management team will
    dispute with its monthly board reporting in hand.

    When the insurer and policyholder each retain forensic accountants who are respected
    in their general practice but not specifically expert in hotel wildfire BI, the result
    is two credible-seeming but significantly divergent loss quantifications that leave
    no rational settlement basis and proceed to litigation.

    ---

    ## Act B - The Story

    **Carla** is managing a $7M hotel BI claim from a BC wildfire evacuation that forced
    a mountain resort to close for five months during its shoulder season. The property
    is repaired. The coverage question is the revenue loss. She needs a forensic expert
    for the insurer's loss analysis—someone whose report will be credible to opposing
    counsel and, if necessary, to a BC Supreme Court judge. Her panel list has twelve firms.
    Three have indicated hotel experience. Two of those have never worked on a wildfire-
    triggered BI claim. The third did one wildfire hotel BI file in Alberta in 2017—under
    different Alberta market conditions.

    **Peter** runs a 12-person forensic accounting practice in Vancouver that has focused
    exclusively on hospitality and tourism BI claims since 2016. He has completed 38 hotel
    BI loss quantifications including 11 arising from wildfire evacuation events in BC,
    Alberta, and Washington State. He has testified as expert witness in three BC BI
    litigations involving hotel revenue projection methodology. His practice works primarily
    with policyholder-side law firms. He is not on Carla's insurer panel.

    Carla queries the platform: industry (hospitality, hotel resort), loss trigger (wildfire
    evacuation), province (BC), claim quantum ($7M), expert role (insurer-side). Peter's
    practice surfaces with hospitality industry specialization, wildfire BI loss trigger
    experience, BC expert witness record. Carla's panel is expanded to include Peter's practice.
    He is retained. His report presents a loss quantification methodology aligned to BC wildfire
    hotel recovery benchmarks with documented peer comparables. The policyholder's counsel
    reviews the report, recognizes its methodological robustness, and settles at a figure
    within 8% of Peter's quantification. Resolution in four months. No litigation.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Business interruption claims resolve efficiently when both parties' forensic experts
    have the industry and loss trigger expertise to produce credible, methodology-aligned
    quantifications. When expert selection is driven by panel name recognition rather than
    specific expertise matching, the divergent reports that result make litigation more
    likely than settlement. DeeperPoint builds the claims expertise matching platform
    that makes the right expert discoverable before the dispute crystallizes.

    *Characters are fictional. Business interruption claim litigation rates and forensic
    expert matching challenges are recognized across the Canadian insurance industry.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
