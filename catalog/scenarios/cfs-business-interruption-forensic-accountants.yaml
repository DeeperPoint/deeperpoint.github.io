market_example:
  summary: A specialist matching platform connecting insurers, policyholders, and their legal
    counsel handling complex business interruption insurance claims with forensic accountants
    who have demonstrated BI loss quantification expertise in the specific industry, loss
    trigger type, and jurisdictional context of the claim—the thin practitioner pool that
    determines whether a $5M claim settles in six months or litigates for three years.
  problem: "Business interruption insurance claims—arising from fire, flood, cyber incidents,
    supply chain disruption, pandemic, or regulatory shutdown—are the most complex loss
    quantification problem in commercial insurance. The BI coverage pays for lost profit
    and continuing expense during the period of indemnity; calculating the loss requires
    reconstructing what the business would have earned absent the triggering event in
    a counterfactual economic environment that may span one to five years. The forensic
    accounting expertise required to do this credibly—for a claim above $1M—is highly
    specialized in two dimensions simultaneously: the accounting methodology (projection
    models, avoided cost analysis under standard BI policy language) and the industry
    economics (what revenue trends are normal for a hotel, a manufacturing plant, or a
    restaurant chain during and after a specific type of physical loss or shutdown event?).
    A forensic accountant who is expert in hotel BI loss quantification has no particular
    expertise in manufacturing plant BI from a machinery breakdown. A forensic accountant
    experienced in cyber incident BI losses may have little familiarity with the standard
    of proof in Canadian BI litigation or the specific policy interpretation precedents
    that Ontario courts have applied to pandemic-related BI claims. Insurers use panels
    of forensic accountants for large claims; policyholders retain their own forensic
    experts for significant claims. Both selection processes operate through informal
    referral networks that consistently match on name recognition rather than specific
    industry × policy type expertise."
  dominant_forces:
    - "BI loss quantification requires simultaneous expertise in forensic accounting
      methodology, the specific industry's economics, and the relevant policy language
      and claims precedents—a three-dimensional expertise profile that standard forensic
      accounting firm selection processes do not assess."
    - "Insurer panel selection and policyholder forensic expert retention both operate
      through name-recognition referrals from lawyers and adjusters, systematically
      overlooking practitioners whose specific industry and policy expertise better
      matches the claim at hand."
    - "BI claim disputes that reach litigation extend resolution timelines by 2–4 years and
      multiply legal costs by 5–10x; deploying a forensic accountant whose opinion lacks
      credibility for the specific policy type and industry is the primary driver of
      unnecessarily litigated claims."
  deeperpoint_fit: "CommonContext encodes the BI loss quantification methodology framework:
    standard BI policy structure and coverage periods, avoided cost methodology under
    Canadian insurance policy language, industry-specific revenue projection standards
    by SIC code, and the key disputes in recent Canadian BI litigation precedents.
    CoSolvent matches claim profiles—industry, loss trigger type, policy type and insurer,
    claim quantum, litigation status—against forensic accountant profiles organized by
    industry experience, loss trigger type, policy language familiarity, and expert
    witness track record in Canadian courts."
  economic_upside: "The Canadian commercial BI insurance market generates hundreds of millions
    in claims annually; complex claims above $1M—where matched forensic expertise is
    determinative—number in the thousands per year. Each month of unnecessary litigation
    costs an insurer or policyholder $50,000–$200,000 in legal fees. Platform revenue
