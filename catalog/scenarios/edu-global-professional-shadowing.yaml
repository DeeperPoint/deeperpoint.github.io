    type: commerce-extension
    revenue_model: "Annual sponsorship from Global Affairs Canada or Embassy programs ($50,000–$150,000/year). Co-sponsored student-professional matching in priority partner countries (Germany, Japan, Colombia, Kenya, India) as a specific education diplomacy program."
    strategic_logic: "Canada has bilateral education partnerships with 30+ countries. Structured student-professional shadowing is an education diplomacy tool that is measurable, scalable, and far more engaging for students than pamphlets about bilateral relations."
    recurring: true

  - title: "Professional Language Exchange Commerce"
    type: commerce-extension
    revenue_model: "Facilitation fee for platform-matched language practice pairs linked to career exploration ($15–$30/session). A Canadian student studying Spanish who wants to talk with a Mexican urban planner practices Spanish while learning about urban planning — a dual-purpose engagement that neither party can find elsewhere."
    strategic_logic: "Language learning is most effective in meaningful context. Career-domain conversations with professionals in target-language countries combine language practice with genuine professional curiosity — a combination that has never been systematically matched at scale."
    recurring: true

story:
  title: "The Question She Actually Wanted to Ask"
  status: draft
  blog_slug: ""
  characters:
    - "Maya Johansson - Grade 11 student, environmental science focus, Victoria, BC"
    - "Dr. Linh Nguyen - climate policy advisor, Ministry of Natural Resources, Hanoi, Vietnam"
    - "Ms. Patricia Torres - career education coordinator, Maya's school"
  summary: "Maya's environmental science class is studying coastal climate adaptation. She wants to talk to someone who is actually designing adaptation policy in one of the world's most climate-vulnerable deltas. Dr. Linh works on Mekong Delta adaptation policy in Hanoi. The platform matches them in a week."
  body: |
    ## Act A - The Market Structure

    Career education is the most personal educational domain — it is about who a student
    will become. It is also the domain where the gap between what students want and what
    schools provide is widest.

    What students want: a real conversation with a real person doing the real version of the
    job they are thinking about. Not a video tour. Not a pamphlet. A conversation.

    What schools provide: a list of speakers who have agreed to come to the gym, most of
    whom the career coordinator knows personally, distributed across career domains that
    map poorly to specific student interests.

    The gap between a Grade 11 student who has read about the Mekong Delta's climate
    vulnerability and a climate policy advisor in Hanoi who works on that adaptation problem
    every day is twelve time zones and one matching platform. It has never been closed
    systematically, because no one built the mechanism to close it.

    ---

    ## Act B - The Story

    **Maya Johansson** is 17 years old. She lives in Victoria and is deeply interested in
    coastal climate adaptation — not as a future academic exercise, but as a policy problem.
    Her environmental science class spent three weeks on sea-level rise modelling. She wants
    to understand what it's like to actually work on adaptation policy in a place where the
    stakes are existential — not Canadian glacier retreat, but the Mekong Delta, where 20
    million people live below projected 2050 sea levels.

    She asked her career coordinator about finding an environmental policy professional in
    Southeast Asia. Ms. Torres tried three channels and found nothing specific enough.
    She registered on the platform.

    Maya's profile: Grade 11 environmental science, specific interest in coastal climate
    adaptation policy, emerging economy context preferred, one structured session, prepared
    to research the professional's country context beforehand. She has functional Spanish
    but wants an English match.

    **Dr. Linh Nguyen** is a climate policy advisor at Vietnam's Ministry of Natural Resources
    and Environment. She leads the technical working group on Mekong Delta adaptation finance.
    She studied in Australia and speaks English fluently. She registered on the platform through
    a Global Affairs Canada-Vietnam education initiative. Profile: climate adaptation policy,
    Mekong Delta, Vietnamese and English, willing to speak to secondary students, one or two
    sessions per year.

    The platform matches them in five days. The Generative Match Story notes the correspondence:
    Maya's specific interest in coastal adaptation policy in a high-stakes delta system aligns
    directly with Dr. Linh's active policy work. Both are English primary. Both are willing
    to engage in a structured one-session format.

    The platform's CommonContext surfaces a Vietnam/Mekong context guide for Maya before
    the session: the delta's geography, the climate projections, the current adaptation strategy
    framework, the names of the key policy institutions. Maya reads it the night before.

    When the session begins, Maya's first question is not "what does your job involve?" It is:
    "The IPCC's 2022 report flags the Mekong as among the highest-risk deltas globally for
    combined sea-level rise and saltwater intrusion. How does your ministry prioritize between
    coastal hardening and managed retreat as policy responses?"

    Dr. Linh pauses. Then she says: "That is exactly the question we are arguing about right now."

    They talk for ninety minutes. Ms. Torres sits in the back of the room, listening.

    Afterward, Maya tells her: "That was the best class I've had all year." She means it literally.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Dr. Linh would speak to Canadian students. She finds it meaningful and personally energizing.
    Maya desperately wants this conversation. Ms. Torres wants to provide it and cannot.

    The barrier is not willingness. It is discovery specificity. "Find me an environmental
    policy professional" produces nothing useful. "Find me a climate adaptation policy advisor
    in a Southeast Asian coastal delta context who speaks English and is willing to talk to
    secondary students" is a matchable request — but no system before this one was capable
    of fielding it.

    Career education can be transformational when it is specific enough to meet the student's
    actual curiosity. The specificity gap has been the barrier. The platform is the mechanism
    that closes it.

    Maya is applying to the University of Victoria's geography and environmental studies program.
    Her application essay begins with the question Dr. Linh answered for ninety minutes.

    *Characters are fictional. The Mekong Delta climate adaptation challenge, Vietnam's MONRE
    adaptation policy working groups, and IPCC 2022 analysis of delta systems are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
