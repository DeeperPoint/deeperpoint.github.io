id: edu-global-professional-shadowing
title: "Global Professional Shadowing for Canadian Secondary Students"
card_title: "Cross-Border Career Shadowing Matching"
sector: canadian-education
sub_sector: "Cross-Border & Global Career Education"
forge_tier: 1
status: published
tags: [thin-markets, education, career, cross-border, shadowing, canada, global, secondary, cosolvent, commoncontext]

market_example:
  summary: "Canadian high school students exploring career paths want to understand how their professions of interest are practised in other countries — and professionals in those countries who want to connect with international students exist in abundance. A platform matching Canadian students with professionals in their career domain across 30+ countries transforms career education from a local activity into a global one."
  problem: "Career education in Canadian secondary schools is limited by geography: students learn about careers from teachers whose professional networks are local, from job shadow programs locked to whatever employers are within driving distance, and from career fairs populated by whoever agreed to show up. A student in Halifax who wants to understand architecture — and how it is practised differently in Japan, Scandinavia, or Brazil — has no path to that knowledge. A student in Saskatoon curious about urban planning in dense Asian cities, or medical research in Rwanda, cannot find a professional in those fields who would talk to them for an hour. Meanwhile, professionals around the world who are asked to speak to students routinely decline because the ask is poorly targeted — a generic 'tell students about your career' rather than a structured, specific, time-bounded conversation."
  dominant_forces:
    - "Discovery failure — Students cannot find professionals in specific career domains in specific countries willing to engage in a structured conversation"
    - "Specificity mismatch — Professional engagement programs ask for generic 'career speakers'; professionals respond best to specific, well-prepared students with real curiosity about their domain"
    - "Trust deficit — Schools are cautious about connecting students with foreign professionals without a vetting and consent infrastructure"
    - "Preparation gap — Students who have not researched the professional's context and country produce unproductive conversations; professionals disengage"
    - "Time mismatch — Career conversations need to happen in the context of a curriculum unit (e.g., geography unit on urban planning, biology unit on public health) at the right time — which is almost never when a career speaker program happens to be scheduled"
  deeperpoint_fit: "CoSolvent builds student-ready career exploration profiles: career domain of interest, specific questions the student wants answered, relevant curriculum unit context, language, and time zone availability. Professional profiles capture career domain, country and institution, willingness to engage with students (one session, recurring, mentorship), and specific aspects of their work they particularly enjoy explaining. The matching engine finds high-specificity connections — not a generic 'architect' but an architect in Copenhagen who specializes in social housing and would find a conversation with a Canadian student about Danish housing policy fascinating. CommonContext carries country-specific professional context guides that students access before sessions to prepare meaningful questions, PIPEDA-compliant engagement consent templates, and structured conversation frameworks for different career domains."
  economic_upside: "Canadian school boards spend $15–25M annually on career education programming with consistently low student engagement — primarily because the programming is generic and local. Global professional shadowing, matched at the specificity level of real student curiosity, would command deep student engagement and parent support. If the platform facilitates 30,000 Canadian student-professional sessions per year at $25–$50 per session, that represents $750K–$1.5M in direct revenue — plus institutional subscriptions and potential Global Affairs Canada sponsorship for priority country connections."

