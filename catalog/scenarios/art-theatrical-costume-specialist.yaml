market_example:
  summary: "A theatre company mounting a period production requiring historically accurate 18th-century stays, a film requiring authentic Métis trade-era beadwork garments, or an opera needing genuine Javanese court costume construction cannot find the artisan specialists through standard costume house channels — while the artisans who hold the rare skills don't know the productions that need them exist."
  problem: "The theatrical and film costume sector is served by large rental houses, standard design networks, and TD/costume designer relationships built through decades of professional relationship. This infrastructure works efficiently for contemporary and broadly historical productions that can be served by rental inventory and adaptable construction skills. It fails completely for productions requiring niche authenticity: a Stratford production requiring historically accurate whalebone-boned 18th-century stays constructed by a corsetière who has studied museum collections; a Netflix Indigenous historical drama requiring Métis floral beadwork garments built by a Métis beadwork practitioner, not a non-Indigenous costume technician approximating the aesthetic; an opera requiring Javanese batik-dyed court garments constructed by an artisan trained in the Solo court tradition. These requirements are below the radar of standard costume houses, which cannot represent capabilities they do not themselves hold. The artisans who hold the specific capabilities — historical corsetières, Indigenous beadwork garment makers, specialist ethnic costume builders — are typically freelancers or small workshops operating through word-of-mouth, at the intersection of craft, cultural practice, and theatrical application."
  dominant_forces:
    - "Skill specificity — the difference between a costume technician who can approximate an 18th-century corset and a corsetière trained in museum-collection study of original construction techniques is measurable in the final garment and visible on stage"
    - "Cultural authority — Indigenous and culturally specific garment construction requires practitioners with community-based cultural knowledge that cannot be acquired through pattern study alone"
    - "Craft invisibility — freelance and small-workshop artisans with specialist costume construction skills have minimal institutional presence in theatre industry directories, which list costume houses and designers but not individual specialist craftspeople"
    - "Production timeline pressure — costume construction decisions must be made in the first weeks of pre-production; a late-discovered specialist cannot be integrated into the construction schedule"
    - "Geographic distribution — specialist costume artisans are geographically distributed without relation to production centres; a Métis beadwork garment specialist in Winnipeg is not visible to a Vancouver film production even when the production requires exactly their capability"
  deeperpoint_fit: "Semantic matching encodes artisan profiles (construction specialty by historical period and technique, cultural community affiliation and practice authority, specific techniques — boning types, embroidery methods, fabric preparation approaches, dye techniques — production experience, geographic base and travel capability, lead time required) against production demand signals (production type, period or cultural context, specific garment types required, authenticity standard, budget, production timeline, geography). CommonContext encodes historical costume construction technique vocabulary and cultural dress tradition classification."
  economic_upside: "Canadian film and television production exceeds $9B annually; theatrical production — the Stratford and Shaw Festivals alone have budgets over $70M — generates substantial costume construction spending. Misprocurement of costumes in historically or culturally specific productions generates visible errors that damage critical reception and, in the case of Indigenous cultural misrepresentation, generate community harm and social media response that can define a production's public reputation negatively before opening night. A platform that correctly matches 50 specialist costume commissions per year at an average artisan fee of $5,000–$20,000 generates $250,000–$1M in precision-matched specialist artisan work annually."

