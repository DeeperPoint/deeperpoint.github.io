tags: [sme, home-renovation, deep-retrofit, consortium, solar, hvac, insulation, smart-home, canada, bid-assembly]

market_example:
  summary: "Small residential renovation contractors, HVAC specialists, solar installers, and insulation companies cannot efficiently assemble the full-package deep retrofit teams needed to bid homeowner programs, utility rebate programs, and municipal retrofit incentive contracts that require integrated multi-trade delivery under a single contract."
  problem: "Federal and provincial deep home retrofit programs—Canada Greener Homes, utility On-Bill financing programs, municipal green home loan programs—increasingly require integrated auditing, design, installation, and verification under a single contractor relationship. A homeowner participating in a $40,000-$80,000 deep retrofit grant program wants one point of contact managing their air sealing, insulation, heat pump HVAC, solar installation, smart thermostat integration, and electrical panel upgrade. No single small contractor covers all of these trades. The general contractor who could lead the work lacks the certified HVAC and solar sub-trade relationships. The HVAC specialist doesn't have a solar partner. The energy auditor qualified to generate the EnerGuide pre- and post-retrofit reports doesn't have a contractor relationship to refer clients into. The homeowner ends up managing four separate contractors—which is exactly the friction that kills retrofit program participation rates. Large renovation companies with full internal trade capacity win these programs easily. Small trade specialists are locked out."
  dominant_forces:
    - "Offering complexity — a credible deep retrofit bid requires alignment across energy auditing credentials, air sealing and insulation installation, HVAC certified trade, solar and electrical certification, smart systems integration, and program documentation for rebate verification"
    - "Certification specificity — each trade element requires specific certifications (EnerGuide auditor, R-2000 contractor, HRAI heat pump certification, CEC solar installer) that cannot be generalized across firms"
    - "Program timeline pressure — utility and municipal retrofit programs operate on fiscal year cycles with rebate allocation limits; slow consortium assembly loses program windows"
    - "Client accountability — retrofit clients want a single general contractor accountable for the whole project; a visible consortium of independents reduces client confidence"
    - "Opacity — certified specialists in each required trade are not organized in any directory that a general contractor can search by certification type, current availability, and geographic service area"
  deeperpoint_fit: "Semantic matching encodes specialist firm profiles (trade certifications by program type, service territory, current capacity for new projects, sub-trade role preference vs. lead vs. follow) against retrofit opportunity signals (program type, scope of work components, geographic location, timeline, rebate program requirements, single-contract structure sought). The consortium proposal template pre-structures the single-contractor accountability framework, insurance coordination, and rebate documentation workflow that program requirements mandate."
  economic_upside: "Canadian retrofit programs are deploying billions in incentives, but participation rates are constrained by the installation capacity friction of multi-trade coordination. A homeowner who faces four separate contractor relationships and insurance questions drops out of the program. Better consortium assembly infrastructure increases completed retrofit rates per incentive dollar spent, increases revenue access for small trade specialists, and accelerates Canada's residential energy transition goals."

