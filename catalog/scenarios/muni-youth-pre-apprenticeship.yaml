market_example:
  summary: "Municipal youth employment programs graduate hundreds of pre-apprenticeship candidates annually, but cannot efficiently match graduates to employers willing to provide supervised placement — while employers with apprenticeship capacity cannot find candidates whose training aligns with their trade specialization and workplace requirements."
  problem: "Pre-apprenticeship programs — funded by municipalities, provincial ministries, and community organizations — train hundreds of young people annually in construction, manufacturing, automotive, and electrical trades. Program completion rates are reasonable. Employment placement rates are not. The bottleneck is not training quality — it is the matching problem between graduates with specific trade preparation and employers with specific supervision capacity. A youth who completed a 16-week pre-apprenticeship in industrial electrical at a community college in Scarborough needs an employer who holds a valid Training Agreement with the Ontario College of Trades (or successor body), has a journeyperson-to-apprentice ratio that permits another apprentice, works in industrial electrical (not residential, not commercial — industrial), and is willing to supervise a first-year apprentice who has pre-apprenticeship training but no on-site experience. That employer exists — probably within 30 kilometres — but neither the program coordinator nor the graduate can find them. The program coordinator calls the same five employers she has always called. Three don't answer. One is full. One says maybe next quarter. The graduate waits. After three months of waiting, the graduate takes a warehouse job. The pre-apprenticeship investment — $8,000–$12,000 in public funding per seat — produces no apprenticeship outcome."
  dominant_forces:
    - "Opacity — employers with apprenticeship registration capacity are invisible to program coordinators who are not in their personal network; their current journeyperson-to-apprentice ratio and trade specialization are not published anywhere"
    - "Temporal mismatch — pre-apprenticeship programs graduate cohorts on fixed schedules; employer hiring needs are driven by project pipelines and seasonal cycles that rarely align with graduation dates"
    - "Trust deficit — employers who have had bad apprenticeship experiences are reluctant to accept candidates from programs they don't know; program coordinators cannot credibly signal graduate readiness without employer-recognized metrics"
    - "Regulatory complexity — Training Agreement requirements, journeyperson ratios, trade classification specifics, and union apprenticeship rules vary by trade, jurisdiction, and collective agreement"
    - "Geographic constraint — apprentices need to get to the job site daily; a match that is technically perfect but requires a 90-minute commute in a city with poor transit to industrial areas will fail"
  deeperpoint_fit: "Semantic matching connects pre-apprenticeship graduates to employers based on trade specialization alignment, geographic proximity, journeyperson ratio availability, Training Agreement status, and start-date compatibility. The verification pipeline validates employer apprenticeship registration, journeyperson credentials, WSIB status, and workplace safety record. CommonContext curates Ontario apprenticeship regulations by trade, Training Agreement requirements, journeyperson ratio rules, union apprenticeship protocols, and available wage subsidy programs (Canada-Ontario Job Grant, OYAP, etc.). ClientSynth simulates placement dynamics — testing whether sufficient employer density exists in specific trade categories and geographies to sustain a matching platform — before committing to recruitment."
  economic_upside: "Ontario alone funds approximately 3,000 pre-apprenticeship seats annually at $8,000–$12,000 per seat — a $24M–$36M public investment. Current apprenticeship registration rates from pre-apprenticeship programs are estimated at 30–50%. Every 10-percentage-point improvement in placement rate converts $2.4M–$3.6M in existing public investment from waste to productive workforce development outcome. A matching platform that achieves this improvement at a fraction of the per-seat cost generates measurable ROI for every funder — municipal, provincial, and federal — currently investing in pre-apprenticeship programming."

sponsor_opportunities:
  - title: "Apprenticeship Employer Discovery Platform"
    type: saas
    revenue_model: "Annual subscription per program coordinator ($1,500–$3,000/year); employer registration ($299/year with verification); municipal workforce development department licence ($5,000–$10,000/year for unlimited program access)"
    strategic_logic: "No verified, searchable directory of employers with current apprenticeship registration capacity exists at the trade-specialization level. Building it creates placement infrastructure that every pre-apprenticeship program needs — and that individual program coordinators cannot create from their personal Rolodexes."
    recurring: true

  - title: "Graduate Readiness Portfolio and Matching Service"
    type: managed-service
    revenue_model: "Per-graduate readiness portfolio preparation $150–$250; employer-graduate match facilitation $300–$500 per successful placement; ongoing placement support and check-in service $75/month for first 6 months"
    strategic_logic: "The gap between a pre-apprenticeship certificate and an employer's willingness to take a chance is a trust problem. A managed service that assembles a verified readiness portfolio — training records, competency assessments, safety certifications, reference checks — and presents it in the employer's decision-making format converts an unknown risk into a documented investment."
    recurring: true

  - title: "Wage Subsidy and Grant Navigation Service"
    type: managed-service
    revenue_model: "Per-placement grant application assistance $200–$400; annual employer subsidy optimization review $500; program-level grant reporting $2,000–$5,000 per funding cycle"
    strategic_logic: "Multiple overlapping wage subsidy programs exist (Canada-Ontario Job Grant, OYAP, CaRMS equivalents for trades) but employers find them administratively burdensome to access. A navigation service that identifies eligible subsidies and manages the paperwork reduces the employer's net cost of taking an apprentice — directly increasing placement willingness."
    recurring: true

  - title: "Pre-Apprenticeship Program Outcome Tracking and Reporting"
    type: saas
    revenue_model: "Annual outcome tracking subscription per program $1,200–$2,500; funder reporting package $500 per report; longitudinal tracking (12-month post-placement) $300 per graduate"
    strategic_logic: "Funders — municipal, provincial, and federal — require placement outcome data that most programs struggle to collect systematically. A platform that tracks graduates from program completion through employer matching to apprenticeship registration provides the outcome data every funder demands, while giving programs the evidence they need to justify continued funding."
    recurring: true

  - title: "Employer Apprenticeship Readiness Consulting Extension"
    type: commerce-extension
    revenue_model: "Apprenticeship registration setup consulting $500–$1,500 per employer; Training Agreement preparation $300–$500; ongoing apprenticeship program advisory $200/month"
    strategic_logic: "Many small employers who could benefit from apprentices have never registered as training sponsors because the administrative process is opaque. A consulting extension that walks employers through registration — and connects them to subsidies that offset costs — expands the employer pool that the matching platform can draw from."
    recurring: true

story:
  title: "The Electrician Who Almost Wasn't"
  status: draft
  blog_slug: ""
  characters:
    - "Marcus — 22-year-old pre-apprenticeship graduate, Scarborough, Ontario"
    - "Diane — owner, industrial electrical contracting firm, Pickering, Ontario"
  summary: "A pre-apprenticeship graduate in industrial electrical cannot find an employer with apprenticeship capacity, while a contracting firm 20 kilometres away has been trying to register a new apprentice for months but can't find one with the right trade preparation."
  body: |
    ## Act A — The Placement Gap

    Pre-apprenticeship programs are designed to bridge the gap between a young person's interest in a trade and an employer's willingness to invest in a four-year apprenticeship. They work — graduates emerge with safety certifications, basic trade competencies, and the discipline of showing up at 6am for sixteen weeks straight.

    What they do not produce is the match. The program coordinator has a list of five employers she has placed students with before. When those employers are full — or have had a bad experience — the list is exhausted. There is no second list. There is no searchable directory of employers with current apprenticeship registration, available journeyperson ratios, and active hiring interest in the specific trade classification the graduate trained in.

    The result is a paradox visible to everyone in the skilled trades ecosystem: employers say they cannot find apprentices, pre-apprenticeship graduates say they cannot find employers, and both are telling the truth — because the market between them is too thin, too opaque, and too trust-dependent to clear.

    The following is a fictional account of how MarketForge closes this gap.

    ---

    ## Act B — The Story

    **Marcus** completed a 16-week pre-apprenticeship program in industrial electrical at Centennial College. He has his Working at Heights certification, WHMIS, Basic Electrical Safety, and a strong assessment from his program instructor. He wants to work in industrial automation — the kind of panel building and PLC wiring he practiced in the program's lab.

    His program coordinator, Sarah, has called her usual employers. Two are residential contractors — wrong trade classification. One industrial firm took an apprentice six months ago and is at their journeyperson ratio limit. One didn't return her call. One said "maybe in the fall."

    Marcus starts applying to warehouse jobs on Indeed. His mother asks him every day if he's heard anything about the electrical.

    **Diane** owns a 14-person industrial electrical contracting firm in Pickering. She has three journeypersons and one current apprentice. Her journeyperson-to-apprentice ratio permits one more apprentice. She has had a Training Agreement registered with the Ontario College of Trades since 2018. She has been looking for a first-year apprentice with industrial electrical preparation for two months — posting on Indeed (where she is buried under 400 applications from people who think "electrical" means changing light switches) and asking her journeypersons if they know anyone (they don't).

    Diane registers on the MarketForge workforce platform. The platform verifies her Training Agreement status, confirms her journeyperson ratio, encodes her trade specialization (industrial automation, panel building, conduit installation), geographic location, and start-date window.

    Marcus's profile — created by his program coordinator — encodes his trade preparation, certifications, assessment scores, geographic range (can commute to Pickering via GO Transit in 45 minutes), and availability date.

    The platform surfaces the match. Trade specialization: aligned. Journeyperson ratio: available. Geography: commutable. Start date: compatible. Safety certifications: complete.

    Diane reads Marcus's readiness portfolio. She calls Sarah — the program coordinator — and asks one question: "Would you hire him?" Sarah says yes without hesitating.

    Marcus starts the following Monday. His apprenticeship registration is filed within two weeks.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    The pre-apprenticeship placement problem is a textbook [thin market](../../thin-markets.html) failure: both sides are present, both are actively searching, and neither can find the other because the market between them has no infrastructure.

    What makes this failure particularly wasteful is that public money has already been spent — $10,000 on Marcus's pre-apprenticeship seat — and the return on that investment depends entirely on a matching event that the program has no systematic capacity to produce. The training is an input. The match is the output. Without matching infrastructure, the input is wasted.

    *Marcus, Diane, and Sarah are fictional. The apprenticeship registration requirements, journeyperson ratios, trade classifications, and pre-apprenticeship program structures described are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
