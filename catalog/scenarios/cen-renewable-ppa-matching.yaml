story:
  title: The Off-Take Gap
  status: draft
  blog_slug: ""
  characters:
    - "Natasha - Project Development Director, Alberta wind developer"
    - "Bernard - VP Sustainability, national retail chain with 280 locations across Alberta"
  summary: "An Alberta wind developer whose 48 MW project is stalled in project finance due
    to missing offtake finds a national retailer committed to 100% renewable procurement through
    a grid-zone-matched PPA platform, enabling financial close within 90 days."
  body: |
    ## Act A - The Market Structure

    Every Canadian renewable energy project that requires project financing—which is most of
    them above 10 MW—needs a signed Power Purchase Agreement before the lender will commit
    term debt. The PPA is not optional; it is the cash flow certainty on which the entire
    financial model sits.

    The market for bilateral PPAs in Canada is theoretically functional. In Alberta's
    deregulated power market, there is no regulatory barrier to a generator and an industrial
    buyer contracting directly. The barrier is discovery: the generator does not know which
    Alberta industrial buyers have committed to renewable procurement timelines that would
    justify a 15-year bilateral contract, and the buyers do not know which projects are at
    the stage in development where their offtake commitment would enable financial close.

    ---

    ## Act B - The Story

    **Natasha** has spent three years developing a 48 MW wind project in southern Alberta.
    Environmental assessment is complete. The interconnection agreement is executed. Her
    project finance lender has provided a credit-approved term sheet conditional on a signed
    PPA with a counterparty rated BB+ or better. She has approached four Alberta utilities.
    Three are not buying merchant capacity. One offered a price 18% below the project
    economics. She has 90 days before her interconnection queue position expires.

    **Bernard** is presenting to his board's ESG committee in six weeks. His company committed
    to 100% renewable electricity by 2028 under RE100. Their 280 locations in Alberta consume
    190,000 MWh annually—a load that matches Natasha's expected output almost exactly. Bernard
    has asked two energy brokers to source a renewable PPA. Both came back with utility green
    tariff options, not bilateral contracts. The price premium is 22% above their current rate.
    His budget for renewable procurement caps the premium at 12%.

    Natasha uploads her generator profile to the platform: 48 MW, southern Alberta grid zone,
    expected output seasonality, commissioning date Q2 2027, asking price range. Bernard's
    sustainability team uploads the off-taker profile: consumption 190,000 MWh/year, Alberta
    grid, renewable commitment deadline 2028, credit rating A-, maximum acceptable price premium.
    The platform resolves the seasonal output match—Natasha's wind profile peaks in winter and
    spring; Bernard's consumption peaks in summer with air conditioning load. The platform
    surfaces a storage-smoothing structure using a 4-hour battery co-location that brings
    the profiles into alignment. A PPA term sheet is generated incorporating banker-standard
    Alberta market annexes. They execute a letter of intent within three weeks. Financial
    close follows within 90 days.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Every renewable project that fails to find an offtake partner delays Canadian clean energy
    capacity additions. Every industrial buyer that pays a green tariff premium they could have
    avoided with a bilateral PPA misallocates clean energy budget. The discovery failure has
    real climate consequences. DeeperPoint builds the specification-matched PPA marketplace
    that turns bilateral clean energy procurement from an insider's game into an open market.

    *Characters are fictional. The PPA discovery gap in Canadian renewable markets is
    documented and recognized by the Clean Energy Buyers Association.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
