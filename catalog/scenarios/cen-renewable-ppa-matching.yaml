market_example:
  summary: A structured matching platform connecting independent Canadian renewable energy
    developers with large industrial electricity consumers and commercial real estate operators
    seeking to execute direct bilateral Power Purchase Agreements—bypassing the utility spot
    market and enabling corporate clean energy procurement without the regulatory complexity
    of provincial utility programs.
  problem: "Power Purchase Agreements—long-term bilateral contracts in which a renewable
    energy generator directly supplies a commercial or industrial buyer at a negotiated fixed
    price—are the dominant mechanism through which global corporations achieve their clean
    electricity procurement targets. In Canada, their development is severely constrained by
    provincial electricity market structures. Alberta's deregulated market permits bilateral
    PPAs but the market for connecting independent generators with industrial off-takers is
    fragmented and opaque. Ontario's regulated market allows behind-the-meter and net-metering
    arrangements but the rules are complex and jurisdiction-specific. Saskatchewan, Manitoba,
    and BC all have provincial utility structures that create different PPA access frameworks.
    The result is a market that should work—large industrial electricity consumers (data centres,
    manufacturers, large retailers, municipal governments) seeking 10–20 year clean electricity
    price certainty can in principle contract directly with wind and solar developers—but the
    matching infrastructure to connect them does not exist in structured form. A wind farm
    developer in Alberta with a 48 MW project seeking an industrial off-taker does not have
    a mechanism to discover the 23 companies in their grid region that have publicly committed
    to 100% renewable electricity by 2030 and whose load profile matches the generator's seasonal
    output. The deal that would serve both parties cannot happen because neither party knows the
    other is in the market."
  dominant_forces:
    - "Corporate clean energy procurement targets (RE100, Science Based Targets Initiative)
      are creating mandatory demand for bilateral PPAs among large industrial and commercial
      electricity users—but the market structure for connecting them to Canadian renewable
      developers is undeveloped and jurisdiction-fragmented."
    - "Renewable energy developers need off-take certainty for project financing—lenders require
      a signed PPA before committing capital—creating a matching urgency that the informal
      broker market cannot satisfy at the required speed and specificity."
    - "PPA terms are highly specific to load profile, grid zone, provincial regulatory framework,
      transmission access, and price-indexation structure—generic energy brokers cannot match
      at this level of technical specificity."
    - "Provincial electricity market rules (deregulated vs. regulated, net-metering caps,
      wheeling rules) create jurisdiction-specific deal structures that require specialized
      knowledge to navigate correctly."
  deeperpoint_fit: "KnowledgeSlot encodes the PPA deal structure library: province-by-province
    regulatory frameworks, standard PPA term structures (fixed price, indexed, green certificate
    bundling), load profile requirements for off-take qualification, and financing covenants
    that renewable project lenders impose on PPA counterparties. CoSolvent matches generator
    profiles—capacity MW, output seasonality, grid zone, commissioning date, asking price
    range—against off-taker profiles built from energy consumption data, grid location,
    renewable commitment timelines, and credit rating requirements."
  economic_upside: "A 20-year PPA for a 50 MW wind project represents $150–300M in contracted
    revenue, determining whether the project gets built at all. The Canadian renewable energy
    sector targets 40,000+ MW of new capacity by 2035. Each 1% improvement in PPA matching
    speed and success rate could unlock billions in project financing. Platform revenue via
    subscription for developers and per-PPA execution success fees."
