market_example:
  summary: "Canadian operators in agriculture, construction, outdoor events, and remote
    resource extraction are exposed to weather-driven revenue loss that standard indemnity
    insurance either excludes or prices prohibitively. A matching platform connects these
    thin-insured risk holders with the small pool of parametric and index insurance
    specialists who can structure and place trigger-based coverage at viable premiums."
  problem: "Standard indemnity insurance requires loss adjustment—a physical verification
    that the insured event caused the claimed loss. For weather-driven revenue disruption,
    adjustment is slow, contested, and expensive, which causes insurers to decline the risk
    or price it at levels that are uneconomic for the policyholder. Parametric insurance
    resolves this: coverage triggers automatically when an objectively measured index
    (temperature, rainfall, wind speed, frost date, river gauge level) crosses a defined
    threshold, with no loss adjustment required. The structural problem is that parametric
    insurance design requires specialist capability—defining the index, calibrating the
    trigger, structuring the payout curve, placing the risk with a capital market or
    specialty insurer willing to underwrite index-triggered exposure—that most Canadian
    commercial brokers do not have. A blueberry farm facing frost loss, a construction
    firm facing weather delay on an infrastructure contract, a fly-in fishing lodge facing
    smoke season revenue loss, a craft brewery planning an outdoor festival series—each
    of these has a weather risk that a parametric structure could efficiently transfer.
    None of them know which broker or MGA can design and place parametric coverage for
    their specific weather peril and geography. The result is that they remain uninsured
    or under-insured against the risk that most frequently disrupts their business."
  dominant_forces:
    - "Parametric insurance design requires specialist capability—index definition, trigger
      calibration, payout structuring, capital market placement—that is concentrated in a
      small number of MGAs and Lloyd's specialists, none of whom are visible to the
      agricultural, construction, or remote operations sectors that need them most."
    - "Climate change is expanding the population of Canadian businesses with weather-driven
      revenue risk that the standard indemnity market cannot efficiently insure, creating
      an expanding thin market where demand grows faster than buyer-to-specialist matching
      capacity."
    - "Weather data availability via Environment Canada, NOAA, and private weather networks
      makes objective index design increasingly feasible, but the data-to-product pathway
      requires a specialist intermediary that small and mid-market risk holders cannot
      independently locate or engage."
  deeperpoint_fit: "CommonContext encodes parametric insurance product structures by peril
    type (frost, drought, excess moisture, wind, wildfire smoke), geography, and industry
    sector, along with the weather data sources, index trigger standards, and capital market
    relationships maintained by each specialist broker and MGA. CoSolvent matches the
    risk holder's weather exposure profile—peril, geography, revenue sensitivity, trigger
    preferences—against the specialist's product portfolio and placement capacity. The
    Generative Match Story explains parametric mechanics in terms specific to the buyer's
    operational context, eliminating the education barrier that prevents most buyers from
    understanding what they are purchasing."
  economic_upside: "The global parametric insurance market is projected to exceed $30B by
    2030, growing at 12% annually driven by climate risk expansion. The Canadian market
    for parametric covers in agriculture, construction, tourism, and remote operations
    is estimated at $800M–2.5B in addressable annual premium, currently captured at less
    than 15% of its potential due to matching failures. A platform enabling 20% of uninsured
    parametric demand to find coverage generates $160–500M in placed annual premium, with
    platform revenue via specialist subscription and per-placement coordination fees."

