story:
  title: "The Smoke Season"
  status: draft
  blog_slug: ""
  characters:
    - "Marcus - owner, fly-in fishing lodge, northern British Columbia"
    - "Siobhan - parametric insurance specialist, MGA with Lloyd's wildfire smoke index authority, Vancouver"
  summary: "A northern BC fly-in fishing lodge whose summer season is repeatedly destroyed
    by wildfire smoke—forcing guest cancellations the standard event cancellation policy
    excludes—finds a parametric smoke index policy through a specialist matching platform
    and locks in revenue protection before the next fire season."
  body: |
    ## Act A - The Market Structure

    Wildfire smoke is the defining weather risk for outdoor tourism in British Columbia,
    northern Ontario, and the Yukon. When smoke blankets a region, fishing deteriorates,
    visibility drops, and guests cancel—not because the lodge is destroyed or threatened,
    but because the experience guests paid for has been ruined. Standard event cancellation
    and business interruption insurance covers physical loss to property. It does not cover
    revenue loss caused by smoke. The exclusion is consistent and deliberate: loss adjustment
    for atmospheric degradation is impractical at scale.

    Parametric smoke insurance solves this mechanically. Define an air quality index trigger
    (AQI exceeding 150 for three consecutive days during July and August at the nearest
    Environment Canada monitoring station), define a payout per trigger event ($50,000 per
    qualifying smoke event, maximum two per season), and bind the coverage. No loss
    adjustment. Payout triggers automatically from the government monitoring data. The
    problem is that designing and placing a smoke index policy requires a specialist MGA
    with Lloyd's authority for parametric atmospheric risk — a three-person practice in
    Vancouver that a northern BC lodge operator has no mechanism to locate.

    ---

    ## Act B - The Story

    **Marcus** has operated a fly-in fishing lodge on a remote lake in northern BC for
    eighteen years. His lodge accommodates twelve guests at $6,500 CAD per week for a
    twelve-week summer season — gross revenue potential of $936,000 in a clean year. In
    2021, 2023, and 2024, wildfire smoke caused mass cancellations during peak weeks,
    reducing his revenue by 40–60% in each affected season. His commercial property
    insurer confirmed that smoke-related cancellations are excluded from his business
    interruption policy. He asked two commercial brokers about smoke coverage. Both came
    back empty: no Canadian insurer in their network underwrite smoke revenue loss as a
    primary peril.

    **Siobhan** leads the parametric insurance practice at a Vancouver MGA that has held
    Lloyd's coverholder authority for parametric weather and atmospheric risks since 2019.
    She has placed smoke index policies for twenty-three outdoor tourism operations in BC
    and the Yukon, with trigger designs based on AQI data from Environment Canada's
    continuous monitoring network. None of her clients found her through a commercial
    broker. They found her through industry conferences, word of mouth, and one provincial
    tourism association newsletter. Marcus has attended the same provincial tourism
    conference for twelve years. Their paths have never crossed.

    Marcus describes his risk profile on the specialist platform: outdoor tourism, revenue
    sensitivity to atmospheric visibility and air quality, northern BC geography, summer
    season, prior smoke event losses. Siobhan's MGA profile surfaces: parametric atmospheric
    risk, AQI-indexed triggers, Lloyd's capacity for wildfire smoke events, BC and Yukon
    geographic authority. Marcus contacts her. Within two weeks, Siobhan has designed a
    smoke index policy using the Smithers Environment Canada monitoring station AQI data,
    calibrated the trigger against fifteen years of historical smoke events at the lodge's
    latitude, and presented a bindable quote. Marcus binds a two-year policy before the
    next fire season begins.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    Marcus's risk is not unusual, unquantifiable, or unpriceable. Environment Canada's
    air quality monitoring network generates the objective index data a parametric trigger
    requires. Lloyd's capacity for atmospheric risk exists. The specialist MGA with binding
    authority for this exact risk class is operating in the same province. The market fails
    because the information connecting buyer to specialist — who holds coverholder authority
    for parametric smoke risk in BC — is not searchable, not visible to commercial brokers,
    and not discoverable through the standard insurance purchasing process.

    Every outdoor tourism operator in British Columbia, every outdoor event organizer, every
    remote extraction operation in a fire-prone region faces the same access failure.
    Parametric weather insurance is the most efficient tool for transferring weather-driven
    revenue risk. The market's failure to connect buyers with specialists is not a product
    design problem. It is an information infrastructure problem.

    *Characters are fictional. Wildfire smoke exclusions in standard business interruption
    policies and the parametric insurance access gap for Canadian outdoor tourism operators
    are well-documented. [DeeperPoint](../../marketforge.html) is building the infrastructure
    this story describes.*
