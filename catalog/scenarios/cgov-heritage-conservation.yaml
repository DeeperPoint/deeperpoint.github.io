market_example:
  summary: "Federal and provincial heritage agencies managing designated built heritage properties cannot efficiently identify and retain specialty trades practitioners — lime plasterers, structural stone masons, historic window restorers — whose skills are specific to the construction era and material system of the building requiring intervention."
  problem: "Canada's designated built heritage portfolio — federal heritage buildings, provincial historic sites, national historic sites — requires maintenance and conservation interventions that are incompatible with modern construction techniques and materials. Lime mortar repointing is chemically incompatible with portland cement and must be performed by practitioners who understand historic masonry bond systems. Pre-1940 structural glazing systems require glaziers trained in period-appropriate putty and glass specification. Early twentieth-century plaster systems require plasterers with lime and hair-fibre knowledge that is not part of standard trade certification. The pool of Canadian practitioners with these specific competencies is aging, geographically concentrated, and invisible to heritage property managers who rely on standard contractor directories and standard trade licensing registries — neither of which captures heritage-specific specialty competency."
  dominant_forces:
    - "Participant scarcity — specialty heritage trades practitioners are genuinely rare; the lime plasterer with significant historic building experience is a nationally small cohort, most of whom are approaching retirement age"
    - "Opacity — heritage-specific trade competency is not captured in standard contractor licensing registries, union jurisdiction records, or provincial trade certification databases"
    - "Standards complexity — Parks Canada Standards and Guidelines for the Conservation of Historic Places in Canada specify material and technique requirements that standard construction trades do not routinely apply"
    - "Geographic mismatch — heritage practitioners are often not located near the heritage properties requiring their specific skills, requiring long-distance deployment with associated cost and logistics"
    - "Knowledge loss risk — the retirement of the current generation of specialty heritage trades practitioners without structured knowledge transfer to apprentices represents an irreversible loss to Canadian conservation capacity"
  deeperpoint_fit: "Semantic matching encodes practitioner profiles (specific material system expertise by era, building type, and technique — lime mortar, historic masonry, period glazing, ornamental plaster — along with prior heritage project references, Parks Canada Standards compliance experience, and geographic deployment flexibility) against heritage property manager demand signals (building era, material system, intervention type, Parks Canada Standards compliance requirement, project scale and timeline). KnowledgeSlot curates Parks Canada Standards and Guidelines specifications, provincial heritage property designation frameworks, and historic material system technical bulletins."
  economic_upside: "Poorly specified heritage conservation interventions using inappropriate modern materials cause irreversible physical damage to designated resources and can result in de-designation or loss of heritage character. The cost of incompatible material interventions — lime mortar joints replaced with portland cement, historic wood windows replaced with aluminum — frequently exceeds the cost of competent conservation by a substantial multiple when the damage must be corrected. Better specialty practitioner matching preserves irreplaceable built heritage and protects the economic value of heritage tourism infrastructure."

