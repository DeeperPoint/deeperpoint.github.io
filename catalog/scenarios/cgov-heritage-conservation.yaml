story:
  title: "The Mortar Joint"
  status: draft
  blog_slug: ""
  characters:
    - "François — lime mortar heritage masonry practitioner, Québec City, with forty years of historic masonry experience"
    - "Helen — heritage property manager, federal department responsible for a national historic site in Fredericton, NB"
  summary: "A heritage property manager in Fredericton specifying masonry repointing work on a 1880s sandstone federal building cannot find a lime mortar-competent mason through standard contractor directories — and nearly contracts a modern portland cement application that would have caused irreversible spalling damage."
  body: |
    ## Act A — The Material System Problem

    The single most common heritage conservation error on historic masonry buildings is portland cement repointing. Portland cement mortar is harder than the historic stone or brick it is meant to protect. When the wall moves — thermally, seasonally — the stone cracks rather than the joint. Over decades, portland cement repointing on limestone or sandstone causes progressive, irreversible spalling that no subsequent intervention can fully repair.

    Parks Canada Standards and Guidelines are explicit: historic masonry should be repointed with a lime-based mortar matched to the historic mortar's composition. The standard is published. The reason is well-understood. The challenge is finding a mason who actually knows how to do it.

    Standard masonry contractor licensing does not require or test lime mortar competency. A mason licensed and experienced in modern construction may have never mixed a lime-based mortar. Their default is portland cement because it is what the trade uses. A heritage property manager who specifies "lime mortar" without verifying practitioner knowledge of lime mortar behaviour and application technique may receive portland cement regardless.

    ---

    ## Act B — The Story

    **Helen** is managing a repointing project on a sandstone federal heritage building in Fredericton, constructed in 1882. The building is a designated federal heritage property. Her specification references Parks Canada Standards. It requires lime mortar matched to the historic mortar analysis provided in the condition assessment: a hydraulic lime-to-sand ratio documented from core samples.

    She issued the tender through the standard federal procurement portal. Four responses. She reviewed the contractor submissions. None of them included any reference to lime mortar experience. One submission described their "standard mortar repointing process." Another quoted a portland cement product by name.

    She called two of them. One contractor said they could use lime mortar if she specified the product. When she asked how they would manage the extended cure time and weather sensitivity of hydraulic lime, the conversation indicated they had not worked with the material before.

    She was three weeks from the construction window.

    She registered on the MarketForge heritage specialist platform and entered her demand profile: sandstone masonry repointing, hydraulic lime mortar, Parks Canada Standards compliance, 1880s masonry bond system, New Brunswick project location, contractor or independent practitioner.

    The platform surfaced two profiles. One was a heritage contractor in Halifax with documented sandstone repointing experience on two provincial historic sites. The other was **François**.

    ---

    **François** has spent forty years working on historic masonry buildings in Québec, primarily on limestone and sandstone structures from the French colonial and Victorian eras. He has worked on five Parks Canada sites. He mixes his own mortars from locally-sourced aggregates matched to historic sample analysis. His platform profile documents his material system experience in detail: hydraulic lime, natural cement, specific aggregate matching methodology, historic bond system knowledge including Flemish bond, English bond, and rubble construction.

    Helen sent an outreach request. François confirmed availability for the Fredericton window and proposed a travel arrangement for a four-week engagement.

    The repointing was specified correctly, executed with matched hydraulic lime mortar, and inspected by Parks Canada's regional conservation officer before the construction season closed.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    François was the right practitioner. His competency was real, documented, and verifiable. He was willing to travel from Québec City to Fredericton for a four-week engagement. None of that was discoverable through the standard federal contractor registry — his PGIB registration listed him as a masonry contractor, a category shared by practitioners whose entire experience is modern construction.

    The heritage property management system has no mechanism to distinguish between a mason who has worked with lime mortar on historic sandstone and a mason who has not. That distinction is the difference between conservation and damage. It is not captured in any licensing registry, union jurisdiction record, or contractor directory that Helen could access in the three weeks before her construction window.

    [Thin market infrastructure](../../thin-markets.html) makes material-system-specific competency legible in the matching process — converting "masonry contractor" from a generic procurement category into a specific search that surfaces the forty practitioners in Canada who actually know what they are doing with historic lime mortar.

    *Characters are fictional. Parks Canada Standards and Guidelines for the Conservation of Historic Places in Canada, hydraulic lime mortar specifications, and the federal heritage building designation framework are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
