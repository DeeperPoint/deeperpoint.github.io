market_example:
  summary: "A $40M clean-energy infrastructure contract requires manufacturing capabilities that no single Ontario SMB can provide — precision machined housings, custom electrical enclosures, structural steel subframes, and specialized coatings. Individually, none of the shops can bid. Together, as a dynamically assembled consortium, they can rival a Tier-1 factory. The cold-start problem: assembling the consortium takes longer than the RFP window."
  problem: "Large industrial procurement contracts — government infrastructure, Tier-1 supply chains, clean energy programs — routinely specify integrated manufacturing capability that exceeds what any single SMB can deliver. A $40M contract for battery storage enclosure systems might require five-axis precision machining, custom electrical enclosure fabrication, structural steel subframes, powder coating certified to AAMA 2605, and project-level quality documentation (ISO 9001, CSA Z462). Any one shop has two or three of these capabilities; none has all five. The theoretical solution — consortium bidding — fails in practice because assembling a consortium of unknown shops with unverified complementary capabilities, negotiating teaming agreements, and submitting a coherent RFP response within a 30-day window is impossible without pre-existing relationships. Large integrators win these contracts by default, not because they are more capable, but because they solved the coordination problem through vertical integration."
  dominant_forces:
    - "Cold-start problem — assembling a consortium from shops that have never worked together requires relationship-building time that RFP windows don't allow"
    - "Capability fragmentation — complementary capabilities are spread across dozens of shops with no registry linking them"
    - "Trust deficit — teaming with an unknown shop on a large contract creates performance and liability risk that shops won't accept without verified capability"
    - "Coordination complexity — consortium bidding requires integrated project management, unified quality documentation, and single-point customer accountability"
    - "Opacity — no platform maps the full manufacturing capability stack needed for a specific contract type against available, verified shops"
  deeperpoint_fit: "KnowledgeSlot holds the capability taxonomy for the target contract vertical (aerospace, clean energy, defence, infrastructure) — mapping required certifications, process capabilities, and quality standards against registered shop profiles. Semantic matching assembles a capability-complete consortium from verified member profiles in hours rather than weeks. The Trusted Intermediary Protocol manages teaming agreement templates and performance guarantee structures. The Generative Match Story produces a consortium capability brief that presents the assembled team as a coherent Virtual Tier-One — unified quality management, integrated project schedule, single-point accountability — positioned to compete directly against vertically integrated primes."
  economic_upside: "Ontario's manufacturing SMBs collectively have the capability to compete for contracts currently captured by large integrators and offshore primes. The provincial government's clean energy and industrial transition programs are creating a pipeline of $500M–$2B in annual manufacturing procurement. If AI-mediated consortium assembly enables 10% of that procurement to flow to SMB consortia rather than vertically integrated primes, the economic impact to Ontario manufacturing is $50–$200M annually — with proportional employment effects in communities that have lost anchor employers."

