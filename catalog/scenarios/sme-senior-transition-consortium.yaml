market_example:
  summary: "Small home care agencies, accessibility renovation contractors, elder law practitioners, geriatric care managers, and mobility equipment providers cannot efficiently assemble the comprehensive senior life transition packages that families managing a parent's aging need—forcing families to coordinate multiple disconnected providers through an emotionally and administratively overwhelming process."
  problem: "When an aging parent reaches the inflection point where living arrangements, financial management, legal documentation, home accessibility, and care support all require attention simultaneously, families face a coordination burden that most cannot manage well. The geriatric care manager who assesses care needs doesn't know the accessibility renovation contractor. The elder law lawyer who prepares the power of attorney doesn't have a relationship with the financial planner who needs to review the will. The home care agency doesn't coordinate with the mobility equipment provider about home assessment. Each expert handles their piece competently and in isolation. The family member coordinating between five separate professionals—often from another city, often while managing their own career and household—is the informal integration layer for a process that would benefit from coordinated delivery. No single small firm covers the full scope of elder transitions. Large senior living chains cover some of it but in ways that create dependency on their own residential products. The coordinated multi-provider team that would most benefit families does not self-organize because the providers have no discovery mechanism for finding compatible partners in their geographic market."
  dominant_forces:
    - "Offering complexity — a genuinely comprehensive elder transition package requires geriatric care management, home accessibility assessment and renovation, elder law (POA, will, guardianship), personal financial planning review, home care staffing, and mobility equipment assessment—each with distinct professional regulation"
    - "Professional regulation boundaries — regulated professionals (lawyers, financial planners, regulated health professionals) cannot be part of a consortium that creates conflicts of interest or referral fee structures; the consortium model must respect professional independence"
    - "Emotional context — families navigating a parent's declining independence are under significant emotional stress; a complex consortium engagement process compounds the burden the consortium is meant to reduce"
    - "Geographic proximity — home care, accessibility renovation, and mobility equipment assessment all require in-person service at the parent's home; consortium partners must serve the same geographic area"
    - "Trust — families are making decisions about a parent's safety and finances; the consortium's credibility depends on demonstrated professional standards and verifiable credentials from all partners"
  deeperpoint_fit: "Semantic matching encodes provider profiles (service category, professional credential and regulatory standing, geographic service area, senior care context experience, consortium partnership experience, referral fee compliance standing) against family opportunity signals (parent's location, current situation and trigger event, service components needed, family coordination capacity, timing). The consortium engagement framework respects professional independence boundaries while providing families with a coordinated care navigator who serves as the single point of contact without creating regulated professional conflicts."
  economic_upside: "A poorly coordinated elder transition produces significant downstream costs: preventable care crises when home modifications are delayed, financial planning errors when legal and financial advisors are not aligned, safety incidents when mobility equipment arrives before home modifications are complete. Better coordinated multi-provider delivery reduces these downstream costs while producing a substantially better family experience. The elder transition services market in Canada is growing rapidly as the boomer generation ages through the 75–85 window where most elder care decisions are made."

sponsor_opportunities:
  - title: "Senior Transition Consortium Matching Platform (SaaS)"
    type: saas
    revenue_model: "Annual provider subscription ($600–$1,500/year, by profession); family engagement fee ($200–$500 per matched consortium initiation)"
    strategic_logic: "The family triggers the consortium need—usually at a crisis moment (a fall, a hospital discharge, a cognitive decline diagnosis). A platform that is known to families and to the healthcare providers (family physicians, hospital discharge planners) who refer families to elder care resources is the distribution channel. Positioning with hospital social work departments and family physician practices creates referral traffic."
    recurring: true

  - title: "Elder Transition Care Navigator Service"
    type: managed-service
    revenue_model: "Per-family navigator engagement ($1,200–$3,000), covering twelve weeks of care coordination across all consortium partners"
    strategic_logic: "The single most valuable service in an elder transition is a care navigator who coordinates across all professional domains on behalf of the family—scheduling, documentation, progress tracking, family communication. A professional care navigator service that sits above the consortium and manages family communication removes the administrative burden that makes uncoordinated multi-provider elder care so damaging."
    recurring: false

  - title: "Elder Transition Readiness Assessment Service"
    type: managed-service
    revenue_model: "Per-family readiness assessment ($300–$500); clinical assessment (where regulated, billed directly)"
    strategic_logic: "Families often do not know which services they need until they have an assessment. A standardized elder transition readiness assessment—covering home safety, legal documentation status, financial planning gaps, care needs, and mobility—produces a service roadmap that enables the consortium to be assembled around the family's specific needs rather than a generic package."
    recurring: false

story:
  title: "The Fall That Changed Everything"
  status: published
  blog_slug: ""
  characters:
    - "Sarah — adult daughter in Calgary; her 79-year-old mother has just been discharged from hospital after a hip fracture, returning to her home in Edmonton"
    - "Paula — owner, a small elder care management consultancy, Edmonton"
  summary: "A Calgary daughter coordinating her mother's post-fracture return home faces five separate provider relationships that no one is coordinating—and the gap between each service nearly results in a preventable readmission."
  body: |
    ## Act A — The Discharge Call

    The call came on a Tuesday afternoon. Sarah's mother, Dorothy, 79, had slipped on ice in her driveway and fractured her hip. She had been in hospital for 11 days. She was ready for discharge. The discharge planner told Sarah that her mother could not safely return home without: a home care assessment and support plan, grab bars and a shower seat, a raised toilet seat, a review of her medication management, and someone to remove the front porch step and build a ramp.

    The discharge planner gave Sarah four phone numbers: home care intake, the AISH mobility equipment program, an occupational therapist for a home safety assessment, and a general recommendation to "check online" for contractors who do accessibility renovations.

    Sarah lives in Calgary. Her mother lives in Edmonton.

    ---

    ## Act B — The Story

    Over the following two weeks, Sarah made eleven phone calls and sent twenty-three emails. Home care was arranged—a PSW three mornings a week. The occupational therapist came out and produced a home modification report. The mobility equipment program approved a shower seat and grab bars but required the OT report first, then their own assessment, then an order to a supplier, then a delivery appointment.

    The ramp: Sarah found a general contractor who could do it in a week but needed the OT report to understand the required rise-to-run slope. The OT report referred to a "grab bar specification" that the contractor couldn't interpret without calling the OT back.

    The elder law lawyer Dorothy needed to update her power of attorney—her existing document wasn't current—never got called because Sarah ran out of coordination bandwidth by week two.

    On day 19, Dorothy slipped in the bathroom attempting to use the tub that the grab bars hadn't yet been installed to protect. She was not seriously injured. Sarah flew to Edmonton that weekend, emotionally exhausted, and spent two days trying to accelerate the installation timeline.

    ---

    **Paula's** elder care management firm had worked with families in exactly this situation twelve times in the past two years. She knew the OT who wrote the home safety reports. She knew the accessibility renovation contractor who could interpret OT reports without a callback. She had a relationship with a home care operator whose PSW scheduling was compatible with her coordination timeline. She knew the elder law practice that prioritized discharge-triggered POA updates.

    She was not in any directory that the hospital discharge planner knew to recommend.

    She had registered on the MarketForge senior transition consortium platform the previous month. Her profile was connected to four compatible providers serving Edmonton's west end—OT, accessibility contractor, home care operator, elder law—all of whom had consortium partnership experience with her firm.

    On a different hypothetical Tuesday, Sarah would have found Paula's consortium through a hospital discharge planning referral to the platform. Paula would have been on the phone with Sarah within 24 hours. The OT assessment, the accessibility renovation, the mobility equipment coordination, and the POA update would have been coordinated through one calendar and one weekly family update call.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Paula's consortium existed. All five service components Dorothy needed were covered by providers who already had working relationships with each other. The same coordination burden that Sarah experienced for three emotionally draining weeks could have been managed by a professional navigator—someone who does this every week and knows every phone number.

    The gap was that Sarah had no way to find Paula. The discharge planner had no way to refer Sarah to a coordinated consortium. The elder care market in Edmonton, as in every Canadian city, is organized by individual service category, not by assembled transition support capacity.

    [Thin market infrastructure](../../thin-markets.html) makes the assembled consortium findable at the moment of the discharge call—when the family's need is acute and the coordination window is narrow.

    *Characters are fictional. The post-fracture hospital discharge process in Alberta, AISH mobility equipment program, and occupational therapy home safety assessment requirements are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
