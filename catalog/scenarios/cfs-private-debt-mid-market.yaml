market_example:
  summary: A structured origination platform matching Canadian mid-market companies—those
    with annual revenues of $10–150M seeking $3–30M in structured debt—with the growing
    pool of private credit managers, BDC-affiliated funds, and specialty lenders whose
    mandates target exactly this borrower profile but who lack efficient deal origination
    beyond their existing relationship networks.
  problem: "Canada's mid-market financing gap is one of the most documented and least
    solved problems in Canadian business finance. Companies with annual revenues between
    $10M and $150M and financing needs between $3M and $30M fall into a structural dead zone.
    The chartered banks serve this segment through their commercial lending programs, but
    bank credit approval timelines (8–16 weeks for a structured facility), covenant rigidity,
    and collateral requirements routinely fail companies in transition: a software company
    acquiring a competitor with minimal hard asset collateral, a family business funding
    a management buyout, a growing manufacturer bridge-financing a major customer contract.
    At the same time, the private credit market—which has grown enormously in Canada since
    2018—has largely deployed capital into deals above $30M, where the transaction economics
    support the due diligence cost. The $3–30M private debt segment is served by BDC
    subordinate financing, a small number of regional specialty lenders, and community
    development finance institutions. None of these lenders have efficient origination
    mechanisms below the major advisory firm coverage threshold. A company that needs $8M
    in unitranche debt to fund an acquisition cannot access the private lender most suited
    to their credit profile without either retaining a corporate finance advisor ($150,000+
    fee) or already knowing the right lender from previous relationship history. The result
    is that transactions that would be funded easily if the matching existed—because the
    credit is sound, the lender has the mandate, and the terms would be acceptable to both
    parties—simply do not happen on the required timelines."
  dominant_forces:
    - "Bank commercial lending programs serve the mid-market poorly: covenant rigidity,
      collateral requirements, and 8–16 week approval timelines routinely fail companies
      in rapid transition, acquisition mode, or with asset-light business models."
    - "Private credit mandates targeting the $3–30M deal range are concentrated among
      BDC subordinate finance, regional specialty lenders, and CDFIs whose combined origination
      capacity far exceeds their deal flow from informal referral networks."
    - "Corporate finance advisory fees ($100,000–$250,000+) for financing mandates below
      $30M are often economically irrational for the borrower, creating a structural access
      barrier to the advisory-intermediated private debt market."
  deeperpoint_fit: "CommonContext encodes private debt term structures by deal type: unitranche,
    mezzanine, subordinate financing, revenue-based financing, and asset-based lending—with
    covenant and pricing benchmarks for each. CoSolvent matches borrower profiles—revenue size,
    EBITDA, debt purpose (acquisition, growth, working capital), asset base, sector, and
    desired timeline—against lender mandate profiles built from deal size range, sector
    preferences, security requirements, and current deployment capacity."
  economic_upside: "The Canadian mid-market private debt gap is estimated at $5–15B in unmet
    credit demand annually. Platform revenue via a 0.5–1.5% origination fee on matched and
    funded transactions captures significant value at a fraction of traditional advisory cost.
    BDC, provincial economic development agencies, and credit unions are natural government-aligned
    sponsors for a platform that demonstrably improves SME capital access."
