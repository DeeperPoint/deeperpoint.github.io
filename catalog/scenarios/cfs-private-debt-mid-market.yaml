  body: |
    ## Act A - The Market Structure

    The middle of Canada's business lending market is a void that everyone acknowledges
    and nobody has efficiently filled. Below $3M, community banks and credit unions serve
    borrowers well. Above $30M, investment banks and major private credit managers compete
    vigorously. Between $3M and $30M—the unitranche, the mezzanine, the subordinate growth
    facility—companies are structurally underserved.

    The solution exists in theory: dozens of Canadian private credit managers, regional
    specialty lenders, and BDC subordinate financing programs are specifically mandated to
    serve this range. The problem is origination. These lenders rely on referrals from
    accountants, lawyers, and bank relationship managers. The referral network is slow,
    relationship-dependent, and opaque. A company that shows up at the wrong lender's door—
    because that lender was the one their accountant knew—gets declined not because their
    credit is wrong but because the lender's mandate doesn't fit. The lender who would fund
    them never knew they were looking.

    ---

    ## Act B - The Story

    **Miriam** runs a 65-person B2B SaaS company generating $18M in ARR with 78% gross
    margins and a competitive acquisition opportunity. An acquisition target—a smaller
    competitor with $6M in ARR—is available at a price that works, but only if she can
    close in 60 days. She needs $9M in acquisition debt. Her bank has offered $4M against
    a personal guarantee secured against her home. Two private equity firms want control.
    She needs debt, not equity. Her corporate lawyer referred her to one private lender.
    That lender doesn't do SaaS—their collateral requirements assume hard assets.

    **Sebastien** manages a $200M technology-focused private credit fund. His mandate is
    $5–15M unitranche facilities to recurring-revenue technology companies. He is currently
    70% deployed and actively originating. His last three deals came through one investment
    bank relationship. He needs four more transactions this calendar year and has no
    origination pipeline beyond his existing introductions.

    Miriam uploads her company profile to the platform: sector (B2B SaaS), ARR, gross margin,
    financing need ($9M unitranche), purpose (acquisition), required close timeline (60 days),
    collateral (recurring revenue pledge, no hard assets). Sebastien's fund surfaces with
    matching sector mandate, deal size range, and timeline capability. The platform generates
    a deal profile aligned to unitranche market pricing for recurring-revenue SaaS. Miriam
    sends her data room access within 24 hours. Sebastien issues a term sheet in two weeks.
    The acquisition closes on day 55.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The mid-market private debt gap is not caused by a shortage of lenders or a shortage of
    creditworthy borrowers. It is caused by an origination system that depends on relationship
    referrals moving through slow, informal networks. DeeperPoint builds the deal origination
    platform that connects creditworthy mid-market borrowers directly with the lenders whose
    mandates they satisfy—at the speed that business situations require.

    *Characters are fictional. The Canadian mid-market financing gap is documented extensively
    by BDC research and the Canadian Federation of Independent Business.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
