market_example:
  summary: "Independent galleries outside Toronto, Montreal, and Vancouver seeking
    emerging visual artists whose medium, aesthetic, and career stage match
    their programming cannot discover artists beyond their immediate geographic
    network, while emerging artists in secondary cities and rural communities
    have no systematic path to gallery representation."
  problem: "Gallery representation is the primary mechanism by which visual artists
    build sustainable careers. But the matching between emerging artists and
    independent galleries is almost entirely driven by geography and personal
    networks. An independent gallery in Halifax programming a show on
    contemporary textile art needs to find artists working in that medium
    whose aesthetic aligns with the gallery's curatorial identity — but the
    gallery director's discovery process is limited to studio visits in Nova
    Scotia, submissions received through open calls (which generate hundreds
    of irrelevant applications), and referrals from art school faculty she
    already knows. An emerging textile artist in Thunder Bay who graduated
    from Lakehead's visual arts program and has been exhibiting in artist-run
    centres for three years is effectively invisible to the Halifax gallery.
    She does not have a commercial gallery website. Her work is documented on
    Instagram — alongside 400,000 other artists using the same hashtags.
    Ontario Arts Council exhibition grants list her name but not her medium,
    aesthetic, or career trajectory. The gallery defaults to artists it
    already knows. The artist continues exhibiting in artist-run centres
    without the commercial gallery relationship that would sustain her practice."
  dominant_forces:
    - "Aesthetic evaluation opacity — visual art quality and gallery fit
      are evaluable only through seeing the work; text descriptions and
      thumbnails are insufficient for curatorial decision-making"
    - "Geographic network concentration — gallery directors discover
      artists through studio visits, local art school connections, and
      regional artist-run centres, creating a 200 km discovery radius"
    - "Open call noise — the standard discovery mechanism (open
      submissions) generates hundreds of applications, most irrelevant,
      making careful evaluation of each submission impractical"
    - "Career stage mismatch — emerging artists lack the CV markers
      (solo shows, reviews, collection acquisitions) that galleries use
      as quality signals, creating a chicken-and-egg barrier"
  deeperpoint_fit: "Semantic matching encodes artist profiles (medium,
    aesthetic vocabulary from curatorial statements and portfolio image
    analysis, exhibition history with venue type classification, grant
    history, career stage, geographic location, price range) against gallery
    demand signals (curatorial identity, programming themes, medium
    preferences, price tier, geographic diversity goals). Portfolio image
    analysis surfaces aesthetic alignment beyond keyword matching."
  economic_upside: "Canada has approximately 600 commercial art galleries and
    2,000+ artist-run centres. Annual gallery sales of Canadian contemporary
    art are estimated at $200–400M. A platform that improves the
    gallery-to-emerging-artist matching for even 10% of galleries generates
    $2–4M in incremental gallery sales and measurably extends gallery
    careers for artists outside major urban centres."

