market_example:
  summary: "Counsel litigating cases involving highly technical matters — biomechanical failure, AI system liability, environmental contamination — cannot efficiently identify credentialed testifying experts who combine deep subspecialty knowledge with actual courtroom qualification history, forcing costly cross-border searches and last-minute substitutions."
  problem: "Civil litigation involving technical subject matter — patent claims, product liability, professional negligence, environmental damage — requires expert witnesses who satisfy two simultaneous requirements: genuine subspecialty depth in the technical domain, and demonstrated qualifiability as an expert witness in Canadian courts. These requirements are maintained by different institutions and indexed in different directories. A materials engineer with twenty years of industrial failure analysis may never have testified; a professional engineer with a long expert witness record may be a generalist. Counsel searches through referral networks, legal directories, and engineering society caches — all of which conflate the professional credential with the expert witness qualification. Cases are delayed waiting for expert reports. Experts are retained and later found to have conflict-of-interest exposure to one of the parties. The narrower the technical subspecialty, the smaller the Canadian expert population, and the harder the search."
  dominant_forces:
    - "Participant scarcity — testifying experts who combine subspecialty technical depth with actual Canadian court qualification are genuinely rare in narrow technical domains"
    - "Dual credential opacity — subspecialty technical expertise and expert witness qualification history are stored in non-overlapping directories with no mechanism to cross-reference them"
    - "Conflict-of-interest exposure — experts in small technical communities have prior professional relationships with parties, counsel, or previous cases that create disqualification risk if not pre-screened"
    - "Case timing constraint — expert report deadlines are set by court rules; a failed expert recruitment late in the litigation cycle causes adjournment and litigation cost escalation"
    - "Offering complexity — matching requires alignment on technical subspecialty, jurisdiction-specific court qualification, liability insurance standing, conflict-of-interest declaration, and availability for report timeline"
  deeperpoint_fit: "Semantic matching encodes expert profiles (technical subspecialty by domain, qualification history by court level and province, report methodology type, liability insurance standing, conflict-of-interest disclosure template) against counsel demand signals (case domain, technical issue focus, required jurisdiction, trial date, report deadline, opposing expert known). Confidential initial matching allows conflict screening before case identity is disclosed."
  economic_upside: "Expert witness fees in complex Canadian civil litigation range from $15,000 to $150,000+ per engagement depending on report complexity and cross-examination preparation. Trial delays caused by failed expert recruitment cost parties $50,000–$500,000 in added litigation expense. A matching platform that reduces failed recruitment and conflict-of-interest adjournments generates substantial value relative to a subscription and per-match fee structure. The Canadian civil litigation market exceeds $5 billion annually in legal fees alone."

