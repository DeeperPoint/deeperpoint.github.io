market_example:
  summary: "Law firms, clinic lawyers, and solo practitioners willing to do pro bono or reduced-fee work for social enterprises and nonprofits exist — but bar association clearinghouses are local, technology-primitive, and match only on rough legal category, not the specific intersectional expertise a social venture actually needs."
  problem: "Social enterprises operating with minimal cash have acute access-to-legal-services problems: incorporation, IP protection, employment contracts, commercial agreements, regulatory compliance. Qualified attorneys willing to do pro bono or low bono work for social enterprises exist — motivated by impact, bar association requirements, or career development. The organizations that need them exist. Neither side finds the other efficiently because matching friction is acute: bar association clearinghouses are local and primitive, matching only on rough legal category, not on the specific intersectional expertise a social venture actually needs."
  dominant_forces:
    - "Participant scarcity — the pool of attorneys with both the relevant expertise and willingness to commit pro bono capacity at any given time is small and fluctuating"
    - "Strategic information withholding — attorneys don't advertise pro bono availability; organizations don't disclose sensitive legal needs broadly before establishing trust"
    - "Cognitive overload — organizations needing help may not know what kind of legal help they need (e.g., an immigration nonprofit also needs cooperative corporate structure advice)"
    - "Trust deficit — the attorney needs to vet engagement legitimacy and scope manageability; the organization needs to assess actual competence, not just good intentions"
    - "Opacity — no platform aggregates available pro bono legal capacity by specialty across the Greater Toronto Area social sector"
  deeperpoint_fit: "Semantic matching encodes legal specialty, jurisdiction, organizational type, relevant legislation, language capability, and available capacity. The trusted intermediary protocol protects sensitive organizational details during the matching phase — the organization's specific legal situation is not disclosed until the attorney has been matched and consented to receive details. KnowledgeSlot curates pro bono hour requirements, legal aid eligibility thresholds, Ontario Not-for-Profit Corporations Act, Registered Charity Act obligations, and law school clinical program availability. Facilitator roles accommodate student legal aid programs and clinical faculty supervisors."
  economic_upside: "The 'justice gap' in the nonprofit and social enterprise sector is estimated at billions of dollars in unmet legal need annually in Canada. Social ventures that cannot obtain basic legal infrastructure — incorporation, IP, contracts — cannot scale, cannot access grants that require registered status, and cannot protect their models from appropriation. Each successful legal match can unlock organizational growth worth 10–100x the legal services value."

