market_example:
  summary: "Canadian community colleges and universities offering micro-credential and Prior Learning Assessment and Recognition (PLAR) pathways cannot reach the immigrant professionals who need them most. Conversely, recently arrived professionals with partial Canadian credential equivalency cannot navigate the opaque Canadian recognition landscape. A matching platform connects prior learning to recognition pathways faster and at lower cost."
  problem: "Canada's Prior Learning Assessment and Recognition (PLAR) system allows adults with informal or internationally acquired knowledge to earn credit toward Canadian academic qualifications — in principle. In practice, the system is fragmented, inconsistent across institutions, poorly publicized, and navigated almost exclusively through personal referral. Immigrant professionals who would qualify for partial credit toward Canadian engineering, nursing, accounting, or trades qualifications either do not know PLAR exists or do not know which institution's PLAR process is appropriate for their specific credential background. Meanwhile, colleges and universities with PLAR capacity often run those programs at under-utilization — funded, staffed, and empty — because they cannot reach the population most likely to benefit from them. Micro-credential programs designed for professional upskilling face the same visibility problem: the right people cannot find the right programs."
  dominant_forces:
    - "Information asymmetry — Immigrant professionals do not know what PLAR pathways exist or which are appropriate for their specific background; institutions do not know which immigrant professionals are eligible for their programs"
    - "Navigation complexity — The PLAR landscape is fragmented across 200+ post-secondary institutions, each with different processes, fees, discipline coverage, and outcomes"
    - "Trust deficit — Immigrant professionals are uncertain whether a PLAR institution will actually recognize their foreign experience or simply decline after charging an assessment fee"
    - "Discovery failure — No mechanism connects an immigrant with a specific professional background to the specific PLAR or micro-credential pathway most likely to produce a successful outcome"
    - "Language barrier — PLAR documentation requirements (portfolio assembly, competence statements, credential translation) are daunting in a second language without guidance"
  deeperpoint_fit: "CoSolvent builds applicant profiles capturing home-country credential, professional domain, years of experience, Canadian credential goal, language of instruction preference, and geographic or online format flexibility. Institutional profiles capture PLAR disciplines offered, assessment methodology, credit outcomes, timeline, fees, and success rate for specific applicant backgrounds. The matching engine surfaces the highest-probability PLAR or micro-credential pathway for each applicant profile — not the most prominent institution, but the most appropriate one. KnowledgeSlot carries PLAR portfolio development guides by professional domain (engineering, nursing, trades, accounting), credential translation resources, and a curated glossary of Canadian institutional terminology in 20 languages."
  economic_upside: "Canada spends over $1B annually on immigrant settlement and skills recognition programs. IRCC-funded prior learning assessment supports have historically reached less than 5% of immigrant professionals who would qualify. If the platform connects 20,000 additional immigrants per year to appropriate PLAR and micro-credential pathways — at an average credential-acceleration value of $18,000 per person in career earnings — the social return is $360M annually. Platform revenue: matching fee ($75–200 per applicant match), portfolio preparation guided service ($400–$800 per portfolio), institutional subscription for PLAR program promotion and applicant intake management."

