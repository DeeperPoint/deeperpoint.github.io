    type: managed-service
    revenue_model: "Annual partnership contract with IRCC-funded settlement organizations ($30,000–$100,000/year). Provides PLAR matching and portfolio support services to their immigrant professional client caseload."
    strategic_logic: "Settlement organizations are the primary touchpoint for newly arrived immigrant professionals. They want PLAR resources but lack the institutional knowledge to navigate 200+ college systems. A managed matching service integrated into their case management workflow is a natural partnership."
    recurring: true

  - title: "Micro-Credential Discovery Commerce"
    type: commerce-extension
    revenue_model: "Enrollment referral fee from micro-credential providers for qualified leads delivered through the platform (5–10% of tuition). Applicable to employer-sponsored upskilling programs where the platform matches immigrants with specific micro-credential gaps to relevant programs."
    strategic_logic: "Micro-credential programs need to find qualified enrollees who will complete them successfully. The platform's applicant profiles — with verified professional backgrounds and clear credential goals — are exactly the enrollee micro-credential programs want."
    recurring: true

story:
  title: "The Credit She Already Earned"
  status: draft
  blog_slug: ""
  characters:
    - "Olena Marchenko - registered nurse from Kyiv, landed in Hamilton 2022"
    - "PLAR Coordinator Isabel Faria - Mohawk College School of Nursing"
    - "Olena's cohort - six Ukrainian nurses at the same job fair"
  summary: "Olena has a Ukrainian nursing degree, five years of ICU experience, and a Canadian LPN designation that took fifteen months. What she didn't know: Mohawk's PLAR process would have given her twelve credits toward the RN bridging program immediately — cutting her qualification timeline by a year. The platform matches her with the right pathway before she starts the process, not after."
  body: |
    ## Act A - The Market Structure

    Canada recruited aggressively for nurses during the pandemic. In its wake, Canada has
    more internationally trained nurses trying to navigate recognition than it has PLAR
    coordinators to serve them. The recognition landscape for nurses is particularly fragmented:
    the National Nursing Assessment Service (NNAS) governs initial credential assessment,
    then provincial colleges govern registration, then specific bridging programs govern the
    additional training — each with different timelines, fees, and outcomes.

    Immigrant nurses who navigate this landscape efficiently — finding the right bridging
    program, using PLAR to reduce their required course load, completing on the fastest
    pathway — enter the Canadian workforce a year or more ahead of those who navigate it poorly.
    The difference is almost entirely information: who you know, which program coordinator
    took your call, which settlement organization happened to know about a specific PLAR
    option.

    This is a pure market failure. The credential and the program both exist. The pathway
    between them is invisible.

    ---

    ## Act B - The Story

    **Olena Marchenko** graduated from the Bogomolets National Medical University nursing
    program in 2017 and spent five years in the Kyiv City Clinical Hospital's ICU. She arrived
    in Hamilton in 2022 through the Canada-Ukraine emergency pathway. Her NNAS application
    was processed in four months — faster than average. She was directed to an LPN bridging
    program. She completed it in fifteen months.

    She now holds a Canadian LPN designation and works at Hamilton Health Sciences. She wants
    to become a Registered Nurse. The bridging program from LPN to RN takes two years at Mohawk.

    What she did not know when she started: Mohawk's PLAR program would have assessed her
    Ukrainian nursing credentials plus her ICU experience and awarded her credit for an
    estimated twelve of the LPN program's required units — effectively compressing her LPN
    pathway to eight months. She spent seven additional months in a program she was already
    past, paying tuition and forgoing RN-level income.

    She did not know about the Mohawk PLAR program because no one in her settlement journey
    mentioned it. Six other Ukrainian nurses from her settlement cohort had the same experience.

    **Isabel Faria** at the Mohawk PLAR office receives matched applicant referrals now through
    the platform. She has processed 23 nursing PLAR applications in the past two months —
    compared with six in the same period last year. The applications arrive pre-profiled:
    home country credential, specialty, years of experience, NNAS assessment status, and
    target program. Her intake time per applicant has dropped by 60%.

    When Olena registers for her RN bridging program, the platform identifies her for a PLAR
    assessment in three of the RN bridging units based on her documented ICU specialization.
    Isabel reviews her profile. She contacts Olena within three days.

    The PLAR assessment gives Olena credit for three bridging units on the first try — saving
    one semester.

    ---

    ## Act C - Why This Market Stays Broken Without Infrastructure

    The PLAR program existed when Olena arrived. Her credentials were clearly sufficient.
    The pathway was already funded. The settlement organization that worked with her had
    never connected a client to Mohawk's PLAR office — not because they didn't want to,
    but because they didn't know to, and because Mohawk's PLAR office had no mechanism
    to reach settlement organizations systematically.

    Canada is investing in credential recognition. The investment is not getting to the people
    it was designed for — because the information infrastructure to connect the right person
    to the right pathway does not exist.

    Seven nurses spent seven extra months in a program they had already mastered. The Canadian
    health system waited seven extra months for seven nurses it needed. Both things are true.
    Both are traceable to a matching failure.

    *Characters are fictional. Mohawk College's PLAR program, NNAS assessment processes,
    the Canada-Ukraine emergency pathway, and the credential recognition challenges facing
    internationally trained nurses in Canada are real.
    [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
