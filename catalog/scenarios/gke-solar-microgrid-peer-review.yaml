market_example:
  summary: "African engineering teams designing community solar microgrids with battery storage and hybrid inverter systems — teams with strong local context and implementation experience — cannot efficiently reach electrical engineers in developed countries who can provide independent technical peer review of designs before commissioning."
  problem: "Sub-Saharan Africa is home to some of the world's most innovative solar microgrid deployments. Engineering teams at African energy companies, NGOs, and government agencies are designing and building systems of genuine technical sophistication — multi-bus DC architectures, battery state-of-health monitoring, load management automation for productive use equipment. These engineers have context that their international counterparts lack: the actual load profiles of rural productive use enterprises, the dust and humidity conditions that affect panel degradation curves, the maintenance skill levels available in the communities they serve. What they sometimes cannot access easily is an independent second set of eyes from an electrical engineer who has designed similar systems at scale — someone who might notice a protection coordination gap, a battery sizing assumption that doesn't survive a cloudy season, or an inverter stacking configuration that creates stability issues under intermittent load. International peer review is standard practice in engineering at scale in the developed world; access to that peer review does not require being at the same institution or in the same country."
  dominant_forces:
    - "Opacity — African energy engineering teams with draft designs cannot efficiently signal their specific technical review need to engineers in developed countries who are willing to provide it"
    - "Offering complexity — meaningful peer review requires the reviewer to understand the specific system architecture, the technology stack, the local context constraints, and the design intent before their review has value"
    - "Trust and liability — an engineer providing peer review needs a structured engagement framework that is clear about the nature of the review (advisory, not certifying) and protects both parties appropriately"
    - "Time zone and collaboration logistics — an ad hoc collaboration across time zones without structured document exchange protocols produces poor review quality"
    - "Institutional gatekeeping — formal technical advisory programs run through development banks and bilateral agencies are slow, bureaucratic, and oriented toward large infrastructure projects rather than community-scale innovative deployments"
  deeperpoint_fit: "Semantic matching encodes design team profiles (system architecture type, technology stack by inverter and battery manufacturer, grid topology, load profile category, design stage) against peer reviewer profiles (electrical engineering specializations, inverter and battery technology experience, microgrid architecture experience, available review hours, engagement format preference). The structured document exchange protocol ensures that reviewers receive complete design packages and return structured written comments, creating accountability and documentation for both parties."
  economic_upside: "A commissioning failure on a community solar microgrid — a protection coordination failure that damages inverters, a battery sizing error that produces cycle degradation within the first year, a ground fault that creates safety risk — can set a community's energy access program back two to three years and cost $50,000–$200,000 in remediation. A peer-reviewed design that catches these issues before commissioning costs nothing more than reviewer time. Better peer review access extends the reach of high-quality technical standards to systems designed and built outside the institutional networks where peer review normally circulates."

sponsor_opportunities:
  - title: "Microgrid Design Peer Review Platform (SaaS)"
    type: saas
    revenue_model: "Annual subscription per engineering organization ($600–$2,500/year, sliding scale by organization type and size); reviewer profile maintenance (free for volunteer reviewers)"
    strategic_logic: "Bilateral energy development agencies, multilateral climate finance institutions, and foundations funding energy access programs have a direct stake in design quality for the projects they fund. An institutional subscription model where funders provide platform access to their grantees and portfolio organizations creates revenue while improving the technical quality of funded programs."
    recurring: true

  - title: "Structured Review Package and Technical Report Service"
    type: managed-service
    revenue_model: "Per-review package preparation and report structuring ($250–$600); annual organization subscription for standing review access ($800/year)"
    strategic_logic: "The value of a peer review is only as high as the clarity of the documentation exchanged. A service that helps engineering teams prepare design packages in a reviewer-ready format, and structures reviewer comments into actionable technical reports, increases review quality and reduces the back-and-forth that makes informal reviews inefficient."
    recurring: true

  - title: "Energy Access Design Knowledge Library"
    type: data-service
    revenue_model: "Annual subscription to energy access training programs, universities, and research agencies ($8,000–$20,000/year)"
    strategic_logic: "Aggregated peer review exchanges — anonymized design patterns, common failure modes, review recommendations by technology type — build a knowledge library of practical engineering guidance specific to sub-Saharan Africa's energy access context. This library is valuable for training programs, standard-setting bodies, and the next generation of energy engineers."
    recurring: true

story:
  title: "The Protection Gap"
  status: draft
  blog_slug: ""
  characters:
    - "Kwame — lead electrical engineer, Rwandan energy access company, five years of microgrid design and commissioning experience"
    - "Natalie — electrical engineer, Canadian renewable energy firm, specialized in battery-inverter protection coordination"
  summary: "A Rwandan energy engineer with a sophisticated 45 kW community microgrid design requests a peer protection coordination review — and an independent review identifies a fault current coordination gap that would have damaged all three inverters on the first grid fault event."
  body: |
    ## Act A — The Independent Eye

    Kwame has commissioned fourteen community microgrids in Rwanda over five years. He knows productive use load profiles. He knows how a grain mill, a cold storage unit, and a phone charging station interact on an AC bus over the course of a day. He knows which battery chemistries perform well in the temperature range of Rwanda's eastern province. He knows how to negotiate with communities about productive use load management.

    What every engineer knows is that the value of an independent technical review is not in catching things the designer doesn't know — it is in catching things the designer knows but has stopped seeing. Peer review works because a second set of eyes, reviewing a complete design for the first time, follows the fault paths and protection coordination sequences without the blind spots that come from having designed them.

    Peer review is standard in the developed-world energy engineering context. Design packages circulate internally and to external reviewers before commissioning. The question is whether that same standard is available to an energy engineer at a small company in Kigali who does not have a global firm's internal review infrastructure and cannot afford a consultancy engagement with a developed-country firm for every design he commissions.

    ---

    ## Act B — The Story

    **Kwame's** design for a 45 kW community system — three 15 kW inverter-chargers in parallel, a 120 kWh LiFePO4 battery bank, 54 kW of bifacial panels — was ready for commissioning. He had reviewed the protection coordination internally. He submitted the design package to the MarketForge peer review platform requesting an electrical protection coordination review specifically.

    His profile: Rwandan-context microgrid designer, 14 prior commissions, using Victron Quattro inverter-chargers in parallel with an ESS configuration.

    **Natalie** works at a Canadian firm that builds community and commercial microgrids. Her specific expertise is protection coordination on multi-inverter systems — the fault current paths, the breaker sizing cascade, the inverter-side protection settings. Her reviewer profile listed Victron parallel inverter protection coordination as a specific experience area.

    The platform matched Kwame's design request to Natalie's profile. She accepted the review engagement and received the design package.

    Her review identified a fault coordination gap: the DC breaker sizing on the battery bank connection to the inverters was specified at the inverter's maximum continuous current rating rather than at the short-circuit current withstand rating for a parallel three-inverter configuration. In a battery-side ground fault, the DC breakers would not clear before the inverters' internal protection tripped — the sequence would allow fault current to flow through the inverter electronics for an interval that exceeds the inverter's short-circuit current tolerance.

    Result: a battery-side ground fault would damage all three inverters simultaneously.

    Natalie's written review specified the corrected DC breaker sizing, explained the fault current path analysis, and noted the Victron technical bulletin that established the parallel configuration protection requirements.

    Kwame revised the design. The correction required replacing three breakers, at a parts cost of approximately $280.

    ---

    The system was commissioned eight weeks later. It has been operating without incident.

    A protection coordination failure on a 45 kW system with three Victron Quattros would have cost approximately $12,000 in inverter replacement plus the delay of several weeks of community energy access loss.

    ---

    ## Act C — Why This Market Stays Broken Without Infrastructure

    Natalie was willing to provide the review. She had done similar reviews informally for colleagues. She had never worked in Rwanda and had no context for Kwame's load profile choices — those were his expertise, not hers. Her specific contribution was fault current protection coordination on a Victron parallel configuration — a technical question with the same correct answer in Rwanda as in Canada.

    The barrier was discoverability in both directions: Kwame could not find Natalie, and Natalie had no mechanism to make her review availability visible to Kwame. The gap is not goodwill — it is infrastructure.

    [Thin market infrastructure](../../thin-markets.html) makes the review request specific enough to be matchable (protection coordination, Victron parallel, 3-inverter) and the reviewer profile specific enough to be trusted (not a generalist, an engineer with directly relevant experience). The match enables a knowledge exchange that is valuable in both directions — Natalie's review improves Kwame's system; Kwame's productive-use load data is context Natalie will carry into her next similar design.

    *Characters are fictional. Victron Quattro parallel inverter protection coordination requirements and LiFePO4 battery bank fault current characteristics are real. [DeeperPoint](../../marketforge.html) is building the infrastructure this story describes.*
