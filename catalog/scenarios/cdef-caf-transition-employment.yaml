market_example:
  summary: "A releasing CAF Avionics Systems Technician with 14 years of CF-18 airframe avionics experience and a Top Secret clearance is exactly the candidate a Canadian aerospace MRO needs — but the MRO's HR system can't parse 'AVS Tech 4' against any job classification it knows. The market matches releasing CAF members to employers who have been taught to read what those credentials actually mean."
  problem: "The Canadian Armed Forces releases approximately 8,000–10,000 members annually through voluntary release, medical release, and end of engagement. A significant portion are technical trades — Avionics Systems Technicians, Weapons Technicians, Marine Systems Engineers, Signals Intelligence Operators, Communications Research Operators, Electronic Warfare specialists, Vehicle Technicians — with years of hands-on platform maintenance, systems integration, and high-stakes operational experience that is worth significantly more to the right civilian employer than a standard trades ticket. The matching failure is bidirectional. On the member side: releasing trades often have no civilian credential equivalent for their military qualification, no LinkedIn presence because operational security discourages social media, and no mechanism to describe their clearance status to employers who might value it. On the employer side: aerospace MROs, defence contractors, critical infrastructure operators, and communications companies that would benefit enormously from a cleared, disciplined, technically trained candidate cannot decode the Military Occupational Classification system, don't know that 'AVS Tech 4' means fourteen years of fault-isolation on fly-by-wire avionics, and are not present at the SCAN (Second Career Assistance Network) seminars where CAF transition programming currently concentrates. The result is systematic underemployment of releasing technical trades and systematic under-recruitment by employers who would have competed aggressively for the same candidate if they had understood what they were looking at."
  dominant_forces:
    - "Credential translation opacity — CAF Military Occupational Classifications do not map directly to Red Seal trades, APEGA certifications, or civilian job titles; HR screening software eliminates military resumes before human review"
    - "Security clearance value invisibility — a releasing member with a TS/SCI clearance saves an employer 18–24 months and $50,000–$100,000 in clearance sponsorship; this value is invisible unless the employer knows to ask and the member knows to lead with it"
    - "Geographic mismatch — bases are concentrated in specific locations (Trenton, Petawawa, Cold Lake, Esquimalt, Gagetown) while the employers who most need military trades are in aerospace corridors (Montreal, Vancouver, Winnipeg) or defence industry clusters (Ottawa, Halifax)"
    - "Transition window failure — SCAN seminars and CAF transition centres operate on a six-month pre-release window; many members don't engage early enough, and the programming doesn't include structured industry matching"
    - "Operational security culture persistence — releasing members often understate classified experience, high-stakes operational roles, and leadership in ambiguous environments because they have been trained to discuss their work minimally"
  deeperpoint_fit: "MarketForge lists releasing CAF members using a structured military-to-civilian translation profile: MOC code, years of service, platform experience (specific aircraft, vessels, vehicle fleets, communication systems), clearance level currently held, and a structured competence description translated from military vocabulary to civilian equivalents by the platform's Knowledge Slot (which carries the complete civilian crosswalk for each MOC). Employers post positions with the military experience equivalents they would accept. The match surfaces candidates by clearance level, platform experience, and geographic flexibility — producing a structured match that survives HR screening."
  economic_upside: "8,000–10,000 releasing CAF members per year, of whom 30–40% are technical trades with civilian employment value that their current job search infrastructure systematically undersells. A placement platform operating at 500 confirmed placements per year at an average employer fee of $5,000 generates $2.5M in annual revenue. Veterans Affairs Canada, CFMWS (Canadian Forces Morale and Welfare Services), and provincial veterans employment programs all have mandates and budgets for releasing member employment support; an operationally effective platform commands funding from multiple sources simultaneously."

