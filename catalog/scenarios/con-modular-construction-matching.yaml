market_example:
  summary: "A mid-rise affordable housing developer needs prefabricated bathroom pod units for a 96-suite project — a precise dimensional specification driven by their structural grid — but cannot find a manufacturer within practical shipping distance whose pod modules fit the grid without expensive custom modifications. Three manufacturers fall just outside the dimensional range. One in Quebec could adapt their standard pod but doesn't know this project exists."
  problem: "Offsite and modular construction is growing rapidly in Canada, driven by housing affordability, labour shortages, and construction schedule requirements. But the market for prefabricated building components — bathroom pods, MEP modules, structural panels, kitchen units, mechanical room assemblies — is deeply fragmented. Each component manufacturer offers a catalog of standard sizes; each developer project has a structural grid that may or may not align with available standard sizes. The gap between a developer's exact dimensional requirement and the nearest standard module is routinely the barrier that pushes a project back to conventional on-site construction — more expensive, slower, and more dependent on scarce trades. No platform exists where a developer can specify their structural grid and dimensional constraints and discover which modular manufacturers can serve them — with or without modification — at what cost and within what delivery window."
  dominant_forces:
    - "Specification mismatch — developer structural grids rarely align perfectly with modular manufacturers' standard catalog dimensions"
    - "Opacity — modular manufacturers' custom modification capability and capacity window are not communicated through any catalog or directory"
    - "Geographic distance — shipping mass timber panels or large-format MEP modules across long distances degrades cost competitiveness and requires specialized transport"
    - "Trust deficit — a developer committing to modular components for a 96-suite project needs manufacturer quality system verification and delivery schedule certainty that catalog browsing cannot provide"
    - "Regulatory fragmentation — provincial building codes, engineer-of-record requirements, and third-party inspection protocols differ for modular components across provinces"
  deeperpoint_fit: "CommonContext holds the regulatory framework for modular construction in each province — factory certification requirements (CSA A277, provincial modular housing programs), engineer-of-record documentation requirements, third-party inspection protocols, and building code compliance pathways for modular assemblies. Semantic matching aligns the developer's dimensional specifications, code jurisdiction, structural system, and delivery window against the manufacturer's registered product catalog, custom modification capability, production schedule, and CSA/provincial certification status. The Generative Match Story delivers a component fit brief — explaining whether the manufacturer's standard catalog meets the developer's grid, what (if any) modifications would be required, and what the modification cost and schedule impact would be."
  economic_upside: "Canada's housing crisis has created a national policy imperative for offsite and modular construction at scale. The federal Housing Accelerator Fund and provincial housing programs are directing $10–20B in new residential construction investment, much of it oriented toward modular and factory-built housing. A matching platform enabling developers to discover modular component manufacturers that fit their project specifications — reducing the specification gap that pushes projects back to conventional construction — could redirect 5–10% of this investment volume to modular approaches, representing $500M–$2B in additional modular construction annually."

