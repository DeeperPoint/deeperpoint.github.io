market_example:
  summary: "Medical device startups, nutraceutical companies, and natural health product manufacturers seeking Health Canada or FDA clearance need regulatory technical writers who understand both the science and the specific submission format — a rare combination that referral networks consistently fail to surface before critical submission windows close."
  problem: "Regulatory submissions to Health Canada (medical devices, natural health products, food additives) and the FDA (510k, PMA, GRAS) require technical writing that is simultaneously scientifically accurate, legally precise, and formatted to submission-specific templates that change with each regulatory pathway. A PhD scientist can write accurate science but not a regulatory brief. A regulatory consultant can advise on strategy but not produce the 200-page technical dossier. A technical writer can format documents but cannot evaluate whether the clinical evidence is adequately contextualized. The submission-ready technical writer who can do all three — synthesize the scientific record, understand the regulatory pathway, and produce a document that meets submission format requirements — is a narrow subspecialty. Companies miss submission windows, receive Deficiency Letters, and pay for submission reconstruction because the technical writer they retained lacked the pathway-specific experience the agency expected."
  dominant_forces:
    - "Participant scarcity — regulatory technical writers with pathway-specific depth (510k vs PMA vs NHP monograph vs novel food) are a small population relative to the number of companies filing in any given year"
    - "Offering complexity — the right writer requires alignment on scientific domain, regulatory pathway, agency jurisdiction (Health Canada vs FDA vs dual-pathway), submission class, and current agency guideline version"
    - "Temporal specificity — submission windows are set by regulatory timelines; a missed window means a six-to-twelve-month delay before the next filing opportunity"
    - "Quality asymmetry — a technically deficient submission generates a Deficiency Letter that can reset the review clock by months, but the deficiency is not visible until the letter arrives"
    - "Opacity — pathway-specific technical writing experience is not legible from standard writer directories or even regulatory consultant firm websites, which describe services in generic terms"
  deeperpoint_fit: "Semantic matching encodes writer profiles (scientific domain by discipline, regulatory pathway by agency and submission class, submission format experience by document type, Deficiency Letter resolution experience, current agency guideline familiarity) against company demand signals (product type, regulatory pathway, scientific domain, submission class, agency jurisdiction, submission deadline). KnowledgeSlot can encode current agency guideline versions and pathway-specific format requirements as structured knowledge assets."
  economic_upside: "A medical device 510k clearance grants US market access worth $1M–$50M in first-year revenue depending on the device and indication. A Health Canada NHP licence enables a product launch worth $200,000–$5M in annual revenue. A Deficiency Letter response delay costs the company six to twelve months of market timing value. The technical writer fee ($15,000–$80,000 per submission) is a small fraction of the commercial value at stake — creating high willingness to pay for a matching platform that eliminates the wrong-pathway-experience failure mode."

