    recurring: true
story:
  title: The Subsea Sensor
  status: draft
  blog_slug: ''
  characters:
    - Erik - Offshore Operations Manager, Norwegian energy company
    - Dara - CTO, Halifax-based marine acoustics startup
  summary: A Norwegian offshore operator finds a specialized Canadian subsea acoustic positioning
    system through a technically structured discovery platform, bypassing a two-year dead-end
    search through conventional OEM channels.
  body: "## Act A \u2014 The Market Structure\n\nOcean technology procurement is among the most
    technically specialized buying processes in the world. An offshore operator doesn\u2019t simply
    need 'a sensor'—they need a sensor validated at a specific depth, rated for a specific thermal
    gradient, compatible with their existing communications bus, and proven in North Atlantic
    conditions. The companies that build these systems are usually small, their technical
    documentation lives in academic papers and specialized conference proceedings, and they have
    essentially no marketing infrastructure. Meanwhile, international buyers have no structured
    discovery mechanism beyond personal networks and a handful of industry trade shows.\n\n---\n\n##
    Act B \u2014 The Story\n\n**Erik** is specification-shopping for a passive acoustic positioning
    system for a new subsea gas field development in the Norwegian Sea. His requirements are
    specific: operational depth to 800m, accuracy better than 0.5m at 300m baseline separation,
    rated for -2°C bottom water temperature, compatible with Subsea7\u2019s standard communications
    protocol. His normal suppliers\u2014a Dutch OEM and a US defence contractor\u2014both quoted
    18-month lead times and systems not rated for sub-zero operating temperatures. He has been
    searching for six months.\n\n**Dara\u2019s** company built exactly this system for a NSERC-funded
    Arctic fisheries monitoring project three years ago. The system held 0.3m accuracy at 900m
    depth in -2°C water for a full operational season. She has filed two patents. The technology
    is production-ready. Erik has never heard of her company. She has never been to Norway.\n\n
    Erik\u2019s procurement team queries the platform with the technical specification. The system
    parses operational depth, temperature rating, accuracy requirement, and protocol compatibility
    against verified company capability profiles. Dara\u2019s system surfaces with three relevant
    operational references. The platform generates a structured technical introductory package
    and flags the dual-use export screening status as compliant. Erik\u2019s team reviews the
    operational reference data and requests a technical demonstration. Dara deploys a test system
    in comparable Norwegian conditions. The contract follows within four months.\n\n---\n\n## Act C \u2014
    Why This Market Stays Broken Without Infrastructure\n\nOceanTech companies cannot afford
    the international trade presence that their technology quality deserves. International buyers
    cannot discover niche capability through conference circuits and cold searches. DeeperPoint
    creates the structured, specification-searchable registry that puts Canadian ocean engineering
    excellence in front of the world\u2019s most demanding buyers.\n\n*Characters are fictional.
    The OceanTech discovery gap is real. DeeperPoint is building the infrastructure this story
    describes.*\n"
