market_example:
  summary: "A $140,000 CNC machining center sits under a tarp at the back of a factory in Stratford. A manufacturer in Windsor needs exactly that machine. Neither knows the other exists. Generic listing platforms cannot match on production capability — only on category and keyword."
  problem: "The secondary market for industrial CNC equipment and machine tools is profoundly opaque. Sellers list by model number on platforms like Machinio or EquipNet; buyers need machines that fit a specific set of production parameters — spindle speed, work envelope, tool changer capacity, control system compatibility, demonstrated tolerance capability. No keyword search resolves this. Buyers cannot evaluate condition from a photo and a model number. Sellers cannot reach the buyers who actually need their specific capability. Machines sit idle for years, losing value, while buyers either pay full price for new equipment or make do with poor fits. The information needed to match — operational history, CMM inspection data, maintenance records, actual production evidence — exists but is locked inside the seller's quality management system, inaccessible to any listing platform."
  dominant_forces:
    - "Opacity — seller's operational history (CMM data, maintenance logs, production records) is locked in internal systems and invisible to buyers"
    - "Search friction — buyers cannot determine whether a specific machine meets their production parameters from a model number and photo"
    - "Information asymmetry — buyers distrust seller condition claims; sellers cannot demonstrate the machine's proven capability"
    - "Deal complexity — rigging, inspection, freight, and service transfer require coordination neither party can easily provide"
    - "Geographic distance — buyer and seller are rarely co-located; a match in the same region requires aggregating enough inventory"
  deeperpoint_fit: "KnowledgeSlot ingests the machine's technical manual, maintenance history, CMM inspection reports, and SOPs — building a structured technical profile that captures not just designed capability but demonstrated, documented performance. Semantic matching aligns the extracted equipment profile against the buyer's production requirements (materials, tolerances, spindle speed, work envelope) — not keyword-to-keyword, but capability-to-requirement. The Generative Match Story delivers a capability match report: a side-by-side comparison with match/exceed/gap indicators for each production parameter. KnowledgeSlot also holds valuation benchmarks, inspection protocols, and logistics facilitator networks, enabling the platform to assemble a full transaction structure rather than just a lead."
  economic_upside: "Canada has an estimated $4–6 billion in idle or underutilized secondary industrial equipment at any given time. A functioning secondary market would reallocate billions in capital equipment more efficiently across the manufacturing base, reduce new-machine capital expenditure for growing SMBs by 40–60%, and accelerate production line commissioning timelines from months to weeks. Association sponsors (AMT, CME, provincial MEPs) can recover the cost of platform operation through transaction fees on equipment sales that currently happen through inefficient broker networks at 15–25% commission."

