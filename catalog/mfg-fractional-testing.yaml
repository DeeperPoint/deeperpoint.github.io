market_example:
  summary: "A fabrication shop in Sudbury needs a weld procedure qualification test before a rail contract closes. A college materials lab 300 km away has a certified universal testing machine sitting idle most of the week. Neither knows the other exists, and no directory lists institutional lab availability by specific test type and certification standard."
  problem: "Destructive testing for weld procedure qualification, material certification, and structural component validation requires certified equipment — universal tensile testers, Charpy impact pendulums, radiographic inspection, bend test fixtures — that most SMB fabricators cannot afford to own. This equipment sits in college materials labs, university research facilities, and independent testing houses at significant underutilization. But these institutions do not advertise test availability in channels that fabricators monitor, and fabricators do not know which facilities hold which certifications (ISO 17025, CWB, ASME) or have the specific test fixtures their procedure qualification requires. The result: shops source testing through word of mouth, travel hundreds of kilometres for a single test, or delay critical contracts while searching for a qualified lab."
  dominant_forces:
    - "Opacity — institutional labs (college, university, independent) do not advertise available capacity in channels fabricators use"
    - "Certification fragmentation — ISO 17025, CWB, ASME, CSA — different standards require different lab accreditations that buyers cannot easily verify"
    - "Search friction — no discovery mechanism exists for 'CWB-accredited lab with Charpy impact testing available this week within 200 km'"
    - "Geographic distance — shops in Northern Ontario, rural BC, or Atlantic provinces face extreme access barriers to any certified testing infrastructure"
    - "Temporal mismatch — labs have specific available windows; shops have contract-driven deadlines that create a scheduling matching problem"
  deeperpoint_fit: "KnowledgeSlot curates lab accreditations (ISO 17025 scope, CWB certification categories, ASME Section IX procedural requirements) and test fixture inventories — kept current as accreditation scopes are renewed. Semantic matching aligns the shop's WPS requirements (material grade, joint design, position, required test type) against lab capability and availability. The Generative Match Story explains to the fabricator what documentation the lab will provide and what the qualification procedure requires — reducing the cognitive barrier of navigating welding code requirements for the first time."
  economic_upside: "Canada has approximately 8,000 CWB-certified welding shops. A significant fraction require weld procedure qualification testing annually for new contracts or specification changes. At $400–$2,000 per qualification test sequence, the annual market for accessible, certified destructive testing services is $50–$100M. Institutional labs running their testing equipment at 20–30% utilization represent a massive latent supply asset that a matching platform could commercialize without capital investment."

