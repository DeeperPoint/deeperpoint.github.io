market_example:
  summary: "A Northern Ontario civil contractor has a late-model Komatsu PC490 excavator sitting idle after a mine reclamation job completes early. A road construction contractor in the Maritimes has been trying to source the same model excavator for six weeks — new is $850,000 with a 5-month delivery window. Neither knows the other exists, and IronPlanet won't auction regionally scarce equipment at the values a direct sale would achieve."
  problem: "The secondary market for heavy construction equipment shares the same structural failures as the CNC machine tools market but at larger scale and with additional complexity. Auction platforms (IronPlanet, Ritchie Bros.) clear large fleets but do not serve one-off transactions well — auction fees, reserve prices, and timeline constraints push sellers toward private sales. Private sales in heavy equipment rely almost entirely on dealer networks and word-of-mouth, which fail outside the seller's established trading region. Equipment specifications that determine fitness for purpose — undercarriage wear percentage, hydraulic hour meter, bucket size and configuration, cab option codes, telematics data — are dense technical data that no listing site can present in a form buyers can evaluate without extensive follow-up. A buyer in New Brunswick hunting a PC490 with a specific bucket configuration and undercarriage condition below 40% wear cannot determine this from a listing; they need a structured technical profile of the machine."
  dominant_forces:
    - "Opacity — technical condition data (undercarriage wear, hydraulic hours, telematics history) is locked in owner records and not surfaced by listing platforms"
    - "Search friction — construction equipment fitness depends on a combination of specification, condition, and configuration that keyword search cannot resolve"
    - "Geographic distance — Canada's construction markets are regionalized; direct seller-to-buyer transactions across regions require a matchmaker that personal networks don't provide"
    - "Volatility — heavy equipment values swing rapidly with commodity cycles, infrastructure program spending, and import costs; buyers and sellers lack a trusted reference for current private-sale values"
    - "Deal complexity — moving a 47-tonne excavator requires lowbed transport, import compliance (cross-provincial licensing, tax documentation), and sometimes financing bridge"
  deeperpoint_fit: "KnowledgeSlot holds the technical specification taxonomy for major heavy equipment categories (excavators by weight class, crane configurations, graders, scrapers, paving equipment) — including OEM telematics data protocols, undercarriage wear measurement standards, and maintenance interval documentation requirements. Semantic matching aligns the buyer's requirement (operating weight, bucket capacity, undercarriage condition, cab options, transport feasibility) against the seller's documented technical profile — extracted from telematics data, dealer service records, and OEM maintenance logs. The Generative Match Story delivers a condition match report that explains, in accessible terms, why the specific machine's telematics data, undercarriage condition, and maintenance history match the buyer's operational requirements."
  economic_upside: "Canada's heavy construction equipment fleet is valued at an estimated $35–45B, with 8–12% turning over annually through sales, trades, and retirements. Even a 5% improvement in private sale realization over auction clearing prices — driven by better buyer-seller matching — represents $140–$225M in annual seller value recovery. At a 2% facilitation fee, a platform capturing $5B in annual heavy equipment transactions would generate $100M in platform revenue."

